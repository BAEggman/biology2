<svg viewBox="0 0 960 880" role="img" aria-labelledby="td14 dd14"><title id="td14">멘델 확률판 — 네모 넷을 어떻게 세느냐</title><desc id="dd14">Pp와 Pp를 교배했을 때의 퍼넷 사각형 네 칸을 맨 위에 두고, 그 네 칸을 세는 방법을 아래에 늘어놓은 표다. 네 칸은 PP, Pp, Pp, pp이고 앞의 셋은 우성 표현형이라 청록, 마지막 하나만 열성이라 붉다. 그냥 세면 유전자형이 1대 2대 1, 표현형이 3대 1이다. 우성인 것만 모아 세면 분모가 넷이 아니라 셋이 되어 동형이 3분의 1, 이형이 3분의 2가 된다. 아이가 여럿이면 곱셈 법칙을 쓰고, 적어도 한 명을 물으면 전체에서 빼는 여집합을 쓴다. 맨 아래에는 AA와 aa, Aa와 aa 교배의 결과를 함께 실었다.</desc><rect x="0" y="0" width="960" height="880" fill="#FFFFFF"/><text x="480" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#374151">멘델 확률판 — 네모 넷을 어떻게 세느냐</text><text x="480" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7280">★ 이 단원의 확률 문항은 전부 이 네 칸에서 나온다. 세는 방법만 다르다</text><text x="24" y="86" text-anchor="start" font-size="12.5" font-weight="700" fill="#9CA3AF">① Pp × Pp 의 네 칸</text><text x="188" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#6B7280">P</text><text x="272" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#6B7280">p</text><text x="88" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#6B7280">P</text><text x="88" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#6B7280">p</text><rect x="146" y="104" width="84" height="84" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.6"/><text x="188" y="153" text-anchor="middle" font-size="20" font-weight="700" fill="#115E59">PP</text><rect x="230" y="104" width="84" height="84" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.6"/><text x="272" y="153" text-anchor="middle" font-size="20" font-weight="700" fill="#115E59">Pp</text><rect x="146" y="188" width="84" height="84" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.6"/><text x="188" y="237" text-anchor="middle" font-size="20" font-weight="700" fill="#115E59">Pp</text><rect x="230" y="188" width="84" height="84" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="272" y="237" text-anchor="middle" font-size="20" font-weight="700" fill="#991B1B">pp</text><text x="230" y="298" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">유전자형 1 : 2 : 1 · 표현형 3 : 1</text><rect x="370" y="96" width="566" height="200" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="384" y="120" text-anchor="start" font-size="12" font-weight="700" fill="#9CA3AF">② 같은 네 칸을 세 가지로 센다 — 분모가 무엇이냐가 전부다</text><text x="384" y="148" text-anchor="start" font-size="11" font-weight="700" fill="#6B7280">네 칸을 그냥 센다</text><text x="640" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">PP는 한 칸</text><text x="910" y="148" text-anchor="end" font-size="13" font-weight="700" fill="#115E59">1/4</text><text x="640" y="169" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">Pp는 두 칸</text><text x="910" y="169" text-anchor="end" font-size="13" font-weight="700" fill="#115E59">1/2</text><text x="640" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">pp는 한 칸</text><text x="910" y="190" text-anchor="end" font-size="13" font-weight="700" fill="#991B1B">1/4</text><text x="384" y="211" text-anchor="start" font-size="11" font-weight="700" fill="#6B7280">표현형으로 묶는다</text><text x="640" y="211" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">청록 세 칸이 우성</text><text x="910" y="211" text-anchor="end" font-size="13" font-weight="700" fill="#115E59">3/4</text><text x="640" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">붉은 한 칸이 열성</text><text x="910" y="232" text-anchor="end" font-size="13" font-weight="700" fill="#991B1B">1/4</text><text x="384" y="253" text-anchor="start" font-size="11" font-weight="700" fill="#6B7280">★ 우성인 것만 모아 센다</text><text x="640" y="253" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">분모가 4가 아니라 3이 된다 — 동형</text><text x="910" y="253" text-anchor="end" font-size="13" font-weight="700" fill="#92400E">1/3</text><text x="640" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">같은 분모 3에서 — 이형</text><text x="910" y="274" text-anchor="end" font-size="13" font-weight="700" fill="#92400E">2/3</text><text x="24" y="320" text-anchor="start" font-size="12.5" font-weight="700" fill="#9CA3AF">③ 아이가 여럿이면 — 곱셈 법칙, 그리고 여집합</text><rect x="24" y="332" width="912" height="176" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="48" y="364" text-anchor="start" font-size="11" font-weight="700" fill="#374151">두 사건이 모두 일어난다</text><text x="600" y="364" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">곱셈 법칙 — 각각의 확률을 곱한다</text><text x="48" y="385" text-anchor="start" font-size="11" font-weight="700" fill="#374151">서로 배타적인 것 중 하나</text><text x="600" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">덧셈 법칙 — 각각의 확률을 더한다</text><text x="48" y="406" text-anchor="start" font-size="11" font-weight="700" fill="#374151">Aa × Aa 에서 아이 하나가 열성</text><text x="600" y="406" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">1/4</text><text x="910" y="406" text-anchor="end" font-size="13" font-weight="700" fill="#92400E">1/4</text><text x="48" y="427" text-anchor="start" font-size="11" font-weight="700" fill="#374151">아이 둘 다 열성</text><text x="600" y="427" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">1/4 × 1/4</text><text x="910" y="427" text-anchor="end" font-size="13" font-weight="700" fill="#92400E">1/16</text><text x="48" y="448" text-anchor="start" font-size="11" font-weight="700" fill="#374151">아이 둘 중 하나만 열성</text><text x="600" y="448" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">(1/4 × 3/4) 를 두 가지 순서로</text><text x="910" y="448" text-anchor="end" font-size="13" font-weight="700" fill="#92400E">3/8</text><text x="48" y="469" text-anchor="start" font-size="11" font-weight="700" fill="#374151">아이 셋 다 우성</text><text x="600" y="469" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">3/4 × 3/4 × 3/4</text><text x="910" y="469" text-anchor="end" font-size="13" font-weight="700" fill="#92400E">27/64</text><text x="48" y="490" text-anchor="start" font-size="11" font-weight="700" fill="#374151">★ 적어도 한 명이 열성</text><text x="600" y="490" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">1 에서 「아무도 아님」을 뺀다 — 여집합이 빠르다</text><text x="24" y="528" text-anchor="start" font-size="12.5" font-weight="700" fill="#9CA3AF">④ 다른 교배 — 네 칸이 어떻게 달라지나</text><rect x="24" y="540" width="912" height="128" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="48" y="572" text-anchor="start" font-size="11" font-weight="700" fill="#374151">AA × aa (우성 순종 × 열성 순종)</text><text x="470" y="572" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">네 칸이 모두 Aa</text><text x="910" y="572" text-anchor="end" font-size="11" font-weight="700" fill="#92400E">유전자형 모두 이형 · 표현형 모두 우성</text><text x="48" y="594" text-anchor="start" font-size="11" font-weight="700" fill="#374151">그 F1 을 자가교배하면</text><text x="470" y="594" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">Aa × Aa 로 돌아온다</text><text x="910" y="594" text-anchor="end" font-size="11" font-weight="700" fill="#92400E">위 ①의 네 칸 그대로 — 3 : 1</text><text x="48" y="616" text-anchor="start" font-size="11" font-weight="700" fill="#374151">Aa × aa (검정교배)</text><text x="470" y="616" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">네 칸이 Aa · Aa · aa · aa</text><text x="910" y="616" text-anchor="end" font-size="11" font-weight="700" fill="#92400E">표현형 1 : 1</text><text x="48" y="638" text-anchor="start" font-size="11" font-weight="700" fill="#374151">★ 검정교배가 유전자형을 드러내는 이유</text><text x="470" y="638" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">상대가 aa라 자기 것을 못 가린다</text><text x="910" y="638" text-anchor="end" font-size="11" font-weight="700" fill="#92400E">자손에 열성이 하나라도 나오면 이형</text><rect x="24" y="690" width="912" height="116" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="480" y="716" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">★ 시험이 가장 자주 꼬는 자리 — 분모가 3이 되는 순간</text><text x="480" y="742" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">「보인자 부부의 자녀가 정상일 때 그 아이가 보인자일 확률」은 1/2 이 아니라 2/3 다</text><text x="480" y="766" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">이미 「정상이다」를 알고 있으니 붉은 칸 하나는 후보에서 빠진다 — 남은 세 칸 중 이형이 둘이다</text><text x="480" y="788" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">aa 가 아닌 형제자매가 보인자일 확률이 2/3 인 것도 같은 셈이다</text><line x1="14" y1="838" x2="946" y2="838" stroke="#E5E7EB" stroke-width="1.3"/><text x="480" y="864" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">★ 확률 문제를 보면 분모부터 정한다 — 네 칸 전부냐, 조건이 붙어 셋이냐</text></svg>