<svg viewBox="0 0 960 900" role="img" aria-labelledby="td13 dd13"><title id="td13">비분리 도해 — 정상 배우자를 세면 감수 I인지 II인지 갈린다</title><desc id="dd13">상동염색체 한 쌍만 가진 세포에서 감수분열을 세 갈래로 그린 표다. 왼쪽은 정상이라 배우자 넷이 모두 정상이고, 가운데는 감수 I에서 상동염색체 둘이 한쪽으로 몰려 정상 배우자가 하나도 없으며, 오른쪽은 감수 II에서 자매염색분체가 안 갈려 정상 배우자가 둘 남는다. 파랑은 아버지 쪽 상동염색체, 주황은 어머니 쪽이다. 염색체 하나마다 동원체 원이 하나씩 있어 그 원을 세면 염색체 수가 나온다. 맨 아래에는 염색체가 하나 많은 칸과 하나 적은 칸이 각각 어떤 결과를 낳는지 적혀 있다.</desc><rect x="0" y="0" width="960" height="900" fill="#FFFFFF"/><text x="480" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#374151">비분리 — 정상 배우자를 세면 갈린다</text><text x="480" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7280">★ 정상이 하나도 없으면 감수 I · 둘이면 감수 II. 이 한 줄이 전부다</text><rect x="24" y="64" width="912" height="40" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/><rect x="44" y="72" width="8" height="24" rx="4" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.6"/><circle cx="48" cy="84" r="4.6" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.4"/><text x="64" y="89" text-anchor="start" font-size="11" font-weight="700" fill="#6B7280">아버지 쪽 상동염색체</text><rect x="326" y="72" width="8" height="24" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><circle cx="330" cy="84" r="4.6" fill="#C2410C" stroke="#FFFFFF" stroke-width="1.4"/><text x="346" y="89" text-anchor="start" font-size="11" font-weight="700" fill="#6B7280">어머니 쪽 상동염색체</text><circle cx="620" cy="84" r="4.6" fill="#374151" stroke="#FFFFFF" stroke-width="1.4"/><text x="634" y="89" text-anchor="start" font-size="11" font-weight="700" fill="#6B7280">동원체 — 원 하나가 염색체 하나다(분체가 둘이어도)</text><rect x="24" y="116" width="288" height="40" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.6"/><text x="168" y="141" text-anchor="middle" font-size="13" font-weight="700" fill="#115E59">① 정상 감수분열</text><text x="168" y="174" text-anchor="middle" font-size="10" font-weight="700" fill="#9CA3AF">상동염색체도 자매염색분체도 제때 갈렸다</text><text x="168" y="196" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">모세포 (2n = 2, 복제 끝)</text><rect x="93" y="202" width="150" height="82" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="144.5" y="214" width="8" height="58" rx="4" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.6"/><rect x="157.5" y="214" width="8" height="58" rx="4" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.6"/><circle cx="155" cy="243" r="4.6" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.4"/><rect x="170.5" y="214" width="8" height="58" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><rect x="183.5" y="214" width="8" height="58" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><circle cx="181" cy="243" r="4.6" fill="#C2410C" stroke="#FFFFFF" stroke-width="1.4"/><text x="168" y="306" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">감수 I 뒤 — 세포 둘</text><rect x="41" y="312" width="118" height="82" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="89.5" y="324" width="8" height="58" rx="4" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.6"/><rect x="102.5" y="324" width="8" height="58" rx="4" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.6"/><circle cx="100" cy="353" r="4.6" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.4"/><rect x="177" y="312" width="118" height="82" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="225.5" y="324" width="8" height="58" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><rect x="238.5" y="324" width="8" height="58" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><circle cx="236" cy="353" r="4.6" fill="#C2410C" stroke="#FFFFFF" stroke-width="1.4"/><text x="168" y="416" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">감수 II 뒤 — 배우자 넷</text><rect x="32" y="422" width="62" height="74" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="59" y="434" width="8" height="50" rx="4" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.6"/><circle cx="63" cy="459" r="4.6" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.4"/><text x="63" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#115E59">n</text><rect x="102" y="422" width="62" height="74" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="129" y="434" width="8" height="50" rx="4" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.6"/><circle cx="133" cy="459" r="4.6" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.4"/><text x="133" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#115E59">n</text><rect x="172" y="422" width="62" height="74" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="199" y="434" width="8" height="50" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><circle cx="203" cy="459" r="4.6" fill="#C2410C" stroke="#FFFFFF" stroke-width="1.4"/><text x="203" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#115E59">n</text><rect x="242" y="422" width="62" height="74" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="269" y="434" width="8" height="50" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><circle cx="273" cy="459" r="4.6" fill="#C2410C" stroke="#FFFFFF" stroke-width="1.4"/><text x="273" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#115E59">n</text><rect x="48" y="524" width="240" height="46" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.6"/><text x="168" y="553" text-anchor="middle" font-size="14" font-weight="700" fill="#115E59">정상 배우자 4개</text><rect x="336" y="116" width="288" height="40" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="480" y="141" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">② 감수 I 비분리</text><text x="480" y="174" text-anchor="middle" font-size="10" font-weight="700" fill="#9CA3AF">I에서 상동염색체 둘이 한쪽으로 몰렸다</text><text x="480" y="196" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">모세포 (2n = 2, 복제 끝)</text><rect x="405" y="202" width="150" height="82" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="456.5" y="214" width="8" height="58" rx="4" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.6"/><rect x="469.5" y="214" width="8" height="58" rx="4" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.6"/><circle cx="467" cy="243" r="4.6" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.4"/><rect x="482.5" y="214" width="8" height="58" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><rect x="495.5" y="214" width="8" height="58" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><circle cx="493" cy="243" r="4.6" fill="#C2410C" stroke="#FFFFFF" stroke-width="1.4"/><text x="480" y="306" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">감수 I 뒤 — 세포 둘</text><rect x="353" y="312" width="118" height="82" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="388.5" y="324" width="8" height="58" rx="4" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.6"/><rect x="401.5" y="324" width="8" height="58" rx="4" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.6"/><circle cx="399" cy="353" r="4.6" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.4"/><rect x="414.5" y="324" width="8" height="58" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><rect x="427.5" y="324" width="8" height="58" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><circle cx="425" cy="353" r="4.6" fill="#C2410C" stroke="#FFFFFF" stroke-width="1.4"/><rect x="489" y="312" width="118" height="82" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="548" y="357" text-anchor="middle" font-size="11" font-weight="700" fill="#9CA3AF">안 받았다</text><text x="480" y="416" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">감수 II 뒤 — 배우자 넷</text><rect x="344" y="422" width="62" height="74" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="360" y="434" width="8" he