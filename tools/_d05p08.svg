nt-size="13" font-weight="700" fill="#92400E">③ 감수 II 비분리</text><text x="792" y="174" text-anchor="middle" font-size="10" font-weight="700" fill="#9CA3AF">I은 정상 · II에서 자매염색분체가 안 갈렸다</text><text x="792" y="196" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">모세포 (2n = 2, 복제 끝)</text><rect x="717" y="202" width="150" height="82" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="768.5" y="214" width="8" height="58" rx="4" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.6"/><rect x="781.5" y="214" width="8" height="58" rx="4" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.6"/><circle cx="779" cy="243" r="4.6" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.4"/><rect x="794.5" y="214" width="8" height="58" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><rect x="807.5" y="214" width="8" height="58" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><circle cx="805" cy="243" r="4.6" fill="#C2410C" stroke="#FFFFFF" stroke-width="1.4"/><text x="792" y="306" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">감수 I 뒤 — 세포 둘</text><rect x="665" y="312" width="118" height="82" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="713.5" y="324" width="8" height="58" rx="4" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.6"/><rect x="726.5" y="324" width="8" height="58" rx="4" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.6"/><circle cx="724" cy="353" r="4.6" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.4"/><rect x="801" y="312" width="118" height="82" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="849.5" y="324" width="8" height="58" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><rect x="862.5" y="324" width="8" height="58" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><circle cx="860" cy="353" r="4.6" fill="#C2410C" stroke="#FFFFFF" stroke-width="1.4"/><text x="792" y="416" text-anchor="middle" font-size="10.5" font-weight="700" fill