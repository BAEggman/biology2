9CA3AF">★ n+1 칸을 열어 보면 색이 다르다 — 여기서도 I과 II가 갈린다</text><rect x="24" y="616" width="912" height="96" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="146" y="636" width="8" height="56" rx="4" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.6"/><circle cx="150" cy="664" r="4.6" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.4"/><rect x="172" y="636" width="8" height="56" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><circle cx="176" cy="664" r="4.6" fill="#C2410C" stroke="#FFFFFF" stroke-width="1.4"/><text x="163" y="706" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">파랑 + 주황</text><text x="210" y="652" text-anchor="start" font-size="12" font-weight="700" fill="#991B1B">감수 I 비분리의 n+1</text><text x="210" y="672" text-anchor="start" font-size="11" font-weight="700" fill="#6B7280">서로 다른 상동염색체 둘이 함께 들어갔다</text><line x1="480" y1="628" x2="480" y2="700" stroke="#E5E7EB" stroke-width="1.2"/><rect x="566" y="636" width="8" height="56" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><circle cx="570" cy="664" r="4.6" fill="#C2410C" stroke="#FFFFFF" stroke-width="1.4"/><rect x="592" y="636" width="8" height="56" rx="4" fill="#FED7AA" stroke="#C2410C" stroke-width="1.6"/><circle cx="596" cy="664" r="4.6" fill="#C2410C" stroke="#FFFFFF" stroke-width="1.4"/><text x="583" y="706" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">주황 + 주황</text><text x="630" y="652" text-anchor="start" font-size="12" font-weight="700" fill="#92400E">감수 II 비분리의 n+1</text><text x="630" y="672" text-anchor="start" font-size="11" font-weight="700" fill="#6B7280">같은 염색체의 자매염색분체 둘이 함께 들어갔다</text><text x="24" y="740" text-anchor="start" font-size="12.5" font-weight="700" fill="#9CA3AF">그 배우자가 수정되면 — 많아도 적어도 탈이 난다</text><rect x="24" y="750" width="912" height="96" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="44" y="766" width="424" height="64" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/><text x="256" y="790" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400E">n+1 → 3염색체성(2n+1)</text><text x="256" y="814" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">살아남기도 하지만 유전자 용량이 어긋나 표현형 이상이 생긴다</text><rect x="492" y="766" width="424" height="64" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="704" y="790" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991B1B">n−1 → 1염색체성(2n−1)</text><text x="704" y="814" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">필수 유전자 수가 모자라 정상 발달이 어려워 대개 치명적이다</text><line x1="14" y1="866" x2="946" y2="866" stroke="#E5E7EB" stroke-width="1.3"/><text x="480" y="888" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">★ 문제를 보면 배우자 넷 중 정상을 먼저 센다 — 0이면 I, 2면 II다</text></svg>