<svg viewBox="0 0 960 828" role="img" aria-labelledby="td09 dd09"><title id="td09">요소와 요산을 구간마다 어떻게 다루는가</title><desc id="dd09">네프론을 지나는 순서대로 사구체, 근위세뇨관, 얇은 하행각, 안쪽 수질 집합관 네 구간을 가로로 늘어놓고, 요소와 요산이 각 구간에서 어떻게 다루어지는지를 두 줄로 적은 표다. 요소는 네 구간에서 모두 무슨 일인가가 일어나고, 요산은 사구체와 근위세뇨관 두 곳에서만 일이 일어나며 근위세뇨관 칸만 재흡수와 분비가 함께 일어난다. 아래에는 되찾는 방식을 능동과 수동 둘로 갈라 각각에 해당하는 물질을 적었고, 요산은 수동 쪽에 있다. 맨 아래 한 줄은 되돌아오는 것이 요소뿐이며 그것이 가장 진한 오줌을 만든다는 것이다.</desc><text x="480" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">요소와 요산 — 같은 길을 지나는데 구간마다 다르게 다룬다</text><line x1="24" y1="48" x2="936" y2="48" stroke="#E5E7EB" stroke-width="1.3"/><text x="30" y="94" text-anchor="start" font-size="11.5" font-weight="700" fill="#6B7280">지나는 차례</text><rect x="168" y="66" width="186" height="44" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4"/><text x="261" y="87" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">사구체</text><text x="261" y="102" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9CA3AF">1</text><path d="M355 88 L360 88" stroke="#9CA3AF" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="362" y="66" width="186" height="44" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4"/><text x="455" y="87" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">근위세뇨관</text><text x="455" y="102" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9CA3AF">2</text><path d="M549 88 L554 88" stroke="#9CA3AF" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="556" y="66" width="186" height="44" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4"/><text x="649" y="87" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">얇은 하행각</text><text x="649" y="102" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9CA3AF">3</text><path d="M743 88 L748 88" stroke="#9CA3AF" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="750" y="66" width="186" height="44" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4"/><text x="843" y="87" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">안쪽 수질 집합관</text><text x="843" y="102" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9CA3AF">4</text><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#9CA3AF"/></marker></defs><rect x="24" y="132" width="128" height="118" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="88" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">요소</text><text x="88" y="188" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400E">펴서 깔린 요</text><text x="88" y="208" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">네 칸이</text><text x="88" y="224" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">모두 찬다</text><rect x="168" y="132" width="186" height="118" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text x="261" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">그냥 걸러진다</text><text x="261" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">작고 자유로워</text><text x="261" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">막는 것이 없다</text><rect x="362" y="132" width="186" height="118" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text x="455" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">물이 먼저 빠져</text><text x="455" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">농도가 오르면</text><text x="455" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">따라 나간다 — 수동</text><rect x="556" y="132" width="186" height="118" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text x="649" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">일부만</text><text x="649" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">수동으로</text><text x="649" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">든다</text><rect x="750" y="132" width="186" height="118" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text x="843" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">나갔다가</text><text x="843" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">헨레를 거쳐</text><text x="843" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">도로 들어온다</text><text x="843" y="238" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">★ 재순환</text><rect x="24" y="268" width="128" height="108" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/><text x="88" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">요산</text><text x="88" y="322" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">접어 쌓은 요</text><text x="88" y="342" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">두 칸만</text><text x="88" y="358" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">찬다</text><rect x="168" y="268" width="186" height="108" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.4"/><text x="261" y="328" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">그냥 걸러진다</text><rect x="362" y="268" width="186" height="108" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="455" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">되찾기도 하고</text><text x="455" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">내보내기도 한다</text><text x="455" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">★ 둘 다 일어난다</text><rect x="556" y="268" width="186" height="108" rx="8" fill="#FBFBFA" stroke="#E5E7EB" stroke-width="1.2"/><text x="649" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#9CA3AF">따로 말하지 않는다</text><rect x="750" y="268" width="186" height="108" rx="8" fill="#FBFBFA" stroke="#E5E7EB" stroke-width="1.2"/><text x="843" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#9CA3AF">따로 말하지 않는다</text><text x="30" y="422" text-anchor="start" font-size="11.5" font-weight="700" fill="#6B7280">되찾는 방식</text><rect x="24" y="436" width="448" height="128" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.6"/><text x="248" y="464" text-anchor="middle" font-size="14" font-weight="700" fill="#115E59">밀어 올린다 — 능동</text><text x="248" y="490" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">포도당 · 아미노산</text><text x="248" y="514" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">나트륨 · 칼륨</text><text x="248" y="542" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">값을 치러야 거슬러 올릴 수 있다</text><rect x="488" y="436" width="448" height="128" rx="8" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.6"/><text x="712" y="464" text-anchor="middle" font-size="14" font-weight="700" fill="#3730A3">따라 흐른다 — 수동</text><text x="712" y="490" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">중탄산염 · 염화 이온 · 물</text><text x="712" y="514" text-anchor="middle" font-size="13" font-weight="700" fill="#3730A3">그리고 요산</text><text x="712" y="542" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">기울기가 나면 저절로 따라간다</text><rect x="24" y="592" width="912" height="96" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="480" y="620" text-anchor="middle" font-size="14" font-weight="700" fill="#991B1B">★ 되돌아오는 것은 요소뿐이다</text><text x="480" y="646" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">나간 요소가 헨레로 되돌아와 안쪽 수질을 짜게 만들고, 그 짠 벽이 물을 더 끌어낸다</text><text x="480" y="670" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7280">오래 목마를수록 이 되돌이가 커진다 — 가장 진한 오줌은 이렇게 만들어진다</text><rect x="24" y="706" width="912" height="76" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4"/><text x="480" y="736" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">한 줄로 — 요소는 네 구간 다 손을 타고, 요산은 근위에서만 둘 다 겪는다</text><text x="480" y="762" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7280">두 물건은 같은 「요」인데 펴면 요소이고 접어 쌓으면 요산이다 (44-5)</text><line x1="14" y1="796" x2="946" y2="796" stroke="#E5E7EB" stroke-width="1.3"/><text x="480" y="816" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">구간을 가로로 놓아야 「같은 물질이 구간마다 다르다」가 보인다</text></svg>