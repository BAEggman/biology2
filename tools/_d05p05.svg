e" font-size="11.5" font-weight="700" fill="#374151">★ 색 띠의 순서와 개수만 보면 넷이 갈린다 — 빠짐(결실) · 겹침(중복) · 거꾸로(역위) · 남의 것(전좌)</text><text x="440" y="790" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">전좌만 다른 색이 섞인다 — 나머지 셋은 같은 염색체 안에서 벌어진 일이다</text></svg>