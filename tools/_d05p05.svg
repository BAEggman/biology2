<svg viewBox="0 0 880 812" role="img" aria-labelledby="td9 dd9"><title id="td9">비분리와 염색체 이상 — 정상 배우자가 남느냐가 둘을 가른다</title><desc id="dd9">위 두 칸은 감수 1분열 비분리와 감수 2분열 비분리를 나란히 놓은 것이다. 각 칸에서 어버이 세포의 상동 한 쌍을 파랑과 주황 막대로 그리고, 아래에 만들어진 배우자 넷을 늘어놓았다. 1분열 비분리는 네 배우자가 모두 비정상이라 n+1이 둘, n-1이 둘이고, 2분열 비분리는 정상 배우자가 둘 남아 n, n, n+1, n-1이 된다. 가운데 띠는 하나 모자란 1염색체성과 하나 더 많은 3염색체성을 견주고, 아래 띠는 결실·중복·역위·전좌 네 가지를 같은 막대에 대고 보인다.</desc><defs><marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/></marker></defs><rect x="22" y="66" width="416" height="300" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="230" y="34" text-anchor="middle" font-size="14.5" font-weight="700" fill="#374151">감수 1분열 비분리</text><text x="230" y="54" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">상동염색체 한 쌍이 통째로 한쪽으로 간다</text><text x="230" y="92" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9CA3AF">어버이 세포 (2n)</text><rect x="201.5" y="107" width="9" height="30" rx="4" fill="#60A5FA" stroke="#1E40AF" stroke-width="1.4"/><rect x="217.5" y="107" width="9" height="30" rx="4" fill="#60A5FA" stroke="#1E40AF" stroke-width="1.4"/><rect x="233.5" y="107" width="9" height="30" rx="4" fill="#FB923C" stroke="#C2410C" stroke-width="1.4"/><rect x="249.5" y="107" width="9" height="30" rx="4" fill="#FB923C" stroke="#C2410C" stroke-width="1.4"/><path d="M230 142 L230 160" stroke="#9CA3AF" stroke-width="1.6" fill="none" marker-end="url(#a5)"/><text x="230" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">1분열에서 상동이 안 갈린다</text><rect x="51" y="215" width="74" height="70" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="2"/><rect x="76" y="231" width="9" height="26" rx="4" fill="#60A5FA" stroke="#1E40AF" stroke-width="1.4"/><rect x="91" y="231" width="9" height="26" rx="4" fill="#FB923C" stroke="#C2410C" stroke-width="1.4"/><text x="88" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">n+1</text><rect x="143" y="215" width="74" height="70" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="2"/><rect x="168" y="231" width="9" height="26" rx="4" fill="#60A5FA" stroke="#1E40AF" stroke-width="1.4"/><rect x="183" y="231" width="9" height="26" rx="4" fill="#FB923C" stroke="#C2410C" stroke-width="1.4"/><text x="180" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">n+1</text><rect x="235" y="215" width="74" height="70" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="2"/><text x="272" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">n-1</text><rect x="327" y="215" width="74" height="70" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="2"/><text x="364" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">n-1</text><text x="230" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">★ 네 배우자가 전부 비정상 — 정상이 하나도 없다</text><rect x="442" y="66" width="416" height="300" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="650" y="34" text-anchor="middle" font-size="14.5" font-weight="700" fill="#374151">감수 2분열 비분리</text><text x="650" y="54" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">자매염색분체가 안 갈린다</text><text x="650" y="92" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9CA3AF">어버이 세포 (2n)</text><rect x="621.5" y="107" width="9" height="30" rx="4" fill="#60A5FA" stroke="#1E40AF" stroke-width="1.4"/><rect x="637.5" y="107" width="9" height="30" rx="4" fill="#60A5FA" stroke="#1E40AF" stroke-width="1.4"/><rect x="653.5" y="107" width="9" height="30" rx="4" fill="#FB923C" stroke="#C2410C" stroke-width="1.4"/><rect x="669.5" y="107" width="9" height="30" rx="4" fill="#FB923C" stroke="#C2410C" stroke-width="1.4"/><path d="M650 142 L650 160" stroke="#9CA3AF" stroke-width="1.6" fill="none" marker-end="url(#a5)"/><text x="650" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">1분열은 정상, 2분열에서 자매가 안 갈린다</text><rect x="471" y="215" width="74" height="70" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/><rect x="503.5" y="231" width="9" height="26" rx="4" fill="#60A5FA" stroke="#1E40AF" stroke-width="1.4"/><text x="508" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#115E59">n</text><rect x="563" y="215" width="74" height="70" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/><rect x="595.5" y="231" width="9" height="26" rx="4" fill="#FB923C" stroke="#C2410C" stroke-width="1.4"/><text x="600" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#115E59">n</text><rect x="655" y="215" width="74" height="70" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="2"/><rect x="680" y="231" width="9" height="26" rx="4" fill="#60A5FA" stroke="#1E40AF" stroke-width="1.4"/><rect x="695" y="231" width="9" height="26" rx="4" fill="#60A5FA" stroke="#1E40AF" stroke-width="1.4"/><text x="692" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">n+1</text><rect x="747" y="215" width="74" height="70" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="2"/><text x="784" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">n-1</text><text x="650" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">★ 정상 배우자가 둘 남는다</text><line x1="14" y1="386" x2="866" y2="386" stroke="#E5E7EB" stroke-width="1.3"/><text x="14" y="412" text-anchor="start" font-size="12" font-weight="700" fill="#9CA3AF">이수성 — 정상 배수에서 벗어난 상태</text><rect x="22" y="428" width="272" height="128" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.4"/><text x="158" y="452" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7280">하나 모자람</text><rect x="153.5" y="468" width="9" height="28" rx="4" fill="#60A5FA" stroke="#1E40AF" stroke-width="1.4"/><text x="158" y="518" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412">1염색체성</text><text x="158" y="538" text-anchor="middle" font-size="10" font-weight="700" fill="#6B7280">성염색체 1염색체성 = 터너 (X 하나만)</text><rect x="306" y="428" width="272" height="128" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.4"/><text x="442" y="452" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7280">정상</text><rect x="429.5" y="468" width="9" height="28" rx="4" fill="#60A5FA" stroke="#1E40AF" stroke-width="1.4"/><rect x="445.5" y="468" width="9" height="28" rx="4" fill="#60A5FA" stroke="#1E40AF" stroke-width="1.4"/><text x="442" y="518" text-anchor="middle" font-size="13" font-weight="700" fill="#115E59">2개</text><text x="442" y="538" text-anchor="middle" font-size="10" font-weight="700" fill="#6B7280">기준</text><rect x="590" y="428" width="272" height="128" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.4"/><text x="726" y="452" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7280">하나 더 많음</text><rect x="705.5" y="468" width="9" height="28" rx="4" fill="#60A5FA" stroke="#1E40AF" stroke-width="1.4"/><rect x="721.5" y="468" width="9" height="28" rx="4" fill="#60A5FA" stroke="#1E40AF" stroke-width="1.4"/><rect x="737.5" y="468" width="9" height="28" rx="4" fill="#60A5FA" stroke="#1E40AF" stroke-width="1.4"/><text x="726" y="518" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412">3염색체성</text><text x="726" y="538" text-anchor="middle" font-size="10" font-weight="700" fill="#6B7280">21번 3염색체성 = 다운</text><text x="726" y="554" text-anchor="middle" font-size="10" font-weight="700" fill="#6B7280">성염색체 3염색체성 = 클라인펠터</text><line x1="14" y1="576" x2="866" y2="576" stroke="#E5E7EB" stroke-width="1.3"/><text x="14" y="602" text-anchor="start" font-size="12" font-weight="700" fill="#9CA3AF">구조 이상 넷 — 같은 막대를 어떻게 건드렸나</text><rect x="22" y="618" width="200" height="122" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/><text x="122" y="642" text-anchor="middle" font-si