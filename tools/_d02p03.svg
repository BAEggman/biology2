<svg viewBox="0 0 880 502" role="img" aria-labelledby="t6 d6d">
    <title id="t6">정자 형성과 난자 형성의 분열 경로 및 정지 시점 비교</title>
    <desc id="d6d">정자는 네 개의 균등한 세포를 만들고 난자는 하나의 큰 난자와 극체 셋을 만들며 두 지점에서 정지하는 과정을 나란히 비교한 그림. 극체 셋은 모두 세포의 같은 한쪽 극에서 떨어져 나오고, 배란은 두 정지 사이에 있으며 LH 급증이 배란을 일으킨다.</desc>

    <line x1="440" y1="20" x2="440" y2="462" stroke="#D1D5DB" stroke-dasharray="6 4"/>
    <text x="215" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">정자 형성</text>
    <text x="662" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#C2410C">난자 형성</text>

    <!-- ================= 정자 ================= -->
    <g stroke="#1E40AF" stroke-width="1.6">
      <line x1="215" y1="88" x2="163" y2="131"/><line x1="215" y1="88" x2="267" y2="131"/>
      <line x1="160" y1="169" x2="130" y2="205"/><line x1="160" y1="169" x2="190" y2="205"/>
      <line x1="270" y1="169" x2="240" y2="205"/><line x1="270" y1="169" x2="300" y2="205"/>
    </g>

    <circle cx="215" cy="66" r="22" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.8"/>
    <text x="215" y="63" text-anchor="middle" font-size="10.5" fill="#1E3A8A">1차</text>
    <text x="215" y="77" text-anchor="middle" font-size="8.5" fill="#6B7280">2n</text>

    <circle cx="160" cy="150" r="19" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.6"/>
    <circle cx="270" cy="150" r="19" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.6"/>
    <text x="160" y="148" text-anchor="middle" font-size="10" fill="#1E3A8A">2차</text>
    <text x="160" y="160" text-anchor="middle" font-size="8.5" fill="#6B7280">n</text>
    <text x="270" y="148" text-anchor="middle" font-size="10" fill="#1E3A8A">2차</text>
    <text x="270" y="160" text-anchor="middle" font-size="8.5" fill="#6B7280">n</text>

    <g fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.5">
      <circle cx="128" cy="224" r="15"/><circle cx="192" cy="224" r="15"/>
      <circle cx="238" cy="224" r="15"/><circle cx="302" cy="224" r="15"/>
    </g>
    <g text-anchor="middle" font-size="9" fill="#6B7280">
      <text x="128" y="228">n</text><text x="192" y="228">n</text>
      <text x="238" y="228">n</text><text x="302" y="228">n</text>
    </g>

    <path d="M128 239 c -6 6 6 11 0 17" fill="none" stroke="#1E40AF" stroke-width="1.6" stroke-linecap="round"/>
<path d="M192 239 c -6 6 6 11 0 17" fill="none" stroke="#1E40AF" stroke-width="1.6" stroke-linecap="round"/>
<path d="M238 239 c -6 6 6 11 0 17" fill="none" stroke="#1E40AF" stroke-width="1.6" stroke-linecap="round"/>
<path d="M302 239 c -6 6 6 11 0 17" fill="none" stroke="#1E40AF" stroke-width="1.6" stroke-linecap="round"/>
    <text x="215" y="276" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E40AF">네 개 모두 정자가 된다</text>
    <text x="215" y="296" text-anchor="middle" font-size="11.5" fill="#4B5563">크기가 모두 같다 · 정지 없음</text>
    <text x="215" y="316" text-anchor="middle" font-size="11.5" fill="#4B5563">극체가 없다 — 버려지는 쪽이 없다</text>

    <rect x="52" y="366" width="326" height="90" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="215" y="396" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">정지가 없다</text>
    <text x="215" y="420" text-anchor="middle" font-size="11" fill="#4B5563">사춘기에 시작해 평생 연속 생산</text>
    <text x="215" y="444" text-anchor="middle" font-size="10" fill="#6B7280">난자는 반대 — 태아기에 시작해 두 번 멈춘다</text>

    <!-- ================= 난자 ================= -->
    <!-- 한쪽 극(極) 띠 — 극체가 모두 이쪽에서 나온다 -->
    <rect x="664" y="126" width="206" height="192" rx="14" fill="#F3F4F6" stroke="#D1D5DB" stroke-dasharray="5 4"/>

    <!-- 줄기와 두 정지 -->
    <g stroke="#C2410C" stroke-width="1.8">
      <line x1="650" y1="99" x2="650" y2="165"/>
      <line x1="650" y1="207" x2="650" y2="271"/>
    </g>
    <rect x="639" y="119" width="22" height="22" fill="#FFFFFF"/>
    <rect x="639" y="229" width="22" height="22" fill="#FFFFFF"/>
    <g stroke="#C2410C" stroke-width="3.4" stroke-linecap="round">
      <line x1="644" y1="121" x2="644" y2="139"/><line x1="656" y1="121" x2="656" y2="139"/>
      <line x1="644" y1="231" x2="644" y2="249"/><line x1="656" y1="231" x2="656" y2="249"/>
    </g>

    <!-- 1차 정지 상자 -->
    <rect x="452" y="102" width="140" height="70" rx="8" fill="#FEF2F2" stroke="#C2410C" stroke-width="1.8"/>
    <text x="522" y="121" text-anchor="middle" font-size="11" font-weight="700" fill="#7C2D12">1차 정지</text>
    <text x="522" y="137" text-anchor="middle" font-size="10.5" fill="#7C2D12">감수 1분열 전기</text>
    <text x="522" y="152" text-anchor="middle" font-size="10.5" font-weight="700" fill="#C2410C">복사기(複絲期)</text>
    <text x="522" y="166" text-anchor="middle" font-size="9" fill="#6B7280">태아기 → 사춘기 배란</text>
    <line x1="592" y1="130" x2="636" y2="130" stroke="#9CA3AF" stroke-width="1.2"/>
    <polygon points="638,130 631,126.5 631,133.5" fill="#9CA3AF"/>

    <!-- 배란 시점 — 두 정지 사이 -->
    <text x="520" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C2410C">배란</text>
    <text x="520" y="205" text-anchor="middle" font-size="9.5" fill="#6B7280">제2난모세포가 나간다</text>
    <line x1="572" y1="192" x2="622" y2="189" stroke="#C2410C" stroke-width="1.4"/>
    <polygon points="627,189 618.2,193.5 617.8,185.5" fill="#C2410C"/>

    <!-- 2차 정지 상자 -->
    <rect x="452" y="214" width="140" height="58" rx="8" fill="#FEF2F2" stroke="#C2410C" stroke-width="1.8"/>
    <text x="522" y="233" text-anchor="middle" font-size="11" font-weight="700" fill="#7C2D12">2차 정지</text>
    <text x="522" y="249" text-anchor="middle" font-size="10.5" fill="#7C2D12">감수 2분열 중기</text>
    <text x="522" y="264" text-anchor="middle" font-size="9.5" fill="#6B7280">정자를 만날 때까지</text>
    <line x1="592" y1="240" x2="636" y2="240" stroke="#9CA3AF" stroke-width="1.2"/>
    <polygon points="638,240 631,236.5 631,243.5" fill="#9CA3AF"/>

    <!-- 세포 -->
    <circle cx="650" cy="76" r="23" fill="#FFEDD5" stroke="#C2410C" stroke-width="2"/>
    <text x="650" y="73" text-anchor="middle" font-size="10.5" fill="#7C2D12">1차</text>
    <text x="650" y="87" text-anchor="middle" font-size="8.5" fill="#6B7280">2n</text>

    <circle cx="650" cy="186" r="21" fill="#FFEDD5" stroke="#C2410C" stroke-width="2"/>
    <text x="650" y="183" text-anchor="middle" font-size="10" fill="#7C2D12">2차</text>
    <text x="650" y="197" text-anchor="middle" font-size="8.5" fill="#6B7280">n</text>

    <circle cx="650" cy="296" r="25" fill="#FFEDD5" stroke="#C2410C" stroke-width="2.4"/>
    <text x="650" y="293" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7C2D12">난자</text>
    <text x="650" y="308" text-anchor="middle" font-size="8.5" fill="#6B7280">n</text>

    <!-- 제1극체 — 극에서 떨어져 나와 다시 둘로 -->
    <line x1="664.9" y1="171.2" x2="677.5" y2="163.8" stroke="#7C2D12" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="664.9" cy="171.2" r="3.4" fill="#7C2D12"/>
    <g stroke="#C2410C" stroke-width="1.4">
      <line x1="697" y1="152" x2="750" y2="145"/><line x1="697" y1="165" x2="750" y2="176"/>
    </g>
    <circle cx="688" cy="158" r="10.5" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.6"/>
    <circle cx="688" cy="158" r="3.6" fill="#7C2D12"/>
    <text x="696" y="141" text-anchor="middle" font-size="9.5" fill="#6B7280">제1극체 · n</text>
    <circle cx="760" cy="143" r="7.5" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.4"/>
    <circle cx="760" cy="143" r="2.8" fill="#7C2D12"/>
    <circle cx="760" cy="178" r="7.5" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.4"/>
    <circle cx="760" cy="178" r="2.8" fill="#7C2D12"/>
    <text x="776" y="146" font-size="9.5" font-weight="700" fill="#C2410C">1</text>
    <text x="776" y="181" font-size="9.5" font-weight="700" fill="#C2410C">2</text>
    <text x="786" y="202" text-anchor="middle" font-size="9.5" fill="#6B7280">제1극체가 다시 둘로</text>

    <!-- 제2극체 -->
    <line x1="667.7" y1="278.3" x2="679.5" y2="270.8" stroke="#7C2D12" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="667.7" cy="278.3" r="3.4" fill="#7C2D12"/>
    <circle cx="690" cy="264" r="10" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.6"/>
    <circle cx="690" cy="264" r="3.6" fill="#7C2D12"/>
    <text x="740" y="268" text-anchor="middle" font-size="9.5" fill="#6B7280">제2극체 · n</text>
    <text x="704" y="256" font-size="9.5" font-weight="700" fill="#C2410C">3</text>

    <text x="790" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#7C2D12">최종 극체 3개</text>

    <!-- 이름 앵커 -->
    <circle cx="498" cy="328" r="4" fill="#7C2D12"/>
    <text x="508" y="332" font-size="10.5" fill="#4B5563">극(極) = 끝 — 극체 셋이 모두 세포의 같은 한쪽 극에서 나온다</text>
    <text x="662" y="352" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7C2D12">하나만 난자, 셋은 극체 — 세포질을 난자 쪽으로 몰아준 결과다</text>

    <!-- 배란 상자 -->
    <rect x="452" y="362" width="176" height="94" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="540" y="394" text-anchor="middle" font-size="11.5" fill="#7C2D12">배란되는 것은</text>
    <text x="540" y="414" text-anchor="middle" font-size="11.5" fill="#7C2D12">완성된 난자가 아니라</text>
    <text x="540" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#7C2D12">제2난모세포다</text>

    <!-- 배란 상자 옆 — LH 급증과 되먹임 고리 -->
    <rect x="648" y="362" width="224" height="94" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
    <!-- 되먹임 고리 — 고농도 에스트로겐이 LH를 올린다 -->
    <path d="M 706 386 C 722 368, 780 366, 800 384" fill="none" stroke="#C2410C" stroke-width="1.6"/>
    <polygon points="802,386 792.6,383 798,377.1" fill="#C2410C"/>
    <circle cx="751" cy="372" r="8.5" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.4"/>
    <text x="751" y="376.5" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C">+</text>
    <text x="751" y="396" text-anchor="middle" font-size="9.5" fill="#7C2D12">양성 피드백</text>
    <text x="700" y="410" text-anchor="middle" font-size="10" fill="#7C2D12">고농도 에스트로겐</text>
    <text x="806" y="410" text-anchor="middle" font-size="12.5" font-weight="700" fill="#C2410C">LH 급증</text>
    <!-- 치솟는 화살표 -->
    <line x1="838" y1="424" x2="858" y2="388" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
    <polygon points="861,382 860.1,394 851.3,389.2" fill="#C2410C"/>
    <text x="700" y="430" text-anchor="middle" font-size="10" font-weight="700" fill="#C2410C">음성 피드백의 예외</text>
    <!-- LH 급증 → 배란 -->
    <polyline points="806,424 806,442 636,442" fill="none" stroke="#C2410C" stroke-width="1.4"/>
    <polygon points="631,442 639,438.5 639,445.5" fill="#C2410C"/>
    <text x="440" y="486" text-anchor="middle" font-size="11" font-weight="700" fill="#4B5563">난자는 크고 스스로 못 움직이며 양분을 싣는다 · 정자는 작고 꼬리로 헤엄친다</text>
</svg>