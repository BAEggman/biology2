<svg viewBox="0 0 880 910" role="img" aria-labelledby="td12 dd12"><title id="td12">검정교배 계산판 — 재조합형 나누기 전체 곱하기 100</title><desc id="dd12">연관 검정교배의 계산 문항을 한 판에 모은 표다. 맨 위에 세 방향의 공식이 있다. 재조합형을 전체로 나누고 100을 곱하면 교차율이고 그 값이 곧 지도거리다. 거꾸로 전체에 교차율을 곱하면 재조합형 마릿수가 나오고, 전체에서 재조합형을 빼면 부모형이다. 가운데 표는 재조합형 수가 바로 주어진 여섯 보기이고, 그 아래 표는 네 클래스가 주어졌을 때 큰 둘을 부모형 작은 둘을 재조합형으로 갈라 푸는 다섯 보기이며, 맨 아래 표는 비율에서 마릿수를 거꾸로 구하거나 부모형에서 재조합형을 구하는 여섯 보기다.</desc><rect x="0" y="0" width="880" height="910" fill="#FFFFFF"/><text x="440" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">검정교배 계산판 — 재조합형 ÷ 전체 × 100</text><text x="440" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">★ 이 단원의 계산 문항은 전부 이 한 줄에서 나온다. 묻는 방향만 셋이다</text><rect x="22" y="64" width="272" height="104" rx="9" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/><text x="158" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7280">① 세는 쪽</text><text x="158" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#115E59">재조합형 ÷ 전체 × 100</text><text x="158" y="144" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">= 교차율(%) = 지도거리(cM)</text><rect x="306" y="64" width="272" height="104" rx="9" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="442" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7280">② 거꾸로 세는 쪽</text><text x="442" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">전체 × 교차율 ÷ 100</text><text x="442" y="144" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">= 재조합형 마릿수</text><rect x="590" y="64" width="272" height="104" rx="9" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.5"/><text x="726" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7280">③ 부모형을 묻는 쪽</text><text x="726" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#9F1239">전체 − 재조합형</text><text x="726" y="144" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">= 부모형 (비율도 100 − 교차율)</text><text x="22" y="204" text-anchor="start" font-size="12" font-weight="700" fill="#9CA3AF">② 재조합형 수가 바로 주어지면 — 나누고 100을 곱한다</text><rect x="22" y="214" width="836" height="192" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="92" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">전체</text><text x="260" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">재조합형</text><text x="430" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">나눗셈</text><text x="700" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">교차율 = 지도거리</text><line x1="40" y1="250" x2="840" y2="250" stroke="#E5E7EB" stroke-width="1"/><text x="92" y="272" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">1,000</text><text x="260" y="272" text-anchor="middle" font-size="11.5" font-weight="700" fill="#BE123C">170</text><text x="430" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">170 ÷ 1,000 × 100</text><text x="700" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#115E59">17 % = 17 cM</text><text x="92" y="292" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">200</text><text x="260" y="292" text-anchor="middle" font-size="11.5" font-weight="700" fill="#BE123C">18</text><text x="430" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">18 ÷ 200 × 100</text><text x="700" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#115E59">9 % = 9 cM</text><text x="92" y="312" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">400</text><text x="260" y="312" text-anchor="middle" font-size="11.5" font-weight="700" fill="#BE123C">38</text><text x="430" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">38 ÷ 400 × 100</text><text x="700" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#115E59">9.5 % = 9.5 cM</text><text x="92" y="332" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">600</text><text x="260" y="332" text-anchor="middle" font-size="11.5" font-weight="700" fill="#BE123C">54</text><text x="430" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">54 ÷ 600 × 100</text><text x="700" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#115E59">9 % = 9 cM</text><text x="92" y="352" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">1,000</text><text x="260" y="352" text-anchor="middle" font-size="11.5" font-weight="700" fill="#BE123C">95</text><text x="430" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">95 ÷ 1,000 × 100</text><text x="700" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#115E59">9.5 % = 9.5 cM</text><text x="92" y="372" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">1,000</text><text x="260" y="372" text-anchor="middle" font-size="11.5" font-weight="700" fill="#BE123C">85</text><text x="430" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">85 ÷ 1,000 × 100</text><text x="700" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="#115E59">8.5 % = 8.5 cM</text><text x="92" y="392" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">1,000</text><text x="260" y="392" text-anchor="middle" font-size="11.5" font-weight="700" fill="#BE123C">320</text><text x="430" y="392" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">320 ÷ 1,000 × 100</text><text x="700" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#115E59">32 % = 32 cM</text><text x="22" y="430" text-anchor="start" font-size="12" font-weight="700" fill="#9CA3AF">③ 네 무리가 주어지면 — 큰 둘이 부모형, 작은 둘이 재조합형이다</text><rect x="22" y="440" width="836" height="190" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="150" y="466" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">네 무리</text><text x="330" y="466" text-anchor="middle" font-size="11" font-weight="700" fill="#1D4ED8">부모형 합</text><text x="460" y="466" text-anchor="middle" font-size="11" font-weight="700" fill="#BE123C">재조합형 합</text><text x="600" y="466" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">전체</text><text x="760" y="466" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">교차율</text><line x1="40" y1="476" x2="840" y2="476" stroke="#E5E7EB" stroke-width="1"/><text x="150" y="498" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">82 · 80 · 19 · 19</text><text x="330" y="498" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1D4ED8">162</text><text x="460" y="498" text-anchor="middle" font-size="11.5" font-weight="700" fill="#BE123C">38</text><text x="600" y="498" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">200</text><text x="760" y="498" text-anchor="middle" font-size="12" font-weight="700" fill="#115E59">19 %</text><text x="150" y="520" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">470 · 468 · 31 · 31</text><text x="330" y="520" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1D4ED8">938</text><text x="460" y="520" text-anchor="middle" font-size="11.5" font-weight="700" fill="#BE123C">62</text><text x="600" y="520" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">1,000</text><text x="760" y="520" text-anchor="middle" font-size="12" font-weight="700" fill="#115E59">6.2 %</text><text x="150" y="542" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">146 · 144 · 55 · 55</text><text x="330" y="542" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1D4ED8">290</text><text x="460" y="542" text-anchor="middle" font-size="11.5" font-weight="700" fill="#BE123C">110</text><text x="600" y="542" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">400</text><text x="760" y="542" text-anchor="middle" font-size="12" font-weight="700" fill="#115E59">27.5 %</text><text x="150" y="564" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">355 · 355 · 145 · 145</text><text x="330" y="564" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1D4ED8">710</text><text x="460" y="564" text-anchor="middle" font-size="11.5" font-weight="700" fill="#BE123C">290</text><text x="600" y="564" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">1,000</text><text x="760" y="564" text-anchor="middle" font-size="12" font-weight="700" fill="#115E59">29 %</text><text x="150" y="586" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">350 · 348 · 151 · 151</text><text x="330" y="586" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1D4ED8">698</text><text x="460" y="586" text-anchor="middle" font-size="11.5" font-weight="700" fill="#BE123C">302</text><text x="600" y="586" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">1,000</text><text x="760" y="586" text-anchor="middle" font-size="12" font-weight="700" fill="#115E59">30.2 %</text><text x="440" y="616" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">★ 맨 아래 줄은 재조합형이 부모형에 거의 맞먹는다 — 연관은 있지만 꽤 멀다(50 %에 가까우면 독립처럼 본다)</text><text x="22" y="654" text-anchor="start" font-size="12" font-weight="700" fill="#9CA3AF">④ 거꾸로 묻는 것 — 비율에서 마릿수로, 부모형에서 재조합형으로</text><rect x="22" y="664" width="836" height="192" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="52" y="696" text-anchor="start" font-size="11" font-weight="700" fill="#374151">교차율 32 %, 전체 500</text><text x="470" y="696" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">500 × 32 ÷ 100</text><text x="830" y="696" text-anchor="end" font-size="12" font-weight="700" fill="#92400E">재조합형 160마리</text><text x="52" y="722" text-anchor="start" font-size="11" font-weight="700" fill="#374151">교차율 18.5 %, 전체 1,000</text><text x="470" y="722" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">1,000 × 18.5 ÷ 100</text><text x="830" y="722" text-anchor="end" font-size="12" font-weight="700" fill="#92400E">재조합형 185마리</text><text x="52" y="748" text-anchor="start" font-size="11" font-weight="700" fill="#374151">교차율 27 %, 전체 200</text><text x="470" y="748" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">200 − (200 × 27 ÷ 100)</text><text x="830" y="748" text-anchor="end" font-size="12" font-weight="700" fill="#92400E">부모형 146마리</text><text x="52" y="774" text-anchor="start" font-size="11" font-weight="700" fill="#374151">교차율 29 %</text><text x="470" y="774" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">100 − 29</text><text x="830" y="774" text-anchor="end" font-size="12" font-weight="700" fill="#92400E">부모형 71 %</text><text x="52" y="800" text-anchor="start" font-size="11" font-weight="700" fill="#374151">부모형 760, 재조합형 240</text><text x="470" y="800" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">240 ÷ 1,000 × 100</text><text x="830" y="800" text-anchor="end" font-size="12" font-weight="700" fill="#92400E">교차율 24 %</text><text x="52" y="826" text-anchor="start" font-size="11" font-weight="700" fill="#374151">전체 1,000 중 부모형 830</text><text x="470" y="826" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">(1,000 − 830) ÷ 1,000 × 100</text><text x="830" y="826" text-anchor="end" font-size="12" font-weight="700" fill="#92400E">재조합형 17 %</text><line x1="14" y1="870" x2="866" y2="870" stroke="#E5E7EB" stroke-width="1.3"/><text x="440" y="894" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">★ 먼저 부모형과 재조합형을 가른다 — 수만 보고 아무 둘이나 더하면 틀린다</text></svg>