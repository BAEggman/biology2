<svg viewBox="0 0 880 700" role="img" aria-labelledby="td7 dd7"><title id="td7">성결정 네 체계 — 배우자를 두 종류 만드는 쪽이 heterogametic이다</title><desc id="dd7">네 열로 XY, XO, ZW, 반수체-2배체 체계를 늘어놓았다. 각 열에서 암컷과 수컷의 성염색체 구성을 막대로 그리고 그 오른쪽에 만들어지는 배우자 칸을 두었다. 칸이 하나면 homogametic, 둘이면 heterogametic이고 굵은 주황 테두리로 표시했다. XY와 XO는 수컷이 칸 둘이고, ZW는 암컷이 칸 둘이다. 반수체-2배체는 성염색체로 갈리지 않아 수정 여부가 성을 정한다. 아래에 사람에서 더 묻는 것으로 SRY, 약 2개월, X 불활성화와 바소체, 삼색 고양이를 붙였다.</desc><defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/></marker></defs><rect x="22" y="66" width="200" height="300" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="122" y="34" text-anchor="middle" font-size="14.5" font-weight="700" fill="#374151">X - Y</text><text x="122" y="54" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">사람 · 초파리</text><text x="27" y="144" text-anchor="start" font-size="12" font-weight="700" fill="#6B7280">암</text><rect x="54.5" y="123" width="13" height="34" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><rect x="72.5" y="123" width="13" height="34" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><path d="M94 140 L110 140" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#a2)"/><rect x="107" y="117" width="46" height="46" rx="7" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="123.5" y="123" width="13" height="34" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><text x="130" y="180" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">칸 1 — 한 종류</text><line x1="36" y1="216" x2="208" y2="216" stroke="#E5E7EB" stroke-width="1.1"/><text x="27" y="272" text-anchor="start" font-size="12" font-weight="700" fill="#9A3412">수</text><rect x="54.5" y="251" width="13" height="34" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><rect x="72.5" y="258" width="13" height="20" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><path d="M94 268 L110 268" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#a2)"/><rect x="107" y="245" width="46" height="46" rx="7" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/><rect x="123.5" y="251" width="13" height="34" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><rect x="157" y="245" width="46" height="46" rx="7" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/><rect x="173.5" y="258" width="13" height="20" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><text x="155" y="308" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9A3412">칸 2 — 두 종류</text><text x="155" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">★ hetero</text><rect x="38" y="326" width="168" height="30" rx="15" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.3"/><text x="122" y="346" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">hetero = 수컷</text><rect x="236" y="66" width="200" height="300" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="336" y="34" text-anchor="middle" font-size="14.5" font-weight="700" fill="#374151">X - O</text><text x="336" y="54" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">메뚜기 · 귀뚜라미</text><text x="241" y="144" text-anchor="start" font-size="12" font-weight="700" fill="#6B7280">암</text><rect x="268.5" y="123" width="13" height="34" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><rect x="286.5" y="123" width="13" height="34" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><path d="M308 140 L324 140" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#a2)"/><rect x="321" y="117" width="46" height="46" rx="7" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="337.5" y="123" width="13" height="34" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><text x="344" y="180" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">칸 1 — 한 종류</text><line x1="250" y1="216" x2="422" y2="216" stroke="#E5E7EB" stroke-width="1.1"/><text x="241" y="272" text-anchor="start" font-size="12" font-weight="700" fill="#9A3412">수</text><rect x="268.5" y="251" width="13" height="34" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><rect x="286.5" y="251" width="13" height="34" rx="6" fill="none" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="3 3"/><path d="M308 268 L324 268" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#a2)"/><rect x="321" y="245" width="46" height="46" rx="7" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/><rect x="337.5" y="251" width="13" height="34" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><rect x="371" y="245" width="46" height="46" rx="7" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/><rect x="387.5" y="251" width="13" height="34" rx="6" fill="none" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="3 3"/><text x="369" y="308" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9A3412">칸 2 — 두 종류</text><text x="369" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">★ hetero</text><rect x="252" y="326" width="168" height="30" rx="15" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.3"/><text x="336" y="346" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">hetero = 수컷</text><rect x="450" y="66" width="200" height="300" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="550" y="34" text-anchor="middle" font-size="14.5" font-weight="700" fill="#374151">Z - W</text><text x="550" y="54" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">조류 · 일부 어류</text><text x="455" y="144" text-anchor="start" font-size="12" font-weight="700" fill="#9A3412">암</text><rect x="482.5" y="123" width="13" height="34" rx="6" fill="#8B5CF6" stroke="#6D28D9" stroke-width="1.6"/><rect x="500.5" y="130" width="13" height="20" rx="6" fill="#8B5CF6" stroke="#6D28D9" stroke-width="1.6"/><path d="M522 140 L538 140" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#a2)"/><rect x="535" y="117" width="46" height="46" rx="7" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/><rect x="551.5" y="123" width="13" height="34" rx="6" fill="#8B5CF6" stroke="#6D28D9" stroke-width="1.6"/><rect x="585" y="117" width="46" height="46" rx="7" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/><rect x="601.5" y="130" width="13" height="20" rx="6" fill="#8B5CF6" stroke="#6D28D9" stroke-width="1.6"/><text x="583" y="180" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9A3412">칸 2 — 두 종류</text><text x="583" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">★ hetero</text><line x1="464" y1="216" x2="636" y2="216" stroke="#E5E7EB" stroke-width="1.1"/><text x="455" y="272" text-anchor="start" font-size="12" font-weight="700" fill="#6B7280">수</text><rect x="482.5" y="251" width="13" height="34" rx="6" fill="#8B5CF6" stroke="#6D28D9" stroke-width="1.6"/><rect x="500.5" y="251" width="13" height="34" rx="6" fill="#8B5CF6" stroke="#6D28D9" stroke-width="1.6"/><path d="M522 268 L538 268" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#a2)"/><rect x="535" y="245" width="46" height="46" rx="7" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><rect x="551.5" y="251" width="13" height="34" rx="6" fill="#8B5CF6" stroke="#6D28D9" stroke-width="1.6"/><text x="558" y="308" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">칸 1 — 한 종류</text><rect x="466" y="326" width="168" height="30" rx="15" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.3"/><text x="550" y="346" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">hetero = 암컷</text><rect x="664" y="66" width="200" height="300" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="764" y="34" text-anchor="middle" font-size="14.5" font-weight="700" fill="#374151">반수체 - 2배체</text><text x="764" y="54" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">벌 · 개미</text><rect x="680" y="326" width="168" height="30" rx="15" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.3"/><text x="764" y="346" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7280">성염색체로 안 갈린다</text><rect x="676" y="100" width="176" height="212" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.3"/><text x="764" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7280">성을 정하는 것은</text><text x="764" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">수정되었는가</text><line x1="694" y1="168" x2="834" y2="168" stroke="#E5E7EB" stroke-width="1.1"/><text x="764" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">수정란 → 암컷</text><text x="764" y="214" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F766E">2배체 (2n)</text><text x="764" y="254" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">미수정란 → 수컷</text><text x="764" y="274" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">반수체 (n)</text><text x="764" y="300" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">배우자 칸을 셀 일이 없다</text><line x1="14" y1="392" x2="866" y2="392" stroke="#E5E7EB" stroke-width="1.3"/><rect x="22" y="406" width="842" height="60" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.4"/><text x="440" y="432" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9A3412">★ heterogametic = 배우자를 두 종류 만드는 쪽 — 체계 이름이 아니라 칸 개수를 센다</text><text x="440" y="454" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7280">X-Y 수컷 · X-O 수컷 · Z-W 암컷 — 체계에 따라 hetero인 성이 바뀐다</text><text x="14" y="500" text-anchor="start" font-size="12.5" font-weight="700" fill="#9CA3AF">사람에서 더 묻는 것</text><rect x="22" y="514" width="272" height="96" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/><text x="158" y="540" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F766E">Y 위의 한 자리</text><text x="158" y="566" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">SRY (성 결정 부위)</text><text x="158" y="586" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">정소 발달에 필수</text><rect x="306" y="514" width="272" height="96" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/><text x="442" y="540" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6B7280">해부학적 신호</text><text x="442" y="566" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">약 2개월 무렵</text><text x="442" y="586" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">그전에는 구분이 안 된다</text><rect x="590" y="514" width="272" height="96" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/><text x="726" y="540" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6D28D9">두 X 중 하나를 끈다</text><text x="726" y="566" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">불활성화 → 바소체(Barr body)</text><text x="726" y="586" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">삼색(calico) 고양이 무늬의 원인</text><rect x="53.5" y="629" width="13" height="34" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><text x="74" y="650" text-anchor="start" font-size="10.5" font-weight="700" fill="#6B7280">긴 막대 = X 또는 Z</text><rect x="223.5" y="636" width="13" height="20" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><text x="244" y="650" text-anchor="start" font-size="10.5" font-weight="700" fill="#6B7280">짧은 막대 = Y 또는 W</text><rect x="413.5" y="629" width="13" height="34" rx="6" fill="none" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="3 3"/><text x="434" y="650" text-anchor="start" font-size="10.5" font-weight="700" fill="#6B7280">점선 = 성염색체 없음(O)</text><rect x="620" y="634" width="24" height="24" rx="5" fill="none" stroke="#C2410C" stroke-width="2"/><text x="652" y="650" text-anchor="start" font-size="10.5" font-weight="700" fill="#9A3412">굵은 주황 테두리 = heterogametic</text></svg>