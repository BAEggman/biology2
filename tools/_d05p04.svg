<svg viewBox="0 0 880 750" role="img" aria-labelledby="td8 dd8"><title id="td8">반성·한성·종성 — 3×2 칸의 무늬가 서로 다르다</title><desc id="dd8">세 열로 반성유전, 한성유전, 종성유전을 늘어놓았다. 열마다 유전자가 놓인 염색체를 위에 그리고, 아래에 유전자형 세 가지 곱하기 성 두 가지의 칸을 두었다. 칸 안 위쪽 원이 유전자형이고 아래쪽 표시가 형질이 나타나는지 여부다. 반성은 남자 줄의 칸이 셋이 아니라 둘이고, 한성은 한 성의 칸이 전부 안 나타남이며, 종성은 가운데 이형접합 칸에서만 남녀가 갈린다. 아래에 두 물음으로 가르는 판정 줄과 반성유전의 전달 규칙을 붙였다.</desc><rect x="22" y="66" width="272" height="396" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="158" y="34" text-anchor="middle" font-size="14.5" font-weight="700" fill="#374151">반성유전</text><text x="158" y="54" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">유전자가 성염색체(X) 위에 있다</text><text x="158" y="92" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9CA3AF">유전자가 있는 자리</text><rect x="140.5" y="105" width="13" height="34" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><circle cx="147" cy="122" r="6.5" fill="#FFFFFF" stroke="#9A3412" stroke-width="2"/><rect x="162.5" y="112" width="13" height="20" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><line x1="38" y1="152" x2="278" y2="152" stroke="#E5E7EB" stroke-width="1.1"/><text x="44" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7280">여</text><rect x="60" y="178" width="66" height="86" rx="7" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.1"/><circle cx="83" cy="206" r="8" fill="#C2410C" stroke="#9A3412" stroke-width="2"/><circle cx="103" cy="206" r="8" fill="#C2410C" stroke="#9A3412" stroke-width="2"/><circle cx="93" cy="242" r="11" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.8"/><circle cx="93" cy="242" r="4.5" fill="#C2410C"/><rect x="134" y="178" width="66" height="86" rx="7" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.1"/><circle cx="157" cy="206" r="8" fill="#C2410C" stroke="#9A3412" stroke-width="2"/><circle cx="177" cy="206" r="8" fill="#FFFFFF" stroke="#9A3412" stroke-width="2"/><circle cx="167" cy="242" r="11" fill="#FFEDD5"