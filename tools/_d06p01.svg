<svg viewBox="0 0 880 536" role="img" aria-labelledby="td11 dd11"><title id="td11">나선의 자 — 한 바퀴는 10 염기쌍이고 3.4 나노미터다</title><desc id="dd11">왼쪽은 이중나선 한 바퀴를 옆에서 본 자다. 두 기둥이 위에서 아래까지 정확히 두 번 엇갈리는데 그것이 한 바퀴이고, 그 사이에 가로 칸이 정확히 열 개 놓여 있다. 칸마다 1부터 10까지 번호가 붙어 있다. 왼쪽 세로 화살표가 그 한 바퀴 전체를 3.4 나노미터로 재고, 오른쪽 작은 괄호가 칸 하나를 0.34 나노미터로 잰다. 오른쪽에는 셈 세 가지가 있다. 3.4를 10으로 나누면 0.34, 21,000 염기쌍을 10으로 나누면 2,100바퀴, 21,000에 0.34 나노미터를 곱하면 약 7.1 마이크로미터다.</desc><defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker><marker id="au" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#D97706"/></marker></defs><rect x="0" y="0" width="880" height="536" fill="#FFFFFF"/><text x="440" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">나선의 자 — 한 바퀴는 10 염기쌍이고 3.4 nm다</text><text x="440" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">★ s38p01의 사다리는 칸을 세는 그림이 아니다. 수는 여기서 센다</text><rect x="22" y="68" width="404" height="424" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="36" y="90" text-anchor="start" font-size="11.5" font-weight="700" fill="#9CA3AF">한 바퀴를 옆에서 본 것</text><rect x="137.043" y="116" width="135.915" height="9" rx="4.5" fill="#CBD5E1" stroke="#475569" stroke-width="1.2"/><text x="316" y="124.5" text-anchor="start" font-size="10.5" font-weight="700" fill="#9CA3AF">1</text><rect x="179.043" y="149" width="51.9149" height="9" rx="4.5" fill="#CBD5E1" stroke="#475569" stroke-width="1.2"/><text x="316" y="157.5" text-anchor="start" font-size="10.5" font-weight="700" fill="#9CA3AF">2</text><rect x="179.043" y="182" width="51.9149" height="9" rx="4.5" fill="#CBD5E1" stroke="#475569" stroke-width="1.2"/><text x="316" y="190.5" text-anchor="start" font-size="10.5" font-weight="700" fill="#9CA3AF">3</text><rect x="137.043" y="215" width="135.915" height="9" rx=