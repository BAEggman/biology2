<svg viewBox="0 0 880 560" role="img" aria-labelledby="td5 dd5"><title id="td5">상인연관과 상반연관 — 같은 막대에 모였는가 엇갈렸는가</title><desc id="dd5">상동염색체 한 쌍을 막대 둘로 그리고 두 유전자좌를 원으로 찍었다. 채운 원이 우성, 빈 원이 열성이다. 왼쪽 상인은 한 막대에 채운 원끼리 모여 있고 오른쪽 상반은 막대마다 하나씩 엇갈려 있다. 배우자는 막대를 통째로 물려받으므로 막대에 적힌 그대로가 배우자가 되고, 자가교배 표현형이 3대1과 1대2대1로 갈린다. 아래 띠는 교차가 없을 때(완전연관)와 있을 때(불완전연관)를 견준다.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/></marker></defs><text x="228" y="34" text-anchor="middle" font-size="14.5" font-weight="700" fill="#374151">상인연관 (cis)</text><text x="228" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">채운 원끼리 한 막대에 모였다</text><text x="652" y="34" text-anchor="middle" font-size="14.5" font-weight="700" fill="#374151">상반연관 (trans)</text><text x="652" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">막대마다 하나씩 엇갈렸다</text><line x1="440" y1="26" x2="440" y2="374" stroke="#E5E7EB" stroke-width="1.4"/><text x="14" y="104" text-anchor="start" font-size="11" font-weight="700" fill="#9CA3AF">① 상동염색체 쌍</text><text x="14" y="196" text-anchor="start" font-size="11" font-weight="700" fill="#9CA3AF">② 배우자</text><text x="14" y="306" text-anchor="start" font-size="11" font-weight="700" fill="#9CA3AF">③ 자가교배</text><rect x="103" y="68" width="250" height="20" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.3"/><circle cx="178" cy="78" r="9.5" fill="#14B8A6" stroke="#0F766E" stroke-width="2"/><circle cx="283" cy="78" r="9.5" fill="#F97316" stroke="#C2410C" stroke-width="2"/><rect x="103" y="100" width="250" height="20" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.3"/><circle cx="178" cy="110" r="9.5" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><circle cx="283" cy="110" r="9.5" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/><path d="M89 66 L83 66 L83 122 L89 122" fill="none" stroke="#9CA3AF" stroke-width="1.4"/><path d="M228 132 L228 156" stroke="#9CA3AF" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="115" y="168" width="226" height="17" rx="8.5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.3"/><circle cx="182.8" cy="176.5" r="9.5" fill="#14B8A6" stroke="#0F766E" stroke-width="2"/><circle cx="277.72" cy="176.5" r="9.5" fill="#F97316" stroke="#C2410C" stroke-width="2"/><rect x="115" y="196" width="226" height="17" rx="8.5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.3"/><circle cx="182.8" cy="204.5" r="9.5" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><circle cx="277.72" cy="204.5" r="9.5" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/><text x="228" y="232" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7280">배우자 두 가지</text><path d="M228 240 L228 264" stroke="#9CA3AF" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><text x="440" y="252" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7C2D12">★ 멘델의 독립의 법칙은 두 유전자가 서로 다른 막대에 실렸을 때만 성립한다</text>
<text x="440" y="266" text-anchor="middle" font-size="10" fill="#6B7280">같은 막대에 실리면 막대째 함께 가므로 배우자가 두 가지뿐이다 — 이것이 연관이 멘델의 완전독립과 다른 이유다</text>
