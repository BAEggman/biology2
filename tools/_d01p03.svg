<svg viewBox="0 0 880 612" role="img" aria-labelledby="t3 d3d">
    <title id="t3">비순환적 전자 흐름의 Z 도식과 엽록체 이름 앵커</title>
    <desc id="d3d">위쪽은 물에서 시작한 전자가 광계 II에서 들뜨고 전자전달계를 내려온 뒤 광계 I에서 다시 들떠 NADP+로 가고 NADPH가 되는 경로를 에너지 준위로 나타낸 그림. 순환적 경로 호 위에는 빗금 친 산소 거품이 놓여 O2가 나지 않음을 표시한다. 아래쪽은 깔개 한 장 위에 납작한 주머니를 포개 쌓은 더미와 그 더미 밖으로 뻗은 낱장 주머니를 그린 그림으로, 더미 위에 광계 II가 낱장 위에 광계 I이 얹혀 있고 깔개 위에서 캘빈회로가 돈다</desc>

    <line x1="52" y1="30" x2="52" y2="300" stroke="#9CA3AF"/>
    <text x="30" y="170" font-size="12" fill="#6B7280" transform="rotate(-90 30 170)" text-anchor="middle">전자의 에너지</text>
    <line x1="52" y1="300" x2="860" y2="300" stroke="#9CA3AF"/>

    <!-- 경로선 -->
    <polyline points="95,270 150,270 150,80 235,110 320,180 400,200 470,200 470,55 560,80 640,110 700,110"
      fill="none" stroke="#0F766E" stroke-width="2.5"/>

    <!-- 물 -->
    <rect x="62" y="256" width="66" height="30" rx="8" fill="#DBEAFE" stroke="#1E40AF"/>
    <text x="95" y="276" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">H₂O</text>
    <text x="95" y="248" text-anchor="middle" font-size="11" fill="#1E40AF">광분해 → O₂</text>

    <!-- PSII -->
    <rect x="120" y="196" width="76" height="34" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.8"/>
    <text x="158" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#7C2D12">광계 II</text>
    <text x="158" y="248" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C2410C">먼저 작동</text>
    <text x="158" y="70" text-anchor="middle" font-size="11" fill="#6B7280">P680</text>
    <g stroke="#C2410C" stroke-width="2"><line x1="158" y1="192" x2="158" y2="160"/></g>
    <polygon points="158,152 152,164 164,164" fill="#C2410C"/>
    <text x="196" y="176" font-size="11" fill="#C2410C">빛</text>

    <!-- 전자전달계 -->
    <g font-size="11" fill="#4B5563" text-anchor="middle">
      <circle cx="235" cy="110" r="13" fill="#F3F4F6" stroke="#9CA3AF"/><text x="235" y="114">PQ</text>
      <circle cx="320" cy="180" r="15" fill="#F3F4F6" stroke="#9CA3AF"/><text x="320" y="184">Cyt</text>
      <circle cx="400" cy="200" r="13" fill="#F3F4F6" stroke="#9CA3AF"/><text x="400" y="204">PC</text>
    </g>
    <text x="320" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#115E59">H⁺ 퍼내기 → ATP</text>

    <!-- PSI -->
    <rect x="432" y="196" width="76" height="34" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.8"/>
    <text x="470" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#115E59">광계 I</text>
    <text x="470" y="248" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F766E">나중에 작동</text>
    <text x="470" y="46" text-anchor="middle" font-size="11" fill="#6B7280">P700</text>
    <g stroke="#0F766E" stroke-width="2"><line x1="470" y1="192" x2="470" y2="140"/></g>
    <polygon points="470,132 464,144 476,144" fill="#0F766E"/>
    <text x="508" y="166" font-size="11" fill="#0F766E">빛</text>

    <!-- Fd, NADP⁺ -->
    <circle cx="560" cy="80" r="13" fill="#F3F4F6" stroke="#9CA3AF"/>
    <text x="560" y="84" text-anchor="middle" font-size="11" fill="#4B5563">Fd</text>
    <rect x="640" y="94" width="86" height="32" rx="8" fill="#DBEAFE" stroke="#1E40AF"/>
    <text x="683" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">NADP⁺</text>
    <text x="683" y="146" text-anchor="middle" font-size="11" fill="#1E40AF">최종 전자수용체</text>

    <!-- NADPH — 방패(🛡)가 이 프로젝트의 NADPH 심볼이다 -->
    <line x1="731" y1="110" x2="759" y2="110" stroke="#1E40AF" stroke-width="2"/>
    <polygon points="768,110 758,105 758,115" fill="#1E40AF"/>
    <text x="745" y="102" text-anchor="middle" font-size="9.5" fill="#6B7280">환원</text>
    <path d="M 769 86 L 831 86 L 831 112 C 831 134, 814 145, 800 152 C 786 145, 769 134, 769 112 Z"
      fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.8"/>
    <text x="800" y="112" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E40AF">NADPH</text>
    <text x="800" y="170" text-anchor="middle" font-size="10.5" fill="#1E40AF">비순환에서만 생성</text>

    <!-- 순환적 경로 -->
    <path d="M 560 66 C 556 12, 296 8, 250 96" fill="none" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="6 4"/>
    <polygon points="248,104 256,92 244,90" fill="#9CA3AF"/>
    <text x="290" y="20" text-anchor="middle" font-size="11.5" fill="#6B7280">순환적 — 광계 I만 사용, ATP만 생성</text>

    <!-- 빗금 친 O₂ 거품 — 순환 경로에는 산소가 없다 -->
    <clipPath id="cxo2d3"><circle cx="421" cy="28" r="13"/></clipPath>
    <circle cx="421" cy="28" r="13" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.6"/>
    <g clip-path="url(#cxo2d3)" stroke="#9CA3AF" stroke-width="1.3">
      <line x1="406" y1="43" x2="436" y2="13"/>
      <line x1="406" y1="34" x2="427" y2="13"/>
      <line x1="415" y1="43" x2="436" y2="22"/>
    </g>
    <text x="421" y="32" text-anchor="middle" font-size="10.5" fill="#6B7280">O₂</text>
    <text x="421" y="56" text-anchor="middle" font-size="10.5" fill="#6B7280">O₂ 없음</text>

    <text x="450" y="326" text-anchor="middle" font-size="13" fill="#6B7280">물 → 광계 II → 전달계 → 광계 I → NADP⁺ · 번호가 아니라 흐름 순서로 읽는다</text>

    <!-- ================= 이름 앵커 — 주머니 · 낟알 · 깔개 ================= -->
    <rect x="44" y="346" width="812" height="254" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="62" y="370" font-size="11" fill="#4B5563">두 광계는 고르게 분포하지 않는다 — PSII는 쌓아 올린 더미에, PSI은 밖으로 뻗은 낱장에</text>

    <!-- 깔개 = 스트로마 -->
    <path d="M 120 482 L 790 482 L 836 552 L 64 552 Z" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.4"/>
    <path d="M 64 552 L 836 552 L 832 561 L 68 561 Z" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="1"/>
    <text x="96" y="540" font-size="12" font-weight="700" fill="#4B5563">스트로마 = 깔개</text>

    <!-- 낱장 주머니 = 스트로마 라멜라 (더미 밖으로 뻗어 나온다) -->
    <rect x="448" y="487" width="215" height="13" rx="6.5" transform="rotate(6 448 493.5)"
      fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>

    <!-- 포개 쌓은 납작한 주머니 더미 = 그라나 -->
    <g fill="#FFEDD5" stroke="#C2410C" stroke-width="1.5">
      <rect x="305" y="517" width="150" height="11" rx="5.5"/>
      <rect x="305" y="503" width="150" height="11" rx="5.5"/>
      <rect x="305" y="489" width="150" height="11" rx="5.5"/>
      <rect x="305" y="475" width="150" height="11" rx="5.5"/>
      <rect x="305" y="461" width="150" height="11" rx="5.5"/>
    </g>
    <path d="M 299 461 L 291 461 L 291 528 L 299 528" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>
    <text x="285" y="500" text-anchor="end" font-size="11" font-weight="700" fill="#C2410C">그라나 — 포개 쌓은 더미</text>

    <!-- 주머니 한 장 = 틸라코이드 -->
    <line x1="260" y1="448" x2="313" y2="462" stroke="#9CA3AF" stroke-width="1"/>
    <text x="256" y="430" text-anchor="end" font-size="11" font-weight="700" fill="#4B5563">틸라코이드 — 주머니 한 장</text>
    <text x="256" y="445" text-anchor="end" font-size="10.5" fill="#6B7280">명반응이 일어나는 막</text>

    <!-- 더미 위의 광계 II -->
    <rect x="330" y="424" width="100" height="32" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.8"/>
    <text x="380" y="446" text-anchor="middle" font-size="13" font-weight="700" fill="#7C2D12">광계 II</text>

    <!-- 낱장 위의 광계 I -->
    <rect x="520" y="470" width="100" height="32" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.8"/>
    <text x="570" y="492" text-anchor="middle" font-size="13" font-weight="700" fill="#115E59">광계 I</text>
    <line x1="600" y1="533" x2="594" y2="519" stroke="#9CA3AF" stroke-width="1"/>
    <text x="600" y="545" text-anchor="middle" font-size="11" font-weight="700" fill="#0F766E">스트로마 라멜라 — 낱장</text>

    <!-- 깔개 위에서 도는 회로 = 캘빈회로 -->
    <path d="M 771.6 485.7 A 28 28 0 1 1 752.4 485.7" fill="none" stroke="#1E40AF" stroke-width="2.2"/>
    <polygon points="758,483.7 752,490.6 749,482.2" fill="#1E40AF"/>
    <text x="762" y="510" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E40AF">캘빈회로</text>
    <text x="762" y="526" text-anchor="middle" font-size="9.5" fill="#1E40AF">CO₂ → 당</text>
    <line x1="668" y1="497" x2="727" y2="506" stroke="#1E40AF" stroke-width="1.8"/>
    <polygon points="734,507.5 724.4,510.6 725.8,501.7" fill="#1E40AF"/>
    <text x="698" y="489" text-anchor="middle" font-size="10" fill="#1E40AF">ATP · NADPH</text>

    <text x="450" y="584" text-anchor="middle" font-size="10.5" fill="#6B7280">thylakos 주머니 → 틸라코이드 · granum 낟알 → 그라나 · strōma 깔아 놓은 것 → 스트로마</text>
  </svg>