<svg viewBox="0 0 880 258" role="img" aria-labelledby="t2 d2d">
    <title id="t2">DNA량과 염색체 수의 변화 곡선</title>
    <desc id="d2d">2n=4 세포에서 G1부터 배우자까지 DNA 상대량과 염색체 수가 각기 다른 시점에 꺾이는 것을 나타낸 두 계단형 곡선. 세로축은 0·2·4·8 눈금.</desc>

    <!-- 눈금선 -->
    <g stroke="#E5E7EB" stroke-width="1">
      <line x1="70" y1="160" x2="835" y2="160"/>
      <line x1="70" y1="120" x2="835" y2="120"/>
      <line x1="70" y1="40"  x2="835" y2="40"/>
    </g>
    <line x1="70" y1="200" x2="835" y2="200" stroke="#9CA3AF"/>
    <line x1="70" y1="28"  x2="70"  y2="200" stroke="#9CA3AF"/>
    <g stroke="#9CA3AF">
      <line x1="66" y1="200" x2="70" y2="200"/><line x1="66" y1="160" x2="70" y2="160"/>
      <line x1="66" y1="120" x2="70" y2="120"/><line x1="66" y1="40"  x2="70" y2="40"/>
    </g>
    <g font-size="10.5" fill="#6B7280" text-anchor="end">
      <text x="62" y="204">0</text><text x="62" y="164">2</text>
      <text x="62" y="124">4</text><text x="62" y="44">8</text>
    </g>
    <text x="30" y="118" font-size="10" fill="#6B7280" text-anchor="middle" transform="rotate(-90 30 118)">상대량 (2n=4)</text>

    <!-- 시기 눈금 -->
    <g stroke="#E5E7EB" stroke-width="1">
      <line x1="105" y1="200" x2="105" y2="204"/><line x1="175" y1="200" x2="175" y2="204"/>
      <line x1="245" y1="200" x2="245" y2="204"/><line x1="330" y1="200" x2="330" y2="204"/>
      <line x1="395" y1="200" x2="395" y2="204"/><line x1="480" y1="200" x2="480" y2="204"/>
      <line x1="590" y1="200" x2="590" y2="204"/><line x1="655" y1="200" x2="655" y2="204"/>
      <line x1="750" y1="200" x2="750" y2="204"/>
    </g>
    <g font-size="10.5" fill="#6B7280" text-anchor="middle">
      <text x="105" y="217">G₁</text><text x="175" y="217">S</text><text x="245" y="217">G₂</text>
      <text x="330" y="217">중기</text><text x="395" y="217">후기</text><text x="480" y="217">말기</text>
      <text x="590" y="217">중기</text><text x="655" y="217">후기</text><text x="750" y="217">배우자</text>
    </g>
    <g stroke="#D1D5DB" fill="none">
      <path d="M85 226 L85 231 L265 231 L265 226"/>
      <path d="M310 226 L310 231 L500 231 L500 226"/>
      <path d="M565 226 L565 231 L680 231 L680 226"/>
    </g>
    <g font-size="10.5" fill="#4B5563" text-anchor="middle">
      <text x="175" y="244">간기</text><text x="405" y="244">감수 1분열</text><text x="622" y="244">감수 2분열</text>
    </g>

    <!-- DNA량 -->
    <polyline points="70,120 140,120 210,40 440,40 480,120 690,120 725,160 835,160"
      fill="none" stroke="#1E40AF" stroke-width="2.5"/>
    <text x="252" y="32" font-size="11.5" font-weight="700" fill="#1E40AF">DNA량</text>

    <!-- 염색체 수 -->
    <polyline points="70,120 440,120 480,160 620,160 655,120 700,120 725,160 835,160"
      fill="none" stroke="#C2410C" stroke-width="2.5" stroke-dasharray="6 3"/>
    <text x="258" y="113" font-size="11.5" font-weight="700" fill="#C2410C">염색체 수</text>

    <!-- 꺾이는 자리 -->
    <g stroke="#9CA3AF" stroke-dasharray="3 3">
      <line x1="175" y1="28" x2="175" y2="200"/><line x1="395" y1="28" x2="395" y2="200"/>
      <line x1="480" y1="28" x2="480" y2="200"/><line x1="655" y1="28" x2="655" y2="200"/>
    </g>
    <g font-size="10.5" fill="#7C2D12" text-anchor="middle">
      <text x="175" y="22">DNA만 2배 (4→8)</text>
      <text x="395" y="22">둘 다 그대로</text>
      <text x="480" y="22">둘 다 절반</text>
      <text x="655" y="22">염색체 수만 2배</text>
    </g>

    <!-- 염색체 아이콘 — 동원체 하나가 염색체 하나 -->
    <g>
      <rect x="706" y="46" width="146" height="92" rx="5" fill="#F9FAFB" stroke="#E5E7EB"/>
      <text x="779" y="62" font-size="9.5" fill="#6B7280" text-anchor="middle">염색체 세는 법</text>
      <g stroke="#1E40AF" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M754 74 L754 114"/><path d="M770 74 L770 114"/>
      </g>
      <circle cx="762" cy="94" r="5.5" fill="#C2410C"/>
      <text x="782" y="87" font-size="9.5" fill="#1E40AF" text-anchor="start">염색분체 2</text>
      <text x="782" y="102" font-size="9.5" fill="#C2410C" text-anchor="start">동원체 1</text>
      <text x="779" y="130" font-size="9.5" font-weight="700" fill="#7C2D12" text-anchor="middle">= 염색체 1개</text>
    </g>
  </svg>