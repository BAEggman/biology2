oke="#374151" stroke-width="1.6"/><text x="691" y="682" text-anchor="middle" font-size="10" font-weight="700" fill="#6B7280">양쪽 X가 다 빈 원이어야 한다 — 이 교배에서는 안 나온다</text><rect x="524" y="718" width="334" height="146" rx="9" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.3"/><text x="691" y="742" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">수컷은 짝 자리가 없다 — 반접합</text><rect x="669.5" y="759" width="13" height="54" rx="6" fill="#5EEAD4" stroke="#0F766E" stroke-width="1.6"/><circle cx="676" cy="786" r="5.6" fill="#FFFFFF" stroke="#374151" stroke-width="1.6"/><rect x="699.5" y="787.08" width="13" height="25.92" rx="6" fill="#5EEAD4" stroke="#0F766E" stroke-width="1.6"/><text x="691" y="832" text-anchor="middle" font-size="10" font-weight="700" fill="#6B7280">한 유전자좌에 대립유전자가 하나뿐이라</text><text x="691" y="848" text-anchor="middle" font-size="10" font-weight="700" fill="#6B7280">가릴 짝이 없어 열성이 그대로 나타난다</text><line x1="14" y1="884" x2="866" y2="884" stroke="#E5E7EB" stroke-width="1.3"/><text x="440" y="904" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">★ 눈색이 성을 따라 갈린다 — 눈색 유전자가 X 염색체 위에 얹혀 있다는 뜻이고, 이것이 염색체설의 첫 직접 증거다</text></svg>