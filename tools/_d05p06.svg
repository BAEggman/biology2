<svg viewBox="0 0 880 916" role="img" aria-labelledby="td10 dd10"><title id="td10">모건의 흰눈 초파리 — 눈색이 X 염색체를 따라다닌다</title><desc id="dd10">빨간눈 암컷과 흰눈 수컷의 교배를 두 세대에 걸쳐 늘어놓은 격자다. 긴 청록 막대가 X 염색체이고 짧은 청록 막대가 Y 염색체인데, Y에는 눈색 자리인 원이 아예 없다. 채운 빨간 원이 야생형 w+ 대립유전자이고 빈 원이 흰눈 w 대립유전자다. 어버이는 빨간눈 암컷과 흰눈 수컷이고, 난자는 X 한 가지만, 정자는 X와 Y 두 가지를 낸다. 자손 1대는 딸도 아들도 모두 빨간눈이다. 자손 2대 2×2 격자에서는 네 칸 가운데 흰눈이 수컷 칸 하나뿐이다. 오른쪽 옆 상자는 두 X가 모두 흰눈 대립유전자여야 암컷이 흰눈이 된다는 것과, Y에 짝 자리가 없어 수컷이 반접합이라는 것을 따로 보인다.</desc><defs><marker id="a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/></marker></defs><rect x="0" y="0" width="880" height="916" fill="#FFFFFF"/><text x="440" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">모건의 흰눈 초파리 — 눈색이 X를 따라다닌다</text><text x="440" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">빨간눈 암컷 × 흰눈 수컷을 두 세대 늘어놓으면, 흰눈이 수컷 칸에만 떨어진다</text><rect x="22" y="62" width="836" height="46" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/><rect x="40.5" y="68" width="11" height="34" rx="6" fill="#5EEAD4" stroke="#0F766E" stroke-width="1.6"/><circle cx="46" cy="85" r="5.6" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.6"/><text x="60" y="89" text-anchor="start" font-size="10.5" font-weight="700" fill="#6B7280">X 염색체 — 눈색 자리가 있다</text><rect x="244.5" y="82" width="11" height="20" rx="6" fill="#5EEAD4" stroke="#0F766E" stroke-width="1.6"/><text x="264" y="89" text-anchor="start" font-size="10.5" font-weight="700" fill="#6B7280">Y 염색체 — 눈색 자리가 아예 없다</text><circle cx="502" cy="85" r="6" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.6"/><text x="516" y="82" text-anchor="start" font-size="11" font-weight="700" fill="#6B7280"><tspan>w</tspan><tspan font-size="7.48" dy="-4.4">+</tspan><tspan dy="4.4"></tspan></text><text x="516" y="96" text-anchor="start" font-size="10" font-weight="700" fill="#6B7280">야생형 빨간눈 · 우성</text><circle cx="676" cy="85" r="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.6"/><text x="690" y="82" text-anchor="start" font-size="11" font-weight="700" fill="#6B7280">w</text><text x="690" y="96" text-anchor="start" font-size="10" font-weight="700" fill="#6B7280">흰눈 · 열성</text><rect x="22" y="120" width="836" height="130" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="36" y="140" text-anchor="start" font-size="11.5" font-weight="700" fill="#9CA3AF">어버이 (P)</text><rect x="143" y="134" width="214" height="112" rx="9" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="161" y="156" text-anchor="start" font-size="15" font-weight="700" fill="#991B1B">♀</text><text x="264" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B"><tspan>X</tspan><tspan font-size="8.84" dy="-5.2">w+</tspan><tspan dy="5.2"></tspan><tspan> </tspan><tspan>X</tspan><tspan font-size="8.84" dy="-5.2">w+</tspan><tspan dy="5.2"></tspan></text><rect x="230.5" y="169" width="13" height="54" rx="6" fill="#5EEAD4" stroke="#0F766E" stroke-width="1.6"/><circle cx="237" cy="196" r="5.6" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.6"/><rect x="256.5" y="169" width="13" height="54" rx="6" fill="#5EEAD4" stroke="#0F766E" stroke-width="1.6"/><circle cx="263" cy="196" r="5.6" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.6"/><text x="250" y="237" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991B1B">빨간눈</text><text x="440" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#9CA3AF">×</text><rect x="523" y="134" width="214" height="112" rx="9" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.8"/><text x="541" y="156" text-anchor="start" font-size="15" font-weight="700" fill="#374151">♂</text><text x="644" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#374151"><tspan>X</tspan><tspan font-size="8.84" dy="-5.2">w</tspan><tspan dy="5.2"></tspan><tspan> </tspan><tspan>Y</tspan></text><rect x="610.5" y="169" width="13" height="54" rx="6" fill="#5EEAD4" stroke="#0F766E" stroke-width="1.6"/><circle cx="617" cy="196" r="5.6" fill="#FFFFFF" stroke="#374151" stroke-width="1.6"/><rect x="636.5" y="197.08" width="13" height="25.92" rx="6" fill="#5EEAD4" stroke="#0F766E" stroke-width="1.6"/><text x="630" y="237" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">흰눈</text><rect x="22" y="262" width="836" height="112" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="36" y="282" text-anchor="start" font-size="11.5" font-weight="700" fill="#9CA3AF">만드는 배우자</text><rect x="202" y="285" width="96" height="74" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.3"/><rect x="243.5" y="295" width="13" height="38" rx="6" fill="#5EEAD4" stroke="#0F766E" stroke-width="1.6"/><circle cx="250" cy="314" r="5.6" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.6"/><text x="250" y="351" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7280"><tspan>X</tspan><tspan font-size="7.82" dy="-4.6">w+</tspan><tspan dy="4.6"></tspan></text><text x="250" y="368" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">난자는 X 한 가지뿐</text><rect x="528" y="285" width="96" height="74" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.3"/><rect x="569.5" y="295" width="13" height="38" rx="6" fill="#5EEAD4" stroke="#0F766E" stroke-width="1.6"/><circle cx="576" cy="314" r="5.6" fill="#FFFFFF" stroke="#374151" stroke-width="1.6"/><text x="576" y="351" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7280"><tspan>X</tspan><tspan font-size="7.82" dy="-4.6">w</tspan><tspan dy="4.6"></tspan></text><rect x="636" y="285" width="96" height="74" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.3"/><rect x="677.5" y="314.76" width="13" height="18.24" rx="6" fill="#5EEAD4" stroke="#0F766E" stroke-width="1.6"/><text x="684" y="351" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7280"><tspan>Y</tspan></text><text x="630" y="368" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">정자는 X 또는 Y — 두 가지</text><text x="440" y="326" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9CA3AF">성을 정하는 쪽은 정자다</text><rect x="22" y="386" width="836" height="160" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="36" y="406" text-anchor="start" font-size="11.5" font-weight="700" fill="#9CA3AF">자손 1대 (F1)</text><rect x="143" y="406" width="214" height="112" rx="9" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="161" y="428" text-anchor="start" font-size="15" font-weight="700" fill="#991B1B">♀</text><text x="264" y="429" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B"><tspan>X</tspan><tspan font-size="8.84" dy="-5.2">w+</tspan><tspan dy="5.2"></tspan><tspan> </tspan><tspan>X</tspan><tspan font-size="8.84" dy="-5.2">w</tspan><tspan dy="5.2"></tspan></text><rect x="230.5" y="441" width="13" height="54" rx="6" fill="#5EEAD4" stroke="#0F766E" stroke-width="1.6"/><circle cx="237" cy="468" r="5.6" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.6"/><rect x="256.5" y="441" width="13" height="54" rx="6" fill="#5EEAD4" stroke="#0F766E" stroke-width="1.6"/><circle cx="263" cy="468" r="5.6" fill="#FFFFFF" stroke="#374151" stroke-width="1.6"/><text x="250" y="509" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991B1B">빨간눈</text><rect x="523" y="406" width="214" height="112" rx="9" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="541" y="428" text-anchor="start" font-size="15" font-weight="700" fill="#991B1B">♂</text><text x="644" y="429" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B"><tspan>X</tspan><tspan font-size="8.84" dy="-5.2">w+</tspan><tspan dy="5.2"></tspan><tspan> </tspan><tspan>Y</tspan></text><rect x="610.5" y="441" width="13" height="54" rx="6" fill="#5EEAD4" stroke="#0F766E" stroke-width="1.6"/><circle cx="617" cy="468" r="5.6" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.6"/><rect x="636.5" y="469.08" width="13" height="25.92" rx="6" fill="#5EEAD4" stroke="#0F766E" stroke-width="1.6"/><text x="630" y="509" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991B1B">빨간눈</text><text x="440" y="440" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991B1B">★ 딸도 아들도</text><text x="440" y="458" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991B1B">모두 빨간눈</text><text x="440" y="480" text-anchor="middle" font-size="10" font-weight="700" fill="#6B7280">빨간눈이 우성이라서다</text><text x="250" y="534" text-anchor="middle" font-size="10" font-weight="700" fill="#6B7280">딸의 두 X 중 하나는 반드시 아버지 것이다</text><text x="630" y="534" text-anchor="middle" font-size="10" font-weight="700" fill="#6B7280">아들의 X 하나는 반드시 어머니 것이다</text><rect x="22" y="558" width="486" height="306" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3"/><text x="36" y="578" text-anchor="start" font-size="11.5" font-weight="700" fill="#9CA3AF">F1끼리 교배 → 자손 2대 (F2)</text><text x="78" y="602" text-anchor="middle" font-size="10" font-weight="700" fill="#9CA3AF">어머니 ↓</text><text x="308" y="602" text-anchor="middle" font-size="10" font-weight="700" fill="#9CA3AF">아버지 →</text><text x="215" y="624" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7280"><tspan>X</tspan><tspan font-size="8.16" dy="-4.8">w+</tspan><tspan dy="4.8"></tspan></text><text x="401" y="624" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7280"><tspan>Y</tspan></text><text x="78" y="688" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7280"><tspan>X</tspan><tspan font-size="8.16" dy="-4.8">w+</tspan><tspan dy="4.8"></tspan></text><text x="78" y="788" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7280"><tspan>X</tspan><tspan font-size="8.16" dy="-4.8">w</tspan><tspan dy="4.8"></tspan></text><rect x="122" y="634" width="186" height="100" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="215" y="656" text-anchor="middle"