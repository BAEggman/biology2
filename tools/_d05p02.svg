<svg viewBox="0 0 880 786" role="img" aria-labelledby="td6 dd6"><title id="td6">재조합빈도와 지도거리 — 세는 법, 재는 법, 그리고 천장</title><desc id="dd6">위 띠는 검정교배 자손 네 무리를 막대로 세운 것이다. 앞의 두 무리가 높고(부모형 410과 405) 뒤의 두 무리가 낮으며(재조합형 90과 95), 옆 상자에서 재조합형을 전체로 나눠 18.5퍼센트를 얻는다. 가운데 띠는 초파리 지도 자로 0부터 104.5까지 일곱 자리에 유전자가 찍혀 있고, 48.5와 57.5 사이 9.0, 57.5와 67.0 사이 9.5를 더하면 48.5와 67.0 사이 18.5가 됨을 보인다. 아래 띠는 지도거리에 대한 실제 관측 재조합빈도 곡선으로, 짧은 거리에서는 점선인 자 눈금과 거의 겹치다가 멀어질수록 아래로 벌어지고 50퍼센트 선에 붙어 더 오르지 않는다.</desc><line x1="14" y1="244" x2="866" y2="244" stroke="#E5E7EB" stroke-width="1.3"/><line x1="14" y1="466" x2="866" y2="466" stroke="#E5E7EB" stroke-width="1.3"/><text x="14" y="26" text-anchor="start" font-size="12.5" font-weight="700" fill="#9CA3AF">A. 검정교배 자손 네 무리</text><rect x="84" y="64" width="62" height="132" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.4"/><text x="115" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#115E59">410</text><rect x="172" y="65.6098" width="62" height="130.39" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.4"/><text x="203" y="56.6098" text-anchor="middle" font-size="13" font-weight="700" fill="#115E59">405</text><rect x="260" y="167.024" width="62" height="28.9756" rx="4" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.4"/><text x="291" y="158.024" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412">90</text><rect x="348" y="165.415" width="62" height="30.5854" rx="4" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.4"/><text x="379" y="156.415" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412">95</text><path d="M84 204 L84 212 L234 212 L234 204" fill="none" stroke="#9CA3AF" stroke-width="1.4"/><text x="159" y="229" text-anchor="middle" font-size="11.5" font-weight="700" fill="#115E59">부모형 — 많다</text><path d="M260 204 L260 212 L410 212 L410 204" fill="none" stroke="#9CA3AF" stroke-width="1.4"/><text x="335" y="229" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">재조합형 — 적다</text><line x1="72" y1="196" x2="422" y2="196" stroke="#9CA3AF" stroke-width="1.6"/><rect x="470" y="46" width="386" height="176" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.3"/><text x="663" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">재조합빈도(교차율)</text><text x="663" y="104" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6B7280">재조합형 수 ÷ 전체 수 × 100</text><line x1="506" y1="120" x2="820" y2="120" stroke="#E5E7EB" stroke-width="1.2"/><text x="663" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">(90 + 95) ÷ 1000 × 100</text><text x="663" y="178" text-anchor="middle" font-size="21" font-weight="700" fill="#9A3412">= 18.5 %</text><text x="663" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7280">★ 1 % = 1 cM 이므로 곧 18.5 cM</text><text x="14" y="268" text-anchor="start" font-size="12.5" font-weight="700" fill="#9CA3AF">B. 초파리 지도 자 — 눈금이 곧 위치다</text><line x1="96" y1="320" x2="806" y2="320" stroke="#6B7280" stroke-width="2.4" stroke-linecap="round"/><line x1="96" y1="311" x2="96" y2="329" stroke="#374151" stroke-width="1.8"/><circle cx="96" cy="320" r="5.5" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><text x="96" y="304" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">0</text><text x="96" y="346" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6B7280">짧은 더듬이</text><line x1="208.105" y1="311" x2="208.105" y2="329" stroke="#374151" stroke-width="1.8"/><circle cx="208.105" cy="320" r="5.5" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><text x="208.105" y="304" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">16.5</text><text x="208.105" y="363" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6B7280">고동색 눈</text><line x1="425.522" y1="311" x2="425.522" y2="329" stroke="#374151" stroke-width="1.8"/><circle cx="425.522" cy="320" r="5.5" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><text x="425.522" y="304" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">48.5</text><text x="425.522" y="346" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6B7280">검은 몸</text><line x1="486.67" y1="311" x2="486.67" y2="329" stroke="#374151" stroke-width="1.8"/><circle cx="486.67" cy="320" r="5.5" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><text x="486.67" y="304" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">57.5</text><text x="486.67" y="363" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6B7280">주홍색 눈</text><line x1="551.215" y1="311" x2="551.215" y2="329" stroke="#374151" stroke-width="1.8"/><circle cx="551.215" cy="320" r="5.5" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><text x="551.215" y="304" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">67</text><text x="551.215" y="346" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6B7280">흔적 날개</text><line x1="608.967" y1="311" x2="608.967" y2="329" stroke="#374151" stroke-width="1.8"/><circle cx="608.967" cy="320" r="5.5" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><text x="608.967" y="304" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">75.5</text><text x="608.967" y="363" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6B7280">아래로 휜 날개</text><line x1="806" y1="311" x2="806" y2="329" stroke="#374151" stroke-width="1.8"/><circle cx="806" cy="320" r="5.5" fill="#14B8A6" stroke="#0F766E" stroke-width="1.6"/><text x="806" y="304" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">104.5</text><text x="806" y="346" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6B7280">갈색 눈</text><path d="M425.522 396 L486.67 396" stroke="#C2410C" stroke-width="1.6" fill="none"/><path d="M425.522 392 L425.522 400 M486.67 392 L486.67 400" stroke="#C2410C" stroke-width="1.6"/><text x="456.096" y="388" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9A3412">9.0</text><path d="M486.67 396 L551.215 396" stroke="#C2410C" stroke-width="1.6" fill="none"/><path d="M551.215 392 L551.215 400" stroke="#C2410C" stroke-width="1.6"/><text x="518.943" y="388" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9A3412">9.5</text><path d="M425.522 424 L551.215 424" stroke="#0F766E" stroke-width="1.8" fill="none"/><path d="M425.522 420 L425.522 428 M551.215 420 L551.215 428" stroke="#0F766E" stroke-width="1.8"/><text x="488.368" y="446" text-anchor="middle" font-size="11" font-weight="700" fill="#115E59">67.0 − 48.5 = 18.5 = 9.0 + 9.5</text><text x="806" y="446" text-anchor="end" font-size="11" font-weight="700" fill="#6B7280">단위 = map unit (cM)</text><text x="14" y="490" text-anchor="start" font-size="12.5" font-weight="700" fill="#9CA3AF">C. 지도거리와 실제 관측 재조합빈도</text><line x1="128" y1="738" x2="748" y2="738" stroke="#6B7280" stroke-width="1.6"/><line x1="128" y1="738" x2="128" y2="524" stroke="#6B7280" stroke-width="1.6"/><text x="438" y="778" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7280">지도거리 (cM)</text><text x="86" y="631" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7280" transform="rotate(-90 86 631)">관측 재조합빈도 (%)</text><line x1="128" y1="738" x2="128" y2="744" stroke="#6B7280" stroke-width="1.2"/><text x="128" y="758" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">0</text><line x1="252" y1="738" x2="252" y2="744" stroke="#6B7280" stroke-width="1.2"/><text x="252" y="758" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">50</text><line x1="376" y1="738" x2="376" y2="744" stroke="#6B7280" stroke-width="1.2"/><text x="376" y="758" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">100</text><line x1="500" y1="738" x2="500" y2="744" stroke="#6B7280" stroke-width="1.2"/><text x="500" y="758" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">150</text><line x1="624" y1="738" x2="624" y2="744" stroke="#6B7280" stroke-width="1.2"/><text x="624" y="758" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">200</text><line x1="748" y1="738" x2="748" y2="744" stroke="#6B7280" stroke-width="1.2"/><text x="748" y="758" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7280">250</text><line x1="122" y1="738" x2="128" y2="738" stroke="#6B7280" stroke-width="1.2"/><text x="116" y="742" text-anchor="end" font-size="10.5" font-weight="700" fill="#6B7280">0</text><line x1="122" y1="648.833" x2="128" y2="648.833" stroke="#6B7280" stroke-width="1.2"/><text x="116" y="652.833" text-anchor="end" font-size="10.5" font-weight="700" fill="#6B7280">25</text><line x1="122" y1="559.667" x2="128" y2="559.667" stroke="#6B7280" stroke-width="1.2"/><text x="116" y="563.667" text-anchor="end" font-size="10.5" font-weight="700" fill="#6B7280">50</text><line x1="128" y1="559.667" x2="748" y2="559.667" stroke="#C2410C" stroke-width="1.6" stroke-dasharray="7 5"/><text x="748" y="549.667" text-anchor="end" font-size="11.5" font-weight="700" fill="#9A3412">★ 이론적 최대 50 % — 못 넘는다</text><line x1="128" y1="738" x2="276.8" y2="524" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="4 4"/><text x="242.08" y="538.267" text-anchor="start" font-size="10.5" font-weight="700" fill="#9CA3AF">자 눈금 그대로라면</text><path d="M128 738 L137.92 724.289 L147.84 711.632 L157.76 699.949 L167.68 689.163 L177.6 679.207 L187.52 670.016 L197.44 661.532 L207.36 653.7 L217.28 646.471 L227.2 639.797 L237.12 633.636 L247.04 627.949 L256.96 622.699 L266.88 617.853 L276.8 613.38 L286.72 609.25 L296.64 605.438 L306.56 601.919 L316.48 598.67 L326.4 595.672 L336.32 592.903 L346.24 590.348 L356.16 587.989 L366.08 585.812 L376 583.801 L385.92 581.946 L395.84 580.233 L405.76 578.652 L415.68 577.192 L425.6 575.845 L435.52 574.601 L445.44 573.453 L455.36 572.393 L465.28 571.414 L475.2 570.511 L485.12 569.677 L495.04 568.908 L504.96 568.197 L514.88 567.541 L524.