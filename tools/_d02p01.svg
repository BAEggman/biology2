<svg viewBox="0 0 880 496" role="img" aria-labelledby="t4 d4d">
    <title id="t4">상위 세 유형과 치사유전자 — 같은 16칸 틀에서 무엇이 달라지는가</title>
    <desc id="d4d">9:3:3:1의 16칸 격자 네 장. 칸 색은 표현형, 굵은 테두리는 겉으로 하나가 된 칸들이다. 보족은 오른쪽 열과 아랫줄을 잇는 L자 테두리로 3+3+1=7을 묶는다. 아래에 같은 16칸 틀의 치사 격자 두 장을 두어 한 칸이 검게 죽으면 12:4=3:1이 8:4=2:1이 되는 것을 나란히 보인다.</desc>

    <g font-size="12.5" font-weight="700" text-anchor="middle" fill="#4B5563">
      <text x="105" y="24">정상 (상위 없음)</text>
      <text x="315" y="24">열성 상위</text>
      <text x="525" y="24">우성 상위</text>
      <text x="740" y="24">보족 유전자</text>
    </g>

    <!-- 정상 (상위 없음) -->
    <g>
      <rect x="57" y="40" width="72" height="72" fill="#CCFBF1"/>
      <rect x="129" y="40" width="24" height="72" fill="#FFEDD5"/>
      <rect x="57" y="112" width="72" height="24" fill="#DBEAFE"/>
      <rect x="129" y="112" width="24" height="24" fill="#F3F4F6"/>
      <g stroke="#E5E7EB" stroke-width="0.9"><line x1="81" y1="40" x2="81" y2="136"/><line x1="105" y1="40" x2="105" y2="136"/><line x1="129" y1="40" x2="129" y2="136"/><line x1="57" y1="64" x2="153" y2="64"/><line x1="57" y1="88" x2="153" y2="88"/><line x1="57" y1="112" x2="153" y2="112"/></g>
      <g fill="none" stroke="#9CA3AF" stroke-width="1.3"><rect x="57" y="40" width="72" height="72"/><rect x="129" y="40" width="24" height="72"/><rect x="57" y="112" width="72" height="24"/><rect x="129" y="112" width="24" height="24"/></g>
      <text x="93" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="#115E59">9</text>
      <text x="141" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C">3</text>
      <text x="93" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">3</text>
      <text x="141" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#4B5563">1</text>
    </g>
    <text x="105" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#9CA3AF">합쳐짐 없음</text>
    <text x="105" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">9 : 3 : 3 : 1</text>
    <text x="105" y="201" text-anchor="middle" font-size="11.5" fill="#6B7280">네 칸이 각각 다른 표현형</text>
    <text x="105" y="218" text-anchor="middle" font-size="11" fill="#6B7280">나머지 셋의 기준선</text>

    <!-- 열성 상위 -->
    <g>
      <rect x="267" y="40" width="72" height="72" fill="#CCFBF1"/>
      <rect x="339" y="40" width="24" height="72" fill="#FFEDD5"/>
      <rect x="267" y="112" width="72" height="24" fill="#DBEAFE"/>
      <rect x="339" y="112" width="24" height="24" fill="#F3F4F6"/>
      <g stroke="#E5E7EB" stroke-width="0.9"><line x1="291" y1="40" x2="291" y2="136"/><line x1="315" y1="40" x2="315" y2="136"/><line x1="339" y1="40" x2="339" y2="136"/><line x1="267" y1="64" x2="363" y2="64"/><line x1="267" y1="88" x2="363" y2="88"/><line x1="267" y1="112" x2="363" y2="112"/></g>
      <g fill="none" stroke="#9CA3AF" stroke-width="1.3"><rect x="267" y="40" width="72" height="72"/><rect x="339" y="40" width="24" height="72"/><rect x="267" y="112" width="72" height="24"/><rect x="339" y="112" width="24" height="24"/></g>
      <text x="303" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="#115E59">9</text>
      <text x="351" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C">3</text>
      <text x="303" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">3</text>
      <text x="351" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#4B5563">1</text>
      <rect x="267" y="112" width="96" height="24" fill="none" stroke="#111827" stroke-width="2.6"/>
    </g>
    <text x="315" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">3 + 1 = 4</text>
    <text x="315" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">9 : 3 : 4</text>
    <text x="315" y="201" text-anchor="middle" font-size="11.5" fill="#6B7280">아랫줄 두 칸이 합쳐짐</text>
    <text x="315" y="218" text-anchor="middle" font-size="11" fill="#6B7280">래브라도 털색</text>

    <!-- 우성 상위 -->
    <g>
      <rect x="477" y="40" width="72" height="72" fill="#CCFBF1"/>
      <rect x="549" y="40" width="24" height="72" fill="#FFEDD5"/>
      <rect x="477" y="112" width="72" height="24" fill="#DBEAFE"/>
      <rect x="549" y="112" width="24" height="24" fill="#F3F4F6"/>
      <g stroke="#E5E7EB" stroke-width="0.9"><line x1="501" y1="40" x2="501" y2="136"/><line x1="525" y1="40" x2="525" y2="136"/><line x1="549" y1="40" x2="549" y2="136"/><line x1="477" y1="64" x2="573" y2="64"/><line x1="477" y1="88" x2="573" y2="88"/><line x1="477" y1="112" x2="573" y2="112"/></g>
      <g fill="none" stroke="#9CA3AF" stroke-width="1.3"><rect x="477" y="40" width="72" height="72"/><rect x="549" y="40" width="24" height="72"/><rect x="477" y="112" width="72" height="24"/><rect x="549" y="112" width="24" height="24"/></g>
      <text x="513" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="#115E59">9</text>
      <text x="561" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C">3</text>
      <text x="513" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">3</text>
      <text x="561" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#4B5563">1</text>
      <rect x="477" y="40" width="96" height="72" fill="none" stroke="#111827" stroke-width="2.6"/>
    </g>
    <text x="525" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">9 + 3 = 12</text>
    <text x="525" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">12 : 3 : 1</text>
    <text x="525" y="201" text-anchor="middle" font-size="11.5" fill="#6B7280">윗줄 두 칸이 합쳐짐</text>
    <text x="525" y="218" text-anchor="middle" font-size="11" fill="#6B7280">호박 열매색</text>

    <!-- 보족 유전자 -->
    <g>
      <rect x="692" y="40" width="72" height="72" fill="#CCFBF1"/>
      <rect x="764" y="40" width="24" height="72" fill="#FFEDD5"/>
      <rect x="692" y="112" width="72" height="24" fill="#DBEAFE"/>
      <rect x="764" y="112" width="24" height="24" fill="#F3F4F6"/>
      <g stroke="#E5E7EB" stroke-width="0.9"><line x1="716" y1="40" x2="716" y2="136"/><line x1="740" y1="40" x2="740" y2="136"/><line x1="764" y1="40" x2="764" y2="136"/><line x1="692" y1="64" x2="788" y2="64"/><line x1="692" y1="88" x2="788" y2="88"/><line x1="692" y1="112" x2="788" y2="112"/></g>
      <g fill="none" stroke="#9CA3AF" stroke-width="1.3"><rect x="692" y="40" width="72" height="72"/><rect x="764" y="40" width="24" height="72"/><rect x="692" y="112" width="72" height="24"/><rect x="764" y="112" width="24" height="24"/></g>
      <text x="728" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="#115E59">9</text>
      <text x="776" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C">3</text>
      <text x="728" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">3</text>
      <text x="776" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#4B5563">1</text>
      <path d="M 692 112 L 764 112 L 764 40 L 788 40 L 788 136 L 692 136 Z" fill="none" stroke="#111827" stroke-width="2.6" stroke-linejoin="round"/>
    </g>
    <text x="740" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">3 + 3 + 1 = 7</text>
    <text x="740" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">9 : 7</text>
    <text x="740" y="201" text-anchor="middle" font-size="11.5" fill="#6B7280">9를 뺀 나머지가 전부 합쳐짐</text>
    <text x="740" y="218" text-anchor="middle" font-size="11" fill="#6B7280">스위트피 꽃색</text>

    <!-- 범례: 굵은 테두리의 뜻 -->
    <g>
      <rect x="274" y="234" width="14" height="14" fill="#DBEAFE" stroke="#9CA3AF" stroke-width="0.9"/>
      <rect x="288" y="234" width="14" height="14" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="0.9"/>
      <rect x="274" y="234" width="28" height="14" fill="none" stroke="#111827" stroke-width="2.2"/>
      <text x="312" y="245" font-size="10.5" fill="#6B7280">굵은 테두리로 묶인 칸 = 겉으로 같은 한 표현형 (칸 색·유전자형은 그대로)</text>
    </g>
    <text x="440" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4B5563">합계는 항상 16 — 어느 칸이 뭉치는지만 다르다</text>

    <line x1="40" y1="292" x2="840" y2="292" stroke="#E5E7EB" stroke-width="1"/>

    <!-- 치사유전자 — 같은 16칸 틀, 한 칸이 죽는다 -->
    <defs>
      <marker id="d02p01ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#111827"/>
      </marker>
    </defs>
    <text x="272" y="318" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4B5563">치사유전자 — 같은 16칸 틀, 한 칸이 죽는다</text>
    <text x="272" y="336" text-anchor="middle" font-size="10.5" fill="#6B7280">우성 동형접합 AA가 죽어 3 : 1 이 2 : 1 이 된다</text>

    <g>
      <rect x="104" y="348" width="48" height="48" fill="#CCFBF1"/>
      <rect x="152" y="348" width="48" height="48" fill="#CCFBF1"/>
      <rect x="104" y="396" width="48" height="48" fill="#CCFBF1"/>
      <rect x="152" y="396" width="48" height="48" fill="#F3F4F6"/>
      <g stroke="#E5E7EB" stroke-width="0.9"><line x1="128" y1="348" x2="128" y2="444"/><line x1="152" y1="348" x2="152" y2="444"/><line x1="176" y1="348" x2="176" y2="444"/><line x1="104" y1="372" x2="200" y2="372"/><line x1="104" y1="396" x2="200" y2="396"/><line x1="104" y1="420" x2="200" y2="420"/></g>
      <g fill="none" stroke="#9CA3AF" stroke-width="1.3"><rect x="104" y="348" width="48" height="48"/><rect x="152" y="348" width="48" height="48"/><rect x="104" y="396" width="48" height="48"/><rect x="152" y="396" width="48" height="48"/></g>
      <text x="128" y="373" text-anchor="middle" font-size="13" font-weight="700" fill="#115E59">AA</text>
      <text x="128" y="387" text-anchor="middle" font-size="9.5" fill="#6B7280">4/16</text>
      <text x="176" y="373" text-anchor="middle" font-size="13" font-weight="700" fill="#115E59">Aa</text>
      <text x="176" y="387" text-anchor="middle" font-size="9.5" fill="#6B7280">4/16</text>
      <text x="128" y="421" text-anchor="middle" font-size="13" font-weight="700" fill="#115E59">Aa</text>
      <text x="128" y="435" text-anchor="middle" font-size="9.5" fill="#6B7280">4/16</text>
      <text x="176" y="421" text-anchor="middle" font-size="13" font-weight="700" fill="#4B5563">aa</text>
      <text x="176" y="435" text-anchor="middle" font-size="9.5" fill="#6B7280">4/16</text>
    </g>
    <text x="152" y="466" text-anchor="middle" font-size="13.5" font-weight="700" fill="#374151">12 : 4 = 3 : 1</text>
    <text x="152" y="484" text-anchor="middle" font-size="10.5" fill="#6B7280">살아 있는 칸 16</text>

    <line x1="216" y1="396" x2="326" y2="396" stroke="#111827" stroke-width="2" marker-end="url(#d02p01ar)"/>
    <text x="272" y="384" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">AA 한 칸이 죽는다</text>

    <g>
      <rect x="344" y="348" width="48" height="48" fill="#CCFBF1"/>
      <rect x="392" y="348" width="48" height="48" fill="#CCFBF1"/>
      <rect x="344" y="396" width="48" height="48" fill="#CCFBF1"/>
      <rect x="392" y="396" width="48" height="48" fill="#F3F4F6"/>
      <g stroke="#E5E7EB" stroke-width="0.9"><line x1="368" y1="348" x2="368" y2="444"/><line x1="392" y1="348" x2="392" y2="444"/><line x1="416" y1="348" x2="416" y2="444"/><line x1="344" y1="372" x2="440" y2="372"/><line x1="344" y1="396" x2="440" y2="396"/><line x1="344" y1="420" x2="440" y2="420"/></g>
