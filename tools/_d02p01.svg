    <text x="392" y="466" text-anchor="middle" font-size="13.5" font-weight="700" fill="#374151">8 : 4 = 2 : 1</text>
    <text x="392" y="484" text-anchor="middle" font-size="10.5" fill="#6B7280">살아 있는 칸 12</text>

    <rect x="476" y="348" width="390" height="96" rx="5" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="496" y="374" font-size="11.5" font-weight="700" fill="#7C2D12">여기만 합계가 16이 아니다</text>
    <text x="496" y="396" font-size="11" fill="#6B7280">살아남는 칸이 16에서 12로 준다</text>
    <text x="496" y="416" font-size="11" fill="#6B7280">분모가 4에서 3으로 — 그래서 2 : 1</text>
    <text x="496" y="436" font-size="11" fill="#6B7280">비율의 합이 이상하면 죽은 칸을 본다</text>
  </svg>