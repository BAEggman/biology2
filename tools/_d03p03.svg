<svg viewBox="0 0 880 300" role="img" aria-labelledby="t9 d9d">
    <title id="t9">저해 유형별 라인위버-버크 도표</title>
    <desc id="d9d">경쟁적·비경쟁적·무경쟁적 저해를 대조선과 겹쳐 그린 세 개의 이중역수 도표. 경쟁적은 대조선과 y절편이 같고 기울기만 가파르며, 비경쟁적은 x절편이 같고, 무경쟁적은 평행하다. 첫 칸에는 y절편 1/Vmax, x절편 −1/Km, 기울기 Km/Vmax를 표시했다. x절편은 모두 원점 왼쪽에 있다.</desc>

    <!-- 공통 범례 -->
    <line x1="352" y1="18" x2="376" y2="18" stroke="#9CA3AF" stroke-width="2"/>
    <text x="382" y="22" font-size="10.5" fill="#6B7280">저해 없음 (대조선)</text>

    <!-- ================= 경쟁적 ================= -->
    <g>
      <line x1="10" y1="200" x2="245" y2="200" stroke="#9CA3AF"/>
      <line x1="145" y1="50" x2="145" y2="216" stroke="#9CA3AF"/>
      <text x="145" y="42" text-anchor="middle" font-size="11" fill="#6B7280">1/V</text>
      <text x="255" y="204" font-size="11" fill="#6B7280">1/[S]</text>

      <!-- 기울기 삼각형 (대조선 위) -->
      <g stroke="#6B7280" stroke-width="1.2" fill="none">
        <path d="M185 140 L245 140 L245 110"/>
      </g>
      <text x="190" y="153" font-size="10.5" fill="#6B7280">기울기</text>
      <text x="190" y="167" font-size="10.5" fill="#6B7280">= Km/Vmax</text>

      <!-- 두 선 — y절편 공통, 저해선이 더 가파름 -->
      <line x1="65" y1="200" x2="245" y2="110" stroke="#9CA3AF" stroke-width="2"/>
      <line x1="95" y1="200" x2="245" y2="80" stroke="#C2410C" stroke-width="2.5"/>

      <!-- y절편 = 1/Vmax (두 선의 공통 절편) -->
      <line x1="100" y1="160" x2="139" y2="160" stroke="#9CA3AF" stroke-dasharray="3 3"/>
      <circle cx="145" cy="160" r="5" fill="#C2410C"/>
      <text x="136" y="149" text-anchor="end" font-size="10.5" fill="#6B7280">y절편 = 1/Vmax</text>

      <!-- x절편 = −1/Km -->
      <circle cx="65" cy="200" r="4" fill="#6B7280"/>
      <line x1="95" y1="195" x2="95" y2="205" stroke="#C2410C" stroke-width="2"/>
      <text x="65" y="216" text-anchor="middle" font-size="10.5" fill="#6B7280">x절편</text>
      <text x="65" y="230" text-anchor="middle" font-size="10.5" fill="#6B7280">= −1/Km</text>
      <text x="102" y="216" font-size="10.5" fill="#C2410C">Km↑</text>

      <text x="145" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#C2410C">경쟁적</text>
      <text x="145" y="272" text-anchor="middle" font-size="11" fill="#4B5563">y축에서 만난다</text>
      <text x="145" y="290" text-anchor="middle" font-size="11" fill="#4B5563">Vmax 불변 · Km↑</text>
    </g>

    <!-- ================= 비경쟁적 ================= -->
    <g>
      <line x1="302" y1="200" x2="537" y2="200" stroke="#9CA3AF"/>
      <line x1="437" y1="50" x2="437" y2="216" stroke="#9CA3AF"/>
      <text x="437" y="42" text-anchor="middle" font-size="11" fill="#6B7280">1/V</text>
      <text x="547" y="204" font-size="11" fill="#6B7280">1/[S]</text>

      <line x1="357" y1="200" x2="537" y2="110" stroke="#9CA3AF" stroke-width="2"/>
      <line x1="357" y1="200" x2="537" y2="65" stroke="#1E40AF" stroke-width="2.5"/>
      <circle cx="357" cy="200" r="5" fill="#1E40AF"/>

      <text x="437" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E40AF">비경쟁적</text>
      <text x="437" y="272" text-anchor="middle" font-size="11" fill="#4B5563">x축에서 만난다</text>
      <text x="437" y="290" text-anchor="middle" font-size="11" fill="#4B5563">Vmax↓ · Km 불변</text>
    </g>

    <!-- ================= 무경쟁적 ================= -->
    <g>
      <line x1="594" y1="200" x2="829" y2="200" stroke="#9CA3AF"/>
      <line x1="729" y1="50" x2="729" y2="216" stroke="#9CA3AF"/>
      <text x="729" y="42" text-anchor="middle" font-size="11" fill="#6B7280">1/V</text>
      <text x="839" y="204" font-size="11" fill="#6B7280">1/[S]</text>

      <line x1="649" y1="200" x2="829" y2="110" stroke="#9CA3AF" stroke-width="2"/>
      <line x1="609" y1="200" x2="829" y2="90" stroke="#115E59" stroke-width="2.5"/>

      <text x="729" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#115E59">무경쟁적</text>
      <text x="729" y="272" text-anchor="middle" font-size="11" fill="#4B5563">평행 — 만나지 않는다</text>
      <text x="729" y="290" text-anchor="middle" font-size="11" fill="#4B5563">Vmax↓ · Km↓</text>
    </g>
  </svg>