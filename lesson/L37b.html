<script>
const L = {"id":"L37b","scene":"s37","part":"b","title":"다락 구석의 두 짚끈 뭉치 — 성긴 흰 깃발 · 빽빽한 뽑힌 깃발: 진정 · 이질염색질과 아세틸화","sub":"같은 끈 뭉치 둘(접힘의 차이) · 성긴 옅은 노랑 뭉치 + 팔 + 종이띠 내는 기계(진정염색질 · 밝게 · 발현) · 빽빽한 짙은 뭉치 + 막힌 손 + 멈춘 기계(이질염색질 · 진하게 · 억제) · 흰 깃발(아세틸화 · 촉진) · 뽑힌 깃발(탈아세틸화 · 억제) · 곁탁자 닫힌 맨 고리 vs 통 꿴 토막(세균 · 진핵 · 고세균은 일부 종에 히스톤 있음)","img":"img/L37b.webp?v=de5732ee2440","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"짚 공방 다락의 다른 구석 — 똑같은 낮은 걸상 둘에 비슷한 크기의 짚끈 뭉치가 하나씩 · 왼쪽 뭉치 틈으로 끈 사이사이에 든 작은 나무 통들이 보인다 · 다른 것은 틈 · 색 · 깃발 셋뿐 (틀)","fact":"염색질은 같은 것 — 얼마나 접혔느냐가 읽히느냐를 가른다","hook":"같은 끈 뭉치 둘 · 틈 · 색 · 깃발만 다름 = 접힘의 차이","say":"짚 공방 다락의 다른 구석을 보자. 같은 낮은 걸상 두 개 위에 비슷한 크기의 짚끈 뭉치가 놓였다. 왼쪽의 틈 사이로 보이는 작은 나무 통은 앞서 본 뉴클레오솜이다. 오른쪽도 같은 끈과 통으로 이루어졌으므로 둘 다 염색질이다. 다른 것은 틈, 색, 깃발, 이 셋뿐이다. 같은 염색질이 얼마나 조밀하게 접혔는지가 그 안의 유전자가 읽히는지 읽히지 않는지를 가른다. 염색질 수준의 조절은 DNA에 접근할 수 있는지를, 전사 개시 조절은 그 자리에 전사 기계를 모으는 일을 조절한다. 간기의 염색질도 핵 안에 무작위로 흩어져 있는 것이 아니라 각각 일정한 영역, 즉 영토를 차지한다.","box":null,"src":["s37p02#0"],"cards":["F1-94","E1-114"]},{"sid":"s2","obj":"왼쪽 — 틈이 넓은 성긴 뭉치(안의 통들이 들여다보인다) · 일꾼이 팔을 어깨 가까이까지 밀어 넣고 끈 고리를 꺼낸다 · 그 끈이 회색 인쇄 기계 위 구멍으로 들어가고 기계 앞으로 종이띠가 나온다","fact":"진정염색질 — 덜 응축 · 접근이 쉬워 전사(발현)가 잘 된다","hook":"성긴 뭉치 · 팔이 쑥 · 종이띠 = 진정염색질 · 진짜로 일함 = 진정","say":"왼쪽 뭉치는 성기게 감겨 틈이 넓고 안의 통들이 보인다. 일꾼이 팔을 깊이 넣어 끈 고리를 꺼내면, 끈이 회색 인쇄 기계 위쪽 구멍으로 들어가고 앞에서는 종이띠가 나온다. 인쇄 기계는 RNA 중합효소, 종이띠는 전사된 RNA이다. 덜 응축되어 효소가 접근하기 쉽고 전사와 발현이 활발한 진정염색질이다. 진짜로 일하는 쪽이라는 연결을 사용하자. 진정의 진은 참이라는 뜻이고, 유크로마틴의 유도 참을 뜻한다.","box":[[120,240,520,520],[600,520,420,560]],"src":["s37p02#1"],"cards":["E1-109","F1-50"]},{"sid":"s3","obj":"왼쪽 뭉치는 옅은 노랑","fact":"진정염색질은 밝게(연하게) 염색된다","hook":"옅은 노랑 = 밝게 염색 = 진정","say":"왼쪽 뭉치의 옅은 노란색을 보자. 진정염색질은 염색했을 때 연하고 밝게 보인다. 느슨하고 밝은 쪽은 진정염색질, 빽빽하고 진한 쪽은 이질염색질이다. 시험에서 가장 즐겨 묻는 이름을 뒤바꾼 선지에 대비해 색과 조밀함을 함께 묶어 두자.","box":[[120,240,500,500]],"src":["s37p02#2"],"cards":["E1-111"]},{"sid":"s4","obj":"오른쪽 — 같은 끈이 빈틈없이 감긴 짙은 갈색 뭉치 · 일꾼이 손바닥을 대 보지만 표면에서 막혀 머리를 긁는다 · 곁의 같은 인쇄 기계는 종이 없이 멈췄다","fact":"이질염색질 — 더 응축 · 접근성 낮음 · 진하게 염색 · 전사에 불리","hook":"빽빽한 짙은 뭉치 · 막힌 손 · 멈춘 기계 = 이질염색질 · 딴 물건처럼 굳음 = 이질","say":"오른쪽은 같은 끈을 빈틈없이 감은 짙은 갈색 뭉치다. 일꾼은 손을 넣지 못하고 표면에 손바닥만 댄 채 머리를 긁는다. 옆 인쇄 기계에서도 종이가 나오지 않는다. 더 응축되어 접근성이 낮고 진하게 염색되며 전사에 불리한 이질염색질이다. 이질의 이는 다르다는 뜻이다. 같은 끈이 다른 물건처럼 단단해졌다는 연결이며, 헤테로크로마틴의 헤테로도 다름을 뜻한다.","box":[[890,190,620,560],[1350,820,250,240]],"src":["s37p02#3"],"cards":["E1-110","F1-51"]},{"sid":"s5","obj":"왼쪽 뭉치 곳곳에 꽂힌 작은 흰 깃발들","fact":"히스톤 아세틸화 — 양전하를 가려 DNA 를 덜 붙듦 → 느슨 · 전사 촉진","hook":"흰 깃발(항복) = 아세틸화 · 히스톤이 끈을 놓아준다","say":"왼쪽 뭉치 곳곳에 꽂힌 작은 흰 깃발은 히스톤 아세틸화다. 항복의 흰 깃발이 꽂히면 히스톤이 끈을 놓아준다고 연결하자. 아세틸기가 히스톤 꼬리의 양전하를 가려 음전하의 DNA를 덜 끌어당긴다. 뉴클레오솜 사이 결합이 약해지고 염색질이 느슨해져 DNA 접근성과 전사가 증가한다. 히스톤 꼬리의 대표 변형에는 아세틸화, 메틸화, 인산화가 있다. 이 꼬리는 뉴클레오솜 밖으로 나온 히스톤의 N 말단 영역이다.","box":[[90,180,520,520]],"src":["s37p02#4"],"cards":["E1-112#1","F1-54#1","F1-55","F1-57","F1-53"]},{"sid":"s6","obj":"오른쪽 뭉치엔 깃발이 하나도 없고 · 걸상 둘레 바닥에 뽑힌 흰 깃발들이 흩어졌다","fact":"탈아세틸화 — 깃발이 빠진 만큼 응축 · 전사 억제","hook":"뽑혀 흩어진 깃발 = 탈아세틸화 · 다시 조임","say":"오른쪽 뭉치에는 깃발이 없고, 뽑힌 흰 깃발들이 걸상 주변 바닥에 흩어져 있다. 탈아세틸화다. 깃발을 뽑자 히스톤이 DNA를 다시 강하게 붙잡아 응축되고 전사가 억제된다. 아세틸화는 느슨하게 하여 촉진, 탈아세틸화는 조밀하게 하여 억제한다는 짝을 기억하자.","box":[[890,250,470,500],[880,840,440,240]],"src":["s37p02#5"],"cards":["E1-112#2","E1-112"]},{"sid":"s7","obj":"오른쪽 곁탁자 — 통 없는 맨 끈이 이음매 없이 둥근 고리 하나 · 그 옆에 작은 통들을 꿴 끈 토막(끝이 풀려 탁자 아래로 늘어짐)","fact":"세균 = 히스톤 없음 · 환형 / 진핵 = 히스톤 · 선형 (⚠ 고세균은 일부 종에 히스톤 있음)","hook":"통 없는 닫힌 고리 = 세균 · 통 꿴 끝 풀린 토막 = 진핵","say":"오른쪽 곁탁자의 두 끈을 비교하자. 하나는 통 없이 이어진 둥근 고리이고, 다른 하나는 작은 통들이 꿰어진 끈으로 양끝이 탁자 아래로 늘어진다. 통은 히스톤으로, 진핵세포에는 있고 세균에는 없다. 닫힌 고리는 세균의 환형 염색체, 열린 끝은 진핵의 선형 염색체와 연결한다. 원핵생물에는 히스톤이 없다는 일반 설명은 보통 세균을 가리킨다는 점에 주의하자. 고세균은 원핵생물이지만 일부 종에 히스톤이 있다. 세 영역을 비교하면 세균에는 없음, 고세균 일부 종에는 있음, 진핵생물에는 있음이다.","box":[[1580,480,450,330]],"src":["s37p02#6"],"cards":["E1-106"]},{"sid":"s8","obj":"오른쪽 아래 바닥 — 꽃 모양 고무도장으로 짚끈에 꽃을 꾹꾹 찍는 무릎 꿇은 꼬마 일꾼 · 발치에 분홍 잉크가 묻은 초록 잎(도장 받침) · 분홍 꽃 자국이 찍힌 끈 위에서 멈춰 선 작은 회색 인쇄 기계(종이 없음 · 거미줄)","fact":"DNA 메틸화 — 전사 억제 · 발생 중 발현 패턴 고정 · 엽산 = 메틸기 공급 · 억제유전자 침묵 → 암","hook":"꽃 도장 = 메틸화(【꽃 도장】) · 끈 = DNA · 꽃 자국에서 멈춘 기계 = 전사 억제 · 잉크 받침인 초록 잎 = 잎 엽(葉), 엽산 → 메틸기 공급","say":"오른쪽 아래에서 무릎을 꿇은 꼬마가 짚끈에 꽃 도장을 찍는다. 꽃 도장은 메틸화이며, DNA에 메틸기를 붙이는 DNA 메틸화다. 꽃이 찍힌 끈 위 인쇄 기계는 멈추고 거미줄까지 생겼다. 메틸화는 대개 전사를 억제한다. 발생 과정에서 조직별로 쓰지 않을 유전자에 이런 표지를 남겨 발현 양상을 안정적으로 굳힌다. 발치의 도장 받침은 분홍 잉크가 묻은 초록 잎이다. 잎 엽에서 엽산을 떠올리자. 산모가 섭취하는 엽산은 메틸기 공급을 통해 메틸화 수준에 영향을 줄 수 있다. 종양억제유전자에 도장이 찍히면 돌연변이가 없어도 발현이 꺼져 암으로 이어질 수 있다.","box":[[1480,900,380,222]],"cards":["F1-56","F1-158","F1-159","F1-146","F1-173"]},{"sid":"s9","obj":"같은 끈의 오른쪽 끝 — 끈이 세로로 갈라져 나란한 두 가닥이 되었고 · 두 가닥 모두 똑같은 자리에 분홍 꽃 자국","fact":"후성유전 — 염기서열 변화 없이 메틸화 양상이 세포분열 뒤에도 유지","hook":"갈라진 두 끈 = 복제된 DNA · 같은 자리의 꽃 = 메틸화 양상이 그대로 물려감 · 끈(염기서열)은 그대로","say":"같은 끈의 오른쪽 끝이 갈라져 두 가닥이 되었고, 두 가닥의 같은 위치에 꽃 자국이 있다. 세포분열에 앞서 DNA가 복제될 때 메틸화 양상도 복사되는 모습이다. 끈 자체인 염기서열은 바뀌지 않아도 발현이 꺼진 상태가 딸세포로 이어진다. 후성유전이다. 그때그때 작동하는 전사 조절과 비교하면, 발현 상태가 세포 세대를 넘어 유지되기 쉽다는 점이 특징이다.","box":[[1840,935,208,110]],"cards":["F1-58","F1-61","F1-99"]},{"sid":"s10","obj":"오른쪽 벽 선반 — 하늘색 물방울 머릿수건을 쓴 엄마 짚 뭉치(꽃 자국 없음)(긴 흰 종이띠가 흘러나옴) · 검은 납작모자를 쓴 아빠 짚 뭉치(온통 분홍 꽃 자국 · 나오는 것 없음) · 선반 끝의 비누 거품 나무통과 솔 · 통 가장자리에 걸친 땋은 짚끈(꽃이 위쪽에만 남고 아래는 씻겨 노랗다) · 거품 둘레에 흩날린 꽃잎","fact":"유전체 각인 — 부모 한쪽 대립유전자만 메틸화로 침묵 · 생식세포에서 지우고 제 성별대로 다시","hook":"엄마 · 아빠 뭉치 = 모계 · 부계 대립유전자 · 아빠 쪽만 꽃 도장 = 한쪽만 메틸화로 침묵 · 엄마 쪽 종이띠 = 그쪽만 발현 · 거품 통에서 꽃을 씻음 = 배우자 형성 때 메틸화를 지움(재설정)","say":"오른쪽 벽 선반에는 짚 뭉치 두 개가 있다. 하늘색 물방울 머릿수건의 엄마 뭉치는 꽃이 없고 긴 흰 종이띠를 내보낸다. 검은 납작모자의 아빠 뭉치는 꽃으로 덮였고 종이가 나오지 않는다. 같은 유전자의 두 대립유전자 중 부모 유래에 따라 한쪽이 메틸화로 꺼지는 유전체 각인이다. 선반 끝의 비눗물 통과 솔도 보자. 통 가장자리에 걸친 끈은 위쪽에만 꽃이 남고 아래는 씻겨 노랗게 드러나며, 주위로 꽃잎이 흩어진다. 배우자를 만드는 과정에서 부모의 메틸화 양상이 대부분 지워지고 그 개체의 성별에 맞게 다시 설정되는 과정을 연결한 장면이다.","box":[[1755,140,260,300]],"cards":["F1-59","F1-160","E0-178"]}],"cq":{"F1-94":["염색질 수준 조절과 전사 개시 조절의 차이는?","전자는 DNA 접근성 자체를, 후자는 전사 기계 모집을 조절한다"],"E1-114":["간기의 염색질은 핵 안에서 어떻게 분포하는가?","무작위가 아니라 일정 영역(영토)을 차지"],"E1-109":["진정염색질(euchromatin)의 특징은?","덜 응축 · 발현 잘 됨 · 밝게 염색"],"F1-50":["염색질이 덜 응축되어 전사에 유리한 상태는?","진정염색질"],"E1-111":["느슨하고 밝게 염색되는 염색질은? (이질염색질과 혼동 주의)","진정염색질(euchromatin)"],"E1-110":["이질염색질(heterochromatin)의 특징은?","더 응축 · 접근성 낮음 · 진하게 염색"],"F1-51":["염색질이 강하게 응축되어 전사에 불리한 상태는?","이질염색질"],"E1-112#1":["히스톤 아세틸화와 탈아세틸화가 전사에 미치는 영향 — 「아세틸화」? (↔ 탈아세틸화)","느슨(촉진)"],"F1-54#1":["히스톤 꼬리에 일어나는 대표 화학적 변형 3가지는?","아세틸화"],"F1-55":["히스톤 아세틸화의 일반적 효과는?","염색질을 느슨하게 하여 전사를 촉진한다"],"F1-57":["히스톤 아세틸화가 전사를 촉진하는 이유를 구조적으로 설명하면?","뉴클레오솜 사이 결합을 약화시켜 DNA 접근성을 높이기 때문"],"F1-53":["히스톤 꼬리(histone tail)란?","뉴클레오솜 밖으로 돌출된 히스톤 N말단 영역"],"E1-112#2":["히스톤 아세틸화와 탈아세틸화가 전사에 미치는 영향 — 「탈아세틸화」? (↔ 아세틸화)","응축(억제)"],"E1-112":["히스톤 아세틸화와 탈아세틸화가 전사에 미치는 영향은?","아세틸화=느슨(촉진) · 탈아세틸화=응축(억제)"],"E1-106":["원핵생물에 히스톤 단백질이 있는가?","세균에는 없다 — 단, 고세균(일부 종)과 진핵세포에는 있다"],"F1-56":["DNA 메틸화의 일반적 효과는?","전사를 억제한다"],"F1-158":["DNA 메틸화가 발생 과정에서 중요한 이유는?","특정 조직에서 특정 유전자 발현 패턴을 안정적으로 유지할 수 있기 때문"],"F1-159":["산모의 엽산 섭취가 후성유전에 영향을 줄 수 있는 이유는?","메틸기 공급을 통해 DNA 메틸화 수준에 영향을 줄 수 있기 때문"],"F1-146":["후성유전 변화도 암에 기여할 수 있는 이유는?","종양억제유전자 발현을 메틸화 등으로 억제할 수 있기 때문"],"F1-173":["후성유전 변화가 돌연변이 없이도 암 관련 유전자에 영향을 주는 이유는?","메틸화 등으로 발현을 켜고 끌 수 있기 때문"],"F1-58":["DNA 메틸화가 세포분열 후에도 유지될 수 있는 현상은?","후성유전"],"F1-61":["후성유전이란?","DNA 염기서열 변화 없이 발현 양상이 세포 세대에 걸쳐 유지되는 현상"],"F1-99":["후성유전과 일반 전사 조절의 차이를 한 문장으로?","후성유전은 발현 상태가 세포 세대에 걸쳐 유지되기 쉽다"],"F1-59":["유전체 각인(genomic imprinting)이란?","모계 또는 부계 대립유전자 중 한쪽의 발현이 선택적으로 조절되는 현상"],"F1-160":["부모의 DNA 메틸화 양상이 배우자 형성 때 대부분 제거되는 이유는?","제 성별에 맞는 각인(난자 → 모계형 · 정자 → 부계형)을 새로 찍어 다음 세대의 발현 프로그램을 재설정하기 위해"],"E0-178":["유전체 각인(genomic imprinting)이란?","같은 대립유전자라도 아버지에게서 왔는지 어머니에게서 왔는지에 따라 발현이 달라지는 현상 · 주된 기작은 DNA 메틸화"]},"hubPanel":"s37p02"};

const ttsNorm = t => TTSNorm.ttsNorm(t, TTS_LEX, TTS_ORDER, L.id);
let speakSeq = 0;

function speak(t, sid) {
  const my = ++speakSeq, at = i;

function go(k) {

// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {

function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
