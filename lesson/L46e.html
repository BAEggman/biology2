<script>
const L = {"id":"L46e","scene":"s46","part":"e","title":"뼈 공방과 터진 호스 수리 — 조혈 · 백혈구 · 혈소판 · 혈액 응고","sub":"뒷방의 갈라 연 거대한 뼈 = 붉은 골수 공방 · 머리에 줄기 난 아주머니(조혈 줄기세포 · 하나는 남고 하나는 분화) · 위 컨베이어(골수성 — 붉은 원반 · 판 조각) / 아래 컨베이어 → 흰 길(림프성 — 장난감 병정 T · 벌 B) · 콩팥 얹은 집의 빈 흰 방울 병 + 지붕 대포의 붉은 신호탄(O₂ 부족 → EPO) · 지팡이 짚은 늙은 원반을 먹는 기린(120일 · 비장 = 지라) · 흰 옷 경비 떼 · 호스 벽을 빠져나가는 경비 · 경보종(백혈구 · 순찰 · 감염 ↑) · 파리채 경비 · 커다란 입의 흰 덩이(호중구 · 대식세포) · 큰 핵 창의 거인이 떼어 뿌리는 판 조각(거핵세포 → 혈소판) · 터진 호스에 몰린 판 조각(혈소판 마개) · 가슴에 열쇠를 단 수리공의 트롬본 · 소리에 들썩이는 선물 상자(트롬보키나제 → 트롬빈 · 양성 되먹임) · 털실 뭉치가 풀린 실 그물에 걸린 원반(피브린 · 혈병) · 자갈을 싸 묶은 흰 보자기 · 냉장고(Ca²⁺ 결합 · 냉장) · 헤어핀 · 거머리가 붙은 트롬본(헤파린 · 히루딘)","img":"img/L46e.webp?v=08ebe720d0eb","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"심장 집 뒷방에 누운 거대한 뼈를 길게 갈라 열었다 — 안은 붉은 스펀지 같은 공방 · 오른쪽 뜰에서는 터진 진홍 호스를 고친다 (틀)","fact":"피의 세포는 뼈 속 붉은 골수에서 만든다 · 조혈 줄기세포는 붉은 골수에","hook":"뼈 속 붉은 공방 = 붉은 골수","say":"심장 집 뒷방에 누운 거대한 뼈를 길게 갈라 보니, 안쪽에 붉은 스펀지 같은 공방이 있다. 피를 만드는 붉은 골수다. 붉은 원반인 적혈구, 흰 옷 경비인 백혈구, 작은 판 조각인 혈소판이 모두 여기서 나온다. 그 출발점인 조혈 줄기세포도 붉은 골수에 있다. 오른쪽 뜰에서는 진홍색 호스가 터졌고, 공방에서 나온 일꾼들이 구멍을 막고 있다.","box":null,"cards":["H0-181"]},{"sid":"s2","obj":"공방 한가운데 머리에 초록 줄기가 난 통통한 아주머니 — 몸이 둘로 나뉘어 줄기 달린 쪽은 걸상에 남고 · 줄기 없는 쪽은 컨베이어로 걸어 나간다","fact":"적혈구 · 백혈구 · 혈소판의 공통 기원 = 줄기세포 · 하나는 남고 하나는 분화","hook":"머리의 줄기 = 줄기세포 · 남는 하나 + 떠나는 하나","say":"공방 가운데 머리에 초록 줄기가 난 통통한 아주머니가 앉았다. 줄기를 통해 줄기세포라는 이름을 떠올리자. 적혈구, 백혈구, 혈소판은 모두 이 한 종류의 줄기세포에서 유래한다. 아주머니가 둘로 나뉘면 줄기 있는 쪽은 걸상에 남고, 없는 쪽은 컨베이어로 걸어간다. 분열할 때 하나는 줄기세포로 남고 다른 하나는 분화하므로, 줄기세포가 고갈되지 않는다는 연결이다.","box":[[420,260,330,360]],"cards":["H0-180","H0-182"]},{"sid":"s3","obj":"컨베이어 둘 — 위 컨베이어는 붉은 원반을 싣고 뼈 오른쪽 끝으로 · 아래 컨베이어는 작은 문을 지나 흰 길로 장난감 병정과 벌을 싣고 간다","fact":"골수성 계열 → 적혈구 · 혈소판 / 림프성 계열 → 림프구(B · T · 특이 면역)","hook":"뼈 안 위 띠 = 골수성 · 흰 길 아래 띠 = 림프성 · 벌 = B · 병정 = T","say":"아주머니 옆에서 컨베이어 둘이 갈라진다. 위쪽은 붉은 원반과 작은 판 조각을 싣고 뼈 안을 지난다. 적혈구와 혈소판을 만드는 골수성 전구세포 계열이다. 아래쪽 컨베이어는 작은 문을 지나 이 덱에서 림프를 뜻하는 흰 길로 나간다. 림프성 전구세포 계열이며 장난감 병정과 벌이 실려 있다. 병정은 T 세포, 벌은 B 세포로, 림프구의 대표 두 종류다. 림프구는 특정한 적을 골라 공격하는 특이적 면역을 담당한다.","box":[[660,290,460,260],[695,575,450,250]],"cards":["H0-183","H0-184","H0-185","H0-172"]},{"sid":"s4","obj":"왼쪽 위 지붕에 콩팥을 얹은 작은 집 — 문간의 유리병엔 흰 방울이 셋만 남았고 · 지붕의 작은 대포가 붉은 신호탄을 뼈로 쏜다","fact":"산소 부족 → 신장이 EPO 분비 → 골수의 적혈구 생성 ↑ · 적혈구 ↓ → 산소 운반 ↓","hook":"빈 흰 방울 병 = 산소 부족 · 콩팥 집 대포 = EPO(이포) · 붉은 신호탄 = 적혈구를 만들라","say":"왼쪽 위 작은 집의 지붕에는 콩팥이 놓여 있다. 신장이다. 문간의 유리병에는 산소를 뜻하는 흰 방울이 셋만 남아 있다. 산소가 부족해지자 지붕의 작은 대포가 붉은 신호탄을 뼈 공방으로 쏜다. 대포의 이포라는 소리를 EPO에 연결하자. 적혈구 생성 인자 에리트로포이에틴은 주로 신장에서 분비되어 골수의 적혈구 생성을 촉진한다. 적혈구 수가 줄어들면 혈액의 산소 운반 능력도 떨어진다는 관계다.","box":[[25,40,500,340]],"cards":["H0-166","H0-167","H0-168"]},{"sid":"s5","obj":"왼쪽 아래 — 뼈 왼쪽 끝 곁에 주름진 늙은 붉은 원반 둘이 지팡이를 짚고 섰고 · 목을 숙인 기린이 붉은 원반을 먹는다","fact":"적혈구 수명 약 120일 · 늙은 적혈구는 비장(지라)에서 파괴","hook":"지팡이 = 늙은 원반(120일) · 기린(지라프) = 지라 = 비장","say":"뼈의 왼쪽 끝 아래에는 주름진 늙은 붉은 원반 둘이 지팡이를 짚고 있다. 적혈구는 핵이 없어 스스로 수리하지 못하고, 약 120일인 넉 달쯤 지나면 늙는다. 목을 숙인 기린이 이 원반을 먹는다. 기린의 영어 지라프에서 지라를 떠올리자. 지라는 비장의 우리말이며, 늙은 적혈구는 비장에서 걸러져 파괴된다. 비장은 태아 때 적혈구를 만드는 역할도 했다. 조혈 장소가 난황낭, 간, 비장을 거쳐 골수로 옮겨 가기 때문이다. 적혈구의 생성과 파괴에서 비장이 함께 등장하는 이유다. 성체에서는 골수가 만들고 비장이 파괴한다고 구분하자.","box":[[20,740,680,404]],"cards":["H0-164","H0-165"]},{"sid":"s6","obj":"뼈에서 줄지어 나오는 흰 옷 경비 떼 · 뼈 위 놋쇠 경보종이 울리자 경비가 더 쏟아진다 · 뜰의 진홍 호스 벽을 빠져나와 풀밭으로 나가는 경비","fact":"백혈구 = 방어 · 면역(적혈구는 산소) · 다섯 종류 · 혈관 밖도 순찰 · 감염 때 수가 는다","hook":"흰 옷 경비 = 백혈구 · 호스 벽을 빠져나감 = 혈관 밖 순찰 · 경보종 = 감염 → ↑","say":"뼈에서 줄지어 나오는 흰 옷 경비들은 방어와 면역을 맡는 백혈구다. 산소를 운반하는 붉은 적혈구와 역할이 다르다. 백혈구의 다섯 종류는 중성구인 호중구, 호산구, 호염구, 단핵구, 림프구다. 뜰의 경비 하나는 진홍 호스 벽을 넘어 풀밭으로 나온다. 백혈구는 적혈구와 달리 혈관 밖 조직액과 림프계까지 이동하며 순찰한다. 뼈 위 놋쇠 경보종이 울리자 경비가 더 많이 나온다. 백혈구 수가 증가하면 감염을 의심한다는 단서다.","box":[[510,715,600,300],[1150,50,170,310],[1520,150,150,160]],"cards":["H0-170","H0-171","H0-176","H0-287","H0-175"]},{"sid":"s7","obj":"경비 줄에서 파리채를 치켜든 경비 곁에 초록 알약 세균이 튄다 · 뜰 풀밭에서는 경비 하나가 커다란 입의 둥근 흰 덩이가 되어 세균을 삼킨다","fact":"호중구 = 세균에 대한 비특이적 방어 · 단핵구 → 조직으로 나가 대식세포 → 식균","hook":"파리채 = 가리지 않고 친다(호중구) · 커다란 입 흰 덩이 = 대식세포","say":"경비 중 하나는 파리채를 높이 들고 초록 알약 모양 세균을 쫓는다. 상대를 가리지 않는 파리채는 세균에 대한 비특이적 방어의 선봉인 호중구를 나타낸다. 뜰의 풀밭에서는 다른 경비가 큰 입을 가진 둥근 흰 덩이로 변해 세균을 통째로 삼킨다. 단핵구가 혈관 밖 조직으로 이동해 커다란 대식세포가 되고, 식균작용으로 먹어 치우는 모습이다.","box":[[920,810,130,200],[1770,130,210,180]],"cards":["H0-174","H0-173"]},{"sid":"s8","obj":"위 컨베이어 곁의 대머리 거인 — 가슴에 커다란 보라 핵이 창처럼 보이고 · 제 몸에서 작은 베이지 판 조각을 떼어 색종이처럼 뿌린다","fact":"혈소판 = 거핵세포의 세포질 조각(핵 없음) · 지름 약 2~3 μm · 혈액 응고","hook":"큰 핵 거인 = 거핵세포 · 떼어 낸 작은 판 = 혈소판","say":"위쪽 컨베이어 옆 대머리 거인의 가슴에는 창처럼 커다란 보라 핵이 보인다. 핵이 거대한 거핵세포다. 거인은 자기 몸에서 작은 베이지색 판 조각을 떼어 색종이처럼 뿌린다. 혈소판은 거핵세포의 세포질에서 떨어진 조각이므로 핵이 없다. 지름도 약 2~3마이크로미터로 작다. 이 작은 판 조각들이 하는 일은 하나, 피를 굳혀 혈병을 만드는 응고다.","box":[[770,220,250,230]],"cards":["H0-177","H0-178","H0-179"]},{"sid":"s9","obj":"뜰의 진홍 호스가 터졌다 — 붉은 물이 튀고 찢긴 가장자리에 흰 실이 비죽 나왔다 · 작은 베이지 판 조각들이 몰려와 구멍에 쌓인다","fact":"응고 3단계 — 혈관 손상(콜라겐 노출) → 혈소판 마개 → 피브린 응결체","hook":"찢긴 가장자리의 흰 실 = 콜라겐 노출 · 몰린 판 조각 = 혈소판 마개","say":"뜰에서 터진 진홍 호스는 붉은 물을 튀기고, 찢긴 가장자리로 흰 실이 드러났다. 혈관 손상으로 콜라겐 같은 단백질이 노출되면 응고가 직접 촉발된다. 거인이 뿌린 작은 판 조각들이 구멍으로 모여 쌓이는 것은 혈소판이 먼저 만드는 혈소판 마개다. 혈관 손상과 콜라겐 노출, 혈소판 마개 형성, 피브린 응결체로 굳히기의 세 단계를 따라가자. 혈소판은 마개를 만들고, 피브리노겐은 피브린으로 바뀌어 응결체를 만든다. 모인 혈소판은 PDGF인 혈소판 유래 성장인자도 분비해 주변 결합조직의 섬유아세포 분열을 촉진하고 상처를 메우게 한다.","box":[[1330,470,290,240]],"cards":["H0-186","H0-187","H0-278","H0-288","C1-134"]},{"sid":"s10","obj":"터진 곳 곁의 수리공 — 가슴에 큰 열쇠를 매달고 놋쇠 트롬본을 분다 · 곁에 열린 빈 선물 상자 · 그 위 포장 상자가 소리에 들썩인다","fact":"트롬보키나제 → 프로트롬빈을 트롬빈으로 · 트롬빈이 응고를 더 부르는 양성 되먹임","hook":"가슴의 열쇠 = 트롬보키나제 · 상자에서 나온 트롬본 = 프로트롬빈 → 트롬빈 · 들썩이는 상자 = 양성 되먹임","say":"터진 호스 곁 수리공의 가슴에는 큰 열쇠가 달려 있다. 이 덱의 열쇠는 키나아제이므로 트롬보키나제의 단서다. 수리공이 부는 놋쇠 트롬본은 옆의 열린 선물 상자에서 막 꺼냈다. 상자에 싸여 있을 때는 프로트롬빈, 꺼내 불 때는 트롬빈이다. 트롬보키나제가 프로트롬빈을 트롬빈으로 바꾸는 연쇄를 시작한다. 트롬본 소리에 옆 포장 상자가 저절로 들썩이는 모습도 보자. 생성된 트롬빈이 더 많은 응고 반응을 유도하는 양성 되먹임이다. 그래서 응고는 시작된 뒤 빠르게 확대된다.","box":[[1600,480,420,320]],"cards":["H0-188","H0-189","H0-194"]},{"sid":"s11","obj":"트롬본 소리가 닿은 흰 털실 뭉치가 실 그물로 풀려 호스를 감싸고 · 그물에 붉은 원반들이 걸려 뭉친다","fact":"트롬빈 → 피브리노겐을 피브린으로 → 실 모양 그물이 혈구를 잡아 혈병","hook":"털실 뭉치 = 피브리노겐 · 풀린 실 그물 = 피브린 · 걸린 원반 = 혈병","say":"트롬본 소리가 닿자 흰 털실 뭉치가 풀려 실 그물이 되고 호스를 감싼다. 트롬빈이 피브리노겐을 피브린으로 바꾸는 과정이다. 털실 뭉치는 피브리노겐, 풀려 나온 그물은 피브린이다. 피브린은 실 모양 응고망을 만들어 혈병을 단단히 한다. 붉은 원반들이 그물에 걸려 한 덩어리로 뭉치는 것은 피브린 응결체가 혈구를 붙잡아 혈병을 만드는 마지막 결과다.","box":[[1140,610,380,300]],"cards":["H0-190","H0-191","H0-192","H0-195"]},{"sid":"s12","obj":"오른쪽 아래 탁자의 흰 보자기가 회색 자갈을 꽁꽁 싸 묶었다 · 곁의 열린 냉장고 안에 붉은 혈액 주머니","fact":"시트르산 · 옥살산나트륨 = Ca²⁺ 를 묶어 응고 차단 · 냉장 = 효소 반응이 느려져 늦춤","hook":"자갈 = Ca²⁺ · 싸 묶은 시트 = 시트르산 · 냉장고 = 차가우면 느림","say":"오른쪽 아래 탁자에는 응고를 억제하는 물건들이 있다. 흰 보자기인 시트가 회색 자갈을 단단히 싸 묶는다. 자갈은 칼슘 이온이다. 응고 과정 여러 곳에서 칼슘이 필요한데, 시트르산나트륨과 옥살산나트륨이 이를 붙잡으면 피가 굳지 못한다. 시트에서 시트르산이라는 이름을 떠올리자. 채혈관에 넣는 항응고제로 쓰는 이유다. 옆의 열린 냉장고에는 붉은 혈액 주머니가 있다. 낮은 온도에서는 효소 반응이 느려져 응고도 늦어진다.","box":[[1685,880,140,115],[1855,840,185,280]],"cards":["H0-196","H0-200"]},{"sid":"s13","obj":"탁자 위에 놓인 또 한 대의 트롬본은 소리를 못 낸다 — 슬라이드에 검은 쇠 헤어핀이 걸렸고 · 나팔 목에 갈색 거머리가 붙었다","fact":"헤파린 · 히루딘 = 트롬빈 작용 억제","hook":"헤어핀 = 헤파린 · 거머리 = 히루딘 · 멈춘 트롬본 = 트롬빈 억제","say":"탁자의 다른 트롬본은 소리가 나지 않는다. 슬라이드에 걸린 검은 쇠 헤어핀은 헤파린의 이름 단서다. 나팔 목에 붙은 갈색 거머리는 침샘에서 히루딘을 분비한다. 둘 다 트롬빈의 작용을 막으므로, 트롬본이 울리지 않고 피브린 그물도 만들어지지 않는다. 운하 끝에서 보았던 와파린은 와플이 칼을 묶어 비타민 K를 막는 쪽이었다. 여기서는 이미 존재하는 트롬빈의 작용을 그 자리에서 멈춘다는 차이를 연결하자.","box":[[1480,900,230,140]],"cards":["H0-198","H0-199"]}],"cq":{"H0-181":["조혈 줄기세포는 주로 어디에 있는가?","붉은 골수"],"H0-180":["적혈구·백혈구·혈소판의 공통 기원은?","줄기세포"],"H0-182":["줄기세포 분열의 특징은?","하나는 줄기세포로 남고 하나는 분화한다"],"H0-183":["조혈 과정에서 림프구는 어느 계열 전구세포에서 나오는가?","림프성 전구세포"],"H0-184":["조혈 과정에서 적혈구와 혈소판은 어느 계열 전구세포에서 나오는가?","골수성 전구세포"],"H0-185":["림프구의 대표 두 종류는?","B세포와 T세포"],"H0-172":["림프구의 핵심 기능은?","특이적 면역반응"],"H0-166":["체내 산소가 부족할 때 적혈구 생성을 촉진하는 호르몬은?","EPO"],"H0-167":["EPO는 주로 어디서 분비되는가?","신장"],"H0-168":["적혈구 수가 줄면 산소 운반능은 어떻게 되는가?","감소한다"],"H0-164":["태아 때 적혈구를 만들기도 하고, 평생 늙은 적혈구를 걸러 파괴하는 림프 기관은?","비장(지라) — 어른의 적혈구 생성은 골수"],"H0-165":["적혈구의 평균 수명은?","약 120일"],"H0-170":["백혈구(leukocyte)의 주된 임무는?","방어와 면역"],"H0-171":["대표적 백혈구 다섯 종류는?","중성구 · 호산구 · 호염구 · 단핵구 · 림프구"],"H0-176":["백혈구가 적혈구와 다른 점 한 가지는?","혈관 밖 조직액이나 림프계도 순찰할 수 있다"],"H0-287":["적혈구와 백혈구를 비교하면?","적혈구는 산소운반 · 백혈구는 방어·면역"],"H0-175":["백혈구 수 증가가 시사할 수 있는 것은?","감염"],"H0-174":["호중구의 대표 기능은?","세균 등에 대한 비특이적 방어"],"H0-173":["단핵구의 대표 기능은?","조직으로 이동해 대식세포가 되어 식균작용"],"H0-177":["혈소판(platelet)이란?","거핵세포 세포질 조각으로 된 무핵 세포 파편"],"H0-178":["혈소판의 크기 특징은?","직경 약 2~3 μm"],"H0-179":["혈소판의 핵심 기능은?","혈액 응고와 혈병 형성"],"H0-186":["혈액응고가 시작되는 직접 계기는?","혈관 손상으로 혈관벽 단백질이 노출되는 것"],"H0-187":["손상 초기 혈소판이 먼저 만드는 것은?","혈소판 마개"],"H0-278":["혈액응고의 3단계를 순서대로 쓰면?","혈관 손상·콜라겐 노출 → 혈소판 마개 → 피브린 응결체(혈병 안정화)"],"H0-288":["혈소판과 피브리노겐을 비교하면?","혈소판은 마개 형성 · 피브리노겐은 피브린으로 바뀌어 응결체 형성"],"C1-134":["상처가 났을 때 혈소판이 방출하여 결합조직 세포(섬유아세포)의 분열을 강력하게 자극하는 성장 인자는?","PDGF (혈소판 유래 성장 인자)"],"H0-188":["트롬보키나제의 역할은?","프로트롬빈을 트롬빈으로 전환하는 연쇄반응에 기여"],"H0-189":["프로트롬빈이 활성화되면 되는 것은?","트롬빈"],"H0-194":["혈액응고가 양성 되먹임인 이유는?","생성된 트롬빈이 더 많은 응고 반응을 촉진하기 때문"],"H0-190":["트롬빈의 핵심 작용은?","피브리노겐을 피브린으로 전환"],"H0-191":["피브리노겐이 활성화되면 되는 것은?","피브린"],"H0-192":["피브린의 역할은?","실 모양 응고망을 형성해 혈병을 안정화"],"H0-195":["혈액응고의 최종 결과는?","피브린 응결체가 혈구를 잡아 혈병을 만드는 것"],"H0-196":["시트르산나트륨과 옥살산나트륨이 항응고제로 쓰이는 이유는?","Ca2+를 결합해 응고반응을 막기 때문"],"H0-200":["혈액을 냉장 보관하면 응고가 늦어지는 이유는?","효소 반응이 느려지기 때문"],"H0-198":["헤파린의 작용은?","트롬빈 작용 억제"],"H0-199":["히루딘의 작용은?","트롬빈 작용 억제"]},"hubPanel":null};
const $ = id => document.getElementById(id);

let subOpen = false;

$('sub').onclick = () => { if (mode === 'review' || mode === 'quiz') { subOpen = !subOpen; subShow(); } };
$('img').src = L.img; $('img').alt = L.title;

if (L.hub) $('hub').href = L.hub; else if (L.hubPanel) $('hub').href = '../sketchy.html#' + L.hubPanel;

const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID

// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}

const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');

  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));

    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {

    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact), st.sid);
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate,
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
