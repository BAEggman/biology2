<style>
  :root{--ink:#1b1b1f;--ink2:#4b4b55;--line:#e3e1da;--teal:#0f766e;--teal50:#ecfdf5;--gold:#b45309;--bg:#f7f5ef}

<script>
const L = {"id":"L50b","scene":"s50","part":"b","title":"몸 마을 눈 덮인 산장 — 체온 조절 · 열이 드나드는 네 길 · 피부 혈류 · 역류교환 · 대사율 · 휴면","sub":"앞벽을 뜯은 산장의 방 셋 · 큰 온도계의 초록 띠(정상 범위) + 녹은 버터 / 언 버터(막 유동성) · 배에 무쇠 난로 문을 단 털외투 산장지기(대사열 = 내온) vs 열등 아래 도마뱀(바깥 열 = 외온) · 히터 어항의 열대어(외온인데 항온) · 서리 앉은 박쥐(내온인데 변온 · 휴면) · 벽난로 앞 손바닥에 닿는 주황 물결(복사) · 사우나의 땀 → 김(증발) · 새빨간 살갗과 불룩한 핏줄(혈관 확장) vs 하얗게 질린 등산객(혈관 수축) · 능선의 바람(대류) · 얼음덩이에 앉은 엉덩이(전도) · 거위 다리의 빨강 ↓ 파랑 ↑ 관(역류교환) · 장작을 배 속 난로에 넣기(대사율 ↑) · 불 꺼진 난로의 웅크린 사람(저체온) · 빈 접시 곁에 잠든 사람 + 계기판(기초대사율) · 사육장 온도 다이얼(표준대사율) · 큰 야크 vs 작은 벌새(표면적 비) · 눈 밑 땅굴의 고슴도치(동면)","img":"img/L50b.webp?v=9846e35b3660","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"눈 덮인 산장 — 앞벽을 뜯어 방 셋이 보인다 · 왼쪽 방 벽의 큰 온도계 · 빨간 기둥이 가운데 초록 띠 안에 멈췄다 · 위 선반엔 녹아 흐르는 버터 · 아래 선반엔 얼어 고드름 달린 버터 (틀)","fact":"체온조절 = 체온을 정상 범위 안에 유지 · 벗어나면 효소가 느려지고 막 유동성이 바뀐다","hook":"초록 띠 = 정상 범위 · 녹은 버터 / 언 버터 = 막이 너무 묽다 / 너무 굳다","say":"몸 마을의 눈 덮인 산장이다. 앞벽을 열어 방 셋을 보여 준다. 밖에는 눈보라가 치지만 왼쪽 방의 큰 온도계는 빨간 기둥이 초록 정상 범위 안에 머문다. 환경 변화에도 내부 온도를 일정 범위로 유지하는 항상성, 체온조절이다. 문제에서 환경과 무관하게 내부 온도를 유지한다는 말이 나오면 이 체온조절을 떠올리자. 온도계 위 선반의 버터는 녹아 흐르고 아래 버터는 얼어 고드름이 생겼다. 세포막도 너무 더우면 유동성이 커지고 너무 추우면 굳는다. 체온이 정상 범위를 벗어나면 막의 유동성이 달라지고 효소 반응의 효율이 떨어지며 온도에 민감한 과정들이 어긋난다.","cards":["G0-56","G0-92","G0-57","G0-88"],"box":[[708,342,245,255]]},{"sid":"s2","obj":"왼쪽 방 — 털모자 · 털외투 산장지기의 배에 둥근 무쇠 난로 문이 열렸고 속에서 불이 활활 / 가운데 방 위 선반 — 유리 사육장 속 초록 도마뱀이 빨간 열등 아래 엎드렸다","fact":"내온동물 = 제 대사열로 체온 유지 · 외온동물 = 바깥 열원에 기댄다","hook":"배 속 난로 = 제 대사열(내온) · 열등 아래 도마뱀 = 바깥 열(외온)","say":"털모자와 털외투를 입은 산장지기의 배 한가운데에는 둥근 무쇠 난로 문이 열려 있고 그 안에서 불이 활활 타오른다. 몸 안에서 만드는 대사열로 체온을 유지하는 내온동물이다. 포유류와 조류가 여기에 해당한다. 가운데 방 위 선반의 유리 사육장에는 배에 난로가 없는 초록 도마뱀이 빨간 열등 아래 엎드려 있다. 햇빛이나 따뜻한 바위 같은 외부 열원에 의존하는 외온동물이다. 대부분의 어류·양서류·파충류·무척추동물이 그렇다. 내온과 외온의 기준은 열의 출처다.","cards":["G0-58","G0-59"],"box":[[818,535,230,350],[1068,340,152,195]]},{"sid":"s3","obj":"가운데 방 위 선반 — 검은 히터가 든 작은 어항에서 주황 열대어가 느긋하게 헤엄친다 · 산장 지붕 왼쪽 처마 밑 — 서리를 뒤집어쓰고 거꾸로 매달려 잠든 박쥐","fact":"내온/외온과 항온/변온은 다른 축 — 열대어는 외온인데 항온 · 휴면 박쥐는 내온인데 변온","hook":"히터 어항의 열대어 = 외온 + 항온 · 서리 앉은 박쥐 = 내온 + 변온","say":"도마뱀 옆 작은 어항의 검은 히터와 느긋하게 헤엄치는 주황 열대어를 보자. 물고기는 외온동물이지만 물 온도가 일정하면 체온도 일정하다. 외온이면서 항온인 경우다. 반대로 산장 지붕 왼쪽 처마 아래에서 서리를 뒤집어쓰고 거꾸로 매달려 잠든 박쥐는 내온동물이지만 휴면 중 체온이 크게 내려간다. 내온이면서 변온인 경우다. 내온·외온은 열이 어디서 오는지, 항온·변온은 체온이 얼마나 일정한지를 가르는 서로 다른 기준이다. 시험에서 분류어를 혼동하기 쉬우니 두 기준을 구별하자.","cards":["G0-60","G0-93","G0-94","G0-95","G0-179"],"box":[[1212,432,125,105],[392,318,100,150]]},{"sid":"s4","obj":"왼쪽 방 벽난로 곁 — 작은 나무 의자에 앉은 스웨터 차림 사람이 불 쪽으로 두 손바닥을 펴 내밀었다 · 불에 닿지 않았는데 주황 물결선이 공기를 건너 손바닥에 닿는다","fact":"복사 = 닿지 않고 전자기파로 열을 주고받음 · 열이 드나드는 길은 복사 · 증발 · 대류 · 전도","hook":"닿지 않고 건너오는 주황 물결선 = 복사","say":"열이 이동하는 네 경로는 복사·증발·대류·전도다. 먼저 벽난로 옆의 작은 나무 의자에 앉아 불을 향해 두 손바닥을 편 사람을 보자. 불에 닿지 않아도 주황 물결선을 따라 열을 받는다. 복사다. 절대영도보다 따뜻한 물체는 모두 전자기파 형태로 열을 방출하고 흡수한다. 햇볕으로 몸을 데우거나 차가운 벽을 향해 열을 잃는 것도 복사다.","cards":["G0-61","G0-62"],"box":[[560,580,275,310]]},{"sid":"s5","obj":"오른쪽 방 사우나 — 의자에 앉은 사람의 살갗에 굵은 땀방울 · 땀이 김이 되어 피어오르고 · 둘레에 파란 시원한 바람결","fact":"증발 = 액체가 기체가 되며 열을 많이 빼앗는다 · 땀샘은 증발 냉각으로 식힌다","hook":"땀이 김이 되어 날아감 = 증발 냉각","say":"오른쪽 사우나에서는 의자에 앉은 사람의 살갗에 굵은 땀방울이 맺혔다가 김으로 바뀌어 올라가고, 둘레에 파란 시원한 바람결이 생긴다. 증발이다. 물이 기체로 바뀌면서 많은 열을 가져가므로 몸이 식는다. 땀샘이 체온을 낮추는 원리인 증발 냉각을 연결하자.","cards":["G0-63","G0-70"],"box":[[1360,370,280,330]]},{"sid":"s6","obj":"왼쪽 위 눈 덮인 비탈 — 하얀 바람이 휘몰아쳐 등산객의 목도리가 옆으로 날리고 · 머리 둘레에 빨간 열 김이 흩날린다","fact":"대류 = 몸 표면을 지나는 공기나 물의 흐름이 열을 실어 감","hook":"바람에 흩날리는 빨간 열 김 = 대류","say":"왼쪽 위 눈 덮인 비탈에서 하얀 바람이 휘몰아쳐 등산객의 목도리를 옆으로 날리고, 머리 주변의 빨간 열기를 흩어 놓는다. 몸이 데운 공기를 바람이 계속 바꾸어 가는 대류다. 몸 표면을 흐르는 공기나 물이 열을 운반하므로, 같은 기온이라도 바람이 강하면 더 춥게 느껴진다. 창백한 등산객의 얼굴은 뒤에서 혈류 조절과 다시 연결하자.","cards":["G0-64"],"box":[[55,100,230,270],[255,55,430,150]]},{"sid":"s7","obj":"왼쪽 가운데 — 맑은 파란 얼음덩이에 걸터앉은 사람 · 엉덩이에서 얼음 속으로 빨간 화살 · 밑에 녹은 물이 고이고 · 얼굴을 찡그린다","fact":"전도 = 맞닿은 물체 사이에서 분자 충돌로 열이 옮겨 감","hook":"엉덩이 → 얼음 속 빨간 화살 = 전도","say":"비탈 아래의 맑은 파란 얼음에 걸터앉아 얼굴을 찡그린 사람을 보자. 엉덩이에서 얼음으로 빨간 화살이 향하고 아래에는 녹은 물이 고인다. 서로 닿은 물체 사이에서 분자 충돌로 열이 따뜻한 쪽에서 찬 쪽으로 이동하는 전도다. 물은 공기보다 열을 훨씬 잘 전달하므로, 찬물에 빠지면 찬 공기 속에 있을 때보다 빠르게 체온을 잃는다.","cards":["G0-65"],"box":[[78,405,312,355]]},{"sid":"s8","obj":"사우나의 사람 — 살갗이 새빨갛고 팔에 붉은 핏줄이 불거졌다 / 비탈의 등산객 — 얼굴이 창백한 청백색","fact":"피부 혈관 확장 → 피부 혈류 ↑ → 열 방출 ↑ · 혈관 수축 → 혈류 ↓ → 열 보존","hook":"새빨간 살갗 · 불거진 핏줄 = 혈관 확장(내보냄) · 창백한 얼굴 = 혈관 수축(지킴)","say":"사우나 사람의 붉은 피부와 불거진 팔 혈관을 다시 보자. 피부 혈관이 확장해 더운 혈액이 표면으로 많이 오고, 열을 바깥으로 내보낸다. 반대로 비탈의 등산객은 피부 혈관이 수축해 혈액이 덜 흐르므로 창백하다. 추울 때 열을 몸 안에 보존하는 반응이다. 표면 혈류를 늘리면 열 방출이 커지고, 줄이면 열 보존이 커진다는 관계를 두 사람에게 연결하자.","cards":["G0-66","G0-67","G0-82","G0-83","G0-84"],"box":[[1395,485,240,370],[115,125,115,115]]},{"sid":"s9","obj":"왼쪽 아래 언 연못가 — 유리 장대처럼 길고 굵은 다리로 선 흰 거위 · 다리마다 빨간 관이 아래로 · 바로 곁 파란 관이 위로 · 빨간 화살 셋이 빨간 관에서 파란 관으로 건너뛴다","fact":"역류교환 — 다리로 내려가는 동맥피가 올라오는 정맥피에 열을 넘겨 열 손실을 줄인다","hook":"엇갈려 흐르는 빨강 ↓ · 파랑 ↑ 관 + 건너뛰는 화살 = 역류교환","say":"왼쪽 아래 언 연못가의 흰 거위는 유리 장대처럼 속이 보이는 길고 굵은 다리로 서 있다. 빨간 관은 발로 내려가고 옆의 파란 관은 몸으로 올라간다. 빨간 관에서 파란 관으로 건너가는 화살 셋이 역류교환이다. 따뜻한 동맥피가 올라오는 찬 정맥피에 열을 넘기면, 발에 도착할 혈액은 식어 바깥으로 잃는 열이 줄고 그 열은 몸으로 되돌아간다. 두 혈액이 반대 방향으로 흐르므로 관 전체에 온도 차가 유지되어 계속 교환할 수 있다. 물새 다리와 역류교환을 연결하자.","cards":["G0-68","G0-69","G0-89"],"box":[[95,755,235,380]]},{"sid":"s10","obj":"털외투 산장지기가 작은 삽으로 장작을 제 배 속 난로에 밀어 넣는다 / 연못가 눈밭에 웅크린 사람 — 푸르스름한 살갗에 서리 · 배의 난로 문은 열렸는데 불이 꺼져 차갑고 어둡다","fact":"내온동물은 잃는 열을 갚아야 한다(대사율 ↑ · 행동 · 형태 조절) · 못 갚으면 저체온","hook":"장작 넣기 = 대사율 ↑ · 털외투 = 형태 · 불 꺼진 난로 = 저체온","say":"이처럼 추운 곳에서 내온동물은 외부보다 따뜻하므로 잃는 열을 계속 보충해야 한다. 산장지기가 작은 삽으로 배 속 난로에 장작을 밀어 넣는 것은 대사율을 높여 열을 더 만드는 모습이다. 두꺼운 털외투와 모자는 몸의 구조와 행동으로 열을 보존하는 방법을 나타낸다. 털이나 깃털을 세우고 웅크리거나 따뜻한 곳을 찾는 행동도 여기에 속한다. 연못가 눈밭의 웅크린 사람은 배 속 난로가 꺼지고 피부가 푸르스름하며 서리가 생겼다. 잃는 열을 보충하지 못해 체온이 떨어지는 저체온이다.","cards":["G0-71","G0-81","G0-87"],"box":[[818,535,230,350],[428,900,425,215]]},{"sid":"s11","obj":"가운데 방 — 좁은 침대에서 편히 잠든 사람 · 침대 곁 바닥에 빈 접시 · 코에서 벽의 둥근 계기판까지 가는 관 / 위 선반 도마뱀 사육장 옆면의 온도 조절 다이얼","fact":"기초대사율 = 쉬고 굶고 편안하고 자라지 않는 내온동물 · 표준대사율 = 외온동물 · 정한 온도","hook":"빈 접시 곁에 잠든 사람 + 계기판 = 기초대사율 · 사육장 다이얼 = 표준대사율","say":"가운데 방의 좁은 침대에는 편히 잠든 사람이 있다. 침대 곁 바닥의 빈 접시는 먹지 않은 상태를, 코에서 벽의 둥근 계기판으로 이어진 가는 관은 산소 소비로 대사율을 측정하는 것을 나타낸다. 쉬고 있고 공복이며 스트레스가 없고 성장이 끝난 내온동물에서 재는 것이 기초대사율 BMR이다. 위 선반의 도마뱀 사육장에는 온도 다이얼이 있다. 외온동물은 주변 온도에 따라 대사율이 달라지므로, 특정 온도에서 휴식·공복·안정 조건을 맞추어 측정한다. 이것이 표준대사율 SMR이다.","cards":["G0-74","G0-75"],"box":[[1062,550,292,310],[1158,428,64,55]]},{"sid":"s12","obj":"오른쪽 눈밭에 느긋하게 누워 건초를 천천히 씹는 큰 야크 / 지붕 오른쪽 처마의 빨간 모이통에서 날개를 떨며 정신없이 빨아 먹는 작은 벌새","fact":"작을수록 부피에 비해 표면적이 커 열을 빨리 잃는다 → 체중당 대사율이 높다","hook":"느긋한 큰 야크 · 정신없이 먹는 작은 벌새 = 체중당 대사율은 작을수록 높다","say":"오른쪽 눈밭의 큰 야크는 느긋하게 누워 천천히 건초를 씹지만, 지붕 오른쪽 처마의 작은 벌새는 날개를 떨며 빨간 모이통에서 정신없이 빨아 먹는다. 작은 몸은 부피에 비해 표면적이 커서 열을 빨리 잃고, 그만큼 빠르게 보충해야 한다. 따라서 체중 1 kg당 대사율은 작은 동물에서 훨씬 높다. 큰 동물은 상대적인 표면적이 작아 체중당 필요한 에너지가 적다. 벌새나 박새 같은 작은 새들이 휴면을 이용하는 이유도 여기에 있다.","cards":["G0-85","G0-86","G0-80"],"box":[[1635,505,370,260],[1665,325,170,150]]},{"sid":"s13","obj":"오른쪽 아래 — 눈더미를 잘라 보인 땅굴 속 마른 잎 위에서 줄무늬 수면 모자를 쓰고 웅크려 잠든 고슴도치 · 곁에 빈 밥그릇 / 처마 밑에 매달려 잠든 박쥐","fact":"휴면 = 활동 · 대사가 줄어든 짧은 상태 · 동면 = 추위와 먹이 부족을 견디는 긴 휴면","hook":"처마 밑 잠든 박쥐 = 휴면 · 눈 밑 땅굴의 고슴도치 = 동면","say":"처마 아래의 박쥐는 활동과 대사를 크게 낮춘 짧은 휴면 상태다. 밤에 활동하고 낮에 휴면해 에너지를 아낀다. 오른쪽 아래 눈더미 속 땅굴에서는 고슴도치가 줄무늬 수면 모자를 쓰고 마른 잎 위에 웅크렸으며, 옆 밥그릇이 비었다. 추위와 먹이 부족을 몇 달간 견디는 긴 휴면인 동면이다. 에너지 소비를 줄여 불리한 계절을 버티는 적응을 잠든 행동으로 표현했다.","cards":["G0-76","G0-77","G0-78","G0-79"],"box":[[1625,845,380,270],[392,318,100,150]]}],"cq":{"G0-56":["체온조절의 정의는?","내부 온도를 정상 범위 내에서 유지하는 과정"],"G0-92":["문제에서 '환경과 무관하게 내부 온도 유지'가 나오면 먼저 떠올릴 개념은?","항상성적 체온조절"],"G0-57":["정상 범위를 벗어난 체온이 위험한 이유 3가지는?","효소 반응 효율 저하 · 세포막 유동성 변화 · 온도 민감 과정 이상"],"G0-88":["문제에서 '효소 활성이 떨어지고 막 유동성 변화'가 같이 나오면 가장 먼저 떠올릴 개념은?","체온 항상성 붕괴"],"G0-58":["내온동물(endotherm)이란?","대사열에 크게 의존해 체온을 유지하는 동물"],"G0-59":["외온동물(ectotherm)이란?","외부 환경 열원에 크게 의존하는 동물"],"G0-60":["내온/외온과 항온/변온은 같은 개념인가?","아니오, 서로 독립적이다"],"G0-93":["외온동물도 항온일 수 있다는 문장의 의미는?","외부 환경이 일정하면 외온동물도 안정된 체온을 유지할 수 있다는 뜻"],"G0-94":["내온동물도 변온일 수 있다는 문장의 의미는?","예를 들어 휴면 시 체온이 떨어질 수 있다는 뜻"],"G0-95":["문제에서 '분류어의 함정'으로 자주 나오는 조합은?","내온/외온과 항온/변온은 서로 다른 축이라는 점"],"G0-179":["내온/외온과 항온/변온이 독립적임을 보여주는 대표 예는?","열대 물에 사는 외온 물고기는 항온을 유지하고 · 휴면 중 내온 박쥐는 체온이 떨어진다"],"G0-61":["열 손실/획득 방식 4가지는?","복사, 증발, 대류, 전도"],"G0-62":["복사(radiation)란?","절대영도보다 높은 물체가 전자기파 형태로 열을 주고받는 것"],"G0-63":["증발(evaporation)이 체온을 낮추는 이유는?","액체가 기체가 되며 많은 열을 흡수하기 때문이다"],"G0-70":["땀샘의 냉각 원리는?","증발 냉각"],"G0-64":["대류(convection)란?","표면을 지나는 공기나 액체의 흐름에 의한 열 이동"],"G0-65":["전도(conduction)란?","접촉한 물체 사이 분자 충돌에 의한 열 전달"],"G0-66":["혈류 조절이 체온조절에 중요한 이유는?","피부와 몸속 사이 열 이동량을 조절할 수 있기 때문이다"],"G0-67":["vasodilation의 체온조절 효과는?","피부 혈류를 늘려 열 방출을 증가시킨다"],"G0-82":["내온동물이 추울 때 열 방출을 줄이는 대표 혈관 반응은?","혈관수축(vasoconstriction)"],"G0-83":["문제에서 '표면 혈류 증가'가 나오면 체온은 대체로 어느 방향으로 변하는가?","열 방출 증가"],"G0-84":["문제에서 '표면 혈류 감소'가 나오면 체온 보존은 어떻게 되는가?","보존이 증가한다"],"G0-68":["역류교환(countercurrent exchange)의 장점은?","열 손실을 줄이면서 열 교환 효율을 높인다"],"G0-69":["역류교환에서 효율이 큰 이유는?","반대 방향 흐름 전 길이에 걸쳐 지속적으로 열 교환이 일어나기 때문이다"],"G0-89":["문제에서 '수중 조류 다리'가 나오면 함께 떠올릴 개념은?","역류교환"],"G0-71":["내온동물이 열 손실을 보상해야 하는 이유는?","(추운 환경에서) 환경보다 높은 체온을 유지해 열을 계속 잃기 때문이다"],"G0-81":["내온동물의 열생산 방식 두 가지는?","대사율 증가 · 행동적/형태적 조절"],"G0-87":["문제에서 '열 손실 보상 실패'가 나오면 가장 먼저 의심할 생리적 결과는?","체온 저하"],"G0-74":["기초대사율(BMR)은 누구에게 쓰는가?","쉬고 있고 공복이며 스트레스 없고 성장하지 않는 내온동물"],"G0-75":["표준대사율(SMR)은 누구에게 쓰는가?","특정 온도에서 쉬고 있고 공복이며 스트레스 없는 외온동물"],"G0-85":["몸집이 큰 동물일수록 체중당 에너지 요구가 상대적으로 낮은 경향이 있는 이유는?","부피 대비 표면적 비가 작아 열 손실이 상대적으로 적기 때문이다"],"G0-86":["몸집이 작은 동물이 체중당 대사율이 높은 경향이 있는 이유는?","표면적 비가 커 열 손실을 더 빠르게 보상해야 하기 때문이다"],"G0-80":["벌새/박새 같은 작은 동물이 휴면을 잘 이용하는 이유는?","부피 대비 체표면적이 커 열 손실이 빠르고 대사 부담이 크기 때문이다"],"G0-76":["휴면(torpor)이란?","활동과 대사가 감소된 단기적 생리 상태"],"G0-77":["동면(hibernation)이란?","추위와 음식 부족에 대한 장기간의 휴면"],"G0-78":["휴면이 행동적 적응과 연결되는 이유는?","에너지 소비를 줄여 불리한 환경을 버티게 하기 때문이다"],"G0-79":["박쥐가 낮에 휴면에 들어가는 이유를 한 문장으로 쓰면?","야행성 생활과 에너지 절약을 위해서"]},"hubPanel":null};

try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact), st.sid);
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate,
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
