<style>

<script>
const L = {"id":"L19h","scene":"s19","part":"h","title":"밧줄이 묶이는 자리 · 걸쇠 하나가 비면 — 중심절 · 동원체 · 방추사 검문소","sub":"가위표 짚단의 잘록한 허리(중심절) · 덧댄 쇠판 둘(동원체) · 바깥으로 휜 걸쇠(방향) · 삼밧줄은 쇠판에만(미세소관) · 통 다섯 중 남색 + A 사다리(CENP-A) · 고리(코헤신) + 수호신(슈고신) · 셋 중 빈 걸쇠 하나(검문소 전원) · 매듭 둘 끈(Mad2) → 걸이판 칭칭(Cdc20) · 떨어진 끈(장력)","img":"img/L19h.webp?v=dcdcfffd5066","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"왼쪽 — 가위표 짚단 한 쌍을 바짝 당겨 본 것 · 오른쪽 — 같은 짚단 셋이 세로 한 줄","fact":"짚이 얽힌 것(중심절)과 덧댄 쇠(동원체) · 검문소는 빈 걸쇠 하나를 본다","hook":"얽힌 짚 · 덧댄 쇠 · 빈 걸쇠","say":"왼쪽은 염색체 다발을 바짝 당겨 본 것이다. 두 짚단이 나란히 서서 가위표를 이루고 허리에 쇠판이 박혔다. 오른쪽은 같은 짚단 셋이 세로 한 줄로 서서 밧줄에 걸렸다. 짚이 얽힌 것과 덧대어 박은 쇠가 왼쪽의 전부, 걸쇠 하나가 비면 아무도 못 간다는 것이 오른쪽의 전부.","box":null,"src":["s19p02l#0"],"cards":["C1-11#1","C1-11"]},{"sid":"s2","obj":"두 짚단이 나란히 서서 가위표 · 가운데 한 곳에서만 잘록하게 좁아져 짚이 서로 꼬여 한 몸 · 위아래는 둘이 따로 벌어짐","fact":"중심절 — 자매염색분체가 붙은 DNA 부위 · 짚 자체가 얽힘 = 단백질 아님 · 염색체마다 한 곳","hook":"짚이 꼬인 허리 = 중심절(DNA)","say":"두 짚단이 나란히 서서 가위표 꼴을 이루고, 가운데 한 곳에서만 잘록하게 좁아져 짚이 서로 꼬여 한 몸이 되었다. 위아래로는 둘이 굵게 따로 벌어져 있다. 중심절. 자매염색분체가 붙어 있는 디엔에이 부위. 짚, 가닥 그 자체가 얽힌 것이 급소, 덧댄 물건이 아니므로 단백질이 아니라 디엔에이. 한 염색체에 한 곳뿐인 것이 요점. 이름은 가운데지만 자리는 염색체마다 달라 끝에 치우친 것도 있다. 끝과 끝이 아니라 나란히 붙은 것도 급소.","box":[540,560,340,240],"src":["s19p02l#0"],"cards":["C1-11#1","C1-11"]},{"sid":"s3","obj":"잘록한 허리의 양 바깥 면에 납작한 쇠판 둘이 볼트로 박혀 등을 맞대고 있다","fact":"동원체 — 중심절 위에 형성된 단백질 복합체 · 분체마다 하나 · 서로 반대쪽을 본다","hook":"덧대어 박은 쇠 = 동원체(단백질)","say":"그 잘록한 허리의 양 바깥 면, 왼쪽 짚단의 왼쪽과 오른쪽 짚단의 오른쪽에 납작한 쇠판 둘이 볼트로 박혀 등을 맞대고 있다. 동원체. 중심절 위에 형성되어 방추사가 부착하는 단백질 복합체. 짚이 아니라 덧대어 박은 쇠인 것이 디엔에이 부위가 아니라 단백질 복합체라는 뜻. 판이 둘인 것도 요점, 분체마다 하나씩. 기출이 중심절과 바꿔 낸다.","box":[[400,460,80,240],[930,460,80,240]],"src":["s19p02l#1"],"cards":["C1-10","C1-11#2"]},{"sid":"s4","obj":"쇠판마다 걸쇠가 하나씩 — 왼쪽 판의 것은 왼쪽으로만 · 오른쪽 판의 것은 오른쪽으로만 휘었다","fact":"방추사가 붙는 방향을 동원체가 정한다 · 두 부착점이 각각 반대 극의 미세소관에","hook":"바깥으로만 휜 걸쇠 = 반대 극","say":"쇠판마다 걸쇠가 하나씩인데 왼쪽 판의 것은 왼쪽으로만, 오른쪽 판의 것은 오른쪽으로만 휘었다. 방추사가 붙는 방향을 정하는 것이 동원체. 아무 밧줄이나 걸리지 않는다. 두 판이 등을 맞댄 것이 자매염색분체의 두 부착점이 각각 반대쪽 극에서 온 미세소관에 연결된다는 것.","box":[[295,480,185,170],[990,480,160,170]],"src":["s19p02l#2"],"cards":["C1-70","D0-99"]},{"sid":"s5","obj":"굵은 삼밧줄 둘이 화면 왼쪽 끝과 오른쪽 끝에서 곧게 들어와 제 쪽 걸쇠에 매듭져 걸렸다 · 짚에는 아무 데도 감기지 않았다","fact":"미세소관이 붙는 곳은 동원체뿐 · 극은 양옆 · 밧줄은 짚단과 직각으로","hook":"삼밧줄(방추사)은 쇠판에만 = 부착점 한 곳","say":"굵은 삼밧줄 둘이 왼쪽 끝과 오른쪽 끝에서 곧게 들어와 각각 제 쪽 걸쇠에 매듭져 걸렸다. 짚에는 아무 데도 감기지 않았다. 미세소관이 부착하는 곳은 동원체, 방추사부착점. 붙는 자리가 한 점으로 정해져 있다. 밧줄이 짚단이 뻗은 방향과 직각으로 들어온다, 두 극은 양옆에 있고 나란한 자매는 그 사이에서 저마다 제 쪽 극을 본다. 감수 일분열 전기 늦게 미세소관이 붙는 곳도 상동염색체마다 이 자리다. 다만 그때는 한 염색체의 두 자매가 같은 극을 본다.","box":[[0,520,420,100],[1000,520,420,100]],"src":["s19p02l#3"],"cards":["D0-58"]},{"sid":"s6","obj":"잘록한 자리에서 짚이 작은 통 다섯을 구슬처럼 꿰고 지나간다 — 한가운데 통 하나만 짙은 남색 · 그 위에 A 자 사다리가 서 있다","fact":"CENP-A — 중심절의 특수 히스톤 변이체(H3 자리를 대신) · 통 = 뉴클레오솜 · 사다리 = A","hook":"남색 통 하나 + A 사다리 = CENP-A","say":"잘록한 자리에서 짚이 작은 통 다섯을 구슬처럼 꿰고 지나가는데, 한가운데 통 하나만 짙은 남색이고 에이 자 사다리가 바로 그 통 위에 발을 딛고 서 있다. 센프 에이. 센트로미어 프로틴 에이, 중심절 단백질 에이를 줄인 이름. 중심절에서 방추사 결합의 뼈대가 되는 특수 히스톤 변이체. 이 덱에서 실이 감긴 작은 통은 늘 뉴클레오솜. 다섯 중 하나만 색이 다른 것이 변이체, 보통 에이치 삼이 앉을 자리를 대신 차지한다. 그 위의 에이 자 사다리가 이름 끝의 에이.","box":[[460,520,490,120],[640,370,140,270]],"src":["s19p02l#4"],"cards":["C1-145"]},{"sid":"s7","obj":"잘록한 자리 바로 아래, 두 다발을 잇는 짚 가닥에 은빛 쇠 고리 하나가 끼워져 있고 · 다른 어느 자리에도 고리가 없다","fact":"코헤신이 중심절 부위에 남아 자매를 붙들어 방추사 부착을 돕는다 · 고리 분해가 자매 분리의 직접 원인","hook":"이 자리 은빛 고리(코헤신)만 남았다","say":"잘록한 자리 바로 아래, 두 다발을 잇는 짚 가닥에 은빛 쇠 고리 하나가 끼워져 있고, 다발의 다른 어느 자리에도 고리가 없다. 코헤신이 이 중심절 부위에 남아 자매를 붙들어 방추사 부착을 돕는다. 책에 따라 이 자리를 동원체 부위라고도 적는다. 다른 자리 고리는 이미 다 풀렸는데 이 자리 것만 남은 것이 요점이고, 이 고리가 없어지는 것이 곧 자매염색분체가 갈라지는 직접 원인.","box":[[598,722,205,190]],"src":["s19p02l#5"],"cards":["C1-107","D0-102"]},{"sid":"s8","obj":"그 고리 한가운데에 넓은 갓을 쓴 작은 돌 수호신 상이 앉아 고리를 가리고 있다","fact":"슈고신 — 감수 1분열 후기에 중심절 부위(책에 따라 동원체 부위) 코헤신만 세퍼레이스로부터 지킨다(守護神)","hook":"수호신 = 슈고신","say":"그 고리 한가운데에 작은 돌 수호신 상이 넓은 갓을 쓰고 앉아 고리를 가리고 있다. 볼트 커터가 와도 이 고리에는 날이 닿지 않는다. 슈고신. 감수 일분열 후기에 이 중심절 부위의 코헤신만 세퍼레이스로부터 지킨다. 문제에 동원체 부위의 코헤신이라고 나와도 이 고리다. 수호신이 그대로 이름, 일본말 슈고신. 팔 쪽 코헤신은 일분열에서 잘리고 이 자리 것은 이분열까지 남아 자매를 붙들어 둔다.","box":[600,760,180,260],"src":["s19p02l#6"],"cards":["C1-130"]},{"sid":"s9","obj":"오른쪽 — 선반 세 칸에 가위표 짚단 셋이 세로 한 줄 · 위 둘은 양쪽 밧줄이 팽팽 · 맨 아래 하나는 오른쪽 걸쇠에 밧줄이 없고 왼쪽 밧줄은 축 처졌다","fact":"방추사 부착 검문소 — 모든 동원체가 붙었는가 · 다수결이 아니라 전원 · 막는 쪽은 아직 안 된 자리","hook":"셋 중 하나만 비어도 멈춤","say":"오른쪽. 선반 세 칸에 가위표 짚단 셋이 세로 한 줄로 섰는데, 위 둘은 양쪽 걸쇠에 굵은 밧줄이 다 걸려 팽팽하고, 맨 아래 하나는 오른쪽 걸쇠에 밧줄이 없고 왼쪽 밧줄은 축 처졌다. 방추사 부착 검문소가 보는 것은 모든 동원체가 방추사를 잡았는가. 셋 가운데 둘이 이미 됐어도 아무 일이 일어나지 않는다. 다수결이 아니라 전원. 잘못 갈라지면 염색체 수가 어긋나므로 다 될 때까지 기다린다.","box":[1460,20,588,1000],"src":["s19p02m#0"],"cards":[]},{"sid":"s10","obj":"그 밧줄 없는 오른쪽 걸쇠에 매듭이 둘 지어진 가는 끈이 매여 있다 · 밧줄이 걸린 걸쇠에는 이 끈이 없다","fact":"Mad2 — 텅 빈 동원체에 결합해 대기 신호를 보낸다 · 매듭 = 매드 · 둘 = 2","hook":"매듭 둘 끈 = Mad2 · 빈 걸쇠에만","say":"그 밧줄 없는 오른쪽 걸쇠에는 굵은 밧줄 대신 매듭이 둘 지어진 가는 끈이 매여 있다. 밧줄이 걸린 걸쇠에는 이 끈이 없다. 아직 방추사가 붙지 않은 텅 빈 동원체에 결합해 대기 신호를 보내는 단백질이 매드 투. 매듭이 매드, 매듭이 둘인 것이 투. 묶어 두는 물건인 것까지 하는 일과 겹친다.","box":[1770,820,170,140],"src":["s19p02m#1"],"cards":["C1-121"]},{"sid":"s11","obj":"그 끈이 뻗어 나가 구석의 나무 걸이판을 칭칭 감아 묶었다 · 걸이판은 두 자리 — 왼쪽에 음반 둘 · 오른쪽엔 음반 없이 끈만 감김","fact":"Mad2가 Cdc20을 억제 — 음반 = Cd- · 둘 · 빔 = 20 · 부수지 않고 못 쓰게 묶는다","hook":"두 칸 걸이판의 음반 둘 + 빈 칸(두 자리 수) = Cdc20 · 칭칭 = 억제","say":"그 끈이 오른쪽 아래로 뻗어 나가 구석에 선 나무 걸이판을 칭칭 감아 못 쓰게 묶어 놓았다. 걸이판은 세로 띠로 두 자리로 갈렸는데 왼쪽 자리엔 음반 둘이 걸렸고 오른쪽 자리엔 음반이 없다. 끈이 감긴 데가 그 빈 자리다. 매드 투가 직접 결합해 활성을 억제하는 표적이 씨디씨 이십. 음반은 씨디 계열, 번호는 왼쪽부터 둘과 빔, 이십. 칭칭 감아 묶은 것이 억제, 부수는 게 아니라 못 쓰게 붙잡아 둔다. 씨디씨 이십은 후기촉진복합체 에이피씨를 켜는 짝이라, 묶여 있는 동안은 후기가 시작되지 않는다.","box":[1770,960,278,184],"src":["s19p02m#2"],"cards":["C1-122"]},{"sid":"s12","obj":"팽팽한 위 두 짚단 밑 선반에는 매듭 둘짜리 끈이 떨어져 놓였다 — 같은 끈인데 아무 데도 매여 있지 않다","fact":"모든 동원체에 방추사가 붙어 장력이 생기면 Mad2가 활성을 잃고 떨어진다 · 갈림점은 「맞당겨지느냐」","hook":"팽팽하면 끈이 떨어진다","say":"양쪽 밧줄이 팽팽한 위 두 짚단 밑 선반에는 매듭 둘짜리 끈이 떨어져 놓였다. 같은 끈인데 여기서는 아무 데도 매여 있지 않다. 모든 동원체에 방추사가 결합해 장력이 발생하면 매드 투가 활성을 잃고 동원체에서 떨어져 나간다. 밧줄이 팽팽한 것이 장력, 끈이 선반에 떨어진 것이 동원체에서 떨어져 나갔다는 표. 갈림점은 한쪽이 붙었느냐가 아니라 양쪽이 다 붙어 맞당겨지느냐.","box":[[1480,300,150,90],[1480,650,150,90],[1860,650,170,90]],"src":["s19p02m#3"],"cards":["C1-124"]}],"cq":{"C1-11#1":["중심절(centromere)과 동원체(kinetochore)의 차이 — 「중심절」? (↔ 동원체)","자매염색분체가 결합하는 DNA 부위"],"C1-11":["중심절(centromere)과 동원체(kinetochore)의 차이는?","중심절=자매염색분체가 결합하는 DNA 부위 · 동원체=중심절에 형성되어 방추사가 부착하는 단백질 복합체 (같은 말이 아님)"],"C1-10":["방추사가 염색체에 결합하는 부위의 명칭은?","동원체 (Kinetochore)"],"C1-11#2":["중심절(centromere)과 동원체(kinetochore)의 차이 — 「동원체」? (↔ 중심절)","중심절에 형성되어 방추사가 부착하는 단백질 복합체 (같은 말이 아님)"],"C1-70":["방추사가 염색체에 붙는 방향을 결정하는, 중심절 위의 단백질 복합체는?","동원체 (Kinetochore)"],"D0-99":["중기 II에서 자매염색분체의 동원체 방추사부착점은 어떻게 연결되는가?","각각 반대쪽 극에서 온 미세소관에 연결"],"D0-58":["늦은 전기 I에서 미세소관은 어디에 부착하는가?","각 상동쌍의 동원체 방추사부착점"],"C1-145":["중심절(Centromere) 영역에서 방추사 결합의 뼈대 역할을 하는 특수 히스톤 변이체는?","CENP-A (Centromere protein A)"],"C1-107":["동원체 부위에 방추사가 부착되도록 돕는 단백질은?","코헤신 (그 자리에 남아있음)"],"D0-102":["후기 II에서 자매염색분체 분리를 일으키는 직접 원인은?","동원체에서 붙들고 있던 단백질의 분해"],"C1-130":["감수 1분열 후기에 코헤신이 절단될 때, 동원체 부위의 코헤신만은 잘리지 않도록 세퍼레이스로부터 보호하는 단백질은?","슈고신 (Shugoshin)"],"C1-121":["M기 검문소에서 아직 방추사가 붙지 않은 '텅 빈 동원체'에 결합하여 대기 신호를 보내는 핵심 단백질은?","Mad2"],"C1-122":["Mad2 단백질이 직접 결합하여 활성을 억제해버리는 표적 단백질은?","Cdc20"],"C1-124":["모든 동원체에 방추사가 결합하여 '장력(Tension)'이 발생하면 활성을 잃고 동원체에서 떨어져 나가는 단백질은?","Mad2"]},"hubPanel":"s19p02l"};

  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.

function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact));
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
function speak(t) {
  t = ttsNorm(t);
  const my = ++speakSeq, at = i;
  const advance = (ms) => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, ms);
  if (!('speechSynthesis' in window)) { if (playing) advance(3500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = () => { if (started) advance(700); };
  u.onerror = () => { if (!started) advance(3000); };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started && my === speakSeq) { speechSynthesis.cancel(); advance(3000); } }, 2500);  // 목소리가 없으면 글만 3초
}
function go(k) {
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) setTimeout(() => { if (playing) next(); }, 3500);
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; speechSynthesis && speechSynthesis.cancel(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i + 1); else speechSynthesis && speechSynthesis.cancel(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) speechSynthesis && speechSynthesis.cancel(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
</script>
