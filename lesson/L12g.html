<script>
const L = {"id":"L12g","scene":"s12","part":"g","title":"운하 끝 늪과 목장 — 대장 · 장내 미생물 · 초식동물의 적응 · 필수 영양소","sub":"아래 띠 = 운하의 마지막 구간(대장): 들머리 곁 막다른 둥근 돌 못(맹장) + 거기 꼬리를 댄 지렁이 꼴 흙 광의 세균 단지(충수) → 노란 스펀지가 물을 거둬 되직해지는 진흙 물길 · 풀 줄기 깔개를 탄 진흙 벽돌(결장 · 섬유) → 벽돌을 쌓아 둔 나무 헛간(직장) → 관을 막은 빨간 입술 둘(괄약근 — 손잡이 없는 것 = 불수의 · 사람이 쥔 것 = 수의). 오른쪽 풀밭 = 목장: 속을 갈라 보인 젖소의 큰 술통에서 가위 든 세균과 원생생물이 풀을 자르고(소 가슴의 가위에는 가위표 = 셀룰레이스 없음) · 통 → 입 → 책 → 작은 강철 통(반추위 넷) · 넓적한 이빨(초식) · 호랑이의 긴 엄니(육식) · 풀과 고기를 든 아이(잡식) · 판자 갉는 흰개미. 위 줄 = 먹거리 좌판: 동전 · 낱장 벽돌 · 구슬 쟁반과 장판(음식에서 얻을 셋) · 구슬 여덟 + 아기의 구슬 하나(필수 아미노산 8 + 히스티딘) · 가위표 친 쌀밥 공기와 여행 가방(옥수수) · 가위표 친 메주(콩) · 장판 위 꼬리 꺾인 기름방울과 부러진 집게(리놀레산). 왼쪽 풀밭 = 세균 마을: 강철 통을 뚫는 헬리콥터 세균(헬리코박터) · 운하지기와 큰 세균의 악수(상리공생) · 먹이 홈통과 작은 집(숙주가 줌) · 리본 칼 · 타일 · 흰 옷 경비(세균이 줌) · 진흙 덩이를 마른 못에 옮겨 심는 농부(분변 이식)","img":"img/L12g.webp?v=01f0dacf07d7","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"운하의 마지막 구간 — 왼쪽 들머리 곁의 막다른 둥근 돌 못 · 가운데의 넓은 진흙 물길 · 오른쪽 끝의 나무 헛간 · 헛간에서 나가는 회색 관(오른쪽 끝이 둥글게 열렸다)의 빨간 입술 둘 (틀)","fact":"대장 = 맹장 · 결장 · 직장 · 항문","hook":"막다른 못 = 맹장(盲 = 막힌) · 넓은 진흙 물길 = 결장 · 헛간 = 직장 · 관의 입술 = 항문","say":"돌 운하의 마지막 구간은 대장이다. 소장을 지나온 묽은 물이 왼쪽에서 들어온다. 들머리 옆의 막다른 둥근 돌 못이 맹장이다. 맹은 막혔다는 뜻으로, 길이 막힌 주머니를 떠올리자. 가운데 넓은 진흙 물길은 결장, 오른쪽 끝 나무 헛간은 직장, 헛간에서 나가는 회색 관의 빨간 입술은 항문이다. 대장을 이루는 맹장·결장·직장·항문이 왼쪽에서 오른쪽 순서로 놓여 있다.","cards":["G1-142"],"box":[[186,664,258,250],[440,848,1120,226],[1556,656,250,440],[1806,884,242,142]]},{"sid":"s2","obj":"막다른 돌 못 테두리에 꼬리 끝이 겹친 지렁이 꼴 흙 광 — 마디가 진 굽은 붉은 갈색 흙 대롱 · 옆구리 네모 창 속에 초록 세균이 든 유리 단지 셋 · 머리 쪽 둥근 구멍에도 초록 세균 하나","fact":"충수 = 공생 미생물의 저장소(추정)","hook":"충수(蟲垂) = 벌레처럼 늘어진 돌기 → 지렁이 꼴 흙 광 · 세균 단지 = 저장소","say":"맹장인 돌 못에는 꼬리 끝을 댄 굽은 흙 대롱이 붙어 있다. 마디진 모습이 지렁이 같다. 충수의 충은 벌레 충이다. 맹장 끝에 벌레처럼 늘어진 돌기라는 이름을 연결하자. 옆구리의 네모 창 안에는 초록 세균이 든 유리 단지 셋이 있고, 머리 쪽 둥근 구멍에서도 세균 하나가 내다본다. 충수는 공생 미생물을 간직하는 저장소로 추정된다. 심한 설사로 장내 세균이 쓸려 나가면, 이곳에 남은 세균이 다시 퍼져 나갈 수 있다는 설명이다.","cards":["G1-143"],"box":[[22,586,200,208]]},{"sid":"s3","obj":"둑에 걸터앉아 물길에 몸을 담근 노란 스펀지 셋(위로 파란 물방울) · 왼쪽 묽은 흙탕에서 오른쪽으로 갈수록 짙어지는 진흙 · 물길 끝의 네모난 진흙 벽돌 여덟(네 장씩 두 줄) — 줄마다 긴 초록 풀 줄기 깔개를 탔고 윗줄 뒤에 흰 속도선 셋 · 진흙에 놓인 풀 줄기 다발 둘","fact":"결장 = 물 재흡수 완료 → 대변이 단단해짐 · 섬유가 이동을 도움","hook":"노란 스펀지 = 재흡수(L12b) · 벽돌이 된 진흙 = 농축된 대변 · 풀 줄기 깔개 = 셀룰로오스 섬유(썰매)","say":"결장에서는 물을 마저 회수한다. 둑의 노란 스펀지 셋이 물길에 잠겨 물을 빨아올리고, 위로 파란 물방울이 맺힌다. 재흡수가 계속되면서 왼쪽의 묽은 흙탕물은 오른쪽으로 갈수록 짙고 되직해지고 마지막에는 네모난 진흙 벽돌이 된다. 결장이 물 흡수를 마치고 대변을 농축하는 모습이다. 벽돌 아래의 초록 풀 줄기 깔개도 보자. 벽돌이 이를 썰매처럼 타고 오른쪽으로 이동한다. 풀 줄기는 소화되지 않는 셀룰로오스 섬유로, 끝까지 남아 장 내용물의 이동을 돕는다.","cards":["G1-144","G1-148","G1-145"],"box":[[545,738,540,172],[1046,892,484,160],[732,972,398,94]]},{"sid":"s4","obj":"운하 끝의 나무 헛간 — 열린 앞으로 진흙 벽돌이 차곡차곡 쌓였다 · 헛간에서 나가는 회색 관을 꼭 오므려 막은 빨간 입술 둘 — 헛간 쪽 입술에는 아무것도 달리지 않았고 · 바깥쪽 입술에는 둑 위의 일꾼이 쥔 긴 쇠 손잡이가 꽂혔다","fact":"직장 = 배설 전 대변 저장 · 괄약근 둘 = 불수의근 하나 · 수의근 하나","hook":"헛간 = 쌓아 두는 곳(직장) · 관을 막은 입술 = 괄약근 · 손잡이 없는 입술 = 불수의 · 사람이 쥔 손잡이 = 수의","say":"물길 끝 나무 헛간에는 진흙 벽돌이 쌓여 있다. 직장이 대변을 배출 전까지 저장한다는 뜻이다. 밖으로 나가는 회색 관은 오므린 빨간 입술 둘이 막고 있다. 이 덱에서 관을 막는 입술은 괄약근이다. 헛간 쪽 입술에는 아무것도 달려 있지 않고 사람 손도 닿지 않아, 저절로 여닫히는 불수의근을 나타낸다. 바깥쪽 입술의 긴 쇠 손잡이는 둑 위 일꾼이 쥐고 있어, 의지대로 여닫는 수의근을 나타낸다. 결장과 항문 사이의 두 괄약근 중 하나는 불수의근, 다른 하나는 수의근이다. 바깥쪽 손잡이가 배변을 참는 기능과 연결된다.","cards":["G1-146","G1-147"],"box":[[1556,656,250,440],[1806,760,242,266]]},{"sid":"s5","obj":"속을 갈라 보인 젖소의 큰 나무 술통 속 — 가위를 쥔 초록 세균과 털이 삐죽삐죽 난 연보라 길쭉한 원생생물(몸 앞에 가위 하나)이 풀 다발을 자르고 바닥에 풀 토막이 흩어졌다 · 소 가슴의 빨간 손잡이 가위에는 널빤지 가위표 · 통 오른쪽에 튀어나온(짧은 선 셋) 구슬 셋과 작은 칼 · 맨 오른쪽 판자를 갉는 흰개미의 말풍선 속에 같은 초록 세균과 털 난 연보라 원생생물","fact":"셀룰로오스 분해 = 공생 미생물 · 원생생물 몫(소 · 흰개미) → 비타민 · 아미노산도 줌","hook":"가위 = 자르는 효소(셀룰레이스) · 가위표 친 가위 = 소에게는 없다 · 구슬 = 아미노산 · 칼 = 비타민","say":"풀의 셀룰로오스를 자르는 가위는 셀룰레이스다. 소의 가슴에 걸린 가위에는 널빤지 가위표가 있어, 소에게 이 효소가 없음을 보여 준다. 초식동물은 스스로 셀룰로오스를 분해하지 못한다. 대신 배 속 큰 통에서 초록 세균과 털 난 연보라 원생생물이 저마다 가위를 들고 풀 다발을 자른다. 가위의 주인은 공생 미생물이다. 통 오른쪽으로 나온 구슬 셋은 아미노산, 작은 칼은 비타민이다. 미생물은 셀룰로오스를 분해하며 이런 유용한 물질도 소에게 제공한다. 맨 오른쪽에서 판자를 갉는 흰개미의 말풍선에도 같은 세균과 원생생물이 있다. 흰개미가 나무를 소화하는 데에도 공생 미생물과 원생생물이 관여한다.","cards":["G1-157","G1-158","G1-160","G1-159"],"box":[[1302,330,236,182],[1180,440,82,88],[1532,402,98,78],[1708,350,232,206]]},{"sid":"s6","obj":"소 속의 네 칸과 초록 화살 넷 — 큰 나무 술통과 그 왼쪽 아래에 붙은 노란 벌집 주머니 · 입과 통을 잇는 분홍 관의 위아래 화살(위 = 통 쪽으로 · 아래 = 입 쪽으로) · 통 밑의 펼친 책(왼쪽에 파란 물방울 셋) · 책 오른쪽의 작은 둥근 회색 강철 통(앞을 잘라 낸 틈으로 초록 물이 보인다)","fact":"반추위 넷: 혹위 · 벌집위(발효) → 되새김 → 겹주름위(물 흡수) → 주름위(진짜 위)","hook":"술통 = 혹위(발효) · 벌집 주머니 = 벌집위 · 책장 = 겹주름위 · 작은 강철 통 = 주름위(L12a 의 그 통 = 진짜 위)","say":"소의 위는 네 칸이다. 초록 화살을 따라가자. 삼킨 풀은 위쪽 화살이 가리키듯 분홍 관을 지나 큰 나무 통, 첫째 칸인 혹위로 들어간다. 술을 빚듯 미생물이 풀을 발효하는 곳이다. 통 옆의 노란 벌집 주머니는 둘째 칸인 벌집위다. 덜 소화된 풀은 아래쪽 화살을 따라 입으로 올라와 다시 씹힌다. 되새김이다. 다시 삼키면 통 아래 펼친 책으로 내려간다. 셋째 칸 겹주름위는 책장처럼 주름이 겹쳐 있고, 옆의 물방울은 이곳의 물 흡수를 나타낸다. 마지막은 책 오른쪽의 작은 강철 통, 넷째 칸 주름위다. 앞의 위 그림에서 보았듯 효소로 소화하는 진짜 위다. 혹위, 벌집위, 되새김, 겹주름위, 주름위의 순서로 연결하자.","cards":["G1-218"],"box":[[1250,330,290,222],[1172,346,172,116],[1344,494,124,112],[1456,506,128,104]]},{"sid":"s7","obj":"풀을 씹는 젖소의 입 — 넓적하고 네모난 흰 이빨이 두 줄 · 앞발로 안은 티본 고깃덩이 위로 긴 흰 엄니 둘을 드리운 주황 호랑이 · 한 손에 초록 잎채소 다발 한 손에 붉은 고깃덩이를 들고 웃는 아이","fact":"초식 = 넓고 갈기 좋은 이 · 육식 = 찢고 뜯는 이 · 잡식 = 둘 다 조금씩","hook":"넓적한 이 = 갈기 · 긴 엄니 = 찢고 뜯기 · 채소와 고기를 다 든 아이 = 잡식","say":"이번에는 이빨과 먹이를 연결해 보자. 풀을 씹는 소의 입에는 넓적하고 네모난 이빨이 줄지어 있어 갈기에 좋다. 옆의 호랑이는 긴 엄니 둘을 고기에 드리우고 있어, 찢고 뜯는 육식동물의 이를 보여 준다. 둘 사이의 아이는 한 손에 잎채소, 다른 손에 고깃덩이를 들고 있다. 사람 같은 잡식동물의 이는 두 기능을 어느 정도 함께 갖는다. 앞니로 끊고 찢으며 어금니로 간다. 소가 풀만 먹고도 살 수 있는 비결은 넓적한 이와 배 속의 공생 미생물이다. 이 두 가지로 셀룰로오스 먹이에 적응한 것이다.","cards":["G1-149","G1-150","G1-151","G1-213"],"box":[[1060,410,144,92],[928,478,152,262],[1068,590,150,142]]},{"sid":"s8","obj":"빨간 차양 좌판의 나무 궤짝 셋 — 왼쪽 궤짝의 금 동전 더미 · 가운데 궤짝의 회색 낱장 벽돌 더미 · 오른쪽 궤짝의 구슬 쟁반과 그 곁에 세운 초록 장판 두루마리","fact":"음식에서 얻을 셋 = 화학 에너지 · 유기 구성요소 · 필수 영양소(몸이 못 만듦)","hook":"동전 = ATP(화학 에너지) · 낱장 벽돌 = 탄소 뼈대(유기 구성요소) · 좌판에서 사 와야만 하는 것 = 필수 영양소","say":"풀밭 위쪽의 빨간 차양 좌판에는 동물이 음식에서 반드시 얻어야 할 세 가지가 있다. 왼쪽 궤짝의 금 동전은 이 덱에서 ATP, 화학 에너지를 뜻한다. 가운데 궤짝의 회색 낱장 벽돌은 하나당 탄소 하나로, 몸을 만드는 유기 구성요소다. 오른쪽 궤짝에는 구슬 쟁반이 들어 있고, 그 곁에 장판 두루마리가 서 있다. 필수 영양소다. 몸에서 합성하지 못하거나 충분히 만들지 못해 반드시 음식으로 섭취해야 하는 영양소다. 스스로 만들 수 없으니 좌판에서 사 와야 한다고 연결하자. 화학 에너지, 유기 구성요소, 필수 영양소의 셋이다.","cards":["G1-0","G1-7"],"box":[[744,150,116,70],[876,142,118,78],[1010,138,222,84]]},{"sid":"s9","obj":"오른쪽 궤짝의 나무 쟁반 — 홈 여덟에 빛깔이 다 다른 구슬 여덟(네 알씩 두 줄) · 좌판 오른쪽 유아 의자에 앉아 웃는 아기가 치켜든 분홍 구슬 하나","fact":"필수 아미노산 = 쟁반 8가지 + 히스티딘 = 9가지(기본서: 히스티딘은 유아에게 필수)","hook":"구슬 = 아미노산 · 홈 여덟 = 8가지 · 히히 웃는 아기 = 히스티딘","say":"쟁반의 홈 여덟 곳에 서로 다른 색의 구슬 여덟 개가 놓여 있다. 구슬은 아미노산이며, 몸에서 만들지 못하는 필수 아미노산 가운데 여덟 가지를 나타낸다. 가지 달린 삼형제는 류신·아이소류신·발린, 옥수수 장수에게 없는 둘은 라이신·트립토판, 콩 장수에게 없는 하나는 메티오닌이다. 나머지 둘은 페닐알라닌·트레오닌이다. 셋, 둘, 하나, 둘을 합하면 여덟이다. 오른쪽 유아 의자의 아기는 분홍 구슬 하나를 더 치켜들고 히히 웃는다. 히히에서 히스티딘을 떠올리자. 쟁반의 여덟에 아기의 히스티딘을 더하면 아홉이다. 기본서는 어른의 필수 아미노산을 여덟으로 두고 유아에게는 히스티딘도 필수라고 하며, 지금 기준은 어른에게도 히스티딘을 필수로 보아 아홉으로 센다. 어느 쪽으로 물어도 쟁반 여덟과 아기 하나로 떠올리자.","cards":["G1-8","G1-9"],"box":[[1016,154,118,62],[1260,130,146,202]]},{"sid":"s10","obj":"좌판 왼쪽의 통옥수수 탈 장수 — 곁의 기둥 선반에 널빤지 가위표를 친 흰 쌀밥 공기 · 발치에 가위표를 친 스티커 붙은 갈색 여행 가방 / 맨 오른쪽의 초록 콩깍지 탈 장수 — 곁의 기둥 가로대에 끈으로 매단, 열십자로 묶은 갈색 덩이(메주)에 가위표","fact":"식물성 단백질 = 불완전 · 옥수수: 라이신 · 트립토판 ↓ / 콩: 메티오닌 ↓","hook":"쌀밥(라이스) = 라이신 · 여행 가방(트립) = 트립토판 · 메주 = 메티오닌 · 널빤지 가위표 = 여기엔 없다","say":"좌판 양옆의 탈을 쓴 장수들을 보자. 대부분의 식물성 단백질은 필수 아미노산이 하나 이상 부족한 불완전단백질이다. 왼쪽 통옥수수 탈 장수 곁 선반의 쌀밥 공기와 발치의 스티커 붙은 여행 가방에는 널빤지 가위표가 있다. 이 장수에게는 없다는 표시다. 쌀밥의 라이스는 라이신, 여행의 트립은 트립토판으로 연결된다. 옥수수에는 라이신과 트립토판이 부족하다. 오른쪽 콩깍지 탈 장수의 기둥에 매단 메주에도 가위표가 있다. 콩 장수인데 메주가 없다는 장면에서 메티오닌을 떠올리자. 콩에는 메티오닌이 부족하므로, 옥수수와 콩을 함께 먹으면 서로 부족한 부분을 보완할 수 있다.","cards":["G1-10","G1-11","G1-12"],"box":[[450,100,222,228],[1774,104,198,224]]},{"sid":"s11","obj":"구슬 쟁반 곁의 초록 장판 두루마리 — 그 위에 올라앉은 노란 기름방울의 지그재그 꼬리가 ㄱ 자로 한 번 꺾였다 / 오른쪽 작업대 위의 파란 옷 일꾼 — 한 손에는 빨간 손잡이 집게 · 다른 손에는 부러져 떨어진 빨간 손잡이 토막(집게 둘레에 놀란 금) · 곁에는 지그재그 꼬리가 곧게 뻗은 노란 기름방울","fact":"필수 지방산 = 리놀레산 — 불포화 결합을 몸이 못 만든다","hook":"리놀륨 장판 = 리놀레산 · 꼬리의 꺾임 = 불포화 결합 · 부러진 집게 = 몸은 못 꺾는다","say":"궤짝 속 쟁반 옆 초록 장판 두루마리를 보자. 장판의 리놀륨에서 리놀레산을 떠올린다. 그 위의 노란 기름방울은 지그재그 꼬리가 ㄱ 자로 한 번 꺾여 있다. 노란 기름방울은 지방, 꼬리의 꺾임은 불포화 결합이다. 리놀레산은 불포화 지방산이자 대표적인 필수 지방산이다. 왜 음식으로 섭취해야 할까? 오른쪽 작업대의 일꾼이 곧은 꼬리를 집게로 꺾으려다가 손잡이가 부러진 모습을 보자. 사람은 그 위치에 불포화 결합을 만들지 못하므로, 이미 결합이 있는 형태로 음식에서 받아야 한다.","cards":["G1-13","G1-14"],"box":[[1130,134,100,88],[1594,132,184,192]]},{"sid":"s12","obj":"왼쪽 위 구석의 둥근 회색 강철 통(앞을 잘라 속이 보인다 · 거품 이는 연초록 물이 반쯤) — 머리에 프로펠러(헬리콥터 회전 날개 — 기둥 위 납작한 타원과 긴 날개)를 단 초록 세균이 노란 전동 드릴로 통 벽을 뚫는다 · 벽이 검붉게 들쭉날쭉 패였다(둘레에 금 · 튄 쇳조각)","fact":"헬리코박터 파일로리 — 위에 살며 위궤양을 일으킬 수 있다","hook":"헬리콥터 날개 = 헬리코박터 · 작은 강철 통 = 위(L12a) · 벽에 팬 구멍 = 궤양","say":"왼쪽 위 작은 강철 통은 앞의 위 그림에서 본 위다. 그 안에서 머리에 헬리콥터 날개를 단 초록 세균이 전동 드릴로 벽을 뚫어, 검붉게 패인 자국과 금을 남긴다. 헬리콥터에서 헬리코박터 파일로리를 떠올리자. 강한 산이 있는 위에서도 살며 위벽을 손상시켜 위궤양을 일으킬 수 있는 세균이다. 미생물은 장에만 사는 것도 아니고, 늘 유익한 손님인 것도 아니라는 예다.","cards":["G1-155"],"box":[[18,54,280,276]]},{"sid":"s13","obj":"파란 멜빵바지 운하지기와 그의 어깨까지 오는 큰 초록 세균의 악수 · 큰 세균 뒤쪽, 기둥에 비스듬히 걸친 긴 나무 널(먹이 홈통 — 미끄럼틀 꼴)에서 먹이 알갱이가 흰 그릇으로 쏟아지고 · 그 밑에서 작은 세균 둘이 또 한 그릇을 사이에 두고 먹는다 · 곁에 창에 불이 켜진 빨간 지붕 작은 집","fact":"사람 – 장내 미생물 = 상리공생 · 숙주가 주는 것 = 꾸준한 영양 · 안정적 환경","hook":"악수 = 상리공생 · 쉬지 않고 쏟아지는 먹이 홈통 = 꾸준한 영양 · 불 켜진 작은 집 = 안정적 환경","say":"풀밭 가운데 파란 멜빵바지 운하지기와 그의 어깨 높이만 한 큰 초록 세균이 악수한다. 운하지기는 사람 숙주, 세균은 장내 미생물이다. 서로 이익을 얻는 상리공생을 나타낸다. 숙주가 주는 것부터 보자. 큰 세균 뒤의 비스듬한 나무 홈통에서는 먹이가 계속 쏟아지고 작은 세균 둘이 받아먹는다. 꾸준한 영양 공급이다. 옆의 창에 불이 켜진 빨간 지붕의 작은 집은 따뜻하고 안정적인 생활환경이다. 숙주는 미생물에게 영양과 안정적 환경을 제공한다.","cards":["G1-152","G1-154"],"box":[[440,500,192,238],[618,342,204,312],[812,438,136,206]]},{"sid":"s14","obj":"큰 세균이 다른 손에 치켜든 빨간 리본 맨 부엌칼 · 운하지기 왼쪽의 흙손을 든 작은 세균과 그 곁에 한 줄로 놓인 연하늘색 타일 넷 · 그 위쪽, 초록 파리채를 치켜든 흰 옷 경비와 손을 잡고 선 작은 세균","fact":"장내 미생물이 주는 것 = 비타민 · 장 상피 발달 · 선천 면역 보조","hook":"리본 맨 칼 = 비타민(K) 선물 · 타일 = 상피 · 흰 옷 경비 = 백혈구 · 파리채 = 가리지 않는 선천 면역","say":"미생물이 숙주에게 주는 이익은 셋이다. 큰 세균이 악수하지 않은 손으로 치켜든 부엌칼은 빨간 리본을 맨 선물이다. 칼은 비타민 K이며, 장내 세균은 비타민 K·비오틴·엽산 등을 만들어 준다. 둘째, 운하지기 왼쪽의 작은 세균이 흙손으로 깐 타일 넷은 상피다. 장 상피가 제대로 발달하도록 돕는다는 뜻이다. 셋째, 그 위의 흰 옷 경비는 백혈구이고, 초록 파리채는 상대를 가리지 않는 선천 면역이다. 작은 세균이 경비 곁에 서서 손을 잡고 있어 선천 면역을 돕는 관계를 보여 준다. 비타민 공급, 장 발달 도움, 면역 보조로 정리하자.","cards":["G1-153","G1-212"],"box":[[630,512,66,116],[232,576,192,74],[318,338,198,154]]},{"sid":"s15","obj":"맨 왼쪽의 밀짚모자 농부 — 삽으로 뜬 갈색 진흙 덩이(위에 초록 세균 하나)를 바닥이 쩍쩍 갈라진 잿빛 마른 못에 옮겨 심는다","fact":"분변 이식 — 건강한 미생물군집을 옮겨 장 기능을 회복","hook":"진흙 덩이 = 대변 · 삽으로 옮겨 심기 = 이식 · 잿빛 마른 못 = 세균을 잃은 장","say":"맨 왼쪽 밀짚모자 농부의 발치에는 잿빛으로 말라 갈라진 못이 있다. 살던 세균이 사라져 문제가 생긴 장이다. 농부는 초록 세균이 올라앉은 갈색 진흙 덩이를 삽으로 떠서 못에 옮긴다. 이 그림의 진흙은 대변이다. 건강한 사람의 대변에 있는 미생물군집을 옮기는 분변 이식이다. 건강한 미생물군집을 회복해 장 기능을 되살리려는 방법으로, 앞서 악수하던 유익한 세균을 다시 들이는 모습과 연결하자.","cards":["G1-156"],"box":[[58,342,298,214]]}],"cq":{"G1-142":["대장은 무엇으로 이루어지는가?","맹장, 결장, 직장, 항문"],"G1-143":["충수돌기의 추정 기능은?","공생 미생물 저장소"],"G1-144":["결장의 핵심 기능은?","물 흡수 완료와 대변 농축"],"G1-148":["대변이 결장을 지나며 단단해지는 이유는?","물이 계속 재흡수되기 때문"],"G1-145":["대변 속 소화되지 않는 셀룰로오스 섬유의 역할은?","소화관을 따라 음식 이동을 돕는다"],"G1-146":["직장의 역할은?","배설 전 대변 저장"],"G1-147":["결장과 항문 사이 괄약근 두 개의 특징은?","하나는 수의근 · 하나는 불수의근"],"G1-157":["초식동물이 셀룰로오스를 직접 분해하지 못하는 이유는?","셀룰레이스가 없기 때문"],"G1-158":["초식동물의 셀룰로오스 소화는 누가 도와주는가?","장내 미생물과 원생생물"],"G1-160":["초식동물 공생 미생물이 주는 영양상 이점은?","셀룰로오스를 분해해 비타민·아미노산 등 유용한 물질을 제공한다"],"G1-159":["흰개미가 셀룰로오스를 소화할 수 있는 이유는?","공생 미생물/원생생물의 도움 때문"],"G1-218":["반추동물(소·양)의 위 4실과 소화 순서는?","혹위(rumen)·벌집위(reticulum)에서 미생물이 셀룰로오스 발효 → 되새김(cud 재저작) → 겹주름위(omasum, 수분 흡수) → 주름위(abomasum, 효소 소화·진짜 위)"],"G1-149":["초식동물 치아의 일반적 특징은?","넓고 갈기 쉽다"],"G1-150":["육식동물 치아의 일반적 특징은?","찢고 뜯기 쉽다"],"G1-151":["잡식동물 치아의 일반적 특징은?","초식과 육식 기능을 둘 다 어느 정도 가진다"],"G1-213":["초식동물 적응의 핵심을 한 문장으로 쓰면?","치아와 장내 공생 미생물을 통해 셀룰로오스 식이에 적응한다"],"G1-0":["동물이 음식을 통해 반드시 얻어야 하는 세 가지는?","화학적 에너지 · 유기 구성요소 · 필수 영양소"],"G1-7":["필수 영양소란?","체내 합성이 불가능하거나 부족해 음식으로 반드시 섭취해야 하는 영양소"],"G1-8":["기본서의 필수 아미노산 8가지(성인)는?","아이소류신 · 류신 · 라이신 · 메티오닌 · 페닐알라닌 · 트레오닌 · 트립토판 · 발린"],"G1-9":["유아에서 추가로 필수 아미노산인 것은?","히스티딘 (지금 기준은 어른에게도 필수 — 모두 9가지)"],"G1-10":["대부분의 식물성 단백질이 불완전단백질인 이유는?","하나 이상의 필수 아미노산이 부족하기 때문"],"G1-11":["옥수수에 특히 부족한 필수 아미노산 두 가지는?","라이신과 트립토판"],"G1-12":["콩에 특히 부족한 필수 아미노산은?","메티오닌"],"G1-13":["필수 지방산의 대표 예는?","리놀레산"],"G1-14":["리놀레산이 필수 지방산인 이유는?","불포화 결합을 인체가 합성하지 못하기 때문"],"G1-155":["헬리코박터 파일로리가 중요한 예시인 이유는?","위에 살며 위궤양을 일으킬 수 있기 때문"],"G1-152":["인간과 장내 미생물의 관계는?","상리공생"],"G1-154":["숙주가 장내 미생물에게 주는 이점 두 가지는?","꾸준한 영양 공급과 안정적 환경"],"G1-153":["장내 미생물이 숙주에게 주는 다른 이점 두 가지는?","장 상피 발달 도움 · 선천 면역 기능 보조"],"G1-212":["장내 미생물의 공생 이점을 숙주 관점에서 쓰면?","비타민 공급 · 장 발달 도움 · 면역 보조"],"G1-156":["분변 이식이 사용되는 이유를 한 문장으로 쓰면?","건강한 미생물군집을 회복시켜 장 기능을 회복시키기 위해"]},"hubPanel":null};
const $ = id => document.getElementById(id);
$('title').textContent = L.title; document.title = L.title;
// 요약 줄(sub)에는 물건 = 답이 다 적혀 있다 — 복습 · 시험에서는 접어 두고, 누르면 편다(GPT 추가 감사 2026-11-11 §7)
let subOpen = false;
function subShow() { const hide = (mode === 'review' || mode === 'quiz') && !subOpen && !!L.sub; $('sub').textContent = hide ? '요약 줄은 접어 두었다(답이 적혀 있다) — 누르면 편다' : (L.sub || ''); $('sub').classList.toggle('hid', hide); }
$('sub').onclick = () => { if (mode === 'review' || mode === 'quiz') { subOpen = !subOpen; subShow(); } };
$('img').src = L.img; $('img').alt = L.title;
if (L.home) $('home').href = L.home;  // 한 파일(standalone)은 저장소 밖에서 열리므로 배포 주소로
if (L.hub) $('hub').href = L.hub; else if (L.hubPanel) $('hub').href = '../sketchy.html#' + L.hubPanel;
const ov = $('ov'); ov.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
let tourEnded = false;
let mode = 'tour', i = -1, playing = false, voice = true, rate = 1.0, quizOrder = [], quizPos = 0, quizRevealed = false, shuffle = false, sess = null;
const stops = L.stops;
subShow();
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID
const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact), st.sid);
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';

  // 바뀐 읽기 뒤에 바로 붙은 조사를 받침에 맞춘다(「Ca²⁺가」 → 「칼슘 이온이」) — 띄어쓰기 · 문장부호 앞의 조사만
  const PAIR = { '가': ['이', '가'], '이': ['이', '가'], '를': ['을', '를'], '을': ['을', '를'], '는': ['은', '는'], '은': ['은', '는'], '와': ['과', '와'], '과': ['과', '와'] };

  function particle(reading, p) {
    const c = reading.slice(-1).charCodeAt(0);
    if (!(c >= 0xAC00 && c <= 0xD7A3)) return p;

    let out = '', i = 0, k;

      out += t.slice(i, k) + to; i = k + from.length;

  function ttsNorm(text, lex, order, lesson) {

    t = t.replace(/L(\d{2})([a-z]?)(?![A-Za-z0-9])/g, (all, n, c) => {
      const id = 'L' + n + c; const title = order && order[id];
      return title ? `「${title}」 그림` : '다른 그림';
    });
    // ② 로마 숫자(문맥) — 볼티모어 군 · 부두 번호는 한자어 수, 나머지는 영어 수. 대 · 자 · 선 · 기가 붙으면 글자
    const baltimore = /^L01/.test(lesson || '');
    t = t.replace(/(?<![A-Za-z0-9])(VII|VI|IV|V|III|II|I)(b|x)?(?![A-Za-z0-9₀-₉])((?:으로|로|가|이|를|을|는|은|와|과)(?=[\s,.·)」'"!?:;]|$))?/g, (all0, r, suf, pp, off, str) => {
      const all = r + (suf || ''); const P = x => x === all ? all0 : x + (pp ? particle(x, pp) : '');
      const after = str.slice(off + all.length, off + all.length + 3), before = str.slice(Math.max(0, off - 12), off);
      if (/^\s?(대|자|선)/.test(after)) return all0;                       // I대 · V자 · Z선 → 글자(기본값)
      const n = ROMAN[r];
      if (/^\s?(번|군)/.test(after) || (baltimore && !suf)) return P(sino(n) + (suf ? ' ' + lettersOf(suf) : ''));

    t = t.replace(/이온 이온/g, '이온');

      return tok.replace(core, core.split('-').filter(Boolean).map(p => {
        const r = W[p] !== undefined ? W[p] : (/^[0-9]+$/.test(p) && prevWord ? tailNum(p) : spell(p));

  function classify(tok, lex) {
    const W = (lex && lex.words) || {}; const core = tok.replace(/^-+|-+$/g, '');
    if (W[core] !== undefined) return 'lex';
    // 소문자 세 글자 이상이 든 조각은 사전이 잡아야 한다(나머지 조각은 글자 이름이어도 된다)
    return core.split('-').filter(Boolean).every(p => W[p] !== undefined || !/[a-z]{3,}/.test(p)) ? 'lex' : 'default';

const ttsNorm = t => TTSNorm.ttsNorm(t, TTS_LEX, TTS_ORDER, L.id);
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate, auto:playing && mode === 'tour',
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate, auto:true,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
