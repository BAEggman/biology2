<script>
const L = {"id":"L11b","scene":"s11","part":"b","title":"판자 길의 세 인부 — 대장균 DNA 중합효소 III·I·II","sub":"등 셋·하나·둘로 세 인부 구별 · 다섯 발과 세 발의 작업대로 합성·교정·프라이머 절제 방향 읽기","img":"img/L11b.webp?v=1f7b918a27d9","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"본선의 주황 인부 모자에는 등 셋, 노랑 인부 모자에는 등 하나가 달렸다. 곁길의 파란 인부 모자에는 등이 둘이다.","fact":"대장균 대표 DNA 중합효소 · III는 주 복제, I은 프라이머 교체, II는 손상 대응","hook":"주황 망치 → 길게 복제 · 노랑 인부의 두 손 → 프라이머 교체 · 파랑 곁길 → 손상 대응","say":"이 판자 길에서는 대장균의 DNA 복제를 살펴본다. 주황 인부는 폴 쓰리, 노랑 인부는 폴 원, 파란 인부는 폴 투다. 모자에 달린 등의 수를 효소 이름과 연결하자. 같은 절편에서는 폴 쓰리가 길게 합성하고 폴 원이 프라이머를 교체한다. 파란 인부의 곁길은 손상에 대응하는 별도의 상황이다. 대장균에는 폴 포와 폴 파이브도 있지만 이 그림은 폴 원·투·쓰리를 비교한다. 본선의 두 작업 자리는 각 효소의 동작을 비교하도록 떨어져 있다. 테두리 색은 담당 인부의 작업복 색과 같다. 모든 작업대에서 파란 다섯 발은 오 프라임, 주황 세 발은 삼 프라임이다. 도구가 있는 줄을 하나씩 따라가며 출발점과 도착점을 확인하자.","box":null,"src":["s11p02#3"],"cards":["E1-71"]},{"sid":"s2","obj":"주황 작업대의 왼쪽 파란 다섯 발과 오른쪽 주황 세 발. 망치가 달린 윗길은 다섯 발에서 세 발로 향한다.","fact":"새 DNA는 기존 3′-OH에 뉴클레오타이드를 붙여 5′→3′로 합성한다","hook":"다섯 발 → 세 발 = 5′→3′ 합성 · 새 뉴클레오타이드는 늘어나는 3′-OH에 붙임","say":"다섯 발 빗은 오 프라임, 세 발 빗은 삼 프라임이다. 망치가 달린 초록 길을 다섯에서 셋으로 따라가자. 새 가닥이 합성되는 방향이다. 중합효소가 다음 뉴클레오타이드를 붙이는 실제 자리는 이미 놓인 프라이머 또는 새 가닥의 자유로운 삼 프라임 수산기다. 선도 가닥과 지연 가닥의 각 절편에 모두 같은 원리가 적용된다.","box":[[52,210,330,118],[50,520,304,158]],"src":["s11p02#0"],"ask":"주황 작업대의 양 끝을 세어 보자. 세 중합효소의 합성 방향과 실제로 다음 뉴클레오타이드가 붙는 화학적 말단은?","cards":["E1-76"]},{"sid":"s3","obj":"노랑 인부의 집게 오른쪽에 아직 뽑지 않은 은색 쇠못들이 남아 있다.","fact":"쇠못 = 프라이메이스가 만든 RNA 프라이머 · DNA 합성에 출발할 3′-OH 제공","hook":"은빛 쇠못으로 시작 · 오카자키 절편마다 새 프라이머","say":"노랑 인부 옆에 줄지어 박힌 은빛 쇠못은 RNA 프라이머다. 프라이메이스가 먼저 RNA를 만들어 DNA 중합효소가 출발할 삼 프라임 수산기를 제공한다. 지연 가닥에서는 오카자키 절편마다 프라이머를 새로 놓는다. 복제 뒤에는 RNA를 DNA로 교체해야 한다. 은못을 제거하는 방향은 노랑 작업대 아래 줄에서 확인하자.","box":[1708,554,122,105],"src":["s11p02#1"],"ask":"쇠못은 누가 무엇으로 만들며, DNA 중합효소에 어떤 시작점을 제공하는가?","cards":["E1-70","E1-64"]},{"sid":"s4","obj":"노랑 인부의 왼쪽에는 교체를 마친 갈색 나무못이 박혀 있고, 손은 다음 나무못을 빈 구멍에 끼우려 한다.","fact":"교체 전에는 RNA 프라이머 · Pol I이 그 자리를 채우면 DNA가 남는다","hook":"은빛이었던 자리에 판자와 같은 나무 → DNA로 교체 완료","say":"노랑 인부가 빼는 은못은 RNA이고 새로 끼우는 나무못은 DNA이다. DNA로 채우면 뉴클레오타이드가 빠져 있던 틈은 사라진다. 하지만 이웃 절편과의 골격 결합 하나는 아직 연결되지 않았다. 그 상태는 맨 오른쪽 라이터가 놓인 작업대에 표현되어 있다.","box":[[1320,557,110,101],[1478,503,73,155]],"src":["s11p02#2"],"ask":"교체를 끝낸 구간의 못은 어떤 물질인가? 은빛 못이 박혀 있던 때와 비교해 보자.","cards":["E1-63#2"]},{"sid":"s5","obj":"불빛 셋이 달린 모자의 주황 인부 곁에 큰 망치가 놓여 있다.","fact":"Pol III = 대장균의 주 복제효소 · 선도·지연 가닥 모두 5′→3′로 연장","hook":"큰 망치 → 합성 · 선도 가닥은 연속, 지연 가닥은 오카자키 절편마다","say":"주황 인부의 큰 망치는 대장균의 주 복제효소인 DNA 중합효소 쓰리다. 선도 가닥은 연속적으로, 지연 가닥은 오카자키 절편 단위로 연장한다. 두 경우 모두 새 DNA는 오 프라임에서 삼 프라임으로 자란다. 베타 활주 클램프는 이중가닥 DNA를 둘러싸고 중합효소를 붙들어, 한 번 결합했을 때 긴 구간을 합성하도록 돕는다.","box":[[546,69,484,393],[319,520,254,151]],"src":["s11p02#3"],"ask":"모자에 등 셋인 인부가 주로 하는 일은? 어느 가닥을 연속적으로 만들며, 다른 가닥의 각 절편은 어느 방향으로 만드는가?","cards":["E1-71","E1-65"]},{"sid":"s6","obj":"주황 인부가 판자 끝에 잘못 끼워진 붉은 못을 집게로 뽑는다. 주황 테두리 작업대에서 같은 집게는 세 발에서 다섯 발 쪽으로 되짚는다.","fact":"3′→5′ 교정 절제 · 새 가닥 3′ 끝에 잘못 들어간 뉴클레오타이드를 복제 중 제거","hook":"세 발 → 다섯 발로 되짚는 집게 = 새 3′ 끝의 오삽입을 3′→5′로 교정","say":"주황 작업대에서 집게와 비뚤어진 붉은 조각이 있는 줄을 따라가 보자. 세 발 끝에서 다섯 발 쪽으로 되돌아간다. 폴 쓰리가 자라는 삼 프라임 말단의 잘못된 뉴클레오타이드를 제거하는, 삼 프라임에서 오 프라임 방향의 교정이다. 제거한 뒤에는 맞는 뉴클레오타이드를 붙여 오 프라임에서 삼 프라임 방향의 합성을 이어간다. 노랑과 파랑 작업대에도 같은 집게가 있다. 대장균의 폴 원·투·쓰리는 모두 교정할 수 있다. 복제가 끝난 뒤 남은 오류를 찾는 불일치 수선과는 작용 시점이 다르다.","box":[[918,437,169,228],[56,348,322,88]],"src":["s11p02#4"],"ask":"주황 작업대의 집게는 어느 발에서 어느 발 쪽으로 되짚는가? 언제 어느 가닥 끝에서 무엇을 제거하는가?","cards":["E1-78","E1-79#1","X-BT-4","I1-44#2","E1-77"]},{"sid":"s7","obj":"노랑 인부의 오른쪽 집게가 은못 대열의 첫 못을 뽑는다. 앞쪽에는 아직 뽑을 은못이, 뒤쪽에는 이미 끼운 나무못이 보인다. 노랑 작업대 맨 아랫줄은 다섯 발에서 세 발로 간다.","fact":"Pol I의 5′→3′ 핵산 절제 활성 → 다음 절편 5′ 쪽 RNA 프라이머 제거","hook":"다섯 발 → 세 발 · 은못 뽑개 = Pol I의 5′→3′ RNA 프라이머 절제","say":"판자에서 나무못이 놓인 왼쪽부터 은못이 남은 오른쪽으로 눈을 옮겨 보자. 노랑 인부는 남은 은못 가운데 가장 왼쪽 것부터 뽑는다. 손에 든 뽑개를 찾은 뒤, 노랑 작업대에서 같은 도구가 붙은 맨 아래 줄을 읽자. 왼쪽 다섯 발에서 오른쪽 세 발로 향한다. 폴 원이 다음 오카자키 절편의 오 프라임 끝에 있는 RNA 프라이머를 오 프라임에서 삼 프라임 방향으로 제거하는 작용이다. 바로 위에서 되돌아가는 집게 줄은 자신의 새 DNA 말단을 고치는 교정으로, 방향이 반대다. 대장균에서는 RNase H도 프라이머 처리에 참여할 수 있다.","box":[[1598,481,224,181],[1054,304,328,82]],"src":["s11p02#5"],"ask":"은못을 뽑는 아랫줄의 출발·도착 말단은? 어떤 가닥의 무엇을 걷어내며, 세 효소 중 누가 이 활성을 가지는가?","cards":["E1-72","E1-73","E1-63#1","E1-66","I1-44#1"]},{"sid":"s8","obj":"은못을 빼는 집게 바로 왼쪽에서 다른 손이 나무못 하나를 빈자리에 끼운다. 노랑 작업대 맨 위 망치 길도 다섯 발에서 세 발 쪽으로 이어진다.","fact":"Pol I의 5′→3′ DNA 합성 · 프라이머를 제거하며 DNA로 채워 닉의 위치가 이동","hook":"다섯 발 → 세 발의 망치 = 5′→3′ DNA 보충 · 앞의 RNA를 제거하며 닉이 이동","say":"노랑 인부의 다른 손은 나무못, 즉 DNA를 판자에 끼우고 있다. 폴 원은 다음 절편의 프라이머를 제거하면서 이웃 절편의 삼 프라임 수산기에서 DNA를 오 프라임에서 삼 프라임 방향으로 합성한다. 제거한 RNA 자리를 DNA로 채우면서 끊긴 결합의 위치가 이동하는 과정이 닉 트랜슬레이션이다. 프라이머 자리를 모두 채워도 마지막 결합 하나는 아직 이어지지 않는다.","box":[[1452,470,125,197],[1054,162,330,64]],"src":["s11p02#6"],"ask":"노랑 작업대 윗줄과 아랫줄은 같은 방향이다. 윗줄에서는 무엇을 붙이고 아랫줄에서는 무엇을 제거하는가? 닉은 어떻게 되는가?","cards":["E1-63","E1-63#2","X-BT-5","I1-44#1","E1-72","I1-44"]},{"sid":"s9","obj":"한 등 모자 옆 노랑 작업대. 망치·붉은 조각 집게·은못 뽑개가 세 줄에 놓여 있다.","fact":"Pol I의 세 활성 = 5′→3′ DNA 합성 · 3′→5′ 교정 · 5′→3′ 프라이머 절제","hook":"노랑 작업대 세 줄 = 다섯→셋 합성, 셋→다섯 교정, 다섯→셋 프라이머 절제","say":"두 인부의 도구를 비교하면서 폴 원의 세 기능을 정리해 보자. 첫째는 오 프라임에서 삼 프라임 방향의 DNA 합성이다. 둘째는 복제 중 잘못 넣은 말단 뉴클레오타이드를 삼 프라임에서 오 프라임 방향으로 제거하는 교정이다. 셋째는 앞쪽 프라이머를 오 프라임에서 삼 프라임 방향으로 제거하는 기능이다. 프라이머 제거와 교정은 둘 다 뉴클레오타이드를 떼지만 대상과 방향이 다르다.","box":[1046,74,350,348],"src":["s11p02#7"],"ask":"노랑 인부 혼자 세 줄을 가진다. 각 도구의 기질과 진행 방향을 말해 보자. 어느 두 활동이 닉 트랜슬레이션을 이루는가?","cards":["S-BT-12","I1-44","S-BT-11"]},{"sid":"s10","obj":"노랑 인부 오른쪽 끝, 몸통이 빨간 긴 라이터가 따로 놓인 봉합 작업대. 확대 그림의 염기는 모두 꽂혔고 골격 결합 하나만 끊겨 있다.","fact":"Pol I이 RNA를 DNA로 교체한 뒤, DNA 라이게이스가 남은 닉의 3′-OH와 5′-인산을 연결","hook":"라이게이스 ↔ 라이터 불꽃 · 염기 손실 없이 한 가닥의 3′-OH와 5′-인산만 봉합","say":"라이터의 첫소리에서 라이게이스를 떠올리자. 오른쪽 전용 작업대의 오각형은 당, 파란 구슬은 인산, 당에 붙은 넓적한 조각은 염기다. 염기는 모두 들어 있지만 골격 결합 하나가 비어 있고, 바로 그 자리에 불꽃이 보인다. 폴 원이 RNA를 제거하고 DNA로 채운 뒤, 라이게이스가 이웃한 삼 프라임 수산기와 오 프라임 인산을 연결해 닉을 봉합한다. 주황 인부의 길 끝에서 집게로 뉴클레오타이드를 제거하는 장면과 구별하자.","box":[[1816,232,220,212],[1880,366,132,254]],"src":["s11p02#8","s11p01#10"],"ask":"라이터 앞에서는 염기 하나가 비었는가, 골격 결합 하나가 비었는가? 닉을 봉합하는 효소와 직접 연결되는 두 말단은 무엇인가?","cards":["E1-74","E1-75","E1-63#3","C1-88","E1-63"]},{"sid":"s11","obj":"등 둘인 파란 수리공의 곁길. 판자 위 장갑과 집게가 비뚤어진 빨간 못을 물고 왼쪽 화살표를 따른다. 파란 작업대에서 이 방향은 세 발에서 다섯 발 쪽이다.","fact":"Pol II = 손상 DNA의 수선 합성 및 손상 후 복제 재개에 참여 · 3′→5′ 교정 가능","hook":"막힌 곁길과 수리 판자 = Pol II 손상 대응 · 다섯→셋 합성, 셋→다섯 교정","say":"파란 인부는 대장균의 DNA 중합효소 투다. 곁길의 바위는 DNA 손상으로 복제가 막힌 상황을 나타낸다. 새 판자를 대는 손은 수선 합성과 복제 재개를 돕는 역할이다. 폴 투는 예를 들어 자외선으로 DNA가 손상된 뒤 복제 재개에 참여할 수 있다. 합성 방향은 오 프라임에서 삼 프라임, 교정 방향은 삼 프라임에서 오 프라임이다. 정상적인 오카자키 절편마다 폴 쓰리·폴 원·폴 투가 차례로 지나간다고 생각하지 말자. 주 복제는 폴 쓰리, 프라이머 교체는 폴 원, 손상 상황의 지원 역할은 폴 투다. 파란 작업대의 망치는 다섯 발에서 세 발로 향하므로 수선 합성을, 집게는 세 발에서 다섯 발로 되짚으므로 교정을 나타낸다. 은못을 뽑는 셋째 줄은 노랑 작업대에만 있다.","box":[[894,696,405,424],[1158,822,304,230],[1656,646,304,198],[1618,840,384,282]],"src":["s11p02#9"],"ask":"등 두 개 인부가 투입되는 상황은? 파란 작업대로 합성과 교정의 두 방향을 각각 읽고, 노랑 인부에게만 있는 활성을 말해 보자.","cards":[]}],"cq":{"E1-71":["DNA 중합효소 III의 기능은?","프라이머의 3' 말단에서 새 DNA를 5'→3'로 합성한다"],"E1-76":["방향성 문제를 푸는 핵심 규칙은?","DNA 중합효소는 3' 말단에만 붙인다(새 가닥 5'→3')"],"E1-70":["프리메이스(primase)의 기능은?","RNA 프라이머를 합성한다"],"E1-64":["선도가닥과 지연가닥의 프라이머 수 차이는?","선도=보통 1개 · 지연=절편마다 여러 개"],"E1-63#2":["오카자키 절편이 하나의 가닥이 되는 마무리 과정은?","DNA로 대체"],"E1-65":["선도가닥과 지연가닥의 중간 산물 차이는?","선도=하나의 긴 새 가닥 · 지연=오카자키 절편"],"E1-78":["교정(proofreading)이란?","복제 중 잘못 들어간 뉴클레오타이드를 DNA 중합효소가 제거·재합성하는 것"],"E1-79#1":["교정(proofreading)과 불일치 수선의 타이밍 차이 — 「교정」? (↔ 불일치 수선)","복제 중 즉시"],"X-BT-4":["3′→5′ 방향으로 작동하는 중합효소 활성은?","교정(외부절단) — 잘못 낀 뉴클레오티드 제거 (← 닉 트랜슬레이션은 5′→3′)"],"I1-44#2":["닉 트랜슬레이션과 교정의 방향 차이 — 「교정」? (↔ 닉 트랜슬레이션)","3′→5′ 외부절단(잘못 낀 뉴클레오티드 제거)"],"E1-77":["DNA 복제 정확도를 높이는 두 축은?","DNA 중합효소의 교정 기능과 여러 수선 체계"],"E1-72":["DNA 중합효소 I의 기능은?","RNA 프라이머를 제거하고 그 자리를 DNA로 대체한다"],"E1-73":["DNA 중합효소 I이 프라이머를 제거하는 데 쓰는 활성은?","5'→3' 핵산말단가수분해효소(exonuclease) 활성"],"E1-63#1":["오카자키 절편이 하나의 가닥이 되는 마무리 과정은?","프라이머 제거"],"E1-66":["복제분기점 효소 7종을 쓰면?","헬리케이스·SSB·토포아이소머레이스·프리메이스·DNA pol III·DNA pol I·ligase"],"I1-44#1":["닉 트랜슬레이션과 교정의 방향 차이 — 「닉 트랜슬레이션」? (↔ 교정)","DNA 중합효소 I의 5′→3′ 외부절단(틈 앞쪽 제거하며 채움)"],"E1-63":["오카자키 절편이 하나의 가닥이 되는 마무리 과정은?","프라이머 제거 → DNA로 대체 → ligase 연결"],"X-BT-5":["5′→3′ 외부절단이 하는 일은?","닉 트랜슬레이션 — 틈 앞쪽을 제거하며 채움 (← 교정과 방향·목적 반대)"],"I1-44":["닉 트랜슬레이션과 교정의 방향 차이는?","닉 트랜슬레이션=DNA 중합효소 I의 5′→3′ 외부절단(틈 앞쪽 제거하며 채움) · 교정=3′→5′ 외부절단(잘못 낀 뉴클레오티드 제거)"],"S-BT-12":["두 외부절단(5′→3′ vs 3′→5′)의 목적 차이는?","5′→3′=틈 앞쪽 제거·채움(닉) / 3′→5′=오류 제거(교정)"],"S-BT-11":["DNA 중합효소 I의 세 활성과 각 방향은?","합성 5′→3′ / 교정 3′→5′ / 닉 트랜슬레이션 5′→3′"],"E1-74":["DNA 연결효소(ligase)의 기능은?","오카자키 절편 사이 당-인산 골격(nick)을 연결한다"],"E1-75":["수선·오카자키 절편 연결에서 nick에 작용하는 효소는?","DNA 연결효소(ligase)"],"E1-63#3":["오카자키 절편이 하나의 가닥이 되는 마무리 과정은?","ligase 연결"],"C1-88":["오카자키 절편들을 연결해주는 효소는?","DNA 리게이스"]},"hubPanel":"s11p02"};

shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
</html>
