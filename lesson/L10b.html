<script>
const L = {"id":"L10b","scene":"s10","part":"b","title":"레일의 세 칸 객차 — 코돈 · 개시와 종결 · tRNA 의 모양 · 사슬의 행선지","sub":"창 셋 달린 객차(코돈 · 창 = 염기 · 빛깔 넷) · 페인트 통 넷 + 체스판 64칸(4³ = 64 · 나무판 세 칸 = 종결) · 맨 앞 객차의 월계관 황제(아우구스투스 = AUG) · 차막이 앞 나무판 든 발레리나 · 비명 · 원시인(우아아 UAA · 우악 UAG · 우가 UGA) · L 자로 앉은 팔순 할아버지와 종이의 클로버(tRNA 3차원 · 2차원 · 약 80 nt) · 손끝의 갈고리 둘 + 사다리 + 구슬(3′ 말단 CCA) · 발끝의 세 이빨 열쇠와 말풍선(번역자) · 다 꿴 사슬을 멘 짐꾼 → 콩 모양 손님채(미토콘드리아행은 번역 뒤) · 이정표의 빛깔 구슬 셋(행선지마다 다른 신호)","img":"img/L10b.webp?v=69919103399a","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"크림빛 들판을 가로지르는 긴 겹줄 레일 — 왼쪽 끝에 겨자색 중산모(둥근 꼭대기에 띠를 두른 모자) · 레일 위에 창이 셋씩 달린 객차 일곱 대 · 셋째 객차는 보라 정거장의 문틀 안에 섰다 (틀)","fact":"코돈 = mRNA 의 염기 셋이 아미노산 하나를 지정하는 단위","hook":"객차 한 대 = 코돈 · 창 셋 = 염기 셋 · 창의 빛깔 넷 = 염기 넷","say":"L10a에서 본 레일로 돌아왔다. 겹줄 레일은 mRNA이고, 왼쪽 끝의 겨자색 중산모는 5′ 캡이다. 이번에는 레일 위에 줄지어 선 객차를 보자. 객차마다 창이 정확히 셋이다. 객차 한 대는 코돈 하나, 창 셋은 염기 셋을 나타낸다. 창의 색은 초록 A, 파랑 U, 빨강 G, 노랑 C의 네 가지다. 가운데 보라 정거장인 리보솜이 객차를 한 대씩 읽을 때마다 구슬 하나, 즉 아미노산 하나가 정해진다. 염기 셋으로 아미노산 하나를 지정하는 단위가 코돈이다. 읽는 방향은 모자에서 오른쪽, 5′에서 3′이다.","cards":["F0-19"],"box":[[16,540,2016,204]]},{"sid":"s2","obj":"앞마당 왼쪽 도색장 — 나무 토막에 올린 객차 한 대(첫 창에 붓질 중 · 나머지 두 창은 아직 칠하지 않아 희다) · 붓 든 칠장이 · 페인트 통 넷(초록 · 파랑 · 빨강 · 노랑) · 이젤의 큰 체스판(예순네 칸 — 칸마다 금빛 구슬, 세 칸만 작은 나무판)","fact":"코돈은 4 × 4 × 4 = 64가지 — 61은 아미노산 · 3은 종결","hook":"페인트 넷 × 창 셋 = 체스판 64칸 · 나무판 세 칸 = 종결","say":"앞마당 왼쪽 도색장에서는 칠장이가 나무 토막에 올린 객차의 창을 칠하고 있다. 발치의 페인트 통은 넷이다. 창 하나에 네 가지 중 하나를 칠할 수 있고 창이 셋이므로, 넷 곱하기 넷 곱하기 넷인 예순네 가지 조합이 나온다. 옆 이젤의 체스판도 예순네 칸이다. 코돈은 모두 64개다. 체스판의 각 칸에는 금빛 구슬이 하나씩 놓여 있지만 세 칸만 작은 나무판이다. 64개 가운데 아미노산을 지정하는 코돈 61개와 종결 코돈 3개를 구별하는 단서다. 아미노산은 스무 가지이므로 하나의 아미노산을 여러 코돈이 지정할 수 있다. 이것이 유전암호의 중복성이다.","cards":["F0-23"],"box":[[40,770,322,340],[364,862,300,244],[676,1004,240,100]]},{"sid":"s3","obj":"맨 앞 객차 지붕 — 월계관을 쓴 흰 토가의 황제가 팔을 뻗어 오른쪽을 가리킨다 · 그 객차의 창은 초록 · 파랑 · 빨강","fact":"개시 코돈 = AUG(메싸이오닌도 지정)","hook":"아우구스투스 황제 = A · U · G · 출발을 명한다 = 개시","say":"맨 앞 객차 지붕에는 월계관을 쓴 로마 황제 아우구스투스가 서 있다. 이름 첫머리의 아·우·구를 A·U·G에 연결하자. 황제가 팔을 뻗어 오른쪽을 가리키며 출발을 명하듯, 개시 코돈 AUG가 번역의 시작을 알린다. 객차 창도 초록·파랑·빨강, 곧 A·U·G 순서다. 번역은 보통 이 객차에서 시작한다. AUG는 시작 신호인 동시에 메싸이오닌을 지정하므로, 새로 만든 사슬의 첫 구슬은 메싸이오닌이다.","cards":["F0-20"],"box":[[166,332,186,230],[134,552,196,152]]},{"sid":"s4","obj":"레일 오른쪽 끝 차막이 앞 세 객차 지붕 — 제 키만 한 나무판을 곁에 세워 붙든 발레리나 · 나무판을 껴안고 비명 지르는 사람 · 나무판을 머리 위로 번쩍 든 원시인 · 세 객차의 첫 창은 모두 파랑","fact":"종결 코돈 셋 = UAA · UAG · UGA — 아미노산을 지정하지 않는다","hook":"우아아(UAA) 발레리나 · 우악(UAG) 비명 · 우가(UGA) 원시인 · 나무판 = 종결","say":"레일 끝 차막이 앞의 마지막 세 객차 지붕에는 각기 나무판을 든 사람이 서 있다. L10a에서 사람 대신 좌석을 차지했던 나무판이 종결의 표시였다. 발끝으로 우아하게 선 발레리나는 ‘우아아’, UAA이다. 나무판을 껴안고 ‘우악’ 하고 비명을 지르는 사람은 UAG, 판을 번쩍 들고 ‘우가 우가’ 외치는 원시인은 UGA이다. 로마자 그대로 읽어 세 종결 코돈을 연결하자. 세 객차의 첫 창은 모두 파란색 U이다. 이 객차는 구슬, 즉 아미노산을 지정하지 않고 번역을 끝낸다. 실제 한 레일 끝에는 세 종류 중 하나만 온다.","cards":["F0-21"],"box":[[1340,286,612,420]]},{"sid":"s5","obj":"보라 정거장 안 흰 수염 대머리 할아버지 — 허리를 세우고 두 다리를 앞으로 곧게 뻗어 낮은 보라 단에 앉았다 · 한 팔은 머리 뒤 위로 번쩍 · 다른 손에 든 흰 종이엔 세 잎 클로버 그림","fact":"tRNA — 펼친 그림(2차원)은 클로버 · 실제(3차원)는 L 자 · 약 80 뉴클레오타이드","hook":"종이 위 클로버 = 2차원 · 앉은 몸 = L 자 · 팔 든 팔순 = 80","say":"정거장에 앉은 흰 수염 할아버지는 tRNA이다. 이 그림 세계에서 좌석에 앉은 사람이 tRNA였다. 허리를 세우고 두 다리를 앞으로 뻗은 몸을 옆에서 보면 L 자, 또는 ㄴ 자다. tRNA의 실제 3차원 구조가 L 자라는 단서다. 반면 손에 든 납작한 종이에는 세 잎 클로버가 그려져 있다. tRNA를 평면에 펼친 2차원 구조는 클로버 잎 모양이다. 종이는 클로버, 실제 몸은 L 자로 구별하자. 팔을 번쩍 든 할아버지는 팔순, 여든 살이다. tRNA가 뉴클레오타이드 약 80개로 이루어진 짧은 RNA라는 뜻도 담겨 있다.","cards":["F0-92","F0-93","F0-94"],"box":[[672,134,324,340]]},{"sid":"s6","obj":"번쩍 든 손에서 가는 실로 줄줄이 늘어진 것 — C 자 쇠갈고리 둘 · 그 아래 A 자 작은 접이 사다리 · 맨 아래 분홍 구슬 하나","fact":"아미노산은 tRNA 의 3′ 말단 CCA 서열에 붙는다","hook":"갈고리 · 갈고리 · 사다리 = C · C · A · 셋이 달린 끝 = 3′","say":"할아버지가 들어 올린 손끝을 보자. 쇠갈고리 두 개 아래에 작은 접이 사다리가 있고, 맨 끝에는 분홍 구슬이 매달려 있다. C 자 갈고리는 C, A 자로 벌어진 사다리는 A이다. 갈고리·갈고리·사다리를 읽으면 C·C·A가 된다. tRNA의 3′ 말단은 언제나 CCA로 끝나고, 아미노산은 바로 그 끝에 붙는다. 세 소품이 달린 끝을 3′ 말단과 연결하자. 구슬을 매달아 주는 것은 L10a의 자판기로 표현한 아미노아실 tRNA 합성효소다.","cards":["F0-95","F0-96"],"box":[[628,140,88,236]]},{"sid":"s7","obj":"할아버지 신발에서 늘어진 끈 끝의 금빛 열쇠(둥근 손잡이 고리 · 자루 · 넓적한 이빨 셋) — 이빨 셋의 끝이 아래 객차의 창 셋(노랑 · 초록 · 초록) 윗부분에 하나씩 겹쳐 있다(셋째 이빨만 빨강) · 입가의 말풍선엔 노랑 · 초록 · 초록 네모 셋 → 분홍 구슬 하나","fact":"tRNA = 번역자 — 코돈(핵산의 말)을 아미노산(단백질의 말)으로 옮긴다","hook":"발끝은 창 셋을 읽고 손끝은 구슬 하나를 든다 = 통역","say":"할아버지 발끝에는 이빨이 셋인 금빛 열쇠가 끈으로 매달려 있다. 세 이빨이 아래 객차의 창 셋에 각각 닿는다. L10a에서도 본 안티코돈이다. 발끝은 코돈을 읽고, 반대편 손끝은 그에 맞는 아미노산 구슬을 들고 있다. 입가의 말풍선에서도 객차 창과 같은 색의 네모 셋이 분홍 구슬 하나로 이어진다. 셋째 창에 닿는 이빨만 빨간 고무로 되어 있는 것은 L10a에서 보았던 요동의 단서다. 코돈의 셋째 자리에서 결합이 느슨할 수 있다는 뜻이다. tRNA는 한쪽 끝으로 핵산의 언어인 코돈을 읽고 다른 끝으로 단백질의 재료인 아미노산을 운반해 두 언어를 연결하므로 번역자라고 부른다.","cards":["F0-97"],"box":[[756,438,250,202],[826,148,194,142]]},{"sid":"s8","obj":"앞마당 오른쪽 — 긴 구슬 사슬을 어깨 뒤로 넘겨 메고 오른쪽으로 걷는 짐꾼(손으로 당겨 쥔 앞쪽, 어깨 앞의 맨 앞 큰 구슬이 파랑) · 그 앞에 앞을 튼 크림색 손님채 — 길고 나지막한 콩 꼴(지붕의 굴뚝 · 왼쪽 벽의 짧은 관 둘 · 안쪽 빨간 주름 커튼) · 왼쪽 멀리 작은 카키 천막 — 지붕에 올라앉은 보라 두 덩이(큰 덩이 위에 작은 덩이)에서 나온 구슬 사슬이 지붕의 검은 구멍으로 들어간다(구멍 속 구슬이 빨강)","fact":"미토콘드리아 · 엽록체행 단백질은 세포질에서 번역이 끝난 뒤 옮겨진다","hook":"다 꿴 사슬을 메고 간다 = 끝난 뒤 · 지붕에 앉아 꿰며 넣는다 = 도중(소포체)","say":"레일 끝에서 풀려난 구슬 사슬은 어디로 갈까? 행선지를 따라가 보자. 앞마당 오른쪽의 짐꾼이 완성된 긴 사슬을 어깨에 메고 콩 모양 손님채로 향한다. 안쪽에 빨간 주름 커튼이 있는 집은 미토콘드리아다. 사슬을 다 꿴 뒤 옮긴다는 점이 중요하다. 미토콘드리아나 엽록체로 갈 단백질은 세포질 자유 리보솜에서 번역을 마친 다음 이동한다. 왼쪽 멀리 있는 카키 천막은 L48d의 막사, 소포체다. 이곳에서는 지붕의 보라 리보솜이 사슬을 꿰는 도중 지붕 구멍으로 밀어 넣는다. 소포체행은 번역 도중, 미토콘드리아·엽록체행은 번역이 끝난 뒤라는 차이를 기억하자.","cards":["F0-144"],"box":[[1326,866,312,242],[1644,892,398,220],[896,770,300,182]]},{"sid":"s9","obj":"갈림길 이정표 — 화살판 셋: 맨 위는 왼쪽 천막 쪽, 아래 둘은 오른쪽 · 화살판마다 빛깔이 다른 구슬 하나(빨강 · 파랑 · 초록) · 오른쪽 위 멀리(레일 끝 밑) 작은 오두막 지붕엔 초록 꼬투리","fact":"신호 펩타이드는 행선지마다 다르다 — 그래야 제 소기관으로 정확히 간다","hook":"화살판마다 다른 빛깔 구슬 = 행선지마다 다른 신호 서열","say":"갈림길의 이정표에는 화살판이 셋 있고, 판마다 서로 다른 색의 구슬이 박혀 있다. 빨간 구슬은 왼쪽 천막인 소포체를 가리킨다. L48d에서 사슬 앞부분의 빨간 구슬이 신호서열이었다. 파란 구슬은 콩 모양 손님채인 미토콘드리아를 가리키며, 짐꾼이 멘 사슬의 맨 앞 구슬도 파란색이다. 초록 구슬은 뒤쪽 오두막 지붕의 초록 꼬투리, 엽록체를 가리킨다. 사슬 앞끝의 구슬 색이 주소인 셈이다. 신호 펩타이드의 서열은 행선지마다 다르며, 이렇게 다양한 주소가 있어야 단백질을 각 소기관으로 정확히 보낼 수 있다.","cards":["F0-146"],"box":[[1150,796,292,312],[1880,734,134,120]]}],"cq":{"F0-19":["3개의 염기가 1개의 아미노산을 지정하는 단위를 무엇이라 하는가?","코돈"],"F0-23":["가능한 코돈의 총 개수와 그 구성은?","총 64개(4³)"],"F0-20":["개시 코돈은?","AUG"],"F0-21":["종결 코돈 3가지는?","UAA · UAG · UGA"],"F0-92":["tRNA의 2차원 모양은?","클로버 모양"],"F0-93":["tRNA의 실제 3차원 모양은?","L자 모양"],"F0-94":["tRNA의 대략적인 길이는?","약 80 뉴클레오타이드"],"F0-95":["아미노산이 붙는 tRNA 말단은?","3' 말단"],"F0-96":["아미노산 부착 서열은?","CCA"],"F0-97":["tRNA가 '번역자'라 불리는 이유는?","핵산의 코돈 언어를 아미노산 언어로 바꾸기 때문"],"F0-144":["미토콘드리아나 엽록체로 가는 단백질은 언제 이동을 시작하는가?","세포질에서 번역이 끝난 후"],"F0-146":["신호 펩타이드가 다양해야 하는 이유는?","여러 다른 세포소기관으로 단백질을 정확히 보내야 하기 때문"]},"hubPanel":null};

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';

$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
</html>
