<script>
const L = {"id":"L52a","scene":"s52","part":"a","title":"언덕 위 세포 관찰소 — 현미경 · 세포분획 · 미토콘드리아와 세포내 공생","sub":"탁자의 접시 넷(원생생물 · 균류 · 동물 · 식물)과 큰 투명 공(돔 천막 = 핵 · 둘레 물 = 세포질 · 문 달린 껍질 = 원형질막) · 곁의 알약 세균(크기) · 속이 하얀 큰 젤리 공(표면적/부피) · 하얀 현미경 탑의 등불(빛)과 검은 기둥의 노란 공 줄기(전자) · 번진 얼룩과 또렷한 체리 둘 · 돋보기(배율 ≠ 분해능) · 금칠한 털북숭이 공(SEM) · 줄로 얇게 썬 한 장(TEM) · 믹서와 회전그네 셋(균질화 · 원심분리 · 핵 → 미토콘드리아 → 마이크로솜) · 흰 방울 들이고 동전 내는 콩 모양 손님채(미토콘드리아 · ATP) · 해 아래 꼬투리의 포도(엽록체) · 관으로 이은 작은 방들 · 춤추는 세포 · 잠든 세포(연결망 · 수) · 크림색 바깥벽 · 꿰뚫은 관 · 빨간 주름 커튼 · 끈 고리 · 작은 보라 오뚝이(이중막 · 포린 · 크리스타 · 기질) · 손님을 숄로 감싸는 주모와 막걸리(세포내 공생 · 마걸리스) · 잘록해지는 방(스스로 분열) · 흰 알 든 빨간 손님 · 꼬투리로 오르는 청록 손님(α-프로테오박테리아 · 남세균)","img":"img/L52a.webp?v=41694b4cd28e","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"왼쪽 앞 탁자 — 접시 넷(아메바 · 갈색 버섯 · 청개구리 · 새싹) · 큰 투명 공(아래 절반을 채운 맑은 물 · 그 위 크림색 돔 천막 · 껍질 아래 작은 문 둘 — 왼쪽 문엔 안으로 굽은 흰 화살과 흰 방울 · 오른쪽 문 밖으로 나가는 검은 화살과 어두운 방울) (틀)","fact":"진핵세포 = 원생생물 · 균류 · 동물 · 식물 · 세포질 = 핵과 원형질막 사이 · 막 = 고르는 장벽","hook":"접시 넷 = 진핵 네 생물군 · 돔 천막 = 핵 · 천막 둘레의 물 = 세포질 · 문 달린 껍질 = 원형질막","say":"언덕 위 세포 관찰소다. 왼쪽 현미경 탑, 가운데 회전그네, 오른쪽의 주름 커튼 손님채를 보자. 앞 탁자에는 아메바·갈색 버섯·청개구리·새싹을 담은 접시 넷이 있다. 각각 원생생물·균류·동물·식물로, 진핵세포로 이루어진 네 생물군이다. 세균과 고세균은 원핵생물이다. 옆의 큰 투명 공은 진핵세포 하나이며, 크림색 돔 천막은 핵, 천막과 얇은 껍질 사이의 맑은 물은 세포질이다. 진핵세포의 세포질은 핵과 원형질막 사이를 가리킨다. 껍질인 원형질막의 왼쪽 문으로 O₂와 양분의 흰 방울이 들어오고, 오른쪽 문으로 CO₂와 노폐물의 어두운 방울이 나간다. 물질의 출입을 선택하는 장벽이다.","cards":["A0-43","A0-44","A0-45"],"box":[[10,940,440,170],[480,860,230,210]]},{"sid":"s2","obj":"가운데 앞 분홍 물감 쟁반 — 반으로 가른 큰 젤리 공은 겉에 분홍 테만 · 속이 하얗고 곁의 작은 공들은 온통 분홍","fact":"세포 크기의 한계 = 표면적/부피 비 · 작을수록 비가 커 물질 교환이 효율적","hook":"속이 하얀 큰 공 = 부피에 비해 겉넓이가 모자람 · 속까지 물든 작은 공 = S/V 가 큼","say":"가운데 앞의 분홍 물감 쟁반에 잠긴 젤리 공을 보자. 반으로 자른 큰 공은 겉만 분홍이고 속은 흰색이지만, 작은 공들은 전체가 분홍이다. 산소와 양분을 뜻하는 물감은 표면을 통해 들어온다. 크기가 커질수록 부피는 세제곱으로 증가하지만 표면적은 제곱으로 증가해 그림처럼 물감이 속까지 닿지 못한다. 세포의 최대 크기를 제한하는 표면적/부피 비(S/V)이다. 작은 세포일수록 S/V가 커 물질 출입과 교환이 효율적이다. L50b의 야크와 벌새에서 본 몸집·대사율 관계와도 같은 원리로 연결된다.","cards":["A0-0","A0-1"],"box":[[825,930,560,175]]},{"sid":"s3","obj":"탁자 앞 끝의 작은 연노랑 알약 세균 — 투명 공 속 빨간 콩만 하다 · 투명 공은 그보다 훨씬 크다","fact":"세균 1~10 μm · 진핵세포 10~100 μm · 미토콘드리아 1~5 μm · 세포막 두께 5~8 nm","hook":"알약 세균 ≈ 공 속 빨간 콩(미토콘드리아) · 투명 공(진핵세포) = 훨씬 큼 · 얇은 껍질 = nm","say":"탁자 앞 끝에 앉은 작은 연노랑 알약 세균과 투명 공 안의 빨간 콩을 비교하자. 세균은 1~10 μm, 미토콘드리아는 1~5 μm로 비슷한 크기다. 진핵세포인 투명 공은 10~100 μm로 약 열 배 크다. 반면 그 공의 얇은 껍질인 세포막 두께는 5~8 nm에 불과하다. 50~100 nm라는 보기는 틀리다. 광학현미경으로는 이 막 두께를 볼 수 없다. 미토콘드리아가 세균과 비슷한 크기라는 사실은 뒤의 손님채 이야기로 이어진다.","cards":["A0-2","A0-3"],"box":[[460,880,240,225]]},{"sid":"s4","obj":"왼쪽 하얀 현미경 탑(아래 등불의 넓은 물결빛 · 둥근 화면엔 크게 번진 빨간 얼룩 하나와 그 앞 큰 돋보기) · 곁 높은 검은 기둥(아래로 노란 작은 공 줄기) · 그 옆 받침대 화면엔 또렷한 체리 둘","fact":"도구 = 현미경 · 생화학 · 전자현미경은 파장이 짧아 분해능이 훨씬 높다 · 배율 ≠ 분해능","hook":"등불 = 빛(긴 파장) · 노란 공 줄기 = 전자(짧은 파장) · 번진 얼룩 하나 = 못 가름 · 체리 둘 = 가름 · 돋보기 = 배율만","say":"세포 연구의 두 도구는 왼쪽의 현미경과 가운데 회전그네로 나타낸 생화학 도구다. 하얀 탑은 광학현미경 LM으로, 아래 등불에서 넓은 물결처럼 나오는 긴 파장 빛을 쓴다. 검은 기둥은 전자현미경 EM으로, 노란 공 같은 전자의 빔을 쏜다. 파장이 훨씬 짧아 분해능이 높다. 같은 체리 둘이 빛의 화면에는 큰 빨간 얼룩 하나로, 전자의 화면에는 두 개로 선명하게 보인다. 가까운 두 점을 따로 구분하는 능력이 분해능이다. 돋보기로 얼룩만 크게 만든다고 두 체리가 구분되지는 않는다. 배율은 상을 키우는 정도이므로 분해능과 다르다.","cards":["A0-19","A0-194","A0-195"],"box":[[100,30,380,680],[495,165,180,560]]},{"sid":"s5","obj":"현미경 탑 발치 — 일꾼이 받침대 위 털북숭이 공에 금빛 칠을 하고 지그재그로 꺾인 빛줄기가 그 공에 닿는다 · 검은 기둥 밑에선 두 일꾼이 팽팽한 줄로 분홍 세포 덩이를 얇은 원반으로 썰고 · 노란 공 줄기가 빛나는 판 위 얇은 한 장을 꿰뚫는다","fact":"SEM = 겉을 금속 도금 · 튀어나온 전자로 3차원 표면 / TEM = 얇은 절편을 투과 · 내부 미세구조","hook":"금칠한 털북숭이 공 + 지그재그 빛줄기 = 주사(SEM · 겉) · 얇은 한 장을 꿰뚫는 노란 공 = 투과(TEM · 속)","say":"전자현미경 두 종류를 비교해 보자. 탑 아래 일꾼은 털북숭이 공 표면에 금빛 칠을 한다. 시료를 얇은 금속층으로 덮고 전자빔으로 표면을 지그재그 주사한 뒤, 표면에서 나온 전자를 모아 3차원적인 표면 형태를 관찰하는 주사전자현미경 SEM이다. 검은 기둥 아래에서는 두 일꾼이 팽팽한 줄로 분홍 세포 덩이를 얇은 원반으로 자른다. 빛나는 판 위의 얇은 절편을 노란 전자빔이 통과하며 내부 미세구조를 드러낸다. 투과전자현미경 TEM이다. 표면은 SEM, 내부는 TEM으로 연결하자.","cards":["A0-196","A0-197"],"box":[[110,670,200,200],[405,690,270,155]]},{"sid":"s6","obj":"가운데 큰 믹서 — 분홍 즙 속에 작은 분홍 세포들 · 그 앞 회전그네의 유리관들이 돌며 바깥으로 날린다","fact":"세포분획 = 균질화(파쇄) 뒤 원심분리 · 소기관을 크기 · 밀도로 나눔 — 크고 무거울수록 먼저","hook":"믹서 = 균질화 · 도는 그네의 유리관 = 원심분리 · 관 바닥에 먼저 가라앉음 = 크고 무거움","say":"가운데 큰 믹서가 분홍 세포를 갈아 즙으로 만든다. 세포를 깨뜨리는 균질화다. 이 즙을 회전그네의 유리관에 넣고 돌리는 과정은 원심분리다. 그네가 돌면서 관이 바깥으로 향하고 무거운 성분이 바닥에 모인다. 소기관의 크기와 밀도 차이를 이용해 분리하는 세포분획법이다. 크고 무거운 성분은 느리게 돌려도 먼저 침전한다. 이렇게 분리한 소기관을 생화학적으로 조사해 각각의 기능을 알아낼 수 있다.","cards":["A0-189","A0-193"],"box":[[730,245,290,610]]},{"sid":"s7","obj":"회전그네 셋 — 느린 첫째의 관 바닥엔 작은 크림색 천막 · 더 빠른 둘째엔 빨간 콩과 초록 꼬투리 · 흐릿하게 도는 셋째엔 카키 천 조각과 보라 덩이 · 일꾼이 큰 관에 윗물을 따라 담아 들고 간다","fact":"저속(약 1,000 g) 핵 → 중속 미토콘드리아 · 엽록체 → 고속(약 100,000 g) 마이크로솜","hook":"크림색 천막 = 핵 · 빨간 콩 · 초록 꼬투리 = 미토콘드리아 · 엽록체 · 카키 천 조각 + 보라 덩이 = 소포체 조각 · 리보솜","say":"회전그네 셋이 차례로 빨라진다. 첫째는 약 800~1,000 g로 천천히 돌며, 가장 크고 무거운 핵인 크림색 천막이 먼저 바닥에 모인다. 위에 남은 액만 둘째로 옮겨 더 빠르게 돌리면 빨간 콩과 초록 꼬투리, 미토콘드리아와 엽록체가 침전한다. 일꾼이 다시 윗물만 큰 관에 담아 셋째로 옮긴다. 셋째는 약 100,000 g로 빠르게 돌아 흐릿하게 보이며, L48d의 소포체 조각인 카키 천과 리보솜인 보라 덩이, 마이크로솜이 가장 늦게 가라앉는다. 핵·미토콘드리아·마이크로솜의 순서로 기억하자.","cards":["A0-190","A0-191","A0-192"],"box":[[730,540,690,390]]},{"sid":"s8","obj":"오른쪽 콩 모양 손님채 — 지붕 통풍구로 흰 방울이 빨려 들고 옆 홈통에서 금 동전이 쏟아진다 · 오른쪽 위 해 아래 오두막 지붕의 초록 꼬투리에서 포도가 굴러 나온다","fact":"미토콘드리아 = 세포호흡으로 ATP 대부분 · 미토콘드리아 · 엽록체 = 에너지의 꼴을 바꾼다","hook":"흰 방울 들이고 동전 내는 손님채 = 미토콘드리아(O₂ · ATP) · 햇빛 받아 포도 내는 꼬투리 = 엽록체(빛 → 당)","say":"오른쪽 크림색 콩 모양 손님채는 미토콘드리아다. 지붕 통풍구로 흰 O₂ 방울이 들어가고 옆 홈통에서는 금 ATP 동전이 나온다. 산소를 이용해 양분을 산화하여 세포가 사용하는 ATP의 대부분을 만드는 세포호흡이다. 오른쪽 위 햇빛 아래의 오두막 지붕에는 L45a의 초록 꼬투리인 엽록체가 있고, 햇빛을 받아 포도인 당을 굴려 낸다. 엽록체는 빛에너지를 화학에너지로, 미토콘드리아는 양분의 화학에너지를 ATP로 전환한다. 둘 다 에너지의 형태를 바꾸는 소기관이다.","cards":["A0-94","A0-23"],"box":[[1640,270,140,200],[1870,520,170,270],[1780,130,250,260]]},{"sid":"s9","obj":"손님채에서 뻗은 빨간 관이 언덕 위 작은 콩 방들을 하나로 잇는다 · 그 아래 땀 흘리며 춤추는 젤리 세포엔 빨간 콩이 빽빽 · 누워 자는 젤리 세포엔 큰 빨간 콩 하나","fact":"거의 모든 진핵세포에 · 세포당 1개 ~ 수천 개 · 활동 · 수축 세포일수록 많다 · 관 모양 연결망","hook":"관으로 이은 방 = 연결망 · 춤추는 세포의 콩 가득 = 활동 많은 세포 · 잠든 세포의 큰 콩 하나 = 하나뿐인 세포","say":"손님채에서 나온 빨간 관이 언덕의 작은 콩 모양 방들을 잇는다. 미토콘드리아가 따로 있는 개별 알갱이가 아니라 관 모양의 연결망을 이룬다는 모습이다. 아래의 땀 흘리며 춤추는 젤리 세포에는 빨간 콩이 많지만, 누워 자는 세포에는 큰 콩 하나만 있다. 큰 미토콘드리아 하나를 가진 세포도 있으나 대부분은 수백 ~ 수천 개를 가지며, 수는 대사 요구에 따라 달라진다. 운동하거나 수축하는 세포일수록 많다. 탁자의 식물·동물·균류·원생생물 접시 모두와 연결되는, 거의 모든 진핵세포의 소기관이다.","cards":["A0-96","A0-97","A0-101"],"box":[[1105,225,540,270],[1440,735,290,130]]},{"sid":"s10","obj":"앞을 튼 손님채 — 바깥벽은 매끈한 크림색 겉벽 · 벽을 꿰뚫은 짧은 관 · 안쪽 둘째 벽은 깊게 주름진 빨간 커튼 · 안방 바닥엔 일꾼들 · 금빛 끈 고리 · 작은 보라 오뚝이들(큰 덩이 위에 작은 덩이)","fact":"이중막 · 매끈한 외막(포린 통로) · 주름진 내막 = 크리스타 · 기질 = 효소 · DNA · 리보솜","hook":"크림색 바깥벽 = 외막 · 벽 꿰뚫은 관 = 포린 · 빨간 주름 커튼 = 내막(크리스타) · 안방 = 기질","say":"앞을 연 손님채의 벽은 두 겹이다. 매끈한 크림색 외막을 짧은 관들이 관통하는데, 작은 분자가 드나드는 수용성 통로인 포린이다. 안쪽 벽은 깊게 주름진 빨간 커튼으로, 내막이 접힌 크리스타 또는 크리스테다. 주름은 내막 표면적을 늘리며 이 덱에서 미토콘드리아를 알아보는 표지다. 두 막 사이가 막간 공간이고 커튼 안의 방은 기질이다. 효소 일꾼, 금빛 고리인 미토콘드리아 DNA, 큰 덩이와 작은 덩이로 된 보라 리보솜 오뚝이는 모두 기질에 있다. L48c의 보라 짝과 같은 리보솜이며, 막간 공간에 있는 것이 아니다.","cards":["A0-98","A0-35","A0-100","A0-117"],"box":[[1450,405,545,360]]},{"sid":"s11","obj":"오른쪽 앞 — 크림색 한복의 주모가 막 들어온 작은 빨간 알약 손님을 크림색 숄로 감싸 들인다 · 흰 사발에 뽀얀 막걸리를 담아 건넨다 · 곁 큰 질항아리에도 뽀얀 막걸리","fact":"세포내 공생설 = 초기 진핵세포가 원핵세포를 삼켜 공생체로 · 주창자 = 린 마걸리스","hook":"주모 = 숙주(초기 진핵세포) · 숄로 감싸 들인 손님 = 세포내 공생체 · 막걸리 = 마걸리스","say":"이 손님채는 어디에서 왔을까? 오른쪽 앞 장면에서 기원을 살펴보자. 크림색 한복의 주모는 초기 진핵세포인 숙주다. 산소를 사용하는 작은 빨간 알약 손님을 크림색 숄로 감싸 안지만 소화하지 않고 함께 산다. 손님은 ATP 동전으로 방값을 내고, 주모는 살 곳과 양분을 준다. 초기 진핵세포가 삼킨 원핵세포가 공생체가 되어 미토콘드리아와 엽록체로 이어졌다는 세포내 공생설이다. 주모가 흰 사발에 주는 뽀얀 막걸리는 이 설을 제시한 린 마걸리스의 이름 단서다.","cards":["A0-110","A0-112"],"box":[[1600,810,420,290]]},{"sid":"s12","obj":"손님의 빨간 외투 위에 한 겹 더 두른 크림색 숄 · 손님채 바닥의 끝없는 금빛 끈 고리와 작은 보라 오뚝이 · 언덕의 작은 방 몇은 가운데가 잘록한 땅콩꼴(둘로 나뉘는 중)","fact":"공생설 증거 = 이중막 · 자체 리보솜(70S) · 자체 DNA(히스톤 없는 환형) · 스스로 분열","hook":"외투 + 숄 = 이중막(안 = 세균 막 · 밖 = 숙주 막) · 통 없는 끈 고리 = 환형 DNA · 작은 보라 오뚝이 = 70S · 잘록해지는 방 = 스스로 분열","say":"공생의 증거 네 가지를 소품에서 찾자. 첫째, 손님은 원래 세균 막인 빨간 외투 위에 숙주의 숄을 둘러 이중막을 가진다. 손님채의 빨간 안쪽 커튼과 크림색 외벽도 그 색을 따른다. L48d·L48e의 한 겹 천막인 내막계와 구별하자. 둘째, 바닥의 금빛 고리는 히스톤 통도 끝도 없는 환형 자체 DNA이다. L37b 곁탁자의 세균 DNA와 같다. 셋째, 작은 보라 오뚝이는 세균과 같은 70S 자체 리보솜이며, 진핵세포질의 80S와 구별된다. 넷째, 언덕의 작은 방들이 가운데가 잘록한 땅콩 모양으로 나뉜다. 스스로 자라고 분열한다는 증거다.","cards":["A0-111","A0-115","A0-116"],"box":[[1600,880,125,215],[1600,650,240,95],[1295,235,320,150]]},{"sid":"s13","obj":"빨간 손님은 맨 흰 알을 들고 벌린 입으로 흰 방울을 들이마신다(입으로 드는 작은 화살) · 오른쪽 위 아주 작은 청록 손님이 사다리 끝 지붕 위 초록 꼬투리 곁에 매달렸다","fact":"미토콘드리아 ← 호기성 세균(α-프로테오박테리아) · 엽록체 ← 남세균(시아노박테리아)","hook":"흰 방울 마시는 빨간 손님 = 호기성 · 맨 흰 알 = α · 청록(남빛) 손님 → 꼬투리 = 남세균 → 엽록체","say":"두 공생 손님의 차이도 보자. 빨간 손님은 흰 O₂ 방울을 들이마시는 호기성 세균이다. 손의 흰 알은 α를 나타내므로 α-프로테오박테리아이며, 미토콘드리아의 기원이다. 오른쪽 위의 작은 청록색, 곧 남빛 손님은 사다리를 올라 햇빛 받는 지붕의 초록 꼬투리로 간다. 광합성하는 남세균인 시아노박테리아가 엽록체가 된 모습이다. 미토콘드리아가 먼저 있었고 이후 남세균을 받아들였으므로 식물세포에는 두 소기관이 함께 있다.","cards":["A0-113","A0-114"],"box":[[1595,870,130,225],[1760,135,240,220]]}],"cq":{"A0-43":["진핵세포로 구성되는 생물군 4가지?","원생생물, 균류, 동물, 식물"],"A0-44":["진핵세포에서 '세포질(cytoplasm)'의 범위?","핵과 원형질막 사이의 영역"],"A0-45":["원형질막(plasma membrane)의 역할 1줄?","선택적 장벽으로서 물질의 출입을 조절(산소·양분 공급/노폐물 제거)"],"A0-0":["세포의 최대 크기를 제한하는 요인은?","표면적/부피 비(S/V)"],"A0-1":["세포가 작을수록 유리한 이유는?","표면적/부피 비가 커서 물질 출입·교환 효율이 높다"],"A0-2":["세포 크기 스케일(세균/진핵세포/미토콘드리아)은?","세균 1~10μm · 진핵세포 10~100μm · 미토콘드리아 1~5μm"],"A0-3":["세포막(원형질막)의 두께는 약?","5~8nm"],"A0-19":["세포 연구에 사용하는 도구 2가지?","현미경 · 생화학적 도구"],"A0-194":["광학현미경(LM)과 전자현미경(EM)의 결정적 차이는?","전자현미경이 분해능이 훨씬 높음(파장 짧은 전자빔 사용)"],"A0-195":["배율(magnification)과 분해능(resolution)의 차이는?","배율=상을 확대하는 정도 · 분해능=가까운 두 점을 구별하는 능력"],"A0-196":["표면을 금속으로 도금하고 방출 전자로 3차원 표면 영상을 얻는 현미경은?","주사전자현미경(SEM)"],"A0-197":["얇은 절편을 투과한 전자로 세포 내부 초미세구조를 보는 현미경은?","투과전자현미경(TEM)"],"A0-189":["세포분획법(cell fractionation)의 목적은?","세포를 균질화(파쇄)한 뒤 원심분리로 소기관을 크기·밀도별로 분리하는 기법"],"A0-193":["소기관의 침강 정도를 결정하는 두 요인은?","크기와 밀도 (무겁고 클수록 낮은 속도에서 먼저 침전)"],"A0-190":["차등(분별)원심분리에서 소기관이 침전되는 순서(저속→고속)는?","핵 → 미토콘드리아·엽록체 → 소포체·리보솜(마이크로솜)"],"A0-191":["간세포 균질액을 저속(약 800~1000×g)으로 돌리면 가장 먼저 침전되는 소기관은?","핵 (가장 크고 무거움)"],"A0-192":["가장 높은 원심력(약 100,000×g)에서 침전되는 분획은?","소포체 조각·리보솜(마이크로솜)"],"A0-94":["미토콘드리아의 기능?","세포호흡을 통해 대부분의 ATP 생산"],"A0-23":["미토콘드리아·엽록체의 공통 기능?","에너지를 한 형태에서 다른 형태로 변환"],"A0-96":["미토콘드리아 분포 특징?","거의 모든 진핵세포(식물·동물·균류·원생생물)에 존재 · 세포당 1개~수천개"],"A0-97":["미토콘드리아 수와 어떤 것의 관계?","물질대사(활동/수축 세포일수록 더 많음)"],"A0-101":["세포 내 미토콘드리아의 형태(최근 관찰)?","따로 노는 점이 아니라 튜브형 연결망(network) 형태"],"A0-98":["미토콘드리아 막 구조와 내막 특징?","이중막 · 내막은 크리스테(cristae)로 주름짐"],"A0-35":["미토콘드리아의 막 구조 분류?","이중막"],"A0-100":["미토콘드리아 기질에 있는 것 3가지?","효소 · 미토콘드리아 DNA · 리보솜"],"A0-117":["미토콘드리아 외막에 수용성 통로를 형성하는 단백질은?","포린(porin)"],"A0-110":["미토콘드리아·엽록체의 진화적 기원?","세포내 공생설: 초기 진핵세포가 원핵세포를 삼켜 공생체로 됨"],"A0-112":["세포내공생설을 주장한 학자는?","린 마걸리스(Lynn Margulis)"],"A0-111":["세포내 공생설의 증거 4가지(노트 기준)?","이중막 · 자체 리보솜 · 내막에 붙은 자체 DNA · 세포내 독립적 성장·복제"],"A0-115":["미토콘드리아·엽록체의 리보솜 크기는?","70S(원핵형)"],"A0-116":["미토콘드리아·엽록체 DNA의 특징은?","히스톤 없는 환형(원핵형)"],"A0-113":["미토콘드리아의 진화적 기원(세균 종류)은?","호기성 세균(α-프로테오박테리아)"],"A0-114":["엽록체의 진화적 기원(세균 종류)은?","시아노박테리아(남세균)"]},"hubPanel":null};
const $ = id => document.getElementById(id);
$('title').textContent = L.title; document.title = L.title;
// 요약 줄(sub)에는 물건 = 답이 다 적혀 있다 — 복습 · 시험에서는 접어 두고, 누르면 편다(GPT 추가 감사 2026-11-11 §7)
let subOpen = false;
function subShow() { const hide = (mode === 'review' || mode === 'quiz') && !subOpen && !!L.sub; $('sub').textContent = hide ? '요약 줄은 접어 두었다(답이 적혀 있다) — 누르면 편다' : (L.sub || ''); $('sub').classList.toggle('hid', hide); }
$('sub').onclick = () => { if (mode === 'review' || mode === 'quiz') { subOpen = !subOpen; subShow(); } };
$('img').src = L.img; $('img').alt = L.title;
if (L.home) $('home').href = L.home;  // 한 파일(standalone)은 저장소 밖에서 열리므로 배포 주소로
if (L.hub) $('hub').href = L.hub; else if (L.hubPanel) $('hub').href = '../sketchy.html#' + L.hubPanel;
const ov = $('ov'); ov.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
let tourEnded = false;
let mode = 'tour', i = -1, playing = false, voice = true, rate = 1.0, quizOrder = [], quizPos = 0, quizRevealed = false, shuffle = false, sess = null;
const stops = L.stops;
subShow();
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID
const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact), st.sid);
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate,
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
