<script>
const L = {"id":"L46g","scene":"s46","part":"g","title":"폐에서 뜰까지 S자 철봉 — 헤모글로빈 · 산소 해리곡선 · 보어 효과 · CO₂ 운반","sub":"유리 돔 지붕 집(폐)에서 뜰로 내려오는 S자 철봉(산소 해리곡선 — 가로 = 공기의 흰 방울 = PO₂ · 높이 = 주머니가 찬 정도 = 포화도) · 쇠장갑으로 매달린 넷(Hb 4 단위체 · 알 둘 · 베 둘 = α₂β₂ · 철) · 배 주머니의 흰 공(O₂ 넷) · 작은 사람들로 꽉 찬 붉은 원반 곤돌라(적혈구 하나 = Hb 2.5억 · O₂ 10억) · 위는 넷 다 · 가운데는 셋(휴식 조직) · 아래는 하나(운동 근육 — 보어) · 오른쪽으로 미는 넷(레몬 · 가스통 · 숯 · 가루 자루 = 친화도 ↓ · 오른쪽 이동) · 혼자 왼쪽으로 미는 아기(알 · 감 = 2α2γ · 태아 Hb) · 흰 공을 끌어안은 붉은 물개(미오글로빈) · 배기가스의 복면 강도(일산화탄소) · 탈수기(탄산탈수효소) · 회청 호스 창의 검은 방울 하나 · 등에 진 검은 방울 · 분필 더미(CO₂ 운반 7 · 23 · 70 · HCO₃⁻ 완충)","img":"img/L46g.webp?v=8e07ba81d657","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"유리 돔을 인 집 지붕에서 뜰로 내려오는 S자 철봉 — 돔 곁 하늘엔 흰 방울이 많고 왼쪽 아래로 갈수록 드물다 · 철봉이 높을수록 매달린 이들의 주머니가 꽉 찼다 (틀)","fact":"산소 해리곡선 — 가로축 = 산소 분압(PO₂) · 세로축 = 헤모글로빈의 산소 포화도","hook":"가로 = 공기 속 흰 방울의 짙기(PO₂) · 높이 = 주머니가 찬 정도(포화도)","say":"폐의 다락, 유리 돔을 인 집 지붕에서 S자 철봉이 뜰로 내려온다. 이 철봉이 산소 해리곡선이다. 가로로 보자. 돔 곁 하늘에는 흰 방울이 많고, 왼쪽 아래 뜰로 갈수록 드물다. 흰 방울은 산소, 가로축은 산소 분압이다. 세로로 보자. 철봉이 높은 곳일수록 매달린 이들의 배 주머니가 꽉 찼다. 세로축은 헤모글로빈의 산소 포화도다. 철봉을 따라 내려오며 헤모글로빈이 산소를 어디서 쥐고 어디서 놓는지 본다.","box":null,"cards":["H0-253","H0-254"]},{"sid":"s2","obj":"지붕 곁 꼭대기에 매달린 넷 — 넷 다 쇠장갑으로 쇠 철봉을 쥐었다 · 양 끝 둘은 큰 흰 알을 · 가운데 둘은 흰 베 두루마리를 안았다 · 넷의 배 주머니마다 흰 공 하나(맨 앞 하나는 알에 가렸다)","fact":"헤모글로빈 = 단위체 4개(α 2 + β 2) · 단위체마다 헴의 철(Fe) 하나 → O₂ 4개","hook":"넷이 한 팀 = 4 단위체 · 알 둘 · 베 둘 = α₂β₂ · 쇠장갑 = 헴의 철 · 주머니 공 넷 = O₂ 넷","say":"지붕 곁 철봉 꼭대기에 넷이 한 팀으로 매달렸다. 헤모글로빈 한 분자는 단위체 넷이다. 양 끝 둘은 큰 흰 알을 안았고, 가운데 둘은 흰 베 두루마리를 안았다. 알은 알파, 베는 베타. 알파 사슬 둘과 베타 사슬 둘, α₂β₂ 다. 넷 다 쇠장갑을 끼고 쇠 철봉을 쥐었다. 단위체마다 헴이 있고 그 한가운데 철 이온 하나, 적혈구가 붉은 까닭이다. 산소는 그 철에 붙는다. 배 주머니마다 흰 공 하나, 헤모글로빈 하나가 산소 넷을 나른다.","box":[[1340,150,380,260]],"cards":["H0-248","H0-249","H0-250","H0-162"]},{"sid":"s3","obj":"꼭대기 곁에 매달린 붉은 원반 곤돌라 — 가운데가 옴폭한 둥근 붉은 원반 · 동그란 창 안에 흰 공을 든 작은 사람들","fact":"적혈구 하나에 Hb 약 2억 5천만 개 × O₂ 4 = 약 10억 개의 O₂ · Hb 에는 철","hook":"붉은 원반 = 적혈구 · 빽빽한 작은 팀 = 2.5억 Hb · 흰 공 넷씩 = 10억 O₂","say":"꼭대기 곁에 붉은 원반 모양 곤돌라가 매달렸다. 가운데가 옴폭한 붉은 원반, 부엌 식탁의 그 적혈구다. 동그란 창 안에 흰 공을 든 작은 사람들이 가득 탔다. 적혈구 하나에 헤모글로빈이 약 2억 5천만 개 들어 있다. 하나가 산소 넷을 나르니 적혈구 하나가 나르는 산소는 약 10억 개다. 2억 5천만 곱하기 넷, 10억. 헤모글로빈마다 철이 들었으니 적혈구에는 철이 꼭 있어야 한다.","box":[[1560,400,370,200]],"cards":["H0-161","H0-163","H0-169"]},{"sid":"s4","obj":"철봉의 꼴 — 왼쪽 아래는 완만하다가 · 가운데서 가파르게 치솟고 · 지붕 곁에서 다시 평평하다(눕힌 S)","fact":"S자 곡선 = 4차 구조의 협동적 결합 — 가운데서 분압이 조금 변해도 포화도가 크게 변한다","hook":"눕힌 S = 협동 결합 · 가파른 가운데 = 조금만 달라져도 크게 쥐고 놓는다","say":"철봉의 꼴을 보자. 왼쪽 아래는 완만하다가 가운데서 가파르게 치솟고, 지붕 곁에서 다시 평평하다. 눕힌 S, 시그모이드 곡선이다. 넷이 한 팀인 4차 구조라서 그렇다. 산소 하나가 붙으면 나머지 단위체의 모양이 바뀌어 다음 산소가 더 쉽게 붙는다. 협동적 결합이다. 그래서 가파른 가운데 구간에서는 산소 분압이 조금만 바뀌어도 포화도가 크게 바뀐다. 조직에서 산소를 아낌없이 내놓을 수 있는 까닭이다.","box":[[0,150,1850,720]],"cards":["H0-251","H0-252"]},{"sid":"s5","obj":"꼭대기 넷은 주머니가 다 찼고 · 가운데 가파른 곳에 매달린 넷은 셋만 찼다 — 맨 위 초록 셔츠의 주머니는 비었고 흰 공이 아래 의자에 누운 사람의 손으로 떨어진다","fact":"폐는 PO₂ 가 높아 Hb 가 거의 다 산소화 · 휴식 조직은 PO₂ 가 낮아 일부만 내놓는다","hook":"꼭대기 넷 다 = 폐 · 가운데 하나 내줌 = 쉬는 조직","say":"꼭대기 넷은 주머니가 다 찼다. 폐에서는 산소 분압이 높아 헤모글로빈이 거의 다 산소와 결합한다. 철봉을 따라 내려와 가파른 가운데에 매달린 넷은 셋만 찼다. 맨 위 초록 셔츠의 주머니가 비었고, 흰 공 하나가 아래 의자에 누워 쉬는 사람의 손으로 떨어진다. 쉬는 조직은 산소 분압이 폐보다 낮아 헤모글로빈이 산소를 일부만 내놓는다. 넷 중 하나쯤, 나머지 셋은 쥔 채 돌아간다.","box":[[930,300,400,460]],"cards":["H0-255","H0-256"]},{"sid":"s6","obj":"왼쪽 아래 낮은 철봉의 왼쪽 끝, 노랑 · 주황 셔츠 넷 — 셋의 주머니가 뒤집혀 비었고 · 흰 공 셋이 아래 역도 선수의 팔로 떨어진다 · 맨 오른쪽 하나만 공을 쥐었다","fact":"보어 효과 — pH ↓ · CO₂ ↑ 면 Hb 산소 친화도 ↓ → 활발한 조직에 산소를 더 많이","hook":"땀 흘리는 역도 선수 = 운동 조직 · 셋이나 쏟아냄 = 보어","say":"왼쪽 아래 낮은 철봉의 넷은 셋이나 주머니가 뒤집혀 흰 공을 쏟는다. 공은 땀 흘리는 역도 선수의 불룩한 팔로 떨어진다. 운동하는 근육은 산소 분압이 더 낮고, 이산화탄소와 수소 이온과 온도가 높다. 산성이 되고 이산화탄소가 늘면 헤모글로빈의 산소 친화도가 떨어진다. 보어 효과다. 그래서 대사가 활발해 산소가 가장 필요한 조직에 산소가 가장 많이 간다.","box":[[40,760,700,380]],"cards":["H0-257","H0-258","H0-259"]},{"sid":"s7","obj":"가파른 철봉 왼쪽의 넷이 앞사람 등을 밀며 줄지어 철봉 쪽(오른쪽)으로 밀어붙인다 — 즙이 튀는 레몬 · 검은 연기 뿜는 가스통 · 집게에 든 불타는 숯 · 흰 가루 자루 · 철봉 곁의 밀리는 선","fact":"PO₂ ↓ · PCO₂ ↑ · H⁺ ↑ · pH ↓ · 온도 ↑ · BPG ↑ → 친화도 ↓ · 오른쪽 이동","hook":"레몬 = H⁺ · pH ↓ · 가스통 = CO₂ · 숯 = 온도 · 가루 자루 = BPG · 오른쪽으로 밂 = 산소를 더 쉽게 놓음","say":"가파른 철봉 왼쪽에서 넷이 앞사람 등을 밀며 줄지어 철봉 쪽, 오른쪽으로 밀어붙인다. 즙이 튀는 레몬은 수소 이온 증가, pH 감소. 검은 연기를 뿜는 가스통은 이산화탄소 증가. 집게에 든 불타는 숯은 온도 상승. 흰 가루 자루는 2,3-BPG 증가. 여기에 산소 분압 감소까지 여섯이 헤모글로빈의 산소 친화도를 떨어뜨린다. 곡선이 오른쪽으로 밀리면, 같은 산소 분압에서 산소를 더 쉽게 놓는다. 운동하는 근육이 바로 이 넷을 다 갖췄다.","box":[[180,380,800,340]],"cards":["H0-260","H0-261","H0-262"]},{"sid":"s8","obj":"철봉 오른쪽에서 기저귀 찬 아기가 철봉을 받친 가는 버팀대 기둥을 두 손으로 붙잡고 혼자 왼쪽으로 버틴다 — 어깨 가방엔 흰 알 하나와 주황 감 하나 · 흰 베 두루마리는 뒤에 두고 왔다","fact":"왼쪽 이동 = 같은 PO₂ 에서 더 꽉 · 태아 Hb 2α2γ — 모체 2α2β 보다 친화도 ↑","hook":"아기 = 태아 · 알 + 감 = α + γ · 두고 온 베 = β 없음 · 왼쪽으로 버팀 = 더 꽉","say":"철봉 오른쪽에서는 기저귀를 찬 아기가 철봉을 받친 가는 버팀대 기둥을 두 손으로 붙잡고 혼자 왼쪽으로 버틴다. 곡선이 왼쪽으로 가면 같은 산소 분압에서 산소를 더 꽉 쥔다. 아기는 태아다. 어깨 가방에 흰 알 하나와 주황 감 하나, 알은 알파, 감은 감마다. 흰 베 두루마리는 뒤에 두고 왔다. 태아 헤모글로빈은 알파 둘, 감마 둘이다. 엄마의 알파 둘 베타 둘보다 산소를 더 꽉 쥐니, 태반에서 엄마 피의 산소를 태아 쪽으로 끌어온다.","box":[[1330,530,300,230]],"cards":["H0-263","H0-293"]},{"sid":"s9","obj":"연못의 짙은 붉은 물개 — 흰 공 하나를 가슴에 꼭 끌어안고 욕심껏 웃는다","fact":"미오글로빈 = 단일 폴리펩타이드(3차 구조) · 근육에 산소 저장 · 잠수 포유류 근육이 붉다","hook":"My O(내 산소) = 미오글로빈 · 혼자 꼭 끌어안음 = 저장 · 붉은 물개 = 잠수 포유류","say":"뜰 연못에 짙은 붉은 물개가 흰 공 하나를 가슴에 꼭 끌어안고 욕심껏 웃는다. 내 산소, 마이 오, 미오글로빈이다. 미오글로빈은 넷이 한 팀이 아니라 혼자, 사슬 하나뿐인 단일 폴리펩타이드로 3차 구조까지다. 혈액에서 산소를 나르는 헤모글로빈과 달리 미오글로빈은 근육 안에서 산소를 저장한다. 오래 숨을 참고 잠수하는 물개나 고래 같은 포유류는 근육에 미오글로빈이 아주 많아 근육이 짙은 붉은색이다.","box":[[1380,870,230,180]],"cards":["H0-264","H0-265","H0-266","H0-291"]},{"sid":"s10","obj":"배기가스를 뿜는 낡은 차에 복면 강도들이 탔다(지붕 위 · 운전석) · 곁 철봉에 매달린 얼굴이 질린 넷 가운데 셋의 주머니에 복면 강도가 들어앉아 꼭 붙들었고 · 흰 공이 밀려 떨어진다","fact":"일산화탄소(CO) — Hb 에 O₂ 보다 수백 배 강하게 결합 → 산소 운반이 크게 준다","hook":"배기가스의 복면 강도 = CO · 주머니를 차지하고 안 놓음 · 밀려난 흰 공","say":"배기가스를 뿜는 낡은 차에 복면 강도들이 탔다. 일산화탄소, 자동차 배기가스의 그 독가스다. 색도 냄새도 없이 몰래 들어온다. 철봉에 매달린 넷 가운데 셋의 주머니에 강도가 들어앉아 꼭 붙들었고, 흰 공이 밀려 떨어진다. 일산화탄소는 헤모글로빈에 산소보다 수백 배 강하게 붙는다. 이 덱의 카드는 약 400배로 적었다. 자리를 차지하고 놓지 않으니 헤모글로빈이 산소를 나르지 못한다. 매달린 넷의 얼굴이 질리고 어지러운 까닭, 일산화탄소 중독이 치명적인 이유다.","box":[[640,690,560,440]],"cards":["H0-274","H0-275","H0-276"]},{"sid":"s11","obj":"오른쪽 아래 회청 호스의 창 속 — 혼자 떠다니는 검은 방울 · 검은 방울을 등에 진 작은 사람 · 흰 분필 토막들","fact":"CO₂ 운반 — 녹아서 7 % · Hb 에 붙어 23 % · HCO₃⁻ 70 % · HCO₃⁻ 는 완충","hook":"혼자 뜬 방울 = 녹음 · 등에 진 방울 = 카바미노 Hb · 분필(탄산칼슘) = HCO₃⁻ · 제일 많다","say":"오른쪽 아래, 집으로 돌아가는 회청 호스의 창을 들여다보자. 이산화탄소가 실려 가는 모습이 셋이다. 혼자 떠다니는 검은 방울, 혈장에 그대로 녹은 것으로 약 7 퍼센트. 검은 방울을 등에 진 작은 사람, 헤모글로빈에 붙은 카바미노헤모글로빈으로 약 23 퍼센트. 그리고 흰 분필 토막들, 탄산수소이온 HCO₃⁻ 로 약 70 퍼센트. 대부분이 이 꼴로 간다. 분필은 염기, 혈장의 HCO₃⁻ 는 산을 받아내는 완충제로도 일한다.","box":[[1590,920,458,200]],"cards":["H0-267","H0-268","H0-294","H0-273"]},{"sid":"s12","obj":"오른쪽의 둥근 붉은 세탁기 — 문을 연 일꾼이 검은 방울을 넣자 드럼이 빙빙 돌고 · 아래로 물이 쏟아지고 드럼 둘레 붉은 테에 흰 분필 토막이 붙어 나온다","fact":"적혈구 안 CO₂ + H₂O → 탄산(H₂CO₃) → H⁺ + HCO₃⁻ · 탄산탈수효소가 빠르게","hook":"탈수기 = 탄산탈수효소 · 검은 방울 + 물 → 쏟아지는 물(H⁺) + 분필(HCO₃⁻)","say":"오른쪽에 둥근 붉은 세탁기가 섰다. 적혈구 안이다. 문을 연 일꾼이 검은 방울을 넣자 드럼이 빙빙 돈다. 세탁기의 탈수기, 탄산탈수효소다. 이산화탄소가 물과 만나 탄산이 되고, 탄산은 곧 수소 이온과 탄산수소이온으로 갈라진다. 아래로 쏟아지는 물이 수소 이온, 드럼 둘레 붉은 테에 붙어 나오는 흰 분필 토막이 탄산수소이온이다. 효소가 없어도 일어나는 반응이지만 탈수기가 엄청나게 빨리 돌려 이산화탄소를 재빨리 HCO₃⁻ 꼴로 바꿔 실어 나르고, 폐에서는 거꾸로 돌려 내보낸다.","box":[[1690,670,330,270]],"cards":["H0-269","H0-270","H0-271","H0-272"]}],"cq":{"H0-253":["산소해리곡선의 x축은?","산소분압 PO2"],"H0-254":["산소해리곡선의 y축은?","헤모글로빈의 산소포화도"],"H0-248":["헤모글로빈은 몇 개의 단위체로 이루어지는가?","4개"],"H0-249":["헤모글로빈 4 단위체의 구성은?","α사슬 2개 + β사슬 2개 (각 단위체의 헴에 Fe 1개)"],"H0-250":["헤모글로빈의 헴(heme) 중심 금속 이온은?","철(Fe)"],"H0-162":["헤모글로빈 한 분자는 산소를 몇 개 결합할 수 있는가?","4개"],"H0-161":["적혈구 한 개에 헤모글로빈이 약 몇 개 들어 있는가?","약 2억 5천만 개"],"H0-163":["적혈구 한 개가 운반 가능한 산소 분자 수는 대략 얼마인가?","약 10억 개"],"H0-169":["적혈구의 헤모글로빈은 어떤 금속 이온을 포함하는가?","철(Fe)"],"H0-251":["헤모글로빈이 S자형(sigmoidal) 해리곡선을 보이는 이유는?","4차구조와 협동적 결합 때문"],"H0-252":["sigmoidal curve의 뜻은?","중간 구간에서 작은 변화가 큰 포화도 변화를 만드는 S자형 곡선"],"H0-255":["폐에서 PO2가 높은 이유로 헤모글로빈은 어떻게 되는가?","높게 산소화된다"],"H0-256":["휴식 조직에서 헤모글로빈이 산소를 일부 놓는 이유는?","조직 PO2가 폐보다 낮기 때문"],"H0-257":["운동 조직에서 더 많은 산소가 방출되는 이유는?","PO2가 더 낮고 CO2·H+·온도 등이 높기 때문"],"H0-258":["보어효과(Bohr effect)란?","pH 감소나 CO2 증가로 헤모글로빈의 산소친화도가 감소하는 현상"],"H0-259":["보어효과가 중요한 이유는?","대사 활발한 조직에 더 많은 산소를 전달할 수 있기 때문"],"H0-260":["산소친화도를 떨어뜨리는 조건 여섯 가지는?","PO2 감소 · PCO2 증가 · H+ 증가 · pH 감소 · 온도 증가 · 2,3-BPG 증가"],"H0-261":["조건이 위와 같이 변하면 해리곡선은 어느 쪽으로 이동하는가?","오른쪽"],"H0-262":["오른쪽 이동의 의미는?","같은 PO2에서 산소를 더 쉽게 놓는다"],"H0-263":["왼쪽 이동의 의미는?","같은 PO2에서 산소를 더 잘 붙잡는다"],"H0-293":["태아 헤모글로빈(HbF)의 사슬 구성과 산소 친화도 특징은?","2α + 2γ 사슬로 구성 · 모체 헤모글로빈(HbA, 2α2β)보다 산소 친화도가 높아 태반에서 모체의 산소를 태아 쪽으로 끌어온다"],"H0-264":["미오글로빈(myoglobin)의 구조 수준은?","3차구조의 단일 폴리펩타이드"],"H0-265":["잠수 포유류 근육이 붉은 이유는?","미오글로빈 농도가 높기 때문"],"H0-266":["미오글로빈의 기능은?","근육 내 산소 저장"],"H0-291":["헤모글로빈과 미오글로빈을 비교하면?","헤모글로빈은 혈액에서 운반 · 미오글로빈은 근육에서 저장"],"H0-274":["일산화탄소(CO)가 위험한 이유는?","헤모글로빈에 O2보다 훨씬 강하게 결합하기 때문"],"H0-275":["CO의 헤모글로빈 친화도는 O2의 대략 몇 배인가?","약 400배"],"H0-276":["일산화탄소 중독이 치명적인 이유를 한 문장으로 쓰면?","헤모글로빈이 산소 대신 CO를 잡아 산소 운반이 크게 줄기 때문"],"H0-267":["이산화탄소의 일부가 혈장에 용해된 형태로 직접 운반되는 비율은?","약 7%"],"H0-268":["대부분의 이산화탄소는 어떤 형태로 운반되는가?","탄산수소이온(HCO3-) 형태"],"H0-294":["혈액에서 이산화탄소가 운반되는 3가지 형태와 대략 비율은?","혈장에 용해 약 7% · 카바미노헤모글로빈(Hb에 결합) 약 23% · 탄산수소이온(HCO₃⁻) 약 70%"],"H0-273":["CO2 운반에서 혈장의 HCO3-가 중요한 이유는?","완충용액으로도 작용하기 때문"],"H0-269":["CO2가 적혈구 안에서 물과 반응해 되는 것은?","탄산(H2CO3)"],"H0-270":["탄산은 곧 무엇으로 해리되는가?","H+와 HCO3-"],"H0-271":["이 과정의 핵심 효소는?","탄산탈수효소(carbonic anhydrase)"],"H0-272":["탄산탈수효소가 중요한 이유는?","CO2를 빠르게 HCO3- 형태로 전환해 운반과 배출을 돕기 때문"]},"hubPanel":null};
const $ = id => document.getElementById(id);
$('title').textContent = L.title; document.title = L.title;
// 요약 줄(sub)에는 물건 = 답이 다 적혀 있다 — 복습 · 시험에서는 접어 두고, 누르면 편다(GPT 추가 감사 2026-11-11 §7)
let subOpen = false;
function subShow() { const hide = (mode === 'review' || mode === 'quiz') && !subOpen && !!L.sub; $('sub').textContent = hide ? '요약 줄은 접어 두었다(답이 적혀 있다) — 누르면 편다' : (L.sub || ''); $('sub').classList.toggle('hid', hide); }
$('sub').onclick = () => { if (mode === 'review' || mode === 'quiz') { subOpen = !subOpen; subShow(); } };
$('img').src = L.img; $('img').alt = L.title;
if (L.home) $('home').href = L.home;  // 한 파일(standalone)은 저장소 밖에서 열리므로 배포 주소로
if (L.hub) $('hub').href = L.hub; else if (L.hubPanel) $('hub').href = '../sketchy.html#' + L.hubPanel;
const ov = $('ov'); ov.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
let mode = 'tour', i = -1, playing = false, voice = true, rate = 1.0, quizOrder = [], quizPos = 0, quizRevealed = false, shuffle = false, sess = null;
const stops = L.stops;
subShow();
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID
const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact));
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
function speak(t) {
  t = ttsNorm(t);
  const my = ++speakSeq, at = i;
  const advance = (ms) => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, ms);
  if (!('speechSynthesis' in window)) { if (playing) advance(3500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = () => { if (started) advance(700); };
  u.onerror = () => { if (!started) advance(3000); };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started && my === speakSeq) { speechSynthesis.cancel(); advance(3000); } }, 2500);  // 목소리가 없으면 글만 3초
}
function go(k) {
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) setTimeout(() => { if (playing) next(); }, 3500);
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; speechSynthesis && speechSynthesis.cancel(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i + 1); else speechSynthesis && speechSynthesis.cancel(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) speechSynthesis && speechSynthesis.cancel(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
</script>
