<script>
const L = {"id":"L48f","scene":"s48","part":"f","title":"짚단 부부의 혼례와 이혼 — 감수 1분열(전기 I 다섯 토막 · 접합 · 교차 · 키아즈마 · 중기 I · 후기 I · 말기 I)","sub":"가을 잔칫날 두 층 헛간의 위층 — 큰 돔 천막 안에서 가는 실이던 남색 신랑과 하늘색 신부가 중매쟁이의 짚 띠로 엮이고, 이발사가 끝을 맞바꾸고, X 로 걸린 채 버티다, 찢긴 천막을 밟고 수레로 실려 나온다 · 춤판 점선에 짝째로 선 부부를 줄다리기가 반대쪽으로 갈라놓고, 목수가 칸막이를 친다","img":"img/L48f.webp?v=2ceac9384e83","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"두 층 헛간의 위층(바닥 뚜껑 문 아래가 아래층) — 왼쪽은 앞이 트인 커다란 빨강 · 흰 줄 돔 천막(그 안에서 혼례), 오른쪽은 흰 점선이 그어진 춤판 · 짚단 신랑은 남색에 검은 모자, 신부는 하늘색에 흰 면사포","fact":"감수 1분열 전기의 다섯 토막 — 세사기 · 접합기 · 태사기 · 복사기 · 이동기","hook":"왼쪽에서 오른쪽 = 차례 · 이름이 곧 그림: 가는 실(세사) → 맞붙음(접합) → 굵은 덩이(태사) → 둘로 보이는 X(복사) → 실려 감(이동) · 남색 = 아버지 쪽 · 하늘색 = 어머니 쪽(옛 s47p01 의 짙은 실 · 옅은 실)","say":"가을 잔칫날, L48a 헛간의 위층이다. 왼쪽의 앞이 열린 빨강·흰 줄무늬 돔 천막은 핵이고, 안에서는 짚단 혼례가 열린다. 검은 모자의 남색 신랑은 아버지에게서 온 염색체, 면사포의 하늘색 신부는 어머니에게서 온 염색체다. 같은 키의 둘이 상동염색체 한 쌍이다. 왼쪽에서 오른쪽으로 감수 1분열 전기의 다섯 단계인 세사기, 접합기, 태사기, 복사기, 이동기를 따라가자. 이름을 풀면 가는 실, 맞붙음, 굵은 실, 겹실, 옮김이다. 혼례 후 오른쪽 춤판에서 부부가 갈라지듯, 감수 1분열은 상동염색체가 짝지었다가 분리되는 과정이다.","src":["s47p01#0","s47p01#7"],"cards":["C1-42"],"box":[[20,30,1160,880],[1180,300,860,560]]},{"sid":"s2","obj":"천막 앞자락 왼쪽 바닥 — 국수 가락처럼 가는 남색 · 하늘색 짚 실이 짝 없이 흩어져 있다(아직 짚단으로 묶이지 않음)","fact":"세사기(細絲期) — 가는 실: 염색체가 응축을 시작하고 상동끼리는 아직 떨어져 있다","hook":"가는 실 = 세사(細絲) · 흩어짐 = 짝짓기 전 · 실 → 짚단 → 수레의 뚱뚱한 덩이 = 전기 I 내내 점점 응축","say":"천막 앞자락 왼쪽 바닥에는 국수처럼 가는 남색과 하늘색 짚 실이 짝 없이 흩어져 있다. 첫째 단계인 세사기이며, 이름은 가는 실이라는 뜻이다. 이미 복제된 염색체가 응축을 시작해 가는 실처럼 보이지만, 상동염색체끼리는 아직 짝짓지 않았다. 오른쪽으로 가면 실이 짚단, 굵은 덩어리로 변하고 수레에 실릴 때 가장 짧고 굵어진다. 전기 I 동안 점점 응축되는 흐름이다.","src":["s47p01#1"],"cards":["C1-42#1","D0-51"],"box":[[20,820,350,150]]},{"sid":"s3","obj":"그 곁 — 머릿수건 할머니 중매쟁이가 모자 쓴 남색 신랑과 면사포 쓴 하늘색 신부를 나란히 세우고 엮은 짚 띠를 아랫도리에 한 바퀴 감는다 · 띠 두루마리는 아직 손에 · 위쪽은 서로 떨어져 있다","fact":"접합기 — 상동이 짝지어 붙는 시냅시스가 일어나고 그 사이에 접합사가 생긴다","hook":"중매쟁이 = 짝짓기(시냅시스 · 접합) · 엮은 짚 띠 = 접합사(시냅토네마 복합체 · 기출의 「지퍼 같은 구조」 — 덱에서 【지퍼】는 DNA 라 띠로) · 반만 감김 = 지금 생기는 중","say":"머릿수건을 쓴 중매쟁이 할머니가 모자 쓴 남색 신랑과 면사포 쓴 하늘색 신부를 나란히 세웠다. 짚 띠를 아래쪽에 한 바퀴 둘렀지만 두루마리는 아직 손에 있고, 위쪽은 떨어져 있다. 둘째 단계인 접합기는 맞붙는 때이며, 지금은 접합이 진행 중이다. 상동염색체가 짝지어 붙는 것이 시냅시스이고, 사이를 잇는 띠는 접합사, 즉 시냅토네마 복합체다. 기출에서는 지퍼 같은 구조라고 표현한다. 전기 I의 접합기에 이 구조가 만들어진다는 것을 반쯤 감긴 띠와 연결하자.","src":["s47p01#2"],"cards":["C1-42#2","C1-43","C1-103","D0-60","D0-113"],"box":[[80,470,330,370]]},{"sid":"s4","obj":"그 옆 — 같은 띠가 몸통을 여러 바퀴 칭칭 감아 남색 신랑과 하늘색 신부가 굵은 한 덩이가 된 부부(머리끝과 발치만 드러남)","fact":"접합사 — 두 상동염색체를 길이 내내 단단히 붙여 교차가 제자리에서 일어나게 돕는다","hook":"칭칭 감겨 한 덩이 = 단단한 결착 · 꼭 붙어야 이발사가 두 짚단의 같은 높이를 자른다(교차를 도움)","say":"옆의 부부는 띠가 여러 바퀴 감겨 굵은 한 덩어리가 되었다. 접합사는 두 상동염색체를 길이 전체에 걸쳐 정밀하게 붙잡는다. 같은 높이의 대응 부위에서 다음 장면의 이발사가 가위질하도록 맞추는 것이다. 상동염색체를 정확히 결착해 교차가 적절한 위치에서 일어나도록 돕는다.","src":["s47p01#3"],"cards":["C1-104","D0-114"],"box":[[425,420,160,395]]},{"sid":"s5","obj":"칭칭 감긴 부부 곁 걸상 위 줄무늬 앞치마 이발사 — 가위로 잘라 낸 남색 끝 한 줌을 하늘색 신부 머리 위로 들어 올렸다 · 남색 신랑 머리 왼쪽엔 이미 하늘색 끝이 꽂혔다","fact":"태사기(太絲期) — 굵은 실: 실제 교차(유전자 교환)가 활발히 일어나는 때","hook":"굵은 한 덩이 = 태사(太絲) · 이발사의 가위 = 잘라 잇는 교차(옛 s47p01 의 가위 — 낫(레닌) · 볼트 커터(세퍼레이스)와 연장이 다르다)","say":"칭칭 묶인 부부 옆 걸상에 줄무늬 앞치마의 이발사가 있다. 가위로 신랑의 남색 끝 한 줌을 잘라 신부 머리 위로 들어 올렸다. 신부에게 꽂으려는 참이고, 신랑 머리 왼쪽에는 이미 하늘색 조각이 꽂혀 있다. 셋째 단계인 태사기이며, 이름은 굵은 실이라는 뜻이다. 접합으로 굵게 붙은 이 시기에 실제 교차가 가장 활발하다. 접합기에 붙고, 태사기에 바꾼다는 차례를 기억하자.","src":["s47p01#4"],"cards":["C1-42#3","C1-44"],"box":[[420,360,250,400]]},{"sid":"s6","obj":"이발사가 바꾸는 끝 — 남색 신랑 머리 왼쪽에 신부의 하늘색 끝 · 신랑에게서 자른 남색 한 줌은 신부 머리 위로 · 춤판의 X 짚단 넷도 안쪽(점선 쪽) 위 다발 끝이 짝의 빛깔","fact":"교차 — DNA 가 잘려 비자매 염색분체의 같은 자리와 다시 이어진다 → 재조합 염색체","hook":"자르기 = DNA 절단 · 상대 짚단에 꽂기 = 비자매 염색분체의 상응 부위와 재연결 · 하늘색 끝을 단 남색 신랑 = 아빠 염색분체에 엄마 조각 = 재조합 염색체","say":"이발사가 조각을 주고받는 상대를 보자. 남색 신랑과 하늘색 신부 사이에서 교환하며, 같은 짚단 안의 자매끼리 바꾸지 않는다. 교차는 DNA를 잘라 비자매 염색분체의 대응 부위에 다시 잇는 과정이다. 아버지 쪽 염색분체에 어머니 쪽 조각이 붙은 것처럼, 양쪽 부모의 유래가 섞인 염색체를 재조합 염색체라고 한다. 춤판의 X 짚단에서는 두 다발 중 안쪽 다발 끝만 상대 색으로 바뀌어 있다.","cards":["D0-55","D0-115","D0-116","D0-117"],"box":[[415,360,200,200],[1490,380,190,350]]},{"sid":"s7","obj":"띠가 풀려 바닥에 길게 늘어졌다 — 그 위 남색과 하늘색 짚단이 아랫도리는 A 자로 벌어졌는데 꼭대기가 X 로 엇걸렸다 · 양쪽에서 두 소년이 하나씩 붙들었다","fact":"복사기(複絲期) — 접합사가 풀려 상동이 살짝 벌어지고 교차 자리가 키아즈마(X)로 보인다","hook":"풀린 띠 = 접합사가 사라짐 · 벌어져 둘로 보임 = 복사(複絲 · 겹실) · 꼭대기 X = 키아즈마(교차의 흔적) · ⚠ 교차는 앞(태사기)에서 이미 — 여기선 흔적이 보인다","say":"짚 띠가 풀려 바닥에 늘어지고, 남색과 하늘색 짚단의 아래쪽은 A 자로 벌어진다. 하지만 꼭대기는 X 자로 걸려 있다. 양쪽 소년이 각각 잡아도 X는 풀리지 않는다. 넷째 단계인 복사기이며, 이름은 겹실이라는 뜻이다. 접합사가 풀려 상동염색체가 조금 벌어져도, 교차가 일어난 자리에는 키아즈마가 남는다. 태사기에 교차가 일어나고, 복사기에는 그 흔적이 보인다는 차이를 구분하자. 두 시기를 뒤바꾸는 선지가 흔한 함정이다.","src":["s47p01#5"],"cards":["C1-42#4","C1-46"],"box":[[530,450,420,430]]},{"sid":"s8","obj":"천막 오른쪽 옆구리가 크게 찢겨 늘어졌다 — 짧게 뭉친 부부를 실은 외바퀴 수레가 찢긴 줄무늬 천 조각이 흩어진 바닥을 지나 춤판 쪽으로 나간다","fact":"이동기(移動期) — 염색체가 가장 짧고 굵어지고 핵막이 사라진다","hook":"수레로 실려 감 = 이동(移動) · 가장 짧고 뚱뚱 = 응축의 끝 · 찢겨 무너진 천막 = 핵막 소실(L48a 둘째 칸) · 위쪽 가장자리의 너덜거림 = 사라질 채비(L48a 첫째 칸)","say":"천막 오른쪽이 크게 찢어지고, 일꾼이 그 틈으로 외바퀴 수레를 밀고 나온다. 수레에는 짧고 굵게 응축된 부부가 실렸고, 바닥에는 찢긴 줄무늬 천이 흩어져 있다. 다섯째 단계인 이동기이며, 이름은 옮겨 간다는 뜻이다. 염색체가 가장 짧고 굵게 응축되고 핵막이 사라진다. 처음부터 너덜거리던 천막 위쪽 가장자리도 이 변화를 준비하는 단서였다. L48a의 무너진 천막과 연결하자. 수레는 밧줄인 방추사가 기다리는 춤판으로 향한다.","src":["s47p01#6"],"cards":["C1-42#5","D0-50#3"],"box":[[810,420,400,520]]},{"sid":"s9","obj":"천막 밖 바닥 — 등을 맞댄 두 아이가 밧줄 토막을 매단 검은 쇠 굴렁쇠를 막대로 서로 반대쪽으로 굴린다","fact":"전기 I 에서 유사분열과 같은 셋 — 중심체 이동 · 방추사 형성 · 핵막 소실","hook":"검은 쇠고리 = 극(【헛간 벽에 박힌 검은 쇠고리(밧줄이 나옴)】) · 반대쪽으로 굴림 = 두 중심체가 양 끝으로 · 매달린 밧줄 토막 = 방추사가 생기기 시작 · 셋째(핵막 소실)는 찢긴 천막","say":"천막 밖에서 등을 맞댄 아이 둘이 검은 쇠 굴렁쇠를 막대로 각각 왼쪽과 오른쪽으로 굴린다. 굴렁쇠는 L48a의 벽에서 방추사가 나오던 극의 쇠고리다. 두 중심체가 반대 극으로 이동하는 과정이다. 고리에 달린 짧은 밧줄은 방추사 형성이 시작되었다는 뜻이다. 여기에 찢긴 천막인 핵막 소실을 더하면 중심체 이동, 방추사 형성, 핵막 소실의 세 변화가 된다. 이 변화들은 감수 1분열 전기와 유사분열 전기에 공통이다.","cards":["D0-50","D0-50#1","D0-50#2"],"box":[[225,870,500,250]]},{"sid":"s10","obj":"춤판 한가운데 흰 점선을 사이에 두고 부부 둘이 짝째로 마주 섰다 — 뒤는 키 큰 쌍(남색 신랑이 왼쪽), 앞은 작은 쌍(하늘색 신부가 왼쪽) · 짚단마다 허리 고리에 밧줄이 한 가닥씩 매여 사내 손을 거쳐 같은 쪽 쇠고리로 — 왼쪽 짚단 둘은 왼쪽 기둥, 오른쪽 둘은 오른쪽 벽","fact":"중기 I — 상동이 짝째로 중기판에 서고 한 상동의 두 자매는 같은 극에 붙는다","hook":"짝째로 점선 = 상동쌍이 중기판에(유사분열은 하나씩 — L48a 셋째 칸) · 짚단 하나에 밧줄 하나 = 두 자매가 한쪽 극으로 · 큰 쌍과 작은 쌍의 방향이 다름 = 어느 쪽을 볼지는 쌍마다 따로(L48g 짚 제비)","say":"오른쪽 춤판의 흰 점선은 중기판이다. 두 부부가 짝을 이룬 채 점선 양쪽에 서 있다. 늦은 전기 I에 방추사가 붙으면 상동쌍이 중기판으로 이동한다. 뒤의 큰 쌍과 앞의 작은 쌍은 서로 다른 염색체다. 각 짚단의 허리 고리에는 밧줄 하나가 연결되어, 왼쪽 짚단은 왼쪽 쇠고리인 극에, 오른쪽 짚단은 오른쪽 쇠고리인 극에 붙는다. 한 상동염색체의 두 자매염색분체가 같은 극의 미세소관에 연결되는 뜻이다. 큰 쌍은 남색이 왼쪽이고 작은 쌍은 하늘색이 왼쪽이듯, 각 쌍의 배향은 독립적으로 정해진다.","cards":["D0-59","D0-72"],"box":[[1410,360,360,500]]},{"sid":"s11","obj":"줄다리기 — 양쪽 사내들이 쇠고리에 맨 밧줄을 당기자 짚단 사이로 끊긴 은빛 C 자 고리 조각들이 튀고, 짚단마다 허리 고리만 남아 두 다발이 X 로 벌어진 채 서로 반대쪽으로 끌려간다 · 앞 쌍은 발이 바닥에서 들렸다","fact":"후기 I — 팔을 붙잡던 코헤신이 분해되고 방추사가 상동을 각각 반대 극으로 끈다","hook":"끊겨 튀는 은빛 C 고리 = 팔의 코헤신 분해(【짚 다발을 끼운 은빛 쇠 고리】) · 남은 허리 고리 = 동원체 코헤신(자매는 아직 붙음 → 감수 2분열) · 쇠고리에 맨 밧줄 = 방추장치","say":"양쪽 사내가 쇠고리에 연결된 삼밧줄을 당기자 짚단 팔을 묶던 은빛 고리가 C 자로 끊어져 튄다. 허리 고리만 남은 짚단은 두 다발이 X 자로 벌어진 채, 신랑과 신부가 반대 극으로 끌려간다. 염색분체의 팔을 잡는 코헤신이 분해되어야 상동염색체가 분리된다. 이동을 일으키는 것은 방추장치이며 목적지는 반대 극이다. 팔과 허리의 고리로 자매가 길이를 따라 붙어 있는 상태를 자매 염색분체 결합, cohesion이라고 한다. 이 단계에서는 허리의 동원체 코헤신이 남아 자매가 붙어 있다. 그 고리는 아래층 감수 2분열에서 끊어진다.","cards":["D0-77","D0-78","D0-79","D0-63"],"box":[[1180,400,260,470],[1540,400,120,400],[1760,380,280,480]]},{"sid":"s12","obj":"앞쪽 — 무릎 꿇은 목수가 점선 위에 낮은 판자 칸막이를 박아 춤판을 두 방으로 가르기 시작했다 · 칸막이 양쪽에 아래층 계단이 보이는 뚜껑 문 하나씩","fact":"말기 I · 세포질분열 — 딸세포 둘, 모두 반수체(상동쌍마다 하나씩 · 아직 X 둘)","hook":"칸막이 = 세포질분열 · 두 방 = 딸세포 2 · 방마다 큰 X 하나 · 작은 X 하나(부부가 아님) = 반수체 · 뚜껑 문 = 아래층(L48g · 감수 2분열)","say":"앞쪽 목수가 무릎을 꿇고 점선을 따라 낮은 판자 칸막이를 세운다. 말기 I과 함께 일어나는 세포질분열이다. 춤판이 두 방으로 나뉘어 딸세포 두 개가 된다. 왼쪽에는 큰 남색 X와 작은 하늘색 X, 오른쪽에는 큰 하늘색 X와 작은 남색 X가 들어간다. 각 방은 상동쌍에서 하나씩만 받아 짝이 없는 반수체다. 하지만 염색체는 여전히 두 다발이 붙은 X, 즉 복제된 상태다. 방마다 있는 뚜껑 문으로 내려가면 감수 2분열이 이어진다.","cards":["D0-84","D0-85","D0-86"],"box":[[1180,840,830,300]]}],"cq":{"C1-42":["감수 1분열 전기의 5세부 단계 순서는?","세사기 · 접합기 · 태사기 · 복사기 · 이동기"],"C1-42#1":["감수 1분열 전기의 5세부 단계 순서는?","세사기"],"D0-51":["전기 I 동안 염색체에는 어떤 변화가 일어나는가?","점차 응축된다"],"C1-42#2":["감수 1분열 전기의 5세부 단계 순서는?","접합기"],"C1-43":["상동 염색체 접합(시냅시스)이 일어나는 단계는?","접합기 (Zygotene)"],"C1-103":["감수 1분열 전기 중 시냅토네마 복합체가 형성되는 시기는?","접합기 (Zygotene)"],"D0-60":["전기 I에서 상동염색체를 단단히 연결하는 지퍼 같은 구조는?","접합복합체(synaptonemal complex)"],"D0-113":["접합복합체의 형성 시점은?","전기 I"],"C1-104":["접합사(Synaptonemal complex)의 역할은?","상동 염색체를 정교하게 결착시켜 교차를 도움"],"D0-114":["접합복합체의 기능은?","두 상동염색체를 단단히 연결시킨다"],"C1-42#3":["감수 1분열 전기의 5세부 단계 순서는?","태사기"],"C1-44":["실제 교차(유전자 교환)가 활발히 일어나는 단계는?","태사기 (Pachytene)"],"D0-55":["교차의 분자적 핵심은?","DNA가 절단되어 다른 비자매 염색분체와 다시 연결되는 것"],"D0-115":["교차가 일어날 때 잘린 DNA 끝은 어디와 연결되는가?","비자매 염색분체의 상응하는 DNA 부위"],"D0-116":["교차의 결과 아빠 염색분체는 무엇과 연결되는가?","모계의 염색분체 일부"],"D0-117":["교차로 생성되는 염색체를 무엇이라 하는가?","재조합염색체(recombinant chromosome)"],"C1-42#4":["감수 1분열 전기의 5세부 단계 순서는?","복사기"],"C1-46":["교차된 염색체들이 살짝 떨어지며 키아즈마가 관찰되는 단계는?","복사기 (Diplotene)"],"C1-42#5":["감수 1분열 전기의 5세부 단계 순서는?","이동기"],"D0-50#3":["전기 I에서 유사분열과 공통적으로 일어나는 3가지는?","핵막 소실"],"D0-50":["전기 I에서 유사분열과 공통적으로 일어나는 3가지는?","중심체 이동 · 방추사 형성 · 핵막 소실"],"D0-50#1":["전기 I에서 유사분열과 공통적으로 일어나는 3가지는?","중심체 이동"],"D0-50#2":["전기 I에서 유사분열과 공통적으로 일어나는 3가지는?","방추사 형성"],"D0-59":["늦은 전기 I에서 미세소관 부착의 결과는?","상동쌍이 중기판 쪽으로 이동한다"],"D0-72":["중기 I에서 한 상동염색체의 두 자매염색분체는 어느 극에서 온 미세소관과 연결되는가?","모두 한쪽 극에서 온 미세소관"],"D0-77":["후기 I에서 상동염색체 분리를 가능하게 하는 사건은?","염색분체 팔을 잡고 있던 단백질의 분해"],"D0-78":["후기 I에서 상동염색체는 무엇의 도움으로 이동하는가?","방추장치"],"D0-79":["후기 I의 이동 방향은?","각각 반대 극"],"D0-63":["자매염색분체가 길이를 따라 밀접하게 연결된 상태를 무엇이라 하는가?","자매 염색분체 결합(sister chromatid cohesion)"],"D0-84":["말기 I과 동시에 일반적으로 일어나는 것은?","세포질분열"],"D0-85":["감수 I 후 형성되는 딸세포 수는?","2개"],"D0-86":["감수 I 후 딸세포의 핵상은?","반수체"]},"hubPanel":"s47p01"};
const $ = id => document.getElementById(id);
$('title').textContent = L.title; document.title = L.title;
// 요약 줄(sub)에는 물건 = 답이 다 적혀 있다 — 복습 · 시험에서는 접어 두고, 누르면 편다(GPT 추가 감사 2026-11-11 §7)
let subOpen = false;
function subShow() { const hide = (mode === 'review' || mode === 'quiz') && !subOpen && !!L.sub; $('sub').textContent = hide ? '요약 줄은 접어 두었다(답이 적혀 있다) — 누르면 편다' : (L.sub || ''); $('sub').classList.toggle('hid', hide); }
$('sub').onclick = () => { if (mode === 'review' || mode === 'quiz') { subOpen = !subOpen; subShow(); } };
$('img').src = L.img; $('img').alt = L.title;
if (L.home) $('home').href = L.home;  // 한 파일(standalone)은 저장소 밖에서 열리므로 배포 주소로
if (L.hub) $('hub').href = L.hub; else if (L.hubPanel) $('hub').href = '../sketchy.html#' + L.hubPanel;
const ov = $('ov'); ov.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
let tourEnded = false;
let mode = 'tour', i = -1, playing = false, voice = true, rate = 1.0, quizOrder = [], quizPos = 0, quizRevealed = false, shuffle = false, sess = null;
const stops = L.stops;
subShow();
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID
const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');

    });
    // ② 로마 숫자(문맥) — 볼티모어 군 · 부두 번호는 한자어 수, 나머지는 영어 수. 대 · 자 · 선 · 기가 붙으면 글자

    if (W[core] !== undefined) return 'lex';
    // 소문자 세 글자 이상이 든 조각은 사전이 잡아야 한다(나머지 조각은 글자 이름이어도 된다)

const ttsNorm = t => TTSNorm.ttsNorm(t, TTS_LEX, TTS_ORDER, L.id);
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate, auto:playing && mode === 'tour',
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate, auto:true,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);

}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
