<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>커다란 위 통과 십이지장 작업대 — 위샘 세포와 소화 효소</title>
<style>
  :root{--ink:#1b1b1f;--ink2:#4b4b55;--line:#e3e1da;--teal:#0f766e;--teal50:#ecfdf5;--gold:#b45309;--bg:#f7f5ef}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1100px;margin:0 auto;padding:12px 14px 40px}
  h1{font-size:18px;margin:6px 0 2px}
  .sub{font-size:12.5px;color:var(--ink2);margin:0 0 10px}
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
  button{font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
  button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  button:disabled{opacity:.45;cursor:default}
  .stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .stage img{display:block;width:100%;height:auto}
  .stage svg{position:absolute;inset:0;width:100%;height:100%}
  .cap{margin-top:10px;min-height:76px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px}
  .cap .n{font-size:11.5px;color:var(--ink2)}
  .cap .obj{font-weight:700;font-size:15px;margin:2px 0}
  .cap .fact{font-size:14px;margin:2px 0}
  .cap .hook{font-size:13px;color:var(--gold);margin-top:4px}
  .cap.muted{color:var(--ink2);font-size:13px}
  .recap{margin-top:12px;display:none}
  .recap ol{padding-left:22px;margin:6px 0}
  .recap li{margin:4px 0;font-size:13.5px}
  .recap li b{color:var(--teal)}
  .score{font-size:13px;color:var(--ink2);margin-left:auto}
  .hint{font-size:12px;color:var(--ink2);margin-top:8px}
  .hole{fill:#000}
  .cur{fill:none;stroke:#f59e0b;stroke-width:6;stroke-dasharray:14 8}
  .hot{fill:transparent;cursor:pointer}
  .hot:hover{fill:rgba(245,158,11,.18)}
  .judge{display:none;gap:6px;margin-top:8px}
  .judge button{font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="bar">
    <button id="bTour" class="on">투어</button>
    <button id="bRecap">되짚기</button>
    <button id="bReview">복습 — 그림만</button>
    <button id="bQuiz">시험 — 순서대로</button>
    <span class="score" id="score"></span>
  </div>
  <div class="stage" id="stage">
    <img id="img" alt="">
    <svg id="ov" preserveAspectRatio="none"></svg>
  </div>
  <div class="bar">
    <button id="bPrev">◀ 이전</button>
    <button id="bPlay">▶ 시작</button>
    <button id="bNext">다음 ▶</button>
    <button id="bVoice" class="on">🔊 음성</button>
    <button id="bRate">속도 1.0</button>
    <span class="hint" id="step"></span>
  </div>
  <div class="cap" id="cap"></div>
  <div class="judge" id="judge"><button id="jOk">맞았다</button><button id="jNo">틀렸다</button><button id="jShow">답 보기</button></div>
  <div class="recap" id="recap"></div>
  <p class="hint">→ 다음 · ← 이전 · 스페이스 재생/멈춤. 음성은 이 기기에 깔린 한국어 목소리를 쓴다(없으면 글만). 점수는 이 브라우저에만 남는다.</p>
</div>
<script>
const L = {"id":"L12a","scene":"s12","part":"a","title":"커다란 위 통과 십이지장 작업대 — 위샘 세포와 소화 효소","sub":"기둥 인부 + 초록 콜라 병(주세포 · 펩시노겐) · 벽돌 인부 + 흙 항아리(벽세포 · HCl) · 봉투 + 파란 코(내인자 · B12) · 바깥 수도꼭지(알칼리성 조조) · 송아지(레닌) · 검은 병 마름모 왼쪽(펩신) · 드립 주전자 쌀 · 아르헨티나(트립신) · 기모노 마름모 오른쪽(키모트립신) · 열쇠 상자(엔테로펩티데이스) · 쟁반 + 콜리(라이페이스 · 콜리페이스)","img":"img/L12a.webp","w":2048,"h":1144,"stops":[{"obj":"앞을 잘라 낸 커다란 통(위) — 벽에 박힌 인부 둘 · 통 속 뗏목의 요리사 · 오른쪽 아래로 이어진 관(십이지장) 속 작업대 둘 · 관 바닥의 기름 웅덩이","fact":"위샘 세포가 붓고 · 위에서 펩신이 자르고 · 십이지장에서 이자 효소가 마저 자른다","hook":"붓고 · 자르고 · 켜고","say":"앞을 잘라 낸 커다란 강철 통이 위다. 벽에는 하반신이 벽에 박힌 인부 둘이 무언가를 붓고, 통 속 뗏목에서는 요리사가 구슬 사슬을 자른다. 통 오른쪽 아래로 이어진 관이 십이지장, 그 속 작업대 둘에서 이자에서 온 효소들이 마저 자른다. 구슬 사슬은 단백질이다. 노란 별 표시가 사슬이 끊긴 자리다.","box":null,"src":["s12p01#0"],"cards":["G1-84"]},{"obj":"아래쪽 인부 — 하반신이 흰 그리스 기둥 · 파란 티셔츠","fact":"주세포 — 펩시노겐을 낸다","hook":"기둥 = 주(柱)세포","say":"아래쪽 인부는 하반신이 흰 그리스 기둥이다. 기둥 주, 주세포. 위샘 깊은 쪽에서 펩시노겐을 낸다.","box":[250,580,250,380],"src":["s12p01#0"],"cards":["G1-84"]},{"obj":"기둥 인부가 초록 유리병(콜라 병 꼴)에서 붓는 걸쭉한 베이지 반죽","fact":"펩신은 비활성형 펩시노겐으로 분비된다","hook":"콜라 병 = 펩시노겐","say":"기둥 인부가 콜라 병 꼴의 초록 유리병에서 걸쭉한 베이지 반죽을 붓는다. 펩시 병, 펩시노겐이다. 펩신은 처음부터 펩신으로 나오지 않고 비활성형 펩시노겐으로 분비된다. 산을 만나야 켜진다. 뗏목의 요리사가 든 검은 병이 켜진 뒤의 모습이다.","box":[380,630,180,210],"src":["s12p01#1"],"cards":["G1-83"]},{"obj":"위쪽 인부 — 하반신이 붉은 벽돌","fact":"벽세포 — 염산을 낸다(주세포는 펩시노겐)","hook":"벽돌 = 벽세포","say":"위쪽 인부는 하반신이 붉은 벽돌, 벽세포다. 주세포는 펩시노겐, 벽세포는 염산. 기둥이냐 벽돌이냐로 둘을 가른다.","box":[240,200,320,400],"src":["s12p01#2"],"cards":["G1-92","G1-85"]},{"obj":"벽돌 인부가 민짜 흙 항아리에서 붓는 맑은 물줄기","fact":"염산 HCl — 벽세포가 H⁺와 Cl⁻를 내보낸다","hook":"병이 아니라 항아리 = 산","say":"벽돌 인부는 민짜 흙 항아리에서 맑은 물줄기를 붓는다. 염산이다. 벽세포는 수소 이온과 염화 이온 두 가지를 내보내 위 안에서 염산이 된다. 병이냐 항아리냐로도 두 세포가 갈린다.","box":[400,340,160,260],"src":["s12p01#3"],"cards":["G1-86"]},{"obj":"벽돌 인부가 다른 손으로 내미는 흰 봉투 — 통 위 선반에서 그 봉투를 받아 오른쪽으로 달려 나가려는 사람, 코끝만 코발트빛","fact":"내인자 — 회장에서 비타민 B12를 흡수하는 데 필요","hook":"봉투 = 내인자 · 파란 코 = B12","say":"벽돌 인부는 다른 손으로 흰 봉투를 내민다. 통 위 가장자리에서 그 봉투를 받아 달려 나가는 사람은 코끝이 코발트빛, 비타민 B12 코발라민이다. 봉투가 내인자. 벽세포는 염산 말고 내인자도 낸다. 이 사람은 봉투를 들고 회장 문까지 가야 들어갈 수 있다.","box":[[560,170,110,90],[660,20,300,260]],"src":["s12p01#4"],"cards":["G1-214"]},{"obj":"통 바깥벽 놋쇠 수도꼭지 — 흰 거품이 통 밖의 붉은 관(혈관)으로 흘러 나간다","fact":"알칼리성 조조 — 산을 낼 때 HCO₃⁻가 혈액으로 간다","hook":"밖으로 나가는 거품 = 중탄산","say":"통 바깥벽, 벽돌 인부 바로 뒤에서 놋쇠 수도꼭지가 흰 거품을 쏟는다. 거품이 떨어지는 곳은 통 안이 아니라 통 밖의 붉은 관, 혈관이다. 벽세포가 안으로 산을 낼 때 바깥으로는 중탄산 이온이 혈액으로 나간다. 그래서 식사 뒤 피가 잠깐 알칼리 쪽으로 기운다. 알칼리성 조조다.","box":[0,360,210,520],"src":["s12p01#5"],"cards":[]},{"obj":"통 아래 왼쪽 — 어린 송아지가 우유 양동이에 입을 댄다 · 양동이 우유가 몽글몽글 덩어리로 굳었다","fact":"레닌(키모신) — 어린 포유류에서 우유 카세인을 응고","hook":"송아지 + 굳은 우유","say":"통 아래 왼쪽에서 어린 송아지가 우유 양동이에 입을 댄다. 양동이 우유가 몽글몽글 덩어리로 굳었고, 바닥에도 덩어리가 흘렀다. 레닌, 키모신이다. 어린 포유류의 위에서 우유 단백질 카세인을 굳힌다.","box":[20,880,320,250],"src":["s12p01#6"],"cards":[]},{"obj":"통 속 뗏목 — 검은 탄산 병을 쳐든 요리사 · 사슬은 향 피어오르는 보라 마름모의 왼쪽에서 끊겼다(노란 별)","fact":"펩신 — 방향족 아미노산의 N 말단 쪽(앞)을 자른다","hook":"검은 병 · 마름모 왼쪽","say":"통 속 뗏목에서 요리사가 검은 탄산 병을 쳐들었다. 초록 병의 펩시노겐이 산을 만나 켜진 펩신이다. 사슬이 끊긴 자리, 노란 별은 향이 피어오르는 보라 마름모의 왼쪽. 향이 나는 마름모가 방향족 아미노산이다. 펩신은 방향족 아미노산의 앞, N 말단 쪽을 자른다.","box":[600,390,340,270],"src":["s12p03#0"],"cards":[]},{"obj":"관 속 위 작업대 — 드립 주전자를 든 빨간 멜빵 인부 · 쌀밥 공기 오른쪽과 아르헨티나 국기 오른쪽이 끊겼다(노란 별 둘)","fact":"트립신 — 라이신 · 아르기닌의 C 말단 쪽을 자른다","hook":"드립 = 트립신 · 쌀(라이스) · 아르헨티나(Arg)","say":"관 속 위 작업대. 빨간 멜빵 인부가 드립 주전자를 들었다. 드립, 트립신이다. 사슬은 쌀밥 공기 오른쪽에서 끊겼고, 아르헨티나 국기 오른쪽도 끊겼다. 쌀밥은 라이스, 라이신. 아르헨티나는 Arg, 아르기닌. 트립신은 이 둘의 C 말단 쪽, 오른쪽을 자른다.","box":[[1280,260,360,350],[1620,430,240,70]],"src":["s12p03#1"],"cards":["G1-103"]},{"obj":"아래 작업대 — 기모노를 입고 같은 드립 주전자를 든 여자 · 향 나는 마름모의 오른쪽이 끊겼다(노란 별)","fact":"키모트립신 — 방향족(Phe · Trp · Tyr)의 C 말단 쪽을 자른다","hook":"기모노 + 드립 = 키모트립신 · 마름모 오른쪽","say":"아래 작업대. 기모노를 입은 여자가 같은 드립 주전자를 들었다. 기모노에 트립신, 키모트립신이다. 그녀의 가위는 향 나는 마름모의 오른쪽을 잘랐다. 펩신과 같은 마름모인데 자르는 쪽이 반대다. 키모트립신은 방향족 아미노산, 페닐알라닌, 트립토판, 타이로신의 C 말단 쪽을 자른다.","box":[[1300,630,240,310],[1660,770,80,60]],"src":["s12p03#2"],"cards":["G1-104"]},{"obj":"관 왼쪽 벽 회색 상자에 돌린 열쇠 — 케이블이 위로(흰 꺾쇠) 빨간 멜빵 인부의 허리로 · 그의 허리에서 둘째 케이블이 아래로(흰 꺾쇠) 기모노 여자의 허리로","fact":"엔테로펩티데이스가 트립시노겐을 켜고 · 트립신이 나머지를 켠다","hook":"열쇠 → 트립신 → 나머지","say":"관 왼쪽 벽의 회색 상자에 열쇠가 돌아가 있다. 장벽의 엔테로펩티데이스다. 상자에서 나온 케이블은 흰 꺾쇠를 따라 위로, 빨간 멜빵 인부의 허리로만 들어간다. 트립시노겐을 트립신으로 켠다. 그리고 그의 허리에서 둘째 케이블이 흰 꺾쇠를 따라 아래로, 기모노 여자에게 간다. 나머지 효소들은 트립신이 켠다. 트립신이 마스터 스위치다.","box":[[1056,836,124,114],[1240,440,90,520]],"src":["s12p03#3"],"cards":["G1-216"]},{"obj":"관 바닥 노란 기름 웅덩이 — 큰 쟁반이 가장자리를 기름에 담그고 · 콜리가 앞발로 쟁반을 밀어 거든다","fact":"지방 소화의 핵심 효소 = 라이페이스 · 콜리페이스가 기름 표면에 붙게 돕는다","hook":"쟁반(판) = 라이페이스 · 콜리 = 콜리페이스","say":"관 바닥에 노란 기름 웅덩이. 큰 쟁반이 가장자리를 기름에 담그고, 콜리가 뒷다리로 서서 앞발로 쟁반을 밀어 거든다. 판, 라이페이스가 지방 소화의 핵심 효소다. 콜리, 콜리페이스는 담즙염이 덮은 기름방울 표면에 라이페이스가 붙게 돕는다.","box":[1440,820,600,320],"src":["s12p03#4"],"cards":["G1-115"]}]};
const $ = id => document.getElementById(id);
$('title').textContent = L.title; $('sub').textContent = L.sub || ''; document.title = L.title;
$('img').src = L.img; $('img').alt = L.title;
const ov = $('ov'); ov.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
let mode = 'tour', i = -1, playing = false, voice = true, rate = 1.0, quizOrder = [], quizPos = 0, quizRevealed = false;
const stops = L.stops;
const scoreKey = 'lesson_' + L.id;
let score = {}; try { score = JSON.parse(localStorage.getItem(scoreKey) || '{}'); } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    stops.forEach((st, k) => { if (st.box) s += rect(st.box, 'hot', ` data-k="${k}"`); });
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact));
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
let speakSeq = 0;
function speak(t) {
  const my = ++speakSeq, at = i;
  const advance = (ms) => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, ms);
  if (!('speechSynthesis' in window)) { if (playing) advance(3500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = () => { if (started) advance(700); };
  u.onerror = () => { if (!started) advance(3000); };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started && my === speakSeq) { speechSynthesis.cancel(); advance(3000); } }, 2500);  // 목소리가 없으면 글만 3초
}
function go(k) {
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) setTimeout(() => { if (playing) next(); }, 3500);
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; speechSynthesis && speechSynthesis.cancel(); $('bPlay').textContent = '▶ 시작';
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') { $('bQuiz').classList.add('on'); quizOrder = stops.map((_, k) => k).filter(k => stops[k].box); quizPos = 0; quizAsk(); }
  showScore();
}
function quizAsk() {
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">이 물건은 무엇을 나르나?</div><div class="fact muted">떠올린 뒤 「답 보기」</div>`;
  $('judge').style.display = 'flex';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); }
function judge(ok) {
  const k = quizOrder[quizPos]; score[k] = score[k] || []; score[k].push({ t: Date.now(), ok });
  try { localStorage.setItem(scoreKey, JSON.stringify(score)); } catch (e) {}
  showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  const ks = Object.keys(score); if (!ks.length) { $('score').textContent = ''; return; }
  const last = ks.map(k => score[k][score[k].length - 1].ok); const ok = last.filter(Boolean).length;
  $('score').textContent = `마지막 시험 ${ok} / ${stops.length}`;
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i + 1); else speechSynthesis && speechSynthesis.cancel(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) speechSynthesis && speechSynthesis.cancel(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
</script>
