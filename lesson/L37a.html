<style>
  :root{--ink:#1b1b1f;--ink2:#4b4b55;--line:#e3e1da;--teal:#0f766e;--teal50:#ecfdf5;--gold:#b45309;--bg:#f7f5ef}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1100px;margin:0 auto;padding:12px 14px 40px}

  .recap li b{color:var(--teal)}
  .score{font-size:13px;color:var(--ink2);margin-left:auto}
  .hint{font-size:12px;color:var(--ink2);margin-top:8px}
  .hole{fill:#000}
  .cur{fill:none;stroke:#f59e0b;stroke-width:6;stroke-dasharray:14 8}
  .hot{fill:transparent;cursor:pointer}
  .hot:hover{fill:rgba(245,158,11,.18)}
  .judge{display:none;gap:6px;margin-top:8px}
  .judge button{font-size:12.5px}
  .nav{display:flex;gap:12px;font-size:12.5px;margin:2px 0 0}
  .nav a{color:var(--teal);text-decoration:none}
  .nav a:hover{text-decoration:underline}

const L = {"id":"L37a","scene":"s37","part":"a","title":"짚 공방의 긴 작업대 — 한 가닥 짚끈이 짚단이 되기까지: 염색질 포장","sub":"천막에 안 들어가 넘치는 맨 짚끈(너무 긴 DNA) · 큰 통에 두 바퀴(뉴클레오솜 · 염색질) · 놋쇠 표 못 둘 · B자 · 못 셋 · 못 넷(H2A · H2B · H3 · H4 · 8량체) · 통 밖 집게 못 하나(H1) · ＋ 통 － 끈 · 닫힌 공구함(이온결합) · 구슬 꿴 통 → 밧줄(30 nm 섬유) · 가로대 고리(고리 단계) · 가위표 짚단(응축 염색체 · 중기)","img":"img/L37a.webp","w":2048,"h":1144,"stops":[{"obj":"헛간 다락 짚 공방의 긴 작업대 — 금빛 짚끈 한 가닥이 왼쪽 끝에서 오른쪽 끝까지 끊김 없이 이어지며 갈수록 굵고 짧게 포장된다 (틀)","fact":"DNA → 뉴클레오솜 → 30 nm 섬유 → 고리(loop) → 응축된 염색체","hook":"한 가닥 짚끈이 왼쪽에서 오른쪽으로 굵고 짧아짐 = 포장 다섯 단계","say":"헛간 다락의 짚 공방이다. 유사분열 헛간에서 본 짚단이 어떻게 만들어지는지 보는 곳이다. 긴 작업대 위로 금빛 짚끈 한 가닥이 왼쪽 끝에서 오른쪽 끝까지 끊김 없이 이어진다. 짚끈은 DNA 다. 왼쪽에서 오른쪽으로 갈수록 굵어지고 짧아진다. 맨 짚끈, 통에 감긴 짚끈, 통을 꿴 밧줄, 가로대에 걸린 고리, 그리고 짚단. 진핵세포 DNA 포장 단계의 순서, DNA, 뉴클레오솜, 30 나노미터 섬유, 고리, 응축된 염색체다. 굵기 순서가 곧 포장 순서다.","box":null,"src":["s37p01#0"],"cards":["E1-102","E1-102#1","E1-102#2","E1-102#3","E1-102#4","E1-102#5"]},{"obj":"왼쪽 끝 — 아무것에도 안 감긴 맨 짚끈을 일꾼이 작은 돔 천막 문에 쑤셔 넣지만(천막 안 끈 더미 뒤로 보라 공이 반쯤 보인다) 넘쳐서 작업대 아래 바닥까지 흘러내린다","fact":"맨 DNA 는 너무 길다(사람 세포 하나 ≈ 2 m) — 핵에 넣으려고 포장한다","hook":"천막에 안 들어가 넘치는 맨 짚끈 = 너무 긴 DNA","say":"왼쪽 끝, 아무것에도 감기지 않은 맨 짚끈을 일꾼이 작은 돔 천막에 쑤셔 넣고 있다. 덱에서 돔 천막은 언제나 핵이다. 그런데 끈이 너무 길어서 넘쳐 나오고, 작업대 아래 바닥까지 흘러내려 수북이 쌓였다. 맨 DNA 는 이렇게 너무 길다. 사람 세포 하나의 DNA 를 이으면 2 미터가 넘는다. 이것을 핵 안에 넣으려니 여러 단계로 접어 포장해야 한다. 길어서 접는다, 이것이 포장의 이유 전부다.","box":[[50,420,520,400],[100,810,470,320]],"src":["s37p01#1"],"cards":["E1-98"]},{"obj":"가운데 큰 나무 통과 그 배에 감긴 짚끈 — 통과 끈이 한 덩이","fact":"염색질(chromatin) = DNA 와 단백질(히스톤)의 복합체","hook":"통 + 감긴 끈 한 덩이 = 염색질","say":"가운데 커다란 나무 통에 짚끈이 감겨 한 덩이가 되었다. 통은 히스톤 단백질이다. 짚끈만도 아니고 통만도 아니다. DNA 와 단백질, 히스톤이 함께 있는 이 복합체를 염색질이라 부른다. 이 염색질이 응축하면 염색체가 된다.","box":[[585,290,410,510]],"src":["s37p01#2"],"cards":["E1-99","A0-49"]},{"obj":"짚끈이 큰 통의 배를 정확히 두 바퀴 감았다","fact":"뉴클레오솜 — 염색질 포장의 기본 단위 · 히스톤 주위에 DNA 가 감긴 구조","hook":"통에 두 바퀴 = 뉴클레오솜","say":"짚끈이 통의 배를 정확히 두 바퀴 감았다. 통 하나에 끈이 감긴 이 단위가 뉴클레오솜이다. 히스톤 단백질 주위에 DNA 가 감긴 구조이고, 염색질 포장의 기본 단위다. 실제로 DNA 는 히스톤 덩이를 두 바퀴 가까이 감는다.","box":[[585,610,410,70]],"src":["s37p01#3"],"cards":["E1-100","E1-101","F1-52"]},{"obj":"큰 통 앞면이 넷으로 나뉘어 놋쇠 표가 하나씩 — 왼쪽부터 못 둘 · 오른쪽에 볼록이 둘 붙은 세로 막대(B자) · 못 셋 · 못 넷","fact":"H2A · H2B · H3 · H4 — 넷이 둘씩 모여 히스톤 8량체 · A · B 는 2 에만 붙는다","hook":"못 둘 · B자 · 못 셋 · 못 넷 = H2A · H2B · H3 · H4","say":"통 앞면은 넷으로 나뉘었고, 칸마다 놋쇠 표가 하나씩 붙었다. 왼쪽부터 못 둘, 볼록이 둘 붙은 세로 막대, 못 셋, 못 넷. 못의 개수가 히스톤 번호다. 2 가 둘이라 A 와 B 로 갈린다. 오른쪽 것은 볼록이 둘인 B 자 모양이라 H2B, 그러면 왼쪽이 H2A 다. 그다음이 H3, H4. A 와 B 는 2 에만 붙는다. H3A 같은 것은 없다. 시험이 노리는 함정이다. 이 넷이 각각 둘씩 모여 히스톤 8량체를 이루고, DNA 가 그 8량체를 감싼다.","box":[[625,510,330,125]],"src":["s37p01#4"],"cards":["E1-107#2","E1-107#3","E1-107#4","E1-107#5","F1-153"]},{"obj":"짚끈이 통을 떠나 내려가는 목을 잡은 작은 쇠 집게 — 통 밖에 따로 있고 놋쇠 못이 하나","fact":"H1 — 8량체 밖 · 뉴클레오솜 사이 연결부(linker)에 붙어 더 높은 차원으로 응축","hook":"통 밖 목 잡은 집게 · 못 하나 = H1","say":"짚끈이 통을 떠나 내려가는 목을 작은 쇠 집게가 꽉 잡았다. 집게는 통에 속하지 않고 밖에 따로 있으며, 놋쇠 못이 하나뿐이다. 다섯째 히스톤, H1 이다. 못 하나가 1 이고, 통 밖에 있는 것이 8량체에 끼지 않는다는 뜻이다. H1 은 뉴클레오솜 사이의 연결부 DNA 에 붙어 염색질을 더 높은 차원으로 응축시킨다. 그래서 히스톤은 모두 다섯 종류, H1, H2A, H2B, H3, H4 다.","box":[[950,725,60,60]],"src":["s37p01#5"],"cards":["E1-108","E1-107","E1-107#1"]},{"obj":"큰 통 겉에는 ＋ 가 줄지어, 감긴 짚끈에는 짧은 － 가 새겨졌다 · 작업대 아래 바닥에 뚜껑 닫힌 빨간 공구함과 그 위 풀단지 — 쓰지 않았다","fact":"이온결합(정전기적 인력) — 공유결합 아님 · 히스톤 양전하(Lys · Arg) ↔ DNA 음전하","hook":"통의 ＋ · 끈의 － = 이온결합 · 닫힌 공구함과 풀 = 공유결합 아님","say":"통 겉에는 플러스가 줄지어, 감긴 짚끈에는 짧은 마이너스가 새겨졌다. 끈은 못도 풀도 없이 통에 착 달라붙어 있다. 작업대 아래에는 뚜껑 닫힌 빨간 공구함과 풀단지가 쓰이지 않은 채 놓여 있다. 히스톤과 DNA 의 결합은 이온결합, 정전기적 인력이다. 공유결합이 아니다. 히스톤에는 라이신과 아르지닌 같은 염기성 아미노산이 많아 양전하를 띠고, DNA 는 인산 때문에 음전하를 띠니 서로 끌어당긴다.","box":[[585,290,410,510],[655,905,290,205]],"src":["s37p01#6"],"cards":["E1-103","E1-104","E1-105"]},{"obj":"오른쪽으로 — 작은 통 다섯이 짚끈에 구슬처럼 꿰였고(통마다 끈이 감김) 그 끝에서 끈이 굵은 밧줄로 꼬였다","fact":"30 nm 섬유 — 뉴클레오솜이 구슬처럼 꿰인 채 더 굵게 꼬인 것","hook":"구슬 꿴 통 → 꼬인 굵은 밧줄 = 30 nm 섬유","say":"큰 통 오른쪽으로 작은 통 다섯이 짚끈에 구슬처럼 꿰였다. 통마다 끈이 감겨 있다. 뉴클레오솜이 줄줄이 꿰인 모습이다. 그 끝에서 끈이 비틀려 굵은 밧줄이 되었다. 뉴클레오솜 줄이 더 굵게 꼬여 접힌 것, 30 나노미터 섬유다.","box":[[1020,690,450,110]],"src":["s37p01#7"],"cards":[]},{"obj":"그 굵은 밧줄이 작업대 위 나무 가로대에 크게 늘어진 고리로 여러 번 걸렸다","fact":"고리(loop) 단계 — 30 nm 섬유가 단백질 축(뼈대)에 고리로 붙잡힌다","hook":"가로대에 걸린 큰 고리 = 고리 단계 · 가로대 = 단백질 축","say":"굵은 밧줄은 작업대 위 나무 가로대에 크게 늘어진 고리로 여러 번 걸렸다. 고리 단계다. 30 나노미터 섬유가 단백질로 된 축, 곧 뼈대에 고리 모양으로 붙잡혀 정리된다. 가로대가 그 단백질 축이다.","box":[[1350,355,440,430]],"src":["s37p01#8"],"cards":[]},{"obj":"오른쪽 끝 — 고리가 모여 단단히 묶인 짧고 굵은 가위표 짚단","fact":"응축된 염색체 — 가장 강하게 응축돼 관찰이 쉬운 때는 유사분열 중기","hook":"가위표 짚단 = 응축된 염색체 · 중기","say":"오른쪽 끝, 고리들이 모여 단단히 묶이면서 짧고 굵은 가위표 짚단이 되었다. 유사분열 헛간에서 본 바로 그 짚단, 응축된 염색체다. 진핵세포의 DNA 는 핵 안에서 이렇게 염색체로 응축되어 있다. 가장 강하게 응축되어 현미경으로 보기 쉬운 때는 유사분열 중기다. 가운데 줄에 짚단이 늘어서던 그 칸이다.","box":[[1785,525,225,280]],"src":["s37p01#9"],"cards":["E1-113","D0-7"]}],"hubPanel":"s37p01"};

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);

  } else if (mode === 'review') {

}

}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact));
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
let speakSeq = 0;
function speak(t) {
  const my = ++speakSeq, at = i;
  const advance = (ms) => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, ms);
  if (!('speechSynthesis' in window)) { if (playing) advance(3500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = () => { if (started) advance(700); };
  u.onerror = () => { if (!started) advance(3000); };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started && my === speakSeq) { speechSynthesis.cancel(); advance(3000); } }, 2500);  // 목소리가 없으면 글만 3초
}
function go(k) {
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) setTimeout(() => { if (playing) next(); }, 3500);
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; speechSynthesis && speechSynthesis.cancel(); $('bPlay').textContent = '▶ 시작';
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') { $('bQuiz').classList.add('on'); quizOrder = stops.map((_, k) => k).filter(k => stops[k].box); quizPos = 0; quizAsk(); }
  showScore();
}
function quizAsk() {
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">이 물건은 무엇을 나르나?</div><div class="fact muted">떠올린 뒤 「답 보기」</div>`;
  $('judge').style.display = 'flex';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); }
function judge(ok) {
  const k = quizOrder[quizPos]; score[k] = score[k] || []; score[k].push({ t: Date.now(), ok });
  try { localStorage.setItem(scoreKey, JSON.stringify(score)); } catch (e) {}
  showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  const ks = Object.keys(score); if (!ks.length) { $('score').textContent = ''; return; }
  const last = ks.map(k => score[k][score[k].length - 1].ok); const ok = last.filter(Boolean).length;
  $('score').textContent = `마지막 시험 ${ok} / ${stops.length}`;
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i + 1); else speechSynthesis && speechSynthesis.cancel(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) speechSynthesis && speechSynthesis.cancel(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
</script>
