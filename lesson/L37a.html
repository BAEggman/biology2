<script>
const L = {"id":"L37a","scene":"s37","part":"a","title":"짚 공방의 긴 작업대 — 한 가닥 짚끈이 짚단이 되기까지: 염색질 포장","sub":"천막에 안 들어가 넘치는 맨 짚끈(너무 긴 DNA) · 큰 통에 두 바퀴(뉴클레오솜 · 염색질) · 놋쇠 표 못 둘 · B자 · 못 셋 · 못 넷(H2A · H2B · H3 · H4 · 8량체) · 통 밖 집게 못 하나(H1) · ＋ 통 － 끈 · 닫힌 공구함(이온결합) · 구슬 꿴 통 → 밧줄(30 nm 섬유) · 가로대 고리(고리 단계) · 가위표 짚단(응축 염색체 · 중기)","img":"img/L37a.webp?v=ea8ecb344831","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"헛간 다락 짚 공방의 긴 작업대 — 금빛 짚끈 한 가닥이 왼쪽 끝에서 오른쪽 끝까지 끊김 없이 이어지며 갈수록 굵고 짧게 포장된다 (틀)","fact":"DNA → 뉴클레오솜 → 30 nm 섬유 → 고리(loop) → 응축된 염색체","hook":"한 가닥 짚끈이 왼쪽에서 오른쪽으로 굵고 짧아짐 = 포장 다섯 단계","say":"유사분열 헛간의 짚단이 만들어지는 과정을 보러 다락의 짚 공방에 왔다. 긴 작업대 위에서는 금빛 짚끈이 왼쪽 끝부터 오른쪽 끝까지 끊기지 않고 이어진다. 이 끈은 DNA이며, 부모에게서 자손으로 전달되는 유전의 단위인 유전자는 끈의 한 구간이다. 항구의 금빛 꼰 밧줄이나 공사장의 지퍼로 표현했던 DNA를 여기서는 짚끈으로 나타냈다. 오른쪽으로 갈수록 끈이 굵고 짧아지는 과정을 보자. 맨 짚끈, 통에 감긴 끈, 통을 꿴 밧줄, 가로대의 고리, 마지막 짚단이다. 진핵세포의 포장 순서인 DNA, 뉴클레오솜, 30 나노미터 섬유, 고리, 응축된 염색체와 대응한다. 굵어지는 순서가 포장 단계의 순서다.","box":null,"src":["s37p01#0"],"cards":["E1-102","E1-102#1","E1-102#2","E1-102#3","E1-102#4","E1-102#5","D0-1"]},{"sid":"s2","obj":"왼쪽 끝 — 아무것에도 안 감긴 맨 짚끈을 일꾼이 작은 돔 천막 문에 쑤셔 넣지만(천막 안 끈 더미 뒤로 보라 공이 반쯤 보인다) 넘쳐서 작업대 아래 바닥까지 흘러내린다","fact":"맨 DNA 는 너무 길다(사람 세포 하나 ≈ 2 m) — 핵에 넣으려고 포장한다","hook":"천막에 안 들어가 넘치는 맨 짚끈 = 너무 긴 DNA","say":"왼쪽 끝의 일꾼이 아무것에도 감기지 않은 짚끈을 작은 돔 천막 안으로 밀어 넣는다. 이 덱에서 돔 천막은 언제나 핵이다. 하지만 끈이 너무 길어서 밖으로 넘치고 작업대 아래 바닥까지 쌓였다. 사람 세포 하나의 DNA를 이으면 2 미터가 넘는다. 이 긴 DNA를 핵에 넣기 위해 여러 단계로 접어 포장하는 것이다. 너무 길어서 접는다는 점이 포장의 첫 번째 이유다.","box":[[50,420,520,400],[100,810,470,320]],"src":["s37p01#1"],"cards":["E1-98"]},{"sid":"s3","obj":"가운데 큰 나무 통과 그 배에 감긴 짚끈 — 통과 끈이 한 덩이","fact":"염색질(chromatin) = DNA 와 단백질(히스톤)의 복합체","hook":"통 + 감긴 끈 한 덩이 = 염색질","say":"가운데의 커다란 나무 통에는 짚끈이 감겨 한 덩어리를 이룬다. 통은 히스톤 단백질이다. 끈만이나 통만이 아니라 DNA와 히스톤 같은 단백질이 함께 이루는 복합체를 염색질이라고 한다. 염색질이 응축하면 염색체가 된다.","box":[[585,290,410,510]],"src":["s37p01#2"],"cards":["E1-99","A0-49"]},{"sid":"s4","obj":"짚끈이 큰 통의 배를 정확히 두 바퀴 감았다","fact":"뉴클레오솜 — 염색질 포장의 기본 단위 · 히스톤 주위에 DNA 가 감긴 구조","hook":"통에 두 바퀴 = 뉴클레오솜","say":"짚끈이 통의 배를 두 바퀴 감은 모습을 보자. 통 하나와 그 주위를 감싼 끈을 합친 단위가 뉴클레오솜이다. DNA가 히스톤 단백질 주위에 감긴 구조로, 염색질 포장의 기본 단위다. 실제 DNA는 히스톤 덩이를 두 바퀴 가까이 감는다.","box":[[585,610,410,70]],"src":["s37p01#3"],"cards":["E1-100","E1-101","F1-52"]},{"sid":"s5","obj":"큰 통 앞면이 넷으로 나뉘어 놋쇠 표가 하나씩 — 왼쪽부터 못 둘 · 오른쪽에 볼록이 둘 붙은 세로 막대(B자) · 못 셋 · 못 넷","fact":"H2A · H2B · H3 · H4 — 넷이 둘씩 모여 히스톤 8량체 · A · B 는 2 에만 붙는다","hook":"못 둘 · B자 · 못 셋 · 못 넷 = H2A · H2B · H3 · H4","say":"통 앞면의 네 칸에는 놋쇠 표가 하나씩 붙어 있다. 왼쪽부터 못 둘, 볼록한 부분 둘이 있는 세로 막대, 못 셋, 못 넷이다. 못의 개수는 히스톤 번호다. 첫째의 못 둘과 둘째의 볼록 둘은 모두 H2이며, 둘을 A와 B로 구분한다. 볼록한 부분 둘이 있는 둘째 표는 B 자라서 H2B, 첫째 표는 H2A이다. 뒤의 두 표는 H3와 H4이다. 이 네 종류에서 A와 B는 2에만 붙고 H3A 같은 이름은 없다는 구별로 기억하자. 네 종류가 각각 두 개씩 모여 히스톤 8량체를 이루며, DNA가 그 주위를 감는다.","box":[[625,510,330,125]],"src":["s37p01#4"],"cards":["E1-107#2","E1-107#3","E1-107#4","E1-107#5","F1-153"]},{"sid":"s6","obj":"짚끈이 통을 떠나 내려가는 목을 잡은 작은 쇠 집게 — 통 밖에 따로 있고 놋쇠 못이 하나","fact":"H1 — 8량체 밖 · 뉴클레오솜 사이 연결부(linker)에 붙어 더 높은 차원으로 응축","hook":"통 밖 목 잡은 집게 · 못 하나 = H1","say":"짚끈이 통을 떠나는 목 부분을 작은 쇠 집게가 잡고 있다. 집게는 통 바깥에 따로 있고 놋쇠 못이 하나뿐이다. 다섯 번째 히스톤인 H1이다. 못 하나가 1을, 통 밖의 위치가 히스톤 8량체에 포함되지 않음을 나타낸다. H1은 뉴클레오솜 사이의 연결부 DNA에 결합해 더 높은 단계의 염색질 응축을 돕는다. 히스톤은 모두 다섯 종류이므로 H1, H2A, H2B, H3, H4로 정리하자.","box":[[950,725,60,60]],"src":["s37p01#5"],"cards":["E1-108","E1-107","E1-107#1"]},{"sid":"s7","obj":"큰 통 겉에는 ＋ 가 줄지어, 감긴 짚끈에는 짧은 － 가 새겨졌다 · 작업대 아래 바닥에 뚜껑 닫힌 빨간 공구함과 그 위 풀단지 — 쓰지 않았다","fact":"이온결합(정전기적 인력) — 공유결합 아님 · 히스톤 양전하(Lys · Arg) ↔ DNA 음전하","hook":"통의 ＋ · 끈의 － = 이온결합 · 닫힌 공구함과 풀 = 공유결합 아님","say":"통 겉에는 플러스 표시가, 감긴 짚끈에는 짧은 마이너스 표시가 있다. 끈은 망치나 풀을 쓰지 않아도 통에 붙어 있다. 작업대 아래의 빨간 공구함과 풀단지는 닫힌 채 쓰이지 않는다. 히스톤과 DNA의 결합은 공유결합이 아니라 이온결합, 정전기적 인력이다. 히스톤에는 라이신과 아르지닌 같은 염기성 아미노산이 많아 양전하를 띠고, DNA는 인산 때문에 음전하를 띠므로 서로 끌어당긴다.","box":[[585,290,410,510],[655,905,290,205]],"src":["s37p01#6"],"cards":["E1-103","E1-104","E1-105"]},{"sid":"s8","obj":"오른쪽으로 — 작은 통 다섯이 짚끈에 구슬처럼 꿰였고(통마다 끈이 감김) 그 끝에서 끈이 굵은 금빛 밧줄로 꼬였다","fact":"30 nm 섬유 — 뉴클레오솜이 구슬처럼 꿰인 채 더 굵게 꼬인 것","hook":"구슬 꿴 통 → 꼬인 굵은 금빛 밧줄 = 30 nm 섬유","say":"큰 통 오른쪽에서는 작은 통 다섯이 짚끈에 구슬처럼 이어져 있고, 각 통에 끈이 감겨 있다. 뉴클레오솜이 줄지은 모습이다. 이어지는 끝에서 끈이 꼬여 굵은 금빛 밧줄이 된다. 이 밧줄도 DNA이며, 동원체 걸쇠에 매였던 삼밧줄 방추사와는 다르다. 뉴클레오솜 줄이 더 굵게 꼬이고 접힌 것이 30 나노미터 섬유다. 살아 있는 세포에서 언제나 이 굵기의 구조를 이루는지는 논란이 있지만, 시험에서 묻는 포장 순서는 이 단계로 연결해 기억한다.","box":[[1020,690,450,110]],"src":["s37p01#7"],"cards":[]},{"sid":"s9","obj":"그 굵은 밧줄이 작업대 위 나무 가로대에 크게 늘어진 고리로 여러 번 걸렸다","fact":"고리(loop) 단계 — 30 nm 섬유가 단백질 축(뼈대)에 고리로 붙잡힌다","hook":"가로대에 걸린 큰 고리 = 고리 단계 · 가로대 = 단백질 축","say":"굵은 밧줄이 작업대 위의 나무 가로대에 큰 고리 여러 개로 걸려 있다. 고리 단계다. 30 나노미터 섬유가 단백질 축, 즉 뼈대에 고리 모양으로 고정되어 정리된다. 가로대가 그 단백질 축이다. 고리를 모으고 조여 응축을 주도하는 단백질은 콘덴신이다.","box":[[1350,355,440,430]],"src":["s37p01#8"],"cards":["C1-106"]},{"sid":"s10","obj":"오른쪽 끝 — 고리가 모여 단단히 묶인 짧고 굵은 가위표 짚단","fact":"응축된 염색체 — 가장 강하게 응축돼 관찰이 쉬운 때는 유사분열 중기","hook":"가위표 짚단 = 응축된 염색체 · 중기","say":"오른쪽 끝에서는 고리들이 모여 단단히 묶이면서 짧고 굵은 가위표 짚단이 된다. 유사분열 헛간에서 보았던 응축된 염색체다. 짚단 하나에 해당하는 염색체 하나에는 수백에서 수천 개의 유전자가 들어 있다. 진핵세포의 DNA는 핵 안에서 단백질과 함께 염색체를 이루며 응축된다. 염색체 자체를 감싸는 막은 없으므로 무막 구조다. 다만 간기에는 훨씬 느슨하게 풀려 있고, 이렇게 가위표 모양으로 단단히 응축된 모습은 분열할 때만 나타난다. 가장 강하게 응축되어 현미경으로 보기 쉬운 시기는 유사분열 중기다. 헛간 가운데 줄에 짚단이 늘어섰던 칸과 연결하자.","box":[[1785,525,225,280]],"src":["s37p01#9"],"cards":["E1-113","D0-7","D0-8","A0-40"]}],"cq":{"E1-102":["진핵세포 DNA 포장 단계 순서는?","DNA→뉴클레오솜→30nm 섬유→고리(loop)→응축된 염색체"],"E1-102#1":["진핵세포 DNA 포장 단계 순서는?","DNA"],"E1-102#2":["진핵세포 DNA 포장 단계 순서는?","뉴클레오솜"],"E1-102#3":["진핵세포 DNA 포장 단계 순서는?","30nm 섬유"],"E1-102#4":["진핵세포 DNA 포장 단계 순서는?","고리(loop)"],"E1-102#5":["진핵세포 DNA 포장 단계 순서는?","응축된 염색체"],"D0-1":["부모가 자손에게 물려주는 유전단위의 명칭은?","유전자(gene)"],"E1-98":["진핵세포 DNA가 여러 단계로 포장되어야 하는 이유는?","DNA가 매우 길어 핵 안에 들어가기 위해"],"E1-99":["DNA와 단백질의 복합체를 뭐라 하는가?","염색질(chromatin)"],"A0-49":["염색체/염색질의 구성?","DNA와 단백질(히스톤)의 복합체 = 염색질, 염색질이 염색체를 이룸"],"E1-100":["염색질 포장의 기본 단위는?","뉴클레오솜(nucleosome)"],"E1-101":["뉴클레오솜의 구조는?","히스톤 단백질 주위에 DNA가 감긴 구조"],"F1-52":["뉴클레오솜은 무엇으로 이루어지는가?","DNA와 히스톤 단백질"],"E1-107#2":["히스톤의 종류 다섯 가지는?","H2A"],"E1-107#3":["히스톤의 종류 다섯 가지는?","H2B"],"E1-107#4":["히스톤의 종류 다섯 가지는?","H3"],"E1-107#5":["히스톤의 종류 다섯 가지는?","H4"],"F1-153":["뉴클레오솜의 구조를 정확히 쓰면?","DNA가 히스톤 8량체(팔량체)를 감싼 구조"],"E1-108":["H1 히스톤의 역할은?","뉴클레오솜 사이 연결부(linker)에 결합해 더 높은 차원으로 응축"],"E1-107":["히스톤의 종류 다섯 가지는?","H1 · H2A · H2B · H3 · H4"],"E1-107#1":["히스톤의 종류 다섯 가지는?","H1"],"E1-103":["히스톤이 DNA와 잘 결합하는 이유는?","양전하 아미노산(Lys·Arg)이 풍부해 음전하 DNA와 결합"],"E1-104":["진핵세포의 히스톤은 양전하인가 음전하인가?","양전하(염기성 아미노산)"],"E1-105":["히스톤과 DNA의 결합 종류는? (공유결합 주의)","이온결합(정전기적 인력)"],"C1-106":["염색체 응축을 주도하는 단백질은?","콘덴신 (Condensin)"],"E1-113":["염색체가 가장 강하게 응축되어 관찰이 쉬운 시기는?","유사분열 중기"],"D0-7":["진핵세포의 DNA는 핵 안에서 무엇으로 응축되어 존재하는가?","염색체"],"D0-8":["한 염색체에 포함될 수 있는 것은?","수백~수천 개의 유전자"],"A0-40":["염색체의 막 구조 분류?","무막(막없음)"]},"hubPanel":"s37p01"};

let mode = 'tour', i = -1, playing = false, voice = true, rate = 1.0, quizOrder = [], quizPos = 0, quizRevealed = false, shuffle = false, sess = null;
const stops = L.stops;
subShow();
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID
const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact), st.sid);
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate, auto:playing && mode === 'tour',
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate, auto:true,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
</html>
