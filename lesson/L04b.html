<script>
const L = {"id":"L04b","scene":"s04","part":"b","title":"부두 마을 두 거리 — 맨흙과 반만 깐 판석 (무체강 · 위체강)","sub":"바닥 = 체강의 안감 · 스펀지 정수장(해면 · 유입공/출수공) · 깃 칼라(깃세포) · 문 하나(위수강) · 독침 자판기(자포낭) · 다리미와 불꽃(편형 · 불꽃세포) · 위쪽만 판석(위체강) · 수레바퀴 오두막(윤형) · 껍질 벗기(탈피) · 막힌 파이프 셋(선충 순환계 없음) · 양끝 뾰족 원통","img":"img/L04b.webp?v=d2ceea134a5b","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"부두 마을 한 거리 — 왼쪽 구역은 맨흙 · 오른쪽 구역은 위쪽만 판석","fact":"바닥은 체강의 안감 — 맨흙(무) · 위쪽만 판석(위) · 온 바닥 대리석(진)","hook":"바닥을 보면 체강을 안다","say":"부두 마을 한 거리의 두 구역을 보자. 왼쪽은 아무것도 깔지 않은 맨흙이고, 오른쪽은 위쪽의 먼 바닥에만 돌판이 깔려 있다. 이 거리에서 바닥의 안감은 체강과 연결한다. 맨흙은 무체강, 위쪽만 깐 판석은 위체강, 다음 과에서 볼 온 바닥의 대리석은 진체강이다. 바닥으로 세 구역을 구분하되, 이것만으로 계통까지 나누지는 말자. 체강은 진화 과정에서 여러 번 독립적으로 생기고 사라졌기 때문이다.","box":null,"src":["s04p01#0","s04p02#0"],"cards":["S-AN-4","N0-14#2","N0-14","X-AN-7","N0-16"]},{"sid":"s2","obj":"왼쪽 거리 — 아무것도 깔지 않은 맨흙","fact":"무체강 — 몸 안에 빈 곳이 없다(편형) · 해면 · 자포도 체강이 없다(시험은 함께 묶기도)","hook":"맨흙 = 안감도 빈 곳도 없음","say":"맨흙으로 된 왼쪽 거리는 무체강을 나타낸다. 몸 안에 체강이라는 빈 공간이 없다. 엄밀하게는 삼배엽인 편형동물에 무체강이라는 이름을 사용한다. 같은 맨흙 위의 해면동물과 자포동물은 체강을 따질 자리 자체가 없어 이와 구별한다. 다만 모두 체강이 없다는 공통점이 있으므로, 시험에서 해면과 자포까지 무체강동물로 묶어 묻는다면 함께 고른다.","box":[0,780,1010,364],"src":["s04p01#0"],"cards":["S-AN-4"]},{"sid":"s3","obj":"벽도 지붕도 없는 노천 정수장 — 큰 노란 스펀지 · 옆구리 작은 구멍으로 스며들어 꼭대기 큰 구멍 하나로 솟는다","fact":"해면 — 진정한 조직 없음 · 가장 밑에서 갈라짐 · 유입공 여럿 → 출수공 하나","hook":"꼭대기로 물을 뿜는 스펀지 = 해면 · 벽 없음 = 조직 없음 · 작은 구멍 들어가 큰 구멍 하나로","say":"왼쪽 끝 정수장에는 벽도 지붕도 없다. 가운데에는 구멍이 숭숭 뚫린 커다란 노란 부엌 스펀지가 서 있다. 옆구리로 부은 물이 작은 구멍들로 스며든 뒤 꼭대기의 큰 구멍 하나로 솟아난다. 스펀지는 곧 해면이라는 이름의 단서다. 벽과 지붕이 없는 모습은 진정한 조직이 없다는 뜻이며, 그래서 해면을 측생동물로 따로 부른다. 동물에서 가장 밑에서 갈라진 무리다. 작은 유입공으로 들어온 물은 큰 출수공으로 나간다. 몸 안에서는 변형세포가 이동하며 양분을 나르고, 뼈대인 골편과 해면질을 만든다. 동물 계통수 밑부분의 세 갈래도 연결하자. 조직이 없는 해면, 2배엽 방사대칭인 자포, 3배엽인 좌우대칭동물이다. 조직을 가진 나머지 동물 전체를 진정후생동물이라고 한다.","box":[0,30,430,920],"src":["s04p01#1"],"cards":["N1-1","N1-1#1","N0-23","X-AN-10","S-AN-1","N0-24","N1-2"]},{"sid":"s4","obj":"물 붓는 일꾼의 목에 두른 커다란 깃 칼라","fact":"깃세포 — 편모로 물살을 만들고 깃으로 먹이를 걸러 먹는다(여과섭식)","hook":"깃 = 깃세포","say":"스펀지에 물을 붓는 일꾼의 목에 커다란 주름 깃 칼라가 있다. 이 깃에서 깃세포를 떠올리자. 깃세포는 편모로 물을 끌어들여 물살을 만들고, 깃으로 세균과 먹이 알갱이를 걸러 삼킨다. 여과섭식이다. 이 세포와 닮은 홑세포 원생생물이 깃편모충이다. 동물과 가장 가까운 원생생물 친척이며, 깃편모충·동물·균류를 함께 오피스토콘타로 묶는다.","box":[[15,470,150,130]],"src":["s04p01#2"],"cards":["N1-1","N1-1#2","S-AN-5","L1-24","X-EV-12","N0-8"]},{"sid":"s5","obj":"두 오두막(자판기 · 다리미) 다 문이 앞에 하나뿐 · 뒷벽은 막혀 있다","fact":"위수강 — 입이 곧 항문(자포 · 편형) · 문이 하나","hook":"문 하나 = 들어온 데로 나간다","say":"맨흙 거리의 자판기 오두막과 다리미 오두막을 함께 보자. 두 곳 모두 앞쪽 출입구가 하나뿐이고 뒷벽은 막혀 있다. 들어온 곳으로 다시 나가는 위수강, 즉 입과 항문이 같은 구조를 나타낸다. 자판기 오두막의 자포동물과 다리미 오두막의 편형동물에 공통되는 특징이다.","box":[300,110,740,700],"src":["s04p01#3"],"cards":["N1-5","N1-4"]},{"sid":"s6","obj":"첫 오두막의 자판기 — 투입구에서 긴 독침이 튀어나온다","fact":"자포낭 — 자포세포 속 독침 · 쏘아서 먹이를 잡는다 · 자포동물의 진단 형질","hook":"독침 자판기 = 자포","say":"첫 오두막 안의 자판기가 긴 독침을 뱉어 낸다. 독침을 쏘는 자판기는 자포낭과 연결한다. 자포낭은 촉수의 자포세포 안에 있는 독침 주머니로, 자극을 받으면 독침을 발사해 먹이를 잡는다. 자포동물을 구분하는 진단 형질이다.","box":[[500,410,275,340]],"src":["s04p01#4"],"cards":["N1-5"]},{"sid":"s7","obj":"다리미 오두막 바닥 — 다리미판 아래 너울거리는 불꽃","fact":"불꽃세포(원신관) — 편형의 배설기관(주로 삼투조절) · 환형 · 연체는 후신관","hook":"다리미 데우는 불 = 불꽃세포","say":"다리미 오두막 바닥의 불꽃이 너울거리며 다리미를 데우고 있다. 이 불꽃은 편형동물의 배설기관인 불꽃세포, 원신관의 단서다. 원신관은 주로 남는 물을 배출하는 삼투조절을 담당한다. 섬모 다발이 불꽃처럼 움직이며 노폐물을 관으로 밀어내므로 불꽃세포라는 이름이 붙었다. 다리미를 데우는 불꽃을 편형동물의 불꽃세포로 연결하자. 배설기관으로 구분하면 편형동물은 불꽃세포, 환형동물과 연체동물은 후신관이다.","box":[[800,548,150,147]],"src":["s04p01#5"],"cards":["S-AN-9","N1-11","H1-190#1","X-AN-14"]},{"sid":"s8","obj":"다리미판 위에 다리미를 미는 사람","fact":"편형 — 납작하게 편다","hook":"다리미질 = 납작 = 편형","say":"다리미 오두막에서는 한 사람이 다리미판 위에서 다리미를 밀고 있다. 납작하게 펴는 동작에서 편형동물의 납작한 몸을 떠올리자.","box":[780,380,190,240],"src":["s04p01#6"],"cards":["X-AN-8"]},{"sid":"s9","obj":"오른쪽 거리 — 위쪽 먼 쪽에만 판석 · 아래는 맨흙","fact":"위체강 — 중배엽과 내배엽 사이 · 한쪽만 안감 · 선충 · 윤형","hook":"반만 깐 안감 = 위체강","say":"오른쪽 거리에는 위쪽의 먼 바닥에만 돌판이 있고 아래쪽은 맨흙이다. 안감을 반만 댄 모습이 위체강이다. 체강이 없는 것이 아니라, 중배엽이 안팎을 모두 둘러싸지 못해 중배엽과 내배엽 사이에 빈 공간이 있다. 이 거리에 등장하는 선충과 윤형동물이 그 예다.","box":[1050,90,990,1040],"src":["s04p02#0"],"cards":["N0-14#2","N0-14","S-AN-4","X-AN-7"]},{"sid":"s10","obj":"문 위의 수레바퀴 · 앞문이 활짝 열려 뒷문 너머 빛이 보인다","fact":"윤형동물 — 위체강 · 입과 항문이 다 있는 완전 소화관","hook":"수레바퀴 = 윤형 · 앞문과 뒷문 = 입과 항문","say":"오른쪽 첫 오두막의 문 위에 수레바퀴가 달려 있다. 윤형의 ‘윤’은 바퀴 윤 자이므로 수레바퀴를 윤형동물과 연결하자. 열린 앞문 너머로 뒷문까지 뚫려 빛이 보인다. 위체강을 가지며 입과 항문이 모두 있는 완전 소화관을 뜻한다. 이 거리의 문은 소화관의 구멍이다. 왼쪽 오두막은 문이 하나였지만, 이 오두막은 앞문과 뒷문이 따로 있다.","box":[1120,140,500,660],"src":["s04p02#1"],"cards":[]},{"sid":"s11","obj":"머리 위로 제 껍질을 통째로 벗는 사람","fact":"탈피동물 — 큐티클을 벗는다 · 선충 + 절지 / 촉수담륜동물 — 윤형 · 편형 · 연체 · 환형","hook":"껍질 벗기 = 탈피","say":"오른쪽 둘째 오두막 옆의 사람이 스웨터를 벗듯 껍질을 머리 위로 통째로 벗고 있다. 큐티클을 벗는 탈피동물의 단서다. 선충과 절지동물이 탈피동물에 속하며, 수레바퀴로 나타낸 윤형동물은 여기에 속하지 않는다. 윤형·편형동물과 다음 과의 연체·환형동물은 탈피하지 않는 촉수담륜동물로 묶는다. 선구동물의 두 갈래를 구분할 때는 탈피동물의 큐티클 탈피, 촉수담륜동물의 담륜자 유생과 촉수관을 연결하자.","box":[1760,570,270,530],"src":["s04p02#2"],"cards":["N0-25#3","N0-26","X-AN-16","N1-22#3","N1-21","S-AN-2"]},{"sid":"s12","obj":"오른쪽 둘째 오두막 벽에 박힌 짧은 쇠 파이프 셋 — 저마다 바깥 끝이 갈색 마개로 꽉 막혔다","fact":"선충 — 순환계가 아예 없다","hook":"막힌 관 셋 = 순환계 없음","say":"오른쪽 둘째 오두막 벽에는 짧은 쇠 파이프 셋이 박혀 있다. 바깥쪽 끝마다 짙은 갈색 마개가 단단히 막고 있다. 열린 굴뚝이나 대포가 아니라, 아무것도 흐를 수 없는 막힌 관이다. 이 모습에서 선충에는 순환계가 없다는 점을 떠올리자.","box":[1540,530,180,310],"src":["s04p02#3"],"cards":["X-AN-13","S-AN-8","N1-22#4"]},{"sid":"s13","obj":"오른쪽 둘째 오두막 앞에 누운 긴 원통 파이프 — 양 끝이 뾰족하게 좁아진다","fact":"선충 — 원통형 · 양 끝 뾰족 · 종단근만 · 회충 · 요충 · C. elegans","hook":"양끝 뾰족 원통 = 선충 몸","say":"같은 오두막 앞 바닥에 놓인 긴 원통 파이프를 보자. 양 끝이 뾰족하게 좁아지는 선충의 몸 모양이다. 선충의 몸벽에는 세로로 뻗은 종단근만 있으므로 몸을 채찍질하듯 휘두르며 움직인다. 회충, 요충, 예쁜꼬마선충 씨 엘레간스가 모두 이 무리에 속한다.","box":[[1405,790,355,265]],"src":["s04p02#4"],"cards":["N1-22#2","N1-23"]}],"cq":{"S-AN-4":["체강 3형(무·위·진)과 각 대표 무리 격자는?","무체강=편형 / 위체강=선충·윤형 / 진체강=환형"],"N0-14#2":["위체강(pseudocoelom)의 정의와 예는?","선충·윤형동물"],"N0-14":["위체강(pseudocoelom)의 정의와 예는?","중배엽과 내배엽 사이의 체강(완전히 중배엽으로 안 싸임) · 선충 · 윤형동물"],"X-AN-7":["위체강을 가지는 두 무리는?","선충·윤형동물 (← 편형=무체강, 환형=진체강)"],"N0-16":["체강 유무가 계통 지표로 부적절한 이유는?","진화 과정에서 여러 번 독립적으로 생기거나 사라졌기 때문"],"N1-1":["해면동물(Porifera)의 조직 특징과 섭식은?","진정한 조직·기관 없음(측생동물) · 깃세포(choanocyte)로 세균·먹이 여과섭식"],"N1- const ttsNorm = t => TTSNorm.ttsNorm(t, TTS_LEX, TTS_ORDER, L.id);
let speakSeq = 0;

function speak(t, sid) {
  const my = ++speakSeq, at = i;

function go(k) {

// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {

  function read(k) {

function setMode(m) {

function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }

function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
