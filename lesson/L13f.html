<script>
const L = {"id":"L13f","scene":"s13","part":"f","title":"깃발 다섯 연대의 출정 — 항체 구조(중쇄 · 경쇄 · 가변 · 불변) · IgG · IgM · IgA · IgE · IgD · 중화 · 옵소닌화 · 보체","sub":"L13e 에서 불어난 벌들이 둥근 탑에서 다섯 연대로 나뉘어 출정한 날 — 깃발은 모두 Y 자 · 넷이 든 큰 Y 깃발 끝에 대롱대롱 세균 둘 · 탑 벽 앞에서 하품하는 D 자 명찰 벌 · 지팡이 손잡이 깃발의 큰 무리와 깃발이 꽉 찬 진홍 호스 · 임신부 배의 유리창 너머 아기가 받은 깃발 · 뚱보 경비 배에 꽂힌 깃발을 꽃가루가 잇자 확 타오른 성냥 · 세 갈래 갈퀴에 밀려나는 벌레 · Y 다섯 별 바퀴가 터뜨린 저수지 · A 자 사다리 위 쌍둥이의 이음 깃발과 우는 아이 · 손이 깃발투성이라 창틀을 못 잡는 망토 · 깃대째 세균을 삼키는 흰 덩이 · 깃발투성이로 춤추는 세균","img":"img/L13f.webp?v=97e673af7218","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"오른쪽 탑 문 앞 — 사람 키 둘만 한 큰 Y 깃발을 넷이 든다: 아래의 큰 벌 둘은 긴 장대를 하나씩(두 장대가 나란히 붙어 오르다 위에서 갈라져 Y 의 두 팔) · 위쪽의 날개 달린 작은 벌 둘은 두 팔에 하나씩 밧줄로 묶은 짧은 장대를 하나씩","fact":"항체 한 분자 = 중쇄(H) 2 + 경쇄(L) 2 — 네 사슬의 Y 자 꼴","hook":"Y 깃발 = 항체(면역글로불린 — L46c · L53a 의 하늘색 Y 자 집게와 같은 꼴) · 큰 벌의 긴 장대 = 무거운 사슬(중쇄) · 작은 벌의 짧은 장대 = 가벼운 사슬(경쇄) · 밧줄 = 사슬을 잇는 이황화 결합","say":"L13e의 무기고에서 늘어난 벌들이 둥근 탑 문을 나선다. 깃발은 모두 Y 모양으로, 항체인 면역글로불린을 나타낸다. 맨 앞의 사람 키 두 배만 한 큰 Y 깃발은 네 벌이 들고 있다. 아래의 큰 벌 둘이 잡은 긴 장대는 나란히 붙어 올라가다 갈라져 Y의 팔이 된다. 무거운 사슬인 중쇄 두 개다. 위쪽의 날개 달린 작은 벌 둘은 Y의 팔에 하나씩 밧줄로 묶인 짧은 장대를 잡았다. 짧은 장대는 팔에만 붙고 줄기까지 내려오지 않는다. 가벼운 사슬인 경쇄 두 개다. 사슬을 묶는 밧줄은 이황화 결합이다. 항체 한 분자는 중쇄 2개와 경쇄 2개, 총 네 사슬로 구성된다.","cards":["IM-039"],"box":[[1490,80,540,340],[1650,840,390,290]]},{"sid":"s2","obj":"큰 Y 의 두 팔 끝 — 끝마다 큰 집게, 그 곁에 노란 별이 찍힌 깃발 천 · 왼팔 끝 집게엔 성난 초록 세균 머리의 노란 별 돌기가 물렸고 · 오른팔 끝 깃발 천의 별엔 다른 세균 머리의 별 돌기가 딱 붙었다 · 두 세균이 팔 끝에 붙들려 허공에서 발버둥 · 아래쪽은 무늬 없는 맨 장대를 큰 벌들이 쥐었다","fact":"가변부위(N 말단 · 팔 끝)가 항원에 붙고, 불변부위가 종류와 하는 일을 정한다","hook":"팔 끝 집게 · 깃발 천 = 가변부위 V(L13e 「깃발 천 = V」 그대로) · 별 무늬 = 그 세균의 항원결정부위에만 맞음 · 팔 끝 = 사슬의 머리 N 말단 · 맨 장대 아래쪽 = 불변부위 C(C 말단 — 불변도 C) · 이 그림의 작은 Y 도 모두 같은 꼴(팔 끝 집게 + 곧은 깃대)","say":"큰 Y의 두 팔 끝마다 큰 집게가 달리고, 곁에는 노란 별이 찍힌 깃발 천이 나부낀다. 왼팔 집게에는 초록 세균 머리의 별 돌기가 물렸고, 오른팔 깃발 천의 별에는 다른 세균의 별 돌기가 붙었다. 팔 끝마다 세균 하나씩, 둘이 허공에서 발버둥 친다. 항체 한 분자에 항원 결합 자리가 두 개라는 뜻이다. L13e의 깃발 천은 가변부위로, 사슬의 N 말단에 있으며 항원결정부위와 결합한다. C 말단이 가변부위라는 설명은 틀리다. 아래의 무늬 없는 장대는 불변부위다. 불변을 뜻하는 C와 C 말단을 연결하자. 불변부위는 항체 종류를 구분하고, 그 밑동에 무엇이 결합하는지에 따라 효과기능이 정해진다. 작은 Y 깃발들도 모두 같은 모양으로, 팔 끝 집게로 항원을 잡고 곧은 깃대는 밖으로 향한다. 이제 연대별 밑동을 비교하자.","cards":["IM-040","IM-041"],"box":[[1490,85,540,190],[1760,930,260,190]]},{"sid":"s3","obj":"탑 문 왼쪽, 탑 벽 앞에서 입을 쩍 벌려 하품하는 벌 — 가슴에 아무것도 안 쓴 흰 D 자 명찰(곧은 왼쪽 · 둥근 오른쪽) · 깃발도 안 들고 아무 일도 안 한다","fact":"IgD — B 세포 겉의 수용체, 하는 일(효과기능)은 뚜렷하지 않다","hook":"D 자 명찰 = D(【_글자모양사전】 곧은 등에 배 하나) · 가슴에 단 명찰 = 세포 겉에 붙음 · 하품 = 하는 일이 안 보임","say":"탑 문 왼쪽에는 출정하지 않고 탑 벽 앞에서 입을 쩍 벌려 하품하는 벌 하나가 있다. 깃발 대신 가슴에 곧은 등과 굽은 배가 있는 D 모양 흰 명찰을 달았다. IgD이다. IgD는 혈액을 돌며 싸우지 않는다. 아직 항원을 만나지 않은 B 세포 표면에서 IgM과 함께 수용체로 작용한다. 가슴 명찰을 세포 표면과 연결하자. 효과기능은 뚜렷하지 않아 기출에서도 B 세포 표면이라는 위치 하나만 묻는다.","src":["s13p01#4"],"box":[[1610,480,160,190]],"cards":[]},{"sid":"s4","obj":"가운데 오른쪽의 가장 큰 무리 — 벌들이 Y 깃발을 하나씩 들었고 깃대 밑동이 지팡이 손잡이처럼 굽었다 · 그 뒤 나무 받침대 위 진홍 호스의 둥근 유리창 셋에 Y 깃발이 꽉 찼다","fact":"IgG — 혈청(피)에 가장 많은 항체, Y 하나로 다니는 단량체","hook":"지팡이 손잡이 = G(「지」 — 【지팡이】 DnaG 와 같은 소리) · 가장 큰 무리 = 가장 많음 · 진홍 호스 = 혈관(L13b) · 꽉 찬 유리창 = 혈청 최다","say":"가운데 오른쪽의 가장 큰 무리를 보자. 각 벌이 하나씩 든 Y 깃대의 밑동이 지팡이 손잡이처럼 굽어 있다. 이 덱에서 지팡이의 지는 언제나 G의 소리, IgG이다. 뒤의 나무 받침대에 걸린 진홍 호스는 혈관이고, 호스 옆구리의 둥근 유리창 셋에는 Y 깃발이 가득하다. IgG가 혈청에서 가장 많은 항체라는 단서다. 다른 Y와 이어지지 않은 단량체이며, 2차 반응에서 많이 분비되는 항체도 주로 IgG이다.","cards":["IM-048"],"box":[[1085,330,625,235],[1180,590,520,310]]},{"sid":"s5","obj":"그 무리 앞 — 연두 원피스 임신부의 둥근 배가 유리 공처럼 비치고 속에 아기가 웅크렸다 · 곁의 벌이 지팡이 손잡이 깃발을 유리 너머로 밀어 넣자 유리가 물결치고, 아기가 손을 뻗어 받는다","fact":"IgG 만 태반을 지나 태아에게 — 자연 수동면역(기억 없음)","hook":"임신부 배의 유리 = 태반 · 물결치며 지나감 = 태반 통과 · 아기가 받은 깃발 = 엄마가 만든 항체 = 수동면역","say":"무리 앞에 선 연두 원피스의 임신부를 보자. 둥근 배가 유리 공처럼 비치고 그 안에 아기가 웅크리고 있다. 벌이 지팡이 손잡이 깃발의 끝을 유리 너머로 밀어 넣자 유리가 물결치며 통과시키고 아기가 손을 뻗어 받는다. 이 유리는 태반이다. 다섯 항체 중 태반을 통과하는 것은 IgG 하나뿐이다. 아기가 직접 만든 것이 아니라 엄마의 항체를 받으므로 수동면역이며, 자연스럽게 전달되었으므로 자연 수동면역이다. 기억세포가 생기지 않아 몇 달 뒤에는 효과가 사라진다.","src":["s13p01#1"],"drop":["IM-083","IM-048"],"box":[[1200,700,345,410]],"cards":["IM-044"]},{"sid":"s6","obj":"가운데의 뚱보 흰 옷 경비 — 불룩한 배의 왼쪽에 작은 집게 Y 셋이 거꾸로 꽂혔다(곧은 깃대가 배에 박히고 집게가 바깥) · 위의 두 집게가 노란 가시 꽃가루 공 하나를 함께 물었다 · 그 순간 눈을 질끈 감고 치켜든 성냥 한 움큼이 확 타오른다","fact":"IgE — 비만세포에 붙어 있다가 알레르겐이 둘을 이으면 히스타민 방출","hook":"뚱보 경비 = 비만세포(L13b) · 배에 거꾸로 꽂힌 깃발 = 불변부위로 비만세포에 붙은 IgE · 꽃가루 = 알레르겐 · 두 깃발을 이음 = 교차결합 · 성냥 = 히스타민(【불붙은 성냥】)","say":"가운데에는 L13b의 비만세포, 배가 불룩한 흰 옷 경비가 있다. 배 왼쪽의 작은 Y 셋은 거꾸로 꽂혀 있다. 곧은 깃대가 배에 박히고 집게는 바깥쪽을 향한다. 처음 꽃가루를 만난 뒤 만들어진 IgE가 불변부위로 비만세포 표면에 결합한 모습이다. 다시 날아온 노란 가시 꽃가루 공을 이웃한 두 집게가 잡아 IgE 두 개가 연결되자 경비가 치켜든 성냥이 확 타오른다. 히스타민 방출과 알레르기를 나타낸다. 성냥을 든 주체는 깃발이 아니라 경비다. 히스타민은 비만세포가 내는 매개물질이지 항체 자체의 기능이 아니다. IgG의 기능을 히스타민 방출과 연결한 선지도 틀리다.","src":["s13p01#3"],"box":[[905,360,265,420]],"cards":["IM-053","IM-046","IM-092","IM-093"]},{"sid":"s7","obj":"성벽 위쪽 금 간 틈 — 틈에서 몸을 내민 분홍 벌레(기생충) — 날아든 벌이 긴 장대 끝의 세 갈래 갈퀴로 벌레를 틈 쪽으로 밀어붙인다","fact":"IgE — 기생충(연충) 방어에도 나선다","hook":"세 갈래 갈퀴 = E(【_글자모양사전】 가로대 셋) · 분홍 벌레 = 기생충","say":"성벽 위쪽의 금 간 틈에서 기어 나오던 분홍 벌레를 날아든 벌이 긴 장대의 갈퀴로 밀어 넣는다. 갈퀴의 날 셋은 가로대 셋을 가진 E 모양이다. 비만세포에 붙은 깃발과 같은 IgE이다. IgE는 몸집이 커서 삼킬 수 없는 기생충, 연충 방어에도 관여한다. 알레르기와 기생충 방어를 IgE의 두 역할로 기억하자.","cards":["IM-046"],"box":[[930,120,400,215]]},{"sid":"s8","obj":"가운데 왼쪽 — 벌이 큰 별 바퀴를 밀어붙인다(밑에 나무 바퀴 둘): 바큇살은 Y 깃발 다섯, 깃대 밑동끼리 한가운데에서 만나고 갈래 끝마다 깃발 천 · 한가운데 검은 쇠 장식은 뾰족한 봉우리 둘 · 위쪽 끝에 성난 초록 세균 셋이 한데 몰려 붙었다","fact":"IgM — Y 다섯이 이어진 5량체(결합 자리 10), 세균을 엉기게(응집)","hook":"두 봉우리 쇠 장식 = M(【_글자모양사전】) · 밑동끼리 이은 Y 다섯 = 5량체 · 갈래 끝 = 결합 자리 · 엉겨 붙은 세균 셋 = 응집","say":"가운데 왼쪽에서 벌이 큰 별 바퀴를 밀고 있다. 바큇살은 Y 깃발 다섯이며, 깃대 밑동끼리 한가운데에서 이어지고 갈래 끝마다 깃발 천이 달렸다. 가운데 검은 쇠 장식의 뾰족한 봉우리 둘은 M이다. IgM은 Y 다섯이 연결된 5량체다. Y 하나마다 결합 자리가 둘이므로 전체에는 열 개가 있어 여러 세균을 함께 붙잡는다. 바퀴 위쪽 끝의 초록 세균 셋이 한데 엉겨 붙은 모습은 응집이다. IgM은 감염 초기, 1차 반응에서 가장 먼저 나오는 항체다. 크기가 커서 태반은 통과하지 못한다.","src":["s13p01#0"],"drop":["IM-S3","IM-045","IM-052"],"box":[[420,175,470,440]],"cards":["IM-047"]},{"sid":"s9","obj":"바퀴가 밀어붙인 둥근 돌 저수지 — 저수지를 가로질러 막던 두꺼운 판자(보)가 비스듬히 밀려나고 물이 넘쳐 쏟아진다 · 바퀴 끝 세균 하나의 배에 둥근 구멍이 뚫렸고 그 구멍으로 물줄기가 쏟아져 나온다","fact":"IgM(과 IgG)이 보체 고전경로를 켠다 → 막공격복합체가 구멍을 뚫어 용해","hook":"저수지 물 = 보체(L13a · L13b 의 보) · 바퀴가 판자를 밀어 물이 터짐 = 항체가 켜는 보체(고전경로) · 세균 배를 꿰뚫은 물줄기 = 막공격복합체(MAC — 【몸 가운데 둥근 구멍 …】)","say":"바퀴가 미는 둥근 돌 저수지는 L13a와 L13b의 보이다. 고인 물은 혈액 속 보체 단백질이다. 저수지를 가로질러 물을 막던 두꺼운 판자가 바퀴에 밀려 비스듬해지자 물이 넘쳐 터진다. 세균에 결합한 항체가 보체를 활성화하는 고전경로다. 이 일을 가장 잘하는 항체는 IgM이고 IgG도 가능하다. 바퀴 끝 세균 하나의 배에 생긴 둥근 구멍으로 물이 콸콸 흐르는 모습은 보체의 막공격복합체를 나타낸다. 세균 막에 구멍이 생겨 세균이 터져 죽는다. 항체가 보체를 활성화하는 기능을 연결하자.","cards":["IM-045","IM-052"],"box":[[390,230,520,560]]},{"sid":"s10","obj":"왼쪽 위 — 펼친 A 자 접이 사다리 꼭대기의 똑같은 쌍둥이 벌이 Y 깃발 둘을 깃대 끝끼리 작은 J 자 쇠고리로 이은 이음 깃발을 함께 치켜든다 · 그 아래 돌 샘가에서 우는 아이 — 큰 눈물방울 둘 속과 샘물 줄기 속에 작은 이음 깃발","fact":"IgA — 눈물 · 침 · 모유 · 점막 분비물의 항체, 분비형은 이량체(J 사슬)","hook":"A 자 사다리 = A(【_글자모양사전】) · 쌍둥이 · 이음 깃발 = 둘 = 이량체 · J 자 쇠고리 = J 사슬 · 눈물 · 샘물 = 분비물 · 호스(피) 속 깃발은 Y 하나씩 = 혈액의 IgA 는 단량체","say":"왼쪽 위에 펼쳐 놓은 A 모양 접이 사다리 꼭대기에서 똑같은 쌍둥이 벌이 함께 깃발을 치켜든다. Y 둘의 밑동이 작은 J 모양 쇠고리로 이어져 있다. A 사다리는 IgA, 쌍둥이와 두 Y는 이량체, J 고리는 J 사슬이다. 그 아래 돌 샘가에서 아이가 울고 있다. 큰 눈물방울 속에도, 샘물 속에도 작은 이음 깃발이 떠 있다. IgA는 눈물·침·모유·점액 같은 분비물에서 점막을 보호한다. 분비형은 이량체지만 혈액 속 IgA는 Y 하나인 단량체다. 점막의 항체는 IgM이라는 선지는 틀리다.","src":["s13p01#2"],"cards":["IM-042","IM-043"],"box":[[120,40,380,330],[0,400,240,250]]},{"sid":"s11","obj":"왼쪽 아래 오두막 — 흰 두루마리를 등에 멘 보라 두건 망토가 창으로 기어들려 하지만, 두 손을 작은 집게 Y 들이 빼곡히 물어 고슴도치 같다(집게가 손을 물고 곧은 깃대는 바깥) · 손은 창틀을 못 잡고 어두운 창 안쪽만 짚는다","fact":"중화 — 항체가 병원체 겉을 덮어 세포에 붙고 들어가는 것을 막는다","hook":"보라 망토 = 바이러스(L13a) · 오두막 = 세포 · 손을 문 집게 Y = 붙는 자리를 덮은 항체 · 창틀을 못 잡음 = 부착 · 침입 차단","say":"왼쪽 아래 오두막을 보자. 흰 두루마리를 등에 멘 보라 두건 망토, 바이러스가 창으로 기어들어 가려 한다. 이 세계에서 집은 세포다. 그런데 망토의 두 손을 작은 Y 깃발들이 빼곡히 물고 있다. 깃발마다 팔 끝 집게로 손을 물고 곧은 깃대는 밖으로 뻗어 손이 고슴도치 같다. 망토는 창틀을 잡지 못하고 어두운 창 안쪽만 헛짚는다. 항체가 바이러스의 세포 부착 부위를 덮었기 때문이다. 감염 전에 부착과 침입을 막는 작용을 중화라고 한다. 세균이 만든 독소도 같은 방식으로 중화한다.","cards":["IM-050"],"box":[[150,820,330,310]]},{"sid":"s12","obj":"앞 가운데 — 큰 흰 덩이가 깃발투성이 세균을 두 손으로 붙들고 입을 쩍 벌려 삼킨다 · 세균 몸 둘레를 작은 집게 Y 들이 물었고 곧은 깃대는 바깥으로 삐죽 · 덩이의 손 밑으로 깃대 몇 개가 들어갔다","fact":"옵소닌화 — 항체가 표지한 병원체를 식세포가 더 잘 잡아먹는다","hook":"흰 덩이 = 대식세포(L13a) · 깃대를 움켜쥠 = 식세포가 항체의 불변부위(Fc)를 잡음 · 깃발투성이 세균 = 표지된 병원체","say":"앞쪽 가운데의 큰 흰 덩이가 입을 크게 벌리고 있다. 대식세포다. 두 손에 붙잡힌 세균은 Y 깃발투성이다. 각 깃발의 팔 끝 집게는 세균을 물고, 곧은 깃대는 바깥으로 삐죽 나와 있다. 그중 몇 개가 흰 덩이의 손 아래로 들어가 있다. 깃대째 움켜쥔 모습이다. 식세포에는 항체의 밑동인 불변부위를 잡는 손잡이, 수용체가 있다. 따라서 깃발이 붙은 세균은 매끈한 세균보다 훨씬 잡기 쉽다. 항체가 병원체에 표지를 달아 식세포가 더 잘 먹게 하는 작용을 옵소닌화라고 한다. L13b에서 보체 물에 젖은 세균을 먹던 것과 같은 일을 항체도 하는 것이다.","cards":["IM-051"],"box":[[570,830,370,285]]},{"sid":"s13","obj":"그 오른쪽 — 온몸을 작은 집게 Y 들이 물어(집게가 몸에 · 곧은 깃대는 바깥) 깃대투성이가 된 초록 세균이 다친 데 하나 없이 신나서 춤춘다","fact":"항체는 병원체를 직접 죽이지 않는다 — 표지 · 중화 · 옵소닌화 · 보체로 돕는다","hook":"깃발투성이로 춤추는 세균 = 항체만으로는 안 죽음 · 죽이는 것은 흰 덩이(식세포) · 저수지 물(보체) — 깃발은 표지","say":"흰 덩이 오른쪽의 세균을 보자. 온몸을 Y 깃발들이 물어 깃대투성이가 되었는데도 상처 하나 없이 신나게 춤을 춘다. 항체는 병원체를 직접 죽이지 못하며, 깃발은 표지일 뿐이라는 뜻이다. 실제로 죽이는 것은 깃대를 잡고 삼키는 흰 덩이와 바퀴가 터뜨린 저수지 물이다. 항체의 역할을 넷으로 정리해 보자. 표지를 달고, 망토의 손에서처럼 부착을 막는 중화를 하며, 식세포가 먹기 쉽게 하는 옵소닌화를 하고, 보체를 켠다. 항체가 세균을 직접 녹여 죽인다는 설명은 틀리다.","cards":["IM-049"],"box":[[975,860,210,250]]},{"sid":"s14","obj":"출정 전체 — 지팡이 손잡이의 큰 무리(G) · 두 봉우리 장식의 별 바퀴(M) · A 자 사다리 위 쌍둥이의 이음 깃발(A) · 배에 깃발이 꽂힌 뚱보 경비와 세 갈래 갈퀴(E) · 탑 벽 앞 D 자 명찰 벌(D)","fact":"A 점막 · 이량체 / G 태반 · 혈청 최다 / M 5량체 · 보체 / E 알레르기 · 기생충 / D 표면","hook":"연대마다 밑동의 글자 — 지팡이(G) · 두 봉우리(M) · A 자 사다리(A) · 세 갈래(E) · D 자 명찰(D)","say":"출정 장면 전체를 다시 연결해 보자. 깃대 밑동, 곧 불변부위의 모양으로 연대가 나뉜다. 가장 큰 무리의 지팡이 손잡이는 G이다. IgG는 혈청에 가장 많고, 다섯 항체 가운데 혼자 태반을 지나 아기에게 간다. 별 바퀴의 두 봉우리 장식은 M이다. IgM은 Y 다섯이 연결된 5량체로 세균을 엉기게 하며 보체를 가장 잘 켠다. 사다리 위 쌍둥이는 A, IgA이다. 눈물·침·모유 같은 분비물 속의 이량체다. 뚱보 경비 배의 깃발과 세 갈래 갈퀴는 E이다. IgE의 알레르기와 기생충 방어를 연결하자. 탑 벽 앞에서 하품하는 D는 B 세포 표면의 수용체 IgD이다. 다섯 글자의 모양을 다섯 항체의 성질과 연결하면 된다.","cards":["IM-S3"],"box":[[1610,480,160,190],[1180,590,520,310],[420,175,470,440],[120,40,380,330],[905,120,425,660]]}],"cq":{"IM-039":["항체 1분자의 사슬 구성은?","중쇄(heavy) 2개 + 경쇄(light) 2개"],"IM-040":["항체의 가변부위는 N-말단? C-말단?","N-말단 (항원 결합)"],"IM-041":["항체 가변영역과 불변영역의 역할은?","가변=항원결정부위 결합 / 불변=항체 종류·효과기능 결정"],"IM-048":["혈청에 가장 많은 항체는?","IgG"],"IM-044":["태반을 투과해 태아에게 수동면역을 주는 항체는?","IgG"],"IM-053":["히스타민 작용은 항체(IgG)의 기능인가?","아니다 — 항체 기능이 아님(비만세포 매개체)"],"IM-046":["알레르기·기생충 반응에서 비만세포 히스타민 방출을 유도하는 항체는?","IgE"],"IM-092":["알레르기(제1형 과민반응)의 기전은?","비만세포에 결합한 IgE에 알레르겐 재결합 → 히스타민 방출"],"IM-093":["알레르기와 직접 관계되는 세포는?","비만세포(mast cell)"],"IM-047":["5량체(pentamer) 형태로 존재하는 항체는?","IgM"],"IM-045":["보체계(고전경로)를 가장 효율적으로 활성화하는 항체는?","IgM (IgG도 가능)"],"IM-052":["항체 기능: \"막공격복합체·세포용해\"는?","보체 활성화"],"IM-042":["점막·분비물(눈물·침·모유)의 항체는?","IgA"],"IM-043":["IgA는 혈액과 분비물에서 각각 몇 량체인가?","혈액=단량체 / 분비=이량체(dimer, J chain)"],"IM-050":["항체 기능: \"감염 전 부착 차단\"은?","중화(neutralization)"],"IM-051":["항체 기능: \"식세포가 더 잘 잡아먹게 표지\"는?","옵소닌화(opsonization)"],"IM-049":["항체는 병원체를 직접 죽이나?","아니다 — 표지·중화·옵소닌화·보체 활성화로 제거를 돕는다"],"IM-S3":["항체 4종(A/G/M/E)의 대표 특징을 통합하면?","IgA=점막·분비(이량체) / IgG=태반·혈청최다 / IgM=보체·5량체 / IgE=알레르기·기생충"]},"hubPanel":"s13p01"};
const $ = id => document.getElementById(id);
$('title').textContent = L.title; document.title = L.title;
// 요약 줄(sub)에는 물건 = 답이 다 적혀 있다 — 복습 · 시험에서는 접어 두고, 누르면 편다(GPT 추가 감사 2026-11-11 §7)
let subOpen = false;
function subShow() { const hide = (mode === 'review' || mode === 'quiz') && !subOpen && !!L.sub; $('sub').textContent = hide ? '요약 줄은 접어 두었다(답이 적혀 있다) — 누르면 편다' : (L.sub || ''); $('sub').classList.toggle('hid', hide); }
$('sub').onclick = () => { if (mode === 'review' || mode === 'quiz') { subOpen = !subOpen; subShow(); } };
$('img').src = L.img; $('img').alt = L.title;
if (L.home) $('home').href = L.home;  // 한 파일(standalone)은 저장소 밖에서 열리므로 배포 주소로
if (L.hub) $('hub').href = L.hub; else if (L.hubPanel) $('hub').href = '../sketchy.html#' + L.hubPanel;
const ov = $('ov'); ov.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
let tourEnded = false;
let mode = 'tour', i = -1, playing = false, voice = true, rate = 1.0, quizOrder = [], quizPos = 0, quizRevealed = false, shuffle = false, sess = null;
const stops = L.stops;
subShow();
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID
const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact), st.sid);
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate,
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
