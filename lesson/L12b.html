<style>

<script>
const L = {"id":"L12b","scene":"s12","part":"b","title":"운하와 붉은 벽돌 곳간 — 장벽의 방들과 간으로 가는 두 길","sub":"운하 왼→오(십이지장 → 공장 → 회장) · 버너 방(브루너샘) + 흰 거품(알칼리 점액) · 감실 분무 + 대파 그물(파네트 · 라이소자임) · M 자 창 갈고리(M세포) · 북(카할) · 초록 관과 큰 노란 스펀지(담즙 · 장간순환) · 초록 방울에 흩어지는 기름 덩이(유화) + 매듭 호스의 누런 일꾼(황달) · 앞벽에 박힌 일꾼과 뗏목(마무리 소화 — 펩티데이스 셋 · 뉴클레이스) · 통 진 짐꾼 흙길(간문맥) + 구명 튜브 낀 기름 진 짐꾼 오솔길(림프) + 꼬리 기름방울을 뭉치는 일꾼(킬로미크론) · 물속 뜰채(쿠퍼) · 마른 턱 주황 병(이토)","img":"img/L12b.webp?v=e0ef29add35e","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"왼쪽에서 오른쪽으로 흐르는 긴 돌 운하(앞벽을 잘라 벽 속 방들이 보인다) · 위쪽 오른편의 붉은 벽돌 곳간 · 둑에서 곳간으로 오르는 흙길 · 초록 관 둘","fact":"소장은 십이지장(첫 약 25cm) → 공장 → 회장 순","hook":"왼쪽 끝 = 십이지장 · 오른쪽 끝 = 회장","say":"긴 돌 운하가 왼쪽에서 오른쪽으로 흐른다. 소장이다. 왼쪽 끝이 십이지장, 처음 25센티미터쯤. 가운데가 공장, 오른쪽 끝이 회장. 왼쪽 끝으로는 위 통에서 나온 김 나는 초록 산이 쏟아져 들어온다. 운하 앞벽을 잘라 벽 속 방들이 보이고, 위쪽 오른편의 붉은 벽돌 곳간이 간이다. 음식의 화학적 소화는 대부분 이 운하, 소장에서 일어난다.","box":null,"src":["s12p02a#1"],"cards":["G1-95","G1-94","G1-95#1","G1-95#2","G1-95#3","G1-93"]},{"sid":"s2","obj":"왼쪽 끝 운하 바닥 밑에만 있는 묻힌 방 — 파란 가스통 캠핑 버너 위 냄비","fact":"브루너샘 — 십이지장의 점막하층에만 있다","hook":"버너 = 브루너 · 왼쪽 끝 밑에만","say":"왼쪽 끝, 운하 바닥 밑을 파 보면 묻힌 방이 하나 있다. 파란 가스통 캠핑 버너 위에서 냄비가 끓는다. 버너, 브루너샘이다. 이 방은 운하 왼쪽 끝 밑에만 있다. 브루너샘은 십이지장, 그것도 점막 밑 점막하층에만 있다.","box":[80,800,270,290],"src":["s12p02a#1"],"cards":["G1-95","G1-94","G1-95#1","G1-95#2","G1-95#3"]},{"sid":"s3","obj":"버너 방 냄비에서 흰 관을 타고 올라온 거품이 운하 바닥을 뚫고 분수처럼 솟아 바로 옆 초록 산을 덮어 간다","fact":"알칼리성 점액이 강산성 유미즙을 중화한다","hook":"흰 거품이 초록 산을 덮는다","say":"냄비에서 끓어오른 흰 거품이 관을 타고 올라가 운하 바닥을 뚫고 분수처럼 솟는다. 바로 옆이 위에서 쏟아져 들어온 초록 산. 거품이 닿은 가장자리부터 베이지로 바뀐다. 브루너샘의 알칼리성 점액이 강산성 유미즙을 중화한다. 다만 산을 중화하는 큰 몫은 이자에서 오는 중탄산염이다. 위의 펩신은 강산에서, 소장의 효소 대부분은 중성에서 약알칼리에서 일하니 이 중화가 꼭 있어야 한다.","box":[0,560,430,240],"src":["s12p02a#2"],"cards":["G1-205"]},{"sid":"s4","obj":"벽 속 비탈진 좁은 감실 — 계단에 웅크린 사람들이 초록 세균에 분무한다 · 감실 아래 대파 한 단이 든 그물망","fact":"파네트세포 — 움 바닥 · 라이소자임(세포벽 공격) · 디펜신으로 세균 감시","hook":"파 + 네트 = 파네트","say":"벽 속으로 비탈지게 파 들어간 좁은 감실, 장의 움이다. 계단마다 웅크린 사람들이 분무기로 초록 세균에 약을 뿌린다. 감실 맨 아래에는 대파 한 단이 든 그물망. 파에 네트, 파네트세포다. 그물망이 놓인 맨 아래, 움 바닥이 제자리다. 거기서 라이소자임과 디펜신으로 세균을 감시한다. 라이소자임은 세균의 세포벽을 공격한다.","box":[480,750,420,330],"src":["s12p02a#0"],"cards":["G1-75"]},{"sid":"s5","obj":"벽 속 M 자 쌍창 — 투구 쓴 경비 둘 · 하나가 갈고리를 뻗어 창 앞에 떠 있는 주황 점박이 가시 공을 끌어당긴다","fact":"M세포 — 파이어판 위에서 항원을 표본 채취해 넘긴다","hook":"M 자 창 = M세포 · 주황 점박이 가시 공 = 항원","say":"벽 속에 M 자 모양 쌍창이 났다. 창 안에 투구 쓴 경비 둘이 있고, 하나가 갈고리를 뻗어 창 앞에 떠 있는 주황 점박이 가시 공을 끌어당긴다. 장 속에서 흘러든 항원이다. M세포, 파이어판 위에서 장 속 항원을 표본으로 떠서 안쪽 면역세포에게 넘긴다.","box":[950,780,230,260],"src":["s12p02a#3"],"cards":[]},{"sid":"s6","obj":"벽 속 아치 방에서 북 치는 사람 — 박자에 맞춰 벽이 물결친다","fact":"카할 간질세포 — 위장관 운동의 박동원(페이스메이커)","hook":"북 = 박자 = 박동원 · 칼박 = 카할","say":"벽 속 아치 방에서 한 사람이 북을 친다. 박자에 맞춰 운하 벽이 물결친다. 칼같이 박자를 맞춘다, 칼박의 카할. 카할 간질세포, 위장관 운동의 박자를 잡는 박동원이다.","box":[1280,790,200,290],"src":["s12p02a#4"],"cards":[]},{"sid":"s7","obj":"곳간에서 나온 초록 관이 둑을 따라 왼쪽으로 와서 산이 들어오는 곳 바로 옆에 초록 방울을 붓는다 · 오른쪽 끝 운하를 가로막은 큰 노란 스펀지가 초록 방울을 빨아들이고 · 스펀지에서 나온 초록 관이 곳간으로 올라간다","fact":"담즙은 간에서 만든다 · 담즙산염은 회장에서 재흡수돼 간문맥을 타고 간으로(장간순환)","hook":"곳간이 붓고 · 운하를 막은 스펀지가 빨아들여 되돌린다","say":"곳간에서 나온 초록 관이 둑을 따라 왼쪽으로 와서, 위의 산이 쏟아져 들어오는 곳 바로 옆에 초록 방울을 붓는다. 담즙이다. 담즙은 간에서 만들어 십이지장으로 내려보낸다. 운하 오른쪽 끝, 회장에는 커다란 노란 부엌 스펀지가 운하를 가로막고 섰다. 흘러온 초록 방울을 쏙쏙 빨아들여 온몸이 초록 점투성이다. 스펀지에서 나온 가는 초록 관이 곳간으로 거슬러 올라간다. 몸에는 이런 관이 따로 없다. 되돌아가는 길은 간문맥이다. 바로 다음에 볼 흙길이 그 혈관이다. 스펀지는 흡수다. 담즙산염은 회장에서 대부분, 약 95퍼센트가 재흡수되어 간으로 돌아온다. 장간순환이다. 스펀지를 빠져나가는 몇 방울만 버려진다.","box":[[390,540,900,180],[1620,720,300,300],[1900,320,90,560]],"src":["s12p02b#2"],"cards":["G1-113"]},{"sid":"s11","obj":"초록 관의 초록 방울이 떨어지는 자리 바로 오른쪽 운하 물 위의 큰 노란 기름 덩이 — 초록 방울이 튄 덩이가 금 가며 오른쪽부터 초록 테 두른 작은 노란 방울로 흩어진다 / 둑 위 — 붉은 벽돌 곳간 벽에서 나온 초록 호스가 매듭으로 묶였고 벽 쪽 호스가 불룩 부풀었다 · 그 호스를 든 아픈 일꾼은 피부와 흰자위가 누렇다","fact":"담즙산염 = 지방을 유화해 표면적 ↑(가수분해는 라이페이스) · 담즙 색소가 쌓이면 황달","hook":"초록 방울에 잘게 흩어지는 기름 덩이 = 유화 · 매듭 호스의 누런 일꾼 = 황달","say":"초록 관이 붓는 초록 방울이 바로 옆 운하 물의 큰 노란 기름 덩이에 튄다. 덩이는 금이 가며 오른쪽부터 작은 노란 방울로 흩어지고, 방울마다 초록 테를 둘렀다. 담즙산염은 지방을 잘게 나누는 유화를 한다. 큰 덩이는 겉넓이가 작아 효소가 닿을 데가 적다. 잘게 나뉘면 겉넓이가 커져 라이페이스(L12a 의 쟁반)가 잘 붙는다. 담즙산염이 없으면 지방 소화가 더딘 까닭이다. 담즙은 나눌 뿐 자르지 않는다. 결합을 실제로 끊는 가수분해는 라이페이스의 몫이다. 이제 둑 위. 곳간 벽에서 나온 초록 호스가 매듭으로 묶였고 벽 쪽이 불룩 부풀었다. 호스를 든 일꾼은 피부도 흰자위도 누렇다. 담즙이 빠져나가지 못해 그 색소가 몸에 쌓이면 황달이 온다.","box":[[438,632,280,96],[1030,372,250,180]],"cards":["G1-112","G1-117","G1-207","G1-118"]},{"sid":"s12","obj":"운하 가운데 앞벽 윗전에 허리까지 박힌 일꾼 둘 — 왼쪽은 긴 구슬 사슬의 왼쪽 끝에서 떼어 낸 구슬 하나를 들었다 · 가운데는 두 손에 구슬 하나씩(붙어 있던 짝을 막 떼었다 · 손 둘레의 짧은 초록 선) / 물 위 나무 뗏목의 일꾼 둘 — 하나는 짧은 구슬 사슬의 오른쪽 끝에서 구슬 하나를 떼어 들었고 · 하나는 빛깔 네모가 줄지은 흰 종이띠를 가위로 낱장 네모로 자른다 · 물 위에 뜬 낱 구슬과 낱장","fact":"상피 표면 효소가 마무리 소화 — 아미노 · 디펩티데이스 / 이자의 카복시펩티데이스 · 뉴클레이스","hook":"벽에 박힌 일꾼 = 상피 표면 효소 · 물 위 뗏목 = 이자에서 흘러온 효소","say":"운하 가운데, 공장 구간. 앞벽 윗전에 허리까지 박힌 일꾼 둘은 벽을 이루는 세포, 소장 상피다. 그 표면의 효소가 소화를 마무리해 흡수할 수 있는 마지막 낱알까지 자른다. 왼쪽 일꾼은 긴 구슬 사슬의 왼쪽 끝, N 말단에서 구슬을 하나씩 뗀다. 아미노펩티데이스. 가운데 일꾼은 붙은 구슬 둘을 두 손으로 떼었다. 디펩티데이스. 물 위 뗏목은 L12a 요리사의 뗏목처럼 물속에서 일하는 효소, 이자에서 흘러왔다. 한 사람은 사슬 오른쪽 끝, C 말단에서 하나씩 떼는 카복시펩티데이스. 곁의 사람은 빛깔 네모 종이띠, 핵산을 가위로 낱장, 뉴클레오타이드로 자르는 이자의 뉴클레이스. 낱장은 장 효소가 다시 뉴클레오사이드로, 끝내 당 · 염기 · 인산으로 쪼갠다.","box":[[796,622,520,140]],"cards":["G1-106","G1-107","G1-105","G1-108","G1-109","G1-110","G1-111"]},{"sid":"s8","obj":"둑에서 곳간 아치문으로 오르는 흙길 — 통 진 짐꾼 셋이 줄지어 올라 맨 앞이 문 앞에 닿았다 · 주황 구명 튜브를 낀 노란 기름방울을 진 넷째만 등을 돌려 흰 오솔길로 왼쪽으로 간다","fact":"당 · 아미노산은 먼저 융모 모세혈관 → 간문맥 → 간 · 지방은 유미관 → 림프로","hook":"흙길 = 간문맥 · 흰 오솔길 = 유미관(림프)","say":"운하 둑에서 곳간 아치문으로 흙길이 오른다. 통을 진 짐꾼 셋이 줄지어 올라가고 맨 앞 사람은 문 앞에 닿았다. 이 흙길이 간문맥이다. 당과 아미노산은 먼저 소장 융모의 모세혈관으로 들어가고, 그 피가 간문맥에 모여 온몸으로 가기 전에 간부터 들른다. 문맥은 두 모세혈관망 사이를 잇는 정맥, 간문맥이 그 대표다. 주황 구명 튜브를 낀 노란 기름방울을 진 넷째 짐꾼만 등을 돌려 흰 오솔길로 왼쪽으로 간다. 흰 오솔길은 융모 한가운데의 림프관, 유미관이다. 흡수한 지방은 간문맥이 아니라 유미관을 타고 림프계로 간다.","box":[[600,120,580,380],[230,330,250,220]],"src":["s12p02b#3"],"cards":["G1-127","G1-128","H0-9","H0-8","G1-126","G1-138","H0-139","G1-206"]},{"sid":"s13","obj":"흰 오솔길과 흙길이 만나는 자리 위 — 짙은 작업복 일꾼이 꼬리 달린 작은 노란 기름방울들을 큰 노란 공 속에 뭉쳐 넣고 두 손으로 윗부분을 여민다(손 위로 꼬리 방울이 비어져 나온다) · 공에는 주황 구명 튜브가 끼워졌다 · 발치에 꼬리 달린 작은 기름방울 무더기 / 흰 오솔길로 가는 짐꾼의 기름방울에도 같은 주황 구명 튜브","fact":"지방산 · 모노글리세리드 → 상피에서 트리글리세리드 → 인지질 · 단백질 옷 = 킬로미크론 → 유미관","hook":"구명 튜브 낀 기름 공 = 킬로미크론","say":"흰 오솔길과 흙길이 갈리는 자리 위에서 짙은 작업복 일꾼이 꼬리 달린 작은 노란 방울들을 큰 공 속에 뭉쳐 넣고 두 손으로 입구를 여민다. 작은 방울은 지방산과 모노글리세리드(L12g 의 그 꼬리 기름방울). 상피세포 안에서 이들이 다시 트리글리세리드로 조립된다. 뭉친 공에는 주황 구명 튜브가 끼워졌다(L46c 의 그 튜브). 겉을 인지질과 단백질로 감싼 것, 킬로미크론이다. 겉이 물과 친하니 물에 뜬다, 수용성이다. 다 감싼 공은 세포외배출로 세포 밖으로 나가 먼저 유미관, 곧 림프 모세관에 든다. 짐꾼이 진 것도 튜브를 낀 그 공이다. 너무 커서 모세혈관으로는 잘 못 들어가니 흙길이 아니라 흰 오솔길로 간다. 정리하면 지방산 · 모노글리세리드 → 상피세포 → 트리글리세리드 → 킬로미크론 → 유미관 → 림프관 → 혈액.","box":[[455,272,187,206],[348,322,126,142]],"cards":["G1-129","G1-130","G1-131","G1-132","G1-133","G1-134","G1-135","G1-136"]},{"sid":"s9","obj":"곳간 속 붉은 물길 — 무릎까지 물에 들어선 사람이 뜰채로 찌꺼기를 건진다","fact":"쿠퍼세포 — 간 굴모세혈관 안의 고정 대식세포(물속)","hook":"물속에서 건진다 · 쿡 퍼낸다 = 쿠퍼","say":"곳간 속을 보면 붉은 물길이 흐른다. 간의 굴모세혈관, 피다. 한 사람이 무릎까지 물에 들어서서 뜰채로 찌꺼기를 건진다. 쿡 떠서 퍼낸다, 쿠퍼. 쿠퍼세포, 혈관 안에 자리 잡은 고정 대식세포다. 물속에 서 있는 쪽이 쿠퍼.","box":[1340,250,260,300],"src":["s12p02b#0"],"cards":[]},{"sid":"s10","obj":"붉은 물길 옆 벽돌 칸막이 너머 마른 돌턱 — 사람들이 주황 병을 차곡차곡 쌓는다","fact":"이토세포 — 디세강에서 비타민 A를 저장 · 손상되면 섬유화","hook":"물 밖 마른 턱 · 주황 병 = 비타민 A · 이토록 쌓는다 = 이토","say":"붉은 물길 옆, 벽돌 칸막이 너머 마른 돌턱에서는 사람들이 주황 병을 차곡차곡 쌓는다. 이토록 쌓아 둔다, 이토. 이토세포다. 혈관 밖, 디세강에서 비타민 A를 저장한다. 간이 다치면 이 세포가 섬유를 만들어 간이 굳는다. 물속이 쿠퍼, 물 밖이 이토.","box":[1660,200,240,340],"src":["s12p02b#1"],"cards":[]}],"cq":{"G1-95":["소장의 세 부분을 순서대로 쓰면?","십이지장(duodenum) → 공장(jejunum) → 회장(ileum)"],"G1-94":["소장의 첫 부분 약 25cm를 무엇이라 하는가?","십이지장"],"G1-95#1":["소장의 세 부분을 순서대로 쓰면?","십이지장(duodenum)"],"G1-95#2":["소장의 세 부분을 순서대로 쓰면?","공장(jejunum)"],"G1-95#3":["소장의 세 부분을 순서대로 쓰면?","회장(ileum)"],"G1-93":["대부분의 소화가 일어나는 곳은?","소장"],"G1-205":["위와 소장의 pH 차이가 중요한 이유는?","펩신은 산성에서, 대부분의 소장 효소는 중성~약알칼리성에서 작동하기 때문"],"G1-75":["라이소자임의 기능은?","세균 세포벽에 대한 항균작용"],"G1-113":["담즙은 어디서 만들어지는가?","간"],"G1-112":["담즙산염의 핵심 기능은?","지방을 유화하여 표면적을 늘린다"],"G1-117":["담즙산염이 없으면 지방 소화가 비효율적인 이유는?","큰 지방 덩어리의 표면적이 작아 효소 접근이 어렵기 때문"],"G1-207":["담즙과 라이페이스를 비교하면?","담즙은 유화, 라이페이스는 실제 가수분해"],"G1-118":["담즙 색소가 축적되면 생기는 대표 증상은?","황달"],"G1-106":["아미노펩티데이스의     s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact));
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
function speak(t) {
  t = ttsNorm(t);
  const my = ++speakSeq, at = i;
  const advance = (ms) => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, ms);
  if (!('speechSynthesis' in window)) { if (playing) advance(3500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = () => { if (started) advance(700); };
  u.onerror = () => { if (!started) advance(3000); };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started && my === speakSeq) { speechSynthesis.cancel(); advance(3000); } }, 2500);  // 목소리가 없으면 글만 3초
}
function go(k) {
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) setTimeout(() => { if (playing) next(); }, 3500);
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; speechSynthesis && speechSynthesis.cancel(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i + 1); else speechSynthesis && speechSynthesis.cancel(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) speechSynthesis && speechSynthesis.cancel(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
</script>
