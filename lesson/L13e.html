<script>
const L = {"id":"L13e","scene":"s13","part":"e","title":"무기고의 깃발 맞추기 — B 세포 · 항원결정부위 · V(D)J 재배열 · 클론선택 · 형질세포와 기억세포 · 1차 · 2차 반응 · 단클론 항체","sub":"성의 내성(둥근 돌탑) 무기고에 처음 보는 세균이 끌려온 날 — 슬롯머신으로 미리 뽑아 둔 깃발 가운데 별 깃발만 별 돌기에 붙고 · 그 벌이 빛 동그라미에서 똑같은 벌로 불어나 · 진홍 호스에 같은 깃발을 쏟다 태엽이 멎거나 · 이층 침대에서 수염이 자라도록 잠든다 · 같은 세균이 창으로 다시 오자 깃발 산 · 구석엔 반은 벌 · 반은 게인 괴물이 끝없이 같은 깃발","img":"img/L13e.webp?v=2dad0b0dba3d","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"기둥에 밧줄로 묶인 초록 세균 — 왼쪽 위에서 날아든 벌이 든 깃발 끝(노란 별)이 세균 머리의 별 돌기에 바로 닿았다 · 오른쪽의 장난감 병정(조끼 단추 한 줄 넷)은 외눈 안경을 눈에 대고 섰지만 어리둥절하다","fact":"적응 면역의 두 주역 B · T — B 는 BCR 로 날 항원을 바로 본다(T 는 TCR)","hook":"태엽 벌 = B 세포 · 장난감 병정 = T 세포 · 벌이 손에 든 제 깃발 = BCR(막에 붙은 항체 — 던지는 깃발은 분비된 항체) · 외눈 안경 = TCR(L13d) · 맨 세균 = 날 항원","say":"성 안쪽 둥근 돌탑의 무기고다. 처음 보는 초록 세균 한 놈이 끌려와 기둥에 묶여 있고, 태엽 벌 B 세포와 장난감 병정 T 세포가 모였다. 벌이 손에 쥔 자기 깃발의 끝을 세균 몸에 직접 댄다. 이 깃발은 B 세포 수용체 BCR이다. B 세포는 떠다니는 항원이든 병원체 표면의 항원이든 그대로 인식한다. 병정은 외눈 안경을 대고도 어리둥절하다. 안경은 T 세포 수용체 TCR이며, T 세포는 L13c에서처럼 쟁반에 제시된 조각만 인식하고, 제시되지 않은 항원은 알아보지 못한다. B 세포는 BCR, T 세포는 TCR이다. B 세포가 TCR로 인식한다는 설명과 구별하자.","cards":["IM-027","IM-028","IM-030"],"box":[[760,370,510,410]]},{"sid":"s2","obj":"세균 몸에 돋은 돌기 셋 — 머리의 노란 별 · 왼쪽 옆구리의 파란 세모 뿔 · 오른쪽 옆구리의 분홍 동그라미 · 노란 별 깃발은 별 돌기에, 파란 세모 깃발은 세모 뿔에 닿아 불똥이 튄다 · 분홍 동그라미에 닿은 깃발은 없다","fact":"항원결정부위 = 수용체가 붙는 항원의 한 부분 · 한 항원에 여러 개","hook":"세균 몸의 돌기 = 항원결정부위(에피토프) · 같은 도형끼리만 붙음 = 특이성 · 돌기 셋 = 여럿","say":"세균에는 머리의 노란 별, 왼쪽 옆구리의 파란 세모 뿔, 오른쪽 분홍 동그라미의 세 돌기가 있다. 수용체가 실제로 결합하는 것은 항원 전체가 아니라 그 일부인 항원결정부위, 에피토프다. 노란 별 깃발은 별 돌기에, 파란 세모 깃발은 세모 뿔에 맞아 불꽃이 튀지만 네모 깃발은 맞지 않다. 하나의 항원에도 항원결정부위가 하나가 아니라 여러 개이므로, 세균 하나에 여러 벌의 깃발이 붙을 수 있다.","cards":["IM-005","IM-031","IM-032"],"box":[[820,400,290,360]]},{"sid":"s3","obj":"왼쪽 벽 — 미리 만든 깃발이 빼곡한 나무 걸이(별 · 세모 · 동그라미 · 네모 · 마름모 무늬가 제각각) · 그 아래 슬롯머신 둘의 손잡이를 당기는 벌 · 작은 슬롯머신의 배출구에서 새 깃발이 나온다","fact":"다양성 = 유전자 재배열(V(D)J) — 항원을 만나기 전에 미리 만든다","hook":"슬롯머신 = 유전자 조각을 무작위로 골라 잇는 재배열 · 걸이에 미리 걸린 깃발 = 항원이 오기 전의 수용체 목록","say":"왼쪽 벽의 나무 걸이에는 별·세모·동그라미·네모·마름모 등 서로 다른 무늬의 깃발이 빼곡하다. 아래의 벌이 슬롯머신 손잡이를 당기면 배출구에서 새로운 무늬 깃발이 나온다. 슬롯머신의 릴처럼 유전자 조각을 무작위로 골라 연결하는 V(D)J 재조합, 유전자 재배열을 나타낸다. 깃발이 세균이 끌려오기 훨씬 전부터 걸려 있었다는 순서가 중요하다. 수용체의 특이성은 항원과 만나기 전에 정해져 있으며, 항원이 맞는 클론을 선택한다는 것이 클론선택설이다. 세균 모양에 맞추어 깃발을 만든다는 주형설과 구별하자. RNA 편집도 이 다양성의 기작은 아니다.","cards":["IM-033","IM-038","IM-037"],"box":[[55,120,540,640]]},{"sid":"s4","obj":"큰 슬롯머신의 창에는 릴이 셋, 작은 슬롯머신의 창에는 릴이 둘 — 그 사이의 벌이 한 손으로는 큰 것의, 다른 손으로는 작은 것의 손잡이를 함께 당긴다","fact":"조합 수 = 중쇄(V × D × J) × 경쇄(V × J) — 예: 6,000 × 200 = 120만","hook":"큰 기계의 릴 셋 = 중쇄의 V · D · J · 작은 기계의 릴 둘 = 경쇄의 V · J · 두 손잡이를 함께 = 중쇄와 경쇄의 짝까지 곱한다","say":"릴의 수를 세어 보자. 큰 슬롯머신에는 릴이 셋, 작은 기계에는 둘이 있다. 중쇄는 V·D·J 세 조각을, 경쇄는 V·J 두 조각을 고른다. 벌이 두 손잡이를 한꺼번에 당긴다. 두 기계의 결과를 짝지어 깃발 하나를 만드므로 경우의 수를 곱한다. 중쇄가 V 50, D 20, J 6이면 50 × 20 × 6 = 6,000이다. 경쇄가 V 40, J 5이면 40 × 5 = 200이다. 두 사슬을 짝지으면 6,000 × 200 = 120만 가지다. 사슬 안의 조합을 먼저 곱한 뒤 중쇄와 경쇄의 수를 곱하자.","cards":["IM-036"],"box":[[150,455,380,125]]},{"sid":"s5","obj":"바닥의 밝은 빛 동그라미 속 — 별 깃발을 든 똑같은 벌 여럿이 앞의 한 벌 뒤로 부챗살처럼 겹쳐 솟는다 · 기둥 곁의 다른 벌들은 하나씩 그대로다","fact":"클론선택 — 그 항원에 맞는 림프구만 골라져 증식 · 분화(세포고사 아님)","hook":"별 깃발이 맞은 벌 하나 → 똑같은 별 깃발 벌 여럿 = 클론 증식 · 맞지 않은 벌은 그대로 = 골라지지 않음","say":"별 깃발이 별 돌기에 맞은 벌만 빛의 원 안에서 부챗살처럼 늘어난다. 같은 별 깃발을 든 벌들이 한 클론이다. 많은 림프구 가운데 해당 항원에 맞는 수용체를 가진 세포가 선택되어 증식하고 분화하는 클론선택이다. 선택된 B 세포가 하는 일은 세포고사가 아니라 증식이다. 기둥 옆 다른 벌들은 선택되지 않았을 뿐 하나씩 그대로 남아 있다.","cards":["IM-062","IM-064"],"box":[[695,790,345,245]]},{"sid":"s6","obj":"빛 동그라미 오른쪽 — 앉은 벌이 한 손으로 깃대를 쥐고, 다른 손의 쇠줄로 깃발 천을 간다(불똥) · 깃대는 그대로","fact":"다양성의 두 기작 = 재배열 + 체세포 과돌연변이 — 과돌연변이는 V(가변)에만","hook":"줄로 갈아 무늬가 조금씩 바뀜 = 체세포 과돌연변이 · 깃발 끝의 무늬 = V(가변) · 손대지 않는 깃대 = C(불변)","say":"빛의 원 오른쪽에 앉은 벌이 깃대를 쥔 채 작은 쇠줄로 깃발 천을 쓱쓱 갈아 불꽃을 낸다. 증식한 B 세포가 수용체를 조금씩 바꾸는 체세포 과돌연변이다. 바뀌는 곳은 항원과 접촉하는 무늬, V 가변부위뿐이다. 깃대인 C 불변부위는 그대로이므로 C 부위의 돌연변이라고 연결하면 틀리다. 슬롯머신의 유전자 재배열과 깃발의 줄질인 체세포 과돌연변이를 항체 다양성의 두 기작으로 함께 기억하자. 기출에서 가장 자주 묻는 내용이다.","cards":["IM-034","IM-035"],"box":[[1100,800,210,230]]},{"sid":"s7","obj":"오른쪽 아래 — 진홍 호스 위의 둥근 뚜껑 구멍에 벌이 똑같은 별 깃발을 밀어 넣고 · 다른 벌은 뚜껑을 붙잡았다 · 그 곁에 태엽이 멎은 벌이 소용돌이 눈으로 별 깃발 더미에 벌렁 누웠다","fact":"효과세포(형질세포) = 한 종류 항체만 · 대개 단명(골수의 장수형도) — 기억세포와 별개","hook":"똑같은 별 깃발만 = 한 종류 항체(단일 특이성) · 태엽이 멎어 쓰러짐 = 단명","say":"늘어난 별 깃발 벌 중 일부는 효과세포인 형질세포가 된다. 오른쪽 아래에서 진홍 호스의 둥근 뚜껑 구멍으로 모두 똑같은 별 깃발을 밀어 넣고 있다. 형질세포 하나가 한 종류의 항체만 만든다는 뜻이다. 한 B 세포, 한 항체로 연결하자. 곁의 벌 하나는 벌써 태엽이 멈추고 소용돌이 눈을 한 채 깃발 더미에 벌렁 누워 있다. 이 벌처럼 대부분의 형질세포는 항체를 쏟아 낸 뒤 곧 사라지는 단명 세포다. 다만 일부는 골수로 옮겨가 오래 살며 항체를 계속 만든다. 잠든 채 다시 만날 때를 기다리는 기억세포와는 다른 갈래다.","cards":["IM-063","IM-078","IM-079"],"box":[[1430,750,540,330]]},{"sid":"s8","obj":"오른쪽 벽의 이층 침대 — 흰 수염이 침대 밖으로 늘어질 만큼 자란 벌들이 두꺼운 빨간 책을 안고 자거나 펼쳐 읽는다","fact":"기억세포 = 장수 · 같은 항원의 재감염에 대비","hook":"흰 수염이 바닥까지 = 오래 잠(장수) · 두꺼운 빨간 책 = 기억(L13a 문간 병정의 책)","say":"다른 벌들은 오른쪽 이층 침대에서 두꺼운 빨간 책을 안고 자거나 펼쳐 읽고 있다. 빨간 책은 L13a 문간 병정의 책처럼 기억을 뜻한다. 침대 밖까지 자란 흰 수염은 몇 해를 잠들어 있었다는 단서다. 기억세포는 오래 살아남아 같은 항원의 재침입에 대비한다. 선택된 림프구는 곧바로 싸우는 효과세포와 오래 남아 기다리는 기억세포의 두 갈래로 나뉜다.","cards":["IM-063"],"box":[[1195,300,470,420]]},{"sid":"s9","obj":"오른쪽 위 아치 창 — 기둥의 세균과 똑같은 돌기 셋(머리의 노란 별 · 파란 세모 뿔 · 분홍 동그라미)이 돋은 초록 세균이 또 나타나 창턱에서 별 깃발 산에 파묻혔다 · 아랫칸의 수염 벌이 창 쪽으로 깃발을 던진다 / 가운데 기둥의 첫 세균에 닿은 깃발은 둘뿐","fact":"2차 반응 = 기억세포가 곧장 형질세포로 — 빠르고 높다 / 1차 = 느리고 낮다","hook":"같은 별 돌기의 둘째 세균 = 같은 항원의 재감염 · 깃발 산 = 많은 항체 · 기둥의 깃발 둘 = 1차는 적다","say":"오른쪽 위 창에 기둥의 세균과 같은 돌기 셋을 가진 세균이 다시 나타났다. 같은 항원의 재침입이다. 수염 벌이 침대에서 뛰쳐나와 별 깃발을 던지자 세균은 창턱에서 벌써 깃발 산에 묻혀 있다. 기억세포가 빠르게 형질세포로 분화하고 증식하는 2차 면역반응이다. 가운데의 첫 세균에는 깃발이 겨우 둘 붙었다. 처음에는 맞는 세포를 선택하고 증식시키는 데 시간이 필요하기 때문이다. 그래프에서 1차 반응은 늦고 낮게, 2차 반응은 빠르고 높게 나타난다.","cards":["IM-065","IM-066"],"box":[[1540,120,470,520],[900,420,200,340]]},{"sid":"s10","obj":"탑 안 바닥의 밝은 빛 동그라미 — 벌이 불어나고 깃발 끝을 가는 곳 · 다 만든 깃발은 진홍 호스의 뚜껑 구멍으로 들어간다(호스 속에서 깃발을 만드는 벌은 없다)","fact":"2차 반응 — 배중심에서 B 세포가 다듬어지고 형질세포가 항체를 낸다(혈액 아님)","hook":"탑 안 = 림프조직 · 빛 동그라미 = 배중심(림프소포 가운데의 밝은 자리) · 진홍 호스 = 혈관(L13b) — 만든 깃발을 나를 뿐","say":"깃발을 만드는 곳을 보자. 탑 바닥의 밝은 빛 원 안에서 벌들이 증식하고 깃발 끝을 다듬는다. 탑은 림프조직, 밝은 원은 배중심이다. 현미경에서 림프소포의 가운데가 밝게 보이는 부위다. 혈관인 진홍 호스는 완성된 깃발을 벽 구멍 밖 성 곳곳으로 운반할 뿐, 호스 안에서 깃발을 만드는 벌은 없다. 배중심에서는 B 세포가 증식하며 항원에 더 잘 붙도록 다듬어지고, 여기서 자란 형질세포가 림프조직과 골수에서 항체를 대량으로 만든다. 2차 면역반응의 항체는 이렇게 림프조직에서 만들어진다. 혈액에서 합성된다는 설명과 구별하자.","cards":["IM-067"],"box":[[585,770,850,300],[1520,860,250,140]]},{"sid":"s11","obj":"왼쪽 아래 나무 의자 — 태엽 벌의 몸에 검은 게의 집게발과 게 다리가 돋은 괴물이 태엽을 저절로 빙빙 돌리며 똑같은 별 깃발을 고리버들 바구니에 넘치도록 담는다","fact":"단클론 항체 = 한 클론 · 한 항원결정부위 / 하이브리도마 = B + 암세포 → 불멸","hook":"작은 검은 게 = 암(덱의 약속) · 벌 몸에 돋은 게 집게발 · 다리 = 융합(하이브리도마) · 저절로 도는 태엽 = 멈추지 않음(불멸) · 바구니의 똑같은 별 깃발 = 단클론 항체","say":"왼쪽 아래 의자에 앉은 태엽 벌을 보자. 몸에는 작은 검은 게의 집게발과 다리가 돋아 있다. 이 덱에서 검은 게는 암이므로, B 세포와 암세포를 하나로 붙인 융합세포 하이브리도마다. 두 세포를 붙인 이유도 떠올려 보자. 형질세포의 태엽은 금방 멈추지만, 암세포는 멈추지 않고 분열한다. 둘을 붙이면 B 세포가 불멸성을 얻으므로 태엽이 저절로 빙빙 돈다. 단순히 항체 생산을 돕는다는 설명이 함정이며, 목적은 불멸화다. 이 괴물에 배지가 없는 것은 몸에서 자란 세포가 아니라 실험실에서 붙여 만든 세포라는 단서다. 바구니에는 똑같은 별 깃발만 끝없이 쌓인다. 한 B 세포 클론에서 나와 한 항원결정부위에만 결합하는 단클론 항체다.","cards":["IM-084","IM-085"],"box":[[95,740,520,385]]}],"cq":{"IM-027":["적응 면역의 두 주역 세포는?","B세포 · T세포"],"IM-028":["B세포는 항원을 어떻게 인식하나?","자유 항원 또는 병원체 표면 항원을 직접 인식(BCR)"],"IM-030":["B세포 수용체와 T세포 수용체의 이름은?","B세포=BCR / T세포=TCR"],"IM-005":["적응 면역은 무엇을 인식하나? (인식 대상)","특정 항원결정부위(epitope)"],"IM-031":["수용체와 결합하는 항원의 부위를 뭐라 하나?","항원결정부위(epitope)"],"IM-032":["항원 하나에 항원결정부위는 몇 개?","여러 개 존재 가능"],"IM-033":["B세포와 T세포의 수용체 다양성은 어떻게 만들어지나?","유전자 재배열(V(D)J)로 — 항원 만나기 전에 이미 다양한 풀 형성"],"IM-038":["클론선택설에서 항체 특이성은 언제 결정되나?","항원 노출 전에 유전자 재배열로 미리 결정"],"IM-037":["항체 다양성 기작이 아닌 것은? (RNA 편집·항원에 맞춰 접힘)","RNA 편집·주형설(항원에 맞춰 접힘)은 다양성 기작 아님"],"IM-036":["중쇄 V=50, D=20, J=6 / 경쇄 V=40, J=5일 때 총 항체 조합 수는?","중쇄 50×20×6=6,000 × 경쇄 40×5=200 = 1,200,000"],"IM-062":["클론선택(clonal selection)이란?","특정 항원을 인식하는 림프구만 선택되어 증식·분화"],"IM-064":["클론선택에서 선택된 B세포는 증식하나 세포고사하나?","증식(proliferation) — 세포고사 아님"],"IM-034":["항체(림프구) 다양성을 만드는 두 기작은?","유전자 재배열(V(D)J) + 체세포 과돌연변이"],"IM-035":["체세포 과돌연변이는 항체의 어느 부위에서 일어나나?","V(가변)부위 — C(불변)부위 아님"],"IM-063":["선택된 림프구가 나뉘는 두 종류는?","효과기세포(곧바로 싸움 · 대개 단명) · 기억세포(장수, 재감염 대비)"],"IM-078":["형질세포(plasma cell)는 몇 종류의 항체를 만드나?","한 종류(단일 특이성) 항체만"],"IM-079":["형질세포는 장수하나 단명하나?","대개 단명 — 일부는 골수에서 오래 살며 항체를 계속 만든다 · 기억세포와 별개"],"IM-065":["2차 면역반응이 1차보다 빠른 이유는?","기억세포가 신속히 형질세포로 전환·증식"],"IM-066":["1차 vs 2차 면역반응 그래프에서 읽을 것은?","1차=낮고 느린 항체 상승 / 2차=빠르고 높은 상승"],"IM-067":["2차 면역반응의 항체 합성은 주로 어디서 일어나나?","림프조직 — 배중심에서 B 세포가 다듬어지고 형질세포가 림프조직 · 골수에서 항체를 만든다(혈액 아님)"],"IM-084":["단클론(단일클론) 항체란?","하나의 B세포 클론에서 유래, 특정 항원결정부위에 특이적"],"IM-085":["하이브리도마에서 암세포와 B세포 융합의 목적은?","B세포에 불멸성(계속 분열) 부여"]},"hubPanel":null};

function draw() {
  let s = '';

    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);

const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
</html>
