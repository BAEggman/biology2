<script>
/* lesson_store.js — 과 목록 · 과 화면이 함께 쓰는 저장 도우미(보기 화면 명세 §1.1).
   빌드(build_lesson.js)가 두 화면에 그대로 끼워 넣는다(__STORE__) — 열쇠 이름 · 꼴이 한 군데서만 정해진다.
   열쇠: lesson_stars {ID: 찍은 때(ms)} · lesson_prefs {onlyStar, autoNext, rep, scope} · lesson_ab_<ID> {a: sid, b: sid}
   읽기 · 쓰기는 모두 try/catch — 저장이 막힌 브라우저에서는 그 쪽을 떠날 때까지만 기억하고 오류를 내지 않는다.
   (lesson_<ID> · lesson_shuffle · lesson_srs_inbox · lesson_auto_start 는 여기서 건드리지 않는다) */
const LStore = (() => {
  const mem = {};
  const rd = (k, d) => {
    let ok = false;
    try { const v = localStorage.getItem(k); ok = true; if (v !== null && v !== undefined) { const o = JSON.parse(v); mem[k] = o; return o; } } catch (e) {}
    if (ok) { delete mem[k]; return d; }   // 저장소는 멀쩡한데 값이 없다 = 다른 탭에서 지웠다 — 메모리 값도 버린다
    return k in mem ? mem[k] : d;
  };
  const wr = (k, o) => { mem[k] = o; try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) {} };
  const del = k => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} };
  const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
  const REP = ['off', 'ab', 'one', 'list'];
  return {
    stars() { const s = rd('lesson_stars', {}); return isObj(s) ? s : {}; },
    isStar(id) { return id in LStore.stars(); },
    setStar(id, on) {
      const s = { ...LStore.stars() };
      if (on) s[id] = Date.now(); else delete s[id];
      if (Object.keys(s).length) wr('lesson_stars', s); else del('lesson_stars');
      return on;
    },
    prefs() {
      const p = rd('lesson_prefs', {}); const o = isObj(p) ? p : {};
      return { onlyStar: !!o.onlyStar, autoNext: !!o.autoNext, rep: REP.includes(o.rep) ? o.rep : 'off', scope: o.scope === 'star' ? 'star' : 'all' };
    },
    setPrefs(patch) { const p = { ...LStore.prefs(), ...patch }; wr('lesson_prefs', p); return p; },
    ab(id) { const v = rd('lesson_ab_' + id, null); return isObj(v) ? { a: typeof v.a === 'string' ? v.a : null, b: typeof v.b === 'string' ? v.b : null } : { a: null, b: null }; },
    setAb(id, v) { const k = 'lesson_ab_' + id; if (v && (v.a || v.b)) wr(k, { a: v.a || null, b: v.b || null }); else del(k); },
    REP,
  };
})();

const L = {"id":"L46a","scene":"s46","part":"a","title":"네 방 집과 두 바퀴 관 — 심장의 방 · 판막 · 폐순환 · 체순환 · 박동 · 박출량","sub":"앞을 잘라 낸 이층 집(심장 · 교과서 해부도 방향 — 보는 이의 왼쪽 = 오른쪽 심장) · 위 작은 방(심방) · 아래 큰 방(심실) · 벽이 가장 두꺼운 오른쪽 아래 방(좌심실) · 날개 셋 · 둘 뚜껑문(삼첨판 · 이첨판) · 노란 반달 그린 문(반달판막) · 유턴 금지 표지판(역류 방지) · 문 없는 통벽(중격) · 지붕의 폐 풍선(폐순환) · 큰 사람(체순환) · 정수리 관 · 다리 관(상 · 하대정맥) · 나가면 동맥 · 정수리 관 곁 진자 시계 + 온도계(동방결절 · 자동성 · 체온) · 통벽 아래 빨간 신호등(방실결절 지연) · 큰 사람의 삼각 플라스크(일회박출량 · 수축기 / 이완기) · 높이 받쳐 든 유리 물병(심박출량 5 L · 운동 5배)","img":"img/L46a.webp?v=3d2ac504a2d4","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"앞을 잘라 낸 이층 집 — 위에 작은 방 둘 · 아래에 큰 방 둘 · 왼쪽 두 방은 회청 물 · 오른쪽 두 방은 진홍 물 (틀)","fact":"심방 = 받는 방(위 · 작다) · 심실 = 내보내는 방(아래 · 크다) · 2심방 2심실(포유류 · 조류)","hook":"위 작은 방 = 받는 심방 · 아래 큰 방 = 미는 심실","say":"앞벽을 잘라 내부가 보이는 이층 집이 심장이다. 위의 작은 방 둘은 피를 받는 심방, 아래의 큰 방 둘은 피를 밀어내는 심실이다. 포유류와 조류의 심장은 이렇게 2심방 2심실이다. 집이 해부도처럼 우리를 마주 보고 있다는 점부터 기억하자. 보는 사람의 왼쪽이 심장의 오른쪽이므로 왼쪽 두 방은 우심방과 우심실이다. 여기의 회청 물은 산소가 적은 혈액이고, 보는 사람 오른쪽 두 방의 진홍 물은 산소가 많은 혈액이다.","box":[560,400,890,580],"src":["s46p01#0"],"cards":["H0-10","H0-11","H0-20","H0-19","H0-281"]},{"sid":"s2","obj":"오른쪽 아래 방만 갈색 벽이 두툼하게 둘러쳐 방 안이 좁아 보인다 — 왼쪽 아래 방은 벽이 얇다","fact":"좌심실 — 온몸으로 높은 압력을 내야 해 벽이 가장 두껍다 · 일회박출량은 좌우가 같다","hook":"가장 두꺼운 벽 = 좌심실 · 많이가 아니라 세게","say":"보는 사람의 오른쪽 아래 방, 좌심실을 보자. 갈색 벽이 두꺼워 방 안이 좁아 보인다. 오른쪽에 서 있는 큰 사람의 온몸까지 피를 보내려면 높은 압력이 필요하므로, 좌심실 벽은 우심실보다 약 세 배 두껍다. 왼쪽 아래의 우심실은 지붕 위 폐까지만 보내므로 벽이 얇다. 다만 벽이 두껍다고 한 번에 더 많은 피를 보내는 것은 아니다. 좌우의 일회박출량은 같고, 다른 것은 압력이다.","box":[995,635,450,345],"src":["s46p01#1"],"cards":["H0-47","H0-48"]},{"sid":"s3","obj":"위 방과 아래 방 사이 바닥의 뚜껑문 — 그림 왼쪽은 나무 날개 셋 · 그림 오른쪽은 날개 둘 · 날개는 아래 방 쪽으로 늘어져 열렸다","fact":"방실판막 — 심방과 심실 사이 · 심장 오른쪽(날개 셋) 삼첨판 · 심장 왼쪽(날개 둘) 이첨판(승모판)","hook":"날개 셋 = 삼첨판 · 날개 둘 = 이첨판(승모판)","say":"위아래 방 사이 바닥의 뚜껑문은 심방과 심실 사이의 방실판막이다. 보는 사람 왼쪽, 심장의 오른쪽 문은 나무 날개가 셋이므로 삼첨판이다. 보는 사람 오른쪽, 심장의 왼쪽 문은 날개 둘의 이첨판이며 승모판이라고도 한다. 날개가 모두 아래 방 쪽으로 늘어져 열리므로 피는 위 방에서 아래 방으로만 떨어진다. 심방에서 심실로 흐르는 방향을 따라가자.","box":[[635,600,335,170],[1035,650,315,145]],"src":["s46p01#2"],"cards":["H0-40","H0-41","H0-42"]},{"sid":"s4","obj":"아래 두 방의 바깥벽에서 활짝 열린 문 둘 — 문짝마다 노란 반달(곧은 지름이 있는 반원 · 곰보 자국)","fact":"반달판막(반월판) — 심실과 동맥 사이 · 우심실–폐동맥판 · 좌심실–대동맥판","hook":"반달 그린 문 = 반달판막 · 아래 방에서 바깥 관으로","say":"아래 두 방의 바깥벽에는 문이 하나씩 활짝 열려 있고 문짝마다 노란 반달이 그려져 있다. 둥근 달을 반으로 자른, 곧은 지름이 있는 반달 모양에서 반달판막, 반월판이라는 이름을 떠올리자. 심실과 동맥 사이에 있는 판막이다. 왼쪽 문 앞에서 위로 올라가는 회청 관은 폐로 가는 폐동맥이고, 오른쪽 문 뒤에서 나오는 진홍 관은 온몸으로 가는 대동맥이다. 따라서 보는 사람 왼쪽 문은 폐동맥판, 오른쪽 문은 대동맥판이다.","box":[[335,700,140,265],[1425,700,160,265]],"src":["s46p01#3"],"cards":["H0-43","H0-44","H0-45"]},{"sid":"s5","obj":"두 반달 문 앞에 하나씩 꽂힌 유턴 금지 표지판 — 빨간 테 · 사선 · 되돌아 내려오는 화살","fact":"판막의 일 = 피가 거꾸로 흐르는 것(역류)을 막는다 · 문 넷 모두 한쪽으로만 열린다","hook":"유턴 금지 = 역류 금지","say":"반달 문 앞에는 빨간 테두리의 유턴 금지 표지판이 하나씩 있다. 되돌아오는 화살표를 사선으로 가로막았다. 나갈 수는 있지만 거꾸로 들어올 수 없다는 뜻이다. 판막의 역할은 하나, 혈액의 역류를 막는 것이다. 바깥문 둘과 바닥의 뚜껑문 둘 모두 한쪽으로만 열려, 심방에서 심실로, 심실에서 동맥으로 흐르게 한다.","box":[[300,845,125,225],[1460,882,120,200]],"src":["s46p01#4"],"cards":["H0-46"]},{"sid":"s6","obj":"집 한가운데를 지붕 밑에서 바닥까지 가르는 문 없는 통벽 — 왼쪽 회청 물과 오른쪽 진홍 물이 섞이지 않는다","fact":"오른 → 왼 심장은 폐를 거쳐 · 왼 → 오른은 온몸을 거쳐 이어진다 · 벽에 구멍 = 중격 결손","hook":"문 없는 통벽 = 중격 · 구멍 = 결손","say":"집 가운데를 지붕 밑에서 바닥까지 가르는 벽에는 문이 없다. 이 벽이 중격이다. 왼쪽 회청 물과 오른쪽 진홍 물이 섞이지 않는 이유다. 오른심장과 왼심장은 직접 통하지 않고 폐와 온몸을 거쳐 연결된다. 중격에 구멍이 생긴 중격 결손에서는 산소가 적은 피와 많은 피가 섞인다. 혈액의 길을 한 줄로 따라가 보자. 심방, 심실, 폐, 다시 심방과 심실, 온몸을 거쳐 심방으로 돌아온다.","box":[960,400,60,580],"src":["s46p02#0"],"cards":[]},{"sid":"s7","obj":"왼쪽 아래 방 문간에서 나온 회청 관이 반달 문 앞을 지나 바깥벽을 타고 올라 지붕의 폐 풍선으로 · 흰 방울이 속도선을 달고 왼쪽 폐로 빨려 들어가고 · 오른쪽 폐에서는 어두운 연기 방울이 피어올라 나간다 · 반대쪽 폐에서 진홍 관이 오른쪽 위 방으로 내려온다","fact":"폐순환 — 우심실 → 폐동맥 → 폐(O₂ · CO₂ 교환) → 폐정맥 → 좌심방","hook":"회청 관 들고 진홍 관 나는 지붕 = 폐순환","say":"왼쪽 아래 우심실 문간에서 나온 회청 관이 반달 문 앞을 지나 바깥벽을 따라 올라가 지붕의 분홍 폐 풍선에 들어간다. 폐동맥이다. 왼쪽 폐로는 속도선이 달린 흰 산소 방울이 빨려 들어가고, 오른쪽 폐에서는 어두운 이산화탄소 연기 방울이 피어올라 빠져나온다. 폐 모세혈관에서 산소를 받고 이산화탄소를 내놓는 기체 교환이 일어나는 모습이다. 그곳에서 관의 색이 진홍으로 바뀌고, 폐정맥을 나타내는 진홍 관이 오른쪽 위 좌심방으로 내려온다. 우심실에서 출발해 좌심방으로 돌아오는 이 고리가 폐순환이다. 포유류의 혈액은 폐에서 기체를 교환하는 폐순환과, 이어서 볼 온몸의 체순환이라는 두 고리를 돈다.","box":[[378,840,160,52],[378,228,50,660],[378,225,452,52],[800,60,400,310],[1160,215,125,240]],"src":["s46p02#1"],"cards":["H0-29","H0-33","H0-31","H0-35","H0-34","H0-25","H0-27"]},{"sid":"s8","obj":"벽 두꺼운 오른쪽 아래 방의 반달 문이 우리 쪽으로 젖혀 열렸고 · 그 문짝 뒤에서 빠져나온 진홍 관이 오른쪽에 선 큰 사람의 가슴에 꽂혔다","fact":"체순환 — 좌심실 → 대동맥 → 온몸(물질 교환) → 대정맥 → 우심방","hook":"두꺼운 방 → 진홍 관 → 큰 사람 = 체순환","say":"벽이 두꺼운 오른쪽 아래 좌심실의 반달 문을 보자. 우리 쪽으로 열린 문짝의 흰 화살표가 나가는 방향을 가리킨다. 문 뒤에서 나온 진홍 관은 위로 휘어 오른쪽 큰 사람의 가슴에 연결된다. 큰 사람은 온몸을 나타낸다. 좌심실에서 대동맥을 따라 온몸으로 나가는 경로가 체순환이다. 벽이 가장 두꺼운 방이 가장 먼 곳까지 혈액을 밀어낸다. 앞서 보았던 두꺼운 벽과 이 경로를 연결하자. 온몸의 조직에서 혈액은 산소와 양분을 내주고 이산화탄소와 노폐물을 받는다. 폐순환이 폐와의 기체 교환이라면 체순환은 온몸 조직과의 물질 교환이다.","box":[[1575,700,265,190],[1700,620,300,320]],"src":["s46p02#2"],"cards":["H0-30","H0-36","H0-28","H0-283"]},{"sid":"s9","obj":"큰 사람의 정수리에 꽂힌 회청 관이 하늘을 건너 지붕을 뚫고 왼쪽 위 방으로 · 다리에서 나온 회청 관은 집 밑을 지나 왼쪽 바깥벽을 타고 올라 같은 방으로","fact":"상대정맥(머리 · 목 · 팔) · 하대정맥(몸통 · 하체) → 둘 다 우심방으로","hook":"정수리 관 = 상대정맥 · 다리 관 = 하대정맥 · 둘 다 왼쪽 위 방","say":"큰 사람의 정수리에서 나온 회청 관은 하늘을 가로질러 지붕으로 들어가 왼쪽 위 우심방에 닿는다. 머리, 목, 팔에서 혈액이 돌아오는 상대정맥이다. 다리에서 나온 회청 관은 집 아래를 지나 왼쪽 바깥벽을 따라 올라가, 우심방 높이의 옆 창으로 들어간다. 몸통과 하체에서 돌아오는 하대정맥이다. 정수리 관은 천장으로, 다리 관은 옆벽으로 들어오지만 도착지는 같은 우심방이다. 위쪽에서 오는 상대정맥과 아래쪽에서 오는 하대정맥을 함께 연결하자.","box":[[1845,36,55,450],[675,30,1225,50],[665,36,52,450],[1660,920,135,190],[175,1068,1530,52],[175,480,52,640],[175,478,345,55]],"src":["s46p02#3"],"cards":["H0-32","H0-38","H0-39"]},{"sid":"s10","obj":"관 빛깔이 바뀌는 자리 둘 — 지붕의 폐(회청 → 진홍) · 큰 사람(진홍 → 회청) · 반달 문으로 나가는 관 = 동맥 (되짚기)","fact":"동맥 = 심장에서 나가는 관 · 정맥 = 들어오는 관 → 폐동맥엔 산소가 적다","hook":"빛깔이 아니라 방향 — 나가면 동맥","say":"관의 색이 바뀌는 곳은 폐와 온몸 두 군데뿐이다. 지붕의 폐에서는 회청이 진홍으로, 큰 사람의 몸에서는 진홍이 회청으로 바뀐다. 이제 색 대신 흐르는 방향으로 혈관 이름을 구별하자. 심장에서 나가면 동맥, 심장으로 들어오면 정맥이다. 그래서 그림 왼쪽 반달 문으로 나가는 회청색 폐동맥에는 산소가 적은 피가 흐르고, 폐에서 내려오는 진홍색 폐정맥에는 산소가 많은 피가 흐른다. 폐동맥은 산소가 적은 혈액을 폐로, 폐정맥은 산소를 받은 혈액을 심장으로 나른다. 기출에서 가장 즐겨 묻는 함정이다. 혈액 자체의 이름은 별개다. 산소가 많고 이산화탄소가 적으면 동맥혈, 산소가 적고 이산화탄소가 많으면 정맥혈이다.","box":[[760,55,490,315],[1600,470,400,610],[335,700,140,265],[1425,700,160,265]],"src":["s46p02#4"],"cards":["H0-12","H0-13","H0-14","H0-15","H0-207","H0-208"]},{"sid":"s11","obj":"왼쪽 위 방 — 정수리 관이 천장으로 들어오는 바로 곁 벽에 걸린 진자 시계 · 아무도 태엽을 감지 않는데 금빛 진자가 흔들린다 · 곁에 빨간 온도계","fact":"동방결절(상대정맥이 우심방에 닿는 곳) — 스스로 박동(자동성) · 체온 1 ℃↑ → 분당 약 10회↑","hook":"정수리 관 곁 진자 시계 = 동방결절 · 혼자 흔들림 = 자동성 · 온도계 = 체온","say":"왼쪽 위 우심방에서 상대정맥이 천장으로 들어오는 바로 곁을 보자. 진자 시계가 걸려 있다. 이 덱에서 진자는 늘 심장 박동을 뜻하며, 이 시계는 심장의 박동원인 동방결절이다. 상대정맥과 우심방이 만나는 부근이라는 위치가 단서다. 아무도 태엽을 감지 않아도 진자가 저 혼자 움직이는 것은 심장근육이 외부 신경 없이 스스로 박동하는 자동성, 또는 자율성을 나타낸다. 신경은 박동의 속도를 조절할 뿐 시작시키는 것은 아니다. 곁의 빨간 온도계도 보자. 몸이 더워지면 진자가 빨라진다. 체온이 1 ℃ 오르면 심박수가 1분에 약 10번 늘 수 있다.","box":[705,422,92,140],"cards":["H0-57","H0-59","H0-75"]},{"sid":"s12","obj":"같은 방 오른쪽, 통벽 아래쪽에 붙은 신호등 — 빨간불만 켜졌다 · 그 왼쪽 바닥 한가운데에 나무 날개 셋 뚜껑문","fact":"방실결절 — 박동 신호를 잠깐 늦춰 심방 피가 먼저 심실을 채우게 한다","hook":"통벽 아래 빨간불 = 방실결절 지연 · 그동안 뚜껑문으로 물이 다 내려간다","say":"같은 방의 오른쪽, 통벽 아래쪽에 빨간불만 켜진 신호등이 있다. 동방결절 시계에서 나온 신호는 먼저 위의 두 심방을 수축시키고 이 신호등에서 잠깐 지연된다. 방실결절이며, 심방과 심실 사이 중격 아래쪽에 위치한다. 신호등 바로 왼쪽, 바닥 한가운데에 날개 셋의 삼첨판 뚜껑문이 열려 있다. 빨간불인 동안 위 방의 물이 뚜껑문으로 아래 방에 다 내려간다. 심방이 짜낸 피로 심실을 채울 시간을 주는 것이 방실결절 지연의 의미다. 불이 바뀌면 신호가 통벽을 따라 아래 심실로 내려가고, 그제야 아래 방들이 수축한다.","box":[930,506,52,118],"cards":["H0-62"]},{"sid":"s13","obj":"큰 사람이 진홍 관 끝 바로 곁, 배 앞에 든 작은 삼각 플라스크 — 진홍 물이 담겼다","fact":"일회박출량 = 한 번 수축에 심실이 내보내는 피(휴식 때 약 70 mL)","hook":"한 플라스크 = 한 번 뛸 때 · 반달 문 열림 = 수축기 · 뚜껑문 열림 = 이완기","say":"큰 사람이 진홍 관 끝 바로 곁, 배 앞에서 들고 있는 작은 삼각 플라스크에는 진홍 물이 담겨 있다. 심실이 한 번 수축할 때 반달 문으로 내보내는 일회박출량이며, 휴식 시 약 70 mL이다. 심실이 수축해 피를 내보내는 수축기에는 반달 문이 열리고 심방과 심실 사이 뚜껑문은 닫힌다. 심실이 이완하며 위에서 피를 받는 이완기에는 뚜껑문이 열리고 반달 문은 닫힌다. 그림은 두 시점을 한 장에 담아 문이 모두 열린 것처럼 보이지만, 실제로는 번갈아 열린다는 점을 구별하자.","box":[[1795,725,110,135],[1425,700,160,265],[1035,650,315,145]],"cards":["H0-49","H0-50","H0-52","H0-53"]},{"sid":"s14","obj":"큰 사람이 반달 문 쪽 손바닥 위에 높이 받쳐 든 손잡이 달린 커다란 유리 물병 — 진홍 물이 담겼다","fact":"심박출량 = 좌심실이 1분에 내보내는 피 = 72회 × 70 mL ≈ 5 L · 운동 때 약 5배","hook":"1분에 한 병(5 L) · 운동하면 다섯 병 — 5가 두 번","say":"반달 문 쪽 손바닥에 받쳐 높이 든, 손잡이 달린 큰 유리 물병을 보자. 진홍 물을 담은 이 병은 좌심실이 1분 동안 내보내는 양인 심박출량이다. 휴식 시 심박수 약 72번에 일회박출량 70 mL를 곱하면 약 5 L, 물병 하나가 된다. 격한 운동에서는 조직의 산소 요구가 커져 심박수가 1분에 200번 가까이 증가하고 일회박출량도 늘어난다. 따라서 심박출량은 휴식 때의 약 5배까지 올라갈 수 있다. 물병 하나가 5 L이고 운동할 때는 다섯 병이라는 두 가지 5를 연결해 기억하자.","box":[1488,430,255,285],"cards":["H0-51","H0-54","H0-55","H0-56"]}],"cq":{"H0-10":["심장으로 들어오는 혈액을 받아들이는 방은?","심방"],"H0-11":["심장에서 혈액을 내보내는 방은?","심실"],"H0-20":["포유류의 심장 구조는?","2심방 2심실"],"H0-19":["조류의 심장 구조는?","2심방 2심실"],"H0-281":["심방과 심실을 비교하면?","심방은 받는 방, 심실은 내보내는 방"],"H0-47":["좌심실이 우심실보다 벽이 더 두꺼운 이유는?","전신으로 더 높은 압력의 혈액을 보내야 하기 때문"],"H0-48":["좌심실과 우심실의 일회박출량은 같은가?","예, 같다"],"H0-40":["방실판막(AV valve)이란?","심방과 심실 사이의 판막"],"H0-41":["오른쪽 방실판막의 이름은?","삼첨판"],"H0-42":["왼쪽 방실판막의 이름은?","이첨판 또는 승모판"],"H0-43":["반달판막(semilunar valve)이란?","심실과 동맥 사이에 있는 판막"],"H0-44":["폐동맥 쪽 반달판막은?","폐동맥판"],"H0-45":["대동맥 쪽 반달판막은?","대동맥판"],"H0-46":["판막의 기능은?","혈액의 역류를 막는 것"],"H0-29":["우심실에서 시작하는 순환은?","폐순환"],"H0-33":["포유류 순환에서 우심실 다음 혈관은?","폐동맥"],"H0-31":["좌심방으로 돌아오는 혈액은 어디서 오는가?","폐정맥을 통해 폐에서 온다"],"H0-35":["폐에서 좌심방으로 돌아오는 혈관은?","폐정맥"],"H0-34":["폐모세혈관에서 일어나는 핵심은?","산소와 이산화탄소의 교환"],"H0-25":["포유류의 두 순환 고리는?","폐순환과 체순환"],"H0-27":["폐순환이란?","심장과 폐 사이를 오가며 기체교환을 담당하는 순환"],"H0-30":["좌심실에서 시작하는 순환은?","체순환"],"H0-36":["좌심실에서 전신으로 혈액을 내보내는 큰 혈관은?","대동맥"],"H0-28":["체순환이란?","심장과 몸조직 사이를 오가며 물질교환을 담당하는 순환"],"H0-283":["폐순환과 체순환을 비교하면?","폐순환은 폐와의 기체교환 · 체순환은 몸조직과의 물질교환"],"H0-32":["우심방으로 돌아오는 혈액은 어디서 오는가?","상·하대정맥을 통해 몸조직에서 온다"],"H0-38":["머리·목·팔에서 온 혈액이 모이는 큰 정맥은?","상대정맥"],"H0-39":["몸통·하체에서 온 혈액이 모이는 큰 정맥은?","하대정맥"],"H0-12":["동맥의 정의를 한 문장으로 쓰면?","혈액을 심장에서 바깥으로 보내는 혈관"],"H0-13":["정맥의 정의를 한 문장으로 쓰면?","혈액을 심장으로 되돌리는 혈관"],"H0-14":["정맥혈의 일반적 특징은?","산소가 적고 이산화탄소가 많다"],"H0-15":["동맥혈의 일반적 특징은?","산소가 많고 이산화탄소가 적다"],"H0-207":["폐동맥의 기능은?","저산소 혈액을 폐로 운반"],"H0-208":["폐정맥의 기능은?","고산소 혈액을 폐에서 심장으로 운반"],"H0-57":["심장근육이 외부 신경 없이도 자동으로 박동할 수 있는 성질은?","자율성 또는 자동성"],"H0-59":["동방결절(SA node)의 위치는?","상대정맥과 우심방이 만나는 부위"],"H0-75":["체온이 1도 상승할 때 심박수는 대략 어떻게 변하는가?","분당 약 10회 증가할 수 있다"],"H0-62":["AV node 지연의 의의는?","심방 혈액이 심실로 먼저 채워질 시간을 주기 때문"],"H0-49":["수축기(systole)란?","심실이 수축해 혈액을 내보내는 시기"],"H0-50":["이완기(diastole)란?","심장이 이완되어 혈액을 받는 시기"],"H0-52":["일회박출량(stroke volume)이란?","한 번 박동할 때 심실이 내보내는 혈액량"],"H0-53":["휴식 시 일반적인 일회박출량은?","약 70 mL"],"H0-51":["심박출량(cardiac output)이란?","좌심실이 1분 동안 내보내는 혈액량"],"H0-54":["휴식 시 분당 72회, 일회박출량 70mL면 심박출량은?","약 5 L/min"],"H0-55":["격한 운동 시 심박출량이 증가하는 이유는?","조직의 산소 요구량 증가를 충족하기 위해"],"H0-56":["격한 운동 시 심박출량은 휴식 대비 대략 얼마까지 증가하는가?","약 5배(분당 ~200회까지)"]},"hubPanel":"s46p01"};

$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
</html>
