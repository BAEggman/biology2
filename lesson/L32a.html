<script>
const L = {"id":"L32a","scene":"s32","part":"a","title":"맑은 날 담장의 펌프집 넷 — 전자전달계와 화학삼투","sub":"네 집의 간판으로 I·II의 탈수소효소, III의 bc₁, IV의 사이토크롬 c 산화효소를 복원한다. 지붕의 국자로 H⁺ 펌프 세 곳을, 두 종류의 수레로 Q와 이동성 c의 경로를 따라간다.","img":"img/L32a.webp?v=bded6b933d90","w":2048,"h":1382,"stops":[{"sid":"s1","obj":"그림을 가로지르는 붉은 벽돌 담장 · 앞쪽 마른 모래 마당 · 담장 뒤 꼭대기까지 찬 바다 (틀)","fact":"전자전달계는 미토콘드리아 내막 · 산화적 인산화 = 전자전달 + 화학삼투 · ATP 대부분","hook":"붉은 벽돌 담장 = 미토콘드리아 내막 · 앞마당 = 기질 · 뒤 바다 = 막간공간","say":"시트르산 회로에서 받은 전자를 따라 긴 붉은 벽돌 담장 앞으로 왔다. 햇빛이 밝은 날이다. 담장은 미토콘드리아 내막, 앞마당은 기질, 담장 뒤 바다는 막간공간이다. 전자전달계는 이 내막에 자리한다. 간판 장식은 복합체의 이름을, 지붕 국자는 H⁺ 펌프를 나타낸다. 노란 공인 전자가 집 사이를 이동하는 과정과, 뒤에 쌓인 물이 물레방아를 돌리는 과정을 함께 보자. 전자전달과 화학삼투를 합쳐 산화적 인산화라고 한다. 세포호흡의 마지막 단계이며 대부분의 ATP가 여기서 만들어진다. 미토콘드리아가 없는 원핵생물에서는 해당과정과 시트르산 회로가 세포질에서 일어나고, 전자전달계와 ATP 합성효소는 세포막에 있다. 해당과정의 각뿔에서 동전을 직접 떼던 기질수준 인산화에는 담장이나 물레방아가 필요하지 않았다.","box":null,"src":["s32u01#0"],"cards":["B1-7","B1-158","B1-115","A0-99","B1-24","B1-25","B1-114","B1-204","B1-3#4","C0-150","B1-10","A0-174"]},{"sid":"s2","obj":"첫째 · 셋째 · 넷째 집 지붕을 뚫고 솟은 근육 팔 — 커다란 나무 국자로 물을 퍼 담장 너머 바다로 던진다","fact":"복합체 I · III · IV 가 H⁺ 를 기질에서 막간공간으로 퍼낸다(펌프)","hook":"국자 쥔 팔 = H⁺ 펌프 · 팔 달린 집 = I · III · IV","say":"담장에 박힌 나무 펌프집 네 채를 왼쪽부터 보자. 복합체 I, II, III, IV이다. 첫째·셋째·넷째 집에서는 지붕을 뚫고 솟은 진짜 근육 팔이 큰 나무 국자로 물을 퍼 바다 쪽으로 던진다. 물은 H⁺이고, 앞마당에서 바다로 옮기는 것은 기질에서 막간공간으로 펌프하는 과정이다. 복합체 I, III, IV가 이 일을 한다. 이미 높은 바다로 더 퍼 올리듯, H⁺ 기울기를 거슬러 이동시킨다.","box":[[265,378,190,400],[1000,398,230,385],[1330,418,230,365]],"src":["s32u01#1"],"cards":["B1-135","B1-133"]},{"sid":"s3","obj":"둘째 집의 주황 호박과 집게 · 지붕의 빈 하늘색 소매","fact":"II = 숙신산 탈수소효소. 숙신산을 푸마르산으로 산화하며 H⁺를 펌프하지 않는다.","hook":"호박은 호박산(숙신산), 수소를 떼는 집게는 탈수소효소, 빈 소매는 H⁺ 펌프 없음","say":"둘째 집의 호박을 보자. 숙신산의 다른 이름인 호박산이다. 첫째 집과 같은 집게가 호박에서 수소를 뗀다. 호박산 탈수소효소, 즉 숙신산 탈수소효소다. 전자를 받는 분자까지 포함한 이름은 숙신산–유비퀴논 산화환원효소다. 시트르산 회로에서 숙신산을 푸마르산으로 바꾸는 효소가 바로 내막의 복합체 II이다. 지붕이 빈 소매인 것은 Q로 전자를 전달하지만 H⁺를 펌프하지 않는다는 뜻이다.","box":[[568,15,300,318],[720,668,170,130]],"src":["s32u01#2"],"cards":["B1-134","B1-136"]},{"sid":"s4","obj":"첫째 집의 둥근 은색 양동이와 집게 · 가득 찬 둥근 양동이와 빈 양동이를 든 짐꾼","fact":"I = NADH 탈수소효소(NADH–유비퀴논 산화환원효소)","hook":"둥근 양동이는 NADH, 수소 풍선을 떼는 집게는 탈수소효소","say":"첫째 집의 원료인 둥근 양동이는 NADH이다. 집게가 양동이에서 수소를 떼므로 NADH 탈수소효소다. NADH를 산화해 NAD⁺로 돌려보내고, 전자는 유비퀴논 Q에 전달한다. 정식 명칭은 NADH–유비퀴논 산화환원효소다. 지붕 국자는 이 반응에 결합된 H⁺ 펌프다. 그림에는 없는 세부로, 집 안에서 전자는 먼저 FMN, 즉 플라빈 모노뉴클레오타이드 보결분자단에 실린 뒤 철-황 단백질로 이동한다. FMN을 가진 단백질이므로 복합체 I을 플라보단백질이라고도 한다. 둥근 양동이의 경로를 I → Q → III → IV로 연결해 두자.","box":[[195,15,300,318],[255,878,200,260],[20,1038,265,310]],"src":["s32u01#3"],"cards":["B1-126","B1-151","C0-143","B1-116","B1-128","B1-130","B1-131","B1-132"]},{"sid":"s5","obj":"가득 찬 네모 양동이를 안고 둘째 집 네모 문으로 드는 짐꾼 · 첫째 집 동그란 문 위에는 네모 양동이에 빨간 가위표 그림 표지","fact":"II의 숙신산 탈수소효소에서 결합형 FAD를 거친 전자가 I을 건너뛰고 Q로 간다.","hook":"네모 양동이 = 효소에 결합한 FAD의 환원형 · 네모 문 = 복합체 II","say":"둘째 집의 네모 물통은 효소에 결합한 FAD의 단서다. 숙신산, 즉 석신산·호박산이 푸마르산으로 산화될 때 FAD가 환원된다. 전자는 철-황 중심을 거쳐 유비퀴논 Q로 전달되며 첫째 집은 지나지 않는다. 네모 물통 짐꾼은 이 전자의 진입점을 나타낸다. 경로는 II → Q → III → IV이다. 그림의 짐꾼과 달리 실제 FAD는 환원된 상태에서도 복합체 II에 결합해 있다는 점을 구분하자.","box":[[605,898,205,250],[300,808,105,100]],"src":["s32u01#4"],"cards":["B1-127","C0-143","B1-117"]},{"sid":"s6","obj":"바위 수레의 노란 공 둘 · 셋째 집에 붙은 꿀벌과 수박씨 한 알","fact":"I·II의 전자 → Q/QH₂ → III(유비퀴놀–사이토크롬 c 환원효소, bc₁)","hook":"두 공을 든 바위는 QH₂, 꿀벌(bee)은 b, 붙박이 씨 한 알은 c₁","say":"두 입구의 레일이 합쳐지는 곳을 따라가자. 회색 바위 수레는 내막을 이동하는 비단백질 운반체 Q이다. 전자 둘과 H⁺ 둘을 받은 유비퀴놀 QH₂가 셋째 집에 전자를 전달한다. 셋째 집의 꿀벌은 bee이고, 옆에는 씨 한 알이 있다. bee와 씨 하나를 이어 bc₁ 복합체, 즉 복합체 III를 떠올리자. 사이토크롬 b와 c₁은 이 복합체에 붙어 있다. QH₂를 산화하면서 이동성 사이토크롬 c를 환원하므로 유비퀴놀–사이토크롬 c 산화환원효소라고 한다.","box":[[938,15,300,318],[940,958,225,270],[390,1088,340,120]],"src":["s32u01#5"],"cards":["B1-118","B1-119"]},{"sid":"s7","obj":"셋째 집과 넷째 집 사이를 오가는 씨 장식의 나무 수레 · 노란 공 하나","fact":"III의 붙박이 c₁과 이동성 사이토크롬 c를 구별한다. c가 전자를 하나씩 IV에 건넨다.","hook":"집에 붙은 씨 한 알 = c₁ · 수레에 탄 씨 = 이동성 c · 공 하나 = 전자 1개","say":"셋째 집에 고정된 씨 한 알은 사이토크롬 c₁이다. 옆의 씨 장식은 움직이는 나무 수레에 달려 있는데, 이 수레는 단백질 운반체 사이토크롬 c이다. 상자 위 공이 하나인 것처럼, 내막의 막간공간 쪽 표면에서 전자를 한 번에 하나씩 III에서 IV로 운반한다. 사이토크롬의 차례는 b → c₁ → c → a → a₃이다. 셋째 집의 b와 c₁, 이동 수레의 c, 넷째 집 카드의 a와 a₃를 이어 보자. 각 사이토크롬에서 전자를 운반하는 자리는 헴의 철이다.","box":[1214,1041,189,180],"src":["s32u01#6"],"cards":["B1-120","B1-121"]},{"sid":"s8","obj":"담장 뒤 바다는 담장 꼭대기까지 찰랑 · 앞마당은 마른 모래","fact":"막간공간에 쌓인 H⁺ 기울기 = 양성자 구동력(전기화학적 기울기)","hook":"담장 뒤 물 높이 = 기울기의 크기","say":"펌프 팔이 퍼 올린 물 때문에 담장 뒤 바다는 꼭대기까지 찰랑찰랑 차 있고, 앞마당은 마른 모래다. 막간공간이 H⁺ 저장고가 된 상태다. 막을 사이에 둔 H⁺의 전기화학적 기울기를 양성자 구동력이라고 한다. 전자전달에서 나온 에너지가 이 기울기에 저장된다. 덱에서 담장 뒤 물 높이는 언제나 기울기의 크기를 나타낸다.","box":[[0,468,2048,150],[450,1238,1000,140]],"src":["s32u01#7"],"cards":["B1-145","B1-143","C0-139"]},{"sid":"s9","obj":"담장에 난 구멍은 오른쪽 끝 돌 아치 하나뿐 · 그 뒤 바다에 커다란 소용돌이","fact":"H⁺가 ATP 합성효소를 통해 막간공간에서 기질로 돌아오며 ATP 합성을 구동한다.","hook":"뒤 바다에서 앞마당으로 흐르는 아치 = 기울기를 따라 H⁺가 ATP 합성효소를 통과","say":"바닷물이 돌 아치를 지나 앞마당의 물레방아를 돌린다. 막간공간의 H⁺가 ATP 합성효소를 통과해 기질로 돌아오는 모습이다. 이때 기울기에 저장된 에너지를 ATP 합성에 사용한다. 실제 내막에서는 ATP 합성과 연결되지 않는 양성자 누출도 일어난다는 점을 함께 기억하자.","box":[[1730,688,240,360],[1590,468,420,140]],"src":["s32u01#8"],"cards":["B1-147","B1-146","B1-154","C0-141"]},{"sid":"s10","obj":"아치로 쏟아진 물이 큰 물레방아를 돌리고 — 바퀴 한가운데 축에서 금빛 동전이 잭팟처럼 튀어나와 쟁반에 넘친다 · 물은 맑은 물 그대로 웅덩이로","fact":"화학삼투 — H⁺ 기울기가 ATP 합성효소를 돌려 ATP 를 만든다","hook":"물레방아 = ATP 합성효소 · 동전 = ATP","say":"아치에서 나온 물이 큰 나무 물레방아를 돌린다. 바퀴가 돌 때마다 중심축에서 금빛 동전이 잭팟처럼 반짝이며 튀어나와 나무 쟁반에 넘친다. 동전은 ATP이고, 물은 그대로 웅덩이에 떨어진다. 물 자체가 동전으로 바뀌는 것은 아니다. 양성자 기울기의 에너지로 ATP 합성효소가 ATP를 만드는 화학삼투다. 펌프 팔은 물을 퍼 올릴 뿐이며, 동전을 만드는 곳은 물레방아뿐이다. 전자전달이 기울기를 만들고, 그 기울기가 합성효소를 작동시킨다. 세포호흡에서 대부분의 ATP를 합성하는 직접적인 에너지원은 이 기울기다. 엽록체 쿠션 무대 아래 물레방아도 같은 원리를 사용했다.","box":[[1790,798,258,330],[1820,1098,228,180]],"src":["s32u01#9"],"cards":["B1-148","B1-144","B1-199","C0-137"]},{"sid":"s11","obj":"넷째 집 황소와 문간의 마지막 전자 전달","fact":"IV = 사이토크롬 c 산화효소. heme a를 거쳐 a₃–CuB 중심에서 O₂를 환원한다.","hook":"씨 수레 + 황소(ox) = cytochrome c oxidase · 에이스와 하트 셋 = a와 a₃","say":"씨 수레가 전자를 가지고 넷째 집의 황소에게 간다. 황소의 영어 ox를 씨와 이어 cytochrome c oxidase, 사이토크롬 c 산화효소를 떠올리자. 이 효소는 사이토크롬 c를 산화한다. 받은 전자는 복합체 IV 안에서 CuA와 헴 a를 지나 헴 a₃–CuB 중심에 도착하고, 산소가 전자를 받아 물로 환원된다. 황소 위의 첫 카드는 하트 하나인 에이스로 헴 a, 다음 하트 세 개 카드는 헴 a₃이다. 코앞의 산소 방울과 아래 물방울은 최종 반응의 기질과 생성물이다.","box":[[1290,15,300,318],[1400,898,230,270]],"src":["s32u01#10"],"cards":["B1-123","B1-122"]},{"sid":"s12","obj":"머리가 통째로 흰 방울인 사람 — 두 손을 오므려 노란 공을 받고 · 그 뒤로는 넘겨줄 사람이 없다","fact":"최종 전자수용체는 산소(O₂) — 엽록체 전자전달계는 NADP⁺","hook":"흰 방울 머리 = O₂ · 뒤에 아무도 없음 = 최종","say":"두 손으로 노란 공을 받는 사람은 머리 전체가 흰 방울이다. 이 덱에서 흰 방울은 언제나 O₂이며, 그 뒤에는 전자를 더 넘겨줄 사람이 없다. 그래서 산소가 최종 전자수용체다. 엽록체 무대의 마지막 둥근 방패는 NADPH였다. 엽록체 전자전달계의 최종 수용체는 NADP⁺, 미토콘드리아에서는 O₂이다. 광합성은 물에서 얻은 전자를 NADPH에 담고, 세포호흡은 유기물에서 얻은 전자를 산소에 전달한다.","box":[[1545,973,195,200],[1590,1168,130,150]],"src":["s32u01#11"],"cards":["B1-124","C0-145","C0-146#2","C0-151","C0-147","C0-146"]},{"sid":"s13","obj":"산소를 향해 뛰어드는 작은 물방울 둘 · 발치에 붉은 밀랍으로 봉한 물병","fact":"복합체 IV의 산소 환원 반응은 O₂ + 4e⁻ + 4H⁺(기질) → 2H₂O다.","hook":"물병 하나당 전자 두 개와 기질의 H⁺ 두 개","say":"산소 한 분자를 완전히 환원하려면 전자 네 개와 기질 쪽 H⁺ 네 개가 필요하며, 물 두 분자가 만들어진다. 그림은 물병 한 개에 해당하는 몫으로 압축했다. 병 하나의 몫은 산소 원자 하나, 전자 둘, H⁺ 둘이다. 물 생성에 소비되는 H⁺와 넷째 집 국자가 막간공간으로 퍼내는 H⁺는 별도로 세어야 한다.","box":[[1580,898,150,100],[1530,1188,75,120]],"src":["s32u01#12"],"cards":["B1-21","B1-22","B1-125","B1-198"]},{"sid":"s14","obj":"첫째·둘째 집 문밖에서 합류점까지 이어지는 두 레일 · 그 위에 나란히 놓인 세 국자와 빈 소매","fact":"전자쌍당 NADH 경로는 약 10H⁺·2.5ATP, 숙신산 경로는 약 6H⁺·1.5ATP","hook":"합류 전 두 레일에서 출발점을 확인하고 H⁺ 펌프를 센다. NADH 경로는 셋, 숙신산 경로는 둘","say":"마지막으로 전자가 지나는 펌프를 세어 보자. 둥근 양동이의 전자는 I·III·IV를 지나고, 전자쌍 하나당 H⁺를 막간공간 쪽으로 그림 밖 보충으로 약 4, 4, 2개씩 옮겨 총 약 10개를 펌프한다. 숙신산의 전자는 II에서 Q로 들어가 III와 IV를 지난다. II는 펌프하지 않으므로 총 약 6개다. 양동이의 높이가 아니라 거치는 펌프 수를 비교하면, 평균 ATP 수율이 약 2.5개와 1.5개로 다른 이유를 이해할 수 있다.","box":[[316,1111,57,123],[658,1114,61,94],[822,1173,118,45]],"src":["s32u01#3","s32u01#4"],"cards":["B1-126","B1-151","C0-143","B1-127","B1-152","B1-153","B1-149","B1-150"]}],"cq":{"B1-7":["전자전달계(ETS)는 어디에 있는가?","미토콘드리아 내막"],"B1-158":["세포질 NADH가 미토콘드리아 기질로 직접 못 들어가는 이유와 해결책은?","내막을 통과하지 못함 → 셔틀(전달기구)로 전자만 전달"],"B1-115":["전자전달계(ETS)의 위치는?","미토콘드리아 내막"],"A0-99":["미토콘드리아 내막이 구분하는 2구획?","막간공간(intermembrane space) · 미토콘드리아 기질(matrix)"],"B1-24":["산화적 인산화란?","전자전달사슬의 산화환원 반응과 화학삼투에 의해 ATP를 합성하는 방식"],"B1-25":["세포호흡 전체에서 ATP 대부분은 어느 단계에서 생성되는가?","산화적 인산화"],"B1-114":["산화적 인산화의 두 요소는?","전자전달과 화학삼투"],"B1-204":["산화적 인산화와 기질수준 인산화의 가장 큰 차이는?","전자전달계/화학삼투 필요 여부"],"B1-3#4":["세포호흡의 전체 4단계는?","산화적 인산화"],"C0-150":["광인산화와 산화적 인산화의 공통점은?","둘 다 화학삼투를 이용한 ATP 합성이다"],"B1-10":["원핵생물에서 세포호흡의 해당과정·시트르산 회로는 어디서 일어나는가?","세포질"],"A0-174":["원핵세포에서 세포호흡의 전자전달계(와 ATP 합성효소)가 자리한 곳은?","세포막(원형질막) — 미토콘드리아가 없으므로"],"B1-135":["전자전달계에서 H+를 퍼내는 복합체는?","I, III, IV"],"B1-133":["복합체 I과 III, IV의 공통 기능은?","양성자(H+)를 막간공간으로 퍼낸다"],"B1-134":["복합체 II가 복합체 I과 다른 점은?","H+를 퍼내지 않는다"],"B1-136":["전자전달계에서 H+를 퍼내지 않는 복합체는?","II"],"B1-126":["NADH가 전자를 처음 전달하는 복합체는?","복합체 I"],"B1-151":["NADH가 FADH2보다 ATP를 더 많이 만드는 이유는?","복합체 I부터 시작해 더 많은 H+ 펌핑을 유도하기 때문"],"C0-143":["세포호흡의 전자 출발점은?","유기물로부터 나온 NADH/FADH2"],"B1-116":["NADH에서 나온 전자의 ETC 경로는?","I → Q → III → IV"],"B1-128":["복합체 I의 특징적 보결분자단은?","FMN(플라빈 모노뉴클레오타이드)"],"B1-130":["복합체 I을 부르는 다른 이름은?","플라보단백질(flavoprotein) — FMN을 가짐"],"B1-131":["복합체 I 다음에 전자를 받는 단백질성 보조 성분은?","철-황 단백질"],"B1-132":["복합체 I에서 FMN 다음 전자 이동 대상은?","철-황 단백질"],"B1-127":["FADH2가 전자를 처음 전달하는 복합체는?","복합체 II"],"B1-117":["FADH2에서 나온 전자의 ETC 경로는?","II → Q → III → IV"],"B1-118":["전자전달계에서 단백질이 아닌 유일한 전자 운반체는?","유비퀴논(Q)"],"B1-119":["유비퀴논(Q)의 특징은?","작은 소수성 분자로 특정 복합체에 속하지 않고 내막에서 이동한다"],"B1-120":["사이토크롬 이름 순서는?","b → c1 → c → a → a3"],"B1-121":["사이토크롬의 전자 운반 중심은?","헤므의 철(Fe)"],"B1-145":["양성자 구동력(proton-motive force)이란?","막을 사이에 둔 H+의 전기화학적 기울기"],"B1-143":["전자전달계에서 방출된 에너지는 무엇의 형태로 저장되는가?","양성자 기울기(양성자 구동력)"],"C0-139":["세포호흡 화학삼투에서 H+ 저장고는?","막사이공간"],"B1-147":["ATP 합성효소는 어디에 있는가?","미토콘드리아 내막"],"B1-146":["ATP 합성효소가 하는 일은?","H+가 기울기를 따라 흐를 때 ATP를 합성한다"],"B1-154":["포도당 1분자의 총 ATP를 이론적으로 32개로 볼 수 있는 조건은?","퍼낸 모든 H+가 ATP 합성효소를 돌리는 데 사용될 때"],"C0-141":["세포호흡에서 ATP 합성효소를 지나는 H+ 방향은?","막사이공간에서 기질로"],"B1-148":["전자전달계와 ATP 합성의 짝물림을 한 문장으로 표현하면?","전자전달이 H+ 기울기를 만들고, 그 기울기가 ATP function draw() {

    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;

    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });

$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
</html>
