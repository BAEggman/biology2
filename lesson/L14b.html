<style>
  :root{--ink:#1b1b1f;--ink2:#4b4b55;--line:#e3e1da;--teal:#0f766e;--teal50:#ecfdf5;--gold:#b45309;--bg:#f7f5ef}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1100px;margin:0 auto;padding:12px 14px 40px}
  h1{font-size:18px;margin:6px 0 2px}
  .sub{font-size:12.5px;color:var(--ink2);margin:0 0 10px}
  .sub.hid{cursor:pointer;color:var(--ink3,#8a8a94);border:1px dashed #c9c6bd;border-radius:8px;padding:4px 8px;display:inline-block}
  .cq{font-size:12.5px;color:var(--ink2);margin-top:8px;border-top:1px dashed #d8d5cc;padding-top:6px}.cq summary{cursor:pointer}.cq li{margin:3px 0}.cq .a{color:var(--ink);font-weight:600}
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
  button{font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
  button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  button:disabled{opacity:.45;cursor:default}
  .stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .stage img{display:block;width:100%;height:auto}
  .stage svg{position:absolute;inset:0;width:100%;height:100%}
  .cap{margin-top:10px;min-height:76px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px}
  .cap .n{font-size:11.5px;color:var(--ink2)}
  .cap .obj{font-weight:700;font-size:15px;margin:2px 0}
  .cap .fact{font-size:14px;margin:2px 0}
  .cap .hook{font-size:13px;color:var(--gold);margin-top:4px}
  .cap.muted{color:var(--ink2);font-size:13px}
  .recap{margin-top:12px;display:none}
  .recap ol{padding-left:22px;margin:6px 0}
  .recap li{margin:4px 0;font-size:13.5px}
  .recap li b{color:var(--teal)}
  .score{font-size:13px;color:var(--ink2);margin-left:auto}
  .hint{font-size:12px;color:var(--ink2);margin-top:8px}
  .hole{fill:#000}
  .cur{fill:none;stroke:#f59e0b;stroke-width:6;stroke-dasharray:14 8}
  .hot{fill:transparent;cursor:pointer}
  .hot:hover{fill:rgba(245,158,11,.18)}
  .judge{display:none;gap:6px;margin-top:8px}
  .judge button{font-size:12.5px}
  .nav{display:flex;gap:12px;font-size:12.5px;margin:2px 0 0}
  .nav a{color:var(--teal);text-decoration:none}
  .nav a:hover{text-decoration:underline}
</style>

<script>
const L = {"id":"L14b","scene":"s14","part":"b","title":"풍선 놀이성 — 세 굵기 줄: 세포골격 · 중심체 · 섬모와 편모","sub":"나란히 선 대나무 대롱 · 노란 꼰 줄 · 살구색 구슬 줄(굵기 순서) · 속 빈 대롱 끝의 흰 알 + 흰 베(α · β 튜불린) · 키높이 신발 아이와 떨어지는 다이아몬드(키네신 + · 다이닌 −) · 핵 곁 꼭지의 직각 원통 둘(중심체 · 중심립) · 냅킨 고리 망원경(9×3 — 가운데가 비어 눈이 보인다) · 털 대롱 망원경(9+2 · 다이닌 팔) · 바깥벽 짧은 털 숲 · 지붕 위 안테나 · 헤엄꾼 긴 꼬리(섬모 · 편모) · 벽 안쪽 살구색 그물(액틴) · 빨간 멜빵 · 뻗은 팔 · 창고의 도는 초록 구슬(근수축 · 아메바 운동 · 세포질 유동) · 손가락 탑(미세융모) · 핵을 받친 노란 해먹(중간섬유 · 케라틴) · 노란 줄 없는 창고(식물엔 중간섬유 없음) · 앞마당 작업대 네 칸(콜히친 · 택솔 · 사이토칼라신 · 팔로이딘)","img":"img/L14b.webp?v=8f370717760d","w":2048,"h":1280,"stops":[{"sid":"s1","obj":"볕 드는 뒷마당 — 왼쪽 분홍 풍선 놀이성(앞벽을 잘라 속이 보임) · 오른쪽 나무 창고 · 둘 다 속을 굵기가 다른 줄들이 받친다 (틀)","fact":"세포골격 = 세포 안 단백질 섬유 그물(미세소관 · 미세섬유 · 중간섬유) · 모양 지지 + 운동","hook":"풍선 놀이성 = 동물세포 · 나무 창고 = 식물세포 · 속을 받친 세 가지 줄 = 세포골격","say":"L14a 의 그 뒷마당이다. 오늘은 분홍 풍선집이 바람 넣은 놀이성이 됐다. 앞벽을 잘라 속을 보면, 무른 풍선이 주저앉지 않도록 안에서 굵기가 다른 세 가지 줄이 그물처럼 받친다. 속 빈 대나무 대롱, 노란 꼰 줄, 가는 살구색 구슬 줄. 세포골격의 셋, 미세소관 · 중간섬유 · 미세섬유다. 섬유 그물이 세포 안의 구조와 활동을 짜임새 있게 붙든다. 하는 일은 크게 둘. 세포의 모양을 받치고(벽이 없는 동물세포에서 특히), 세포와 소기관을 움직인다. 아이들이 줄을 타고 노는 놀이터가 곧 운동이다. 오른쪽 나무 창고는 식물세포.","cards":["A0-125","A0-24","A0-123"],"box":null},{"sid":"s2","obj":"놀이성 왼쪽 안 벽가 — 대나무 대롱 · 노란 꼰 줄 · 살구색 구슬 줄이 위아래로 나란히 섰다(대롱이 가장 굵고 살구색 줄이 가장 가늘다)","fact":"지름 — 미세소관 25 nm > 중간섬유 8 ~ 12 nm > 미세섬유 7 nm","hook":"나란히 선 세 줄 = 굵기 순서(대롱 > 꼰 줄 > 구슬 줄)","say":"놀이성 왼쪽 안 벽가에 세 줄이 나란히 섰다. 굵기를 견주라고 세워 둔 것이다. 대나무 대롱이 가장 굵다. 미세소관, 지름 25 nm, 속 빈 구멍만 15 nm. 노란 꼰 줄이 그 가운데. 중간섬유, 8 ~ 12 nm — 이름부터 중간이다. 살구색 구슬 줄이 가장 가늘다. 미세섬유, 7 nm. 순서는 미세소관 > 중간섬유 > 미세섬유. 생김새로 짝지으면 대롱은 속 빈 관, 구슬 줄은 구슬 두 가닥이 서로 감긴 나선, 꼰 줄은 섬유를 케이블처럼 꼰 것이다.","src":["s14p02#2"],"drop":["A0-125","A0-9"],"cards":["A0-125#3","A0-16","A0-17","A0-17#3","A0-4","A0-5","A0-6"],"box":[180,325,130,590]},{"sid":"s3","obj":"꼭지에서 사방으로 뻗은 대나무 대롱 — 끝이 열려 속이 비었다(왼쪽 아래 대롱 끝) · 오른쪽 위 대롱 끝에 흰 알 하나와 개어 둔 흰 베 하나가 한 벌로 얹혔다","fact":"미세소관 = 속 빈 관 · 소단위체 = α · β 튜불린 이합체(GTP 로 중합)","hook":"대나무 대롱 = 속 빈 관 · 흰 알 + 흰 베 = α · β 튜불린","say":"꼭지에서 사방으로 뻗은 대나무 대롱을 보자. 왼쪽 아래 대롱 끝을 들여다보면 속이 비었다. 미세소관은 속이 빈 관이다. 오른쪽 위 대롱 끝에는 흰 알 하나와 개어 둔 흰 베 하나가 한 벌로 얹혀 있다. 알은 알파, 베는 베타. 알파 튜불린과 베타 튜불린이 짝지은 이합체, 이것이 미세소관을 쌓는 단위다. 이 덱에서 알과 베는 늘 그리스 글자다 — 헤모글로빈의 알파 · 베타 사슬도 같은 물건으로 그렸다. 이 한 벌씩이 대롱 끝에 붙어 대롱이 길어진다. 붙일 때 쓰는 에너지는 GTP.","src":["s14p02#0"],"cards":["A0-125#1","A0-17#1","A0-10","C1-74","A0-7"],"box":[[845,360,95,130],[318,748,66,60]]},{"sid":"s4","obj":"굽이 통짜로 두꺼운 키높이 신발을 신고 등에 투명한 방울 가방을 멘 아이가 대롱을 타고 바깥 벽 쪽으로 오른다 · 오른쪽 대롱의 아이는 꼭지 쪽으로 내려오고 그 아래 공중에 다이아몬드가 떨어진다 · 오른쪽 아래 대롱 끝에선 흰 알과 흰 베가 굴러떨어진다","fact":"+ 끝(바깥)은 빨리 붙고 빨리 떨어짐 · − 끝은 꼭지에 고정 · 키네신 → + · 다이닌 → −","hook":"키높이 신발 = 키네신(바깥 + 로) · 떨어지는 다이아몬드 = 다이닌(꼭지 − 로) · 방울 가방 = 소낭 짐","say":"대롱 위 아이 둘. 굽이 통짜로 두꺼운 키높이 신발, 키…신, 키네신이다. 등에 투명한 방울 가방, 소낭을 메고 바깥 벽 쪽 플러스 끝으로 오른다. 오른쪽 대롱의 아이는 꼭지 쪽으로 내려오고, 그 아래로 다이아몬드가 떨어진다. 다이아, 다이닌 — 꼭지 쪽 마이너스 끝으로 간다. 이렇게 소낭과 소기관이 길을 따라 옮겨진다. 대롱은 늘 늘었다 줄었다 한다. 플러스 끝은 알 · 베가 빨리 붙고(오른쪽 위) 빨리 떨어지기도 한다(오른쪽 아래). 마이너스 끝은 꼭지에 박혀 있다. 미세소관의 일 넷: 모양 유지, 세포 운동, 분열 때 염색체 이동, 소기관 이동. 운동성은 넓게는 세포가 자리를 옮기는 것, 좁게는 세포 안 소기관이 옮겨지는 것. 분열 후기에 염색체를 양극으로 옮기는 모터도 다이닌과 키네신이다.","src":["s14p02#3"],"drop":["A0-136"],"cards":["C1-108","A0-126","A0-127","A0-13","A0-124"],"box":[[455,375,150,190],[680,385,130,175],[765,528,45,40],[785,720,135,200]]},{"sid":"s5","obj":"크림색 공 바로 오른쪽, 대롱들이 모두 뻗어 나오는 꼭지 — 둘레에 막이 없고 · 아래에 짧고 굵은 원통 둘이 직각으로 붙었다(하나는 서고 하나는 누움)","fact":"중심체(막 없음) — 핵 근처 · 동물세포에서 미세소관이 뻗어 나오는 곳 · 중심립 2개","hook":"대롱이 뻗어 나오는 꼭지 = 중심체 · 직각 원통 둘 = 중심립(L48b 냅킨 고리)","say":"크림색 공, 핵 바로 곁에 대롱들이 모두 뻗어 나오는 꼭지가 있다. 중심체다. 동물세포에서 미세소관은 핵 근처의 중심체에서 사방으로 뻗어 나간다. 꼭지 둘레엔 막이 없다 — 중심체는 막 없는 소기관이다. 꼭지 아래 짧고 굵은 원통 둘이 하나는 서고 하나는 누워 직각으로 붙었다. 중심립 둘. 분열하는 풍선집(L48b)의 별 꼭지에 있던 그 냅킨 고리다. 그 고리를 앞에서 들여다보면 무엇이 보일까 — 물놀이 통 곁 아이가 보여 준다.","cards":["A0-128","A0-39"],"box":[568,565,125,178]},{"sid":"s6","obj":"물놀이 통 왼쪽 아이가 짧고 굵은 연두 냅킨 고리를 망원경처럼 눈에 댔다 — 고리 앞면에 작은 관 셋씩 묶인 아홉 묶음이 둘러섰고 · 가운데는 비어 아이 눈이 보인다","fact":"중심립 · 기저체 = 삼중 미세소관 9개(9×3 · 가운데 없음 = 9+0) · 기저체가 섬모 · 편모 고정","hook":"셋씩 아홉 · 가운데가 비어 눈이 보인다 = 9×3(중심립 · 기저체)","say":"물놀이 통 왼쪽 아이가 짧고 굵은 냅킨 고리를 망원경처럼 눈에 댔다. 중심립 하나를 앞에서 본 모습이다. 고리 앞면에 작은 관이 셋씩 묶인 묶음이 아홉, 빙 둘러섰다. 삼중 미세소관 아홉, 9×3. 가운데는 텅 비어 아이 눈이 그대로 보인다. 가운데 미세소관이 없으니 9+0 이라고도 한다. 같은 고리가 섬모와 편모의 뿌리에 박히면 기저체다. 기저체는 털의 미세소관을 붙들어 고정하고, 생김새는 중심립과 같다.","src":["s14p02b#0"],"drop":["A0-128"],"box":[[420,808,122,116]],"cards":["A0-130","A0-205","A0-135"]},{"sid":"s7","obj":"오른쪽 아이가 눈에 댄 끝이 벌어진 크림색 나팔 대롱(섬모 한 가닥) — 끝면에 관 둘씩 묶인 아홉 묶음 · 가운데에 관 둘 · 묶음 사이마다 작은 하늘색 다이아몬드","fact":"섬모 · 편모 축사 = 바깥 이중관 9 + 가운데 2(9+2) · 다이닌 팔이 미끄러뜨려 휜다","hook":"둘씩 아홉 + 가운데 둘 = 9+2 · 묶음 사이 다이아몬드 = 다이닌 팔","say":"오른쪽 아이는 끝이 벌어진 크림색 나팔 대롱을 눈에 댔다. 섬모 한 가닥을 잘라 끝을 크게 본 모습이다. 끝면에 관이 둘씩 묶인 묶음이 아홉, 그리고 가운데에 관 둘. 9+2, 움직이는 섬모와 편모의 축사다. 묶음 사이마다 작은 다이아몬드가 다음 묶음 쪽으로 손을 뻗었다. 다이아, 다이닌 팔이다. 다이닌이 이웃 이중관을 미끄러뜨리면 털이 휜다 — 노 젓기도 물결도 다이닌이 만든다. 섬모와 편모는 미세소관이 특이하게 늘어선 운동 부속지다. 왼쪽 고리는 가운데가 비었고(9×3), 이쪽은 가운데 둘이 막았다(9+2).","src":["s14p02b#1"],"box":[[604,828,180,116]],"cards":["A0-133","A0-134","A0-204","A0-136"]},{"sid":"s8","obj":"놀이성 왼쪽 바깥벽을 빽빽이 덮은 짧은 털들이 노처럼 한쪽으로 휘며 회색 먼지 뭉치를 쓸어 낸다 · 지붕 한가운데 홀로 솟은 가늘고 긴 살구빛 털 하나 · 물놀이 통 하얀 헤엄꾼(뾰족한 모자 · 금빛 목걸이)의 아주 긴 꼬리 하나가 크게 물결친다","fact":"섬모 짧고 많음 · 노 젓기(기관 점액을 밖으로) / 편모 길고 적음 · 물결 / 안테나 = 비운동성 섬모","hook":"벽의 짧은 털 숲 = 섬모 · 헤엄꾼 꼬리 = 편모 · 지붕 위 홀로 선 털 = 안테나(비운동성 섬모)","say":"놀이성 왼쪽 바깥벽을 짧은 털이 빽빽이 덮었다. 털들이 노처럼 한쪽으로 함께 휘며 회색 먼지 뭉치를 쓸어 낸다. 섬모다. 사람 기관(숨길)의 섬모가 먼지 묻은 점액을 폐 바깥으로 밀어낸다. 섬모는 짧고 수가 많고 노를 젓듯 움직인다. 물놀이 통의 하얀 헤엄꾼(생식 마을의 그 정자)은 아주 긴 꼬리 하나를 크게 물결친다. 편모다. 길고 한두 개뿐이며 물결치듯 움직인다. 편모는 원생생물, 동물의 정자, 조류(와 몇몇 식물의 정자)에 있다. 길이 · 수 · 움직임은 달라도 속 구조(9+2)는 같다. 지붕 한가운데 홀로 솟은 가늘고 긴 털은 움직이지 않는다. 신호를 받는 안테나, 비운동성 섬모다.","cards":["A0-139","A0-140","A0-137","A0-138"],"box":[[0,330,195,490],[588,25,55,190],[480,945,300,100]]},{"sid":"s9","obj":"풍선 벽 안쪽을 그물처럼 두른 가는 살구색 구슬 줄들(뒷벽 위 · 오른쪽 벽)","fact":"미세섬유 = 액틴 두 가닥 나선 · 장력(당기는 힘)에 버팀 · 3차원 그물로 모양 지지","hook":"살구색 구슬 줄 = 액틴(구슬 하나 = 액틴) · 벽 안쪽 그물 = 피질","say":"풍선 벽 안쪽을 가는 살구색 구슬 줄이 그물처럼 둘렀다. 미세섬유다. 구슬 하나하나가 액틴이고, 가까이 보면 구슬 줄 두 가닥이 서로 감긴 나선이다. 이 줄은 당기는 힘, 장력에 버틴다. 벽 바로 안쪽에서 가지를 치며 3차원 그물을 짜 무른 풍선의 모양을 잡는다. 세포막 바로 밑 이 그물을 피질이라 한다. 살구색 줄은 이 덱의 액틴 — 분열하는 풍선집 허리를 조이던 수축환과 같은 줄이다.","src":["s14p02#1"],"cards":["A0-17#2","A0-125#2","A0-11","A0-8","A0-141","A0-142"],"box":[[330,325,690,100],[950,340,105,420]]},{"sid":"s10","obj":"빨간 멜빵 아이가 오른쪽 벽 안쪽 살구색 구슬 줄을 두 손으로 번갈아 잡아당긴다 · 놀이성 오른쪽 벽이 살구색 줄을 품은 긴 팔처럼 불룩 뻗고 움직임 선 — 놀이성이 오른쪽으로 기어간다 · 오른쪽 창고 안에선 초록 구슬들이 살구색 구슬 줄을 따라 빙 돈다(화살표)","fact":"미세섬유의 일 — 근수축(+ 마이오신) · 아메바 운동(위족) · 식물 세포질 유동 · 세포질분열 · 모양","hook":"빨간 멜빵 = 마이오신 · 불룩 뻗은 팔 = 위족 · 창고 안 도는 초록 구슬 = 세포질 유동","say":"살구색 줄이 하는 일을 보자. 빨간 멜빵 아이가 오른쪽 벽 안쪽 줄을 두 손으로 번갈아 잡아당긴다. 빨간 멜빵은 마이오신. 근세포에선 액틴 줄이 세포 길이를 따라 나란히 늘어서고, 굵은 마이오신 섬유와 맞물려 미끄러지며 수축한다. 놀이성 오른쪽 벽은 살구색 줄을 품은 긴 팔처럼 불룩 뻗었고, 놀이성이 그쪽으로 기어간다. 위족, 아메바 운동 — 액틴 · 마이오신이 한쪽만 조였다 풀며 세포가 옮겨 간다. 창고 안에선 초록 구슬, 엽록체가 살구색 줄을 따라 빙 돈다. 식물의 세포질 유동. 미세섬유의 일 여섯: 모양 유지, 모양 바꾸기, 근수축, 세포 이동, 식물 세포질 유동, 동물세포 분열(수축환).","cards":["A0-14","A0-144","A0-145"],"box":[[850,598,120,205],[1058,405,300,230],[1540,278,425,535]]},{"sid":"s11","obj":"놀이성 지붕에 줄지어 솟은 손가락 모양 작은 탑들 — 앞줄 탑마다 가운데에 살구색 구슬 줄 심이 박혔다","fact":"미세융모 — 액틴 미세섬유가 심 · 세포 표면적을 넓혀 흡수 · 물질대사에 유리","hook":"손가락 탑 = 미세융모 · 탑 속 살구색 심 = 액틴","say":"놀이성 지붕엔 손가락 모양 작은 탑들이 줄지어 솟았다. 미세융모다. 탑마다 가운데에 살구색 구슬 줄이 심으로 박혀 탑을 세운다. 미세융모의 뼈대는 액틴 미세섬유다. 손가락이 많이 솟을수록 지붕의 겉넓이가 크게 늘어난다. 소장 상피처럼 많이 흡수하는 세포가 미세융모로 표면적을 넓힌다. 지붕 위 안테나 털(섬모)과 헷갈리지 말자 — 섬모 속은 대나무(미세소관), 융모 속은 살구색 줄(액틴)이다.","cards":["A0-143","A0-122"],"box":[130,135,920,118]},{"sid":"s12","obj":"크림색 공(핵)을 해먹처럼 받친 굵은 노란 꼬불꼬불 꼰 줄 — 줄 끝이 왼쪽 위 벽에 박힌 쇠 고리판에 걸렸다 · 이 줄엔 타는 아이가 없다","fact":"중간섬유 = 케이블처럼 꼰 섬유 단백질(케라틴 등 세포마다 다름) · 장력 · 오래가는 받침","hook":"노란 꼰 줄 = 중간섬유 · 해먹 = 핵을 제자리에 붙듦 · 벽의 고정판 = 막에 닻 내림(L14a 대갈못 = 데스모솜)","say":"크림색 공, 핵이 굵은 노란 꼰 줄로 짠 해먹에 얹혔다. 줄 끝은 왼쪽 위 벽에 박힌 쇠 고리판에 걸렸다. 중간섬유다. 섬유 단백질을 케이블처럼 꼬아 만든다. 재료는 세포마다 다르다 — 피부 상피는 케라틴, 결합조직은 비멘틴, 핵막 안쪽은 라민. 케라틴은 중간섬유를 이루는 단백질 무리다. 하는 일은 장력에 버티기, 그리고 오래가는 받침. 미세소관 · 미세섬유처럼 붙었다 떨어졌다 하지 않고 비교적 오래 남는다. 핵도 이 그물 안에 놓여 제자리에 붙들린다. 세포끼리 묶는 L14a 의 대갈못, 데스모솜에도 이 줄이 걸린다. 이 줄엔 타고 오르는 아이가 없다 — 중간섬유엔 모터 단백질이 없다.","src":["s14p02#4"],"cards":["A0-9","A0-12","A0-148","A0-149"],"box":[240,470,345,235]},{"sid":"s13","obj":"오른쪽 나무 창고 안 — 줄은 대나무 대롱과 살구색 구슬 줄뿐 · 노란 꼰 줄은 하나도 없다","fact":"중간섬유는 척추동물 등 일부 동물에만 — 식물세포는 미세섬유 + 미세소관뿐 · 각질 = 케라틴","hook":"노란 줄 없는 창고 = 식물엔 중간섬유가 없다","say":"오른쪽 나무 창고 안을 보자. 대나무 대롱과 살구색 구슬 줄은 있는데, 노란 꼰 줄은 하나도 없다. 식물세포의 세포골격은 미세섬유와 미세소관뿐이다. 중간섬유는 척추동물을 포함한 일부 동물에만 있다. 단단한 세포벽이 장력을 받아 주니 노란 줄이 없어도 된다고 생각하면 쉽다. 반대로 동물은 피부 각질 · 머리카락 · 손톱에 케라틴이 가득하다 — 노란 줄의 재료다. 그리고 놀이성의 크림색 공처럼, 핵은 이 노란 그물 안에 놓여 위치가 고정된다.","cards":["A0-146","A0-147","A0-150"],"box":[1452,262,552,650]},{"sid":"s14","obj":"앞마당 네 칸 작업대. 왼쪽 열에 속이 빈 연두 대롱 두 개, 오른쪽 열에 살구색 구슬이 두 가닥으로 꼬인 줄 두 개. 위쪽 둘은 줄 밖에 떨어진 재료가 보이고, 아래쪽 둘은 완성된 줄이 묶여 있다.","fact":"왼쪽 미세소관 · 오른쪽 액틴 미세섬유 / 위는 중합 억제 · 아래는 탈중합 억제","hook":"굵은 속 빈 대롱 → 미세소관 · 가는 살구색 구슬 줄 → F-액틴 · 윗줄은 조립 차단, 아랫줄은 해체 차단","say":"작업대에서 먼저 재료를 짚자. 왼쪽 대롱은 튜불린으로 조립하는 미세소관이고, 오른쪽 두 가닥 구슬 줄은 액틴 미세섬유다. 위쪽에서는 초록 짝이나 살구색 구슬이 줄에 붙지 못한다. 아래쪽에서는 이미 조립된 줄이 묶여 잘 풀리지 않는다. 왼쪽 위부터 콜히친, 오른쪽 위 사이토칼라신, 왼쪽 아래 택솔, 오른쪽 아래 팔로이딘이다.","src":["s14p03#0","s14p03#1","s14p03#2","s14p03#3","s14p03#4","s14p03#5","s14p03#6","s14p03#7","s14p03#8"],"box":[[887,938,1111,303],[904,986,249,92],[1451,976,255,90]],"ask":"대나무 대롱과 구슬 줄은 각각 어떤 섬유인가? 윗줄과 아랫줄이 막는 과정, 네 도구가 뜻하는 약 이름을 말해 보자.","cards":["C1-102","C1-148","C1-80"]},{"sid":"s15","src":["s14p03#5"],"obj":"꼬불선 달린 나무 전화기가 주둥이가 사선으로 잘려 속이 보이는 대롱 앞에서 초록 두 토막짜리 부품을 붙들었다. 뒤에 같은 부품 한 쌍이 더 있다.","fact":"콜히친 → 튜불린에 결합 → 미세소관 중합·신장 억제","hook":"전화의 콜 → 콜히친 · 관 밖에 붙들린 초록 두 토막 → 튜불린 이합체의 미세소관 조립 억제","say":"콜을 받는 전화기가 조립하러 온 초록 부품을 붙들었다. 초록 두 토막은 α·β 튜불린 이합체다. 콜히친이 튜불린에 결합하면 미세소관의 성장이 억제되고, 방추사의 기능도 방해받는다.","ask":"전화기가 붙든 두 토막은 무엇인가? 어느 약이 어느 섬유의 중합을 억제하는가?","box":[[1110,958,310,120],[904,978,261,94]],"cards":["C1-102"]},{"sid":"s16","src":["s14p03#6"],"obj":"앞단추와 뾰족한 옷깃 두 장, 둥근 목둘레가 보이는 흰 셔츠 칼라가 살구색 두 가닥 구슬 줄 끝을 덮었다. 칼라 밖의 낱구슬은 줄과 떨어져 있다.","fact":"사이토칼라신 → 액틴 미세섬유의 빠른 성장 말단(+)을 덮어 중합 억제","hook":"셔츠 칼라 → 사이토칼라신 · 구슬 줄 끝의 칼라와 바깥 낱구슬 → 액틴 +끝 신장 차단","say":"이 줄은 구슬 두 가닥이 꼬인 액틴 미세섬유다. 흰 칼라가 빠르게 자라는 가시 말단, 즉 플러스 끝을 캡처럼 덮어 액틴 단량체가 더 붙기 어렵다. 사이토칼라신은 액틴 수축환을 방해해 세포질분열도 저해할 수 있다.","ask":"흰 칼라는 어느 섬유의 어느 끝에 붙는가? 밖의 낱구슬은 무엇이며 어느 과정이 억제되는가?","box":[[1693,955,285,139],[1443,991,265,74]],"cards":["C1-148"]},{"sid":"s17","src":["s14p03#7"],"obj":"택배 상자에서 내려온 굵은 포장끈이 이미 완성된 대나무 대롱 한가운데를 실제로 감싸고, 이웃 마디 사이에서 X로 교차한다.","fact":"택솔(파클리탁셀) → 조립된 미세소관 안정화 → 탈중합 억제","hook":"택배 소포의 택 → 택솔 · 완성된 굵은 대롱의 이음부 결박 → 미세소관 탈중합 억제","say":"택배 소포는 택솔의 이름 단서다. 소포 끈이 이어진 대롱을 결박해 풀리지 않게 한다. 택솔은 조립된 미세소관을 안정화해 탈중합을 억제하고 정상적인 방추사 역동성을 방해한다.","ask":"십자 소포 끈이 묶은 구조는 무엇인가? 전화기와 소포는 같은 섬유에 작용하지만 각각 어느 방향을 막는가?","box":[908,1091,495,124],"cards":["C1-80"]},{"sid":"s18","src":["s14p03#8"],"obj":"오른쪽 아래 흰 갓 독버섯 셋이 이미 이어진 살구색 구슬 줄 위에 선다. 작은 팔을 뻗어 이웃한 구슬 사이를 끌어안는다.","fact":"팔로이딘 → F-액틴에 결합해 미세섬유 안정화 → 탈중합 억제","hook":"흰 독버섯의 독소 → 팔로이딘 · 이웃 구슬을 껴안은 버섯 → F-액틴 탈중합 억제","say":"독버섯에서 유래한 팔로이딘은 이미 조립된 섬유상 액틴에 결합한다. 버섯이 줄의 몸통에서 이웃 구슬을 껴안은 모습처럼, 미세섬유가 단량체로 흩어지는 것을 억제한다. 위 칸의 칼라는 줄 끝에서 새 구슬이 붙는 것을 막는다.","ask":"버섯이 껴안은 줄은 어떤 중합체인가? 단량체가 붙는 과정과 떨어지는 과정 중 무엇이 억제되는가?","box":[1449,1104,528,106],"cards":[]}],"cq":{"A0-125":["세포골격 3요소?","미세소관 · 미세섬유(액틴 필라멘트) · 중간섬유"],"A0-24":["세포골격의 본질적 특징?","섬유들의 그물망 구조로 세포 내 구조·활동을 조직화"],"A0-123":["세포골격의 주요 역할 2가지?","세포 모양 지지(특히 동물세포) · 세포/소기관 운동성에 관여"],"A0-125#3":["세포골격 3요소?","중간섬유"],"A0-16":["세포골격 3요소를 지름이 큰 순서대로 쓰면?","미세소관 > 중간섬유 > 미세섬유"],"A0-17":["세포골격 3요소를 구조 기준으로 짝지으면?","미세소관=속 빈 관 · 미세섬유=꼬인 액틴 나선 · 중간섬유=케이블형 섬유성 단백질"],"A0-17#3":["세포골격 3요소를 구조 기준으로 짝지으면 — 「중간섬유」? (↔ 미세소관 vs 미세섬유)","케이블형 섬유성 단백질"],"A0-4":["미세소관의 지름은?","25 nm (내부 공간 15 nm)"],"A0-5":["미세섬유의 지름은?","7 nm"],"A0-6":["중간섬유의 지름은?","8~12 nm"],"A0-125#1":["세포골격 3요소?","미세소관"],"A0-17#1":["세포골격 3요소를 구조 기준으로 짝지으면 — 「미세소관」? (↔ 미세섬유 vs 중간섬유)","속 빈 관"],"A0-10":["미세소관의 단백질 소단위체는?","α-와 β-튜불린으로 구성된 이합체"],"C1-74":["미세소관의 단량체는?","알파 및 베타 튜불린 이량체"],"A0-7":["미세소관의 구조는?","속이 빈 관"],"C1-108":["M기 후기에 양극으로 이동하는 동력 단백질(모터)은?","다이닌 · 키네신"],"A0-126":["미세소관의 길이 변화 특징?","튜불린이 양끝에 붙어 중합되며, 탈중합(분해)도 가능"],"A0-127":["미세소관의 방향성(플러스/마이너스) 의미?","플러스: 튜불린이 빠르게 붙고 떨어지는 쪽(길이 변화가 큼) · 마이너스: 느린 쪽 — 세포 안에선 중심체에 박혀 고정"],"A0-13":["미세소관의 주요 기능 4가지는?","세포의 모양 유지 · 세포의 운동 · 세포분열 시 염색체의 이동 · 세포소기관의 이동"],"A0-124":["세포 운동성(cell mobility)의 의미 2가지(넓은/좁은)?","넓게: 세포의 위치 이동 · 좁게: 세포 내 소기관 이동"],"A0-128":["동물세포에서 미세소관이 뻗어 나오는 곳?","핵 근처 중심체(centrosome)"],"A0-39":["중심체의 막 구조 분류?","무막(막없음)"],"A0-130":["중심립(centriole)의 미세소관 배열?","3개가 한 단위(삼중소관) × 9세트가 원형 배열"],"A0-205":["중심립·기저체의 미세소관 배열은?","9×3 삼중체 = 9+0 (중심 미세소관 없음)"],"A0-135":["섬모·편모에서 기저체(basal body)의 역할?","섬유(미세소관)를 고정(구조는 중심립과 유사)"],"A0-133":["섬모(cilia)·편모(flagella)의 공통점(노트)?","운동 부속지이며 미세소관의 특이한 배열과 관련"],"A0-134":["섬모/편모의 미세구조 패턴?","9 + 2 패턴(주변 9쌍관체 + 중심 2미세소관)"],"A0-204":["운동성 섬모·편모(축사, axoneme)의 미세소관 배열은?","9+2 (주변 9쌍관체 + 중심 미세소관 2개)"],"A0-136":["섬모·편모의 운동을 일으키는 단백질?","디네인(dynein) 운동 단백질"],"A0-139":["섬모와 편모의 차이 3가지(노트)?","길이, 세포당 수, 움직임 패턴은 다르나 미세구조는 유사"],"A0-140":["편모를 가지는 예시 생물/세포 3가지?","원생생물 · 동물 정자 · 조류(및 몇 식물)"],"A0-137":["사람에서 섬모의 대표적 기능?","점액(찌꺼기)을 폐의 바깥으로 내보냄"],"A0-138":["신호 수용 '안테나'로 작동하는 섬모는?","비운동성 섬모"],"A0-17#2":["세포골격 3요소를 구조 기준으로 짝지으면 — 「미세섬유」? (↔ 미세소관 vs 중간섬유)","꼬인 액틴 나선"],"A0-125#2":["세포골격 3요소?","미세섬유(액틴 필라멘트)"],"A0-11":["미세섬유의 단백질 소단위체는?","액틴"],"A0-8":["미세섬유의 구조는?","두 개의 서로 꼬인 액틴 나선"],"A0-141":["미세섬유가 저항하는 힘?","장력(당기는 힘)에 저항"],"A0-142":["미세섬유가 만드는 구조적 특징?","3차원 네트워크 형성(세포 모양 지지) · 가지치기 네트워크도 형성 가능"],"A0-14":["미세섬유의 주요 기능 6가지는?","세포의 모양 유지 · 세포 모양에서의 변화 · 근육의 수축 · 세포 이동 · 식물의 세포질 유동 · 동물세포의 분열"],"A0-144":["근육 수축에서 미세섬유의 배열/상호작용?","미세섬유가 근세포 길이 따라 평행 배열 · 마이오신 두꺼운 섬유와 얽혀 수축"],"A0-145":["아메바 운동(amoeboid movement)의 원리(노트)?","액틴·마이오신에 의한 제한적 수축으로 세포가 이동"],"A0-143":["미세융모의 핵심 구성 요소?","미세섬유(액틴 필라멘트)"],"A0-122":["미세융모(microvilli)의 기능?","세포 표면적을 증가시켜 물질대사에 유리"],"A0-9":["중간섬유의 구조는?","케이블로 꼬인 섬유성 단백질"],"A0-12":["중간섬유의 단백질 소단위체는?","세포에 따라 다른 섬유성 단백질(예: 케라틴)"],"A0-148":["중간섬유의 주요 기능?","장력 유지 + 오래가는 세포 지지물"],"A0-149":["케라틴(keratin)은 어떤 세포골격 요소와 관련?","중간섬유를 이루는 단백질 그룹"],"A0-146":["중간섬유가 존재하는 생물군?","척추동물을 포함한 일부 동물(식물에는 없음)"],"A0-147":["식물 세포의 세포골격 구성은?","미세섬유와 미세소관만 (중간섬유는 식물에 없음)"],"A0-150":["피부 각질/핵 위치 고정과 중간섬유의 관계(노트)?","피부 각질은 케라틴 풍부 · 핵은 중간섬유 망 안에 놓여 위치가 고정"],"C1-102":["콜히친은 미세소관의 무엇을 방해하는가?","중합 (조립)"],"C1-148":["사이토칼라신 B(cytochalasin B)의 작용과 결과는?","미세섬유(액틴) 중합을 억제 → 수축환 형성·세포질분열 저해 (방추사=미세소관에는 작용하지 않음 — 함정 주의)"],"C1-80":["택솔(Taxol)의 작용 기전은?","미세소관 탈중합 억제 (방추사를 굳혀버림)"]},"hubPanel":"s14p02"};

function subShow() { const hide = (mode === 'review' || mode === 'quiz') && !subOpen && !!L.sub; $('sub').textContent = hide ? '요약 줄은 접어 두었다(답이 적혀 있다) — 누르면 편다' : (L.sub || ''); $('sub').classList.toggle('hid', hide); }
$('sub').onclick = () => { if (mode === 'review' || mode === 'quiz') { subOpen = !subOpen; subShow(); } };
$('img').src = L.img; $('img').alt = L.title;
if (L.home) $('home').href = L.home;  // 한 파일(standalone)은 저장소 밖에서 열리므로 배포 주소로
if (L.hub) $('hub').href = L.hub; else if (L.hubPanel) $('hub').href = '../sketchy.html#' + L.hubPanel;
const ov = $('ov'); ov.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
let mode = 'tour', i = -1, playing = false, voice = true, rate = 1.0, quizOrder = [], quizPos = 0, quizRevealed = false, shuffle = false, sess = null;
const stops = L.stops;
subShow();
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID
const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact));
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
function speak(t) {
  t = ttsNorm(t);
  const my = ++speakSeq, at = i;
  const advance = (ms) => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, ms);
  if (!('speechSynthesis' in window)) { if (playing) advance(3500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = () => { if (started) advance(700); };
  u.onerror = () => { if (!started) advance(3000); };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started && my === speakSeq) { speechSynthesis.cancel(); advance(3000); } }, 2500);  // 목소리가 없으면 글만 3초
}
function go(k) {
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) setTimeout(() => { if (playing) next(); }, 3500);
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; speechSynthesis && speechSynthesis.cancel(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i + 1); else speechSynthesis && speechSynthesis.cancel(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) speechSynthesis && speechSynthesis.cancel(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
</script>
</body>
</html>
