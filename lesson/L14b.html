<script>
const L = {"id":"L14b","scene":"s14","part":"b","title":"풍선 놀이성 — 세 굵기 줄: 세포골격 · 중심체 · 섬모와 편모","sub":"나란히 선 대나무 대롱 · 노란 꼰 줄 · 살구색 구슬 줄(굵기 순서) · 속 빈 대롱 끝의 흰 알 + 흰 베(α · β 튜불린) · 키높이 신발 아이와 떨어지는 다이아몬드(키네신 + · 다이닌 −) · 핵 곁 꼭지의 직각 원통 둘(중심체 · 중심립) · 냅킨 고리 망원경(9×3 — 가운데가 비어 눈이 보인다) · 털 대롱 망원경(9+2 · 다이닌 팔) · 바깥벽 짧은 털 숲 · 지붕 위 안테나 · 헤엄꾼 긴 꼬리(섬모 · 편모) · 벽 안쪽 살구색 그물(액틴) · 빨간 멜빵 · 뻗은 팔 · 창고의 도는 초록 구슬(근수축 · 아메바 운동 · 세포질 유동) · 손가락 탑(미세융모) · 핵을 받친 노란 해먹(중간섬유 · 케라틴) · 노란 줄 없는 창고(식물엔 중간섬유 없음) · 앞마당 작업대 네 칸(콜히친 · 택솔 · 사이토칼라신 · 팔로이딘)","img":"img/L14b.webp?v=8f370717760d","w":2048,"h":1280,"stops":[{"sid":"s1","obj":"볕 드는 뒷마당 — 왼쪽 분홍 풍선 놀이성(앞벽을 잘라 속이 보임) · 오른쪽 나무 창고 · 둘 다 속을 굵기가 다른 줄들이 받친다 (틀)","fact":"세포골격 = 세포 안 단백질 섬유 그물(미세소관 · 미세섬유 · 중간섬유) · 모양 지지 + 운동","hook":"풍선 놀이성 = 동물세포 · 나무 창고 = 식물세포 · 속을 받친 세 가지 줄 = 세포골격","say":"L14a의 뒷마당으로 돌아왔다. 분홍 풍선집이 바람을 넣은 놀이성이 되었다. 잘라 낸 앞벽 안을 보면, 세 가지 굵기의 줄이 그물처럼 받치고 있어 무른 풍선이 주저앉지 않는다. 속 빈 대나무 대롱은 미세소관, 노란 꼰 줄은 중간섬유, 가는 살구색 구슬 줄은 미세섬유다. 세포골격은 세포 안의 구조와 활동을 조직하고, 크게 두 가지 일을 한다. 특히 세포벽이 없는 동물세포에서 모양을 지탱하고, 세포와 소기관을 움직인다. 줄을 타고 노는 아이들이 운동을 나타낸다. 오른쪽 나무 창고는 식물세포다.","cards":["A0-125","A0-24","A0-123"],"box":null},{"sid":"s2","obj":"놀이성 왼쪽 안 벽가 — 대나무 대롱 · 노란 꼰 줄 · 살구색 구슬 줄이 위아래로 나란히 섰다(대롱이 가장 굵고 살구색 줄이 가장 가늘다)","fact":"지름 — 미세소관 25 nm > 중간섬유 8 ~ 12 nm > 미세섬유 7 nm","hook":"나란히 선 세 줄 = 굵기 순서(대롱 > 꼰 줄 > 구슬 줄)","say":"놀이성 왼쪽 안쪽 벽에 나란히 선 세 줄의 굵기를 비교하자. 가장 굵은 대나무 대롱은 미세소관으로 지름 25 nm, 빈 내부의 지름은 15 nm이다. 가운데 굵기의 노란 꼰 줄은 8 ~ 12 nm인 중간섬유다. 가장 가는 살구색 구슬 줄은 7 nm인 미세섬유다. 미세소관 > 중간섬유 > 미세섬유의 순서다. 모양도 함께 구분하자. 대롱은 속 빈 관, 미세섬유는 구슬 두 가닥이 감긴 나선, 중간섬유는 케이블처럼 꼰 섬유다.","src":["s14p02#2"],"drop":["A0-125","A0-9"],"cards":["A0-125#3","A0-16","A0-17","A0-17#3","A0-4","A0-5","A0-6"],"box":[180,325,130,590]},{"sid":"s3","obj":"꼭지에서 사방으로 뻗은 대나무 대롱 — 끝이 열려 속이 비었다(왼쪽 아래 대롱 끝) · 오른쪽 위 대롱 끝에 흰 알 하나와 개어 둔 흰 베 하나가 한 벌로 얹혔다","fact":"미세소관 = 속 빈 관 · 소단위체 = α · β 튜불린 이합체(GTP 로 중합)","hook":"대나무 대롱 = 속 빈 관 · 흰 알 + 흰 베 = α · β 튜불린","say":"꼭지에서 사방으로 뻗는 대나무 대롱을 보자. 왼쪽 아래 대롱 끝의 빈 구멍은 미세소관이 속 빈 관이라는 단서다. 오른쪽 위 대롱 끝에는 흰 알과 개어 놓은 흰 베가 한 벌로 놓여 있다. 알은 알파, 베는 베타로, α·β 튜불린이 짝을 이룬 이합체가 조립 단위다. 이 덱에서 알과 베는 늘 그리스 글자를 나타내며 헤모글로빈의 알파·베타 사슬에도 같은 소품을 쓴다. 이 단위들이 대롱 끝에 붙으면 길이가 늘어나고, 조립에는 GTP를 사용한다.","src":["s14p02#0"],"cards":["A0-125#1","A0-17#1","A0-10","C1-74","A0-7","C1-75"],"box":[[845,360,95,130],[318,748,66,60]]},{"sid":"s4","obj":"굽이 통짜로 두꺼운 키높이 신발을 신고 등에 투명한 방울 가방을 멘 아이가 대롱을 타고 바깥 벽 쪽으로 오른다 · 오른쪽 대롱의 아이는 꼭지 쪽으로 내려오고 그 아래 공중에 다이아몬드가 떨어진다 · 오른쪽 아래 대롱 끝에선 흰 알과 흰 베가 굴러떨어진다","fact":"+ 끝(바깥)은 빨리 붙고 빨리 떨어짐 · − 끝은 꼭지에 고정 · 키네신 → + · 다이닌 → −","hook":"키높이 신발 = 키네신(바깥 + 로) · 떨어지는 다이아몬드 = 다이닌(꼭지 − 로) · 방울 가방 = 소낭 짐","say":"대롱 위 두 아이를 보자. 통째로 두꺼운 굽의 키높이 신발은 키네신의 이름 단서다. 투명한 방울 가방인 소낭을 메고 바깥 벽의 플러스 끝으로 올라간다. 오른쪽 대롱의 아이는 꼭지 쪽으로 내려오고, 아래로 다이아몬드가 떨어진다. 다이아에서 다이닌을 떠올리자. 다이닌은 꼭지 쪽 마이너스 끝으로 이동한다. 이렇게 소낭과 소기관이 미세소관을 따라 움직인다. 미세소관 자체도 늘고 줄어든다. 오른쪽 위 플러스 끝에는 알·베가 빠르게 붙고, 오른쪽 아래에서는 빠르게 떨어지기도 하며, 마이너스 끝은 꼭지에 박혀 있다. 미세소관의 네 가지 기능은 모양 유지, 세포 운동, 분열 시 염색체 이동, 소기관 이동이다. 운동성은 넓게는 세포의 위치 이동, 좁게는 세포 안 소기관의 이동을 뜻한다. 분열 후기에 염색체를 양극으로 옮기는 모터에도 다이닌과 키네신이 있다.","src":["s14p02#3"],"drop":["A0-136"],"cards":["C1-108","A0-126","A0-127","A0-13","A0-124"],"box":[[455,375,150,190],[680,385,130,175],[765,528,45,40],[785,720,135,200]]},{"sid":"s5","obj":"크림색 공 바로 오른쪽, 대롱들이 모두 뻗어 나오는 꼭지 — 둘레에 막이 없고 · 아래에 짧고 굵은 원통 둘이 직각으로 붙었다(하나는 서고 하나는 누움)","fact":"중심체(막 없음) — 핵 근처 · 동물세포에서 미세소관이 뻗어 나오는 곳 · 중심립 2개","hook":"대롱이 뻗어 나오는 꼭지 = 중심체 · 직각 원통 둘 = 중심립(L48b 냅킨 고리)","say":"크림색 공인 핵 바로 옆, 대롱들이 모두 뻗어 나오는 꼭지가 중심체다. 동물세포의 미세소관은 핵 근처 중심체에서 사방으로 뻗는다. 꼭지 둘레에 막이 없는 것처럼 중심체도 막이 없는 소기관이다. 아래에는 짧고 굵은 원통 둘이 하나는 서고 하나는 누워 직각을 이루고 있다. 중심립 두 개다. L48b의 분열하는 풍선집에서 별 꼭지에 있던 냅킨 고리와 같다. 이 고리의 단면은 물놀이 통 옆 아이에게서 확인할 수 있다.","cards":["A0-128","A0-39"],"box":[568,565,125,178]},{"sid":"s6","obj":"물놀이 통 왼쪽 아이가 짧고 굵은 연두 냅킨 고리를 망원경처럼 눈에 댔다 — 고리 앞면에 작은 관 셋씩 묶인 아홉 묶음이 둘러섰고 · 가운데는 비어 아이 눈이 보인다","fact":"중심립 · 기저체 = 삼중 미세소관 9개(9×3 · 가운데 없음 = 9+0) · 기저체가 섬모 · 편모 고정","hook":"셋씩 아홉 · 가운데가 비어 눈이 보인다 = 9×3(중심립 · 기저체)","say":"물놀이 통 왼쪽 아이가 짧고 굵은 냅킨 고리를 망원경처럼 눈에 대고 있다. 중심립 하나의 단면이다. 작은 관 세 개씩을 묶은 묶음 아홉 개가 둘러서 있으므로, 삼중 미세소관 아홉 개, 9×3이다. 가운데가 비어서 아이의 눈이 그대로 보인다. 중앙 미세소관이 없다는 뜻에서 9+0이라고도 한다. 같은 구조가 섬모나 편모의 뿌리에 놓이면 기저체다. 기저체는 섬모·편모의 미세소관을 붙들어 고정하며, 구조는 중심립과 같다.","src":["s14p02b#0"],"drop":["A0-128"],"cards":["A0-130","A0-205","A0-135","C1-73"],"box":[[420,808,122,116]]},{"sid":"s7","obj":"오른쪽 아이가 눈에 댄 끝이 벌어진 크림색 나팔 대롱(섬모 한 가닥) — 끝면에 관 둘씩 묶인 아홉 묶음 · 가운데에 관 둘 · 묶음 사이마다 작은 하늘색 다이아몬드","fact":"섬모 · 편모 축사 = 바깥 이중관 9 + 가운데 2(9+2) · 다이닌 팔이 미끄러뜨려 휜다","hook":"둘씩 아홉 + 가운데 둘 = 9+2 · 묶음 사이 다이아몬드 = 다이닌 팔","say":"오른쪽 아이가 눈에 댄 크림색 나팔 대롱은 섬모의 단면을 확대한 것이다. 관 두 개씩의 묶음 아홉 개가 둘러서고, 중앙에는 관 두 개가 더 있다. 운동성 섬모와 편모의 축사인 9+2 구조다. 묶음 사이의 작은 다이아몬드는 이웃 묶음으로 팔을 뻗는다. 다이아는 다이닌 팔의 단서다. 다이닌이 이웃 이중관을 미끄러뜨리면 섬모와 편모가 휘어 노를 젓거나 물결치듯 움직인다. 두 구조는 미세소관이 특징적으로 배열된 운동 부속지다. 중앙이 빈 왼쪽 중심립의 9×3과 중앙에 두 관이 있는 9+2를 구분하자.","src":["s14p02b#1"],"box":[[604,828,180,116]],"cards":["A0-133","A0-134","A0-204","A0-136"]},{"sid":"s8","obj":"놀이성 왼쪽 바깥벽을 빽빽이 덮은 짧은 털들이 노처럼 한쪽으로 휘며 회색 먼지 뭉치를 쓸어 낸다 · 지붕 한가운데 홀로 솟은 가늘고 긴 살구빛 털 하나 · 물놀이 통 하얀 헤엄꾼(뾰족한 모자 · 금빛 목걸이)의 아주 긴 꼬리 하나가 크게 물결친다","fact":"섬모 짧고 많음 · 노 젓기(기관 점액을 밖으로) / 편모 길고 적음 · 물결 / 안테나 = 비운동성 섬모","hook":"벽의 짧은 털 숲 = 섬모 · 헤엄꾼 꼬리 = 편모 · 지붕 위 홀로 선 털 = 안테나(비운동성 섬모)","say":"놀이성 왼쪽 바깥벽의 짧고 빽빽한 털들이 함께 휘며 회색 먼지를 쓸어 낸다. 섬모다. 사람의 기관에서는 섬모가 먼지 묻은 점액을 폐 밖으로 밀어낸다. 짧고 많으며 노를 젓듯 움직인다. 물놀이 통의 하얀 헤엄꾼은 생식 마을에서 보았던 정자다. 길고 큰 꼬리 하나가 물결치는데, 이것이 편모다. 편모는 길고 한두 개이며 물결치듯 움직인다. 원생생물, 동물 정자, 조류와 일부 식물의 정자에서 볼 수 있다. 길이·개수·움직임은 달라도 운동성 섬모와 편모의 내부는 같은 9+2 구조다. 지붕 한가운데 홀로 선 긴 털은 움직이지 않는 신호 수용 안테나, 비운동성 섬모다.","cards":["A0-139","A0-140","A0-137","A0-138"],"box":[[0,330,195,490],[588,25,55,190],[480,945,300,100]]},{"sid":"s9","obj":"풍선 벽 안쪽을 그물처럼 두른 가는 살구색 구슬 줄들(뒷벽 위 · 오른쪽 벽)","fact":"미세섬유 = 액틴 두 가닥 나선 · 장력(당기는 힘)에 버팀 · 3차원 그물로 모양 지지","hook":"살구색 구슬 줄 = 액틴(구슬 하나 = 액틴) · 벽 안쪽 그물 = 피질","say":"풍선 벽 안쪽의 가는 살구색 구슬 그물을 보자. 미세섬유이며 구슬 하나하나는 액틴이다. 두 가닥의 구슬 줄이 서로 감긴 나선을 이룬다. 당기는 힘인 장력에 견디고, 세포막 바로 아래에서 가지 친 3차원 그물을 만들어 무른 세포의 모양을 유지한다. 이 그물이 피질이다. 살구색 줄은 덱 전체에서 액틴을 나타내며, 분열하는 풍선집의 허리를 조이던 수축환도 같은 줄이다.","src":["s14p02#1"],"cards":["A0-17#2","A0-125#2","A0-11","A0-8","A0-141","A0-142"],"box":[[330,325,690,100],[950,340,105,420]]},{"sid":"s10","obj":"빨간 멜빵 아이가 오른쪽 벽 안쪽 살구색 구슬 줄을 두 손으로 번갈아 잡아당긴다 · 놀이성 오른쪽 벽이 살구색 줄을 품은 긴 팔처럼 불룩 뻗고 움직임 선 — 놀이성이 오른쪽으로 기어간다 · 오른쪽 창고 안에선 초록 구슬들이 살구색 구슬 줄을 따라 빙 돈다(화살표)","fact":"미세섬유의 일 — 근수축(+ 마이오신) · 아메바 운동(위족) · 식물 세포질 유동 · 세포질분열 · 모양","hook":"빨간 멜빵 = 마이오신 · 불룩 뻗은 팔 = 위족 · 창고 안 도는 초록 구슬 = 세포질 유동","say":"살구색 줄이 움직임을 만드는 장면을 보자. 빨간 멜빵 아이가 오른쪽 벽 안쪽의 줄을 두 손으로 번갈아 당긴다. 빨간 멜빵은 마이오신이다. 근세포에서는 길이 방향으로 나란한 액틴이 굵은 마이오신 섬유와 맞물려 미끄러지며 수축한다. 오른쪽 풍선 벽은 살구색 줄을 품은 긴 팔처럼 돌출되어 그쪽으로 기어간다. 위족을 이용한 아메바 운동으로, 액틴과 마이오신이 한쪽만 조였다 풀며 세포를 이동시킨다. 나무 창고 안의 초록 구슬은 엽록체이며, 살구색 줄을 따라 도는 모습은 식물의 세포질 유동이다. 미세섬유의 기능 여섯 가지를 연결하자. 모양 유지와 변화, 근수축, 세포 이동, 식물의 세포질 유동, 동물세포의 수축환에 의한 분열이다.","cards":["A0-14","A0-144","A0-145"],"box":[[850,598,120,205],[1058,405,300,230],[1540,278,425,535]]},{"sid":"s11","obj":"놀이성 지붕에 줄지어 솟은 손가락 모양 작은 탑들 — 앞줄 탑마다 가운데에 살구색 구슬 줄 심이 박혔다","fact":"미세융모 — 액틴 미세섬유가 심 · 세포 표면적을 넓혀 흡수 · 물질대사에 유리","hook":"손가락 탑 = 미세융모 · 탑 속 살구색 심 = 액틴","say":"지붕에 줄지어 솟은 손가락 모양의 작은 탑은 미세융모다. 탑 가운데 살구색 구슬 줄이 심으로 박혀 있다. 미세융모의 뼈대는 액틴 미세섬유다. 탑이 많을수록 표면적이 늘어나는 것처럼, 소장 상피처럼 흡수가 활발한 세포는 미세융모로 흡수 면적을 넓힌다. 소장의 융모와 그 위 미세융모의 가장 큰 기능은 흡수 표면적을 크게 넓히는 것이다. 지붕의 안테나 털인 섬모와 구별하자. 섬모의 뼈대는 대나무 대롱인 미세소관이고, 미세융모의 뼈대는 살구색 액틴 줄이다.","cards":["A0-143","A0-122","G1-119"],"box":[130,135,920,118]},{"sid":"s12","obj":"크림색 공(핵)을 해먹처럼 받친 굵은 노란 꼬불꼬불 꼰 줄 — 줄 끝이 왼쪽 위 벽에 박힌 쇠 고리판에 걸렸다 · 이 줄엔 타는 아이가 없다","fact":"중간섬유 = 케이블처럼 꼰 섬유 단백질(케라틴 등 세포마다 다름) · 장력 · 오래가는 받침","hook":"노란 꼰 줄 = 중간섬유 · 해먹 = 핵을 제자리에 붙듦 · 벽의 고정판 = 막에 닻 내림(L14a 대갈못 = 데스모솜)","say":"크림색 공인 핵이 굵은 노란 꼰 줄로 만든 해먹 위에 놓여 있다. 줄 끝은 왼쪽 위 벽의 쇠 고리판에 연결된다. 중간섬유는 섬유 단백질을 케이블처럼 꼰 구조다. 재료는 세포마다 달라 피부 상피에서는 케라틴, 결합조직에서는 비멘틴, 핵막 안쪽에서는 라민이다. 케라틴은 중간섬유를 이루는 단백질 무리다. 중간섬유는 장력에 견디는 오래가는 지지대로, 미세소관이나 미세섬유보다 덜 붙었다 떨어졌다 하며 비교적 오래 남는다. 그래도 필요하면 풀렸다가 다시 짜인다. 핵도 그물 안에서 제자리에 고정된다. L14a의 대갈못인 데스모솜에도 이 줄이 걸린다. 줄을 타는 아이가 없는 것은 중간섬유에 모터 단백질이 없다는 단서다.","src":["s14p02#4"],"cards":["A0-9","A0-12","A0-148","A0-149"],"box":[240,470,345,235]},{"sid":"s13","obj":"오른쪽 나무 창고 안 — 줄은 대나무 대롱과 살구색 구슬 줄뿐 · 노란 꼰 줄은 하나도 없다","fact":"중간섬유는 척추동물 등 일부 동물에만 — 식물세포는 미세섬유 + 미세소관뿐 · 각질 = 케라틴","hook":"노란 줄 없는 창고 = 식물엔 중간섬유가 없다","say":"오른쪽 나무 창고를 보자. 대나무 대롱과 살구색 구슬 줄은 있지만 노란 꼰 줄은 하나도 없다. 식물세포의 세포골격은 미세섬유와 미세소관뿐이고, 중간섬유는 척추동물을 포함한 일부 동물에만 있다. 식물에서는 단단한 세포벽이 장력을 받아 주므로 노란 줄이 없어도 된다고 연결하면 기억하기 쉽다. 반면 동물의 피부 각질, 머리카락, 손톱에는 노란 줄의 재료인 케라틴이 가득하다. 놀이성의 크림색 공처럼 핵도 이 노란 그물 안에 놓여 위치가 고정된다.","cards":["A0-146","A0-147","A0-150"],"box":[1452,262,552,650]},{"sid":"s14","obj":"앞마당 네 칸 작업대. 왼쪽 열에 속이 빈 연두 대롱 두 개, 오른쪽 열에 살구색 구슬이 두 가닥으로 꼬인 줄 두 개. 위쪽 둘은 줄 밖에 떨어진 재료가 보이고, 아래쪽 둘은 완성된 줄이 묶여 있다.","fact":"왼쪽 미세소관 · 오른쪽 액틴 미세섬유 / 위는 중합 억제 · 아래는 탈중합 억제","hook":"굵은 속 빈 대롱 → 미세소관 · 가는 살구색 구슬 줄 → F-액틴 · 윗줄은 조립 차단, 아랫줄은 해체 차단","say":"작업대에서는 먼저 두 재료를 구분하자. 왼쪽 대롱은 튜불린으로 조립한 미세소관이고, 오른쪽의 두 가닥 구슬 줄은 액틴 미세섬유다. 위 칸에서는 초록 짝이나 살구색 구슬이 붙지 못하고, 아래 칸에서는 조립된 줄이 묶여 잘 풀리지 않는다. 왼쪽 위는 콜히친, 오른쪽 위는 사이토칼라신, 왼쪽 아래는 택솔, 오른쪽 아래는 팔로이딘이다. 재료와 억제되는 과정을 함께 짚어 보자.","src":["s14p03#0","s14p03#1","s14p03#2","s14p03#3","s14p03#4","s14p03#5","s14p03#6","s14p03#7","s14p03#8"],"ask":"대나무 대롱과 구슬 줄은 각각 어떤 섬유인가? 윗줄과 아랫줄이 막는 과정, 네 도구가 뜻하는 약 이름을 말해 보자.","box":[[887,938,1111,303],[904,986,249,92],[1451,976,255,90]],"cards":["C1-102","C1-148","C1-80"]},{"sid":"s15","src":["s14p03#5"],"obj":"꼬불선 달린 나무 전화기가 주둥이가 사선으로 잘려 속이 보이는 대롱 앞에서 초록 두 토막짜리 부품을 붙들었다. 뒤에 같은 부품 한 쌍이 더 있다.","fact":"콜히친 → 튜불린에 결합 → 미세소관 중합·신장 억제","hook":"전화의 콜 → 콜히친 · 관 밖에 붙들린 초록 두 토막 → 튜불린 이합체의 미세소관 조립 억제","say":"콜을 받는 전화기가 조립하러 온 초록 부품을 붙잡고 있다. 초록 두 토막은 α·β 튜불린 이합체다. 콜히친이 튜불린에 결합하면 미세소관 성장이 억제되고 방추사 기능도 방해받는다. 방추사를 제대로 만들지 못해 분열이 중기에서 멈춘다. 콜히친으로 중기 세포를 모으는 이유다.","ask":"전화기가 붙든 두 토막은 무엇인가? 어느 약이 어느 섬유의 중합을 억제하는가?","cards":["C1-102","C1-79"],"box":[[1110,958,310,120],[904,978,261,94]]},{"sid":"s16","src":["s14p03#6"],"obj":"앞단추와 뾰족한 옷깃 두 장, 둥근 목둘레가 보이는 흰 셔츠 칼라가 살구색 두 가닥 구슬 줄 끝을 덮었다. 칼라 밖의 낱구슬은 줄과 떨어져 있다.","fact":"사이토칼라신 → 액틴 미세섬유의 빠른 성장 말단(+)을 덮어 중합 억제","hook":"셔츠 칼라 → 사이토칼라신 · 구슬 줄 끝의 칼라와 바깥 낱구슬 → 액틴 +끝 신장 차단","say":"이번 줄은 구슬 두 가닥이 꼬인 액틴 미세섬유다. 흰 칼라가 빠르게 자라는 가시 말단, 즉 플러스 끝을 모자처럼 덮는다. 사이토칼라신이 액틴 단량체가 더 붙기 어렵게 한다는 단서다. 액틴 수축환도 방해하므로 세포질분열을 억제할 수 있다.","ask":"흰 칼라는 어느 섬유의 어느 끝에 붙는가? 밖의 낱구슬은 무엇이며 어느 과정이 억제되는가?","box":[[1693,955,285,139],[1443,991,265,74]],"cards":["C1-148"]},{"sid":"s17","src":["s14p03#7"],"obj":"택배 상자에서 내려온 굵은 포장끈이 이미 완성된 대나무 대롱 한가운데를 실제로 감싸고, 이웃 마디 사이에서 X로 교차한다.","fact":"택솔(파클리탁셀) → 조립된 미세소관 안정화 → 탈중합 억제","hook":"택배 소포의 택 → 택솔 · 완성된 굵은 대롱의 이음부 결박 → 미세소관 탈중합 억제","say":"택배 소포에서 택솔을 떠올리자. 소포 끈이 조립된 대롱을 묶어 풀리지 못하게 한다. 택솔은 이미 조립된 미세소관을 안정화해 탈중합을 억제하고, 정상적인 방추사의 역동성을 방해한다.","ask":"십자 소포 끈이 묶은 구조는 무엇인가? 전화기와 소포는 같은 섬유에 작용하지만 각각 어느 방향을 막는가?","box":[908,1091,495,124],"cards":["C1-80"]},{"sid":"s18","src":["s14p03#8"],"obj":"오른쪽 아래 흰 갓 독버섯 셋이 이미 이어진 살구색 구슬 줄 위에 선다. 작은 팔을 뻗어 이웃한 구슬 사이를 끌어안는다.","fact":"팔로이딘 → F-액틴에 결합해 미세섬유 안정화 → 탈중합 억제","hook":"흰 독버섯의 독소 → 팔로이딘 · 이웃 구슬을 껴안은 버섯 → F-액틴 탈중합 억제","say":"버섯이 줄 몸통에서 이웃 구슬을 껴안고 있다. 독버섯에서 유래한 팔로이딘은 이미 조립된 섬유상 액틴에 결합해, 미세섬유가 단량체로 흩어지는 것을 억제한다. 위 칸의 흰 칼라와 비교하자. 칼라는 줄 끝에 새 구슬이 붙는 것을 막고, 팔로이딘은 만들어진 줄이 풀리는 것을 막는다.","ask":"버섯이 껴안은 줄은 어떤 중합체인가? 단량체가 붙는 과정과 떨어지는 과정 중 무엇이 억제되는가?","box":[1449,1104,528,106],"cards":[]}],"cq":{"A0-125":["세포골격 3요소?","미세소관 · 미세섬유(액틴 필라멘트) · 중간섬유"],"A0-24":["세포골격의 본질적 특징?","섬유들의 그물망 구조로 세포 내 구조·활동을 조직화"],"A0-123":["세포골격의 주요 역할 2가지?","세포 모양 지지(특히 동물세포) · 세포/소기관 운동성에 관여"],"A0-125#3":["세포골격 3요소?","중간섬유"],"A0-16":["세포골격 3요소를 지름이 큰 순서대로 쓰면?","미세소관 > 중간섬유 > 미세섬유"],"A0-17":["세포골격 3요소를 구조 기준으로 짝지으면?","미세소관=속 빈 관 · 미세섬유=꼬인 액틴 나선 · 중간섬유=케이블형 섬유성 단백질"],"A0-17#3":["세포골격 3요소를 구조 기준으로 짝지으면 — 「중간섬유」? (↔ 미세소관 vs 미세섬유)","케이블형 섬유성 단백질"],"A0-4":["미세소관의 지름은?","25 nm (내부 공간 15 nm)"],"A0-5":["미세섬유의 지름은?","7 nm"],"A0-6":["중간섬유의 지름은?","8~12 nm"],"A0-125#1":["세포골격 3요소?","미세소관"],"A0-17#1":["세포골격 3요소를 구조 기준으로 짝지으면 — 「미세소관」? (↔ 미세섬유 vs 중간섬유)","속 빈 관"],"A0-10":["미세소관의 단백질 소단위체는?","α-와 β-튜불린으로 구성된 이합체"],"C1-74":["미세소관의 단량체는?","알파 및 베타 튜불린 이량체"],"A0-7":["미세소관의 구조는?","속이 빈 관"],"C1-75":["미세소관 중합 시 소모되는 에너지는?","GTP"],"C1-108":["M기 후기에 양극으로 이동하는 동력 단백질(모터)은?","다이닌 · 키네신"],"A0-126":["미세소관의 길이 변화 특징?","튜불린이 양끝에 붙어 중합되며, 탈중합(분해)도 가능"],"A0-127":["미세소관의 방향성(플러스/마이너스) 의미?","플러스: 튜불린이 빠르게 붙고 떨어지는 쪽(길이 변화가 큼) · 마이너스: 느린 쪽 — 세포 안에선 중심체에 박혀 고정"],"A0-13":["미세소관의 주요 기능 4가지는?","세포의 모양 유지 · 세포의 운동 · 세포분열 시 염색체의 이동 · 세포소기관의 이동"],"A0-124":["세포 운동성(cell mobility)의 의미 2가지(넓은/좁은)?","넓게: 세포의 위치 이동 · 좁게: 세포 내 소기관 이동"],"A0-128":["동물세포에서 미세소관이 뻗어 나오는 곳?","핵 근처 중심체(centrosome)"],"A0-39":["중심체의 막 구조 분류?","무막(막없음)"],"A0-130":["중심립(centriole)의 미세소관 배열?","3개가 한 단위(삼중소관) × 9세트가 원형 배열"],"A0-205":["중심립·기저체의 미세소관 배열은?","9×3 삼중체 = 9+0 (중심 미세소관 없음)"],"A0-135":["섬모·편모에서 기저체(basal body)의 역할?","섬유(미세소관)를 고정(구조는 중심립과 유사)"],"C1-73":["중심립의 미세소관 배열 구조는?","9+0 (삼중체 9조 — 미세소관 3개씩 아홉 묶음)"],"A0-133":["섬모(cilia)·편모(flagella)의 공통점(노트)?","운동 부속지이며 미세소관의 특이한 배열과 관련"],"A0-134":["섬모/편모의 미세구조 패턴?","9 + 2 패턴(주변 9쌍관체 + 중심 2미세소관)"],"A0-204":["운동성 섬모·편모(축사, axoneme)의 미세소관 배열은?","9+2 (주변 9쌍관체 + 중심 미세소관 2개)"],"A0-136":["섬모·편모의 운동을 일으키는 단백질?","디네인(dynein) 운동 단백질"],"A0-139":["섬모와 편모의 차이 3가지(노트)?","길이, 세포당 수, 움직임 패턴은 다르나 미세구조는 유사"],"A0-140":["편모를 가지는 예시 생물/세포 3가지?","원생생물 · 동물 정자 · 조류(및 몇 식물)"],"A0-137":["사람에서 섬모의 대표적 기능?","점액(찌꺼기)을 폐의 바깥으로 내보냄"],"A0-138":["신호 수용 '안테나'로 작동하는 섬모는?","비운동성 섬모"],"A0-17#2":["세포골격 3요소를 구조 기준으로 짝지으면 — 「미세섬유」? (↔ 미세소관 vs 중간섬유)","꼬인 액틴 나선"],"A0-125#2":["세포골격 3요소?","미세섬유(액틴 필라멘트)"],"A0-11":["미세섬유의 단백질 소단위체는?","액틴"],"A0-8":["미세섬유의 구조는?","두 개의 서로 꼬인 액틴 나선"],"A0-141":["미세섬유가 저항하는 힘?","장력(당기는 힘)에 저항"],"A0-142":["미세섬유가 만드는 구조적 특징?","3차원 네트워크 형성(세포 모양 지지) · 가지치기 네트워크도 형성 가능"],"A0-14":["미세섬유의 주요 기능 6가지는?","세포의 모양 유지 · 세포 모양에서의 변화 · 근육의 수축 · 세포 이동 · 식물의 세포질 유동 · 동물세포의 분열"],"A0-144":["근육 수축에서 미세섬유의 배열/상호작용?","미세섬유가 근세포 길이 따라 평행 배열 · 마이오신 두꺼운 섬유와 얽혀 수축"],"A0-145":["아메바 운동(amoeboid movement)의 원리(노트)?","액틴·마이오신에 의한 제한적 수축으로 세포가 이동"],"A0-143":["미세융모의 핵심 구성 요소?","미세섬유(액틴 필라멘트)"],"A0-122":["미세융모(microvilli)의 기능?","세포 표면적을 증가시켜 물질대사에 유리"],"G1-119":["소장 융모와 미세융모의 가장 큰 기능은?","흡수 표면적을 극대화하는 것"],"A0-9":["중간섬유의 구조는?","케이블로 꼬인 섬유성 단백질"],"A0-12":["중간섬유의 단백질 소단위체는?","세포에 따라 다른 섬유성 단백질(예: 케라틴)"],"A0-148":["중간섬유의 주요 기능?","장력 유지 + 오래가는 세포 지지물"],"A0-149":["케라틴(keratin)은 어떤 세포골격 요소와 관련?","중간섬유를 이루는 단백질 그룹"],"A0-146":["중간섬유가 존재하는 생물군?","척추동물을 포함한 일부 동물(식물에는 없음)"],"A0-147":["식물 세포의 세포골격 구성은?","미세섬유와 미세소관만 (중간섬유는 식물에 없음)"],"A0-150":["피부 각질/핵 위치 고정과 중간섬유의 관계(노트)?","피부 각질은 케라틴 풍부 · 핵은 중간섬유 망 안에 놓여 위치가 고정"],"C1-102":["콜히친은 미세소관의 무엇을 방해하는가?","중합 (조립)"],"C1-148":["사이토칼라신 B(cytochalasin B)의 작용과 결과는?","미세섬유(액틴) 중합을 억제 → 수축환 형성·세포질분열 저해 (방추사=미세소관에는 작용하지 않음 — 함정 주의)"],"C1-80":["택솔(Taxol)의 작용 기전은?","미세소관 탈중합 억제 (방추사를 굳혀버림)"],"C1-79":["콜히친(Colchicine) 처리 시 세포 분열은 어느 단계에서 멈추는가?","중기 (방추사 형성 방해)"]},"hubPanel":"s14p02"};
const $ = id => document.getElementById(id);
$('title').textContent = L.title; document.title = L.title;
// 요약 줄(sub)에는 물건 = 답이 다 적혀 있다 — 복습 · 시험에서는 접어 두고, 누르면 편다(GPT 추가 감사 2026-11-11 §7)
let subOpen = false;
function subShow() { const hide = (mode === 'review' || mode === 'quiz') && !subOpen && !!L.sub; $('sub').textContent = hide ? '요약 줄은 접어 두었다(답이 적혀 있다) — 누르면 편다' : (L.sub || ''); $('sub').classList.toggle('hid', hide); }
$('sub').onclick = () => { if (mode === 'review' || mode === 'quiz') { subOpen = !subOpen; subShow(); } };
$('img').src = L.img; $('img').alt = L.title;
if (L.home) $('home').href = L.home;  // 한 파일(standalone)은 저장소 밖에서 열리므로 배포 주소로
if (L.hub) $('hub').href = L.hub; else if (L.hubPanel) $('hub').href = '../sketchy.html#' + L.hubPanel;
const ov = $('ov'); ov.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
let tourEnded = false;
let mode = 'tour', i = -1, playing = false, voice = true, rate = 1.0, quizOrder = [], quizPos = 0, quizRevealed = false, shuffle = false, sess = null;
const stops = L.stops;
subShow();
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID
const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact), st.sid);
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate,
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
