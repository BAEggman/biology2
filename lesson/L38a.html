<script>
const L = {"id":"L38a","scene":"s38","part":"a","title":"사다리 공방 — DNA 이중나선의 구조","sub":"꼬인 나무 사다리(이중나선) · 오각판과 블록 기둥(당-인산 골격 · 뉴클레오타이드) · 이음의 나무못(인산이에스터) · 틈을 건너 무는 갈고리(수소결합) · 기둥 밖 · 칸 안 · 뭉툭 → 뾰족이 반대(5′ → 3′ · 역평행) · 겹친 원판 둘 / 하나(퓨린 / 피리미딘 · 폭 일정) · 갈고리 둘 / 셋(A-T / G-C) · 칸 순서(정보) · 벽의 오각판 둘(리보스 / 디옥시리보스 · 2번 탄소)","img":"img/L38a.webp?v=290f7e9954c7","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"목수 공방 한가운데 바닥에서 천장 가까이 선 거대한 나무 사다리 — 두 기둥이 서로 두 번 엇갈리며 감겼다 (틀)","fact":"DNA = 두 가닥이 서로 감긴 이중나선","hook":"꼬인 나무 사다리 = 이중나선 · 나무 = DNA","say":"목수 공방 한가운데에 바닥에서 천장 가까이까지 큰 나무 사다리가 서 있다. 두 기둥이 서로 두 번 엇갈리며 감긴 모습은 DNA 이중나선이다. 이 덱에서 나무는 언제나 DNA의 재료이며, 복제 공사장의 판자도 나무였다. 기둥이 두 번 자리를 바꿔 원래 자리로 돌아오는 구간이 한 바퀴다. 이 단원에서는 DNA가 유전정보를 저장하고, 상보적 염기쌍과 효소의 작용으로 정확히 복제되며, 단백질과 함께 염색체로 포장되어 전달되는 원리를 살펴본다.","box":null,"src":["s38p01#8"],"cards":["E1-117"]},{"sid":"s2","obj":"사다리 기둥 — 통짜 장대가 아니라 오각형 나무판과 네모 나무 블록을 이어 붙여 만들었다(오른쪽 위 기둥에서 잘 보인다) · 칸은 기둥 조각에서 하나씩 안쪽으로 뻗는다","fact":"당-인산 골격 · 단위체 = 뉴클레오타이드(인산 + 디옥시리보스 + 질소염기)","hook":"오각판 = 오탄당 · 네모 블록 = 인산 · 오각판 + 블록 + 칸 조각 = 뉴클레오타이드","say":"기둥을 가까이 보자. 하나의 장대가 아니라 오각형 나무판과 네모 나무 블록이 이어져 있다. 오른쪽 위에서 잘 보인다. 오각판은 다섯 모의 오탄당인 디옥시리보스, 네모 블록은 인산이다. 기둥 전체가 당-인산 골격이다. 오각판마다 안쪽으로 뻗은 칸 조각은 질소염기다. 오각판 하나, 블록 하나, 칸 조각 하나를 합친 단위가 DNA의 기본 단위체인 뉴클레오타이드다.","box":[[940,100,140,330],[620,700,260,380]],"src":["s38p01#2"],"cards":["E1-14","E1-15","D0-3"]},{"sid":"s3","obj":"기둥 조각의 이음에 박힌 둥근 나무못 · 왼쪽 앞 발판 위 멜빵바지 목수가 나무망치를 들었고, 바로 앞 이음에 나무못 하나가 반쯤 박혀 튀어나와 있다","fact":"인산이에스터 결합 — 한 가닥 안에서 이웃 뉴클레오타이드(당-인산)를 잇는다","hook":"이음마다 박는 나무못 = 한 가닥 안의 이음","say":"기둥 조각의 이음마다 둥근 나무못이 박혀 있다. 왼쪽 앞의 멜빵바지 목수는 발판 위에서 나무망치를 들고, 반쯤 튀어나온 못을 마저 박으려 한다. 나무못은 한 가닥 안에서 이웃 뉴클레오타이드의 당과 인산을 잇는 인산이에스터 결합이다. 못도 나무라는 것은 이 골격 전체가 DNA라는 단서다. 쇠못으로 표현했던 RNA 프라이머와 구분하자. 쇠를 RNA로 읽는 약속은 못에 해당하며, 곧 볼 쇠갈고리까지 RNA라는 뜻은 아니다.","box":[[350,380,330,330]],"src":["s38p01#0"],"cards":["E1-23"]},{"sid":"s4","obj":"칸 한가운데 — 두 조각이 틈을 두고 떨어져 있고, 그 틈을 건너 무는 것은 작은 쇠갈고리뿐","fact":"두 가닥을 마주 묶는 것은 염기 사이의 수소결합 — 공유결합이 아니라 열에 풀린다","hook":"틈을 건너 무는 갈고리 = 수소결합 · 박는 못 = 공유결합","say":"사다리의 칸도 통짜 막대가 아니다. 양쪽 기둥에서 나온 조각 둘이 가운데 틈을 두고 있고, 작은 쇠갈고리만 틈을 가로질러 연결한다. 두 가닥을 묶는 염기 사이의 수소결합이다. 나무못은 한 가닥 안을 잇고, 쇠갈고리는 두 가닥 사이를 잇는다는 위치 차이를 보자. 열을 가하면 갈고리만 풀려 두 가닥이 분리되는 것이 변성이다. 반대로 한 핵산 가닥이 상보적인 다른 DNA 또는 RNA 가닥과 염기쌍을 이루는 것은 핵산 혼성화이며, 거의 모든 유전공학 기법의 기반이다.","box":[[690,500,330,260]],"src":["s38p01#1"],"cards":["E1-21","I1-1"]},{"sid":"s5","obj":"오각판 · 블록 기둥은 바깥쪽에 서고, 칸은 두 기둥 사이 안쪽에 물려 있다","fact":"당-인산 골격은 바깥 · 염기는 안쪽","hook":"기둥은 바깥 · 칸은 안","say":"사다리 전체에서 오각판과 블록으로 된 기둥은 바깥쪽에 있고, 칸은 기둥 사이 안쪽을 채운다. DNA의 당-인산 골격은 바깥, 염기는 안쪽이라는 배치를 기억하자.","box":[[610,50,460,1040]],"src":["s38p01#3"],"cards":["E1-20"]},{"sid":"s6","obj":"왼쪽 기둥은 아래 끝이 뭉툭하고 위 끝이 말뚝처럼 뾰족하다 · 오른쪽 기둥은 거꾸로 위 끝이 뭉툭하고 아래 끝이 뾰족하다","fact":"한 가닥엔 5′ · 3′ 말단(방향)이 있고 두 가닥은 반대 방향 = 역평행","hook":"뭉툭한 끝 → 뾰족한 끝 = 5′ → 3′ · 두 기둥의 뾰족한 끝이 반대 = 역평행","say":"기둥의 양 끝을 비교해 보자. 왼쪽은 아래 끝이 뭉툭하고 위 끝이 뾰족하며, 오른쪽은 위 끝이 뭉툭하고 아래 끝이 뾰족하다. 복제 공사장처럼 뭉툭한 끝에서 뾰족한 끝으로 가는 방향을 5′에서 3′로 읽는다. 한 DNA 가닥에는 5′ 말단과 3′ 말단의 방향성이 있고, 두 가닥은 서로 반대 방향으로 놓인다. 역평행이다.","box":[[610,40,110,160],[980,960,100,130],[610,1005,110,100],[975,85,110,115]],"src":["s38p01#4"],"cards":["E1-18","E1-19"]},{"sid":"s7","obj":"작업대 위에 떼어 놓은 칸 둘 — 칸마다 한쪽 끝은 둥근 원판 둘이 겹쳐 붙었고, 다른 쪽 끝은 원판 하나","fact":"퓨린 = A · G (고리 둘) / 피리미딘 = C · T (고리 하나)","hook":"겹친 원판 둘 = 퓨린 · 원판 하나 = 피리미딘 · 이름이 짧은 쪽이 몸은 크다","say":"오른쪽 작업대에는 떼어 놓은 사다리 칸 둘이 있다. 각 칸의 한쪽 끝은 원판 두 개가 겹쳐 있고, 다른 끝은 원판 하나다. 원판은 염기의 고리다. 두 고리의 큰 염기는 퓨린인 아데닌과 구아닌, 한 고리의 작은 염기는 피리미딘인 시토신과 티민이다. 이름이 짧은 퓨린은 몸이 크고, 이름이 긴 피리미딘은 몸이 작다고 연결하자.","box":[[1400,790,560,240]],"src":["s38p01#5"],"cards":["E1-27","E1-27#1","E1-27#2"]},{"sid":"s8","obj":"작업대의 초록 칸은 겹친 원판 둘이 왼쪽 끝, 빨간 칸은 오른쪽 끝에 있는데 — 두 칸의 길이는 똑같다","fact":"언제나 퓨린 하나 + 피리미딘 하나가 짝 → 나선의 폭이 일정하다","hook":"큰 쪽이 어디 붙든 칸 길이는 같다","say":"초록 칸은 겹친 원판 둘이 왼쪽에, 빨간 칸은 오른쪽에 있지만 칸의 길이는 같다. 큰 조각이 어느 기둥에 붙더라도 언제나 퓨린 하나와 피리미딘 하나가 짝을 이루기 때문이다. 그래서 이중나선의 폭이 일정하다. 큰 것끼리 짝지으면 불룩해지고, 작은 것끼리 짝지으면 잘록해질 것이라는 대비도 떠올리자.","box":[[1400,790,560,240]],"src":["s38p01#6"],"cards":["E1-28"]},{"sid":"s9","obj":"초록 칸의 틈은 갈고리 둘이, 빨간 칸의 틈은 갈고리 셋이 건너 문다 — 사다리 위 칸들도 같다","fact":"A-T 는 수소결합 2개 · G-C 는 3개 · A 의 짝은 T (U 는 RNA 의 것)","hook":"갈고리 둘 = A-T · 셋 = G-C — 갈고리를 센다","say":"작업대 칸의 가운데 틈을 잇는 갈고리를 세어 보자. 초록 칸은 둘, 빨간 칸은 셋이다. 사다리의 칸에도 같은 규칙이 적용된다. 아데닌-티민 쌍의 수소결합은 두 개, 구아닌-시토신 쌍은 세 개다. 셋으로 묶인 쪽이 더 단단하므로 G-C가 많으면 두 가닥을 분리하기 어려워 녹는 온도가 높다. DNA에서 아데닌의 짝은 언제나 티민이며, 우라실은 RNA의 염기라는 점도 구분하자.","box":[[1580,810,200,170],[690,480,330,120]],"src":["s38p01#7"],"cards":["E1-22","E1-26","F0-49"]},{"sid":"s10","obj":"기둥을 이루는 조각은 어디서나 같은 오각판과 블록이고, 칸마다 다른 것은 초록이냐 빨강이냐 — 그 순서뿐","fact":"유전정보는 염기서열의 순서에 저장된다","hook":"같은 기둥 · 다른 칸 순서 = 정보","say":"사다리를 위아래로 훑어보면 기둥은 같은 오각판과 블록이 반복되지만, 칸의 초록과 빨강 배열은 다르다. 초록 칸 하나에도 아데닌 쪽과 티민 쪽이 있으므로, 한쪽 기둥을 따라 읽으면 A, T, G, C 네 염기가 어떤 순서로 놓였는지 알 수 있다. 유전정보는 바로 이 염기서열에 저장된다. DNA는 유전정보가 기록된 물질이고, 자손에게 전달되는 것도 이 뉴클레오타이드 서열이다.","box":[[610,50,460,1040]],"src":["s38p01#9"],"cards":["E1-29","D0-4","D0-2"]},{"sid":"s11","obj":"오른쪽 벽에 나란히 걸린 같은 꼴의 오각판 둘 — 위 꼭짓점 안쪽에 뚫린 옹이구멍 · 오른쪽 위 꼭짓점에 못 박힌 빨간 쪽지 · 왼쪽 위 꼭짓점에서 삐져나온 짧은 팔 끝의 네모 마디 · 왼쪽 판은 쇠고리 셋(오른쪽 아래 · 왼쪽 아래 · 마디 끝)","fact":"리보스 — 고리 = 탄소 넷 + 산소 하나 · 5번 탄소는 고리 밖 · -OH 는 2′ · 3′ · 5′","hook":"옹이구멍 = 고리 속 산소 · 빨간 쪽지 = 1′(염기 자리) · 팔 끝 마디 = 고리 밖 5′ · 쇠고리 = -OH(동그란 고리 = O)","say":"오른쪽 벽에 나란히 걸린 같은 모양의 오각판 둘에는 위 꼭짓점 안쪽에 둥근 옹이구멍이 있다. 고리 안의 산소를 나타낸다. 오각형 고리는 탄소 넷과 산소 하나로 이루어진다. 오른쪽 위 꼭짓점에 못으로 박아 둔 빨간 쪽지는 염기가 붙는 1번 탄소다. 여기서 시계 방향으로 오른쪽 아래가 2번, 왼쪽 아래가 3번, 왼쪽 위가 4번 탄소다. 4번 꼭짓점에서 삐져나온 짧은 팔 끝의 네모 마디는 고리 밖 5번 탄소다. 꼭짓점의 쇠고리는 -OH이며, 둥근 O 모양으로 산소를 떠올리자. 왼쪽 판의 2번·3번·5번에는 쇠고리가 하나씩, 총 셋 있다. 리보스다. 특히 2번 자리에 쇠고리가 있는지에 주목하자.","box":[[1474,450,221,252],[1695,500,52,202]],"src":["s38p03#6"],"cards":[]},{"sid":"s12","obj":"오른쪽 판은 생김새가 똑같은데(옹이구멍 · 쪽지 · 팔과 마디), 빨간 쪽지에서 시계 방향으로 바로 다음 꼭짓점(오른쪽 아래) 하나만 쇠고리 없이 맨숭맨숭하다 — 쇠고리는 왼쪽 아래와 마디 끝, 둘","fact":"DNA 의 당 = 디옥시리보스 — 2번 탄소 -OH → -H(디옥시) · RNA 는 -OH 라 불안정","hook":"쪽지 다음 꼭짓점(오른쪽 아래)이 맨숭 = 2번 탄소에 산소 없음","say":"오른쪽 판은 같은 모양이지만 오른쪽 아래 꼭짓점 하나에는 쇠고리가 없다. 빨간 쪽지의 1번 탄소에서 시계 방향으로 바로 다음인 2번 탄소다. 쇠고리는 3번과 5번의 둘뿐이다. 2번의 -OH가 -H로 바뀌어 산소가 빠진 것이 디옥시다. DNA의 당은 리보스가 아니라 이 디옥시리보스다. RNA는 그 자리에 -OH가 있어 더 불안정하다.","box":[[1704,454,42,42],[1744,488,30,58],[1760,428,252,290]],"src":["s38p03#7","s38p03#8"],"cards":["E1-16","E1-17"]}],"cq":{"E1-117":["이 단원의 한 줄 핵심은?","DNA가 정보를 저장하고, 상보적 염기쌍·효소로 정확히 복제되며, 단백질과 함께 염색체로 포장돼 전달된다"],"E1-14":["DNA의 기본 단위체는?","뉴클레오타이드"],"E1-15":["하나의 뉴클레오타이드를 이루는 세 가지는?","인산 · 디옥시리보스(당) · 질소염기"],"D0-3":["DNA를 구성하는 기본 단위체 4종이 속한 범주는?","뉴클레오타이드"],"E1-23":["인접한 뉴클레오타이드(당-인산)를 잇는 결합은?","인산이에스터 결합(phosphodiester)"],"E1-21":["DNA 두 가닥을 묶어주는 결합은?","염기 사이의 수소결합"],"I1-1":["핵산 혼성화(nucleic acid hybridization)란?","한 핵산 가닥이 상보적 서열의 다른 가닥(DNA/RNA)과 염기쌍을 이루는 것; 거의 모든 유전공학 기법의 기반"],"E1-20":["DNA 이중나선에서 당-인산 골격과 염기의 위치는?","골격은 바깥쪽, 염기는 안쪽"],"E1-18":["DNA 한 가닥의 두 말단은?","5' 말단과 3' 말단(방향성)"],"E1-19":["DNA 두 가닥이 서로 반대 방향으로 배열된 구조를 뭐라 하는가?","역평행(antiparallel)"],"E1-27":["퓨린과 피리미딘 염기를 구분하면?","퓨린=A·G(2고리) · 피리미딘=C·T(1고리)"],"E1-27#1":["퓨린과 피리미딘 염기를 구분 — 「퓨린」? (↔ 피리미딘)","A·G(2고리)"],"E1-27#2":["퓨린과 피리미딘 염기를 구분 — 「피리미딘」? (↔ 퓨린)","C·T(1고리)"],"E1-28":["이중나선의 폭이 일정하게 유지되는 이유는?","항상 퓨린+피리미딘이 짝을 이루기 때문"],"E1-22":["A-T와 G-C의 수소결합 수는?","A-T 2개 · G-C 3개"],"E1-26":["DNA에서 아데닌(A)은 무엇과 결합하는가? (우라실 주의)","티민(T)"],"F0-49":["암호 가닥과 mRNA의 차이 한 가지는?","DNA는 T를 쓰고 RNA는 U를 쓴다"],"E1-29":["DNA에 유전정보가 저장되는 방식은?","염기서열의 순서"],"D0-4":["자손에게 전달되는 정보는 각 유전자의 무엇의 형태로 주어지는가?","DNA 뉴클레오타이드 서열"],"D0-2":["유전정보가 기록된 물질은?","DNA"],"E1-16":["DNA를 구성하는 당은? (리보스와 혼동 주의)","디옥시리보스"],"E1-17":["디옥시리보스가 리보스와 다른 점은?","2번 탄소의 -OH가 -H로 바뀌어 있다(디옥시)"]},"hubPanel":"s38p01"};

let subOpen = false;

const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID

// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}

const scoreKey = 'lesson_' + L.id;

try {

    localStorage.setItem(scoreKey, JSON.stringify(store));

} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];

try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];

const ttsNorm = t => TTSNorm.ttsNorm(t, TTS_LEX, TTS_ORDER, L.id);
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate, auto:playing && mode === 'tour',
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate, auto:true,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }

}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();

  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);

}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);

}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));

$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
