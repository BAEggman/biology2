<script>
const L = {"id":"L43c","scene":"s43","part":"c","title":"공장의 먼 응원단 — 인핸서 · 활성자 · DNA 굽힘 · 매개자 · 사일렌서","sub":"담장 안 마당을 누비는 금빛 짚끈 한 가닥(DNA) · 깔개 곁의 빨간 방석(근거리 조절 요소) · 끈에 꿰인 응원 단과 폼폼 든 응원단원 셋(인핸서 · 활성자 · 조합 조절) · 끈을 따라가면 한참 먼 자리 · 회색 깔판 위에도(멀리 · 인트론 안에도) · 빈 단 둘(인핸서 여럿) · 끈을 접어 쥔 절하는 집사(DNA 굽힘 단백질) · 손에 손잡은 회색 양복 둘(매개자) · 어느 깔개에나 똑같은 안전모 일꾼(보편전사인자) · 빨간 사이렌 상자에 앉은 문지기와 멈춘 인쇄 기계(사일렌서)","img":"img/L43c.webp?v=1d880b3f0eed","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"벽돌 담장 안 마당 — 금빛 짚끈 한 가닥이 끊김 없이 마당을 누빈다(물건을 만나면 한쪽으로 들어가 반대쪽으로 나온다): 뒤 담 밑에서 나와 빨간 상자와 오른쪽 뒤 인쇄 기계를 지나고 · 오른쪽 가장자리를 돌아 깔판 셋 위를 지나 앞쪽 인쇄 기계를 지나고 · 왼쪽 뒤로 크게 돌아 나무 단 둘을 지나 그림 아래로 나간다 (틀)","fact":"원거리 조절 요소 둘 = 인핸서(전사 촉진) · 사일렌서(전사 억제)","hook":"끈 = DNA · 끈에 꿰인 것 = DNA 의 자리 · 응원 단 = 인핸서 · 사이렌 상자 = 사일렌서","say":"L43a에서 보았던 담장 안이다. 담장은 핵막, 인쇄 기계는 RNA 중합효소 II, 타탄 깔개는 TATA 상자, 그 위 안전모 일꾼은 보편전사인자였다. 이번에는 마당에 L37의 금빛 짚끈인 DNA 한 가닥이 길게 놓여 있다. 끈에 꿰인 소품은 모두 DNA의 특정 자리를 뜻한다. 기계에서 떨어진 두 자리를 보자. 응원단이 선 나무 단은 인핸서, 문지기가 앉은 빨간 사이렌 상자는 사일렌서다. 유전자와 멀리 떨어져 전사를 조절하는 원거리 조절 요소의 대표 예이며, 인핸서는 촉진하고 사일렌서는 억제한다.","cards":["F1-62"],"box":[[6,176,2036,962]]},{"sid":"s2","obj":"앞쪽 타탄 깔개 바로 뒤 — 끈 위에 놓인 둥근 빨간 방석에 주황 안전모 · 초록 멜빵바지 일꾼 하나가 앉았다 · 끈은 방석 왼쪽에서 방석 밑으로 들어가고 · 방석 오른쪽으로 조금 나와 바로 옆 인쇄 기계의 왼쪽 옆틀 뒤로 들어간다","fact":"근거리 조절 요소 — 프로모터 가까이 · 전사인자가 붙는 자리","hook":"깔개 곁의 방석 = 프로모터 곁(근거리) · 앉은 일꾼 = 전사인자","say":"앞쪽 인쇄 기계가 놓인 타탄 깔개가 프로모터다. 바로 뒤 끈 위의 빨간 방석에는 주황 안전모 일꾼이 앉아 있다. 프로모터 가까이 있는 조절 서열, 근거리 조절 요소다. 방석은 조절 서열이고 앉은 일꾼은 여기에 결합한 전사인자다. 가까운 방석과 멀리 떨어진 응원 단·사이렌 상자를 비교해 기억하자.","cards":["F1-63"],"box":[[940,704,170,156]]},{"sid":"s3","obj":"앞쪽 왼편 큰 나무 단 — 앞면에 빨강 · 노랑 · 파랑 동그라미가 나란히 셋 · 그 위에 응원단원 셋이 같은 차례로 섰다(빨간 폼폼과 빨간 치마 · 노란 폼폼과 노란 치마 · 파란 폼폼과 파란 치마)","fact":"조합 조절 — 여러 조절 단백질(활성자)의 조합이 발현을 결정한다","hook":"응원단원 = 활성자 · 세 자리가 제 빛깔로 다 차야 응원 = 조합 조절","say":"깔개 바로 왼쪽의 큰 나무 단은 인핸서다. 앞면의 빨강·노랑·파랑 동그라미 셋은 인핸서 안에 조절 자리가 여러 개 있음을 뜻한다. 그 위에는 폼폼을 든 응원단원 셋이 서 있다. 빨간 자리에는 빨간 폼폼, 노란 자리에는 노란 폼폼, 파란 자리에는 파란 폼폼이 놓여, 각 자리에 제 짝이 섰다. 활성자라는 조절 단백질이 각자의 인핸서 자리에 결합해 전사를 촉진하는 모습이다. 이 유전자는 세 사람이 모두 함께 모여야 강하게 전사된다. 한 조절 단백질이 아니라 여러 조절 단백질의 조합으로 발현이 결정되는 조합 조절이다.","cards":["F1-75"],"box":[[356,628,312,330]]},{"sid":"s4","obj":"큰 나무 단에서 앞쪽 인쇄 기계까지 끈을 따라가면 — 단 왼쪽으로 나가 작은 단을 지나고 왼쪽 가장자리를 돌아 왼쪽 뒤 집사의 손까지 갔다가 되돌아 빨간 방석으로 온다 · 인쇄 기계 오른쪽 끈 밑에는 청록 · 회색 · 청록 깔판 셋이 깔렸고 가운데 회색 깔판 위에 작은 단이 놓였다","fact":"인핸서는 수천 뉴클레오타이드 떨어져 있거나 인트론 안에도 있다","hook":"끈을 따라가면 한참 = 멀리 · 회색 깔판(인트론) 위의 단 = 인트론 안에도","say":"응원 단은 깔개 가까이에 있는 것처럼 보이지만, 금빛 끈을 따라가 보자. 큰 단에서 왼쪽의 작은 단으로 이어진 뒤 왼쪽 가장자리를 크게 돌아 뒤의 집사 손에 닿고, 다시 내려와야 방석과 인쇄 기계에 도달한다. DNA 서열상으로는 먼 자리다. 인핸서는 유전자에서 수천 뉴클레오타이드 떨어진 곳에도 있을 수 있다. 기계 오른쪽 끈 밑의 청록·회색·청록 깔판도 보자. L43b처럼 청록은 엑손, 회색은 인트론이다. 회색 깔판에도 작은 단이 있으므로, 인핸서는 유전자 내부의 인트론에도 있을 수 있다.","cards":["F1-66"],"box":[[6,424,1066,520],[1326,746,566,116]]},{"sid":"s5","obj":"아무도 서지 않은 작은 나무 단 둘 — 왼쪽 가장자리 것은 앞면 동그라미가 초록 · 주황 · 보라 · 회색 깔판 위 것은 보라 · 빨강 · 초록(큰 단의 빨강 · 노랑 · 파랑과 다르다)","fact":"한 유전자에 인핸서 여럿 — 세포 · 시기마다 다르게 정교히 조절","hook":"빈 단 = 다른 응원단을 기다리는 단 = 다른 세포 · 다른 때","say":"같은 끈에는 큰 나무 단 하나와 작은 단 둘이 있다. 작은 단은 왼쪽 가장자리와 회색 깔판 위에 놓였다. 셋 모두 앞쪽 인쇄 기계에 해당하는 한 유전자의 인핸서다. 한 유전자가 여러 인핸서를 가질 수 있다는 뜻이다. 비어 있는 작은 단 둘의 앞면 동그라미 색은 큰 단과 다르므로 다른 응원단이 결합할 자리다. 지금 마당에는 빨강·노랑·파랑 응원단만 있지만, 다른 세포나 다른 시기에는 다른 응원단이 와서 같은 유전자를 켤 수 있다. 여러 인핸서를 통해 세포 유형·시기·상황에 맞게 정교한 조절이 가능하다.","cards":["F1-73","F1-74","F1-163"],"box":[[62,706,198,96],[1510,746,184,90]]},{"sid":"s6","obj":"왼쪽 뒤 — 검은 연미복 · 흰 장갑의 키 큰 집사가 허리를 깊이 굽혀 절하며 두 손으로 끈의 꺾인 자리를 쥐었다 · 끈은 그 손에서 접혀 두 가닥이 나란히 내려오다 갈라진다(한 가닥은 왼쪽 가장자리 쪽으로 · 한 가닥은 빨간 방석 쪽으로)","fact":"DNA 굽힘 단백질 — DNA 를 접어 인핸서를 프로모터 가까이로","hook":"허리 굽힌 집사 = 굽힘 단백질 · 끈을 접으니 먼 단이 깔개 코앞","say":"왼쪽 뒤의 키 큰 집사가 허리를 깊이 굽혀 절하며 끈의 가운데를 두 손으로 접어 잡는다. DNA 굽힘 단백질이다. 끈은 집사의 손에서 접혀 두 줄로 내려온다. 이를 펴면 응원 단과 인쇄 기계가 멀리 떨어지지만, 접어 잡았기 때문에 단이 깔개 곁으로 왔다. DNA를 굽혀 인핸서와 프로모터를 물리적으로 가깝게 만드는 역할이다. 멀리 있는 인핸서가 작용할 수 있는 이유를 이 굽힘과 연결하자.","cards":["F1-69","F1-96"],"box":[[140,255,345,245]]},{"sid":"s7","obj":"큰 나무 단과 타탄 깔개 사이 — 똑같은 회색 양복 둘이 서로 손을 잡고 섰다 · 왼쪽 양복의 다른 손은 파란 폼폼 응원단원의 손을 · 오른쪽 양복의 다른 손은 깔개에 앉은 노란 안전모 일꾼이 든 손을 잡았다","fact":"매개자 단백질군 — 활성자와 전사 개시 복합체를 잇는다","hook":"손에 손잡은 양복 = 매개자 · 응원단과 일꾼을 잇는 인간 띠","say":"응원 단과 깔개 사이에서 회색 양복을 입은 두 사람이 손을 잡고 있다. 한쪽 끝의 손은 응원단원의 손을, 다른 쪽 끝의 손은 깔개에 앉은 일꾼의 손을 잡아 한 줄로 이어진다. 사이에서 연결하는 이 사람들이 매개자다. 이 매개자 단백질군이 인핸서의 활성자와 프로모터의 전사 개시 복합체를 이어 준다. 응원단이 가까이 오더라도 그 영향을 인쇄 기계에 전달하려면 중간에서 연결하는 매개자가 필요하다.","cards":["F1-70"],"box":[[648,748,262,222]]},{"sid":"s8","obj":"(되짚기) 차례대로 — 큰 단 위의 응원단원 셋 → 끈을 접어 쥔 집사 → 손잡은 회색 양복 둘 → 깔개의 노란 안전모 일꾼 둘과 인쇄 기계 → 기계에서 나와 그림 아래로 뻗은 흰 종이띠(노란 해 그림이 하나 찍혔다)","fact":"활성자 결합 → DNA 굽힘 → 매개자 · 보편전사인자 · Pol II 모집 → 개시","hook":"응원단 → 집사 → 양복 → 일꾼과 기계 → 종이띠","say":"전사가 켜지는 순서를 장면으로 되짚어 보자. 응원단이 단에 올라서는 것은 활성자의 인핸서 결합이다. 집사가 끈을 접으면 DNA 굽힘으로 인핸서와 프로모터가 가까워진다. 이어 양복을 입은 두 사람이 손을 연결하고, 깔개에 일꾼과 기계가 모인다. 매개자·보편전사인자·RNA 중합효소 II가 모집되어 전사 개시 복합체를 형성하는 단계다. 마지막에 기계가 돌아가며 해 그림의 종이띠를 내놓으면 전사 개시다. 활성자 결합, DNA 굽힘, 매개자와 보편전사인자 및 중합효소 모집, 전사 개시의 순서로 연결하자.","cards":["F1-72"],"box":[[356,628,312,330],[140,255,345,245],[648,748,262,222],[872,706,490,336],[1150,930,270,210]]},{"sid":"s9","obj":"타탄 깔개는 둘(앞쪽 · 오른쪽 뒤) — 두 깔개 모두 똑같은 차림(노란 안전모 · 파란 멜빵바지 · 노란 소매)의 일꾼이 둘씩 앉았다(오른쪽 뒤 둘은 눈을 감고 하품한다 · 앞쪽 왼편 일꾼은 한 손을 들고 입을 벌려 외친다) · 응원단원은 앞쪽 깔개 쪽에만 있고(손잡은 양복 둘을 사이에 두고) 오른쪽 뒤 깔개 둘레에는 응원단원이 없다","fact":"보편전사인자 = 거의 모든 유전자에 공통 · 활성자 = 특정 유전자 · 세포","hook":"똑같은 일꾼은 어느 깔개에나 · 응원단은 고른 깔개에만","say":"앞쪽과 오른쪽 뒤에 있는 타탄 깔개의 일꾼을 비교해 보자. 둘 다 L43a의 노란 안전모와 파란 멜빵바지를 입었다. 보편전사인자는 어느 유전자의 프로모터에나 기본적으로 필요한 공통 일꾼이며, 대부분 유전자의 전사에 관여한다. 반면 응원단은 앞쪽에만 있다. 활성자는 특정 유전자와 특정 세포에서만 작용해 발현할 유전자를 선택한다. 오른쪽 뒤에서는 일꾼이 하품하고 기계에서 종이도 나오지 않는다. 보편전사인자만으로는 전사가 낮은 수준에 머물고, 어떤 유전자를 강하게 전사할지는 활성자가 결정한다는 대비다.","cards":["F1-97"],"box":[[880,870,206,160],[1508,370,180,152]]},{"sid":"s10","obj":"가운데 뒤 — 끈이 왼쪽으로 들어가 오른쪽으로 나오는 빨간 쇠 상자 위에 회색 제복 · 챙 모자의 문지기가 팔짱을 끼고 앉았다 · 상자 위 빨간 경광등(사이렌)이 켜져 빛살이 뻗는다 · 그 끈을 따라간 오른쪽 뒤 인쇄 기계에서는 종이가 나오지 않는다","fact":"사일렌서 — 전사를 억제하는 DNA 조절 서열(억제자가 붙는다)","hook":"사이렌 ≈ 사일렌서 · 빨간 경광등 = 작업 중지 · 문지기 = 억제자","say":"가운데 뒤에서 금빛 끈이 빨간 쇠 상자를 통과한다. 위의 빨간 경광등인 사이렌이 켜져 있다. 사이렌에서 사일렌서를 연결하자. 공장에서 빨간 경광등이 돌면 작업을 멈춘다. 회색 제복의 문지기가 상자 위에서 팔짱을 끼고 있다. 문지기는 DNA에 결합해 전사를 막는 억제자다. L25의 오페론에서는 문턱에 있었지만, 여기서는 멀리 떨어진 사이렌 상자에 앉았다. 끈을 따라 오른쪽 뒤 기계로 가면 종이가 나오지 않는다. 사일렌서는 전사를 억제하는 DNA 조절 서열이다. 응원 단인 인핸서는 켜고, 사이렌 상자인 사일렌서는 끈다고 비교하자.","cards":["F1-98"],"box":[[938,184,182,226],[1624,252,258,252]]}],"cq":{"F1-62":["원거리 조절 요소의 대표 두 종류는?","인핸서와 사일렌서"],"F1-63":["근거리 조절 요소는 주로 무엇과 관련되는가?","전사인자 결합"],"F1-75":["진핵 전사 조절에서 조합적 조절(combinatorial control)이란?","여러 조절 단백질 조합에 의해 발현이 결정되는 것"],"F1-66":["인핸서는 유전자에서 가까이에만 존재하는가?","아니오, 수천 뉴클레오타이드 떨어져 있거나 인트론 안에도 있을 수 있다"],"F1-73":["하나의 유전자는 하나의 인핸서만 갖는가?","아니오, 여러 인핸서를 가질 수 있다"],"F1-74":["여러 인핸서를 가질 수 있다는 말의 의미는?","유전자가 서로 다른 세포나 시기에 다르게 조절될 수 있다는 뜻"],"F1-163":["한 유전자가 여러 인핸서를 가지는 생물학적 이점은?","상황과 세포 유형에 따라 정교하게 발현을 조절할 수 있다"],"F1-69":["DNA 굽힘 단백질의 역할은?","인핸서 부위와 프로모터 부위를 물리적으로 가깝게 만든다"],"F1-96":["인핸서가 멀리 떨어져도 작동할 수 있는 직접 이유는?","DNA 굽힘으로 프로모터와 가까워질 수 있기 때문"],"F1-70":["매개자 단백질군(mediator complex)의 역할은?","활성자와 전사 개시 복합체를 연결한다"],"F1-72":["인핸서를 통한 전사 활성화 과정을 순서대로 쓰면?","활성자가 인핸서에 결합 → DNA 굽힘 → 매개자·보편전사인자·RNA 중합효소 II 모집 → 전사 개시"],"F1-97":["활성자와 보편전사인자의 차이는?","활성자는 특정 유전자·세포에서 조절하고 보편전사인자는 대부분의 유전자 전사에 공통 필요하다"],"F1-98":["사일렌서의 역할은?","전사를 억제하는 DNA 조절 서열"]},"hubPanel":null};

let subOpen = false;

$('img').src = L.img; $('img').alt = L.title;

//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}

const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;

    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');

  const lettersOf = s => [...s].map(ch => LETTER[ch.toUpperCase()] || ch).join(' ');

  // 낱말 하나(사전에 없을 때) — 글자 이름 · 붙은 숫자 · 그리스 · 첨자
  function spell(tok) {

  const PAIR = { '가': ['이', '가'], '이': ['이', '가'], '를': ['을', '를'], '을': ['을', '를'], '는': ['은', '는'], '은': ['은', '는'], '와': ['과', '와'], '과': ['과', '와'] };
  const PART = /^(으로|로|가|이|를|을|는|은|와|과)(?=[\s,.·)」'"!?:;]|$)/;

    if (!(c >= 0xAC00 && c <= 0xD7A3)) return p;

    let out = '', i = 0, k;
    while ((k = t.indexOf(from, i)) >= 0) {
      out += t.slice(i, k) + to; i = k + from.length;

  }

    const W = (lex && lex.words) || {};
    let t = String(text);
    // ① 과 번호
    t = t.replace(/L(\d{2})([a-z]?)(?![A-Za-z0-9])((?:으로|로|가|이|를|을|는|은|와|과)(?=[\s,.·)」'"!?:;]|$))?/g, (all, n, c, pp) => {
      const id = 'L' + n + c; const title = order && order[id];
      const w = title ? `「${title}」 그림` : '다른 그림';
      return pp ? w + particle('그림', pp) : w;   // 「… 그림」 뒤 조사는 받침에 맞춤(그림와 → 그림과)
    });
    // ①-2 화학 위치 번호 「1,6-」 「1,3-」 → 「일 육 」(쉼표를 「콤마」로 읽지 않게)
    t = t.replace(/(?<![\d.])(\d),(\d)-/g, (all, a, b) => sino(+a) + ' ' + sino(+b) + ' ');
    // ② 로마 숫자(문맥) — 볼티모어 군 · 부두 번호는 한자어 수, 나머지는 영어 수. 대 · 자 · 선 · 기가 붙으면 글자
    const baltimore = /^L01/.test(lesson || '');
    t = t.replace(/(?<![A-Za-z0-9])(VII|VI|IV|V|III|II|I)(b|x)?(?![A-Za-z0-9₀-₉])((?:으로|로|가|이|를|을|는|은|와|과)(?=[\s,.·)」'"!?:;]|$))?/g, (all0, r, suf, pp, off, str) => {
      const all = r + (suf || ''); const P = x => x === all ? all0 : x + (pp ? particle(x, pp) : '');
      const after = str.slice(off + all.length, off + all.length + 3), before = str.slice(Math.max(0, off - 12), off);
      if (/^\s?(대|자|선)/.test(after)) return all0;                       // I대 · V자 · Z선 → 글자(기본값)
      const n = ROMAN[r];
      if (/^\s?(번|군)/.test(after) || (baltimore && !suf)) return P(sino(n) + (suf ? ' ' + lettersOf(suf) : ''));

    for (const [a, b] of [...((lex && lex.fixed) || []), ...FIXED]) t = rep(t, a, b);
    t = t.replace(/이온 이온/g, '이온');
    // ④ · ⑤ 낱말
    const readTok = tok => {
      const core = tok.replace(/^-+|-+$/g, '');
      if (!HAS.test(core)) return tok;                                    // 수만 — 그대로
      if (W[core] !== undefined) return tok.replace(core, W[core]);
      const lower = core.toLowerCase();
      if (W[lower] !== undefined && /^[a-z]/.test(core)) return tok.replace(core, W[lower]);

      return tok.replace(core, core.split('-').filter(Boolean).map(p => {
        const r = W[p] !== undefined ? W[p] : (/^[0-9]+$/.test(p) && prevWord ? tailNum(p) : spell(p));
        prevWord = /[A-Za-zα-ωΑ-ΩΨΔ]/.test(p); return r;

    t = t.replace(TOKP, (all, tok, p) => { const r = readTok(tok); return p && r !== tok ? r + particle(r, p) : r + (p || ''); });

  // 감사용 — 낱말마다 어느 규칙이 잡았나(사전 · 기본값)
  function classify(tok, lex) {
    const W = (lex && lex.words) || {}; const core = tok.replace(/^-+|-+$/g, '');
    if (W[core] !== undefined) return 'lex';
    // 소문자 세 글자 이상이 든 조각은 사전이 잡아야 한다(나머지 조각은 글자 이름이어도 된다)
    return core.split('-').filter(Boolean).every(p => W[p] !== undefined || !/[a-z]{3,}/.test(p)) ? 'lex' : 'default';

  return { ttsNorm, spell, sino, classify, LETTER, FIXED, TOKEN_RE: TOKEN };
});

const ttsNorm = t => TTSNorm.ttsNorm(t, TTS_LEX, TTS_ORDER, L.id);
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate, auto:playing && mode === 'tour',
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate, auto:true,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
