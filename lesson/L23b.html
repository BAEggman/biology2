<style>
  :root{--ink:#1b1b1f;--ink2:#4b4b55;--line:#e3e1da;--teal:#0f766e;--teal50:#ecfdf5;--gold:#b45309;--bg:#f7f5ef}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1100px;margin:0 auto;padding:12px 14px 40px}

  .titlebar{display:flex;align-items:center;gap:10px}.titlebar h1{flex:1;min-width:0}
  .star{font-size:22px;line-height:1;padding:2px 10px;color:#8a8a94}.star[aria-pressed="true"]{color:var(--gold);border-color:#e8c48c;background:#fff8ec}
  .sub{font-size:12.5px;color:var(--ink2);margin:0 0 10px}
  .sub.hid{cursor:pointer;color:var(--ink3,#8a8a94);border:1px dashed #c9c6bd;border-radius:8px;padding:4px 8px;display:inline-block}
  .cq{font-size:12.5px;color:var(--ink2);margin-top:8px;border-top:1px dashed #d8d5cc;padding-top:6px}.cq summary{cursor:pointer}.cq li{margin:3px 0}.cq .a{color:var(--ink);font-weight:600}

  .stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}

  .cap{margin-top:10px;min-height:76px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px}

  .cap .fact{font-size:14px;margin:2px 0}
  .cap .hook{font-size:13px;color:var(--gold);margin-top:4px}
  .cap.muted{color:var(--ink2);font-size:13px}
  .recap{margin-top:12px;display:none}

  .recap li{margin:4px 0;font-size:13.5px}

  .hole{fill:#000}

  .hot{fill:transparent;cursor:pointer}
  .hot:hover{fill:rgba(245,158,11,.18)}
  .judge{display:none;gap:6px;margin-top:8px}

  .bar.opt{margin-top:-4px}.bar.opt[hidden]{display:none}
  .nav{display:flex;gap:12px;font-size:12.5px;margin:2px 0 0}
  .nav a{color:var(--teal);text-decoration:none}
  .nav a:hover{text-decoration:underline}
</style>

<script>
/* lesson_store.js — 과 목록 · 과 화면이 함께 쓰는 저장 도우미(보기 화면 명세 §1.1).
   빌드(build_lesson.js)가 두 화면에 그대로 끼워 넣는다(__STORE__) — 열쇠 이름 · 꼴이 한 군데서만 정해진다.
   열쇠: lesson_stars {ID: 찍은 때(ms)} · lesson_prefs {onlyStar, autoNext, rep, scope} · lesson_ab_<ID> {a: sid, b: sid}
   읽기 · 쓰기는 모두 try/catch — 저장이 막힌 브라우저에서는 그 쪽을 떠날 때까지만 기억하고 오류를 내지 않는다.
   (lesson_<ID> · lesson_shuffle · lesson_srs_inbox · lesson_auto_start 는 여기서 건드리지 않는다) */
const LStore = (() => {
  const mem = {};
  const rd = (k, d) => {
    let ok = false;
    try { const v = localStorage.getItem(k); ok = true; if (v !== null && v !== undefined) { const o = JSON.parse(v); mem[k] = o; return o; } } catch (e) {}
    if (ok) { delete mem[k]; return d; }   // 저장소는 멀쩡한데 값이 없다 = 다른 탭에서 지웠다 — 메모리 값도 버린다
    return k in mem ? mem[k] : d;
  };
  const wr = (k, o) => { mem[k] = o; try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) {} };
  const del = k => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} };
  const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
  const REP = ['off', 'ab', 'one', 'list'];
  return {
    stars() { const s = rd('lesson_stars', {}); return isObj(s) ? s : {}; },
    isStar(id) { return id in LStore.stars(); },
    setStar(id, on) {
      const s = { ...LStore.stars() };
      if (on) s[id] = Date.now(); else delete s[id];
      if (Object.keys(s).length) wr('lesson_stars', s); else del('lesson_stars');
      return on;
    },
    prefs() {
      const p = rd('lesson_prefs', {}); const o = isObj(p) ? p : {};
      return { onlyStar: !!o.onlyStar, autoNext: !!o.autoNext, rep: REP.includes(o.rep) ? o.rep : 'off', scope: o.scope === 'star' ? 'star' : 'all' };
    },
    setPrefs(patch) { const p = { ...LStore.prefs(), ...patch }; wr('lesson_prefs', p); return p; },
    ab(id) { const v = rd('lesson_ab_' + id, null); return isObj(v) ? { a: typeof v.a === 'string' ? v.a : null, b: typeof v.b === 'string' ? v.b : null } : { a: null, b: null }; },
    setAb(id, v) { const k = 'lesson_ab_' + id; if (v && (v.a || v.b)) wr(k, { a: v.a || null, b: v.b || null }); else del(k); },
    REP,
  };
})();

const L = {"id":"L23b","scene":"s23","part":"b","title":"똑같은 열쇠 둘 — 아세틸콜린 수용체(니코틴성 · 무스카린성)","sub":"같은 ACh 열쇠 · 왼쪽의 니코틴성 이온통로(신경근접합부·자율신경절) · 오른쪽의 무스카린성 GPCR · 위층은 두 손가락과 멈춘 압착기(M₂·Gi/o·심박↓) · 아래층은 세 손가락과 피자 커터(M₃·Gq·평활근 수축·샘 분비)","img":"img/L23b.webp?v=17e9d78a208c","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"기둥 양쪽 — 왼쪽 창살문의 열쇠구멍과 오른쪽 맨 벽의 열쇠구멍에 똑같은 둥근 놋쇠 열쇠가 하나씩 꽂혔다 (틀)","fact":"같은 아세틸콜린인데 결과가 갈린다 — 흥분 · 억제를 정하는 것은 수용체","hook":"열쇠구멍에 꽂힌 똑같은 놋쇠 열쇠 = ACh · 다른 열쇠구멍 = 수용체","say":"굵은 기둥 하나가 건물을 왼쪽과 오른쪽으로 나눈다. 양쪽 열쇠구멍에는 똑같은 둥근 놋쇠 열쇠가 하나씩 꽂혀 있다. 열쇠는 아세틸콜린으로, 전기 신호에 따라 시냅스 말단에서 분비되는 신경전달물질이다. 같은 열쇠를 돌려도 결과는 다르다. 신경전달물질이 흥분 또는 억제를 일으키는지는 결합하는 수용체에 달려 있다. 열쇠보다 열쇠구멍을 보자.","box":[[150,280,200,110],[1130,480,230,240]],"src":["s23p02#0"],"cards":["B0-8","B0-7"]},{"sid":"s2","obj":"왼쪽 위층 창살문 — 열쇠구멍이 문에 바로 박혔고 주먹이 열쇠를 돌리자 그 자리에서 열린다 · 바깥 소금 자루에서 소금이 쏟아져 든다 · 바닥에 열린 담뱃갑","fact":"니코틴성 nAChR — 리간드개폐 이온통로 직결 · 즉각 · Na⁺ 유입으로 탈분극","hook":"문에 박힌 열쇠구멍 = 이온통로 직결 · 담뱃갑 = 니코틴","say":"왼쪽 위층 창살문은 열쇠구멍이 문에 직접 붙어 있다. 주먹이 열쇠를 돌리자 즉시 문이 열리고 바깥 소금 자루에서 흰 소금이 들어온다. 소금은 Na⁺이다. 바닥의 열린 담뱃갑에서 니코틴성 아세틸콜린 수용체를 떠올리자. 수용체 자체가 통로인 리간드개폐 이온통로이므로 바로 열린다. 양이온 통로이며, 탈분극에는 주로 Na⁺ 유입이 기여한다. 칼슘 자갈이 아니라 소금이라는 점을 구분하자. 교환국에서 담배를 꽂자 캔이 나온 이온 음료 자판기와 같은 수용체다.","box":[[75,55,505,590]],"src":["s23p02#1"],"cards":["X-SG-14","B0-220","B0-220#1"]},{"sid":"s3","obj":"위층 창살문 곁 — 벽을 뚫고 나와 빈 주먹으로 알통을 세운 근육 팔","fact":"골격근 신경근접합부의 수용체는 니코틴성 — 골격근 수축","hook":"빈 주먹 알통 팔 = 골격근","say":"옆 벽에서 솟은 근육 팔이 빈 주먹을 쥐고 알통을 만든다. 골격근이다. 운동 뉴런이 골격근에 아세틸콜린을 분비하는 신경근접합부에는 니코틴성 수용체가 있다. 문이 바로 열리고 근수축으로 이어지는 모습이다. 니코틴성 수용체가 있는 두 위치 중 첫째다.","box":[600,80,350,490],"src":["s23p02#2"],"cards":[]},{"sid":"s4","obj":"아래층 창살문 — 근육 팔은 없고 회색 재킷 사람이 위층과 똑같은 열쇠로 문을 연다","fact":"자율신경절 — 절전 뉴런의 ACh 가 절후 뉴런의 니코틴 수용체를 연다","hook":"근육 팔 없이 같은 열쇠 · 같은 문 = 신경 → 신경(절전 → 절후)","say":"아래층에도 열쇠구멍이 직접 달린 창살문이 있지만 근육 팔은 없다. 회색 재킷의 사람이 같은 둥근 놋쇠 열쇠로 문을 연다. 신경에서 신경으로 신호를 넘기는 자율신경절이다. 신경세포와 표적세포 사이의 좁은 틈이 시냅스이고, 동물 신경계의 이 근거리 전달을 시냅스 신호전달이라고 한다. 한 신경세포가 다른 신경세포에 신경전달물질을 넘기는 전달 과정이다. 절전 뉴런의 아세틸콜린이 절후 뉴런의 니코틴성 수용체를 연다. 교감과 부교감 모두 신경절에서는 니코틴성 수용체를 사용한다. 두 번째 위치로 기억하자.","box":[110,680,480,464],"src":["s23p02#3"],"cards":["B0-6","B0-9","B0-11"]},{"sid":"s5","obj":"오른쪽 — 맨 벽에 열쇠구멍판만 홀로 붙어 있고 뒤에 문이 없다 · 그 앞 바닥의 붉은 갓 흰 점 버섯","fact":"무스카린성 mAChR — G단백질 연결 수용체(GPCR) · 느리고 길게 작용","hook":"뒤에 문 없는 열쇠구멍 = GPCR · 붉은 갓 흰 점 = 무스카린","say":"오른쪽 벽에는 열쇠구멍판만 있고 문이 없다. 열쇠를 돌려도 그 자리에서 통로가 열리지 않는다. 바닥의 붉은 갓과 흰 점을 가진 광대버섯은 무스카린이다. 무스카린성 아세틸콜린 수용체는 G단백질 연결 수용체, GPCR이다. 전화 교환국에서 뱀이 일곱 번 통과했던 창구와 같은 종류다. 통로를 직접 여는 대신 안쪽으로 신호를 전달하므로 반응이 느리고 오래 지속된다.","box":[[1120,480,240,240],[1170,915,145,165]],"src":["s23p02#4"],"cards":["B0-220#2"]},{"sid":"s6","obj":"열쇠구멍 곁에서 시작하는 긴 복도를 나무 지게를 진 지게꾼이 짙은 회색 칩을 쳐들고 달린다 · 복도 끝은 위층 계단과 아래층 복도로 갈라진다","fact":"무스카린성 수용체는 G단백질에 신호를 건넨다 · 심장의 M₂는 Gi/o, 샘과 평활근의 M₃는 Gq","hook":"GTP 칩을 든 지게꾼 = 활성화된 G단백질 · 위아래 갈림길 = 서로 다른 효소와 반응","say":"지게꾼은 G단백질, 손의 네모 칩은 GTP이다. 아세틸콜린이 무스카린성 수용체에 결합하면 G단백질이 활성화된다. 복도 끝 위층의 느려지는 시계는 Gi/o, 아래층의 짜는 물자루는 Gq 경로다. 두 층의 도구는 각각 어느 효소를 어떻게 조절할까? 두 장면을 비교하며 떠올려 보자.","box":[[1420,500,240,340],[1660,240,200,320],[1650,560,175,260]],"src":["s23p02#5"],"ask":"같은 아세틸콜린을 받은 뒤 복도가 갈라진다. 지게꾼과 칩은 무엇이고 각 층에서는 어느 G단백질이 작동하는가?","cards":[]},{"sid":"s7","obj":"위층 갈래 끝에서 두 손가락이 시계 진자의 움직임을 늦춘다. 곁에는 수평 손잡이에 자물쇠가 걸린 압착기와 빈 받침이 있다.","fact":"M₂ → Gi/o → 아데닐산 고리화효소(AC) 억제 → cAMP↓ · 심박수↓","hook":"두 손가락 = M₂ · 빈 받침 = cAMP 감소 · 느려진 진자 = 심박수 감소","say":"진자에 댄 손가락 둘은 심장의 M₂ 수용체다. 금색 압착기 손잡이가 자물쇠로 잠기고 받침에 금빛 고리가 없다. 교감신경 그림의 α₂ 방과 같은 도구다. 미주신경 말단의 아세틸콜린이 M₂에 결합하면 Gi/o 계열의 G단백질이 활성화된다. Gαi가 아데닐산 고리화효소를 억제해 cAMP를 줄이고 동방결절의 박동을 늦춘다. M₂와 심박을 높이는 에피네프린 수용체는 모두 GPCR이지만, 세포의 신호 조합에 따라 효과는 반대가 될 수 있다. 그림에는 없는 보충으로, 다른 갈래에서는 Gβγ가 GIRK 칼륨 통로를 직접 열어 박동조율세포를 과분극시킨다.","box":[[1780,50,268,450],[1466,178,253,201]],"src":["s23p02#6"],"cards":["H0-73","B0-202#2","X-SG-15"],"ask":"위층은 어느 수용체인가? G단백질과 표적 효소를 말하고, 고리 농도와 심박수가 어떻게 변하는지 설명하자."},{"sid":"s8","obj":"아래층 갈래 끝에서 피자 커터가 원판을 둘로 가른다. 곁에서는 세 손가락이 가죽 물자루를 짜서 물방울이 떨어진다.","fact":"M₃ → Gq → PLC가 PIP₂를 IP₃·DAG로 절단 · IP₃→Ca²⁺ 방출 · 평활근 수축·샘 분비","hook":"세 손가락 = M₃ · 피자를 둘로 가르는 커터 = PLC · 쥐어짜기와 물방울 = 수축과 분비","say":"물자루를 쥔 손가락 셋은 M₃ 수용체다. 교감신경 그림의 α₁ 방과 같은 피자 커터가 원판을 자른다. Gq가 인지질분해효소 C, PLC를 활성화하면 막 인지질 PIP₂가 IP₃와 DAG로 나뉜다. IP₃는 소포체의 칼슘을 세포질로 방출시키고 DAG는 막에 남는다. 세포질 칼슘 증가는 기관지·장 평활근에서는 수축, 침샘·땀샘에서는 분비를 촉진한다. 쥐어짜는 손은 수축, 떨어지는 물방울은 분비로 나누어 읽자.","box":[[1817,650,231,443],[1344,815,461,301]],"src":["s23p02#7"],"ask":"아래층은 어느 수용체인가? G단백질과 커터가 자르는 원료·두 산물을 짚고, 어느 산물이 칼슘을 방출시켜 수축·분비로 이어지는지 말하자.","cards":["X-SG-10"]}],"cq":{"B0-8":["신경전달물질은 흥분성인가 억제성인가?","결합하는 수용체 종류에 따라 흥분성 또는 억제성으로 작용"],"B0-7":["시냅스 신호전달에서 전기 신호가 분비를 유도하는 물질은?","신경전달물질"],"X-SG-14":["니코틴성 ACh 수용체와 무스카린성 ACh 수용체의 형식은?","니코틴성=이온통로 직결(LGIC) / 무스카린성=GPCR"],"B0-220":["아세틸콜린 수용체의 두 종류와 작동 방식 차이는?","니코틴성(nAChR)=이온통로 직결형(LGIC)·골격근 수축 · 무스카린성(mAChR)=GPCR 방식·예 M2(심장 박동 느리게)"],"B0-220#1":["아세틸콜린 수용체의 두 종류와 작동 방식 차이 — 「니코틴성(nAChR)」? (↔ 무스카린성(mAChR))","이온통로 직결형(LGIC)·골격근 수축"],"B0-6":["동물 신경계의 특성화된 근거리 신호전달 양상은?","시냅스 신호전달"],"B0-9":["시냅스란?","신경세포와 표적세포 사이의 좁은 틈"],"B0-11":["한 신경세포에서 다른 신경세포로 신경전달물질을 보내는 것을 무엇이라 하는가?","전달"],"B0-220#2":["아세틸콜린 수용체의 두 종류와 작동 방식 차이 — 「무스카린성(mAChR)」? (↔ 니코틴성(nAChR))","GPCR 방식·예 M2(심장 박동 느리게)"],"H0-73":["부교감신경 항진 시 심장에 미치는 대표 효과는?","심박수 감소"],"B0-202#2":["G 단백질 3유형과 각 표적 — 「Gi」? (↔ Gs vs Gq)","아데닐산고리화효소 억제"],"X-SG-15":["M2(심박↓)와 에피네프린 수용체(심박↑)는 각각 어떤 수용체 형식인가?","둘 다 GPCR — 같은 GPCR이라도 세포별 조합 따라 효과가 반대"],"X-SG-10":["PLC를 활성화하는 G단백질은?","Gq (← Gs/Gi는 아데닐산 고리화효소 담당)"]},"hubPanel":"s23p02"};
const $ = id => document.getElementById(id);

let subOpen = false;

$('sub').onclick = () => { if (mode === 'review' || mode === 'quiz') { subOpen = !subOpen; subShow(); } };

function paintStar() { const on = LStore.isStar(L.id); $('bStar').setAttribute('aria-pressed', String(on)); $('bStar').textContent = on ? '★' : '☆'; $('bStar').setAttribute('aria-label', on ? '중요 표시 지우기' : '중요 표시'); }

if (L.home) $('home').href = L.home;  // 한 파일(standalone)은 저장소 밖에서 열리므로 배포 주소로

let tourEnded = false, recapAt = -1;

const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID

// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');

    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];

function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(startAt()); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour'); repPaint();
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(startAt()); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
