<script>
const L = {"id":"L11e","scene":"s11","part":"e","title":"선로의 끝 — 텔로미어와 텔로머레이스","sub":"같은 염색체 말단의 두 운명 · 민판자(안쪽 DNA) · 반복 무늬 판자(텔로미어) · 빠진 쇠못(새 지연가닥 5′ 끝의 프라이머) · 은빛 띠 작업자(자체 RNA로 반대 가닥 3′ 끝 연장) · 막힌 선로(분열 한계)","img":"img/L11e.webp?v=d361f97e6074","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"같은 모양의 선로 셋. 오른쪽 끝을 위에서 아래로 비교한다.","fact":"위는 출발점 · 가운데는 말단 단축 · 아래는 텔로머레이스가 작용하는 경우","hook":"위에서 출발해 가운데와 아래의 두 결과를 비교","say":"맨 위 선로는 처음의 염색체다. 그 아래에는 같은 말단에서 일어날 수 있는 두 경우가 놓여 있다. 가운데 선로는 복제를 거듭하면서 말단이 짧아지는 경우이고, 아래 선로는 텔로머레이스가 말단을 연장하는 경우다. 가운데의 막힌 길을 통과한 다음 아래로 가는 순서가 아니라는 점을 먼저 구별하자. 이제 각 선로를 이루는 두 줄의 오른쪽 끝을 따로 살펴보자. 나무 판자의 무늬는 DNA를 나타낸다.","box":null,"src":["s11p05#0"],"cards":[]},{"sid":"s2","obj":"왼쪽의 칠하지 않은 나무 판자는 세 선로에서 그대로 이어진다.","fact":"민판자 = 염색체 안쪽의 DNA · 끝의 반복 서열이 유전자 손실을 늦춘다","hook":"민판자는 안쪽에, 먼저 짧아지는 반복 판자는 맨 끝에","say":"왼쪽의 무늬 없는 민판자를 보자. 유전자가 들어 있는 염색체 안쪽 구간이며, 세 선로 모두 이 부분은 비슷하게 남아 있다. 말단에는 반복 서열이 있어서 염색체가 짧아질 때 유전자 구간부터 사라지는 것을 막아 준다.","box":[[0,190,880,220],[0,520,880,220],[0,860,880,230]],"src":["s11p05#1"],"ask":"끝에서 복제가 덜 되어도 왼쪽의 유전자 구간이 먼저 짧아지지 않는 까닭은?","cards":["C1-89"]},{"sid":"s3","obj":"오른쪽 끝에는 빨강과 파랑 나무 판자가 되풀이된다.","fact":"텔로미어 = 말단의 반복 비암호화 DNA · 척추동물의 G-풍부 가닥은 5′-TTAGGG-3′ 반복","hook":"끝에 반복되는 두 색 무늬 → 텔로미어 · 염색체 끝 보호","say":"선로의 오른쪽 끝에는 같은 색의 무늬가 반복된다. 이것이 텔로미어의 반복 DNA이다. 척추동물에서는 구아닌이 풍부한 한쪽 가닥에 티티에이지지지가 오 프라임에서 삼 프라임 방향으로 반복된다. 이 반복 서열은 여기에 결합하는 단백질과 함께 염색체의 끝을 보호한다.","box":[[880,188,1027,206],[895,510,398,216],[891,853,480,250]],"src":["s11p05#2"],"ask":"오른쪽 끝의 반복 무늬는 무엇이며, 척추동물에서 G가 많은 가닥의 반복 단위는?","cards":["E1-92","C1-89"]},{"sid":"s4","obj":"가운데 선로에서 앞쪽 줄은 못구멍과 빠진 쇠못 앞에서 끊긴다. 뒤쪽 줄은 더 오른쪽까지 이어진다.","fact":"마지막 RNA 프라이머 제거 → 새 지연가닥 5′ 끝이 짧고 맞은편 G 가닥 3′ 끝이 돌출","hook":"빠진 못 자리 바깥에 합성을 시작할 3′-OH가 없음 → 새 가닥 5′ 끝이 비어 남음","say":"앞 장면에서 판자 길의 맨 끝에 빠져 있던 쇠못을 떠올려 보자. 지연가닥 말단의 마지막 RNA 프라이머를 제거하면, 그 빈자리 바깥쪽에는 DNA 중합효소가 이어 쓸 삼 프라임 말단이 없다. 그래서 새로 합성된 지연가닥의 오 프라임 끝은 짧게 남는다. 맞은편의 구아닌이 풍부한 가닥에서는 삼 프라임 끝이 돌출된다. 이 장면은 선형 염색체의 지연가닥 쪽 말단 복제 문제를 보여 준다. 환형 염색체에는 이런 끝이 없다.","box":[[1235,618,210,151],[1400,508,356,75]],"src":["s11p05#3","s11p04#6"],"ask":"빠진 못은 무엇인가? 이 자리를 채울 수 없는 이유와 짧은 쪽·돌출된 쪽의 말단 방향은?","cards":["C1-149","I1-41","E1-90"]},{"sid":"s5","obj":"아래 선로 끝의 사람 · 어깨에서 등으로 두른 은빛 쇠 띠","fact":"텔로머레이스는 자체 RNA를 주형으로 쓰는 역전사효소","hook":"들고 다니는 쇠 띠는 RNA 주형 · 빠진 쇠못은 RNA 프라이머","say":"아래 선로에서 일하는 작업자가 텔로머레이스다. 어깨에 두른 은빛 띠는 이 효소에 들어 있는 RNA 주형을 나타낸다. 둥글게 말린 띠가 어떤 DNA 서열을 더할지 알려 주는 본인 셈이다. 가운데 선로에서 빠진 쇠못도 RNA이지만 역할은 다르다. 그 쇠못은 합성의 시작점을 제공했던 프라이머다.","box":[1473,665,221,221],"src":["s11p05#4"],"ask":"빠진 쇠못과 작업자가 지닌 쇠 띠는 모두 RNA다. 둘의 역할은 어떻게 다른가?","cards":["C1-90","E1-93","E1-94"]},{"sid":"s6","obj":"아래 선로의 뒤쪽 긴 줄 끝. 작업자가 은빛 띠를 대고 빨간 나무 판자를 잇는다. 앞쪽 짧은 줄과 빠진 못은 그대로다.","fact":"텔로머레이스는 G 가닥 3′ 끝 연장 · 뒤이어 프라이메이스–DNA 중합효소 α가 상보 가닥 합성","hook":"쇠 띠를 본떠 3′ 끝에 DNA 반복 추가 → 늘어난 DNA를 본떠 반대 가닥 보완","say":"작업자는 자체 RNA의 서열을 본떠, 구아닌이 풍부한 가닥의 돌출된 삼 프라임 끝에 DNA 반복 서열을 더한다. RNA를 주형으로 DNA를 만드는 역전사다. 짧은 가닥의 오 프라임 끝에 직접 덧붙이는 과정과 구별하자. 그다음 프라이메이스가 새 RNA 프라이머를 놓고, DNA 중합효소 알파가 길어진 G 가닥을 주형으로 상보적인 C 가닥을 합성한다. 이 과정이 끝난 성숙한 말단에도 G 가닥의 삼 프라임 돌출부는 남는다.","box":[1660,820,207,167],"src":["s11p05#5"],"ask":"작업자는 어느 가닥의 어느 끝을 무엇을 본떠 늘리는가? 그 다음에 반대 가닥을 합성하는 효소는?","cards":["E1-120","I1-42"]},{"sid":"s7","obj":"가운데 선로에만 교차한 나무 판자 두 장이 길을 막고 있다. 아래 선로에는 작업자가 있다.","fact":"지나치게 짧은 텔로미어 → 분열 정지 가능 · 생식계열·일부 줄기세포·대부분 암세포에서 효소 활성","hook":"가운데 막힌 선로 = 임계 단축 뒤 분열 한계 · 아래 작업자 = 말단 유지","say":"가운데 선로를 막은 나무 장벽은 세포의 분열 한계다. 대부분의 분화 체세포는 텔로머레이스 활성이 낮다. 따라서 분열을 거듭해 텔로미어가 지나치게 짧아지면 분열이 멈출 수 있다. 생식계열과 일부 줄기세포에서는 텔로머레이스가 말단 유지에 기여한다. 대부분의 암세포도 이 효소를 활성화해 계속 분열할 수 있는 조건을 얻는다.","box":[1734,378,290,355],"src":["s11p05#6"],"ask":"가운데처럼 분열이 멈출 수 있는 조건은? 아래 효소로 말단을 유지하는 세포의 대표 예는?","cards":["E1-95","E1-96","E1-97","I1-43","F0-166"]}],"cq":{"C1-89":["텔로미어(Telomere)의 역할은?","염색체 말단 보호 및 정보 소실 방지"],"E1-92":["텔로미어(telomere)란?","염색체 말단의 반복적 비암호화 서열로 유전자 손실을 지연시킴"],"C1-149":["텔로미어가 복제를 거듭할수록 짧아지는 이유는?","말단 복제 문제"],"I1-41":["말단 복제 문제(end-replication problem)란?","선형 염색체가 복제 때마다 지연가닥 끝 RNA 프라이머 자리를 못 메워 새로 만든 가닥의 5′ 말단이 조금씩 짧아짐(주형의 3′ 말단은 홑가닥으로 남음)"],"E1-90":["선형 DNA의 말단 복제 문제란?","마지막 RNA 프라이머 제거 후 그 자리를 못 채워 복제할수록 말단이 짧아지는 문제"],"C1-90":["암세포에서 텔로미어 길이를 유지해주는 효소는?","텔로머레이스 (Telomerase)"],"E1-93":["텔로머라아제(telomerase)의 기능은?","텔로미어를 연장하는 효소"],"E1-94":["텔로머라아제가 주형으로 쓰는 것은?","자신이 가진 RNA"],"E1-120":["텔로머라아제가 수행하는 반응의 종류는?","역전사"],"I1-42":["텔로머레이스(telomerase)의 작동은?","자체 RNA 주형을 본떠 3′ 말단에 텔로미어 반복서열(척추동물 TTAGGG)을 새로 합성·연장(RNA 주형 역전사효소)"],"E1-95":["텔로머라아제 활성이 중요한 세포는?","생식세포 · 줄기세포 · 대부분의 암세포"],"E1-96":["대부분의 체세포에서 텔로머라아제 활성은?","낮거나 없다"],"E1-97":["암세포에서 텔로머라아제 활성화의 결과는?","세포가 제한 없이 분열하는 데 기여"],"I1-43":["텔로머레이스가 활성인 세포는?","생식세포·줄기세포·대부분의 암세포(분화한 체세포에서는 억제)"],"F0-166":["텔로미어를 연장해 암세포 불멸성에 관여하는 효소는?","텔로머라아제"]},"hubPanel":"s11p05"};
