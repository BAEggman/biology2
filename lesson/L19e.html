<script>
/* lesson_store.js — 과 목록 · 과 화면이 함께 쓰는 저장 도우미(보기 화면 명세 §1.1).
   빌드(build_lesson.js)가 두 화면에 그대로 끼워 넣는다(__STORE__) — 열쇠 이름 · 꼴이 한 군데서만 정해진다.
   열쇠: lesson_stars {ID: 찍은 때(ms)} · lesson_prefs {onlyStar, autoNext, rep, scope} · lesson_ab_<ID> {a: sid, b: sid}
   읽기 · 쓰기는 모두 try/catch — 저장이 막힌 브라우저에서는 그 쪽을 떠날 때까지만 기억하고 오류를 내지 않는다.
   (lesson_<ID> · lesson_shuffle · lesson_srs_inbox · lesson_auto_start 는 여기서 건드리지 않는다) */
const LStore = (() => {
  const mem = {};
  const rd = (k, d) => {
    let ok = false;
    try { const v = localStorage.getItem(k); ok = true; if (v !== null && v !== undefined) { const o = JSON.parse(v); mem[k] = o; return o; } } catch (e) {}
    if (ok) { delete mem[k]; return d; }   // 저장소는 멀쩡한데 값이 없다 = 다른 탭에서 지웠다 — 메모리 값도 버린다
    return k in mem ? mem[k] : d;
  };
  const wr = (k, o) => { mem[k] = o; try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) {} };
  const del = k => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} };
  const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
  const REP = ['off', 'ab', 'one', 'list'];
  return {
    stars() { const s = rd('lesson_stars', {}); return isObj(s) ? s : {}; },
    isStar(id) { return id in LStore.stars(); },
    setStar(id, on) {
      const s = { ...LStore.stars() };
      if (on) s[id] = Date.now(); else delete s[id];
      if (Object.keys(s).length) wr('lesson_stars', s); else del('lesson_stars');
      return on;
    },
    prefs() {
      const p = rd('lesson_prefs', {}); const o = isObj(p) ? p : {};
      return { onlyStar: !!o.onlyStar, autoNext: !!o.autoNext, rep: REP.includes(o.rep) ? o.rep : 'off', scope: o.scope === 'star' ? 'star' : 'all' };
    },
    setPrefs(patch) { const p = { ...LStore.prefs(), ...patch }; wr('lesson_prefs', p); return p; },
    ab(id) { const v = rd('lesson_ab_' + id, null); return isObj(v) ? { a: typeof v.a === 'string' ? v.a : null, b: typeof v.b === 'string' ? v.b : null } : { a: null, b: null }; },
    setAb(id, v) { const k = 'lesson_ab_' + id; if (v && (v.a || v.b)) wr(k, { a: v.a || null, b: v.b || null }); else del(k); },
    REP,
  };
})();

const L = {"id":"L19e","scene":"s19","part":"e","title":"구덩이 안의 두 길 — 아폽토시스 경로","sub":"외인성 Fas–FasL · 내인성 시토크롬 c와 Apaf-1 · 아폽토솜 · 개시 캐스페이즈-8·9와 실행 캐스페이즈-3 · Asp 뒤 절단","img":"img/L19e.webp?v=39ed4b3e0d39","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"구덩이 안 — 비탈 둘이 바닥 한 자리에서 만난다","fact":"아폽토시스 신호는 밖(외인)과 안(내인)에서 · 끝은 같다 · 여러 신호전달 경로의 통합","hook":"길 둘 · 끝 하나","say":"피오십삼이 뚜껑을 열어 둔 구덩이 안을 보자. 두 비탈길이 내려와 바닥의 한 지점에서 만난다. 아폽토시스를 시작하는 신호는 세포 밖과 안에서 모두 올 수 있고, 세포 종류와 유발 신호에 따라 경로가 달라진다. 왼쪽은 외인성, 오른쪽은 내인성 경로다. 출발은 달라도 같은 끝으로 모이므로 아폽토시스는 여러 세포 신호전달 경로가 통합된 결과다.","box":null,"src":["s19p02d#0"],"cards":["B0-160","B0-5","B0-176"]},{"sid":"s2","obj":"창턱에서 왼쪽 비탈로 걸친 커다란 정사각형 천 냉파스. 넓은 민트색 약제 면에 잎과 눈꽃이 있고, 흰 종이 이형지가 말려 올라갔다. 왼쪽 위 벽감에는 같은 민트 무늬가 있다.","fact":"외인성 경로에서 FasL이 표적 세포의 Fas 죽음수용체에 결합한다","hook":"천 냉파스의 파스 → Fas · 비탈 바깥으로 열린 창 → 세포 밖에서 결합하는 FasL","say":"이형지를 젖힌 큰 냉파스를 붙이는 모습을 보자. 냉파스의 소리에서 Fas를 떠올리자. 죽음 리간드 FasL이 표적 세포막의 Fas 수용체에 결합하면 어댑터 FADD가 수용체에 붙고, 이어 프로캐스페이즈-8을 모집한다.","box":[[76,309,550,404],[662,217,163,210]],"src":["s19p02d#1"],"ask":"냉파스가 가리키는 수용체는 무엇인가? 세포 밖의 어떤 리간드와 결합해 어느 개시 캐스페이즈를 활성화하는가?","cards":["B0-162","B0-161"]},{"sid":"s3","obj":"오른쪽 위 턱의 부서진 지퍼 — 거기서 오른 비탈 시작","fact":"내인성 = 수선 불가능한 DNA 손상(p53이 연 그 구덩이)","hook":"지퍼 = 이중나선 · 부서짐 = 손상","say":"오른쪽 위 턱의 지퍼는 가운데가 벌어지고 이빨이 부서져 있다. 이 자리에서 오른쪽 비탈이 시작된다. 수선할 수 없는 디엔에이 손상은 대표적인 내인성 신호다. 게놈의 수호자가 손상을 확인하고 열었던 구덩이와 연결하자.","box":[1560,440,320,120],"src":["s19p02d#2"],"cards":["B0-163","B0-216#1"]},{"sid":"s4","obj":"오른 비탈 위의 콩 모양 통(안쪽 주름)","fact":"미토콘드리아 경로 — 길목이지 출발점이 아니다","hook":"콩 모양 + 안쪽 주름 = 미토콘드리아","say":"오른쪽 비탈의 콩 모양 통은 겉은 매끈하지만 잘린 면 안에 주름이 보인다. 미토콘드리아다. 포유동물의 주요 아폽토시스 경로 중 하나는 미토콘드리아 단백질을 이용한다. 통이 비탈길 위에 놓여 있다는 점을 보자. 신호의 출발점이 아니라 신호가 거쳐 가는 길목이다.","box":[1260,500,320,260],"src":["s19p02d#3"],"cards":["B0-177"]},{"sid":"s5","obj":"오른쪽 비탈의 주름진 콩 통에서 윤기 나는 진홍색 씨알이 빠져나와 아래 받침 쪽으로 흩어진다.","fact":"Bax·Bak의 미토콘드리아 외막 투과화 → 막사이공간의 시토크롬 c가 세포질로 방출","hook":"미토콘드리아 바깥으로 나온 반짝이는 씨알 → 크롬·씨, 시토크롬 c · 진홍색 → 단백질 안의 헴 c","say":"세포사멸 신호를 받으면 Bax와 Bak이 미토콘드리아 외막의 투과성을 높인다. 막사이공간의 시토크롬 c가 세포질로 나오는 과정이다. 크롬처럼 반짝이는 씨알에서 시토크롬 c의 크롬·씨를 떠올리자. 씨알 하나는 단백질 하나이고, 진홍색은 그 안의 헴 c이다. 시토크롬 c는 평소에는 미토콘드리아 전자전달계에서 전자를 운반한다.","box":[[1266,495,298,268],[1229,712,109,147],[1484,644,96,188]],"src":["s19p02d#4","s19p02d#5"],"ask":"붉은 구슬은 무엇이며 어디에서 어디로 나오는가? 외막을 투과성으로 만드는 단백질과 구분해 말해 보자.","cards":["B0-178","B0-179","B0-216#2","C1-63"]},{"sid":"s6","obj":"오른쪽 아래, 프라이팬에 정강이를 부딪쳐 아파하는 사람이 지팡이 하나 곁에서 원형 받침을 가리킨다. 일곱 팔 끝마다 붉은 씨알이 있고, 일곱 팔이 중앙의 캐스터네츠로 모인다.","fact":"시토크롬 c + Apaf-1 → 7량체 아폽토솜 → 프로캐스페이즈-9 모집·활성화","hook":"정강이가 아파 + 프라이팬의 프 + 지팡이 하나 → 아파프 원(Apaf-1) · 일곱 팔이 모여 붉은 씨알을 받침 → 아폽토솜","say":"프라이팬 손잡이에 정강이를 부딪치면 아파 하고 외치게 된다. 아파와 프라이팬의 프, 지팡이 한 개를 연결해 아파프 원, Apaf-1을 떠올리자. 받침의 팔 하나는 Apaf-1 한 분자다. 세포질로 나온 시토크롬 c가 Apaf-1에 결합하면 ATP 또는 dATP의 도움으로 일곱 분자가 모여 바퀴 모양 아폽토솜을 형성한다. 가운데 벌어진 캐스터네츠는 모집되어 활성화되는 프로캐스페이즈-9이다.","box":[[1266,813,215,272],[1424,809,395,260]],"src":["s19p02d#6"],"ask":"정강이가 아픈 사람, 프라이팬, 지팡이 한 개를 순서대로 읽으면 어느 단백질인가? 어느 단백질을 결합해 몇 분자가 모이며, 중앙에 어떤 전구효소를 모집하는가?","cards":["B0-216#3","B0-216","C1-64"]},{"sid":"s7","obj":"두 비탈이 만난 자리의 벌어진 캐스터네츠","fact":"캐스페이즈 — 사멸을 일으키는 단백질분해효소(자르는 짝) · 어느 길이든 여기로","hook":"캐스터네츠 = 캐스페이즈","say":"두 비탈이 만나는 곳에 벌어진 캐스터네츠 한 벌이 놓여 있다. 캐스터네츠에서 캐스페이즈를 떠올리자. 카스파아제라고도 쓰는, 아폽토시스를 일으키는 단백질분해효소 무리다. 두 짝이 맞물려 무는 도구를 단백질을 자르는 기능과 연결한다. 어느 경로에서 시작하든 이 효소들로 모여 사멸을 직접 집행한다.","box":[880,900,260,180],"src":["s19p02d#7"],"cards":["B0-173","C1-65"]},{"sid":"s8","obj":"벽감 셋 — 위 둘 · 아래 하나 · 캐스터네츠 하나씩","fact":"개시 캐스페이즈 둘(위) → 실행 캐스페이즈 하나(아래)","hook":"위 둘이 아래 하나로 모인다","say":"뒷벽에는 위에 둘, 그 사이 아래에 하나의 벽감이 있고 각각 캐스터네츠가 있다. 위의 둘은 경로를 여는 개시 캐스페이즈, 아래 하나는 실제 절단을 수행하는 실행 캐스페이즈다. 두 갈래가 하나로 모이는 배치를 따라가 보자.","box":[[680,120,980,600]],"src":["s19p02g#0"],"drop":["X-SG-23"],"cards":[]},{"sid":"s9","obj":"위 왼쪽 벽감. 민트 냉파스 옆 점판은 아홉 자리 가운데 한 칸이 비었다.","fact":"Fas–FasL → FADD → 프로캐스페이즈-8 모집·활성화 → 실행 캐스페이즈","hook":"냉파스 → Fas · 가운데 빈 아홉 자리 → 8","say":"점 여덟 개가 있는 왼쪽 벽감은 바깥 신호로 시작하는 경로다. Fas에 FasL이 결합하면 FADD가 프로캐스페이즈-8을 모집해 활성화를 돕는다. 활성화된 캐스페이즈-8은 실행 캐스페이즈를 켠다.","box":[675,123,325,311],"src":["s19p02g#1"],"ask":"냉파스 쪽의 점은 몇 개인가? 죽음수용체에 전구효소를 모으는 어댑터와 이 개시 캐스페이즈의 이름은?","cards":["B0-217"]},{"sid":"s10","obj":"위 오른쪽 벽감. 붉은 구슬 테의 작은 모형을 곁에 둔 캐스터네츠와 점이 아홉 개 모두 있는 판.","fact":"내인성 경로에서는 아폽토솜이 프로캐스페이즈-9를 모집하여 활성화한다","hook":"구슬 테의 작은 모형 → 아폽토솜 · 꽉 찬 점판 → 9","say":"바닥의 큰 일곱 팔은 아폽토솜이다. 오른쪽 벽감의 붉은 점 테는 같은 복합체를 작게 나타낸 표지다. 세포질의 시토크롬 c와 Apaf-1이 만든 아폽토솜에서 프로캐스페이즈-9가 활성화된다. 검은 점 아홉 개를 개시 효소의 번호와 연결하자.","box":[1060,120,320,320],"src":["s19p02g#2"],"ask":"오른쪽 위 캐스터네츠를 모집하는 복합체와 그것이 활성화하는 개시 효소는 무엇인가?","cards":["B0-216#4","X-SG-22","B0-216"]},{"sid":"s11","obj":"아래 벽감 — 점판 한 줄 셋","fact":"실행 = 캐스페이즈-3 · 8과 9는 가운데 한 자리 차이","hook":"격자가 아니라 한 줄 셋","say":"아래 벽감에는 점 셋이 한 줄로 있다. 실행 캐스페이즈 삼이다. 개시 효소가 활성화하면 실제 절단을 수행한다. 팔과 구의 점판은 가운데 한 자리가 비었는지 채워졌는지로 구별하자. 가운데 한 자리만 다른 이 둘은 시험에서 가장 쉽게 뒤바뀌는 짝이다. 외인성은 팔, 내인성은 구, 실행은 삼이다.","box":[860,440,320,280],"src":["s19p02g#3","s19p02g#4"],"cards":["X-SG-21","B0-218","B0-218#1","B0-218#2","S-SG-15"]},{"sid":"s12","obj":"구슬 사슬의 아스파라거스 — 캐스터네츠가 바로 오른쪽을 물어 끊었다","fact":"캐스페이즈 = 시스테인 단백질분해효소 · Asp 뒤를 자른다(c · asp · ase)","hook":"아스파라거스 = 아스파르트산 · 뒤를 문다","say":"벽의 구슬 사슬에 아스파라거스 한 대가 끼어 있고, 캐스터네츠가 그 바로 오른쪽을 물어 잘랐다. 아스파라거스 자체는 멀쩡하다. 캐스페이즈는 아스파르트산 뒤의 결합을 자르는 시스테인 단백질분해효소다. 이름의 씨는 시스테인, 아스프는 아스파르트산, 에이스는 효소와 연결된다. 아스파라거스라는 소품 때문에 아스파라진으로 혼동하지 말자.","box":[1540,280,500,480],"src":["s19p02k#0","s19p02k#1"],"cards":["B0-215","X-SG-24"]},{"sid":"s13","obj":"오른쪽 위 못걸이의 여러 캐스터네츠와 그 아래 사슬을 무는 캐스터네츠.","fact":"캐스페이즈는 기능이 다르다 · 개시 8·9, 실행 3·6·7, 염증성 1·4·5(사람의 예)","hook":"못걸이의 여러 캐스터네츠 → 같은 효소군에 서로 다른 역할 · 사슬을 무는 짝 → 기질 절단","say":"캐스페이즈들은 아스파르트산 뒤의 펩타이드 결합을 자른다는 공통점이 있지만, 주요 기질과 생리적 기능은 다르다. 대표 개시 효소는 8과 9, 대표 실행 효소는 3·6·7이다. 사람의 캐스페이즈-1·4·5는 염증 반응에도 관여한다. 번호가 사람에게 있는 캐스페이즈의 총개수를 뜻하는 것은 아니다.","box":[1354,80,665,135],"src":["s19p02k#2","s19p02k#3"],"ask":"걸린 캐스터네츠가 여럿이다. 개시 효소와 실행 효소의 예를 대고 사멸 이외의 기능도 하나 말해 보자.","cards":["B0-175"]}],"cq":{"B0-160":["아폽토시스를 시작하는 신호는 어디서 올 수 있는가?","세포 외부와 세포 내부 모두"],"B0-5" const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {

  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
