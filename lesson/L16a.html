<script>
const L = {"id":"L16a","scene":"s16","part":"a","title":"전화 교환국의 창구 셋 — 수용체","sub":"세포막 수용체 셋(이온통로 · GPCR · RTK) + 세포내 수용체 · 리간드 예 · 신호전달 3단계","img":"img/L16a.webp?v=2394590da9cd","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"전화 교환국 — 창구 벽 · 밖의 손님 · 안의 교환원","fact":"신호전달 3단계: 수용(창구) → 전달(안에서 이어 나름) → 반응(종) · 창구 벽 = 세포막","hook":"신호 교환 = 전화 교환국 · 창구 너머 = 세포 밖 · 홀 안 = 세포 안","say":"전화 교환국에서 신호가 오가는 길을 살펴보자. 창구의 벽은 세포막, 창구 너머의 손님들은 세포 밖, 홀 안의 교환원들은 세포 안이다. 신호전달은 창구에서 신호를 받고, 안으로 이어 전달하고, 뒷기둥의 종이 울리는 세 단계다. 수용, 전달, 반응이다. 이 연속된 변화가 세포 밖 신호를 세포 안 반응으로 바꾼다. 물에 녹는 수용성 호르몬은 막을 지나지 못하므로 세포 표면의 수용체인 창구에 붙는다. 막 수용체·2차 전령·증폭이 함께 나오면 수용성 호르몬의 경로를 떠올리자. 손님에 해당하는 리간드는 수용체에 특이적으로 결합하는 신호 분자다. 리간드가 결합해 수용체의 구조를 바꾸는 것까지가 첫 단계인 신호수용이다. 표면 수용체는 수용성 리간드와 2차 전령에, 세포 안 수용체는 지용성 리간드와 전사인자에 연결된다. 후자의 대표는 스테로이드 호르몬과 갑상선 호르몬이다.","box":null,"src":["s16p01#7"],"cards":["S-SG-13","A1-28","B0-3","B0-82","B0-129","B0-0","B0-1","B0-19","B0-180","B0-180#4","G0-120","G0-132","G0-122","G0-135","Q0-8","B0-2","B0-23","B0-24","S-SG-4","B0-33"]},{"sid":"s2","obj":"벽에 박힌 이온 음료 자판기 — 담배를 넣자 캔이 쏟아진다","fact":"이온통로 수용체(LGIC): 리간드가 붙으면 이온이 직접 흐른다 · 가장 빠름 · 예 니코틴성 ACh 수용체","hook":"이온 음료 = 이온 · 담배 = 니코틴(성 아세틸콜린)","say":"벽에 설치된 이온 음료 자판기를 보자. 손님이 담배를 투입구에 넣자 캔이 홀 안으로 쏟아진다. 이온통로 수용체, 다른 이름으로 리간드 개폐성 이온 통로이며 줄여서 엘지아이시라고 한다. 리간드가 붙으면 통로가 열려 이온이 직접 흐르기 때문에 반응이 가장 빠르다. 통로에 따라서는 리간드가 붙을 때 오히려 닫히기도 한다. 담배는 투입구에 꽂혀 있을 뿐 홀 안으로 들어가지 않는다. 리간드는 밖에서 결합하고, 통로를 지나는 것은 이온이라는 구분이다. 대표 이온은 나트륨(Na⁺)과 칼슘(Ca²⁺)이다. 담배의 니코틴은 대표적인 니코틴성 아세틸콜린 수용체로 연결된다. 간상세포 극장과 신경 동네에서는 이온 통로를 소금이 쏟아져 들어오는 문으로 표현했고, 여기서는 이온 음료 자판기로 표현했다.","box":[0,110,390,1034],"src":["s16p01#0","s16p01c#3"],"cards":["B0-71","B0-73","B0-76","X-SG-25","B0-180#1","B0-184","B0-67","B0-180#2","B0-69","S-SG-1","Q0-10","B0-70"]},{"sid":"s3","obj":"곁의 똑같은 자판기 — 덧문 내리고 회색 쇠 자물쇠","fact":"리간드가 붙기 전 이온통로는 닫혀 있다 — 막힌 것이 아니라 닫힌 것(열릴 수 있다)","hook":"덧문 + 회색 자물쇠 = 닫힘(약이 아님)","say":"곁의 똑같은 자판기는 덧문이 내려와 있고 회색 쇠 자물쇠가 걸려 있다. 금색 자물쇠가 아니므로 약물이 막았다는 뜻은 아니다. 리간드가 결합하기 전에는 통로가 닫혀 있다는 모습이다. 손님이 오면 열리고, 리간드가 떨어지면 다시 닫히는 상태 변화를 연결하자.","box":[380,360,240,480],"src":["s16p01c#0"],"cards":["B0-68","B0-72"]},{"sid":"s4","obj":"왼쪽 뱀 창구 — 초록 뱀 한 마리가 벽을 바늘땀처럼 들락날락 꿰어 창 둘레로 몸 고리 일곱이 솟았다(머리는 왼쪽) · 창구 위 손님은 등불 · 향수병","fact":"GPCR: 막을 7회 관통 · 예 빛(로돕신) · 냄새 · 에피네프린","hook":"몸 고리 일곱 = 7회 막 관통 · 등불 = 빛 · 향수 = 냄새","say":"왼쪽 창구의 초록 뱀 한 마리가 벽을 바느질하듯 들락날락한다. 창 주변으로 솟은 몸의 고리는 일곱 개다. 지 단백질 연결 수용체, 지피시알의 막을 일곱 번 관통하는 구조다. 각 고리는 막을 지나는 α-나선에 대응한다. 손님은 창구에 붙었다 떨어지며, 결합은 가역적이다. 밖의 리간드가 많을수록 더 자주 결합해 신호가 잦아진다. 수용체도 역치 이상 있어야 신호가 나타난다. 손님이 든 등불과 향수병은 빛을 받는 로돕신과 냄새 수용체다. 후각 수용체도 GPCR(G단백질 연결 수용체)에 속한다. 에피네프린 역시 이 창구를 이용한다. 다음 그림인 이차 캠프장 입구로 굴러드는 뚜껑 터진 드럼통이 바로 그 손님이다.","box":[[650,325,320,305],[940,110,560,230]],"src":["s16p01#1","s16p01c#3"],"cards":["B0-182","S-SG-1","Q0-10","G0-123","B0-201","B0-46","B0-47","B0-147","T0-230"]},{"sid":"s5","obj":"뱀 창구가 셋 — 다른 창구보다 많다","fact":"사람 세포막 수용체 중 가장 큰 가족 = GPCR","hook":"셋 = 가장 많다","say":"창구 수를 비교해 보자. 자판기는 둘, 타이 창구는 하나인데 뱀 창구는 셋이다. GPCR이 사람의 세포막 수용체 중 가장 큰 가족이라는 단서다. 사람의 GPCR은 800종이 넘는다. 기본서는 세포 표면 수용체가 사람 단백질의 약 30퍼센트라고 적는데, 이 값은 세포막 단백질 전체를 셀 때의 추정치에 가깝다. 종류가 많아도 구조를 밝히기는 쉽지 않다. 유연하고 모양이 잘 바뀌어 결정으로 만들기 어렵기 때문이다.","box":[[640,340,840,285]],"src":["s16p01c#1"],"cards":["B0-28","B0-29","B0-77","B0-78"]},{"sid":"s6","obj":"등불 손님(갈색 웃옷)이 아래로 뻗은 손이 닿은 가운데 뱀 창구만 틀이 뒤틀렸다 — 손이 닿지 않은 양옆 창구는 반듯","fact":"리간드 결합의 첫 변화 = 수용체의 입체구조(형태) 변화 — 뒤의 일은 다 그 결과","hook":"손님(리간드)이 닿은 틀만 뒤틀린다","say":"등불을 든 손님의 손이 닿은 가운데 뱀 창구만 틀이 뒤틀려 있다. 손이 닿지 않은 양옆 창구는 반듯하다. 리간드 결합 뒤 수용체에 생기는 첫 변화가 입체구조 변화라는 뜻이다. 이온 흐름, 지게꾼의 이동, 도장 찍기는 모두 그 변화 이후의 일이다. 손님은 자기에게 꼭 맞는 창구에만 손을 댄다. 신호 분자와 수용체의 특이적 결합이 신호수용의 조건이다. GPCR은 리간드가 결합하면 활성화되어 형태가 바뀌고, 그 형태로 다른 분자와 맞물려 일을 넘긴다.","box":[[640,345,330,285],[975,350,250,275],[1250,350,235,275]],"src":["s16p01c#2"],"cards":["B0-25","B0-21","B0-22","B0-26","B0-44"]},{"sid":"s7","obj":"홀 안 지게꾼 — 네모 칩을 뒤집으며 벽 안쪽을 따라 기계로 달린다","fact":"G단백질: GDP를 GTP로 갈아 끼워 켜지고, 막 안쪽 면을 따라 효소(아데닐산 고리화효소)를 찾아간다","hook":"지게 = G · 칩 뒤집기 = GDP→GTP · 네모 칩 = GTP","say":"홀 안에서 달리는 지게꾼을 보자. 지게는 지 단백질의 이름 단서다. 지게꾼은 손에 든 짙은 회색 네모 칩을 뒤집으며 벽 안쪽을 따라 오른쪽 끝 기계로 간다. 칩을 뒤집는 동작은 지디피를 내놓고 지티피로 바꾸어 활성화되는 과정이다. 지 단백질은 막 안쪽 면에 붙어 움직이며 효소인 아데닐산 고리화효소로 간다. 꺼진 지게꾼도 평소에는 막에 붙어 있다. 지 단백질의 갈래도 구분하자. Gs는 아데닐산 고리화효소(AC)를 켜고, Gi는 AC를 끈다. Gq는 인지질분해효소 C(PLC)를, Gt는 PDE를 켠다.","box":[1640,580,408,380],"src":["s16p01#2"],"cards":["B0-40","B0-42","B0-48","B0-41","B0-45","X-SG-28","B0-49","B0-144","B0-51","B0-185#1","B0-185","B0-113#3","B0-113","Q0-9","B0-180#3","B0-43","S-SG-8"]},{"sid":"s8","obj":"주저앉은 지게꾼 — 제 손으로 칩을 튕겨 도로 뒤집는다","fact":"G단백질은 스스로 GTP를 가수분해해 꺼진다","hook":"제 손으로 되돌린다","say":"바닥에 주저앉은 지게꾼은 자기 손으로 칩을 튕겨 다시 뒤집고 있다. 지 단백질이 스스로 지티피를 가수분해해 지디피로 바꾸고 비활성화되는 모습이다. 별도의 사람이 와서 꺼 주는 장면이 아니다. GTP 가수분해는 이렇게 신호 경로를 빠르게 끊는 종료 장치다.","box":[1380,880,420,264],"src":["s16p01c#4"],"cards":["B0-52","B0-50"]},{"sid":"s9","obj":"넓은 창구 왼쪽 아래 홀 안의 타이 맨 둘 — 등을 맞대고 서로 등에 열쇠 도장 · 넓은 창구의 손님은 묘목","fact":"RTK: 생장인자가 붙으면 이합체가 되어 서로의 티로신을 인산화한다(ATP)","hook":"타이 = 티로신 · 열쇠 = 키나아제 · 묘목 = 생장인자","say":"넓은 창구의 왼쪽 아래, 홀 안을 보자. 흰 셔츠와 타이를 착용한 두 사람이 등을 맞대고 서로의 등에 열쇠 도장을 찍는다. 타이는 티로신, 열쇠는 키나아제다. 수용체 티로신 키나아제, 알티케이로 연결하자. 창구 밖 손님이 내민 묘목은 생장인자다. 세포주기를 진행시켜 G1 검문소를 넘게 하는 외부 신호인 미토젠은 대개 이런 생장인자이고, 대표 수용체가 RTK이다. receptor tyrosine kinase의 약자인 RTK는 효소 활성을 가진 세포막 수용체다. 구조는 세포 밖의 신호결합부위, 막을 관통하는 α-나선, 티로신이 여러 개 달린 세포 안 꼬리로 나뉜다. 생장인자가 붙으면 둘이 이합체를 이루고 서로의 티로신을 인산화한다. 인산은 에이티피에서 가져온다. 인산화된 티로신에 중계단백질이 결합해 신호를 전달하고, 이후 과정은 열쇠 계주 운동장에서 이어진다.","box":[[1190,540,260,340],[1620,120,300,450]],"src":["s16p01#3","s16p01c#3"],"cards":["B0-55","B0-61","B0-65#2","B0-183","B0-186","B0-60","B0-62","B0-65#3","X-SG-13","B0-65","B0-65#1","B0-27","B0-66","B0-87","S-SG-1","Q0-10","B0-53","B0-54","B0-58","C1-118","C1-133"]},{"sid":"s10","obj":"홀로 선 타이 맨 — 도장은 들었는데 찍을 등이 없다","fact":"단량체 상태로는 작동하지 않는다","hook":"혼자는 못 찍는다","say":"곁에서 혼자 서 있는 넥타이 맨은 도장을 들었어도 찍어 줄 상대의 등이 없다. 알티케이는 단량체로 작동하지 않고, 둘이 함께 있어야 한다는 단서다.","box":[1470,540,150,340],"src":["s16p01#4"],"cards":["B0-59"]},{"sid":"s11","obj":"기름 범벅 손님 — 창구를 거치지 않고 벽을 미끄러져 들어와 서류 캐비닛을 연다","fact":"지용성 호르몬(스테로이드 · 갑상샘)은 막을 통과해 세포질·핵 수용체에 붙고 전사를 조절한다","hook":"기름 = 지용성 · 캐비닛 = 핵(서류 = DNA)","say":"기름으로 뒤덮인 손님은 창구를 이용하지 않고 벽을 미끄러져 통과해 뒷방 서류 캐비닛의 서랍을 연다. 수용체가 없는 것이 아니라 벽이 아닌 세포 안에 있다는 뜻이며, 그 수용체를 가진 세포만 반응한다. 스테로이드와 갑상샘 호르몬 같은 지용성 호르몬은 막을 지나 세포질이나 핵의 수용체에 결합하고, 캐비닛의 서류인 디엔에이의 전사를 조절한다. 호르몬과 수용체가 함께 핵으로 가는 목적도 전사 조절이다. 유전자 발현이 바뀌므로 반응이 늦게 시작되고 오래간다. 에스트로겐이 간세포에서 난황 전구물질 비텔로제닌을 만들게 하는 경우가 한 예다. 핵 이동과 전사 조절이 함께 나오면 이 지용성 호르몬 경로를 떠올리자. 스테로이드와 티록신이 지용성이며, 티록신은 아민이지만 예외적으로 기름에 녹는다. 다만 갑상샘 호르몬은 운반체를 거쳐 들어간다. 티록신과 비타민 D의 수용체는 핵에, 스테로이드 수용체는 보통 세포질에 있다. 핵에 들어간 복합체는 전사인자가 되어 특정 유전자를 켜거나 끄며, 억제인자도 있다. 막을 그대로 통과하는 손님은 알도스테론 같은 지용성 분자와 일산화질소처럼 매우 작은 분자의 두 부류다.","box":[660,640,460,504],"src":["s16p01#5"],"cards":["B0-31","B0-32","B0-188","B0-189","B0-190","A1-47#1","Q0-11#1","G0-121","G0-128","G0-129","G0-130","G0-131","G0-133","G0-186","Q0-6","Q0-7","Q0-12","B0-34","B0-36","B0-132","B0-133","F0-43"]},{"sid":"s12","obj":"뒷기둥의 놋쇠 종이 울린다","fact":"반응 — 세포질에서 효소가 켜지거나 핵에서 전사가 바뀐다(3단계의 끝)","hook":"종 = 반응","say":"뒷기둥의 놋쇠 종이 울리는 것이 반응이다. 수용과 전달을 거쳐 세포질의 효소가 켜지거나 핵의 전사가 바뀐다. 세포질에서는 기존 단백질의 활성을 바꾸고, 핵에서는 특정 유전자의 발현을 유도하거나 멈춘다. 효소 촉매작용 변화, 세포골격 재배열, 특정 유전자 활성화가 그 예다. 단백질 합성도 유전자 발현을 켜는 길과 세포질 단백질 활성을 직접 바꾸는 길로 조절한다. 마지막으로 창구 셋을 다시 짚자. 자판기는 이온이 직접 흘러 가장 빠르고, 뱀 창구는 지게꾼이 효소를 켜서 이차 전령을 만들며, 타이 창구는 서로 인산 도장을 찍어 여러 경로를 켠다.","box":[1110,860,130,220],"src":["s16p01#6"],"cards":["B0-30","B0-181","B0-75","B0-74","S-SG-2","S-SG-3","B0-117","B0-4","B0-20","B0-130","B0-131","B0-134"]}],"cq":{"S-SG-13":["세포 신호전달 3단계와 각 단계의 사건은?","수용(리간드 결합·형태 변화)→전달(연쇄)→반응(효소·전사)"],"A1-28":["막 단백질 기능 중 '신호전달'이란?","수용체가 신호분자 결합을 받아 세포 안으로 신호를 전달하는 기능"],"B0-3":["신호전달(signal transduction)이란?","분자 간의 연쇄적 상호작용으로 수용체의 변화를 세포내 중계 분자로 전달하는 단계"],"B0-82":["신호전달경로(signal transduction pathway)란?","수용체 결합 후 세포내 특정 반응까지 이어지는 연속적인 분자 상호작용"],"B0-129":["신호전달 경로의 반응은 어디에서 일어날 수 있는가?","세포질 또는 핵"],"B0-0":["세포외 신호가 세포내 반응으로 전환되는 전체 과정을 무엇이라 하는가?","세포 신호전달"],"B0-1":["세포 신호전달의 3단계는?","신호수용 · 신호전달 · 세포반응"],"B0-19":["세포 신호전달 단계의 공통 핵심     });
    // ② 로마 숫자(문맥) — 볼티모어 군 · 부두 번호는 한자어 수, 나머지는 영어 수. 대 · 자 · 선 · 기가 붙으면 글자

const ttsNorm = t => TTSNorm.ttsNorm(t, TTS_LEX, TTS_ORDER, L.id);
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate, auto:playing && mode === 'tour',
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate, auto:true,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나

  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);

}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
