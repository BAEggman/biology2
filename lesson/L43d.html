<script>
const L = {"id":"L43d","scene":"s43","part":"d","title":"같은 끈, 다른 공장 — 차등적 유전자 발현 · 하우스키핑 · 줄기세포 · 복제양 · iPS","sub":"위아래 두 마당의 똑같은 끈과 팻말 넷(같은 DNA) · 인쇄 기계가 선 자리만 다르다(차등적 유전자 발현) · 두 마당 다 찍는 청소기(하우스키핑) · 붉은 벽돌집 마당의 앨범(간세포 · 알부민) · 눈알 마당의 수정 구슬(수정체 · 크리스탈린) · 마당마다 다른 응원단(다른 활성자) · 배에서 나온 줄기 아기(배아줄기세포) · 뼈 속 줄기 아주머니(성체줄기세포) · 빈 달걀에 넣은 끈 타래와 양(핵치환 · 돌리) · 어른 옷 속 아기와 응원단원 넷(iPS)","img":"img/L43d.webp?v=210af3889997","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"벽돌 담 띠가 둘 — 담마다 그 아래에 마당 하나(위 마당 · 아래 마당). 두 마당의 가구가 똑같다: 왼쪽 그림 밖에서 온 금빛 짚끈이 왼쪽 나무 단(앞면 초록 동그라미 둘) → 타탄 깔개 넷의 밑 → 오른쪽 나무 단(보라 동그라미 둘)을 지나 뒤 담 밑으로 들어가고 · 깔개마다 뒤에 그림 팻말이 섰다(왼쪽부터 펼친 사진 앨범 · 빨간 청소기 · 해 · 받침대 위 수정 구슬). 인쇄 기계가 선 깔개만 다르다 — 위 마당은 앨범 · 청소기 / 아래 마당은 청소기 · 수정 구슬 (틀)","fact":"차등적 유전자 발현 — 같은 DNA · 세포마다 다른 유전자 집합을 발현","hook":"끈과 팻말은 똑같다(같은 DNA) · 기계가 선 자리만 다르다(다른 발현)","say":"L43c의 담장 안 마당이 위아래 두 개로 나뉘었다. 각 마당은 세포 하나의 핵이다. 금빛 짚끈인 DNA의 길이, 나무 단 둘, 타탄 깔개 넷, 그 뒤의 앨범·청소기·해·수정 구슬 팻말이 양쪽에서 모두 같다. 팻말 하나는 유전자 하나이며, 한 몸의 세포들이 같은 DNA를 가진다는 단서다. 다른 것은 인쇄 기계의 위치다. 위는 앨범과 청소기를, 아래는 청소기와 수정 구슬을 찍는다. 같은 DNA 중 서로 다른 유전자 집합을 발현하는 차등적 유전자 발현이다. 다세포 생물에서 여러 세포 유형과 기능을 만드는 핵심 원리이며, 이것이 없다면 모든 세포가 비슷해져 조직과 기관의 분화가 불가능하다.","cards":["F1-46","F1-118","F1-175","F1-49"],"box":[[0,96,1416,432],[0,627,1416,432]]},{"sid":"s2","obj":"두 마당 모두 왼쪽에서 둘째, 청소기 팻말(빨간 통 청소기 — 호스와 대롱 · 바닥 흡입구 · 전깃줄 플러그)의 깔개에 인쇄 기계가 섰고 · 기계 앞으로 청소기 그림이 찍힌 흰 종이띠가 나온다 · 두 마당 모두 팻말 넷 가운데 기계가 선 자리는 둘 · 해 팻말의 깔개는 두 마당 다 비었다","fact":"하우스키핑 유전자 — 대부분의 세포에서 기본 생명 유지를 위해 발현","hook":"집 청소 = 하우스키핑 · 청소기는 어느 집에나 · 넷 중 둘 = 절반쯤만 발현","say":"양쪽에서 공통으로 찍는 왼쪽 둘째 팻말은 청소기다. 집이나 호텔 방을 청소하는 하우스키핑에서 하우스키핑 유전자를 떠올리자. 어느 집에나 있는 청소기를 여러 세포에서 공통으로 켜지는 유전자와 연결하자. 기본 생명 유지에 필요해 대부분의 세포에서 공통으로 발현된다. 팻말은 넷이지만 마당마다 기계는 두 자리에서만 작동한다. 사람 세포는 가진 유전자 중 약 3분의 1에서 2분의 1을 발현하고, 발현 유전자 중 약 35퍼센트가 하우스키핑 유전자다. 해 팻말 앞은 양쪽 모두 비어 있다. L43c에서 본 이 유전자는 빨강·노랑·파랑 응원단이 있어야 찍히지만, 두 마당에는 그 응원단이 없다.","cards":["F1-47","F1-156","F1-48"],"box":[[556,100,212,426],[556,631,212,426]]},{"sid":"s3","obj":"위 마당 — 왼쪽 끝에 붉은 벽돌집(슬레이트 지붕 · 굴뚝 · 갈색 문) · 맨 왼쪽 앨범 팻말의 깔개에 인쇄 기계가 섰고 앨범 그림이 찍힌 종이띠가 나온다(아래 마당의 앨범 깔개는 비었다)","fact":"조직 특이적 유전자 — 간세포는 알부민 유전자를 주로 발현","hook":"붉은 벽돌집 = 간 · 앨범 = 알부민","say":"위 마당 왼쪽 끝의 붉은 벽돌집은 간이다. 따라서 위 마당은 간세포의 핵이다. 맨 왼쪽 앨범 팻말 앞의 기계가 앨범 그림 종이띠를 찍는다. 앨범은 L46d에서도 쓴 알부민의 단서다. 알부민 유전자는 간세포에서 주로 발현되며, 특정 세포 유형의 고유 기능을 담당하는 조직 특이적 유전자의 예다. 아래에도 앨범 팻말은 있지만 기계가 없다. 청소기는 공통으로, 앨범은 간에서만 발현하는 대비다.","cards":["F1-157","F1-76"],"box":[[0,186,168,280],[366,100,212,426],[366,631,212,330]]},{"sid":"s4","obj":"아래 마당 — 왼쪽 끝에 돌 받침 위의 큰 눈알(파란 홍채) · 맨 오른쪽 수정 구슬 팻말의 깔개에 인쇄 기계가 섰고 수정 구슬 그림이 찍힌 종이띠가 나온다(위 마당의 수정 구슬 깔개는 비었다)","fact":"수정체 세포는 크리스탈린 유전자를 주로 발현","hook":"눈알 = 수정체 세포 · 수정(크리스탈) 구슬 = 크리스탈린","say":"아래 마당 왼쪽 끝의 돌 받침에 큰 눈알이 있다. 아래쪽은 눈의 수정체 세포다. 맨 오른쪽 수정 구슬 팻말 앞의 기계가 수정 구슬 그림을 찍는다. 수정의 영어인 크리스탈에서 크리스탈린 유전자를 떠올리자. 수정체 세포에서 주로 발현되는 유전자다. 수정체가 빛을 통과시키려면 수정 구슬처럼 맑아야 하며, 그 투명한 단백질이 크리스탈린이다. 위 마당에도 같은 팻말이 있지만 기계는 없다. 간세포도 유전자는 가지고 있지만 발현하지 않는다는 뜻이다.","cards":["F1-77"],"box":[[6,750,160,226],[936,631,212,426],[936,100,212,330]]},{"sid":"s5","obj":"위 마당은 왼쪽 단(초록 동그라미) 위에 초록 폼폼 · 초록 치마 응원단원 둘이 섰고 오른쪽 단(보라 동그라미)은 비었다 · 아래 마당은 거꾸로 — 오른쪽 단 위에 보라 폼폼 · 보라 치마 응원단원 둘이 섰고 왼쪽 단이 비었다","fact":"세포 유형마다 다른 조절 단백질(활성자)이 활성화 → 다른 단백질","hook":"단(인핸서)은 두 마당에 똑같이 · 올라선 응원단(활성자)이 다르다","say":"같은 유전자인데 발현이 다른 이유를 응원단에서 찾아보자. 위 마당 왼쪽 단에는 초록 응원단 둘이 있고 오른쪽은 비어 있다. 아래 마당은 오른쪽에 보라 응원단 둘이 서 있고 왼쪽이 비어 있다. L43c에서 단은 인핸서, 응원단원은 활성자였다. DNA에 해당하는 단은 양쪽에 같지만 올라선 사람이 다르다. 초록 응원단 옆에서는 앨범, 보라 응원단 옆에서는 수정 구슬이 찍힌다. 같은 DNA를 가진 간세포와 수정체 세포가 다른 단백질을 만드는 것은 세포 유형마다 활성화된 조절 단백질이 다르기 때문이다.","cards":["F1-78"],"box":[[150,104,250,330],[1150,330,220,100],[170,861,220,100],[1130,635,250,330]]},{"sid":"s6","obj":"담 띠 오른쪽 끝 너머 가운데 — 윗동이 열린 큰 연두색 배(과일)에서 두 팔 든 아기가 솟았다 · 아기 머리에 초록 새싹(줄기에 잎 둘) · 초록 화살 둘: 하나는 그림 왼쪽으로 든 아기 손 곁에서 왼쪽 위로 휘어 위 마당 쪽으로 · 하나는 배의 왼쪽 아래 옆구리에서 왼쪽 아래로 휘어 아래 마당 쪽으로","fact":"배아줄기세포 — 발현 유전자 조합이 점차 달라져 여러 세포로 분화","hook":"배에서 나온 아이 = 배아 · 머리의 줄기 = 줄기세포 · 화살 둘 = 어느 마당으로든","say":"담장 밖 오른쪽에서는 세포를 사람으로 표현했다. 윗동을 자른 큰 배에서 나온 아기의 머리에 초록 줄기가 돋아 있다. 배에서 나온 아기인 배아와 L46e의 줄기 소품을 합친 배아줄기세포다. 아기에서 나온 초록 화살 둘은 위아래 마당으로 향한다. 간세포도 수정체 세포도 될 수 있다는 뜻이다. 향하는 마당에 따라 초록 또는 보라 응원단이 자리 잡고, 발현 유전자 조합이 점차 달라져 여러 기관의 세포로 분화한다. 같은 유전체를 가지고도 발현 패턴에 따라 다른 세포가 된다는 점에서 줄기세포와 차등적 유전자 발현이 연결된다.","cards":["F1-123","F1-124"],"box":[[1392,468,216,336]]},{"sid":"s7","obj":"오른쪽 아래 — 길게 갈라 연 큰 뼈(속은 붉은 스펀지) 안의 걸상에 하늘색 원피스의 통통한 아주머니가 앉았다 · 머리에 초록 새싹 · 아주머니 옆 붉은 속에 초록 화살 하나가 오른쪽을 가리키고 · 그쪽 뼈 밖에 붉은 원반 하나와 흰 옷 · 흰 모자 차림의 사람 하나(모자와 가슴에 둥근 배지)가 섰다","fact":"성체줄기세포 — 골수 등 · 발현 프로그램 일부가 고정돼 제한된 세포로만","hook":"뼈 속 = 골수 · 화살 하나 = 혈구로만(이미 길이 정해졌다)","say":"오른쪽 아래의 길게 열린 뼈 속 붉은 공방에는 초록 줄기가 난 아주머니가 앉아 있다. L46e의 조혈 줄기세포다. 성체에 남아 있는 성체줄기세포의 대표적인 장소가 골수다. 아주머니 옆의 화살은 하나로, 뼈 밖의 붉은 원반과 흰 옷 경비인 적혈구·백혈구 등의 혈구를 가리킨다. 간세포나 수정체 세포의 마당으로는 가지 않는다. 배아 아기의 두 화살과 비교하자. 성체줄기세포는 일부 유전자 발현 프로그램이 이미 고정되어 분화할 수 있는 세포 종류가 제한된다.","cards":["F1-125","F1-126"],"box":[[1414,866,628,254]]},{"sid":"s8","obj":"오른쪽 위 — 사람만 한 갈색 달걀이 누웠고 위쪽에 둥근 구멍 · 달걀 왼쪽 아래 바닥에 흰자에 얹힌 주황 노른자 하나(깨 놓은 달걀 속) · 구멍 위에 금빛 끈 타래(네 겹)가 떠서 끝이 구멍 속으로 늘어졌고 · 위 마당 오른쪽 끝에서 담 밑으로 올라간 끈의 끝머리 곁에서 끈 타래까지 갈색 점선 화살 · 달걀 위 공중에 초록 폼폼 · 초록 치마 응원단원이 놀란 얼굴로 튕겨 날아간다","fact":"체세포 핵치환 — 핵 뺀 난자 + 분화한 체세포 핵 → 난자가 처음 상태로 되돌림","hook":"꺼내 놓은 노른자 = 핵 뺀 난자 · 끈 타래 = 체세포의 핵 · 튕겨 나간 응원단 = 재프로그래밍","say":"오른쪽 위의 사람만 한 갈색 달걀은 속을 꺼내 바닥에 놓았고, 흰자 위에 노른자가 보인다. 핵을 제거한 난자다. 구멍 위에 떠 있는 금빛 끈 타래의 끝이 구멍 안으로 들어가며, 점선 화살을 거꾸로 따라가면 위 마당의 끈에 닿는다. 분화한 체세포의 핵을 핵 없는 난자에 넣는 체세포 핵치환, SCNT이다. 달걀 위로 튕겨 나가는 초록 응원단은 난자 세포질의 재프로그래밍 인자가 기존 발현 상태를 되돌리는 모습이다. 핵이 초기 상태로 돌아가면 그 핵을 바탕으로 개체 발생이 다시 시작된다.","cards":["I1-30"],"box":[[1330,6,514,456]]},{"sid":"s9","obj":"달걀 오른쪽 끝의 껍데기가 깨졌고(깨진 조각이 곁에) · 그 앞에 털이 복슬복슬한 흰 양 한 마리가 오른쪽으로 걸어간다(뿔 · 턱수염 없음)","fact":"유전체 동등성 — 분화한 세포도 완전한 유전체를 간직(복제양 돌리)","hook":"돌리 ≈ 되돌리 · 다 자란 마당의 끈 하나로 양 한 마리가 통째로","say":"달걀 오른쪽이 깨지며 복슬복슬한 양이 나온다. 되돌린 양에서 복제양 돌리를 떠올리자. 돌리는 성체 양의 젖샘 세포 핵으로 만들었다. 분화한 세포의 끈 한 타래에서 양 한 마리가 통째로 나왔다는 사실은 무엇을 보여 줄까? 분화한 세포도 완전한 유전체를 보존한다는 유전체 동등성이다. 위 마당에서 앨범을 찍을 때도 수정 구슬과 해 팻말은 남아 있었다. 사용하지 않는 유전자를 버린 것이 아니라 발현하지 않았던 것이다.","cards":["I1-31"],"box":[[1700,236,334,206]]},{"sid":"s10","obj":"배 아기의 오른쪽 — 헐렁한 주황 어른 스웨터(긴 소매가 바닥까지 늘어졌다)와 큰 갈색 장화에 파묻혀 웃는 아기(머리에 초록 새싹) · 그 양옆에 금빛 폼폼 · 금빛 치마 응원단원이 둘씩, 모두 넷","fact":"iPS = 분화한 세포 + 전사인자 → 만능성(배아 불필요) / ES = 배아 유래","hook":"어른 옷 = 분화했던 세포 · 금빛 응원단원 넷 = 넣어 준 전사인자 · 배 = 배아","say":"배아 아기 옆에는 헐렁한 어른 스웨터와 큰 장화에 파묻힌 또 다른 아기가 있다. 원래 성체였지만 금빛 응원단원 넷이 둘러싸자 머리에 줄기가 돋고 아기로 돌아갔다. 분화한 세포에 전사인자를 넣어 만능성을 되찾게 한 유도만능줄기세포, iPS이다. 응원단 넷은 투입한 전사인자 넷이며, 이 방식에는 배아가 필요하지 않다. 옆의 배아줄기세포 ES는 배아에서 얻고, 몸을 이루는 거의 모든 세포로 분화할 수 있는 만능성을 가진다. 태반 같은 배 밖 조직까지 만드는 전능성과는 구별한다. 머리의 줄기는 같지만 출발점이 다르다. 배에서 나온 아기는 ES, 어른 옷을 입은 아기는 iPS로 연결하자.","cards":["I1-32"],"box":[[1600,560,440,284],[1440,470,166,334]]}],"cq":{"F1-46":["차등적 유전자 발현이란?","세포마다 같은 DNA를 가지면서도 다른 유전자 집합을 발현하는 것"],"F1-118":["다세포 생물에서 여러 세포 유형이 만들어지는 핵심 원리는?","차등적 유전자 발현"],"F1-175":["차등적 유전자 발현이 없다면 다세포 생물에서 어떤 문제가 생기는가?","모든 세포가 비슷해져 조직과 기관 분화가 불가능해진다"],"F1-49":["차등적 유전자 발현이 중요한 이유는?","다양한 세포 유형과 기능을 가능하게 하기 때문"],"F1-47":["대부분의 세포에서 공통적으로 발현되는 유전자는?","하우스키핑 유전자"],"F1-156":["housekeeping 유전자란?","대부분의 세포에서 기본 생명 유지 기능을 위해 발현되는 유전자"],"F1-48":["인간 세포는 보유 유전자 중 얼마나 발현하며 그중 공통 발현 비율은?","약 1/3~1/2을 발현 · 그중 약 35%가 housekeeping 유전자"],"F1-157":["조직 특이적 유전자란?","특정 세포 유형의 고유 기능을 가능하게 하는 유전자"],"F1-76":["간세포에서 주로 발현되는 대표 유전자는?","알부민 유전자"],"F1-77":["수정체 세포에서 주로 발현되는 대표 유전자는?","크리스탈린 유전자"],"F1-78":["간세포와 수정체세포가 같은 DNA를 가져도 다른 단백질을 만드는 이유는?","세포 유형별로 다른 조절 단백질이 활성화되기 때문"],"F1-123":["차등적 유전자 발현이 줄기세포와 연결되는 이유는?","같은 유전체를 가진 세포가 다른 발현 패턴으로 다른 세포 유형이 되기 때문"],"F1-124":["배아줄기세포가 여러 기관 세포로 분화할 수 있는 이유는?","발현되는 유전자 조합이 점차 달라지기 때문"],"F1-125":["성체줄기세포가 제한된 세포로만 분화하는 이유는?","이미 일부 유전자 발현 프로그램이 고정되었기 때문"],"F1-126":["성체줄기세포의 대표 위치와 분화 범위 예시는?","골수에 존재"],"I1-30":["체세포 핵치환(SCNT)이란?","핵 제거 난자에 분화한 체세포 핵을 이식 → 난자 세포질의 재프로그래밍 인자가 핵을 초기 상태로 되돌려 개체 발생(복제양 돌리)"],"I1-31":["SCNT가 증명하는 것은?","분화한 세포도 완전한 유전체를 그대로 간직한다(유전체 동등성)"],"I1-32":["배아 줄기세포(ES)와 유도만능줄기세포(iPS)의 차이는?","ES=배아 유래, 모든 세포 분화 가능 · iPS=분화한 세포에 전사인자 도입해 만능성 회복(배아 불필요)"]},"hubPanel":null};

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';

try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
