<script>
const L = {"id":"L53a","scene":"s53","part":"a","title":"바닷속 버터 부교 ① 부표 사람과 구슬 기둥 — 유동 모자이크 · 막 유동성 · 막단백질","sub":"바닷속을 가로지른 노란 버터 띠(세포막) · 머리는 물에 다리는 버터에 박은 두 줄 부표 사람(인지질 이중층 · 양친매성) · 옆으로 미끄러지는 떨림 선과 오리발 잠수부(측면확산 · 플립페이스 · 비대칭) · 곧은 다리로 빽빽이 언 왼쪽과 꺾인 무릎(포화 · 불포화) · 짧은 다리 · 햇살 · 소 머리와 돼지 머리(유동성 셋 · 스테아르산 · 팔미트산) · 다리 사이 고리 넷 금빛 타일(콜레스테롤 완충) · 얼음에 갇힌 일꾼과 녹은 버터에 가라앉는 기둥(유동성이 필요한 까닭) · 띠에 박힌 구슬 기둥과 사슬에 매달린 구슬 공(내재 · 주변부) · 띠 속에서만 감긴 사슬과 흰 알(막관통 · α나선) · 뚫린 굴 · 작업대 · 우편함(수송 · 효소 · 신호전달) · 막대사탕을 집는 Y 집게와 대갈못(인식 · 결합) · 밧줄 그물과 살구색 구슬 줄(ECM · 세포골격 부착) · 기둥과 부표 머리의 막대사탕(당단백질 · 당지질)","img":"img/L53a.webp?v=b076af8abfa6","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"바닷속을 가로지르는 긴 노란 버터 띠 — 위아래 두 줄로 머리만 물에 내놓은 부표 사람들 · 그 사이사이를 꿰뚫은 알록달록 구슬 기둥들 · 떨림 선을 그리며 옆으로 미끄러지는 부표 사람들 (틀)","fact":"세포막 = 지질 + 단백질의 유동 모자이크 — 유동적인 인지질 이중층에 여러 단백질이 박힘","hook":"버터 띠의 두 줄 부표 사람 = 인지질 이중층 · 구슬 기둥 = 단백질 · 떨림 선 = 유동 · 섞여 박힌 기둥 = 모자이크","say":"바닷속을 가로지르는 긴 노란 버터 띠가 세포막이다. 몸 마을 산장 L50b의 버터처럼 막도 굳고 녹는다는 연결이다. 띠 위아래에는 머리만 물에 내놓고 다리를 버터 속에 넣은 부표 사람들이 두 줄로 있다. 인지질 이중층이다. 그 사이를 관통한 알록달록 구슬 기둥은 이 덱의 구슬 사슬인 단백질이다. 지질과 단백질이 세포막의 두 구성 축이다. 사람들은 고정되지 않고 떨림 선을 남기며 옆으로 움직인다. 이것이 유동이며, 여러 종류의 기둥이 섞여 있는 모습이 모자이크다. 유동적인 인지질 이중층에서 단백질이 움직이는 유동 모자이크 모델이다. 위의 밝은 물은 세포 밖, 아래의 짙은 물은 세포 안이다.","cards":["A1-0","A1-1","A1-4","A1-5","A1-6"],"box":null},{"sid":"s2","obj":"부표 사람 한 쌍 — 줄무늬 둥근 머리는 띠 밖 물에 · 긴 두 다리는 버터 속에 · 윗줄은 머리가 위로 · 아랫줄은 머리가 아래로","fact":"인지질 = 양친매성 — 친수성 머리와 소수성 꼬리를 한 분자에","hook":"물에 뜬 부표 머리 = 친수성 머리 · 버터에 박힌 두 다리 = 소수성 꼬리(지방산 둘)","say":"부표 사람 하나를 보자. 몸통과 팔 없이 줄무늬 둥근 머리와 긴 다리 둘만 있다. 물을 좋아하는 머리는 띠 밖 물을 향하고, 물을 싫어하는 다리는 기름진 버터 속에 들어가 있다. 친수성 머리와 지방산 둘로 된 소수성 꼬리를 함께 가진 양친매성 인지질이다. 윗줄 머리는 위쪽, 아랫줄 머리는 아래쪽을 향하고 다리는 막 안에서 서로 마주본다. 물에 넣으면 꼬리는 안쪽으로 숨고 머리는 물과 접촉하면서 이중층을 스스로 형성한다.","cards":["A1-2","A1-3"],"box":[[615,355,95,215],[600,575,85,205]]},{"sid":"s3","obj":"떨림 선을 그리며 옆으로 미끄러지는 부표 사람들 · 가운데 띠 속에 선 주황 오리발 잠수부가 파란 머리 부표 사람 하나를 두 손으로 들었고 그 오른쪽 아래에 아래로 굽은 검은 화살 · 윗줄 부표 머리는 빨강 · 아랫줄 부표 머리는 파랑","fact":"측면확산은 매우 빠름 · 플립플롭은 드묾 — 플립페이스가 옮겨 두 층은 비대칭","hook":"옆 떨림 선 = 측면확산 · 오리발(flipper) 잠수부 = 플립페이스(flippase) · 빨강 줄 / 파랑 줄 = 비대칭","say":"부표 사람의 이동 경로는 두 가지다. 같은 줄에서 옆으로 움직이는 측면확산은 떨림 선처럼 매우 빠르다. 반대쪽 줄로 넘어가는 플립플롭은 친수성 머리가 기름진 내부를 지나야 하므로 드물고 느리다. 그래서 옮기는 일꾼이 필요하다. 가운데의 주황 오리발 잠수부가 파란 머리 사람을 두 손으로 들어 굽은 화살표를 따라 아랫줄에 놓는다. 오리발 플리퍼에서 플립페이스를 연결하자. 특정 인지질을 한쪽 층으로 옮기는 역할이다. 윗줄은 빨간 머리, 아랫줄은 파란 머리인 모습은 막의 안팎 조성이 다른 비대칭을 뜻한다.","cards":["A1-155","A1-156","A1-39"],"box":[[500,350,395,95],[875,410,200,370],[495,695,395,90]]},{"sid":"s4","obj":"왼쪽 언 곳 — 다리가 곧은 부표 사람들이 어깨를 붙이고 빽빽이 섰다 · 그 오른쪽 — 무릎이 꺾인 부표 사람들은 사이가 벌어지고 얼음 바로 곁에서도 떨림 선을 그린다","fact":"포화 꼬리(곧음) = 조밀 · 덜 유동 / 불포화 꼬리(꺾임) = 유동 ↑ · 저온에도 유지","hook":"곧은 다리 = 포화(빽빽이 쌓임) · 꺾인 무릎 = 불포화(틈) · 얼음 곁에서도 움직임 = 저온에서 유동","say":"막 유동성을 정하는 두 단서는 다리의 모양인 인지질 꼬리의 포화도와, 다리 사이 금빛 타일인 콜레스테롤이다. 먼저 다리를 비교하자. 왼쪽 언 부분의 사람들은 포화 탄화수소 꼬리를 뜻하는 곧은 다리를 가졌다. 빽빽하게 모일 수 있어 유동성이 낮다. 오른쪽 사람들의 꺾인 무릎은 불포화 꼬리의 이중결합이다. 무릎 때문에 촘촘히 모이지 못해 틈이 생기고 잘 움직인다. 얼음 바로 옆에서도 떨림 선이 보이는 것은 불포화 꼬리가 많은 막이 낮은 온도에서도 유동성을 유지한다는 단서다.","cards":["A1-7","A1-8","A1-9","A1-10"],"box":[[10,445,492,345],[150,350,350,95],[505,350,385,440]]},{"sid":"s5","obj":"꺾인 다리 무리 끝의 다리 짧은 작은 부표 사람 · 오른쪽 끝 햇살 아래 녹아 흐르는 버터 · 언 곳 윗줄의 소 머리(유난히 긴 곧은 다리)와 돼지 머리(그보다 짧은 곧은 다리)","fact":"유동성 ↑ = 불포화 ↑ · 짧은 꼬리 · 온도 ↑ / 소기름 스테아르산 C18 · 돼지기름 팔미트산 C16","hook":"짧은 다리 = 짧은 꼬리 · 햇살에 녹는 버터 = 온도 ↑ · 소(ㅅ) = 스테아르산 긴 다리 18 · 돼지 = 팔미트산 16","say":"유동성을 높이는 세 조건을 모아 보자. 첫째는 꺾인 무릎처럼 불포화 지방산이 많은 경우다. 둘째는 무리 끝 작은 사람의 짧은 다리처럼 꼬리 사슬이 짧은 경우로, 서로 붙드는 면이 줄어든다. 셋째는 오른쪽 햇빛 아래 버터가 녹는 모습처럼 온도가 높은 경우다. 언 부분의 윗줄에는 소 머리와 돼지 머리도 있고 다리는 곧다. 포화된 동물 지방이 상온에서 굳는 모습이다. 소의 긴 다리는 대표 지방산인 스테아르산(C18)과 연결하며, 소의 ㅅ으로 기억한다. 그보다 짧은 돼지 다리는 돼지기름의 대표인 팔미트산(C16)이다.","cards":["A1-163","A1-18"],"box":[[805,375,85,195],[1870,430,178,480],[268,325,170,280]]},{"sid":"s6","obj":"다리 사이에 낀 금빛 타일 셋(고리 넷이 붙은 문장) — 꺾인 다리 쪽에 둘 · 언 곳의 하나는 둘레만 노랗게 얼지 않았다","fact":"콜레스테롤 = 인지질 사이에 낌 · 체온에선 유동성 ↓ · 저온에선 고체화 방지 = 완충","hook":"고리 넷 금빛 타일 = 콜레스테롤(스테로이드) · 꺾인 쪽 = 옆걸음을 막음 · 언 쪽의 노란 둘레 = 굳지 못하게 함","say":"다리 사이의 금빛 타일에는 육각형 셋과 오각형 하나로 된 고리 넷이 새겨져 있다. 이 덱의 스테로이드 표지인 콜레스테롤이며, 인지질 사이에 위치한다. 온도에 따라 효과가 달라진다. 사람 체온인 37 ℃처럼 따뜻할 때에는 꺾인 다리 사이에서 옆걸음을 막아 인지질 이동과 유동성을 낮춘다. 추울 때에는 곧은 다리가 빽빽하게 모이는 것을 방해한다. 언 곳에서도 타일 주변이 노랗게 남은 것은 고체화를 막고 굳는 온도를 낮춘다는 뜻이다. 높은 온도에서는 유동성을 낮추고 낮은 온도에서는 굳지 않게 하는 온도 완충장치다.","cards":["A1-11","A1-12","A1-13","A1-148","A1-14"],"box":[[195,445,130,115],[580,455,62,92],[669,594,62,92]]},{"sid":"s7","obj":"왼쪽 끝 — 띠 위 얼음덩이 속에 갇혀 떠는 일꾼 · 오른쪽 끝 — 녹아 흘러내리는 버터 위로 기우뚱 쓰러진 작은 구슬 기둥(아래쪽 구슬은 버터에 묻혀 흐릿하다)","fact":"유동성이 있어야 투과성 · 단백질 이동 유지 / 굳으면 효소 불활성 · 너무 묽으면 못 받침","hook":"얼음에 갇힌 일꾼 = 굳은 막의 효소 불활성 · 녹은 버터에 기우는 기둥 = 너무 묽어 단백질을 못 받침","say":"막은 적절한 유동성을 유지해야 한다. 유동성은 투과성뿐 아니라 막단백질이 필요한 자리로 이동하는 능력에도 영향을 준다. 왼쪽 얼어붙은 띠에서는 효소인 일꾼이 얼음에 갇혀 떨고 있다. 막이 고체화되면 투과성이 달라지고 이동해야 작용하는 효소 단백질도 불활성화된다. 오른쪽에서는 햇빛에 버터가 녹아 흐르고 작은 구슬 기둥이 기울어 아래 구슬부터 잠긴다. 너무 유동적이어도 단백질을 안정적으로 지지하지 못한다. 지나치게 굳거나 묽은 상태 모두 적절하지 않다.","cards":["A1-15","A1-16","A1-17"],"box":[[10,305,140,140],[1895,330,140,250]]},{"sid":"s8","obj":"버터 띠에 박힌 구슬 기둥들 · 아랫줄 파란 머리에 가는 사슬로 매달려 띠에는 닿지 않는 작은 구슬 공","fact":"내재단백질 = 지질 이중층 안에 박힘 / 주변부단백질 = 표면에 느슨히 붙음 · 관통 안 함","hook":"띠에 박힌 구슬 기둥 = 내재단백질 · 사슬에 매달린 구슬 공 = 주변부단백질(느슨 · 관통 ✕)","say":"막단백질을 두 종류로 구분해 보자. 버터 띠 안까지 박힌 구슬 기둥은 지질 이중층에 삽입된 내재단백질이다. 띠 아래 파란 머리에 가는 사슬로 매달린 작은 구슬 공은 주변부단백질이다. 내부에 들어가지 않고 막 표면에 느슨하게 붙으며, 흔히 내재단백질의 돌출 부위나 막 표면에 결합한다. 막을 관통하지 않는다는 점과, 박혀 있는지 매달려 있는지를 비교하자.","cards":["A1-19","A1-20","A1-22","A1-23"],"box":[[1375,440,50,265],[1295,765,72,168]]},{"sid":"s9","obj":"구슬 기둥 줄의 맨 왼쪽 기둥 — 꼭대기에 맨 흰 알 · 물속에선 곧은 기둥이고 버터 띠 속에서만 구슬 사슬이 꼬불꼬불 감겼다 · 띠 위아래로 끝까지 꿰뚫었다","fact":"막관통단백질 = 이중층을 끝에서 끝까지 관통한 내재단백질 · 소수성 부분 = α나선","hook":"띠를 위아래로 꿰뚫음 = 막관통 · 띠 속에서만 감긴 사슬 = 소수성 α나선 · 맨 흰 알 = α","say":"기둥 줄의 맨 왼쪽은 띠 위아래로 길게 나와 막 전체를 관통한다. 내재단백질 대부분에 해당하는 막관통단백질이다. 물에 나온 부분은 곧지만 버터 속 구슬 사슬만 나선으로 감겨 있다. 지질층을 지나는 소수성 아미노산 구간의 소수성 α나선이다. 꼭대기의 흰 알도 이 덱에서 α를 나타낸다. 물에 접하는 양 끝은 친수성이므로, 부표 사람과 마찬가지로 주변 환경에 맞는 성질을 가진다.","cards":["A1-21","A1-24"],"box":[[1052,180,120,845]]},{"sid":"s10","obj":"둘째 기둥 — 두 줄 기둥 사이로 뚫린 굴 · 굴 위아래로 작은 구슬들이 한 줄로 지난다 · 그 오른쪽 곧은 기둥 — 아래 끝 곁 작업대에서 안전모 일꾼이 조각을 맞춘다 · 빨간 우편함을 인 기둥 — 흰 봉투 하나는 물에 떠 오고 하나는 우편함에 꽂혔다 · 아래 끝 노란 등이 켜졌다","fact":"막단백질 기능 여섯 = 수 · 활 · 전 · 인 · 결 · 부 — 수송 · 효소 활성 · 신호전달 …","hook":"뚫린 굴 = 수송 · 작업대 일꾼 = 효소 활성 · 우편함과 켜진 등 = 신호전달 — 수활전인결부의 앞 셋","say":"막단백질의 여섯 기능은 수·활·전·인·결·부다. 왼쪽부터 기둥을 보자. 가운데가 뚫린 둘째 기둥을 작은 분자·이온인 구슬이 굴 위아래로 한 줄로 통과하는 모습은 수송이다. 특정 용질을 골라 통과시키는 선택적 통로다. 오른쪽의 곧은 기둥 아래 작업대에서 안전모 일꾼이 조각을 맞추는 모습은 효소 활성이다. 막에 결합한 효소가 주변 반응물을 만나 반응을 촉진하며, L32a 붉은 벽돌 담장의 펌프집인 세포호흡의 전자전달 효소 복합체가 예다. 다음 기둥이 이고 있는 빨간 우편함에 물을 따라 떠 온 흰 봉투가 꽂히자 아래 끝의 등이 켜진다. L16 교환국의 봉투·우편함과 같은 신호전달이다. 우편함 위의 빨간 머리는 이웃 부교의 부표 사람이다. 나머지 세 기능은 다음 장면에서 보자.","cards":["A1-25","A1-26","A1-27","A1-32"],"box":[[1198,140,114,835],[1378,290,46,610],[1345,840,185,165],[1465,180,185,145],[1495,840,105,125]]},{"sid":"s11","obj":"분홍 막대사탕 다발을 인 기둥 — 위쪽 이웃 부교에서 내려온 하늘색 Y 집게가 맨 위 사탕을 양옆에서 집는다 · 우편함 기둥 건너 왼쪽 — 이웃 부교에서 내려온 구슬 기둥이 띠 윗면의 큰 회색 대갈못으로 우리 띠의 기둥과 이어졌다","fact":"세포-세포 인식 = 당단백질이 식별 표지(면역글로불린) · 세포 간 결합 = 이웃 막단백질과 연접","hook":"막대사탕 다발 = 식별 표지 · 하늘색 Y 집게 = 면역글로불린 · 대갈못으로 이어진 두 부교의 기둥 = 세포 간 결합(연접)","say":"넷째 기능인 인식은 분홍 막대사탕 다발을 단 기둥이다. 당을 단 단백질인 당단백질이 다른 세포가 인식하는 표지가 된다. 위쪽 이웃 부교, 즉 이웃 세포의 막에서 내려온 하늘색 Y 집게가 사탕을 집는 모습을 보자. Y 집게는 이 덱의 면역글로불린인 항체로, L46c와 연결된다. 면역글로불린도 당단백질이며 인식 기능을 한다. 다섯째는 결합이다. 우편함 기둥 건너 왼쪽에서 이웃 부교의 구슬 기둥이 띠 윗면의 큰 회색 대갈못을 통해 우리 띠의 기둥과 이어져 두 막을 한 줄로 붙잡는다. 이웃 세포의 막단백질이 간극연접·밀착연접 같은 연접을 만드는 기능이다. 대갈못은 L14a 쌍둥이 방의 데스모솜이다.","cards":["A1-29","A1-33","A1-30"],"box":[[1632,145,122,195],[1430,148,80,625]]},{"sid":"s12","obj":"기둥 줄의 맨 오른쪽 기둥 — 위 끝은 밧줄 고리로 물 위에 뜬 밧줄 그물에 묶였고 · 아래 끝은 짙은 물속으로 뻗은 살구색 구슬 줄에 이어졌다","fact":"세포골격 · ECM 부착 = 세포 형태 유지 · 막단백질 위치 안정 · 세포 안팎의 변화를 잇는다","hook":"아래 살구색 구슬 줄 = 미세섬유(세포골격) · 위 밧줄 그물 = 세포외기질(ECM) · 둘을 붙든 기둥 = 부착","say":"여섯째 부착 기능은 맨 오른쪽 기둥의 안팎 연결로 보자. 세포 안쪽의 아래 끝은 L14b 풍선 놀이성의 살구색 구슬 줄인 미세섬유와 이어진다. 세포골격 섬유가 막단백질에 비공유 결합으로 붙어 세포 형태와 단백질 위치를 안정시킨다. 세포 밖의 위 끝은 밧줄 고리로 물 위의 밧줄 그물에 묶였다. 세포외기질, ECM이다. ECM 분자에 결합한 막단백질은 세포 안팎의 변화를 연결해 조절한다. 수송·효소 활성·신호전달·인식·결합·부착, 수활전인결부의 여섯 기능이다.","cards":["A1-31","A1-35","A1-36"],"box":[[1795,150,253,300],[1575,835,300,300]]},{"sid":"s13","obj":"막대사탕이 달린 두 가지 — 구슬 기둥 꼭대기의 분홍 막대사탕 다발 · 윗줄 빨간 부표 머리 둘에 하나씩 꽂힌 막대사탕(아랫줄 파란 머리엔 없다)","fact":"당단백질 = 막단백질 + 탄수화물 / 당지질 = 막지질 + 탄수화물 — 세포 바깥 면에","hook":"구슬 기둥의 막대사탕 = 당단백질 · 부표 머리의 막대사탕 = 당지질 · 윗줄에만 = 세포 바깥 면","say":"막대사탕은 L48d 막사에서 구슬 공에 꽂았던 것과 같은 당 사슬이다. 구슬 기둥에 붙으면 막단백질에 탄수화물이 결합한 당단백질, 부표 사람의 머리에 붙으면 막지질에 탄수화물이 결합한 당지질이다. 사탕은 윗줄인 세포 바깥 면에만 있고, 안쪽의 파란 머리에는 없다. 이것도 막의 비대칭이다. 세포마다 당 사슬 모양이 달라 서로를 구분하는 표지가 된다.","cards":["A1-37","A1-38"],"box":[[1632,195,122,140],[1592,295,52,80],[1738,318,50,78]]}],"cq":{"A1-0":["세포막을 한 문장으로 정의하면?","지질과 단백질로 구성된 유동 모자이크이다."],"A1-1":["세포막 구성의 두 축은?","지질 + 단백질"],"A1-4":["유동 모자이크 모델에 따르면 막은 무엇인가?","인지질 이중층에서 단백질이 움직이는 모자이크"],"A1-5":["세포막이 '유동적'이라는 말의 뜻은?","막 분자들이 특정 위치에 고정되지 않고 옆으로 움직인다는 뜻"],"A1-6":["세포막이 '모자이크'라는 말의 뜻은?","여러 종류의 단백질이 인지질 이중층에 섞여 박혀 있다는 뜻"],"A1-2":["인지질의 핵심 화학적 성질은?","양친매성(amphipathic)"],"A1-3":["양친매성이란?","친수성 부분과 소수성 부분을 동시에 가진 성질"],"A1-155":["인지질의 두 이동 방식과 속도 차이는?","측면확산(lateral)은 매우 빠름 · 플립플롭(flip-flop, 층 사이 뒤집기)은 드물고 느림"],"A1-156":["인지질 이중층의 안쪽·바깥쪽 조성이 비대칭으로 유지되는 이유(효소)는?","플립페이스(flippase)가 특정 인지질을 한쪽 층으로 옮겨 비대칭을 유지"],"A1-39":["세포막의 안쪽 면과 바깥쪽 면은 대칭인가?","비대칭"],"A1-7":["막 유동성에 영향을 주는 대표 요인 2가지는?","인지질 꼬리의 포화도 + 콜레스테롤"],"A1-8":["불포화 탄화수소 꼬리가 막 유동성을 높이는 이유는?","꼬리가 꺾여 있어 인지질이 촘촘히 쌓이는 것을 방해하기 때문"],"A1-9":["포화 탄화수소 꼬리가 많은 막의 성질은?","더 조밀하고 덜 유동적이다."],"A1-10":["불포화 꼬리가 풍부한 막은 어떤 온도에서 유동성을 더 잘 유지하는가?","낮은 온도"],"A1-163":["막 유동성을 높이는 요인 3가지는?","불포화 지방산↑ · 꼬리 사슬이 짧을수록 · 온도↑"],"A1-18":["소기름과 돼지기름의 대표 지방산으로 언급된 것은?","소기름=스테아르산(C18) · 돼지기름=팔미트산(C16)"],"A1-11":["콜레스테롤은 상온/체온에서 막에 어떤 효과를 주는가?","인지질 이동을 억제해 막을 덜 유동적으로 만든다."],"A1-12":["콜레스테롤은 낮은 온도에서 막에 어떤 효과를 주는가?","인지질이 정상적으로 채워지는 것을 방해해 고체화를 막는다."],"A1-13":["콜레스테롤을 막의 '완충장치'라고 볼 수 있는 이유는?","높은 온도에선 유동성을 낮추고 낮은 온도에선 고체화를 막기 때문"],"A1-148":["콜레스테롤이 막 유동성에 미치는 효과를 온도별로 정리하면?","상온에선 유동성 감소 · 저온에선 고체화 방지"],"A1-14":["콜레스테롤의 막 내 위치는?","인지질 분자들 사이에 끼어 있음"],"A1-15":["막이 제대로 작동하려면 왜 유동성이 필요한가?","막 투과성과 막 단백질 이동·기능 유지에 필요하기 때문"],"A1-16":["막이 고체화되면 생길 수 있는 문제 2가지는?","투과성 변화 + 효소 단백질 불활성화"],"A1-17":["막이 너무 유동적이어도 문제가 되는 이유는?","막 단백질의 안정적 기능을 지지하지 못하기 때문"],"A1-19":["막 단백질의 큰 두 종류는?","내재단백질 + 주변부단백질"],"A1-20":["내재단백질(integral protein)이란?","지질 이중층 안에 박혀 있는 단백질"],"A1-22":["주변부단백질(peripheral protein)이란?","막 표면에 느슨하게 붙어 있는 단백질"],"A1-23":["주변부단백질은 막을 관통하는가?","아니오"],"A1-21":["막관통단백질(transmembrane protein)이란?","지질 이중층을 끝에서 끝까지 관통하는 내재단백질"],"A1-24":["막관통단백질의 소수성 부분은 주로 어떤 구조를 이루는가?","소수성 알파나선"],"A1-25":["막 단백질의 주요 기능 6가지는?","수송 · 효소 활성 · 신호전달 · 세포-세포 인식 · 세포 간 결합 · 세포골격/ECM 부착"],"A1-26":["막 단백질 기능 중 '수송'이란?","특정 용질에 대해 막을 가로지르는 선택적 통로·운반 기능 제공"],"A1-27":["막 단백질 기능 중 '효소 활성'이란?","막에 내장된 효소가 반응물과 만나 반응을 촉진하는 기능"],"A1-32":["세포호흡 전자전달효소복합체는 막 단백질 기능 중 어디에 해당하는가?","효소 활성"],"A1-29":["막 단백질 기능 중 '세포-세포 인식'이란?","다른 세포가 인식할 수 있는 식별 표지 역할"],"A1-33":["면역글로불린(항체) 당단백질은 막 단백질 기능 중 어디와 관련되는가?","세포-세포 인식"],"A1-30":["막 단백질 기능 중 '세포 간 결합'이란?","인접 세포의 막 단백질끼리 연접을 형성하는 기능"],"A1-31":["막 단백질 기능 중 '세포골격/ECM 부착'이란?","세포 형태를 유지하고 막 단백질 위치를 안정화하는 기능"],"A1-35":["미세섬유가 막단백질에 비공유 결합하는 이유는?","세포 형태 유지와 특정 막 단백질 위치 안정화"],"A1-36":["ECM 분자에 결합하는 막단백질의 의미는?","세포 밖 변화와 세포 안 변화를 조화롭게 연결"],"A1-37":["당단백질(glycoprotein)이란?","막단백질에 탄수화물이 결합한 것"],"A1-38":["당지질(glycolipid)이란?","막지질에 탄수화물이 결합한 것"]},"hubPanel":null};
const $ = id => document.getElementById(id);
$('title').textContent = L.title; document.title = L.title;
// 요약 줄(sub)에는 물건 = 답이 다 적혀 있다 — 복습 · 시험에서는 접어 두고, 누르면 편다(GPT 추가 감사 2026-11-11 §7)
let subOpen = false;
function subShow() { const hide = (mode === 'review' || mode === 'quiz') && !subOpen && !!L.sub; $('sub').textContent = hide ? '요약 줄은 접어 두었다(답이 적혀 있다) — 누르면 편다' : (L.sub || ''); $('sub').classList.toggle('hid', hide); }
$('sub').onclick = () => { if (mode === 'review' || mode === 'quiz') { subOpen = !subOpen; subShow(); } };
$('img').src = L.img; $('img').alt = L.title;
if (L.home) $('home').href = L.home;  // 한 파일(standalone)은 저장소 밖에서 열리므로 배포 주소로
if (L.hub) $('hub').href = L.hub; else if (L.hubPanel) $('hub').href = '../sketchy.html#' + L.hubPanel;
const ov = $('ov'); ov.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
let tourEnded = false;

const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID

// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact), st.sid);
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate,
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
