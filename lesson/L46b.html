<script>
const L = {"id":"L46b","scene":"s46","part":"b","title":"심장 집 뒤뜰의 세 호스 — 동맥 · 모세혈관 · 정맥 · 혈압과 혈류 속도","sub":"작은 나무집(심장 · 반달 문) · 굵은 진홍 호스(동맥 — 겹겹 두꺼운 벽 · 좁은 속 · 불룩) · 꽃밭 위 실관 부채(모세혈관 — 가장 넓음) · 입 달린 꽃(교환) · 나무늘보(가장 느림) · 축 늘어진 회청 호스(정맥 — 얇은 벽 · 유턴 금지 문) · 풀밭의 토막 셋(단면 — 한 겹 고리 + 그물 = 내피 + 기저막) · 압력계 셋(혈압 동 > 모 > 정) · 집 제 벽을 감는 가는 진홍 호스(관상동맥) · 누런 기름 덩이 + 검붉은 핏덩이(동맥경화 · 혈전) · 금색 자물쇠(아스피린)","img":"img/L46b.webp?v=4fbee4d9c2d4","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"왼쪽 끝 작은 나무집(문짝에 노란 반달) → 굵은 진홍 호스 → 꽃밭 위로 퍼지는 실관 부채 → 축 늘어진 회청 호스 → 다시 집 (틀)","fact":"동맥 = 심장에서 나가는 관 · 정맥 = 심장으로 돌아오는 관 · 그 사이를 모세혈관이 잇는다","hook":"나가는 굵은 호스 · 퍼지는 실관 · 돌아오는 늘어진 호스","say":"지난 과에서 본 심장 집의 뒤뜰이다. 왼쪽 끝의 작은 나무집은 심장이고, 문짝의 노란 반달은 반달판막이다. 문에서 나온 굵은 진홍색 호스가 위쪽을 가로지른다. 심장에서 나가는 동맥이다. 오른쪽에서 여러 실관으로 갈라져 꽃밭에 부채처럼 퍼지는 부분은 모세혈관이다. 실관이 아래에서 모여 축 늘어진 회청색 호스가 되어 집으로 돌아오면 정맥이다. 심장을 기준으로 나가면 동맥, 돌아오면 정맥이고 그 사이를 모세혈관이 연결한다. 순환계는 심장·혈관·혈액으로 구성된다. 동맥은 벽이 두껍고, 정맥은 벽이 얇으며 판막이 있다는 차이도 함께 보자.","box":null,"src":["s46p03#0"],"cards":["H0-81","H0-280","G0-1"]},{"sid":"s2","obj":"진홍 호스의 잘라 낸 창 — 고무 여러 겹의 두꺼운 벽 · 좁은 속을 내닫는 긴 속도선 · 창 뒤의 불룩한 곳 · 풀밭의 진홍 토막(겹겹 두꺼운 벽 · 작은 구멍)","fact":"동맥 — 높은 혈압을 견뎌야 해서 벽이 두껍고 탄력 있다 · 속은 좁다","hook":"겹겹 두꺼운 고무 = 높은 압력을 견디는 동맥 벽","say":"진홍색 호스의 창으로 내부를 보자. 여러 겹 고무처럼 벽이 두껍고 통로는 좁으며, 혈액의 긴 속도선이 보인다. 창 뒤의 호스가 불룩한 것은 심장이 밀 때 늘어났다가 되돌아오는 탄성을 뜻한다. 풀밭에 세운 진홍색 단면도 두꺼운 벽과 작은 구멍을 보여 준다. 동맥은 심장에서 나온 높은 혈압을 견뎌야 하므로 벽이 두껍고 탄력이 있다.","box":[[600,235,360,125],[930,195,180,210],[485,478,272,312]],"src":["s46p03#0"],"cards":["H0-81"]},{"sid":"s3","obj":"회청 호스의 잘라 낸 창 — 얇은 벽 · 헐렁한 속 · 바닥 경첩에 달려 집 쪽(왼쪽)으로만 눕는 작은 문 셋(유턴 금지 표지) · 풀밭의 회청 토막(얇은 벽 · 큰 구멍)","fact":"정맥 — 압력이 낮아 거꾸로 흐르기 쉽다 · 판막이 역류를 막고 귀환을 돕는다","hook":"늘어진 얇은 호스 + 유턴 금지 문 = 정맥과 판막","say":"아래의 회청색 호스는 늘어져 있고, 창 안쪽의 벽은 얇고 공간은 넓다. 풀밭의 회청색 단면도 같은 특징을 보이는 정맥이다. 압력이 낮아 역류하기 쉬우므로 안에 작은 문 셋이 있다. 문은 바닥 경첩을 중심으로 집 쪽으로만 눕고, 각각 유턴 금지 표지가 붙었다. 심장 집에서 본 판막과 같은 약속이다. 정맥 판막은 역류를 막아 혈액이 심장으로 돌아가도록 돕는다.","box":[[820,948,492,124],[805,525,225,258]],"src":["s46p03#1"],"cards":["H0-82"]},{"sid":"s4","obj":"풀밭의 작은 셋째 토막 — 짧은 분홍 관 조각 · 얇은 한 겹 벽 · 겉을 감싼 가는 그물 · 구멍을 꽉 채운 가운데 옴폭한 붉은 원반 하나","fact":"모세혈관 벽 = 내피(납작한 세포 한 겹) + 기저막 · 얇고 내경이 작아 교환에 유리","hook":"한 겹 고리 = 내피 · 겉 그물 = 기저막","say":"풀밭의 셋째 단면은 작은 분홍 관이다. 벽은 한 겹이고 바깥에 가는 그물이 둘러져 있으며, 안은 가운데가 오목한 붉은 적혈구 하나로 가득 찬다. 모세혈관 단면이다. 안쪽의 납작한 세포 한 겹은 내피, 바깥의 얇은 받침은 기저막이며 모세혈관 벽은 이 둘로 이루어진다. 벽이 얇고 적혈구가 한 줄로 지날 만큼 내강이 좁아 물질 교환에 적합하다. 콩팥 사구체의 가시 그물도 모세혈관 기저막이었다는 점을 연결하자.","box":[[1068,595,170,182]],"src":["s46p03#2"],"cards":["H0-78","H0-79","H0-80","H0-85"]},{"sid":"s5","obj":"꽃밭 — 실관에서 나온 흰 방울을 입 달린 꽃이 삼키고 · 꽃이 뱉은 어두운 연기가 실관 끝으로 · 실관 빛깔이 진홍에서 회청으로","fact":"모세혈관 벽을 사이에 두고 물질이 드나든다 — O₂ 는 조직으로 · CO₂ 는 혈액으로","hook":"흰 방울 삼키고 연기 뱉는 꽃 = 조직과의 교환","say":"실관 끝의 꽃들은 입으로 흰 방울인 산소를 꿀꺽 삼키고, 어두운 연기인 이산화탄소를 훅 뱉어 실관에 돌려보낸다. 모세혈관의 얇은 벽을 통한 물질 교환이다. 이 과정에서 실관 색이 진홍에서 회청으로 바뀌며 동맥혈이 정맥혈이 된다. 실관과 꽃 사이에서 흰 방울이 떠다니는 틈은 세포사이액이다. 교환 표면과 몸 세포를 연결하는 물로, 영양분은 이 틈을 지나 세포로 가고 노폐물은 반대쪽으로 이동한다.","box":[[1660,50,388,660]],"src":["s46p03#2"],"cards":["H0-78","H0-79","H0-80","H0-85","G0-13","G0-14"]},{"sid":"s6","obj":"그림에서 가장 넓게 퍼진 실관 부채 · 실관에 거꾸로 매달린 졸린 나무늘보","fact":"모세혈관은 총 단면적이 가장 커서 혈류가 가장 느리다(대동맥의 약 1/500)","hook":"가장 넓은 부채 · 가장 느린 나무늘보","say":"실관이 펼쳐진 부채 부분이 가장 넓다. 모세혈관 하나는 가늘어도 수가 많기 때문에 모두 합한 총 단면적이 가장 크다. 같은 혈류량이 넓게 분산되므로 속도는 가장 느려 대동맥의 약 500분의 1이다. 실관에 거꾸로 매달린 졸린 나무늘보가 느린 흐름의 단서다. 물질을 교환할 시간을 확보하는 데 유리하다.","box":[[1300,100,660,810],[1310,425,180,212]],"src":["s46p03#2"],"cards":["H0-78","H0-79","H0-80","H0-85"]},{"sid":"s7","obj":"압력계 셋 — 진홍 호스 위는 바늘이 빨강 끝 · 실관 부채 뿌리는 한가운데 · 회청 호스 위는 0 가까이","fact":"혈압 동맥 > 모세혈관 > 정맥 — 벽 두께 순서(동 > 정 > 모)와 다르다","hook":"바늘 셋: 빨강 · 가운데 · 0","say":"압력계 셋의 바늘을 보자. 진홍색 동맥 호스 위에서는 빨강 끝까지 넘어가고, 모세혈관 부채 시작점에서는 가운데, 회청색 정맥 호스 위에서는 0 가까이 내려와 있다. 혈압은 동맥·모세혈관·정맥 순으로 낮아진다. 벽 두께의 순서는 동맥·정맥·모세혈관이었으므로 두 순서를 구분하자.","box":[[955,85,108,118],[1385,98,98,105],[698,818,104,124]],"src":["s46p03#3"],"cards":["H0-89","H0-284"]},{"sid":"s8","obj":"세 줄 견주기 — 속도선(진홍 창은 길고 많음 · 회청 창은 짧고 적음 · 실관엔 나무늘보) · 합친 넓이(부채가 가장 넓다 · 회청 토막은 속이 넓고 진홍 토막은 속이 좁다) · 바늘 셋 (되짚기)","fact":"속도 동>정>모 · 총 단면적 모>정>동 · 혈압 동>모>정 · 모세혈관은 교환에 유리","hook":"빠르기 · 넓이 · 바늘 — 세 줄이 어긋난다","say":"세 비교를 함께 해 보자. 진홍색 동맥 창의 속도선은 가장 길고 많으며, 회청색 정맥 창의 속도선은 짧고 적다. 모세혈관의 실관에는 나무늘보가 있다. 동맥·정맥·모세혈관 순으로 혈류 속도가 느려진다. 총 단면적은 한 관의 굵기가 아니라 전체를 합한 넓이다. 모세혈관 부채가 가장 넓고, 풀밭의 회청색 토막처럼 내강이 넓은 정맥이 동맥보다 커서 모세혈관·정맥·동맥 순이다. 혈압의 순서는 동맥·모세혈관·정맥이다. 구조와 기능이 혈압과 혈류에 드러나지만, 세 순서는 서로 다르다. 모세혈관의 낮은 혈압과 느린 유속은 물질 교환에 유리하다.","box":[[600,235,360,125],[820,948,492,124],[1310,425,180,212],[955,85,108,118],[1385,98,98,105],[698,818,104,124]],"src":["s46p03#3"],"cards":["H0-89","H0-284"]},{"sid":"s9","obj":"큰 진홍 호스가 나무집을 나서자마자 그 밑에서 갈라진 가는 진홍 호스 — 집 제 벽을 따라 구불구불 내려간다 · 벽 한가운데 누런 기름 덩이에 검붉은 핏덩이가 얹힌 자리에서 호스가 허리처럼 잘록하게 조였고 · 그 아래 호스는 옅은 분홍 · 그 자리에 금색 자물쇠","fact":"관상동맥 = 심장 자신에 피를 대는 동맥 · 위험인자 LDL/HDL↑ · 만성 염증","hook":"제 벽을 감는 가는 호스 = 관상동맥 · 누런 기름 + 핏덩이 = 동맥경화 · 혈전 · 금색 자물쇠 = 아스피린","say":"굵은 진홍 호스가 심장 집을 나오자마자 아래에서 가는 진홍색 호스가 갈라져 되돌아와 집 벽을 따라 구불구불 내려간다. 심장도 계속 일하는 근육이므로 혈액 공급이 필요하지만, 심장 안을 지나는 혈액만으로 두꺼운 벽을 공급할 수는 없다. 대동맥 시작 부근에서 나와 심장 표면을 감싸는 관상동맥이 별도로 공급한다. 벽 가운데의 가는 호스는 허리처럼 좁아져 있고, 누런 지방 덩이 위에 검붉은 혈전이 얹혔다. 그 아래 호스가 옅은 분홍인 것은 혈액이 조금만 통과한다는 뜻이다. LDL이 많고 HDL이 적을수록, 만성 염증이 있을수록 지방이 쌓여 동맥이 굳고 혈전이 생긴다. 그곳의 금색 자물쇠는 아스피린이다. 이 덱에서 금색 자물쇠는 약물이며, 아스피린은 염증과 혈전 생성을 줄인다.","box":[[165,615,135,140],[255,345,225,250],[0,700,190,200]],"cards":["H0-37","H0-77"]}],"cq":{"H0-81":["동맥 벽이 두꺼운 이유는?","높은 혈압을 견뎌야 하기 때문"],"H0-280":["동맥과 정맥을 비교하면?","동맥은 심장에서 나가고 벽이 두껍고 · 정맥은 심장으로 돌아오며 판막이 있다"],"G0-1":["포유동물의 순환계 구성요소 3가지는?","심장, 혈관, 혈액"],"H0-82":["정맥에 판막이 있는 이유는?","혈액 역류를 막고 심장으로의 귀환을 돕기 위해"],"H0-78":["혈관 안쪽을 덮는 단일층의 평평한 세포층은?","내피"],"H0-79":["모세혈관 벽의 주요 구성은?","내피와 기저막"],"H0-80":["모세혈관이 물질교환에 유리한 이유는?","벽이 매우 얇고 내경이 작기 때문"],"H0-85":["모세혈관의 혈류 속도는 대동맥에 비해 대략 얼마나 느린가?","약 500배 느림 (총 단면적이 가장 커서 유속이 가장 느림)"],"G0-13":["세포사이액(interstitial fluid)의 역할은?","교환 표면과 체세포를 연결한다"],"G0-14":["세포사이액과 순환계액의 교환이 중요한 이유는?","영양 공급과 노폐물 제거를 가능하게 하기 때문이다"],"H0-89":["혈류속도 동 > 정 > 모, 총 단면적 모 > 정 > 동, 혈압 동 > 모 > 정 이라는 관계는 왜 중요한가?","구조와 기능이 혈류역학에 반영되기 때문"],"H0-284":["혈압과 혈류속도를 비교하면 모세혈관이 특별한 이유는?","혈압과 유속이 낮아 물질교환에 유리하다"],"H0-37":["심장 자체에 혈액을 공급하는 동맥은?","관상동맥"],"H0-77":["심혈관 질환(동맥경화·혈전)의 주요 위험인자와 예방약은?","높은 LDL/HDL 비·만성 염증이 위험인자 · 아스피린이 염증·혈전 형성을 줄임"]},"hubPanel":"s46p03"};

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';

const ttsNorm = t => TTSNorm.ttsNorm(t, TTS_LEX, TTS_ORDER, L.id);
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate, auto:playing && mode === 'tour',
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate, auto:true,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }

}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();

  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });

}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);

}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;

  const parts = [];

$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;

$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };

const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
