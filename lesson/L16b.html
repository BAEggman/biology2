<style>
  :root{--ink:#1b1b1f;--ink2:#4b4b55;--line:#e3e1da;--teal:#0f766e;--teal50:#ecfdf5;--gold:#b45309;--bg:#f7f5ef}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1100px;margin:0 auto;padding:12px 14px 40px}
  h1{font-size:18px;margin:6px 0 2px}
  .sub{font-size:12.5px;color:var(--ink2);margin:0 0 10px}
  .sub.hid{cursor:pointer;color:var(--ink3,#8a8a94);border:1px dashed #c9c6bd;border-radius:8px;padding:4px 8px;display:inline-block}
  .cq{font-size:12.5px;color:var(--ink2);margin-top:8px;border-top:1px dashed #d8d5cc;padding-top:6px}.cq summary{cursor:pointer}.cq li{margin:3px 0}.cq .a{color:var(--ink);font-weight:600}
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
  button{font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
  button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  button:disabled{opacity:.45;cursor:default}
  .stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .stage img{display:block;width:100%;height:auto}
  .stage svg{position:absolute;inset:0;width:100%;height:100%}
  .cap{margin-top:10px;min-height:76px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px}
  .cap .n{font-size:11.5px;color:var(--ink2)}
  .cap .obj{font-weight:700;font-size:15px;margin:2px 0}
  .cap .fact{font-size:14px;margin:2px 0}
  .cap .hook{font-size:13px;color:var(--gold);margin-top:4px}
  .cap.muted{color:var(--ink2);font-size:13px}
  .recap{margin-top:12px;display:none}
  .recap ol{padding-left:22px;margin:6px 0}
  .recap li{margin:4px 0;font-size:13.5px}
  .recap li b{color:var(--teal)}
  .score{font-size:13px;color:var(--ink2);margin-left:auto}
  .hint{font-size:12px;color:var(--ink2);margin-top:8px}
  .hole{fill:#000}
  .cur{fill:none;stroke:#f59e0b;stroke-width:6;stroke-dasharray:14 8}
  .hot{fill:transparent;cursor:pointer}
  .hot:hover{fill:rgba(245,158,11,.18)}
  .judge{display:none;gap:6px;margin-top:8px}
  .judge button{font-size:12.5px}
  .nav{display:flex;gap:12px;font-size:12.5px;margin:2px 0 0}
  .nav a{color:var(--teal);text-decoration:none}
  .nav a:hover{text-decoration:underline}
</style>

<script>
const L = {"id":"L16b","scene":"s16","part":"b","title":"2차 캠프장 — 2차 전령","sub":"cAMP(아데닐산 고리화효소 · PKA · 증폭 · PDE · 콜레라 · 글리코겐 분해) + IP₃ · DAG · PKC · Ca²⁺","img":"img/L16b.webp?v=14fc047c7ebe","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"2차 캠프장","fact":"2차 전령 — 신호를 세포 안에서 잇는 작은 분자 · cAMP · cGMP · Ca²⁺ · IP₃ · DAG","hook":"2차 = 2차 전령 · 캠프 = cAMP","say":"이곳은 이차 캠프장이다. 교환국 창구를 찾아왔던 리간드가 일차 전령이라면, 세포 안에서 그 신호를 이어 주는 작은 분자가 이차 전령이다. 씨 에이 엠 피를 붙여 읽은 ‘캠프’가 장소의 이름 단서다. 여기서는 씨에이엠피, 씨지엠피, 칼슘 이온, 아이피쓰리, 디에이지의 다섯 전령을 살펴본다. 2차 전령은 단백질이 아니라, 작고 물에 녹아 세포 안에 잘 퍼지는 분자나 이온이다. 큰 단백질은 2차 전령에 해당하지 않는다. 만드는 효소도 구별하자. cAMP는 아데닐산 고리화효소, cGMP는 구아닐산 고리화효소가 만들며, IP₃와 DAG는 PLC가 만든다.","box":null,"src":["s16p02#0"],"cards":["B0-98","B0-113#5","B0-96#1","Q0-9#2","Q0-9#3","B0-192#1","G0-184","B0-102","S-SG-10","B0-100","B0-101","X-SG-4","B0-113#4","B0-204#1","X-SG-5","B0-113","Q0-9","B0-95","B0-115","B0-191","B0-96","G0-134","T0-231","S-SG-5","B0-92","B0-93","B0-94","B0-97"]},{"sid":"s2","obj":"입구로 굴러든 뚜껑 터진 드럼통","fact":"에피네프린(GPCR 리간드)이 이 캠프의 일을 시작한다 — 간세포에서","hook":"뚜껑 터진 드럼통 = 에피네프린(덱 전체 약속)","say":"입구로 굴러오는 뚜껑 터진 드럼통은 에피네프린이다. 에피네프린이 간세포의 지피시알에 결합하면 이 캠프의 일이 시작된다. 간세포 안에서 신호를 이어 가는 대표적인 2차 전령은 cAMP이다. 에피네프린은 저장된 연료를 동원해 몸이 투쟁-도피 반응에 대비하도록 한다.","box":[120,140,280,340],"src":["s16p01c#3"],"cards":["S-SG-1","Q0-10","G0-124","B0-13"]},{"sid":"s3","obj":"모닥불 곁 압착기 — 금화를 넣으면 구부러진 고리가 나온다","fact":"아데닐산 고리화효소(Gs 가 켠다): ATP → cAMP(고리 · 피로인산 떨어짐) · 이온 아닌 작은 분자","hook":"동전(ATP)을 구부린 고리 = cAMP","say":"모닥불 옆 압착기에 금화를 넣자 구부러진 고리가 나온다. 이 압착기는 아데닐산 고리화효소로, 앞서 교환국의 지게꾼이 달려갔던 기계다. 활성화된 지 단백질인 지에스가 효소를 켠다. 에이티피 동전에서 만든 고리가 씨에이엠피이며, 씨는 고리 모양을 뜻하는 사이클릭이다. 이때 인산 둘이 붙은 피로인산이 떨어져 나간다. 씨에이엠피는 에이티피로부터 만드는 작은 분자이고 이온은 아니다. 압착기를 켜는 손님은 드럼통만이 아니다. 교환국의 향수병으로 표현한 냄새 분자가 후각 수용체에 붙을 때도 이 효소가 켜져 씨에이엠피가 증가한다. 에피네프린이 결합하면 세포 안 cAMP 농도가 높아지며, 이 농도는 밖에서 온 1차 전령의 농도를 따른다. 반대로 압착기를 끄는 억제성 G 단백질도 있다.","box":[[20,540,790,535]],"src":["s16p02#0"],"cards":["B0-98","B0-113#5","B0-96#1","Q0-9#2","Q0-9#3","B0-192#1","G0-184","B0-102","S-SG-10","B0-100","B0-101","X-SG-4","B0-113#4","B0-204#1","X-SG-5","B0-113","Q0-9","B0-95","B0-115","B0-191","B0-96","G0-134","T0-231","B0-99","B0-105","B0-108"]},{"sid":"s4","obj":"꼭대기에 큰 열쇠 걸린 주황 A자 텐트 — 고리를 던져 넣자 안의 사람이 깬다","fact":"cAMP가 PKA(단백질 인산화효소 A · 세린/트레오닌에 인산)를 켠다","hook":"A자 텐트 = PKA · 열쇠 = 키나아제","say":"주황색 에이 자 텐트 꼭대기의 큰 열쇠를 보자. 핵을 나타내는 둥근 돔 천막과 달리 뾰족한 에이 자다. 에이와 열쇠를 연결하면 단백질 인산화효소 에이, 피케이에이다. 텐트에 고리를 던져 넣자 잠들어 있던 사람이 눈을 뜬다. 씨에이엠피가 피케이에이를 활성화하는 모습이다. 피케이에이는 세린이나 트레오닌에 인산을 붙인다. 타이 맨이 티로신에 붙이는 것과 구별하자. 세포질의 단백질 인산화효소 대부분도 이처럼 세린이나 트레오닌을 인산화한다. 고리와 텐트는 뱀 창구 아래의 경로다. 쥐 주자인 라스와 지도의 맵 연쇄는 다른 길로, 타이 창구인 알티케이 아래의 열쇠 계주 운동장에 해당한다.","box":[430,70,610,570],"src":["s16p02#1"],"cards":["Q0-9#4","B0-106","B0-107","G0-125","S-SG-6","B0-113#6","X-SG-6","B0-83","X-SG-12","B0-88"]},{"sid":"s5","obj":"텐트 뒤로 쏟아져 나오는 군중","fact":"신호 증폭 — 단계마다 수가 불어난다(연쇄)","hook":"하나 넣었는데 군중이 나온다","say":"텐트 뒤에서 똑같은 사람들이 무리 지어 쏟아져 나온다. 고리는 하나 넣었는데 군중이 나오는 모습이 신호 증폭이다. 활성화된 효소 하나가 꺼지기 전에 다음 단백질 여럿을 켜고, 그 단백질들이 다시 여럿을 켜므로 단계를 거칠수록 신호가 커진다. 열쇠로 표현한 인산화효소가 다음 인산화효소에 인산을 붙여 차례로 활성화하는 경로를 인산화 연쇄라고 한다.","box":[840,110,600,450],"src":["s16p02#2"],"cards":["B0-135#1","B0-84","B0-85","G0-127","B0-211","B0-80","Q0-10","S-SG-11","B0-136"]},{"sid":"s6","obj":"가위로 고리를 자르는 사람 — 바닥의 토막은 동전이 아니다","fact":"PDE(인산이에스테르가수분해효소)가 cAMP를 끊어 5′-AMP로 — 신호 끔 · ATP로는 못 돌아간다","hook":"자른 고리 = 못 돌아가는 토막","say":"가위를 든 사람이 고리를 잘라 버린다. 인산이에스테르 가수분해효소인 피디이가 씨에이엠피를 오 프라임 에이엠피로 바꾸어 신호를 끄는 모습이다. 바닥에 떨어진 것은 잘린 고리 조각이지 동전이 아니다. 씨에이엠피를 분해한다고 에이티피로 되돌아가는 것은 아니라는 점을 기억하자.","box":[800,680,320,400],"src":["s16p02#3"],"cards":["B0-103","B0-104","B0-135#4","B0-114","B0-185#2","B0-185","X-SG-2","B0-145","S-SG-12"]},{"sid":"s7","obj":"콜라병을 뒤집어쓴 지게꾼 — 칩이 손에 붙어 못 뒤집고, 고리 산더미 · 호스에서 물이 콸콸","fact":"콜레라 독소: G단백질 GTP 가수분해 차단 → cAMP 과다 → 장 상피가 물·염 분비(설사)","hook":"뒤집어쓴 끈적한 콜라 = 콜레라 · 붙은 칩 = 못 끈다","say":"콜라를 뒤집어쓴 지게꾼의 손에 네모 칩이 붙어 있다. 끈적한 콜라 때문에 칩을 다시 뒤집지 못하는 모습에서 콜레라를 떠올리자. 콜레라 독소는 지 단백질의 지티피 가수분해를 막아 활성 상태를 유지시킨다. 그 결과 씨에이엠피 고리가 산더미처럼 쌓이고, 장 상피세포가 물과 염을 내보낸다. 발밑 호스에서 쏟아지는 물은 설사다. 백일해(pertussis) 독소는 반대로 압착기를 끄는 Gi를 망가뜨린다. 콜레라는 Gs, 백일해는 Gi를 변형하지만, 결과적으로 둘 다 cAMP가 과다해진다는 점을 구별해 기억하자.","box":[1120,380,580,760],"src":[],"cards":["B0-109","B0-110","B0-203","X-SG-16"]},{"sid":"s8","obj":"장대의 포도송이에서 알이 후두둑 떨어진다","fact":"에피네프린 → cAMP → PKA → 글리코겐 분해 → 포도당 방출(서덜랜드)","hook":"포도 = 포도당 · 송이 = 글리코겐","say":"장대의 포도송이에서 포도알이 떨어진다. 잔가지로 갈라진 송이는 글리코겐, 낱알은 포도당이다. 에피네프린 신호가 씨에이엠피와 피케이에이를 거쳐 간의 글리코겐이 분해되어 포도당이 나오는, 서덜랜드가 밝힌 경로다. 글리코겐에서 먼저 떨어지는 것은 포도당 1-인산이며, 세포 안에서 포도당 6-인산으로 바뀐다. 서덜랜드가 효소와 글리코겐만 있는 용액에 에피네프린을 넣었을 때는 분해가 일어나지 않았다. 막에 둘러싸인 온전한 세포가 필요했다. 이 신호가 세포막과 세포 내부의 전달 과정을 거쳐야 하기 때문이다.","box":[1400,40,220,620],"src":[],"cards":["B0-15","B0-16","X-SG-26","B0-17","B0-18"]},{"sid":"s9","obj":"식탁의 피자를 C자 커터로 두 조각","fact":"인지질분해효소 C가 막 인지질 PIP₂를 IP₃와 DAG 둘로 쪼갠다","hook":"피자 = PIP₂ · C자 커터 = PLC","say":"식탁의 피자를 씨 자 커터로 둘로 나누고 있다. 피자는 핍 투, 씨 자 커터는 인지질분해효소 씨다. 막 인지질인 핍 투가 이 효소에 의해 아이피쓰리와 디에이지로 나뉜다.","box":[1580,280,420,360],"src":["s16p02b#0"],"cards":["B0-206","B0-96#4","B0-96#5","B0-123","B0-119","B0-122","G0-184","B0-193","S-SG-7","X-SG-8","B0-96","B0-205"]},{"sid":"s10","obj":"구멍 셋 조각이 식탁을 떠나 날아간다","fact":"IP₃ — 인산 셋 · 물에 녹아 막을 떠나 세포질로 퍼진다","hook":"구멍 셋 = IP₃ · 날아감 = 수용성","say":"잘린 조각 중 구멍이 셋인 것은 식탁을 떠나 날아간다. 세 구멍을 인산 셋에 연결하면 아이피쓰리, 즉 이노시톨 3인산이다. 물에 녹기 때문에 막에서 떨어져 나와 세포질로 퍼질 수 있다.","box":[1760,140,220,160],"src":["s16p02b#0"],"cards":["B0-206","B0-96#4","B0-96#5","B0-123","B0-119","B0-122","G0-184","B0-193","S-SG-7","X-SG-8","B0-96","B0-205","B0-120"]},{"sid":"s11","obj":"다른 조각 위에 닭이 눌러앉음 · 곁의 사람이 C자로 굽은 열쇠를 든다","fact":"DAG(디아실글리세롤)는 막에 남아 PKC를 켠다 · Ca²⁺도 거든다","hook":"닭 = DAG · C자 열쇠 = PKC","say":"다른 조각에는 닭이 눌러앉아 움직이지 않는다. 디 에이 지를 이어 읽은 ‘닥’, 즉 닭에서 디에이지를 떠올리자. 디아실글리세롤은 막에 남는다는 뜻이다. 옆 사람의 씨 자로 굽은 열쇠는 단백질 인산화효소 씨, 피케이씨다. 디에이지가 이 효소를 활성화하고, 아래 상자에서 쏟아지는 자갈인 칼슘도 함께 돕는다.","box":[[1700,390,120,110],[1870,310,165,320]],"src":["s16p02b#2"],"cards":["B0-208","B0-121","X-SG-6","S-SG-6"]},{"sid":"s12","obj":"끈 묶은 소포 상자 하나 — 뚜껑의 나무 돌기 셋에 구멍 셋 조각이 꽂히자 자갈이 쏟아진다 — 바닥은 깨끗","fact":"IP₃가 소포체 Ca²⁺ 통로를 연다 → Ca²⁺ 방출 · 세포질 Ca²⁺는 평소 낮게(펌프)","hook":"돌기 셋 달린 소포 상자 = 소포체 · 돌기 셋에 구멍 셋 · 자갈 = Ca²⁺","say":"끈으로 묶은 소포 상자는 소포체다. 구멍 셋인 조각이 뚜껑의 돌기 셋에 맞물리자 자갈이 쏟아진다. 아이피쓰리가 소포체의 칼슘 통로를 열어 칼슘 이온을 세포질로 방출하는 모습이다. 상자 밖 바닥은 평소에는 깨끗하다. 세포질 칼슘 농도가 펌프에 의해 매우 낮게 유지되어, 조금만 방출되어도 큰 신호가 된다는 단서다. 세포막과 소포체 막의 펌프가 ATP를 써서 칼슘을 내보내므로, 세포질 농도는 세포 밖이나 소포체 안보다 훨씬 낮다. 농도가 크게 오르면 미토콘드리아도 화학삼투로 칼슘을 받아들인다. 칼슘 증가는 근수축·세포외배출에 의한 분비·세포분열로 이어진다. 하나의 농도 변화로 여러 반응을 빠르게 일으키는 중요한 2차 전령인 셈이다. 방출된 칼슘은 칼모듈린이 받는다. 칼슘은 씨에이엠피와 함께 가장 널리 쓰이는 이차 전령이며, 씨에이엠피보다도 더 널리 사용된다. 뱀 창구 지피시알과 타이 창구 알티케이 모두 피자 커터를 켜서 칼슘 신호를 이용한다.","box":[1700,720,348,424],"src":["s16p02b#1","s16p02b#3"],"cards":["B0-118","B0-207","X-SG-7","X-SG-27","B0-96#3","B0-117","B0-83","B0-95","B0-115","B0-191","B0-124","B0-125","B0-126","B0-127","B0-116","B0-128"]}],"cq":{"B0-98":["cAMP는 무엇의 약자인가?","고리형 AMP(cyclic AMP)"],"B0-113#5":["cAMP 경로의 핵심 흐름은?","cAMP"],"B0-96#1":["대표적인 2차 신호전달자 5가지는?","cAMP"],"Q0-9#2":["에피네프린의 신호 전달 경로 예는?","아데닐산 고리화효소"],"Q0-9#3":["에피네프린의 신호 전달 경로 예는?","cAMP(2차 전령)"],"B0-192#1":["cAMP와 Ca2+의 차이는?","cAMP는 ATP 유래 작은 분자"],"G0-184":["2차 전달자(second messenger)의 대표 예는?","cAMP · cGMP · Ca²⁺ · DAG · IP₃ 등"],"B0-102":["활성화된 G 단백질이 cAMP 경로에서 직접 활성화하는 것은?","아데닐산 고리화효소"],"S-SG-10":["같은 GPCR인데 cAMP↑와 cGMP↓로 갈리는 이유(한 축)는?","G단백질이 켜는 효소가 다름: Gs→고리화효소 / Gt→PDE"],"B0-100":["에피네프린-GPCR 경로에서 cAMP 합성을 촉진하는 효소는?","아데닐산 고리화효소(adenylyl cyclase)"],"B0-101":["아데닐산 고리화효소는 무엇으로부터 cAMP를 만드는가?","ATP"],"X-SG-4":["아데닐산 고리화효소의 기질과 산물은?","ATP → cAMP"],"B0-113#4":["cAMP 경로의 핵심 흐름은?","아데닐산 고리화효소"],"B0-204#1":["cAMP와 cGMP를 각각 만드는 효소 — 「cAMP」? (↔ cGMP)","아데닐산 고리화효소(adenylyl cyclase)"],"X-SG-5":["cAMP를 만드는 효소는? / cAMP·cGMP를 없애는 효소는?","만들기=아데닐산 고리화효소 / 없애기=PDE"],"B0-113":["cAMP 경로의 핵심 흐름은?","리간드 → GPCR → G단백질 → 아데닐산 고리화효소 → cAMP → PKA"],"Q0-9":["에피네프린의 신호 전달 경로 예는?","GPCR→아데닐산 고리화효소→cAMP(2차 전령)→PKA→글리코겐 분해(혈당↑)"],"B0-95":["가장 많이 사용되는 2가지 2차 신호전달자는?","cAMP와 Ca2+"],"B0-115":["칼슘이온은 cAMP와 비교해 어떤 2차 전달자인가?","더 많이 사용되는 2차 전달자"],"B if (L.hub) $('hub').href = L.hub; else if (L.hubPanel) $('hub').href = '../sketchy.html#' + L.hubPanel;
const ov = $('ov'); ov.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
let tourEnded = false;
let mode = 'tour', i = -1, playing = false, voice = true, rate = 1.0, quizOrder = [], quizPos = 0, quizRevealed = false, shuffle = false, sess = null;
const stops = L.stops;
subShow();
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID
const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact), st.sid);
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate,
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
</html>
