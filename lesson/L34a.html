const L = {"id":"L34a","scene":"s34","part":"a","title":"씨앗 공방 두 층 — 소포 더미와 대포 넷 (수배우체 · 배낭)","sub":"위층(꽃밥): 빈손 큰 사람(소포자모세포) · 소포 위 넷(소포자) · 관 멘 하나 + 긴 외투 하나(관세포 · 생식세포) · 벗겨진 껍질(화분벽) · 똑같은 붉은 조끼 둘(정자) · 아래층(밑씨): 두 겹 아치 + 문 하나(주피 · 주공) · 대포 넷(대포자 · 셋 탐) · 청록 + 회색 둘(난세포 · 조세포) · 바구니 겨자색 둘(극핵) · 먼 벽 회색 셋(반족세포)","img":"img/L34a.webp?v=346d2d26fd98","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"두 층 공방의 단면 — 위층 꽃가루 작업대 · 아래층 배낭 방","fact":"위 = 꽃밥 속(수배우체 계보) · 아래 = 밑씨 속(배낭 = 암배우체) · 문 하나가 좌표","hook":"위층 수컷 · 아래층 암컷","say":"씨앗 공방의 단면에서 두 층을 보자. 위층은 꽃밥 속 꽃가루 작업대이고, 아래층은 씨방 속 밑씨에 있는 배낭 방이다. 꽃밥이 달린 수술은 소포자엽이며, 꽃밥 속 소포자낭에서 소포자가 화분으로 발달한다. 밑씨를 품는 심피는 대포자엽이다. 위층은 왼쪽에서 오른쪽으로 수배우체의 계보를 따라 읽는다. 아래층에서는 하나뿐인 문을 기준으로 각 세포의 위치를 읽는다.","box":null,"src":["s34p01#0"],"cards":["P0-8#1","S-PL-3","M1-17","X-PL-11"]},{"sid":"s2","obj":"위층 왼쪽 — 빈손으로 소포 더미를 올려다보는 훨씬 큰 사람","fact":"소포자모세포(2n) → 감수분열 · 빈손 = 자기 몫이 남지 않는다","hook":"큰 사람 빈손 = 모세포","say":"위층 왼쪽의 훨씬 큰 사람이 빈손으로 소포 더미를 올려다본다. 이배체인 소포자모세포이며, 이제 감수분열을 한다. 자기 몫으로 남는 것이 없다는 뜻에서 빈손이다. 이 층의 순서는 왼쪽부터 소포자모세포, 소포자 넷, 화분립, 생식세포, 정자 둘이다.","box":[[20,80,375,480]],"src":["s34p01#0"],"cards":["P0-8#1","S-PL-3"]},{"sid":"s3","obj":"끈을 십자로 묶은 갈색 종이 소포 더미 위에 앉은 작은 사람 넷 — 맨 위 소포에 셋 · 아래 소포에 하나 · 소포는 다 성하다","fact":"소포자(n) 4개 — 세는 것은 사람 · 넷 다 산다(대포자는 하나만)","hook":"사람이 앉은 종이 소포 더미 = 소포자 · 넷 다 삶","say":"소포 더미에 앉은 작은 사람을 세어 보자. 맨 위 소포에 셋, 아래 소포에 하나로 모두 넷이다. 소포는 모두 온전하다. 감수분열로 생긴 반수체 소포자 넷을 나타내며, 셀 대상은 소포가 아니라 사람이다. 넷이 모두 살아남는다는 점이 아래층에서 하나만 살아남는 대포자와 다르다. 소포라는 이름에서 소포자를 떠올리고, 이 더미의 자리가 꽃밥 속 소포자낭임을 연결하자. 캠프장에서 돌기 셋이 달린 상자 하나로 표현한 소포체와는 다르다. 여기서는 사람이 걸터앉은 종이 소포 더미다.","box":[360,20,520,440],"src":["s34p01#1"],"cards":["P0-8#2","M1-4#5","M1-4","X-PL-12","D0-109"]},{"sid":"s4","obj":"작업대의 알갱이 속 — 몸은 둘: 관을 멘 하나 · 단추를 끝까지 채운 긴 외투 하나","fact":"소포자 체세포분열 1회 → 관세포 + 생식세포 = 수배우체(두 세포 시기의 화분)","hook":"관 멘 쪽 = 관세포(화분관) · 외투 = 생식세포(나중에 정자 둘로 갈라질 쪽)","say":"작업대의 알갱이를 갈라 보면 몸이 둘 있다. 하나는 관을 메고 있고, 다른 하나는 단추를 끝까지 채운 긴 외투를 입었다. 소포자가 한 번 체세포분열해 생긴 두 세포다. 관을 멘 관세포는 나중에 화분관을 만들고, 외투를 입은 쪽은 생식세포다. 둘이 두 세포 단계의 화분인 수배우체를 이룬다. 외투 속 생식세포는 아직 정자 둘로 나뉘기 전이다.","box":[960,80,420,320],"src":["s34p01#2"],"cards":["P0-8#2","P0-8#3","M1-7","M1-4#6","P0-8","X-PL-2","S-PL-2"]},{"sid":"s5","obj":"겉이 오톨도톨한 두꺼운 껍질이 통째로 벗겨져 옆에 놓였다","fact":"화분벽 — 2세포(수배우체)에 이 벽까지 씌운 것이 화분립","hook":"오톨도톨 껍질 = 화분벽","say":"알갱이 옆에는 표면이 오톨도톨한 두꺼운 껍질이 통째로 벗겨져 있다. 화분벽이다. 두 세포로 이루어진 수배우체에 이 벽까지 씌운 것이 화분립, 즉 꽃가루 알갱이다.","box":[1360,170,300,220],"src":["s34p01#3"],"cards":["M1-7","S-PL-1"]},{"sid":"s6","obj":"어깨에 멘 긴 속 빈 관","fact":"관세포 → 화분관(정자를 만드는 쪽이 아니다)","hook":"관 = 관세포","say":"긴 속 빈 관을 어깨에 멘 몸은 관세포다. 나중에 화분관을 만드는 역할을 물건의 이름 그대로 나타냈다. 정자를 만드는 세포와 구분하자.","box":[1060,170,160,180],"src":["s34p01#4"],"cards":["P0-9#3","P0-9#4","X-PL-3"]},{"sid":"s7","obj":"위층 맨 오른쪽 — 얼굴도 옷도 똑같은 붉은 조끼의 작은 둘","fact":"생식세포가 수분 뒤 체세포분열 → 정자 2개(하나가 갈라져 똑같다)","hook":"똑같은 붉은 둘 = 정자","say":"위층 맨 오른쪽에는 얼굴과 붉은 조끼가 똑같은 작은 사람 둘이 있다. 큰 사람의 분신이 아니라, 외투를 입은 생식세포가 나뉘어 생긴 정자 둘이다. 수분 뒤 생식세포가 체세포분열해 두 정자를 만든다. 한 세포에서 나왔기 때문에 같은 모습이다. 화분관을 만드는 쪽이 아니라는 점도 구분하자. 이 덱에서 붉은 옷은 정자의 공통 단서다.","box":[1740,230,280,320],"src":["s34p01#5"],"cards":["P0-9#1","P0-9#2","X-PL-4","P0-9"]},{"sid":"s8","obj":"아래층 — 아치를 두 겹으로 두른 돌벽 · 왼쪽에 난 좁은 문 하나","fact":"주피 2겹(→ 종피) · 주공(작은 문) — 문 하나뿐인 것이 이 방의 좌표축","hook":"두 겹 벽 = 주피 · 좁은 문 = 주공","say":"아래층의 돌벽 방은 아치가 두 겹이고 왼쪽에 좁은 문이 하나 있다. 밑씨를 감싼 주피 두 겹은 나중에 종피가 된다. 그 사이의 작은 문이 주공이며, 주피 안쪽 조직은 대포자낭이다. 밑씨는 대포자낭, 대포자, 주피를 합친 구조다. 이 하나뿐인 문을 기준으로 방 안의 위치를 읽자. 기출에서는 거의 대부분 어느 쪽에 있는지를 묻기 때문에 위치 구분이 중요하다.","box":[[0,560,2048,584],[560,720,180,380]],"src":["s34p02#0"],"cards":["P0-2","M1-5"]},{"sid":"s9","obj":"아래층 왼쪽 끝의 대포 넷 — 셋은 검게 타 부서져 쌓였고 하나만 온전히 서 있다","fact":"대포자모세포(2n) → 대포자 4 · 1개만 생존 · 체세포분열 3회(세포질분열 없음) → 8핵 7세포 배낭","hook":"대포 = 대포자 · 셋 탐 하나 삶","say":"아래층 왼쪽 끝의 대포 넷 중 셋은 검게 타서 무너졌고 하나만 온전하다. 대포자모세포가 감수분열해 대포자 넷을 만들지만, 보통 하나만 생존하고 셋은 퇴화한다. 소포자가 넷 모두 살아남는 위층과 비교하자. 대포는 대포자라는 이름의 단서다. 살아남은 하나가 세포질분열 없이 체세포분열을 세 번 하면 한 세포 안에 핵 여덟이 생긴다. 이후 막이 형성되어 핵 여덟, 세포 일곱인 배낭이 된다. 배낭은 암배우체다.","box":[40,760,520,384],"src":["s34p02#1"],"cards":["P0-3","M1-5","M1-4#2","M1-4","X-PL-12","S-PL-4","P0-4","P0-4#1","M1-4#3","M1-14#2"]},{"sid":"s10","obj":"문 바로 안쪽 — 걸상에 앉은 청록 옷 하나를 양옆 회색 옷 둘이 무릎 꿇고 떠받든다(쟁반 · 문 쪽 손짓)","fact":"주공 쪽 난세포 1 + 조세포 2 — 조세포가 화분관을 문 쪽으로 유인 · 청록 = 난세포","hook":"도울 조 = 무릎 꿇은 둘 · 청록 = 난세포","say":"문 바로 안쪽에서 걸상에 앉은 청록 옷의 사람을 양옆의 회색 옷 둘이 무릎 꿇고 떠받든다. 하나는 쟁반을 받쳐 들고, 하나는 팔을 뻗어 문 쪽 길을 가리킨다. 주공 쪽의 난세포 하나와 조세포 둘이다. 무릎을 꿇고 시중드는 둘은 도울 조 자의 조세포이며, 문을 가리키는 손처럼 화분관을 유인한다. 앉아 있는 청록 옷의 사람 하나가 난세포다. 이 방의 청록 옷은 그 하나뿐이고, 조세포와 반족세포는 회색이라는 색 구분도 확인하자.","box":[600,780,480,340],"src":["s34p02#2"],"cards":["P0-7","X-PL-5","M1-19"]},{"sid":"s11","obj":"방 가운데 큰 바구니 하나에 나란히 앉은 겨자색 옷 둘","fact":"중앙세포 하나에 극핵 둘 — 8핵인데 7세포인 까닭 · 배젖 3n의 까닭","hook":"한 바구니에 겨자색 둘 = 극핵 둘","say":"방 중앙의 큰 바구니 하나에 겨자색 옷 둘이 나란히 앉았다. 중앙세포는 하나지만 그 안에 극핵이 둘 있다는 뜻이다. 핵은 여덟인데 세포는 일곱인 이유가 이 바구니다. 처음 한 세포 안에 핵 여덟이 생긴 뒤 막이 나뉠 때, 이 두 핵만 같은 칸에 남는다. 배젖이 삼 엔이 되는 것도 정자 엔에 극핵 엔 두 개가 더해지기 때문이다. 겨자색은 극핵의 단서다. 아직 수정 전이므로 이 방에는 붉은 옷의 정자가 없다.","box":[1120,800,340,320],"src":["s34p02#3"],"cards":["P0-6","X-PL-6","M1-19","P0-5","X-PL-2","S-PL-2","P0-4#2"]},{"sid":"s12","obj":"문에서 가장 먼 벽에 등을 붙이고 앉은 회색 옷 셋 — 통나무 위 둘 · 끝에 하나 · 맨발","fact":"반족세포 3 — 주공 반대편 · 기능 미상 · 수정에 참여 안 함","hook":"문 반대편 = 반족","say":"문에서 가장 먼 벽에 회색 옷 셋이 등을 기대고 있다. 둘은 통나무 위, 하나는 통나무 끝에 있으며 모두 맨발이다. 주공 반대쪽의 반족세포 셋이다. 둘이 같은 통나무에 앉았다고 한 세포로 세지 말자. 각각 세포 하나이며, 셋 모두 같은 종류다. 기능은 미상이고 수정에 참여하지 않는다. 반족이라는 이름은 주공의 정반대 끝이라는 위치에 연결하자.","box":[1500,790,540,340],"src":["s34p02#4"],"cards":["X-PL-5","M1-19"]},{"sid":"s13","obj":"위층 오른쪽 뒷벽에 걸린 커다란 꽃 단면 — 맨 바깥 아래의 초록 꽃받침 · 그 안쪽의 큰 분홍 꽃잎 · 노란 두 주머니 꽃밥이 달린 긴 수술 여섯 · 한가운데의 초록 호리병 꼴 암술(오톨도톨한 머리 · 긴 목 · 둥글게 부푼 아래)","fact":"속씨식물 꽃의 4기관(밖 → 안) = 꽃받침(악편) → 꽃잎(화판) → 수술(꽃밥+수술대) → 심피(암술)","hook":"밖에서 안으로 초록 받침 → 분홍 꽃잎 → 노란 수술 → 한가운데 초록 호리병(심피)","say":"위층 오른쪽 뒷벽의 큰 꽃 단면은 이 공방이 꽃의 어디에 있는지 보여 준다. 속씨식물의 꽃은 변형된 잎이 네 겹의 고리로 배열된 기관이다. 바깥에서 안으로 읽어 보자. 가장 바깥 아래에서 받치는 초록 잎은 꽃받침이며 낱개는 악편이다. 안쪽의 화려한 분홍 잎은 꽃잎인 화판으로, 꽃가루 매개자를 부른다. 그 안쪽에서 노란 주머니 둘을 단 긴 줄들은 수술이다. 줄은 수술대, 끝의 주머니는 위층 작업대에 해당하는 꽃밥이다. 한가운데 초록 호리병 모양은 암술인 심피다. 화분을 받는 오톨도톨한 꼭대기는 암술머리, 긴 목은 암술대, 아래의 둥글게 부푼 부분은 아래층 배낭 방을 품은 씨방이다. 꽃받침, 꽃잎, 수술, 심피의 순서다.","box":[[1708,5,284,228]],"cards":["P0-1","M1-16"]}],"cq":{"P0-8#1":["화분립(수배우체) 형성 과정은?","소포자모세포(2n) 감수분열"],"S-PL-3":["수술에서 정자까지의 계보를 한 줄로?","소포자모세포(2n)→소포자(n)→화분립→생식세포→정자 2개"],"M1-17":["수술(stamen)의 구조와 기능은?","소포자엽 · 꽃밥(anther)의 소포자낭에서 소포자→화분(정자 2개 생식세포 + 화분관 관세포)"],"X-PL-11":["소포자엽과 대포자엽에 해당하는 꽃 기관은 각각?","소포자엽=수술 / 대포자엽=심피"],"P0-8#2":["화분립(수배우체) 형성 과정은?","소포자 4개, 각 소포자 체세포분열"],"M1-4#5":["이형포자에서 대포자·소포자가 되는 것은?","소포자(다수)"],"M1-4":["이형포자에서 대포자·소포자가 되는 것은?","대포자낭→대포자(1개)→암배우체 · 소포자낭→소포자(다수)→수배우체"],"X-PL-12":["이형포자에서 1개만 남는 쪽은 대포자인가 소포자인가?","대포자 1개(→암배우체) / 소포자는 다수(→수배우체)"],"D0-109":["감수분열 최종 결과로 형성되는 딸세포 수는?","4개"],"P0-8#3":["화분립(수배우체) 형성 과정은?","2세포(생식세포+관세포)"],"M1-7":["화분(pollen grain)이란?","소포자가 발달한 수배우체(스포로폴레닌 벽 보호, 바람·동물 운반)"],"M1-4#6":["이형포자에서 대포자·소포자가 되는 것은?","수배우체"],"P0-8":["화분립(수배우체) 형성 과정은?","소포자모세포(2n) 감수분열→소포자 4개, 각 소포자 체세포분열→2세포(생식세포+관세포)"],"X-PL-2":["8핵 7세포인 것과 2세포인 것은 각각 무엇인가?","배낭(암배우체)=8핵 7세포 / 화분립(수배우체)=2세포"],"S-PL-2":["속씨식물의 수배우체와 암배우체는 각각 무엇인가?","수배우체=화분립(화분) / 암배우체=배낭"],"S-PL-1":["속씨식물 생식에서 n·2n·3n인 구조를 각각 쓰면?","n=포자·배우체(화분립·배낭) / 2n=포자체·배·종피 / 3n=배젖"],"P0-9#3":["화분립의 두 세포와 각 운명은?","관세포"],"P0-9#4":["화분립의 두 세포와 각 운명은?","화분관"],"X-PL-3":["화분관을 만드는 세포는?","관세포 (← 생식세포와 혼동 주의)"],"P0-9#1":["화분립의 두 세포와 각 운명은?","생식세포"],"P0-9#2":["화분립의 두 세포와 각 운명은?","정자 2개"],"X-PL-4":["체세포분열로 정자 2개를 만드는 세포는?","생식세포 (← 관세포는 화분관을 만듦)"],"P0-9":["화분립의 두 세포와 각 운명은?","생식세포→체세포분열→정자 2개 · 관세포→화분관"],"P0-2":["밑씨(ovule)를 감싸는 것과 틈은?","주피 2겹(→종피)이 감싸며 주공(micropyle)이라는 틈"],"M1-5":["밑씨(ovule)의 구성은?","대포자낭 + 대포자 + 주피(integument)"],"P0-3":["배낭 형성 시작 세포와 감수분열 결과는?","대포자모세포(2n) 감수분열→대포자 4개, 보통 1개만 생존(3개 퇴화)"],"M1-4#2":["이형포자에서 대포자·소포자가 되는 것은?","대포자(1개)"],"S-PL-4":["밑씨에서 배낭까지의 계보를 한 줄로?","대포자모세포(2n)→대포자 4개(1개만 생존)→체세포분열 3회→배낭"],"P0-4":["생존한 대포자가 배낭이 되는 과정은?","체세포분열 3회(세포질분열 없음)→8개 핵을 가진 1세포→막으로 나뉘어 배낭"],"P0-4#1":["생존한 대포자가 배낭이 되는 과정은?","체세포분열 3회(세포질분열 없음)"],"M1-4#3": function capHTML(st, k) {

  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact), st.sid);
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate,
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
