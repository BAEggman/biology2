const L = {"id":"L01c","scene":"s01","part":"c","title":"바이러스 항구 V · VI 번 부두 — 뒤집힌 배 · 거꾸로 댄 배: 볼티모어 V · VI 군","sub":"뒤집힌 배(−)RNA · 크레인 멘 젖은 선원(싣고 온 RdRp) · 궤짝 여덟 + 오르골 + 점액(인플루엔자 8 분절 · 재편성 · 오르토믹소) · 짖는 개 + 랍스터(광견병 · 랍도) · 반점 담요 + 파라솔(홍역 · 파라믹소) · 흙탕 강 + 풀린 필름(에볼라 · 필로) · 거꾸로 댄 배(레트로) · 리본 → 밧줄 작업대(역전사) · 콘크리트에 묻힌 밧줄 + 풀 덮인 옛 자국(프로바이러스 · 영구) · 닫힌 셔터(세 걸음)","img":"img/L01c.webp","w":2048,"h":1144,"stops":[{"obj":"같은 바이러스 항구 · 같은 크림빛 창고 — 왼쪽 문은 열려 두루마리가 보이고 오른쪽 문은 닫힌 회색 셔터 · 왼쪽 부두는 문 앞에서 넓어지는 돌판 한 장 · 오른쪽 부두는 돌판 세 장 · 두 부두 사이엔 물길 (틀)","fact":"V 군 = mRNA 까지 한 걸음 · VI 군 = 세 걸음","hook":"돌판 한 장 = 한 걸음 · 돌판 세 장 = 세 걸음","say":"바이러스 항구의 마지막 두 부두, V 번과 VI 번이다. 같은 크림빛 창고, 왼쪽 문은 열려 흰 종이 두루마리가 보인다. mRNA 다. 오른쪽 문은 회색 셔터로 닫혀 있다. 왼쪽 V 번 부두는 돌판 한 장, 한 걸음이다. 오른쪽 VI 번 부두는 돌판 세 장, 세 걸음이다. 배를 매는 줄은 다시 흰 종이 리본, RNA 바이러스들이다.","box":null,"src":["s01p01#1"],"cards":["S-BT-2"]},{"obj":"왼쪽 — 용골을 위로 하고 완전히 뒤집혀 뜬 배 · 외겹 흰 리본으로 부두 쇠말뚝에 매였다","fact":"V 군 (−)ssRNA — 방향이 거꾸로 · mRNA 의 상보 가닥이라 먼저 (+)가닥을 만든다","hook":"뒤집힌 배 = (−)가닥","say":"왼쪽에는 배가 완전히 뒤집혀 용골을 위로 하고 떠 있다. 외겹 흰 종이 리본으로 쇠말뚝에 매였다. 단일가닥 RNA 인데 거꾸로 뒤집혔다. V 군, 마이너스 가닥 RNA 바이러스다. 유전체가 mRNA 의 상보 가닥이라 그대로는 번역이 안 된다. 먼저 플러스 가닥을 만들어야 mRNA 가 된다. 유전체가 곧 mRNA 인 IV 군과 정반대다.","box":[[100,515,370,370]],"src":["s01p04#0","s01p01#3"],"cards":["I0-45#1","X-BT-14"]},{"obj":"뒤집힌 배에서 기어 올라온 물에 젖은 선원이 작은 쇠 크레인(갈고리 달린 팔)을 어깨에 메고 섰다","fact":"숙주에 없는 RNA 의존 RNA 중합효소를 입자에 싣고 들어온다","hook":"젖은 선원이 멘 크레인 = 싣고 온 RdRp","say":"뒤집힌 배에서 기어 올라온 선원이 물에 흠뻑 젖은 채 작은 쇠 크레인을 어깨에 메고 섰다. 항구에는 여전히 붙박이 크레인이 없다. 마이너스 가닥 바이러스는 들어가자마자 플러스 가닥을 만들어야 하는데, 숙주에는 그 효소, RNA 의존 RNA 중합효소가 없다. 그래서 입자 안에 제 중합효소를 싣고 들어온다.","box":[[380,370,240,300]],"src":["s01p04#1"],"cards":["I0-45","I0-39","I0-38"]},{"obj":"부두의 나무 화물판 둘 — 판마다 궤짝 넷(모두 여덟) · 한 판 가장자리로 끈적한 초록 점액이 흘러내린다 · 판 곁 바닥에 뚜껑 열린 오르골(태엽 손잡이 · 음표)","fact":"인플루엔자 — 8 분절 (−)RNA · 분절째 뒤섞이는 재편성(대변이) · 오르토믹소","hook":"궤짝 여덟 = 8 분절 · 오르골 + 점액 = 오르토믹소","say":"부두에 나무 화물판 둘이 놓였다. 판마다 궤짝 넷, 모두 여덟이다. 인플루엔자 바이러스의 유전체는 여덟 조각으로 나뉜 마이너스 RNA 다. 각 조각에 바이러스 중합효소가 붙어 있다. 조각으로 나뉘어 있으니 두 균주가 한 세포에 함께 감염하면 조각째 뒤섞인다. 유전적 재편성, 대변이이고, 새 대유행 균주가 이렇게 생긴다. 판 곁 바닥에는 뚜껑 열린 오르골, 판 가장자리로는 끈적한 점액이 흘러내린다. 오르, 그리고 점액은 믹소. 오르토믹소바이러스다.","box":[[600,465,450,290]],"src":["s01p04#2"],"cards":["I0-17","I0-47#1","I0-68"]},{"obj":"바닥에 놓인 랍스터 한 마리를 보고 짖는 개","fact":"광견병 바이러스(랍도) — V 군","hook":"짖는 개 = 광견병 · 랍스터 = 랍도","say":"그 앞에서 개 한 마리가 바닥의 랍스터를 보고 왕왕 짖는다. 짖는 개는 광견병, 랍스터는 랍도. 광견병 바이러스는 랍도바이러스다. 역시 V 군이다.","box":[[785,735,215,135]],"src":["s01p04#3"],"cards":["I0-45#2"]},{"obj":"붉은 반점투성이 흰 담요를 두르고 파라솔을 편 사람 · 담요 귀퉁이에 묻은 끈적한 점액이 가닥으로 늘어져 부두 끝에 고였다","fact":"홍역 바이러스(파라믹소) — V 군 · 볼거리도 파라믹소","hook":"붉은 반점 = 홍역 · 파라솔 + 점액 = 파라믹소","say":"곁에는 붉은 반점투성이 흰 담요를 두른 사람이 파라솔을 펴 들고 섰다. 붉은 반점은 홍역이다. 파라솔의 파라, 그리고 담요 귀퉁이의 끈적한 점액이 믹소. 홍역 바이러스는 파라믹소바이러스다. 볼거리도 같은 무리다. 이 항구에서 점액은 이 담요와 화물판 두 자리에만 묻어 있다. 오르토믹소와 파라믹소, 믹소는 둘뿐이다.","box":[[995,590,185,320]],"src":["s01p04#4"],"cards":[]},{"obj":"왼쪽 위 항구로 흘러드는 흙탕 강물(물결무늬) — 그 위에 필름 한 롤이 실처럼 길게 풀려 떠내려간다","fact":"에볼라 바이러스(필로 = 실) — 콩고 에볼라강 · V 군","hook":"흙탕 강 = 에볼라강 · 실처럼 풀린 필름 = 필로","say":"왼쪽 위에서 흙탕 강물이 항구로 흘러든다. 그 위에 필름 한 롤이 실처럼 길게 풀려 떠내려간다. 에볼라는 처음 찾은 곳 곁의 강, 콩고의 에볼라강 이름이다. 흙탕 강물이 곧 이름이다. 그리고 실처럼 풀린 필름, 필로. 실 모양 바이러스, 필로바이러스다. V 군 마이너스 가닥 RNA 바이러스, 넷이 다 모였다. 인플루엔자, 광견병, 홍역, 에볼라.","box":[[20,90,320,240]],"src":["s01p04#5"],"cards":[]},{"obj":"오른쪽 — 이 배만 뒤꽁무니를 부두에 대고 뱃머리가 바다 쪽을 향했다 · 뱃머리 끝의 흰 리본이 부두가 아니라 바다 속 말뚝에 매였다","fact":"VI 군 레트로(retro = 거꾸로) — 정보가 RNA → DNA 로 거꾸로 흐른다","hook":"거꾸로 댄 배 · 바다 쪽 말뚝 = 레트로","say":"오른쪽 배를 보자. 다른 배들은 부두의 쇠말뚝에 매였는데, 이 배만 뒤꽁무니를 부두에 대고 뱃머리는 바다 쪽을 향했다. 뱃머리 끝의 흰 종이 리본은 바다 속 말뚝에 매였다. 거꾸로다. 레트로, 거꾸로라는 뜻이다. VI 군 레트로바이러스는 정보가 거꾸로 흐른다. DNA 에서 RNA 가 아니라, RNA 에서 DNA 로. HIV 와 HTLV-1 이 여기다.","box":[[1470,830,200,314]],"src":["s01p05#0","s01p01#4"],"cards":["I0-48","I0-50","I0-46","I0-47#2","X-BT-17"]},{"obj":"오른쪽 부두 첫 돌판의 작업대 — 흰 종이 리본이 왼쪽 끝으로 들어가 굵은 금빛 꼰 밧줄로 오른쪽에 나와 사려졌다","fact":"역전사효소 — RNA 를 주형으로 DNA 를 만든다","hook":"종이 리본 들어가 밧줄로 나옴 = 역전사","say":"배에서 오른 첫 돌판에는 작업대가 있다. 흰 종이 리본이 왼쪽 끝으로 들어가고, 오른쪽 끝으로는 굵은 금빛 꼰 밧줄이 나와 사려졌다. 종이는 RNA, 밧줄은 DNA 다. RNA 를 주형으로 DNA 를 만드는 효소, 역전사효소다. 레트로바이러스의 핵심 효소이고, I · II 번 부두의 작업대와 견주면 방향이 거꾸로다.","box":[[1390,720,400,140]],"src":["s01p05#0"],"cards":["I0-48","I0-50"]},{"obj":"둘째 돌판 — 두 인부가 그 밧줄 뭉치를 젖은 시멘트 네모 칸에 눌러 반쯤 묻었다(곁에 흙손) · 같은 돌판 위 곁에 풀이 뒤덮은 옛 시멘트 자국","fact":"프로바이러스 — 숙주 유전체에 삽입돼 영구히 떠나지 않는다(↔ 프로파지는 빠져나옴)","hook":"콘크리트에 묻힌 밧줄 = 프로바이러스 · 풀 덮인 옛 자국 = 영구","say":"둘째 돌판에서는 두 인부가 그 밧줄 뭉치를 젖은 콘크리트에 꾹꾹 눌러 묻는다. 만들어진 DNA 가 숙주 염색체에 끼어 들어간 것, 프로바이러스다. 그 곁에는 풀이 온통 뒤덮은 옛 시멘트 자국이 있다. 한번 묻히면 다시는 파내지 않는다. 프로바이러스는 숙주 유전체를 영구히 떠나지 않는다. 용원성 파지의 프로파지는 용균 회로가 시작되면 염색체를 빠져나오는 것과 다르다.","box":[[1410,490,560,180]],"src":["s01p05#1","s01p05#2"],"cards":["I0-49","I0-51","I0-51#1","I0-51#2"]},{"obj":"오른쪽 창고 문은 회색 셔터로 닫혔다","fact":"레트로바이러스의 RNA 유전체는 mRNA 로 바로 쓰이지 않는다","hook":"닫힌 셔터 = mRNA 로 바로 안 감","say":"오른쪽 창고 문은 닫힌 셔터다. 레트로바이러스의 RNA 유전체는 플러스 가닥이지만 mRNA 로 바로 번역되지 않는다. 역전사해서 DNA 를 만들고, 숙주 염색체에 끼어 들어간 뒤, 그 DNA 에서 전사되어야 mRNA 가 나온다. 역전사, 삽입, 전사. 그래서 세 걸음이다.","box":[[1400,120,250,210]],"src":["s01p05#3"],"cards":[]},{"obj":"두 부두 견주기 (되짚기) — 뒤집힌 배 · 크레인 멘 선장 · 돌판 한 장 / 거꾸로 댄 배 · 작업대 · 콘크리트 · 닫힌 셔터 · 돌판 세 장","fact":"V = (−)RNA · 제 RdRp · 한 걸음 / VI = 역전사 → 삽입 → 전사 · 세 걸음","hook":"뒤집힘 한 장 · 거꾸로 세 장","say":"두 부두를 견주자. 왼쪽 V 번, 뒤집힌 배에서 크레인을 멘 선원이 돌판 한 장을 건넌다. 마이너스 가닥 RNA, 제 RdRp, 한 걸음. 오른쪽 VI 번, 거꾸로 댄 배에서 작업대, 콘크리트를 지나 닫힌 셔터까지 돌판 세 장. 역전사, 삽입, 전사, 세 걸음. 인플루엔자는 V 군 분절형 마이너스 RNA, HIV 는 VI 군 레트로다.","box":[[310,330,780,580],[1350,330,450,550]],"src":["s01p01#1"],"cards":["S-BT-2"]}],"hubPanel":"s01p01"};
const $ = id => document.getElementById(id);
$('title').textContent = L.title; $('sub').textContent = L.sub || ''; document.title = L.title;
$('img').src = L.img; $('img').alt = L.title;
if (L.home) $('home').href = L.home;  // 한 파일(standalone)은 저장소 밖에서 열리므로 배포 주소로
if (L.hub) $('hub').href = L.hub; else if (L.hubPanel) $('hub').href = '../sketchy.html#' + L.hubPanel;
const ov = $('ov'); ov.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
let mode = 'tour', i = -1, playing = false, voice = true, rate = 1.0, quizOrder = [], quizPos = 0, quizRevealed = false;
const stops = L.stops;
const scoreKey = 'lesson_' + L.id;
let score = {}; try { score = JSON.parse(localStorage.getItem(scoreKey) || '{}'); } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    stops.forEach((st, k) => { if (st.box) s += rect(st.box, 'hot', ` data-k="${k}"`); });
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact));
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
let speakSeq = 0;
function speak(t) {
  const my = ++speakSeq, at = i;
  const advance = (ms) => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, ms);
  if (!('speechSynthesis' in window)) { if (playing) advance(3500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = () => { if (started) advance(700); };
  u.onerror = () => { if (!started) advance(3000); };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started && my === speakSeq) { speechSynthesis.cancel(); advance(3000); } }, 2500);  // 목소리가 없으면 글만 3초
}
function go(k) {
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) setTimeout(() => { if (playing) next(); }, 3500);
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; speechSynthesis && speechSynthesis.cancel(); $('bPlay').textContent = '▶ 시작';
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') { $('bQuiz').classList.add('on'); quizOrder = stops.map((_, k) => k).filter(k => stops[k].box); quizPos = 0; quizAsk(); }
  showScore();
}
function quizAsk() {
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">이 물건은 무엇을 나르나?</div><div class="fact muted">떠올린 뒤 「답 보기」</div>`;
  $('judge').style.display = 'flex';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); }
function judge(ok) {
  const k = quizOrder[quizPos]; score[k] = score[k] || []; score[k].push({ t: Date.now(), ok });
  try { localStorage.setItem(scoreKey, JSON.stringify(score)); } catch (e) {}
  showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  const ks = Object.keys(score); if (!ks.length) { $('score').textContent = ''; return; }
  const last = ks.map(k => score[k][score[k].length - 1].ok); const ok = last.filter(Boolean).length;
  $('score').textContent = `마지막 시험 ${ok} / ${stops.length}`;
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i + 1); else speechSynthesis && speechSynthesis.cancel(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) speechSynthesis && speechSynthesis.cancel(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
</script>
</body>
</html>
