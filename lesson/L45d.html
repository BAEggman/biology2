<style>
  :root{--ink:#1b1b1f;--ink2:#4b4b55;--line:#e3e1da;--teal:#0f766e;--teal50:#ecfdf5;--gold:#b45309;--bg:#f7f5ef}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1100px;margin:0 auto;padding:12px 14px 40px}
  h1{font-size:18px;margin:6px 0 2px}
  .titlebar{display:flex;align-items:center;gap:10px}.titlebar h1{flex:1;min-width:0}
  .star{font-size:22px;line-height:1;padding:2px 10px;color:#8a8a94}.star[aria-pressed="true"]{color:var(--gold);border-color:#e8c48c;background:#fff8ec}
  .sub{font-size:12.5px;color:var(--ink2);margin:0 0 10px}
  .sub.hid{cursor:pointer;color:var(--ink3,#8a8a94);border:1px dashed #c9c6bd;border-radius:8px;padding:4px 8px;display:inline-block}
  .cq{font-size:12.5px;color:var(--ink2);margin-top:8px;border-top:1px dashed #d8d5cc;padding-top:6px}.cq summary{cursor:pointer}.cq li{margin:3px 0}.cq .a{color:var(--ink);font-weight:600}
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
  button{font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
  button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  button:disabled{opacity:.45;cursor:default}
  .stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .stage img{display:block;width:100%;height:auto}
  .stage svg{position:absolute;inset:0;width:100%;height:100%}
  .cap{margin-top:10px;min-height:76px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px}
  .cap .n{font-size:11.5px;color:var(--ink2)}
  .cap .obj{font-weight:700;font-size:15px;margin:2px 0}
  .cap .fact{font-size:14px;margin:2px 0}
  .cap .hook{font-size:13px;color:var(--gold);margin-top:4px}
  .cap.muted{color:var(--ink2);font-size:13px}
  .recap{margin-top:12px;display:none}
  .recap ol{padding-left:22px;margin:6px 0}
  .recap li{margin:4px 0;font-size:13.5px}
  .recap li b{color:var(--teal)}
  .score{font-size:13px;color:var(--ink2);margin-left:auto}
  .hint{font-size:12px;color:var(--ink2);margin-top:8px}
  .hole{fill:#000}
  .cur{fill:none;stroke:#f59e0b;stroke-width:6;stroke-dasharray:14 8}
  .hot{fill:transparent;cursor:pointer}
  .hot:hover{fill:rgba(245,158,11,.18)}
  .judge{display:none;gap:6px;margin-top:8px}
  .judge button{font-size:12.5px}
  .bar.opt{margin-top:-4px}.bar.opt[hidden]{display:none}
  .nav{display:flex;gap:12px;font-size:12.5px;margin:2px 0 0}
  .nav a{color:var(--teal);text-decoration:none}
  .nav a:hover{text-decoration:underline}
</style>
</head>

<script>
/* lesson_store.js — 과 목록 · 과 화면이 함께 쓰는 저장 도우미(보기 화면 명세 §1.1).
   빌드(build_lesson.js)가 두 화면에 그대로 끼워 넣는다(__STORE__) — 열쇠 이름 · 꼴이 한 군데서만 정해진다.
   열쇠: lesson_stars {ID: 찍은 때(ms)} · lesson_prefs {onlyStar, autoNext, rep, scope} · lesson_ab_<ID> {a: sid, b: sid}
   읽기 · 쓰기는 모두 try/catch — 저장이 막힌 브라우저에서는 그 쪽을 떠날 때까지만 기억하고 오류를 내지 않는다.
   (lesson_<ID> · lesson_shuffle · lesson_srs_inbox · lesson_auto_start 는 여기서 건드리지 않는다) */
const LStore = (() => {
  const mem = {};
  const rd = (k, d) => {
    let ok = false;
    try { const v = localStorage.getItem(k); ok = true; if (v !== null && v !== undefined) { const o = JSON.parse(v); mem[k] = o; return o; } } catch (e) {}
    if (ok) { delete mem[k]; return d; }   // 저장소는 멀쩡한데 값이 없다 = 다른 탭에서 지웠다 — 메모리 값도 버린다
    return k in mem ? mem[k] : d;
  };
  const wr = (k, o) => { mem[k] = o; try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) {} };
  const del = k => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} };
  const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
  const REP = ['off', 'ab', 'one', 'list'];
  return {
    stars() { const s = rd('lesson_stars', {}); return isObj(s) ? s : {}; },
    isStar(id) { return id in LStore.stars(); },
    setStar(id, on) {
      const s = { ...LStore.stars() };
      if (on) s[id] = Date.now(); else delete s[id];
      if (Object.keys(s).length) wr('lesson_stars', s); else del('lesson_stars');
      return on;
    },
    prefs() {
      const p = rd('lesson_prefs', {}); const o = isObj(p) ? p : {};
      return { onlyStar: !!o.onlyStar, autoNext: !!o.autoNext, rep: REP.includes(o.rep) ? o.rep : 'off', scope: o.scope === 'star' ? 'star' : 'all' };
    },
    setPrefs(patch) { const p = { ...LStore.prefs(), ...patch }; wr('lesson_prefs', p); return p; },
    ab(id) { const v = rd('lesson_ab_' + id, null); return isObj(v) ? { a: typeof v.a === 'string' ? v.a : null, b: typeof v.b === 'string' ? v.b : null } : { a: null, b: null }; },
    setAb(id, v) { const k = 'lesson_ab_' + id; if (v && (v.a || v.b)) wr(k, { a: v.a || null, b: v.b || null }); else del(k); },
    REP,
  };
})();

const L = {"id":"L45d","scene":"s45","part":"d","title":"탄소 공방 — 도는 작업대","sub":"캘빈 회로: 루비스코 · 고정(RuBP + CO₂) · 3-PGA 둘 · 환원(ATP → NADPH) · 빛반응이 대는 창 · 여섯 중 하나 나감(G3P) · 재생(RuBP 셋 · ATP)","img":"img/L45d.webp?v=db7d60fd56c9","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"깔개 위 작업장 — 막대가 한 바퀴 돈다","fact":"캘빈 회로 = 고정 · 환원 · 재생 세 단계 · 스트로마에서 · 한 바퀴 = CO₂ 하나","hook":"마디 하나 = 탄소 하나 · 깔개 = 스트로마","say":"회색 깔개인 스트로마 위의 탄소 공방이다. 마디 있는 막대가 작업대를 한 바퀴 돌며, 마디 하나가 탄소 하나를 뜻한다. 캘빈-벤슨 회로라고도 부르는 캘빈 회로는 고정·환원·재생의 세 단계로 이루어지고, 한 바퀴마다 이산화탄소 하나를 고정한다.","box":null,"src":["s45u01#0"],"cards":["C0-153","C0-245"]},{"sid":"s2","obj":"놋쇠 기둥 위 루비빛 렌즈 스코프 — 렌즈 둘레 발톱 둘","fact":"루비스코 — CO₂를 붙이는 효소 · 지구에서 가장 흔한 단백질","hook":"루비빛 스코프 = 루비스코","say":"작업대 왼쪽 끝의 놋쇠 기둥 위에 루비빛 앞 렌즈를 가진 스코프가 있다. 루비와 스코프를 연결해 루비스코를 떠올리자. 이 회로에서 이산화탄소를 붙이는 효소다. 광합성 생물에 매우 많아 지구에서 가장 흔한 단백질로 꼽힌다.","box":[100,220,360,300],"src":["s45u01#1"],"cards":["C0-156","C0-157","C0-158"]},{"sid":"s3","obj":"발톱이 어두운 방울을 마디 다섯 긴 막대 끝에 눌러 붙인다 · 방울 둘이 차례를 기다린다","fact":"탄소고정 — CO₂ 수용체 = RuBP(5탄) · 한 바퀴에 CO₂ 하나 · G3P 하나 내려면 세 바퀴","hook":"어두운 방울 = CO₂ · 마디 다섯 = RuBP","say":"스코프의 발톱이 어두운 방울 하나를 마디 다섯인 긴 막대 끝에 눌러 붙인다. 방울은 이산화탄소, 막대는 오탄당 알유비피인 리불로오스 1,5-이인산이다. 볼록한 부분이 아니라 그 사이의 곧은 칸을 탄소 마디로 세자. 알유비피가 이산화탄소 수용체다. 위에서 기다리는 방울 둘도 보자. 한 바퀴에 하나씩 고정하므로 지쓰리피 하나를 내보내려면 세 바퀴가 필요하다.","box":[[300,225,530,315]],"src":["s45u01#2"],"cards":["C0-154","C0-9","C0-19","C0-155"]},{"sid":"s4","obj":"방금 부러진 마디 셋 토막 둘 — 한쪽 끝 마디만 방울빛","fact":"6탄 중간체는 불안정 → 3탄 둘(3-PGA) · 첫 안정 산물이 3탄 = C₃ 식물","hook":"다섯 + 방울 하나 = 셋 + 셋","say":"작업대에 막 부러진 마디 셋짜리 토막 둘이 있다. 부러진 톱니가 서로 맞고, 오른쪽 토막 끝의 한 마디만 방울과 같은 색이다. 탄소 다섯에 이산화탄소 하나가 붙어 여섯이 되지만, 불안정한 육탄 중간체는 곧 삼탄 분자 둘로 나뉜다. 삼 피지에이다. 첫 안정 산물이 삼탄 분자라서 씨쓰리 식물이라고 부른다. 벼·밀·대두가 대표적인 씨쓰리 작물이다.","box":[1000,460,520,160],"src":["s45u01#3"],"cards":["C0-159","C0-185","C0-182#1","C0-186"]},{"sid":"s5","obj":"토막마다 금화 하나 반쯤 박힘 · 오른 토막은 장인이 방패로 누르자 반짝","fact":"환원 — 3-PGA +ATP→ 1,3-BPG +NADPH→ G3P · 금화 먼저, 방패 다음(한 곳뿐)","hook":"금화 = ATP · 방패 = NADPH · 반짝 = 환원된 G3P","say":"토막마다 반쯤 박힌 금화는 에이티피다. 오른쪽 토막은 장인이 큰 둥근 방패를 기울여 테로 꾹 누르자 반짝인다. 방패는 엔에이디피에이치다. 두 단계의 순서를 기억하자. 삼 피지에이가 먼저 에이티피를 사용해 일 삼 비스포스포글리세르산이 되고, 이어 엔에이디피에이치의 환원력을 받아 지쓰리피가 된다. 금화가 먼저, 방패가 다음이다. 회로에서 방패를 쓰는 곳은 이 환원 단계뿐이다. 삼탄 분자 여섯에 하나씩 필요하므로 이산화탄소 셋당 엔에이디피에이치 여섯을 사용한다.","box":[1000,420,520,220],"src":["s45u01#4"],"cards":["C0-161","C0-173#1","C0-162","C0-174","C0-175","C0-182#2","C0-168"]},{"sid":"s6","obj":"장인 뒤 맨 창 — 창턱의 금화 바구니와 방패 둘 · 햇살","fact":"ATP · NADPH는 빛반응이 댄다(창으로) — 「암반응」은 오해 · ADP · NADP⁺가 되돌아간다","hook":"공방 안에서 만들지 않고 창으로 들여온다","say":"장인 뒤의 유리 없는 창으로 햇빛이 들어온다. 창턱의 금화 바구니와 방패 둘을 보자. 에이티피와 엔에이디피에이치는 이 공방에서 만드는 것이 아니라 빛반응에서 공급받는다. 이산화탄소 고정 회로가 빛을 직접 쓰지 않는다고 빛과 무관한 것은 아니다. ‘암반응’이라는 옛 이름 때문에 밤에 일어나는 것으로 오해하지 말자. 필요한 에너지를 명반응에서 만들어 주므로 실제로는 낮에 진행된다. 사용한 만큼 에이디피와 엔에이디피가 되어 다시 바깥으로 돌아간다.","box":[760,40,480,420],"src":["s45u01#5"],"cards":["C0-176","C0-184","A0-108"]},{"sid":"s7","obj":"오른끝 여섯 칸 꽂이 — 반짝이는 짧은 막대 다섯 · 왼 칸 비었다","fact":"CO₂ 셋 → 3탄 여섯(G3P) — 칸 수가 여섯","hook":"칸 여섯 = 3탄 여섯","say":"작업대 오른쪽 끝의 나무 꽂이에는 자리가 여섯이다. 반짝이는 짧은 막대 다섯이 꽂혀 있고 맨 왼쪽만 비어 있다. 이산화탄소 셋을 받아 삼탄 분자 여섯이 생긴다는 수를 꽂이에서 확인하자. 반짝이는 막대는 환원된 지쓰리피다.","box":[1560,230,340,330],"src":["s45u01#6"],"cards":["C0-160","C0-183"]},{"sid":"s8","obj":"빈 칸의 미끄럼틀로 막대 하나만 나가 벽 구멍으로","fact":"순생성 G3P 하나(여섯 중 하나) · 포도당 = G3P 둘 = CO₂ 6·ATP 18·NADPH 12","hook":"칸은 여섯 · 나가는 길은 하나","say":"빈 칸에서 비스듬히 내려오는 미끄럼틀로 막대 하나만 벽 아래 구멍을 빠져나간다. 여섯 지쓰리피 중 순생성물로 나가는 것은 하나뿐이다. 마디 셋인 이 막대도 해당과정 당구장의 각뿔처럼 삼탄소라는 점을 나타낸다. 장면마다 모양은 다르다. 광합성의 직접 산물은 포도당이 아니라 지쓰리피이며, 지쓰리피 둘로 포도당을 조립한다. 포도당 하나에 필요한 양은 이산화탄소 여섯, 에이티피 열여덟, 엔에이디피에이치 열둘이다. 밖으로 나온 지쓰리피는 포도당과 다른 유기물의 전구체가 된다. 빛반응에서 나오는 산소는 배출되는 부산물이고, 유기물을 만드는 재료는 이 지쓰리피다.","box":[1680,560,368,420],"src":["s45u01#7"],"cards":["C0-163","C0-164","C0-20","C0-169","C0-170","C0-171","C0-179","C0-241"]},{"sid":"s9","obj":"짐꾼이 마디 다섯 긴 막대 셋을 메고 스코프 쪽으로 걷는다","fact":"재생 — 3탄 다섯(15) → 5탄 셋(15) = RuBP 셋 · 수용체를 매번 다시 만드니 회로","hook":"짧은 막대 다섯 = 긴 막대 셋(탄소 열다섯)","say":"짐꾼이 마디 다섯짜리 긴 막대 셋을 벌려 메고 스코프로 돌아간다. 재생 단계다. 남은 삼탄 막대 다섯의 탄소 열다섯을 다시 배열해, 탄소 다섯짜리 알유비피 셋으로 만든다. 탄소 수는 그대로 열다섯이다. 수용체 셋을 스코프에 돌려보내 다음 세 바퀴에서 이산화탄소 셋을 받게 한다. 수용체를 다시 만드는 과정 때문에 직선 경로가 아니라 회로다.","box":[220,620,800,460],"src":["s45u01#8"],"cards":["C0-165","C0-172","C0-180","C0-182#3"]},{"sid":"s10","obj":"긴 막대 셋의 끝마다 금화 하나","fact":"재생에도 ATP(RuBP 하나에 하나) → CO₂ 셋에 ATP 9(환원 6 + 재생 3)","hook":"막대 앞끝 금화 = 재생의 ATP","say":"짐꾼이 멘 긴 막대 셋의 앞끝에 금화가 하나씩 붙어 있다. 재생에도 에이티피가 필요하다는 단서다. 알유비피 하나를 재생할 때 인산 하나를 더 붙이는 데 사용한다. 따라서 이산화탄소 셋을 처리할 때 환원에서 여섯, 재생에서 셋을 합쳐 에이티피 아홉이 필요하다.","box":[220,640,800,220],"src":["s45u01#9"],"cards":["C0-166","C0-173#2","C0-173","C0-167"]},{"sid":"s11","obj":"작업장 전체 한 바퀴 — 스코프 → 토막 → 꽂이 → 짐꾼 → 스코프","fact":"세 단계 순환 · 빛이 없으면 멈춘다(ATP · NADPH 끊김) · 루비스코는 회로 자신의 효소","hook":"창이 닫히면 작업대가 선다","say":"공방을 한 번 더 따라가 보자. 스코프가 방울을 붙이고 막대가 둘로 갈라진다. 금화와 방패를 받아 반짝인 다음, 꽂이의 여섯 막대 중 하나가 나간다. 남은 다섯은 긴 막대 셋으로 재배열되어 짐꾼을 따라 스코프로 돌아온다. 고정·환원·재생의 순서다. 빛이 없어 창이 닫히면 금화와 방패의 공급이 끊겨 작업대도 멈춘다. 다만 루비스코는 창 밖에서 공급되는 것이 아니라 회로 자체의 효소다.","box":null,"src":["s45u01#0","s45u01#5"],"cards":["C0-153","C0-176","C0-184"]}],"cq":{"C0-153":["캘빈 회로의 3단계는?","탄소고정 · 환원 · RuBP 재생"],"C0-245":["캘빈 회로의 다른 이름은?","캘빈-벤슨 회로(Calvin-Benson cycle)"],"C0-156":["탄소고정 단계에서 CO2를 RuBP에 붙이는 효소는?","루비스코"],"C0-157":["루비스코(Rubisco)란?","RuBP에 CO2를 붙이는 캘빈 회로 효소"],"C0-158":["루비스코가 지구상에서 가장 풍부한 단백질로 언급되는 이유는?","광합성 생물에 매우 많이 존재하기 때문"],"C0-154":["캘빈 회로의 CO2 수용체는?","RuBP"],"C0-9":["캘빈 회로의 핵심 역할은?","CO2를 고정하고 환원해 G3P를 만드는 것"],"C0-19":["광합성에서 CO2를 유기물로 바꾸는 과정을 무엇이라 하는가?","탄소고정"],"C0-155":["RuBP의 풀네임은?","리불로오스-1,5-이인산"],"C0-159":["탄소고정 직후 생기는 불안정한 6탄소 중간체는 어떻게 되는가?","두 분자의 3-PGA로 쪼개진다"],"C0-185":["C3 식물이란?","첫 안정적 탄소고정 산물이 3-PGA인 식물"],"C0-182#1":["캘빈 회로 3단계와 각 핵심 산물을 연결하면?","탄소고정-3PGA"],"C0-186":["대표적 C3 작물 예시는?","벼, 밀, 대두"],"C0-161":["환원 단계에서 3-PGA가 먼저 ATP를 받아 되는 것은?","1,3-BPG"],"C0-173#1":["캘빈 회로에서 ATP가 쓰이는 두 단계는?","3-PGA → 1,3-BPG"],"C0-162":["그다음 NADPH의 환원력을 받아 생성되는 것은?","G3P"],"C0-174":["캘빈 회로에서 NADPH가 쓰이는 단계는?","1,3-BPG → G3P 환원 단계"],"C0-175":["캘빈 회로의 환원 단계에서 NADPH가 하는 일은?","전자(환원력)를 제공해 G3P를 만든다"],"C0-182#2":["캘빈 회로 3단계와 각 핵심 산물을 연결하면?","환원-G3P"],"C0-168":["3 CO2당 필요한 NADPH 수는?","6개"],"C0-176":["캘빈 회로의 ATP는 어디에서 공급되는가?","빛반응"],"C0-184":["캘빈 회로에서 ADP와 NADP+가 다시 생기는 이유는?","ATP와 NADPH가 소비되기 때문"],"A0-108":["암반응이 낮에도 일어나는 이유(노트 기준)?","암반응에 필요한 에너지를 명반응에서 만들기 때문"],"C0-160":["3 CO2가 들어오면 생성되는 3-PGA 수는?","6개"],"C0-183":["캘빈 회로에서 탄소 수를 따라가면 3 CO2 투입 후 어떤 흐름인가?","6개의 3탄소 분자 생성 후 1개 G3P 배출, 나머지 5개 재배열"],"C0-163":["캘빈 회로에서 직접 배출되는 당은?","G3P"],"C0-164":["3 CO2가 들어온 캘빈 회로에서 순생성 G3P는 몇 개인가?","1개"],"C0-20":["광합성의 직접 산물은 포도당인가 G3P인가?","G3P"],"C0-169":["포도당 1분자를 만들려면 캘빈 회로에 필요한 CO2는?","6개"],"C0-170":["포도당 1분자를 만들려면 필요한 ATP는?","18개"],"C0-171":["포도당 1분자를 만들려면 필요한 NADPH는?","12개"],"C0-179":["캘빈 회로의 직접 산물 G3P는 무엇의 전구체인가?","포도당 및 다른 유기물"],"C0-241":["광합성에서 O2와 G3P의 차이는?","O2는 부산물 · G3P는 유용한 유기물 전구체"],"C0-165":["나머지 5개의 G3P는 어디에 쓰이는가?","RuBP 재생"],"C0-172":["캘빈 회로가 '회로'인 이유는?","CO2 수용체 RuBP가 재생되기 때문"],"C0-180":["캘빈 회로에서 6분자의 3-PGA가 모두 최종 산물로 나가지 않는 이유는?","대부분이 RuBP 재생에 쓰이기 때문"],"C0-182#3":["캘빈 회로 3단계와 각 핵심 산물을 연결하면?","재생-RuBP"],"C0-166":["RuBP 재생 단계에서 ATP가 필요한 이유는?","G3P 탄소골격을 RuBP로 재배열·인산화하기 위해"],"C0-173#2":["캘빈 회로에서 ATP가 쓰이는 두 단계는?","RuBP 재생"],"C0-173":["캘빈 회로에서 ATP가 쓰이는 두 단계는?","3-PGA → 1,3-BPG · RuBP 재생"],"C0-167":["3 CO2당 필요한 ATP 수는?","9개"]},"hubPanel":"s45u01"};

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? (recapAt >= 0 ? recapAt : i) : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) + repTail() : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}

}

}

  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(startAt()); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour'); repPaint();
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(startAt()); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
