<script>
const L = {"id":"L25a","scene":"s25","part":"a","title":"네 줄 인쇄 마당 — 문턱의 문지기 · 우유병 · 돔 덮개 · 포도 그릇: lac 오페론","sub":"빨간 매트 · 나무 문턱 · 그림 타일 셋(프로모터 · 작동자 · 구조유전자) · 문턱에 버틴 문지기(활성 억제자) · 우유병 빠는 문지기(알로락토스 · 유도성) · 고리 건 돔 덮개와 용수철(cAMP-CRP · 양성 조절) · 빈 포도 그릇 곁 고리 더미(포도당 낮음 → cAMP 높음) · 네 줄 = 네 조건(꺼짐 · 꺼짐 · 조금 · 활짝 · 이화물질 억제)","img":"img/L25a.webp?v=e06cd7d10d51","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"담장 없는 인쇄 마당에 똑같은 회색 줄 넷이 뒤에서 앞으로 나란하다 — 줄마다 빨간 매트 위 바퀴 달린 인쇄 기계 → 나무 문턱 → 해 · 나무 · 집 타일 (틀)","fact":"lac 오페론 = 프로모터 · 작동자 · 구조유전자 셋 — 함께 한 mRNA 로 전사","hook":"빨간 매트 = 프로모터 · 문턱 = 작동자 · 그림 타일 셋 = 구조유전자","say":"담장 없는 인쇄 마당이다. 원핵세포의 마당, 공장 마당에서 본 그 세계다. 회색 줄 넷이 똑같이 생겨 뒤에서 앞으로 나란히 깔렸다. 줄마다 왼쪽 끝에 빨간 매트, 그 위에 바퀴 달린 인쇄 기계가 섰다. 기계는 RNA 중합효소다. 기계 바로 앞을 나무 문턱이 가로지르고, 그 너머에 해, 나무, 집 그림 타일 셋이 깔렸다. 빨간 매트가 프로모터, 문턱이 작동자, 그림 타일 셋이 구조유전자다. 이 셋이 한 묶음, lac 오페론이다. 기계가 타일 위를 지나가면 해 나무 집이 한 종이띠에 찍혀 나온다. 유전자 셋이 mRNA 하나로 함께 전사된다. 네 줄은 같은 오페론이 네 가지 조건에 놓인 모습이다.","box":null,"src":["s25p01#2"],"cards":["F1-22","F1-23","F1-38","F1-26","F1-37","F1-1#1"]},{"sid":"s2","obj":"맨 뒤 줄 — 대머리 문지기가 나무 문턱 위에 팔짱 끼고 버티고 앉았다 · 곁의 그릇엔 포도가 가득 · 기계는 매트에 그대로, 나오는 종이띠 없음","fact":"lac 억제자는 평소 활성 — 작동자에 붙어 전사를 막는다(젖당 없을 때)","hook":"문턱에 버티고 앉은 문지기 = 작동자에 붙은 억제자","say":"맨 뒤 줄을 보자. 검은 티셔츠의 대머리 문지기가 나무 문턱 위에 팔짱을 끼고 버티고 앉았다. 기계는 매트에서 한 발짝도 못 나가고, 나오는 종이띠도 없다. 이 문지기가 lac 억제자, 전사를 막는 조절 단백질이다. 젖당이 없으면 억제자는 활성 상태로 작동자에 붙어 RNA 중합효소의 길을 막는다. 그래서 거의 발현되지 않는다. 문턱, 곧 작동자가 오페론의 스위치 자리다.","box":[[900,90,190,245],[310,175,165,135]],"src":["s25p01#0"],"cards":["F1-16","F1-149","F1-3","F1-68","F1-21","F1-29"]},{"sid":"s3","obj":"앞 두 줄 — 문지기가 문턱을 떠나 줄 가장자리 풀밭에 앉아 눈을 감고 우유병을 빤다","fact":"알로락토스(유도자)가 억제자를 불활성화 → 작동자에서 떨어진다 · 유도성 오페론","hook":"우유병 받고 문턱을 떠난 문지기 = 유도자 · 불활성 억제자","say":"앞의 두 줄에서는 문지기가 문턱을 떠났다. 줄 가장자리 풀밭에 털썩 앉아 눈을 감고 우유병을 쪽쪽 빤다. 우유병은 알로락토스다. 젖당이 들어오면 일부가 알로락토스로 바뀌고, 이것이 억제자에 붙으면 억제자가 모양이 바뀌어 비활성이 되고 작동자에서 떨어진다. 그래서 알로락토스를 유도자라 하고, 기질이 있을 때 켜지는 lac 오페론을 유도성 오페론이라 한다. 두 줄 모두 문지기가 비켰으니 막는 것은 이미 풀렸다.","box":[[890,585,200,205],[785,885,270,240]],"src":["s25p01#1","s25p01b#0"],"cards":["F1-14","F1-17","F1-12","F1-15","F1-5"]},{"sid":"s4","obj":"빨간 매트 위 은빛 돔 덮개 — 꼭지에 금 고리를 걸었다 · 덮개에서 뻗은 큰 용수철이 기계를 민다(둘째 줄은 기계 등에 닿았고 · 맨 앞 줄은 다 펴져 기계를 밀어 보냈다)","fact":"cAMP-CRP(CAP)가 프로모터 근처에 붙어 RNA 중합효소 결합을 돕는다 · 양성 조절","hook":"고리 건 돔 덮개 = cAMP-CRP · 용수철로 밂 = 양성 조절","say":"둘째 줄과 맨 앞 줄의 빨간 매트에는 은빛 돔 덮개가 놓였다. 덮개 꼭지에 금 고리 하나가 걸렸고, 덮개에서 큰 용수철이 뻗어 나왔다. 둘째 줄에서는 용수철이 기계 등을 힘껏 밀고, 맨 앞 줄에서는 문턱까지 다 펴져 기계를 벌써 밀어 보냈다. 돔 덮개가 CRP, 다른 이름으로 CAP, 캡이다. 캡은 뚜껑, 그래서 덮개다. 금 고리는 금화를 구부려 만든 고리, cAMP 다. 고리가 걸려야 덮개가 매트에 얹힌다. cAMP 와 결합한 CRP 가 프로모터 근처 조절 부위에 붙어 RNA 중합효소가 프로모터에 잘 붙도록 돕는다. 전사를 직접 밀어 주는 것, 양성 조절이다.","box":[[275,745,520,190],[435,330,305,155]],"src":["s25p01#2"],"cards":["F1-22","F1-23","F1-38","F1-26","F1-37","F1-1#1"]},{"sid":"s5","obj":"옆으로 쓰러진 빈 그릇에서 금 고리가 쏟아져 나왔다(맨 앞 줄은 수북이) — 포도가 가득한 그릇 곁엔 고리가 없다","fact":"포도당이 낮으면 cAMP 가 높다 · 포도당이 높으면 cAMP 가 낮다","hook":"빈 포도 그릇에서 쏟아진 고리 = 포도당 낮음 → cAMP 높음","say":"왼쪽 끝 그릇들을 보자. 포도가 가득 찬 그릇 곁에는 아무것도 없다. 그런데 포도를 다 먹어 옆으로 쓰러진 빈 그릇에서는 금 고리가 쏟아져 나왔다. 맨 앞 줄은 수북하다. 포도는 언제나 포도당이다. 포도당이 떨어지면 세포 안 cAMP 가 높아진다. 다른 당을 쓸 채비를 하라는 신호다. 포도당이 많으면 cAMP 는 낮다. 고리가 쌓인 줄에만 돔 덮개가 얹혀 있는 것도 그래서다.","box":[[25,780,395,260],[220,355,185,135]],"src":["s25p01#3"],"cards":["F1-24","F1-25","F1-150","F1-13","F1-27"]},{"sid":"s6","obj":"맨 앞 줄 — 문지기는 비켰고 · 빈 그릇 곁에 고리 더미 · 덮개가 밀어 기계가 오른쪽 끝까지 내달리고 해 · 나무 · 집이 찍힌 종이띠가 끝없이 굽이쳐 쏟아진다","fact":"젖당 있음 + 포도당 없음 = 최대 발현(억제자 풀림 + cAMP-CRP 밂)","hook":"문지기 없음 + 덮개 밂 = 종이띠가 끝없이","say":"맨 앞 줄이 가장 요란하다. 문지기는 우유병을 들고 비켜났고, 포도 그릇은 비어 고리가 쏟아졌고, 매트의 돔 덮개가 용수철로 힘껏 민다. 기계는 속도선을 그리며 오른쪽 끝까지 내달리고, 해 나무 집이 찍힌 종이띠가 끝없이 굽이쳐 쏟아진다. 젖당이 있고 포도당이 없을 때, lac 오페론은 가장 강하게 켜진다. 막는 것은 풀렸고 미는 것은 붙었다. 최대 발현은 이 한 줄뿐이다.","box":[[20,770,420,290],[270,770,490,200],[750,880,320,235],[1125,715,880,400]],"src":["s25p01b#1"],"cards":[]},{"sid":"s7","obj":"셋째 줄 — 문지기는 비켰지만 그릇에 포도가 가득 · 덮개도 고리도 없다 · 기계가 문턱을 조금 넘어 짧은 종이띠만","fact":"포도당이 많으면 cAMP-CRP 가 없어 억제자가 없어도 조금만 · 이화물질 억제","hook":"포도 가득 + 덮개 없음 = 짧은 종이띠 = 이화물질 억제","say":"셋째 줄도 문지기는 우유병을 들고 비켜났다. 그런데 그릇에 포도가 가득하고, 고리도 돔 덮개도 없다. 기계는 문턱을 겨우 넘어 짧은 종이띠만 내놓았다. 젖당이 있어도 포도당이 많으면 cAMP 가 낮아 cAMP-CRP 가 생기지 않는다. 밀어 주는 것이 없으니 발현이 낮다. 막는 것이 없어졌다고 저절로 많이 나오지는 않는다. 좋은 밥인 포도당이 있으면 딴 밥 차릴 채비를 하지 않는 것, 이것이 이화물질 억제다. 포도당 효과라고도 한다.","box":[[70,535,250,175],[635,470,655,200]],"src":["s25p01b#2","s25p01b#3"],"cards":["F1-28","F1-36"]},{"sid":"s8","obj":"둘째 줄 — 쓰러진 빈 그릇 곁 금 고리 · 덮개의 용수철이 기계를 밀어도 문턱 위 문지기 때문에 기계가 꼼짝 못 한다","fact":"젖당이 없으면 포도당이 없어도 꺼짐 — 억제자가 막으면 cAMP-CRP 도 소용없다","hook":"덮개가 밀어도 문지기가 버티면 꺼짐","say":"둘째 줄은 방금 본 셋째 줄과 거꾸로다. 포도 그릇이 비어 고리가 쏟아졌고, 돔 덮개도 얹혀 용수철로 기계를 민다. 그런데 문턱 위에 문지기가 팔짱 끼고 버티고 앉았다. 기계는 꼼짝 못 한다. 젖당이 없으면 포도당이 없어도 lac 오페론은 꺼져 있다. 억제자가 작동자를 막고 있으면 cAMP-CRP 가 아무리 밀어도 소용없다.","box":[[215,345,200,160],[420,295,660,240]],"src":["s25p01#0","s25p01b#4"],"cards":["F1-16","F1-149","F1-3","F1-68","F1-21","F1-29"]},{"sid":"s9","obj":"둘째 줄 한 자리에 둘이 맞선다 — 문턱 위에서 막는 문지기 · 뒤에서 용수철로 미는 돔 덮개","fact":"음성 조절 = 억제자가 전사를 막음 · 양성 조절 = 활성자가 촉진 · lac 은 둘 다","hook":"막는 문지기 = 음성 · 미는 덮개 = 양성","say":"둘째 줄 한 자리에 두 힘이 맞선다. 앞에서 막는 문지기, 뒤에서 미는 돔 덮개. 억제자가 전사를 막는 것이 음성 조절, 활성자가 전사를 촉진하는 것이 양성 조절이다. lac 오페론은 이 둘을 한 자리에서 동시에 받는다. 활성자와 억제자가 같은 유전자에 함께 작용할 수 있다. trp 오페론과 lac 오페론은 둘 다 억제자에 의한 음성 조절을 받는다는 점이 같다.","box":[[915,290,160,240],[425,305,330,185]],"src":["s25p01#4"],"cards":["F1-33","F1-31","F1-67","F1-162"]},{"sid":"s10","obj":"맨 앞 줄이 켜진 조건 둘 — 문지기가 빠는 우유병 · 옆으로 쓰러진 빈 포도 그릇","fact":"첫째 조건 젖당 있음(억제자 풀림) · 둘째 조건 포도당 없음(CAP 붙음)","hook":"우유병 = 첫째 · 빈 포도 그릇 = 둘째","say":"조건을 둘로 정리하자. 첫째는 문지기가 빠는 우유병, 젖당이 있어 억제자가 비켜나는 것이다. 이것이 lac 오페론이 켜지는 첫 번째 조건이다. 둘째는 쓰러진 빈 포도 그릇, 포도당이 부족해 고리가 쌓이고 덮개가 미는 것이다. 이것이 최대로 켜지는 두 번째 조건이다. 둘이 겹쳐야 종이띠가 끝없이 쏟아진다.","box":[[830,900,110,90],[25,780,175,150]],"src":["s25p01#1","s25p01#3"],"cards":["F1-14","F1-17","F1-12","F1-15","F1-5","F1-24","F1-25","F1-150","F1-13","F1-27"]},{"sid":"s11","obj":"네 줄을 뒤에서 앞으로 (되짚기) — 버티는 문지기 둘(꺼짐) · 비킨 문지기와 포도 가득(조금) · 비킨 문지기와 빈 그릇(활짝)","fact":"젖당 없음 → 꺼짐 · 젖당 + 포도당 → 조금 · 젖당 + 포도당 없음 → 활짝","hook":"뒤 둘 꺼짐 · 셋째 조금 · 맨 앞 활짝","say":"네 줄을 뒤에서 앞으로 되짚자. 뒤의 두 줄은 문지기가 문턱에 버티고 있다. 젖당이 없으면 포도당이 있든 없든 꺼짐. 셋째 줄은 문지기가 비켰지만 포도가 가득하다. 젖당이 있고 포도당도 있으면 조금만. 맨 앞 줄은 문지기가 비키고 그릇도 비었다. 젖당이 있고 포도당이 없으면 활짝. 한 문장으로, lac 오페론은 젖당이 있을 때 켜지고 포도당이 없을 때 가장 강하게 켜지는 유도성 오페론이다.","box":[[310,85,780,245],[220,290,860,240],[130,530,1140,260],[25,740,1960,390]],"src":["s25p01b#4"],"cards":[]}],"cq":{"F1-22":["양성 조절의 뜻은?","조절 단백질이 전사를 직접 촉진하는 것"],"F1-23":["lac 오페론의 양성 조절에 필요한 두 분자는?","cAMP와 CRP(CAP)"],"F1-38":["cAMP-CRP 복합체는 어떤 DNA 부위에 작용하는가?","lac 프로모터 인근 조절 부위"],"F1-26":["cAMP와 결합한 CRP의 역할은?","RNA 중합효소가 프로모터에 잘 결합하도록 도와 전사를 촉진한다"],"F1-37":["lac operon에서 CRP의 다른 이름은?","CAP"],"F1-1#1":["오페론을 구성하는 핵심 DNA 요소 3가지는?","프로모터"],"F1-16":["lac 억제단백질은 젖당이 없을 때 어떤 상태인가?","활성 상태로 작동자에 결합한다"],"F1-149":["lac 오페론에서 알로락토오스가 없으면 억제자는 어디에 결합하는가?","작동자"],"F1-3":["오페론에서 스위치 역할을 하는 DNA 부위는?","작동자"],"F1-68":["억제자(repressor)란?","전사를 억제하는 조절 단백질"],"F1-21":["trp와 lac 오페론의 공통 조절 방식은?","둘 다 억제자에 의한 음성 조절을 받는다"],"F1-29":["젖당이 없고 포도당도 없으면 lac 오페론은 어떻게 되는가?","억제자가 작동자에 결합해 거의 발현되지 않는다"],"F1-14":["lac 오페론의 유도물질은?","알로락토오스"],"F1-17":["lac 억제단백질은 알로락토오스가 결합하면 어떻게 되는가?","비활성화되어 작동자에서 떨어진다"],"F1-12":["lac 오페론이 켜지는 첫 번째 조건은?","젖당이 존재해 억제자가 비활성화될 것"],"F1-15":["알로락토오스는 lac 오페론에서 어떤 역할을 하는가?","유도자(inducer)"],"F1-5":["유도성 오페론의 대표 예시는?","lac 오페론"],"F1-24":["포도당 농도가 낮을 때 세포 내 cAMP 농도는?","높아진다"],"F1-25":["포도당 농도가 높을 때 세포 내 cAMP 농도는?","낮아진다"],"F1-150":["lac 오페론에서 포도당이 낮을 때 cAMP가 늘어나는 이유를 한 문장으로?","세포가 대체 당원 사용을 촉진하도록 신호하기 때문"],"F1-13":["lac 오페론이 최대한 켜지는 두 번째 조건은?","포도당이 부족할 것"],"F1-27":["lac 오페론이 가장 강하게 발현되는 조건은?","젖당이 있고 포도당이 없을 때"],"F1-28":["젖당이 있어도 포도당이 많으면 lac 오페론 발현이 낮은 이유는?","cAMP-CRP가 형성되지 않아 양성 조절이 약하기 때문"],"F1-36":["포도당이 젖당보다 우선적으로 사용되는 현상과 관련된 조절은?","catabolite repression"],"F1-33":["세균 조절에서 음성 조절과 양성 조절의 차이는?","음성 조절은 억제자가 전사를 막고 · 양성 조절은 활성자가 전사를 촉진한다"],"F1-31":["lac 오페론을 한 문장으로 요약하면?","젖당이 있을 때 켜지고 포도당이 없을 때 가장 강하게 켜지는 유도성 오페론"],"F1-67":["활성자(activator)란?","DNA에 결합해 전사를 촉진하는 조절 단백질(세균의 CAP는 프로모터 곁 · 진핵세포는 인핸서)"],"F1-162":["활성자와 억제자가 같은 유전자에 동시에 영향을 줄 수 있는가?","예"]},"hubPanel":"s25p01"};

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]

    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact));
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
function speak(t) {
  t = ttsNorm(t);
  const my = ++speakSeq, at = i;
  const advance = (ms) => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, ms);
  if (!('speechSynthesis' in window)) { if (playing) advance(3500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = () => { if (started) advance(700); };
  u.onerror = () => { if (!started) advance(3000); };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started && my === speakSeq) { speechSynthesis.cancel(); advance(3000); } }, 2500);  // 목소리가 없으면 글만 3초
}
function go(k) {
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) setTimeout(() => { if (playing) next(); }, 3500);
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; speechSynthesis && speechSynthesis.cancel(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i + 1); else speechSynthesis && speechSynthesis.cancel(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) speechSynthesis && speechSynthesis.cancel(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
</script>
