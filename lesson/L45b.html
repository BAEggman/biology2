<script>
const L = {"id":"L45b","scene":"s45","part":"b","title":"두 자매와 무지개 걸상 — 색소와 엥겔만","sub":"엽록소의 포르피린 머리 · 꼬리 · a(메틸) · b(포르밀) · 봉우리 비킴 · 초록 반사 · 카로티노이드 · 엥겔만 실험(사상조류 · 호기성 세균 · 작용 vs 흡수 스펙트럼)","img":"img/L45b.webp?v=027633f4f10e","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"풀밭 — 쿠션 위 두 자매 · 당근 사람 · 무지개 걸상","fact":"색소는 빛을 마시고(흡수) 실은 산소를 낸다(작용) — 그 둘을 한 풀밭에","hook":"왼쪽은 마시는 쪽 · 오른쪽은 일한 쪽","say":"풀밭 왼쪽의 거대한 초록 쿠션 위에서는 두 자매와 당근 사람이 빛을 마시고 있다. 오른쪽 무지개 걸상에서는 초록 실이 산소를 내놓는다. 왼쪽에서 보는 것은 빛의 흡수, 오른쪽에서 보는 것은 광합성 작용이다. 두 장면을 비교하며 살펴보자.","box":null,"src":[],"cards":[]},{"sid":"s2","obj":"두 자매의 자줏빛 네모 액자 머리 · 한가운데 은빛 구슬","fact":"엽록소의 빛 받는 머리 = Mg를 가운데 둔 포르피린 고리","hook":"porphyra = 자줏빛 · 은빛 구슬 = 마그네슘","say":"두 자매의 머리는 자줏빛 네모 액자이며 가운데에 은빛 구슬이 박혀 있다. 액자는 엽록소가 빛을 받는 포르피린 고리다. 포르피라는 말은 자줏빛이라는 뜻이고, 한가운데의 은빛 구슬은 마그네슘이다.","box":[180,320,480,200],"src":["s45u02#12"],"cards":["C0-57","C0-62"]},{"sid":"s3","obj":"자매의 긴 꼬리가 쿠션 겉천 속에 파고들어 안 보인다","fact":"탄화수소 꼬리 — 막의 소수성 안쪽에 묻혀 색소를 막에 붙든다 · 빛과 무관","hook":"쿠션 겉천 = 틸라코이드막 · 꼬리는 붙드는 몫","say":"자매의 긴 꼬리는 쿠션의 겉천 속으로 바늘처럼 파고들어 끝이 보이지 않는다. 탄화수소 꼬리다. 쿠션 겉천인 틸라코이드막의 기름진 안쪽에 묻혀 색소를 막에 고정한다. 꼬리는 빛과는 관계가 없고, 색소를 막에 붙들어 두는 부분이다.","box":[[120,735,580,285]],"src":["s45u02#13"],"cards":["C0-63"]},{"sid":"s4","obj":"왼 자매 가슴의 세 갈래 잔가지 브로치 — 끝마다 흰 꽃망울","fact":"메틸기(CH₃) — 이쪽이 엽록소 a","hook":"검은 마디에서 갈래 셋 · 흰 꽃망울 셋 = 수소 셋","say":"왼쪽 자매의 가슴에는 세 갈래 잔가지 모양의 브로치가 있고, 각 끝에 흰 꽃망울이 달렸다. 탄소 하나에 수소 셋이 붙은 메틸기를 나타낸다. 이 자매는 엽록소 에이다.","box":[240,500,120,120],"src":["s45u02#14"],"cards":["C0-58","C0-59"]},{"sid":"s5","obj":"오른 자매 가슴의 네 갈퀴 포크","fact":"포르밀기(CHO) — 포크 = 이쪽이 엽록소 b · 둘은 작용기 하나만 다르다","hook":"포크 = 포르밀","say":"오른쪽 자매의 브로치는 갈퀴가 넷인 포크다. 포크라는 말에서 포르밀기를 떠올리자. 이 자매는 엽록소 비다. 두 자매는 몸, 머리, 꼬리가 같지만 가슴의 작용기 하나가 다르다.","box":[460,500,120,120],"src":["s45u02#15"],"cards":["C0-60"]},{"sid":"s6","obj":"같은 일곱 줄 빛띠 — 액자로 드는 줄이 자매마다 한 칸씩 어긋난다","fact":"흡수 봉우리가 조금 비킨다(a 430·662 / b 453·642 nm) → b가 a의 골을 메운다","hook":"한 칸 어긋남 = 조금 비킴","say":"같은 일곱 줄의 빛띠가 두 자매에게 내려오지만 액자로 들어가는 띠는 한 칸씩 어긋나 있다. 왼쪽 자매는 보라와 빨강, 오른쪽 자매는 파랑과 주황을 받아들인다. 작용기 하나의 차이로 흡수 봉우리 위치가 조금 달라진다. 엽록소 에이는 사백삼십과 육백육십이, 엽록소 비는 사백오십삼과 육백사십이 나노미터다. 비가 에이가 덜 흡수하는 부분을 보완해 사용할 수 있는 빛의 범위가 넓어진다. 같은 엽록소 계열의 디와 에프는 빨강보다 더 긴 파장의 빛을 받아들이는 특수한 예다.","box":[[0,0,700,380]],"src":["s45u02#16"],"cards":["C0-61","C0-69"]},{"sid":"s7","obj":"초록 줄만 액자 윗변에 부딪혀 V로 되튄다","fact":"엽록소는 녹색광을 가장 적게 흡수(반사 · 투과) → 잎이 초록 · 녹색광에서 광합성 최소(0은 아님)","hook":"덜 받아 돌려보낸 빛이 보이는 색","say":"두 자매 모두 초록 빛띠는 액자의 윗변에서 브이 자로 튕겨 나간다. 엽록소가 녹색광을 가장 적게 흡수하고 반사하거나 투과하기 때문이다. 흡수하지 않고 돌려보낸 빛이 눈에 보이는 색이므로 잎이 초록색이다. 초록빛을 잘 흡수해서 초록색인 것은 아니다. 녹색광에서는 광합성이 가장 적지만 전혀 일어나지 않는 것은 아니다.","box":[[290,0,485,345]],"src":["s45u02#9"],"cards":["C0-44","C0-45","C0-46","C0-50"]},{"sid":"s8","obj":"당근 머리 사람 — 보라~청록을 받고, 망토로 눈부신 빛을 받아낸다","fact":"카로티노이드 — 보조 색소(보라~청록 흡수) + 광보호(넘치는 빛을 흩어 엽록소를 지킴)","hook":"당근 = 카로티노이드 · 망토 = 광보호","say":"당근 잎이 머리에 난 당근빛 인물은 보라에서 청록까지의 빛을 머리로 받고, 어깨의 주황 망토를 휘둘러 눈부신 빛을 받아낸다. 당근에서 이름이 유래한 카로티노이드다. 역할은 두 가지다. 보라부터 청록 영역의 빛을 받아 전달하는 보조 색소이며, 지나친 빛에너지를 흩어 엽록소 손상을 막는 광보호도 한다.","box":[680,260,360,560],"src":["s45u02#10"],"cards":["C0-64","C0-66","C0-55#3"]},{"sid":"s9","obj":"돌 기둥 위 프리즘이 햇빛을 무지개로 걸상에 펴 놓았다","fact":"엥겔만 실험(1883)의 틀 — 파장별로 광합성을 잰다","hook":"프리즘 무지개 걸상 = 엥겔만","say":"오른쪽 돌기둥 위의 프리즘이 흰 햇빛을 무지개로 나누어 긴 걸상에 펼쳐 놓는다. 엥겔만의 실험이다. 파장에 따라 광합성이 얼마나 일어나는지를 비교한다.","box":[[1120,180,240,560],[1330,230,530,350]],"src":["s45u02#17"],"cards":["C0-53"]},{"sid":"s10","obj":"걸상 끝에서 끝까지 마디 진 초록 실","fact":"사상조류(실처럼 긴 조류) — 한 오라기가 모든 파장을 한꺼번에 받는다","hook":"실 = 사상(絲狀)","say":"걸상 전체를 가로지르는 굵은 초록 실 하나를 보자. 마디마다 칸이 나뉜 사상조류, 실 모양으로 긴 조류다. 한 가닥이 일곱 빛띠를 모두 지나므로 여러 파장의 빛을 동시에 받게 된다.","box":[[1245,560,760,415]],"src":["s45u02#17"],"cards":["C0-53"]},{"sid":"s11","obj":"채찍 꼬리 단 알약꼴 헤엄이(세균)가 보라 · 파랑과 빨강 자리에 새까맣게 몰렸다","fact":"호기성 세균이 산소를 좇는다 → 청자색광과 적색광에서 광합성 최대","hook":"몰린 자리 = 산소 많은 자리 = 광합성 많은 자리","say":"채찍 꼬리가 있는 작은 알약 모양의 헤엄이들이 초록 실의 보라·파랑 부분과 빨강 부분에 몰려 있다. 세균 마을의 인물들과 같은 알약 모양으로 그린 호기성 세균이다. 산소가 많이 발생하는 곳을 찾아 이동한 것이다. 두 무리가 모인 위치에서 청자색광과 적색광일 때 광합성이 가장 활발하다는 결론을 읽을 수 있다.","box":[[1280,620,220,180],[1680,700,240,200]],"src":["s45u02#18","s45u02#19"],"cards":["C0-49","C0-51","C0-52"]},{"sid":"s12","obj":"몰린 자리 실에서 흰 방울이 솟는다 — 초록 자리엔 방울 없이 헤엄이 한둘","fact":"작용 스펙트럼(낸 O₂ = 한 일) ≠ 흡수 스펙트럼(마신 빛) · 차이는 b · 카로티노이드가 거든 몫","hook":"걸상이 재는 것은 마신 양이 아니라 낸 산소","say":"세균이 모인 두 부분의 실에서는 흰 방울이 올라온다. 초록 영역에서는 방울이 보이지 않고 세균도 한두 마리뿐이지만, 광합성이 적을 뿐 영은 아니다. 걸상에서 측정하는 것은 흡수한 빛이 아니라 만들어 낸 산소, 즉 광합성의 작용이다. 이것이 작용 스펙트럼이다. 반면 자매가 마신 빛띠는 흡수 스펙트럼이다. 작용 스펙트럼이 엽록소 에이의 흡수 스펙트럼과 정확히 같지 않은 이유는 엽록소 비와 카로티노이드도 함께 빛을 받아 주기 때문이다.","box":[[1380,160,200,420],[1760,320,200,440]],"src":["s45u02#19","s45u02#20","s45u02#21"],"cards":["C0-52","C0-47","C0-48","C0-54","C0-68"]}],"cq":{"C0-57":["엽록소 a와 b의 공통 구조 핵심은?","Mg를 중심에 둔 포르피린 고리와 긴 탄화수소 꼬리"],"C0-62":["포르피린 고리의 기능은?","빛을 흡수하는 머리 부분"],"C0-63":["탄화수소 꼬리의 기능은?","틸라코이드막의 소수성 부위와 상호작용해 색소를 막에 고정"],"C0-58":["엽록소 a와 b의 차이는 주로 어디에 있는가?","한 개의 작용기"],"C0-59":["엽록소 a의 해당 작용기는?","메틸기(CH3)"],"C0-60":["엽록소 b의 해당 작용기는?","포르밀기(CHO)"],"C0-61":["엽록소 a와 b의 작용기 차이가 중요한 이유는?","흡수하는 빛의 파장이 약간 달라지기 때문"],"C0-69":["엽록소 d, f가 언급되는 이유는?","더 긴 파장의 빛을 흡수하는 특수 예시이기 때문"],"C0-44":["엽록체가 잎의 초록색과 직접 관련된 이유는?","틸라코이드막의 엽록소 때문"],"C0-45":["색소(pigment)란?","가시광선 일부 파장을 흡수하고 일부를 반사·투과하는 물질"],"C0-46":["잎이 초록색으로 보이는 이유는?","엽록소가 녹색광을 반사·투과하기 때문"],"C0-50":["광합성에 가장 비효율적인 빛 영역은?","녹색광"],"C0-64":["카로티노이드의 주요 기능 두 가지는?","보조 색소 역할과 광보호 역할"],"C0-66":["카로티노이드가 주로 흡수하는 빛 영역은?","자색광과 청록색광"],"C0-55#3":["주된 광합성 색소 세 종류는?","카로티노이드"],"C0-53":["엥겔만 실험 재료로 쓰인 것은?","사상조류"],"C0-49":["광합성에 가장 효율적인 빛 영역 두 개는?","청색광과 적색광"],"C0-51":["엥겔만 실험의 결론은?","청색광과 적색광에서 광합성이 가장 활발하다는 것"],"C0-52":["엥겔만 실험에서 호기성 세균이 모여든 이유는?","산소가 많이 발생한 곳으로 이동했기 때문"],"C0-47":["흡수 스펙트럼이란?","파장에 따라 색소가 빛을 얼마나 흡수하는지 나타낸 그래프"],"C0-48":["작용 스펙트럼이란?","파장에 따라 광합성이 얼마나 일어나는지 나타낸 그래프"],"C0-54":["엥겔만 실험이 보여준 것은 흡수 스펙트럼인가 작용 스펙트럼인가?","작용 스펙트럼의 원리"],"C0-68":["작용 스펙트럼이 엽록소 a 흡수 스펙트럼과 완전히 같지 않은 이유는?","엽록소 b와 카로티노이드 같은 보조 색소도 기여하기 때문"]},"hubPanel":"s45u02"};

const ttsNorm = t => TTSNorm.ttsNorm(t, TTS_LEX, TTS_ORDER, L.id);
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);

    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }

function go(k) {
  stopSpeech();

function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {

  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';

}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);

      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }

function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));

function cqHTML(st) {

function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.

function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
