<script>
const L = {"id":"L17a","scene":"s17","part":"a","title":"콩팥 강가 장터 — 거르는 강","sub":"여과 장벽(사구체 · 족세포 · 기저막) · 네 걸음 · 배 셋(이눌린 · 포도당 · PAH) + 크레파스 상자(크레아티닌 · 조금 분비) · 근위세뇨관 짐꾼(SGLT2 · SGLT1 · GLUT2 · 펌프 · Tm)","img":"img/L17a.webp?v=bb5547248e70","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"콩팥 강가 장터 — 강이 왼쪽 호스 뭉치에서 시작해 오른쪽으로 흐른다","fact":"배설량 = 여과량 − 재흡수량 + 분비량 · 재흡수와 분비는 이동 방향이 반대다.","hook":"콩 자루 + 팥 자루 = 콩팥 · 강 = 오줌길 · 둑 = 세포 · 뒷문 너머 = 혈액","say":"콩과 팥을 파는 강가 장터다. 콩과 팥에서 콩팥을 떠올리자. 강은 세뇨관 안, 둑은 세뇨관 세포, 좌판 뒤쪽은 혈액이다. 물질은 강머리의 사구체에서 여과되어 처음 강 안으로 들어온다. 이제 짐의 이동 방향을 따라가 보자. 강에서 혈액 쪽으로 되찾는 것은 재흡수, 혈액에서 강 안으로 추가하는 것은 분비다. 배설량은 여과량에서 재흡수량을 빼고 분비량을 더한 값이다. 이 장터는 물과 용질의 획득·손실을 조절해 체액 농도를 좁은 범위로 유지하는 삼투조절을 담당한다.","box":null,"src":["s17u01#0"],"cards":["H1-9","H1-9#2","H1-27","H1-0","H1-28"]},{"sid":"s2","obj":"굵은 호스가 들어가고 가는 호스가 나오는 둥근 호스 뭉치 — 강머리에 물을 쏟는다 · 그 물을 강에 무릎까지 잠긴 사내가 펼친 사진 앨범을 방패처럼 들고 되밀지만 물은 곁으로 쏟아져 들어간다","fact":"사구체 여과 — 수입 굵고 수출 가늘어 높은 정수압이 민다 · 보먼 정수압 · 교질삼투압은 막는다","hook":"호스 뭉치 = 사구체 · 굵게 들어와 가늘게 나간다 · 앨범 방패로 되미는 사내 = 막는 두 힘","say":"강머리의 둥근 호스 뭉치는 모세혈관이 모인 사구체다. 굵은 호스로 들어온 물이 가는 호스로 나가 안의 압력이 높다. 굵은 수입세동맥과 가는 수출세동맥을 연결하자. 이 압력으로 물질을 보먼주머니 쪽으로 거른다. 거르는 사구체, 여과액을 받는 보먼주머니, 이어지는 강인 세뇨관이 네프론 하나를 이룬다. 강에 무릎까지 잠긴 남자는 펼친 사진 앨범으로 쏟아지는 물을 되민다. 여과는 정수압과 교질삼투압의 균형으로 결정된다. 호스 안의 정수압은 여과를 촉진하지만, 보먼주머니에 찬 물의 정수압은 반대쪽으로 밀어 여과를 억제한다. 앨범은 혈장 단백질인 알부민의 단서다. 단백질이 물을 혈관 안에 붙잡는 교질삼투압도 여과를 억제한다. 그래도 밖으로 미는 힘이 더 커 물이 남자의 옆으로 흘러든다.","box":[[100,0,830,470],[420,320,190,190]],"src":[],"cards":["H1-7","H1-11","H1-12","H1-13","H1-14"]},{"sid":"s3","obj":"말뚝 둘 위에 다리 벌리고 선 사람 — 가랑이로 강물이 지난다","fact":"족세포의 여과 슬릿 — 족돌기 사이 틈으로만 걸러진다","hook":"발로 선 사람 = 족(足)세포 · 벌린 다리 = 족돌기 · 가랑이 = 슬릿","say":"말뚝 둘 위에서 다리를 벌리고 선 사람을 보자. 다리 사이로 강물이 흐른다. 발 족 자에서 족세포를 떠올리자. 벌린 다리는 족돌기, 다리 사이의 틈은 여과 슬릿이다. 물은 이 틈을 통해서만 여과된다.","box":[940,240,260,420],"src":["s17u01#9"],"cards":[]},{"sid":"s4","obj":"강머리를 가로지른 검은 가시 그물 — 밀짚빛 가시 공이 구멍을 아슬아슬하게 지날 만한데도 튕겨 나간다","fact":"큰 것은 크기로 거르고 · 알부민(음전하)은 기저막의 음전하가 밀어내 전하로도 막는다","hook":"가시끼리 밀어낸다","say":"강머리를 가로지르는 검은 가시 그물을 보자. 가시가 돋은 밀짚빛 공은 구멍을 겨우 지날 만한 크기인데도 튕겨 나간다. 기저막의 음전하가 음전하를 띤 알부민을 밀어내는 모습이다. 큰 물질은 크기 때문에 걸리고, 알부민은 전하의 영향도 받는다. 크기와 전하를 함께 기억하자. 물이 지나는 순서는 호스 뭉치, 검은 그물, 말뚝 위 사람의 다리 사이다. 유창 모세혈관 내피세포, 사구체기저막, 족세포 사이의 틈막이라는 세 겹에 해당한다. 적혈구는 크기 때문에 걸리고, 크고 음전하인 알부민은 크기와 전하 양쪽에 영향을 받는다. 작고 전하가 없는 용질이 가장 쉽게 통과한다.","box":[440,260,560,390],"src":["s17u01#10"],"cards":["H1-26","H1-10","H1-15","H1-16","H1-21"]},{"sid":"s5","obj":"통나무 뗏목 — 아무도 손대지 않고 그대로 떠내려간다","fact":"이눌린은 여과만 된다. 재흡수·분비가 없어 청소율이 GFR과 같다.","hook":"아무도 손대지 않는 뗏목 → 여과된 이눌린의 양 = 소변으로 나온 양","say":"여과망을 통과한 통나무 뗏목은 아무도 건드리지 않는다. 통나무는 식물이 만드는 다당류인 이눌린이다. 외부에서 넣은 이눌린은 사구체에서 자유롭게 여과되지만 세뇨관에서는 재흡수도 분비도 되지 않는다. 따라서 여과된 양이 그대로 배설되고, 이눌린 청소율은 사구체여과율인 GFR과 같다. ‘그대로 전부 나온다’는 말은 여과망을 통과한 양을 기준으로 한다.","box":[660,600,340,200],"src":["s17u01#14"],"drop":["H1-25"],"ask":"뗏목이 여과망을 지난 뒤, 둑과 뗏목 사이에서 얼마나 오가는가? 이 물질의 청소율로 무엇을 재는가?","cards":["X-RN-28","H1-24"]},{"sid":"s13","obj":"빨간 옷을 입은 아이가 둑에서 크레파스 한 자루를 더 던진다. 강에는 크레파스가 이미 담긴 작은 상자가 떠 있다.","fact":"크레아티닌은 여과되고 소량 분비된다. 청소율은 실제 GFR보다 조금 높다.","hook":"이미 실려 온 크레파스 → 여과 · 둑에서 한 자루 더 → 소량 분비","say":"상자 안의 크레파스는 이미 여과망을 지나 강에 들어왔다. 여기에 둑의 아이가 크레파스 한 자루를 더 던진다. 근육의 크레아틴 대사에서 생기는 크레아티닌은 사구체에서 여과되고 근위세뇨관에서 소량 더 분비된다. 재흡수는 보통 무시한다. 배설량이 여과량보다 조금 많으므로 크레아티닌 청소율은 실제 GFR을 다소 높게 추정한다.","box":[[530,765,120,175],[690,741,113,95],[752,808,115,94]],"cards":["H1-25"],"ask":"상자에 처음부터 있던 짐과 아이가 따로 더 던진 짐은 각각 어떤 과정인가? 청소율은 GFR과 어떻게 다른가?"},{"sid":"s6","obj":"텅 빈 배가 널다리에 대 있다 — 마지막 궤짝은 짐꾼 품에","fact":"포도당 — 여과는 되지만 정상에선 100% 재흡수 · 청소율 0","hook":"빈 배 = 다 건져 갔다","say":"텅 빈 배가 널다리에 닿아 있고 마지막 궤짝은 짐꾼이 안고 있다. 포도당의 단서다. 포도당은 강머리에서 여과되어 강에 들어오지만, 정상 상태에서는 백 퍼센트 재흡수되어 소변에 남지 않는다. 따라서 청소율은 영이다.","box":[[1195,580,430,215]],"src":["s17u01#15"],"cards":["H1-37","H1-22"]},{"sid":"s7","obj":"둑의 손수레에는 통 하나가 남았다. 아래쪽 물가에서는 짐꾼이 통을 하마 배로 더 싣고 있다.","fact":"PAH는 여과·강한 분비를 거친다. 저농도에서 청소율은 유효 신혈장류량을 추정한다.","hook":"하마(hippo) → 히퓨레이트 · 배에 가득한 통과 둑의 마지막 한 통 → 강한 분비","say":"하마의 히포에서 파라아미노히퓨레이트, PAH를 떠올리자. 처음 배에 실려 있던 통은 사구체 여과, 둑에서 추가로 싣는 여러 통은 근위세뇨관 분비다. 재흡수는 보통 무시한다. 혈장 농도가 낮아 분비 수송체가 포화되지 않으면, 신장을 한 번 지나는 동안 유입된 PAH의 대부분이 혈장에서 제거된다. 둑의 손수레에 통 하나만 남은 모습이 그 단서다. 이때 PAH 청소율로 유효 신혈장류량을 추정한다. PAH 같은 유기산·유기염기를 내보내는 근위세뇨관 분비는 약물과 독성물질을 제거하는 경로다. 분비되는 대표 물질로 H⁺·K⁺·히스타민·유기산도 기억하자. 이눌린은 여과된 짐, PAH는 신장에 들어온 혈장 속 짐을 기준으로 비교한다는 차이가 있다.","box":[[1225,296,243,278],[1200,712,703,392]],"src":["s17u01#16"],"ask":"둑에서 하마 배로 통을 더 싣는 방향은 무엇을 뜻하는가? 떠나는 혈장에 이 물질이 거의 남지 않을 때 무엇을 추정하는가?","cards":["H1-54","H1-30","H1-55"]},{"sid":"s8","obj":"흰 소금 자루 하나 + 포도 궤짝 하나를 가볍게 낀 짐꾼","fact":"SGLT2 — Na⁺ 1 : 포도당 1 · 저친화 대용량 · 근위세뇨관 초기","hook":"흰 소금 자루 수 = Na⁺ 수 · 가볍게 많이 = 대용량","say":"소금 자루 하나를 메고 포도 궤짝 하나를 옆구리에 가볍게 낀 짐꾼은 에스지엘티 투다. 나트륨 하나와 포도당 하나를 함께 옮긴다. 가볍게 많은 양을 나르는 저친화·대용량 수송체로, 근위세뇨관 앞부분에서 포도당 대부분을 재흡수한다. 짐꾼이 선 널다리는 강 쪽 막인 관강막이다. 소금 자루 수는 이름의 숫자가 아니라 운반하는 나트륨 수다. 아미노산도 이와 같이 나트륨과 함께 이차 능동수송으로 들어온다.","box":[1470,370,170,290],"src":["s17u01#11"],"cards":["H1-39","H1-41","H1-41#1","X-RN-5","A1-160","H1-35","H1-62","H1-36"]},{"sid":"s9","obj":"흰 소금 자루 둘을 메고 포도 궤짝을 꽉 끌어안은 짐꾼","fact":"SGLT1 — Na⁺ 2 : 포도당 1 · 고친화 · 근위 후반(남은 것까지 긁어 들인다)","hook":"흰 소금 자루 둘 = Na⁺ 둘 · 꽉 안음 = 고친화","say":"소금 자루 둘을 머리와 어깨에 메고 포도 궤짝을 두 팔로 꼭 끌어안은 짐꾼을 보자. 에스지엘티 원이다. 나트륨 둘과 포도당 하나를 함께 옮긴다. 끌어들이는 힘이 커서 앞부분에서 남은 마지막 궤짝까지 회수한다. 근위세뇨관 뒤쪽의 고친화 수송체라는 특징과 연결하자.","box":[1660,380,220,310],"src":["s17u01#12"],"cards":["H1-40","H1-41#2"]},{"sid":"s10","obj":"좌판 뒷문 간판에는 끈적한 풀병, T자 자, 노란 오리가 왼쪽부터 붙어 있다. 짐꾼은 포도 궤짝 하나를 안고 적혈구가 보이는 쪽으로 문턱을 넘는다.","fact":"GLUT2는 근위세뇨관 앞쪽 기저외측막에서 포도당을 간질·혈액 쪽으로 촉진확산시킨다","hook":"풀(glue, 글루)·T자 자·2 모양 오리 → GLUT2 · 뒷문 → 기저외측막 · 포도 궤짝만 적혈구 쪽으로","say":"문 위 풀병에서 흘러나온 풀이 T자 목수 자에 묻어 있고, 옆의 노란 오리는 2번을 나타낸다. 풀의 glue, 글루에 T와 2를 이어 GLUT2를 떠올리자. 포도 궤짝 하나를 안은 짐꾼은 뒷문을 지나 적혈구 쪽으로 간다. 근위세뇨관 앞쪽에서는 관강막의 SGLT2가 나트륨과 포도당을 세포 안으로 들이고, 이어 기저외측막의 GLUT2가 포도당을 농도 기울기에 따라 간질로 내보낸다. 포도당은 다시 세뇨관 주위 모세혈관에 도달한다. 이 뒷문에서는 나트륨과 함께 이동하거나 ATP를 직접 쓰지 않는다. 근위세뇨관 후반의 기저외측막에는 GLUT1도 관여한다. 되찾은 물질이 돌아가는 주위모세혈관은 사구체에서 물이 빠져나온 뒤라 정수압은 낮고, 단백질 농도가 높아 교질삼투압은 높다. 따라서 강머리와 반대로 물을 끌어들이는 힘이 커 재흡수에 유리하다.","box":[[1595,20,196,120],[1629,141,172,238]],"src":["s17u01#13"],"ask":"뒷문에 붙은 풀·T자 자·오리는 어느 운반체의 이름과 번호인가? 포도당은 어느 막을 지나 어디로 가며, 이 단계에서 Na⁺나 ATP를 직접 쓰는가?","cards":["H1-42","X-RN-9","H1-56","H1-57"]},{"sid":"s11","obj":"뒷문 곁 동전 꽂힌 크랭크 펌프 — 소금을 문 안으로 퍼낸다","fact":"Na⁺-K⁺ 펌프(기저외측 · ATP)가 세포 안 Na⁺를 낮춰 짐꾼(SGLT · 2차 능동)을 돌린다","hook":"동전 펌프 = Na⁺-K⁺ ATPase · 구동력","say":"뒷문 옆에는 동전이 꽂힌 크랭크 펌프가 소금을 문 안으로 퍼내고 있다. 나트륨 칼륨 펌프다. 에이티피를 사용해 나트륨을 혈액 쪽으로 계속 내보내므로 세포 안의 나트륨 농도가 낮게 유지된다. 앞쪽 짐꾼들은 이 농도 기울기로 움직인다. 이차 능동수송의 구동력이며, 근위세뇨관 나트륨 재흡수를 이끄는 주된 힘이 기저외측 펌프에서 나온다. 뒷문 쪽 막의 수송체는 둘로, 이 펌프와 포도당을 혈액 쪽으로 내보내는 GLUT이다.","box":[1810,160,238,300],"src":[],"cards":["H1-33","H1-34","H1-58","S-RN-2"]},{"sid":"s12","obj":"널다리 끝에 못 진 포도 궤짝이 쌓이고 · 다른 작은 배는 포도 궤짝을 실은 채 떠내려간다","fact":"수송 최대치(Tm) — 혈당이 역치(≈180 mg/dL)를 넘으면 다 못 거둬 오줌에 포도당(당뇨)","hook":"짐꾼이 다 못 지면 포도 궤짝이 배에 남는다","say":"혈당이 너무 높아지면 널다리 끝에 옮기지 못한 궤짝이 쌓이고, 다른 작은 배는 짐을 실은 채 떠내려간다. 짐꾼 수에 한계가 있다는 수송 최대치, 티엠의 단서다. 혈당이 역치인 백팔십쯤을 넘으면 전부 회수하지 못해 소변으로 포도당이 나온다. 당뇨다. 근위세뇨관이 손상되어도 짐꾼들이 일하지 못해 포도당과 아미노산이 소변에 먼저 늘어난다. 근위세뇨관 재흡수 장애인 판코니 증후군과 연결하자.","box":[[1830,560,218,250],[880,850,300,200]],"src":[],"cards":["H1-38","H1-60","H1-61"]},{"sid":"s14","obj":"세 짐 사이로 흐르는 강물. 주변의 통나무 뗏목, 크레파스 상자, 하마 배를 한꺼번에 비교한다.","ask":"세 물질이 여과된 뒤, 재흡수와 분비는 각각 어떻게 다른가? 각 청소율이 가리키는 값까지 말해 보자.","fact":"분비량은 이눌린 없음, 크레아티닌 소량, PAH 많음. 모두 여과되며 재흡수는 보통 무시한다.","hook":"그대로 떠내려감 → GFR · 한 자루 더 → GFR보다 조금 큼 · 여러 통 더 → 저농도에서 유효 신혈장류량","say":"세 물질을 비교해 보자. 이눌린은 여과만 되므로 청소율이 GFR과 같다. 크레아티닌은 여과에 소량의 분비가 더해져 청소율이 GFR보다 조금 크다. PAH는 여과되고 근위세뇨관에서 강하게 분비되며, 낮은 농도에서 그 청소율로 유효 신혈장류량을 추정한다. 셋 모두 여과되고, 통상적인 청소율 비교에서는 세뇨관 재흡수를 무시한다.","box":[[660,600,340,200],[530,765,120,175],[690,741,113,95],[752,808,115,94],[1225,296,243,278],[1200,712,703,392],[1004,724,175,126]],"cards":["X-RN-28"]}],"cq":{"H1-9":["여과액 처리(배설)의 4단계는?","여과 → 재흡수 → 분비 → 배설"],"H1-9#2":["여과액 처리(배설)의 4단계는?","재흡수"],"H1-27":["여과된 물질이 신세뇨관으로 들어간 뒤 다시 혈액으로 돌아가는 과정을 무엇이라 하는가?","재흡수"],"H1-0":["삼투조절(osmoregulation)이란?","물과 용질의 획득·손실을 조절해 체액 농도를 좁은 범위로 유지하는 과정"],"H1-28":["혈액에서 세뇨관 내강으로 추가로 이동하는 과정을 무엇이라 하는가?","분비"],"H1-7":["네프론(nephron)의 구성 3요소는?","사구체(토리) + 보우먼주머니(Bowman's capsule) + 세뇨관(tubule)"],"H1-11":["사구체 여과를 가장 직접적으로 결정하는 힘은?","정수압과 교질삼투압의 균형"],"H1-12":["사구체 모세혈관 정수압은 여과를 촉진하는가 억제하는가?","촉진한다"],"H1-13":["보우만주머니 공간의 정수압은 여과를 촉진하는가 억제하는가?","억제한다"],"H1-14":["혈장 단백질의 교질삼투압은 여과를 촉진하는가 억제하는가?","억제한다"],"H1-26":["사구체 여과장벽 손상 시 소변에서 가장 먼저 비정상적으로 검출되기 쉬운 단백질은?","알부민"],"H1-10":["사구체 여과막의 3층은?","유창내피세포 · 사구체기저막 · 족세포 틈막(slits)"],"H1-15":["사구체에서 적혈구가 거의 여과되지 않는 가장 직접적 이유는?","크기가 너무 크기 때문이다"],"H1-16":["사구체에서 알부민이 거의 여과되지 않는 중요한 이유 두 가지는?","크기가 크고 음전하를 띠기 때문이다"],"H1-21":["사구체에서 자유롭게 여과되기 가장 쉬운 물질 유형은?","작고 비전하성인 용질"],"X-RN-28":["이눌린·크레아티닌·PAH는 각각 무엇을 측정하는 데 쓰이는가?","이눌린·크레아티닌 → GFR / PAH → 신혈장유량(여과+강한 분비로 한 번에 제거)"],"H1-24":["이눌린이 GFR 측정에 쓰이는 이유는?","자유롭게 여과되고 재흡수·분비되지 않기 때문이다"],"H1-25":["크레아티닌이 GFR 추정에 쓰이는 이유는?","여과가 주이고 분비는 소량이라 근사적으로 GFR을 반영하기 때문이다"],"H1-37":["근위세뇨관에서 포도당은 정상적으로 거의 어느 정도 재흡수되는가?","거의 100%"],"H1-22":["포도당은 사구체에서 정상적으로 여과되는가?","예"],"H1-54":["PAH가 신혈장유량 측정에 이용되는 이유는?","여과되고 강하게 분비되어 거의 한 번 통과 시 제거되기 때문이다"],"H1-30":["세뇨관에서 능동수송으로 분비되는 대표 물질은?","H⁺·K⁺·히스타민·유기산(약물·독소 등)"],"H1-55":["근위세뇨관에서 유기산·유기염기 분비의 의미는?","약물·독성물질 제거에 중요하다"],"H1-39":["근위세뇨관 초기에 포도당 재흡수에 주로 관여하는 운반체는?","SGLT2"],"H1-41":["SGLT2와 SGLT1의 Na⁺:포도당 비율·친화도 차이는?","SGLT2(초기 PCT): Na:G=1:1, 저친화·고용량(대부분 재흡수) · SGLT1(후반 PCT): Na:G=2:1, 고친화·저용량(남은 포도당)"],"H1-41#1":["SGLT2와 SGLT1의 Na⁺:포도당 비율·친화도 차이 — 「SGLT2(초기 PCT): Na:G」? (↔ SGLT1(후반 PCT): Na:G)","1:1, 저친화·고용량(대부분 재흡수)"],"X-RN-5":["SGLT2와 SGLT1은 각각 근위세뇨관의 어디에서 일하는가?","둘 다 관강막 / SGLT2 초기 PCT(Na:G=1:1·저친화·고용량), SGLT1 후반 PCT(2:1·고친화·저용량)"],"A1-160":["소장·신장에서 포도당을 흡수·재흡수하는 2차 능동수송체는?","SGLT(Na⁺-포도당 공수송체)"],"H1-35":["근위세뇨관에서 포도당 재흡수는 주로 어떤 방식인가?","Na+-포도당 공동수송(SGLT)에 의한 2차 능동수송"],"H1-62":["SGLT2 억제제가 혈당을 낮추는 직접 기전은?","근위세뇨관 포도당 재흡수를 줄여 요당 배출을 늘리는 것"],"H1-36":["근위세뇨관에서 아미노산 재흡수는 주로 어떤 방식인가?","Na+와의 2차 능동수송"],"H1-40":["근위세뇨관 말단에서 남은 포도당 재흡수에 더 관여하는 운반체는?","SGLT1"],"H1-41#2":["SGLT2와 SGLT1의 Na⁺:포도당 비율·친화도 차이 — 「SGLT1(후반 PCT): Na:G」? (↔ SGLT2(초기 PCT): Na:G)","2:1, 고친화·저용량(남은 포도당)"],"H1-42":["근위세뇨관 세포 기저외측막에서 포도당이 혈액으로 나가는 방식은?","촉진확산(GLUT)"],"X-RN-9":["근위세뇨관에서 포도당이 혈액 쪽으로 나가는 막과 방식은?","기저외측막에서 GLUT 촉진확산 (← 관강막은 SGLT2/SGLT1 2차 능동수송)"],"H1-56":["근위세뇨관에서 재흡수된 용질과 물이 혈액으로 돌아갈 때 주로 들어가는 혈관은?","주위모세혈관(peritubular capillaries)"],"H1-57":["사구체보다 주위모세혈관이 재흡수에 유리한 이유는?","정수압이 낮고 교질삼투압이 높기 때문이다"],"H1-33":["근위세뇨관 기저외측막의 핵심 펌프는?","Na+/K+-ATPase"],"H1-34":["근위세뇨관에서 Na+/K+-ATPase가 중요한 이유는?","세포 내 Na+를 낮게 유지해 여러 2차 능동수송을 가능하게 하기 때문이다"],"H1-58":["근위세뇨관에서 Na+ 재흡수의 주요 구동력은?","기저외측 Na+/K+-ATPase"],"S-RN-2":["근위세뇨관 기저외측막의 수송체 2종은?","Na+/K+-ATPase(구동력)·GLUT(포도당 촉진확산)"],"H1-38":["포도당이 소변으로 나오기 시작하는 직접적 이유는?","수송 최대치(Tm)를 초과해 재흡수기가 포화되기 때문이다"],"H1-60":["근위세뇨관 손상 시 가장 먼저 소변에 증가하기 쉬운 정상 재흡수 물질의 예는?","포도당 또는 아미노산"],"H1-61":["Fanconi syndrome의 핵심은 어느 부위 재흡수 장애인가?","근위세뇨관"]},"hubPanel":"s17u01"};
const $ = id => document.getElementById(id);
$('title').textContent = L.title; document.title = L.title;
// 요약 줄(sub)에는 물건 = 답이 다 적혀 있다 — 복습 · 시험에서는 접어 두고, 누르면 편다(GPT 추가 감사 2026-11-11 §7)
let subOpen = false;
function subShow() { const hide = (mode === 'review' || mode === 'quiz') && !subOpen && !!L.sub; $('sub').textContent = hide ? '요약 줄은 접어 두었다(답이 적혀 있다) — 누르면 편다' : (L.sub || ''); $('sub').classList.toggle('hid', hide); }
$('sub').onclick = () => { if (mode === 'review' || mode === 'quiz') { subOpen = !subOpen; subShow(); } };
$('img').src = L.img; $('img').alt = L.title;
if (L.home) $('home').href = L.home;  // 한 파일(standalone)은 저장소 밖에서 열리므로 배포 주소로
if (L.hub) $('hub').href = L.hub; else if (L.hubPanel) $('hub').href = '../sketchy.html#' + L.hubPanel;
const ov = $('ov'); ov.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
let tourEnded = false;
let mode = 'tour', i = -1, playing = false, voice = true, rate = 1.0, quizOrder = [], quizPos = 0, quizRevealed = false, shuffle = false, sess = null;
const stops = L.stops;
subShow();
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID
const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact), st.sid);
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate,
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
