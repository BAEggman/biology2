<script>
const L = {"id":"L12e","scene":"s12","part":"e","title":"운하 끝 강가의 물가와 우윳빛 길 — 비타민 C · A · D · E · K","sub":"파란 물가 부두(수용성) · 우윳빛 흰 길 + 등에 멘 노란 기름방울 넷(지용성 · 림프) · 오렌지 머리 정비사의 C 자 갈고리 세 가닥 땋기(콜라겐) · 빨간 소화기(항산화) · 피 나는 잇몸 선원 + 풀린 땋은 머리(괴혈병) · A 자 사다리 점등원(레티놀 · 시각) · 어둠 속 더듬는 사람 + 갈라진 타일(야맹증 · 상피 각화) · D 자 판자 일광욕객이 들른 벽돌집 → 콩팥 집(간 25-OH → 신장 1-OH) · 쪽문 자갈 → 흰 돌기둥(Ca²⁺ 흡수 · 뼈) · O 자 다리 아이(구루병) · E 자 걸이 소방관(기름 위 불 · 막 지질 항산화) · 부엌칼 요리사의 딱지(K · 응고) · 초록 세균이 건네는 칼(장내 세균) · 와플에 박혀 금색 자물쇠로 채운 칼 + 번지는 피(와파린)","img":"img/L12e.webp?v=f04fdf2559fb","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"운하 끝 강가 — 왼쪽은 파란 물가의 나무 부두 · 오른쪽은 초록 풀밭을 굽이도는 우윳빛 흰 길 · 등에 노란 기름방울을 멘 넷(사다리 위 점등원 · 판자 멘 일광욕객 · 소방관 · 요리사) · 그 사이를 우윳빛 흰 길이 굽이돈다 (틀)","fact":"수용성 = B군 · C(물가) / 지용성 = A · D · E · K(기름방울 넷 · 흰 길 = 림프)","hook":"물가 = 물에 녹음 · 등의 기름방울 = 기름에 녹음 · 우윳빛 길 = 유미관 · 림프","say":"회장 문을 지나 운하 끝 강가로 나와 보자. 왼쪽에는 파란 물가의 나무 부두가 있고, 오른쪽에는 초록 풀밭 사이로 우윳빛 흰 길이 굽이쳐 있다. 물가에 놓인 비타민은 물에 녹는 수용성이다. 수용성은 둘로, 앞의 의자에서 본 B군과 이곳의 C이다. 오른쪽 풀밭에 선 네 사람은 모두 등에 노란 기름방울을 멨다. 기름에 녹는 지용성 비타민 A, D, E, K이다. 이 기름방울은 운하 물길 대신 우윳빛 흰 길로 간다. 지용성 비타민이 지방에 섞여 융모의 림프관인 유미관으로 들어가 림프를 타는 모습이다. 곳간 앞에서 기름방울을 진 짐꾼 혼자 흰 오솔길로 돌아갔던 장면과 같은 길이다. 그래서 지방 흡수가 나쁘면 이 네 비타민이 함께 부족해진다.","box":null,"cards":["G1-15","G1-16","EZ-051","EZ-052","G1-137"]},{"sid":"s2","obj":"물가 부두의 오렌지 머리 정비사 — C 자로 굽은 쇠갈고리에 분홍 세 가닥을 걸어 한 줄로 단단히 땋는다","fact":"비타민 C(아스코르브산) — 콜라겐 합성(세 가닥이 꼬인 3중 나선)","hook":"오렌지 열매 머리 = C · C 자 갈고리 · 세 가닥 땋기 = 콜라겐","say":"물가 부두에 선 정비사는 머리가 오렌지다. 오렌지와 귤에서 비타민 C, 아스코르브산을 떠올리자. 손에 든 쇠갈고리는 C 자로 굽어 있다. 정비사는 여기에 분홍 세 가닥을 걸고 한 줄로 단단히 땋는다. 콜라겐은 세 가닥이 꼬인 3중 나선 단백질이고, 비타민 C는 콜라겐을 만드는 효소를 돕는다. 땋은 줄이 단단해야 피부와 잇몸, 혈관 벽도 튼튼해진다. 운하 곳간의 주황 병과는 구별하자. 그 병은 이토세포가 저장하던 비타민 A였고, 여기의 오렌지 머리는 병이 아닌 열매로 비타민 C를 나타낸다.","box":[[140,280,300,270],[150,540,100,135]],"cards":["G1-42"]},{"sid":"s3","obj":"정비사의 다른 손 — 빨간 소화기로 부두 끝에 붙은 작은 불을 끈다","fact":"비타민 C 는 물에 녹는 항산화제 — 산화라는 불을 끈다","hook":"소화기 = 항산화","say":"정비사의 다른 손에는 빨간 소화기가 있다. 부두 끝의 작은 불을 향해 하얀 분말을 뿜고 있다. 불은 산화를 뜻한다. 비타민 C는 물에 녹는 항산화제로, 이 소화기처럼 산화를 억제한다. 정비사의 두 손에서 비타민 C의 두 가지 일을 떠올리자. 한쪽은 콜라겐 땋기, 다른 쪽은 항산화다. 흰 길에서도 불을 끄는 사람이 나오지만, 그쪽은 기름 위의 불을 끈다.","box":[[105,560,335,245]],"cards":["G1-43"]},{"sid":"s4","obj":"곁의 술통에 앉은 늙은 선원 — 입과 잇몸에서 피가 흐르고 · 뒷머리의 분홍 땋은 머리가 세 가닥으로 풀려 늘어졌다 · 손에는 술잔뿐","fact":"C 결핍 = 괴혈병 — 콜라겐이 약해 잇몸 출혈 · 상처가 잘 안 아문다","hook":"피 나는 잇몸 + 풀린 세 가닥 = 괴혈병 · 술잔뿐 = 신선한 과일이 떨어졌다","say":"곁의 술통에 앉은 늙은 선원을 보자. 입과 잇몸에서 피가 흐르고, 뒷머리에 땋았던 분홍 머리는 세 가닥으로 풀려 늘어져 있다. 손에는 술잔만 있고 과일은 없다. 오랜 항해로 신선한 과일이 떨어진 뱃사람의 병, 괴혈병을 나타낸다. 비타민 C가 부족하면 콜라겐을 제대로 땋아 만들지 못한다. 그 결과 잇몸과 혈관이 약해져 출혈이 생기고, 상처도 잘 아물지 않는다.","box":[[430,290,330,460]],"cards":["G1-44"]},{"sid":"s5","obj":"기름방울을 멘 첫째 — 어스름한 회색 길가에서 눈이 왕방울만 한 점등원이 A 자 나무 사다리에 올라 가로등을 켠다 · 등에 노란 기름방울","fact":"비타민 A(레티놀) — 시각 유지 · 망막에서 레티날이 빛을 받는다","hook":"A 자 사다리 · 왕방울 눈 + 켜지는 등불 = 시각","say":"기름방울을 멘 첫 번째 사람은 어스름한 길가의 점등원이다. A 자 모양의 나무 사다리에 올라 가로등을 켜고 있으며, 눈이 왕방울만 한다. 비타민 A의 대표 활성형인 레티놀을 떠올리자. 레티놀은 레티날로 바뀌어 망막 간상세포의 로돕신에 들어가고, 빛을 받으면 11-시스에서 트랜스로 펴진다. 극장 지붕의 접시 안테나가 바로 이 변화를 나타냈다. 점등원에서 비타민 A의 두 역할, 시각 유지와 상피 건강을 연결하자.","box":[[765,40,310,740]],"cards":["G1-45","G1-46"]},{"sid":"s6","obj":"가로등 아래 그늘 — 어둠 속 남자가 두 팔을 뻗어 더듬는다 · 발밑 바닥 타일이 바싹 말라 거북등처럼 갈라졌다","fact":"A 결핍 = 야맹증 · 상피가 마르고 각질화(안구 건조 · 거친 피부)","hook":"어둠에서 더듬기 = 야맹증 · 말라 갈라진 바닥 = 상피 각화","say":"점등원 아래의 그늘은 아직 어둡다. 그 안에서 한 남자가 두 팔을 뻗어 더듬고 있다. 밝을 때는 보이지만 어두워지면 잘 보지 못하는 모습이다. 비타민 A가 부족해 로돕신을 다시 채우지 못하면 야맹증이 생긴다. 발밑 타일도 보자. 바싹 말라 거북등처럼 갈라져 있다. 비타민 A는 상피를 촉촉하게 유지하고 각질로 굳는 각질화를 막는다. 부족하면 결막과 각막이 마르고 피부가 거칠어진다.","box":[[590,700,500,444]],"cards":["G1-47","EZ-054"]},{"sid":"s7","obj":"기름방울을 멘 둘째 — 우윳빛 흰 길을 걸어 내려오는 밀짚모자 일광욕객(등에 D 자 나무 판자와 기름방울) · 그가 지나온 길 위쪽에 붉은 벽돌집과 콩팥 모양 집 · 두 집 문간에서 일꾼이 손을 흔든다","fact":"비타민 D 활성화 — 간(25-OH) 먼저, 신장(1-OH)에서 완성","hook":"붉은 벽돌집 = 간 · 콩팥 모양 집 = 신장 · 들른 순서 = 하이드록실화 순서","say":"기름방울을 멘 두 번째 사람은 밀짚모자를 쓴 일광욕객이다. 등에 D 자 나무 판자와 기름방울을 메고 흰 길을 걸어 내려온다. 비타민 D이다. 그가 지나온 길을 거슬러 보면 먼저 붉은 벽돌집인 간이, 그다음 콩팥 모양 집인 신장이 나온다. 비타민 D는 간, 신장 순서로 두 번 손질되어야 작용한다. 간에서는 25번 탄소에, 신장에서는 1번 탄소에 하이드록실기가 붙어 활성형이 된다. 신장에서 하는 마지막 손질은 부갑상선호르몬인 PTH가 켠다.","box":[[1075,160,465,280],[1120,430,215,410]],"cards":["EZ-055"]},{"sid":"s8","obj":"일광욕객이 연 쇠 쪽문으로 회색 자갈이 쏟아져 들어가고 · 문 곁의 흰 돌기둥 둘이 굵고 단단하게 섰다","fact":"활성 비타민 D — 소장의 Ca²⁺ 흡수를 늘려 뼈를 튼튼히","hook":"자갈 = Ca²⁺ · 문을 열어 들임 = 흡수 · 흰 돌기둥 = 뼈","say":"일광욕객이 쇠 쪽문을 활짝 열자 회색 자갈이 쏟아져 들어간다. 이 덱에서 자갈은 칼슘 이온이다. 활성 비타민 D가 소장에서 칼슘 이온을 흡수하는 문을 여는 장면이다. 들어온 자갈 덕분에 곁의 흰 돌기둥 둘이 굵고 단단해져 있다. 기둥은 뼈다. 칼슘 흡수와 뼈 건강을 비타민 D의 역할로 묶자. PTH가 켠 비타민 D가 소장에서 칼슘 흡수를 늘린다는 연결도 함께 떠올리면 된다.","box":[[1300,540,245,390]],"cards":["G1-48","G0-204"]},{"sid":"s9","obj":"기둥 곁의 작은 아이 — 두 다리가 바깥으로 휘어 O 자를 그린다","fact":"D 결핍 = 구루병(아이 — 다리가 휜다) · 어른은 뼈가 무르는 골연화증","hook":"O 자 다리 = 구루병","say":"기둥 곁의 작은 아이는 두 다리가 바깥쪽으로 휘어 O 자를 이루고 있다. 자라는 뼈에 칼슘이 충분히 박히지 않아 뼈가 무르고, 몸무게를 받으면서 다리가 휘는 모습이다. 비타민 D 결핍으로 아이에게 생기는 구루병이다. 어른에게서는 다 자란 뼈가 물러지는 골연화증과 뼈 약화가 나타난다. 햇볕을 쬐면 피부에서도 비타민 D가 만들어진다는 사실을 떠올려 보자. 그래서 비타민 D를 나타내는 인물이 일광욕객이다.","box":[[1490,670,125,255]],"cards":["G1-49"]},{"sid":"s10","obj":"기름방울을 멘 셋째 — 노란 헬멧 소방관이 벽의 E 자 호스 걸이에서 호스를 뽑아 노란 기름방울 위에 붙은 불을 끈다","fact":"비타민 E — 기름에 녹는 항산화제 · 막 지질이 산화되지 않게 지킨다","hook":"E 자 걸이 · 기름 위의 불 끄기 = 지질 산화 막기","say":"기름방울을 멘 세 번째 사람은 노란 헬멧을 쓴 소방관이다. 벽의 호스 걸이가 E 자 모양이므로 비타민 E를 떠올릴 수 있다. 소방관이 끄는 불은 노란 기름방울 위에서 타오른다. 비타민 E는 기름에 녹는 항산화제로, 세포막 지질이 산화되는 것을 막는다. 물가의 소화기 C와 비교하자. 비타민 C는 물속의 불을, 비타민 E는 기름 위의 불을 끈다.","box":[[1540,210,470,470]],"cards":["G1-50"]},{"sid":"s11","obj":"기름방울을 멘 넷째 — 흰 길 끝에서 부엌칼을 든 흰 모자 요리사가 손가락을 베었다 · 흰 옷에 피가 두어 방울 떨어지고 손끝은 곧바로 검붉은 딱지로 굳었다","fact":"비타민 K — 혈액응고 · 간에서 응고 인자 2 · 7 · 9 · 10 합성을 돕는다","hook":"부엌칼 = K · 손끝의 검붉은 딱지 = 응고","say":"기름방울을 멘 네 번째 사람은 흰 길 끝의 흰 모자 요리사다. 손에 든 부엌칼에서 비타민 K를 떠올리자. 이 덱에서는 칼이 언제나 K이다. 요리사가 칼질하다 손가락을 베었지만, 흰 옷에 피가 두어 방울 떨어진 뒤 손끝이 곧 검붉은 딱지로 굳는다. 비타민 K는 간에서 응고 인자를 만드는 데 필요하다. 해당 인자는 2, 7, 9, 10이다. 거꾸로 10, 9, 7, 2를 이어 천구백칠십이로 기억하자. 피가 굳는 데 필요한 혈소판, 칼슘 이온, 비타민 K도 함께 묶어 떠올리면 된다.","box":[[1640,550,300,540]],"cards":["G1-51","EZ-053","H0-193"]},{"sid":"s12","obj":"요리사 발치 — 웃는 초록 알약 모양 세균 둘이 칼 한 자루를 더 건넨다","fact":"장내 세균이 비타민 K(그리고 비오틴 · 엽산)를 만들어 준다","hook":"세균이 건네는 칼 = 장내 세균이 만든 K","say":"요리사 발치에는 초록 알약 모양의 세균 둘이 있다. 웃으면서 칼 한 자루를 더 건네고 있다. 대장의 장내 세균이 비타민 K를 만들어 주는 장면이다. 장내 세균이 아직 자리 잡지 않은 갓난아기는 비타민 K가 부족해지기 쉬워 태어나자마자 주사를 맞는다. 장내 세균이 만들어 주는 비타민은 비타민 K, 비오틴, 엽산 세 가지로 기억하자. 비오틴은 조제실의 B7, 엽산은 의자의 B9과 연결된다.","box":[[1520,920,200,180]],"cards":["G1-52"]},{"sid":"s13","obj":"길 끝 바닥 — 칼 한 자루가 네모 홈 와플에 날째 박혀 금색 자물쇠로 채워졌다 · 그 앞의 피 웅덩이가 멎지 않고 번진다","fact":"와파린 — 비타민 K 의 기능을 막는 항응고제 → 피가 잘 안 멎는다","hook":"와플 = 와파린 · 금색 자물쇠 = 약으로 막음 · 묶인 칼 = K 를 못 씀","say":"길 끝 바닥을 보자. 깊은 네모 홈이 있는 와플에 칼날이 박혀 있고, 금색 자물쇠가 와플과 칼을 함께 묶고 있다. 와플은 와파린, 금색 자물쇠는 약에 의한 억제를 뜻한다. 와파린은 비타민 K의 일을 막는 항응고제다. 칼을 쓰지 못해 응고 인자를 만들지 못하는 상황을 앞쪽의 멎지 않는 피 웅덩이로 나타냈다. 와파린은 원래 쥐약으로도 쓰이던 약이다. 해독제는 비타민 K이다. 칼을 다시 쥐여 주어 자물쇠를 푼다고 연결해 기억하자.","box":[[1825,920,223,210]],"cards":["H0-197"]},{"sid":"s14","obj":"되짚기 — 물가의 오렌지 하나(갈고리 · 소화기 · 피 나는 선원) / 기름방울을 멘 넷(사다리 · 판자 · 호스 걸이 · 부엌칼)","fact":"C 괴혈병 · A 야맹증 · D 구루병 · E 항산화 · K 응고(와파린이 막음)","hook":"물가 하나 · 기름방울 넷 — A · D · E · K 는 왼쪽부터","say":"전체 장면을 다시 짚어 보자. 물가의 오렌지는 수용성 비타민 C이다. 갈고리로 콜라겐을 땋고 소화기로 산화를 막으며, 부족하면 잇몸에서 피가 나는 괴혈병이 생긴다. 풀밭에서는 기름방울을 멘 네 사람이 왼쪽부터 지용성 A, D, E, K를 나타낸다. 사다리 A는 시각과 상피, 결핍 시 야맹증이다. 판자 D는 간과 신장을 거쳐 칼슘 흡수를 돕고, 부족하면 O 자 다리의 구루병이 생긴다. 호스 걸이 E는 기름의 불을 끄는 항산화다. 부엌칼 K는 응고에 필요하며 장내 세균이 만들어 주고 와파린이 막는다.","box":[[140,280,620,520],[765,40,310,740],[1075,160,470,770],[1540,210,470,470],[1640,550,408,580]],"cards":[]}],"cq":{"G1-15":["수용성 비타민에 속하는 것은?","비타민 B군과 비타민 C"],"G1-16":["지용성 비타민 4가지는?","A, D, E, K"],"EZ-051":["지용성 비타민 4가지는?","A · D · E · K"],"EZ-052":["비타민 C는 지용성? 수용성?","수용성 (결핍=괴혈병)"],"G1-137":["지용성 비타민은 주로 어느 경로로 흡수되는가?","유미관/림프 경로"],"G1-42":["비타민 C의 이름은?","아스코르브산"],"G1-43":["비타민 C의 핵심 기능 두 가지는?","콜라겐 합성과 항산화"],"G1-44":["비타민 C 결핍의 대표 질환은?","괴혈병"],"G1-45":["비타민 A의 대표 활성형은?","레티놀"],"G1-46":["비타민 A의 대표 기능 두 가지는?","시각 유지와 상피 건강"],"G1-47":["비타민 A 결핍의 대표 증상은?","야맹증"],"EZ-054":["상피 각화(keratinization)를 막고 상피 유지에 필요한 비타민은?","비타민 A"],"EZ-055":["비타민 D가 활성형으로 하이드록실화되는 두 장소는?","간(25-OH) → 신장(1-OH)"],"G1-48":["비타민 D의 대표 기능은?","칼슘 흡수와 뼈 건강"],"G0-204":["PTH가 활성화한 비타민 D의 작용과 활성화 경로는?","소장에서 Ca²⁺ 흡수 촉진 · 비타민 D 활성화는 간에서 시작해 신장에서 완성"],"G1-49":["비타민 D 결핍의 대표 결과는?","구루병 또는 뼈 약화"],"G1-50":["비타민 E의 대표 기능은?","항산화"],"G1-51":["비타민 K의 대표 기능은?","혈액응고"],"EZ-053":["비타민 K의 기능은?","혈액응고(응고인자 2·7·9·10 합성 조효소)"],"H0-193":["혈액응고에 필요한 대표 인자 세 가지는?","혈소판 · Ca2+ · 비타민 K"],"G1-52":["장내 미생물이 만들어 주는 대표 비타민 세 가지는?","비타민 K · 비오틴 · 엽산"],"H0-197":["와파린의 작용은?","비타민 K 기능 억제"]},"hubPanel":null};

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';

try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
