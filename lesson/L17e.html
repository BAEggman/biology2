const L = {"id":"L17e","scene":"s17","part":"e","title":"꺾인 뒤 수로와 둑 위 운하 — 원위세뇨관과 집합관 둑","sub":"NCC · 티아지드 · 희석 분절 · PTH(인산 ↓ · Ca ↑) · 주세포(ENaC · 알도스테론 · ROMK) · 사이세포(α 산 · β 염기)","img":"img/L17e.webp?v=d8e9607b3e08","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"꺾인 뒤 수로가 둑 위 운하로 이어진다","fact":"초기 원위세뇨관 → 집합관(피질) · 네모 수로 = 오줌길","hook":"헨레고리 꼭대기에서 꺾인 뒤의 길","say":"헨레고리 꼭대기에서 꺾인 네모 수로의 왼쪽이 초기 원위세뇨관이고 오른쪽은 피질 집합관이다. 아래 푸른 운하는 관강, 위쪽 적혈구가 지나가는 붉은 관은 모세혈관이다. 둑의 세 칸은 운하와 혈액 사이의 상피세포다. 각 칸의 모양을 보고 무엇을 어느 쪽으로 옮기는지 따라가자.","box":null,"src":["s17u02#0","s17u03#0"],"cards":["X-RN-14"]},{"sid":"s2","obj":"둘째 톱니 기계 — 자루 하나 · 염소 하나 · 못에 걸린 칼에 가위표","fact":"NCC — Na⁺-Cl⁻ 공동수송(1:1) · K⁺ 없음 · 초기 원위세뇨관 관강막","hook":"칼이 빠진 기계 = NCC(굵은 상행지 기계는 소금 · 칼 · 염소 둘)","say":"꺾인 뒤 수로에 매달린 둘째 톱니 기계. 활송로로 소금 자루 하나, 염소 한 마리만 나온다. 칼은 곁 벽의 못에 걸려 가위표다. 엔씨씨, 나트륨 염소 공동수송체. 자리는 관강막이고, 돌리는 힘은 기저외측막의 나트륨 칼륨 펌프다. 굵은 상행지 기계와 닮았지만 칼이 없고 염소도 하나. 기출은 이 둘을 바꿔 낸다.","box":[[300,640,720,500],[40,600,220,420]],"src":["s17u02#12","s17u02#16"],"cards":["H1-108","H1-109","X-RN-3","S-RN-16","H1-119","S-RN-6","H1-8#5"]},{"sid":"s3","obj":"자물쇠에 매달린 티백","fact":"티아지드계 이뇨제가 NCC를 막는다(루프 = 굵은 상행지 · 티아지드 = 원위)","hook":"티백 = 티아지드 · 자물쇠가 어느 기계에 걸렸는지가 약을 정한다","say":"둘째 기계 크랭크의 금색 자물쇠에 티백이 매달렸다. 티백, 티아지드. 티아지드계 이뇨제가 엔씨씨를 막는다. 굵은 상행지 기계의 자물쇠는 루프 이뇨제, 이 기계의 자물쇠는 티아지드.","box":[[300,840,170,285]],"src":["s17u02#13"],"cards":["H1-110","H1-111","H1-118","X-RN-19"]},{"sid":"s4","obj":"꺾인 뒤도 역청 벽 · 물이 오른쪽으로 갈수록 옅다","fact":"희석 분절 — 염은 되찾고 물은 못 나가니 관강액이 더 묽어진다","hook":"역청 = 물 못 나감 · 옅어짐 = 희석","say":"꺾인 뒤 수로도 구멍 없이 역청을 메웠고, 속 물빛이 오른쪽으로 갈수록 옅다. 희석 분절. 염은 되찾는데 물이 못 따라 나가니 관강액이 들어온 물보다 묽어진다. 염은 나간다는 걸 잊지 말 것.","box":[0,280,1200,340],"src":["s17u02#14"],"cards":["H1-107","H1-112","H1-115","H1-116","H1-121","X-RN-13"]},{"sid":"s5","obj":"수로 위 버튼 넷 상자 — 줄 둘이 나간다","fact":"PTH(부갑상선호르몬) — 한 호르몬이 두 자리에서 반대로 일한다","hook":"버튼 넷 = 부갑상선 넷","say":"수로 위에 매달린 상자에 둥근 버튼이 넷. 부갑상선 넷, 거기서 나오는 부갑상선호르몬, 피티에이치다. 상자에서 줄이 둘 나가 서로 다른 것을 든다. 한 호르몬이 두 자리에서 반대로 일한다.","box":[260,60,180,160],"src":["s17u02#9"],"cards":[]},{"sid":"s6","obj":"왼 줄 — 빈 뜰채가 물 밖에 들리고 성냥이 떠내려간다","fact":"PTH: 근위세뇨관 인산 재흡수 ↓ → 인산이 오줌으로","hook":"성냥의 인 = 인산 · 뜰채가 들려 못 건진다","say":"왼 줄이 뜰채를 물 밖으로 들어 올려 빈 채 물만 떨구고, 수로 속에 빨간 머리 성냥개비들이 떠내려간다. 성냥의 인이 인산. 피티에이치는 근위세뇨관에서 인산 재흡수를 줄인다. 뜰채는 이 수로 위에 걸렸지만 일터는 물길을 거슬러 올라간 상류, 근위세뇨관이다. 거기서 못 건진 성냥이 여기까지 떠내려온다. 못 건지니 인산이 오줌으로 나간다.","box":[[510,120,290,265],[380,380,420,120]],"src":["s17u02#10"],"cards":[]},{"sid":"s7","obj":"오른 줄 — 자갈 바구니를 가득 들어 올린다","fact":"PTH: 원위세뇨관 Ca²⁺ 재흡수 ↑ — 칼슘은 올리고 인산은 버린다","hook":"자갈 = Ca²⁺(덱 전체 약속)","say":"오른 줄은 꺾인 뒤 수로에서 자갈 바구니를 가득 담아 끌어올린다. 자갈은 칼슘. 피티에이치는 원위세뇨관에서 칼슘 재흡수를 늘린다. 칼슘은 올리고 인산은 버린다. 인산이 많으면 칼슘과 엉겨 가라앉으니까.","box":[840,180,220,240],"src":["s17u02#11"],"cards":["X-RN-17","H1-113","H1-114","H1-120"]},{"sid":"s8","obj":"왕관 걸린 첫 칸 안의 체로 소금을 건지는 짐꾼, 옆의 큰 쇠 열쇠, 푸른 운하에서 올라오는 소금","fact":"주세포 관강막의 ENaC로 Na⁺ 재흡수 · 알도스테론은 ENaC와 기저외측 Na⁺·K⁺ 펌프를 늘린다","hook":"왕관의 주인 = 주세포 · 소금 체 = ENaC · 먼 곳에서 온 큰 쇠 열쇠 = 알도스테론","say":"왕관을 단 첫 칸은 주인 주 자의 주세포다. 체를 든 짐꾼은 운하에서 소금을 건져 올린다. 후기 원위부와 피질 집합관 주세포의 관강막에서 ENaC를 통해 나트륨이 세포 안으로 들어온다. 기저외측 나트륨·칼륨 펌프가 나트륨을 간질로 내보낸다. 먼 곳에서 온 열쇠는 부신피질의 알도스테론이다. 이 호르몬은 나트륨 통로와 펌프의 발현·활성을 높인다. ENaC나 알도스테론의 작용을 막으면 칼륨 보존성 이뇨 효과가 난다.","box":[[1166,260,224,209],[1185,467,116,146]],"src":["s17u03#1"],"ask":"왕관 아래 체가 건지는 이온은? 이 세포의 이름, 관강막 통로, 알도스테론이 늘리는 기저외측 펌프를 순서대로 말해 보자.","cards":["H1-126#1","H1-123","X-RN-1","S-RN-14","H1-122","H1-136","H1-187"]},{"sid":"s9","obj":"왕관 칸 오른쪽 로마 병사가 칼을 푸른 운하 쪽으로 민다","fact":"주세포 관강막의 ROMK로 K⁺를 관강으로 분비 · 알도스테론은 K⁺ 분비를 촉진한다","hook":"로마 투구 = ROM · 칼 = K · 관 안으로 = 분비","say":"같은 왕관 칸에서 로마 병사가 운하로 칼을 내민다. 로마와 칼을 붙이면 ROMK, 칼륨 통로다. 세포에서 관강을 향하는 칼은 칼륨 분비다. 주세포에서 알도스테론은 ENaC를 통한 나트륨 재흡수와 기저외측 나트륨·칼륨 펌프의 활성을 높여 칼륨 분비를 촉진한다.","box":[[1390,296,152,203],[1346,495,102,135]],"src":["s17u03#2"],"ask":"왕관 칸의 로마 병사가 움직이는 이온은? 어느 막의 어떤 통로로 어느 쪽에 분비되는가?","cards":["H1-125","H1-126#3"]},{"sid":"s10","obj":"둘째 칸의 흰 알 · 운하로 떨어지는 레몬 · 붉은 핏줄 쪽으로 올라가는 분필","fact":"α(A형) 사이세포는 H⁺를 관강으로 분비하고 HCO₃⁻를 간질·혈액 쪽으로 보낸다","hook":"알 = α · 신 레몬 = 산 · 흰 분필 = 중탄산염 단서","say":"가운데 흰 알은 알파 사이세포다. 신 레몬이 아래의 푸른 운하로 떨어지는 쪽을 먼저 짚자. 관강막의 양성자 펌프가 수소 이온을 소변 쪽으로 분비한다. 반대편 위쪽에서 흰 분필이 붉은 핏줄 쪽으로 올라간다. 이것은 중탄산 이온이 기저외측막의 AE1 염소·중탄산 교환기를 거쳐 간질에서 혈액으로 돌아가는 단서다. 몸이 산성으로 기울 때 이 세포가 산 배설을 늘린다.","box":[[1563,91,197,302],[1655,393,102,298]],"src":["s17u03#3"],"ask":"알이 있는 칸은 어떤 사이세포인가? 레몬과 분필을 각각 이온으로 바꾸고, 둘의 목적지와 관강막의 펌프를 말해 보자.","cards":["S-RN-9","H1-141","H1-143","X-RN-23","X-RN-22"]},{"sid":"s11","obj":"셋째 칸의 풀린 베 두루마리 · 운하로 떨어지는 분필 · 붉은 핏줄 쪽으로 올라가는 레몬","fact":"β(B형) 사이세포는 HCO₃⁻를 관강으로 분비하고 H⁺를 간질·혈액 쪽으로 보낸다","hook":"베 = β · 분필은 중탄산염의 기억 표지 · 알과 베는 산·염기의 출구가 반대","say":"오른쪽 칸의 베 두루마리는 베타 사이세포다. 흰 분필이 아래 운하로 떨어진다. 관강막의 펜드린은 염소 이온을 받으면서 중탄산 이온을 관강으로 분비한다. 위쪽 레몬은 기저외측 양성자 펌프가 수소 이온을 간질 쪽으로 보내는 경로다. 몸이 알칼리성으로 기울면 중탄산 배설이 보상에 도움이 된다. 두 사이세포에서 레몬과 분필은 같은 물질을 뜻하고, 어느 쪽으로 가는지가 바뀐다.","box":[[1805,91,235,294],[1908,433,127,309]],"src":["s17u03#4"],"ask":"베가 있는 칸에서는 어느 이온이 관강으로 나가며 어떤 교환기를 쓰는가? 양성자 펌프는 어느 쪽에 있는가?","cards":["S-RN-9","H1-142","H1-157"]},{"sid":"s12","obj":"한 운하를 마주한 왕관·알·베 세 칸, 그 위로 이어진 붉은 핏줄","fact":"왕관 주세포는 Na⁺·K⁺·물 · 알과 베 사이세포는 산·염기 조절을 분담한다","hook":"왕관의 주인 · 사이에 선 알과 베 · 운하 = 관강 · 위쪽 붉은 길 = 모세혈관","say":"왕관은 주세포다. ENaC로 나트륨을 재흡수하고 ROMK로 칼륨을 분비하며, ADH에 반응해 물도 재흡수한다. 물길은 다음 수갱 그림의 움직이는 창틀이다. 알과 베는 사이세포의 두 유형으로 산·염기를 조절한다. 알파는 운하로 산을, 베타는 운하로 중탄산염을 보낸다. 먼저 세 칸을 지목하고, 그다음 혈액과 관강에서 각 물질의 방향을 짚어 보자.","box":[[1157,116,393,493],[1166,152,381,99],[1555,74,235,630],[1790,66,254,685],[1155,87,129,55]],"src":["s17u03#5"],"ask":"왕관·알·베를 차례로 세포 이름으로 바꾸고, 각 세포가 소변 쪽으로 내보내는 대표 이온을 하나씩 말해 보자. ADH로 물 통로를 늘리는 칸은?","cards":["X-RN-24","H1-158","S-RN-7"]}],"cq":{"X-RN-14":["물 투과성이 ADH에 의해 조절되는 분절은?","집합관 — ADH가 없으면 물 투과성이 낮다 (다른 분절의 물 투과성은 ADH 비의존)"],"H1-108":["초기 원위세뇨관 관강막의 대표 수송체는?","NCC"],"H1-109":["NCC의 의미는?","Na+-Cl- 공동수송체"],"X-RN-3":["NCC가 있는 분절과 막은?","초기 원위세뇨관의 관강막 (← 굵은 상행각 NKCC2와 혼동 주의)"],"S-RN-16":["이뇨제 3계열의 표적 수송체는?","loop→NKCC2 / thiazide→NCC / K보존성→ENaC"],"H1-119":["초기 원위세뇨관의 핵심 임상 포인트를 한 문장으로 쓰면?","NCC를 통한 NaCl 재흡수와 PTH에 의한 Ca2+ 재흡수 조절"],"S-RN-6":["초기 원위세뇨관의 관강막·기저외측막·호르몬은?","관강막 NCC / 기저외측 Na+/K+-ATPase / PTH→Ca2+↑"],"H1-8#5":["세뇨관에서 여과액이 흐르는 순서는?","원위세뇨관"],"H1-110":["thiazide 이뇨제의 대표 작용 부위는?","초기 원위세뇨관"],"H1-111":["thiazide의 직접 표적은?","NCC"],"H1-118":["thiazide 투여 시 소변 NaCl 배설이 늘어나는 직접 이유는?","NCC 억제로 NaCl 재흡수가 줄기 때문이다"],"X-RN-19":["NCC를 표적으로 하는 이뇨제와 그 작용 부위는?","thiazide / 초기 원위세뇨관 (← 굵은 상행각에 작용하는 것은 loop diuretic)"],"H1-107":["초기 원위세뇨관(early DCT)의 대표 기능은?","NaCl 재흡수와 관강액 추가 희석"],"H1-112":["초기 원위세뇨관도 희석 분절인 이유는?","NaCl은 재흡수하지만 물 투과성이 낮기 때문이다"],"H1-115":["초기 원위세뇨관에서 물 투과성이 낮다는 의미는?","용질 재흡수 후 관강액이 더 묽어진다는 뜻"],"H1-116":["굵은 상행각과 초기 원위세뇨관의 공통점은?","둘 다 염 재흡수에 비해 물 투과성이 낮아 관강액을 희석시킨다"],"H1-121":["초기 원위세뇨관 기능이 강하면 관강액 삼투농도는 어떻게 되는가?","더 감소한다"],"X-RN-13":["초기 원위세뇨관은 물에 투과성인가?","아니다 — 물 투과성이 낮아 관강액이 더 묽어진다(희석 분절)"],"X-RN-17":["PTH가 Ca2+ 재흡수를 늘리는 분절과 인산 재흡수를 줄이는 분절은?","Ca2+ 재흡수↑ 초기 원위세뇨관 / 인산 재흡수↓ 근위세뇨관"],"H1-113":["초기 원위세뇨관에서 Ca2+ 재흡수는 어떤 호르몬에 의해 증가하는가?","PTH"],"H1-114":["PTH가 초기 원위세뇨관에서 증가시키는 물질 이동은?","Ca2+ 재흡수"],"H1-120":["초기 원위세뇨관에서 Ca2+ 재흡수 증가가 혈중 Ca2+에 미치는 영향은?","증가시키는 방향"],"H1-126#1":["알도스테론은 주세포에서 무엇을 증가시키는가?","ENaC"],"H1-123":["주세포 관강막의 대표 Na+ 통로는?","ENaC"],"X-RN-1":["ENaC이 있는 분절과 막은?","후기 원위세뇨관·피질 집합관 주세포의 관강막 (← 기저외측막 Na+/K+-ATPase와 혼동 주의)"],"S-RN-14":["알도스테론의 작용 세포와 증가시키는 3가지는?","주세포: ENaC·Na+/K+-ATPase·K+ 분비"],"H1-122":["후기 원위세뇨관과 피질 집합관의 주세포(principal cell)가 주로 다루는 물질은?","Na+, K+, 물"],"H1-136":["주세포 기능을 한 문장으로 요약하면?","Na+를 재흡수하고 K+를 분비하며 ADH에 따라 물 투과성을 조절한다"],"H1-187":["고칼륨혈증에서 신장이 보상적으로 증가시키는 호르몬과 세포는?","알도스테론 · 주세포"],"H1-125":["주세포에서 K+가 관강으로 나가는 대표 통로는?","ROMK"],"H1-126#3":["알도스테론은 주세포에서 무엇을 증가시키는가?","K+ 분비"],"S-RN-9":["A형·B형 사이세포의 이동 방향 차이는?","A형: H+ 분비·HCO3- 재흡수 / B형: 정반대"],"H1-141":["A형 사이세포(alpha-intercalated cell)의 핵심 기능은?","H+ 분비와 HCO3- 재흡수"],"H1-143":["산증에서 특히 활성화되기 쉬운 세포는?","A형 사이세포"],"X-RN-23":["H+-ATPase 또는 H+/K+-ATPase를 관강막에 두는 세포는?","A형 사이세포 (← 주세포 관강막은 ENaC·ROMK·AQP2)"],"X-RN-22":["산증과 알칼리증에서 각각 활성화되는 집합관 세포는?","산증 → A형 사이세포(H+ 분비·HCO3- 재흡수) / 알칼리증 → B형 사이세포(HCO3- 분비)"],"H1-142":["B형 사이세포(beta-intercalated cell)의 핵심 기능은?","HCO3- 분비와 H+ 재흡수"],"H1-157":["B형 사이세포 활성 증가가 혈액에 미치는 직접 효과는?","HCO3- 감소와 알칼리부하 완화"],"X-RN-24":["Na+·K+·물을 다루는 세포와 산-염기를 다루는 세포는?","주세포(Na+ 재흡수·K+ 분비·ADH 의존 물) / 사이세포(산-염기 조절)"],"H1-158":["사이세포는 주세포와 달리 무엇에 더 특화되어 있는가?","산-염기 조절"],"S-RN-7":["집합관 주세포 관강막의 수송체 3종은?","ENaC(Na+ 흡수)·ROMK(K+ 분비)·AQP2(물)"]},"hubPanel":"s17u02"};

const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact));
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
function speak(t) {
  t = ttsNorm(t);
  const my = ++speakSeq, at = i;
  const advance = (ms) => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, ms);
  if (!('speechSynthesis' in window)) { if (playing) advance(3500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = () => { if (started) advance(700); };
  u.onerror = () => { if (!started) advance(3000); };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started && my === speakSeq) { speechSynthesis.cancel(); advance(3000); } }, 2500);  // 목소리가 없으면 글만 3초
}
function go(k) {
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) setTimeout(() => { if (playing) next(); }, 3500);
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; speechSynthesis && speechSynthesis.cancel(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i + 1); else speechSynthesis && speechSynthesis.cancel(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) speechSynthesis && speechSynthesis.cancel(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
</script>
</body>
