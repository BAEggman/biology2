<script>
const L = {"id":"L16d","scene":"s16","part":"d","title":"교환국 앞 거리 — 신호가 닿는 여섯 길 · 뉴런 · 반사 · 국소 조절자 · 호르몬 세 부류","sub":"전봇대 검은 전선의 번쩍 불꽃(신경 · 빠르고 짧게) · 붉은 물길에 떠가는 흰 봉투(호르몬 · 느리지만 오래) · 관 없는 양파 샘 집(내분비) vs 홈통 집(외분비) · 꼴 맞는 우편함 집만 불 켜짐(표적세포) · 잔가지 팔 · 분홍 몸통 · 검은 꼬리 · 틈 너머 물방울(뉴런 · 시냅스) + 테이프 · 도시락 일꾼과 받침 막대(아교) · 물길에 흰 V 를 떨구는 작은 뉴런(신경내분비 · ADH) · 부푼 물길과 장막을 뚫는 노 젓는 사람(NO) · 울타리 너머 종이비행기(주변분비) · 제 이마로 돌아온 종이비행기(자가분비) · 쪽지 받고 크는 장난감 병정(사이토카인) · 기름으로 찍은 별 + 금색 자물쇠(프로스타글란딘 · 아스피린) · 길바닥 단추 → 기둥 타고 오르는 줄 → 꼭대기 뇌 → 무릎에 묶인 둘째 줄 → 홱 드는 다리(반사) · 냄새 줄 따라가는 개미(페로몬) · 구슬 사슬 · 고리 넷 · 작은 고리(호르몬 세 부류)","img":"img/L16d.webp?v=43e379b6c5c5","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"교환국 앞 거리 — 위로는 전봇대 사이 검은 전선 · 그 위를 번쩍 내닫는 노란 불꽃 / 아래로는 붉은 물길 · 물을 따라 천천히 떠가는 흰 봉투 (틀)","fact":"조절 · 통합의 두 체계 — 신경계(빠르고 짧게) · 내분비계(느리지만 오래) · 둘 다 항상성","hook":"검은 전선의 불꽃 = 신경 · 붉은 물길의 봉투 = 호르몬","say":"전화 교환국 앞 거리에서 세포들이 소식을 주고받는 길을 보자. 위쪽 전봇대 사이의 검은 전선으로 노란 불꽃이 빠르게 달리는 것은 신경계다. 아래쪽 붉은 물길을 따라 흰 봉투가 천천히 떠가는 것은 혈액으로 호르몬을 보내는 내분비계다. 둘은 함께 몸의 기능을 조절하고 항상성을 지키지만, 전달 경로와 속도가 다르다. 신경 신호는 빠르고 짧게, 호르몬 신호는 느리지만 오래 작용한다. 이 거리에는 내분비, 주변분비, 자가분비, 시냅스, 신경내분비, 페로몬의 여섯 경로가 있다. 거리로 비교하면 손을 맞대는 직접 접촉이 가장 가깝고, 이웃으로 퍼지는 측분비인 주변분비·paracrine, 시냅스, 혈액으로 멀리 가는 내분비·endocrine를 이어서 볼 수 있다. 자신에게 돌아오는 자가분비도 구분하자.","box":[[220,30,170,100],[0,925,600,195]],"cards":["G0-15","G0-99","G0-100","G0-47","Q0-1","S-SG-14","B0-197"]},{"sid":"s2","obj":"왼쪽 — 관이 하나도 없는 양파 꼴 샘 집이 흰 봉투를 붉은 물길로 곧장 떨어뜨린다 / 곁의 집은 홈통으로 맑은 물을 풀밭과 길바닥에 쏟는다","fact":"내분비샘 = 관 없이 체액(혈류)으로 · 외분비샘 = 관을 거쳐 몸의 겉이나 관 안쪽으로","hook":"관 없이 물길로 = 내분비 · 홈통으로 길바닥에 = 외분비","say":"왼쪽 양파 모양의 샘 집에는 관이 없다. 흰 봉투를 붉은 물길로 바로 떨어뜨리는 내분비샘이다. 호르몬을 관 없이 체액, 즉 혈액으로 내보내면 온몸으로 퍼진다. 혈류를 통해 전신에 전달된다는 설명은 내분비 신호와 연결하자. 옆집은 홈통으로 맑은 물을 풀밭과 길바닥에 쏟는다. 땀샘이나 침샘처럼 관을 통해 몸의 표면이나 관 안쪽으로 분비하는 외분비샘이다. 이 물은 붉은 물길로 들어가지 않는다. 외분비는 몸 밖으로, 내분비는 혈액을 타고 몸 안으로 향한다는 대비다.","box":[[0,385,350,530],[200,200,345,455]],"cards":["G0-115","G0-156","B0-12"]},{"sid":"s3","obj":"물길 위쪽 작은 집 셋 — 지붕 밑 우편함 꼴이 저마다 다르다 · 봉투 꼴 우편함 집만 봉투를 받아 창에 노란 불이 켜졌고 · 나머지 둘은 어둡다","fact":"표적세포 = 그 호르몬의 수용체를 가진 세포 — 수용체 없는 세포는 거의 반응하지 않는다","hook":"꼴 맞는 우편함 = 수용체 · 불 켜진 집 = 표적세포","say":"물길 위쪽의 작은 집 셋은 우편함 모양이 서로 다르다. 봉투는 모든 집 앞을 지나가지만, 봉투와 맞는 우편함을 가진 집만 이를 받아 창에 노란 불이 켜진다. 나머지 둘은 어둡다. 호르몬이 혈액을 따라 거의 모든 세포에 도달하더라도, 그 호르몬에 맞는 수용체가 있는 세포만 반응한다. 이들이 표적세포다. 수용체가 없는 세포는 호르몬이 지나가도 거의 영향을 받지 않는다.","box":[505,495,495,245],"cards":["G0-96","G0-97","G0-98"]},{"sid":"s4","obj":"가운데 위 — 분홍 몸통(둥근 창)의 한쪽에 잔가지 팔이 수북하고 · 반대쪽으로 긴 검은 꼬리 · 꼬리 끝 가지 끝 방울에서 옆집 쪽으로 물방울이 뿜어진다 · 위로 한 방향 분홍 화살 · 꼬마 일꾼들이 꼬리에 흰 테이프를 감고 · 도시락을 건넨다 · 몸통 밑은 나무 막대가 받친다","fact":"뉴런 = 수상돌기 · 세포체 · 축삭 · 시냅스는 화학 신호로 한 방향 · 아교세포는 영양 · 절연 · 보조","hook":"잔가지 팔 = 수상돌기 · 분홍 몸통 = 세포체 · 검은 꼬리 = 축삭 · 물방울 = 시냅스 · 꼬마 일꾼 · 받침 막대 = 아교","say":"거리 가운데 위쪽의 분홍 몸통을 가진 짐승은 뉴런이다. 한쪽의 잔가지 같은 여러 팔은 신호를 받는 수상돌기, 둥근 창이 있는 몸통은 세포체다. 반대쪽의 긴 검은 꼬리는 신호를 내보내는 축삭이다. 꼬리 끝 가지의 방울이 옆집으로 물방울을 뿜는 곳은 시냅스다. 뉴런이 신경전달물질을 내보내 다음 세포로 신호를 전달하는 모습이다. 따라서 신경 신호가 항상 전기 신호인 것은 아니며, 시냅스에서는 화학 신호가 된다. 위의 분홍 화살표가 한쪽만 가리키듯 시냅스 신호는 한 방향이다. 꼬마 일꾼들은 신경아교세포다. 꼬리에 흰 테이프를 감아 절연하고, 도시락으로 영양을 공급하며, 몸통 밑의 나무 막대처럼 뉴런을 지지한다.","box":[595,105,895,385],"cards":["G0-109","G0-44","G0-45","G0-46","G0-48"]},{"sid":"s5","obj":"물길 가의 작은 분홍 뉴런 — 검은 꼬리를 붉은 물길 위로 휘어 내렸고 · 꼬리 끝 방울에서 흰 V 자 조각이 물로 떨어진다","fact":"신경내분비 = 뉴런이 신경호르몬을 혈액으로 바로 분비 · 대표 ADH","hook":"물길로 흰 V 를 떨구는 뉴런 = 신경내분비(ADH)","say":"물길 옆 작은 분홍 뉴런은 검은 꼬리를 붉은 물길 위로 굽혀 놓았다. 꼬리 끝에서 떨어지는 흰 V자 조각은 이 덱에서 바소프레신, ADH이다. 뉴런이 이웃 세포 대신 혈액으로 신호를 보내는 신경내분비다. 뉴런이 만든 신경호르몬을 축삭 말단에서 혈액으로 직접 분비한다. 시상하부 뉴런이 만든 ADH를 뇌하수체 후엽에서 혈액으로 내보내는 경우가 대표다.","box":[505,745,375,290],"cards":["G0-110","G0-111","Q0-2"]},{"sid":"s6","obj":"붉은 물길이 통처럼 넓게 부푼 자리 — 작은 배에서 노 젓는 사람 · 물길을 가로지른 투명한 장막을 찢지 않고 그대로 지나간다","fact":"산화질소(NO) — 기체라 막을 쉽게 통과 · 혈관 평활근 이완 → 혈관 확장","hook":"노 젓는 사람 = NO · 넓게 부푼 물길 = 혈관 확장 · 장막을 그대로 지남 = 막 통과","say":"붉은 물길이 넓게 부푼 곳에서 작은 배의 노를 젓는 사람을 보자. 이 덱에서 노 젓는 사람은 NO, 산화질소다. NO가 혈관 벽의 평활근을 이완해 혈관을 넓히므로 물길도 부풀어 있다. 배는 물길을 가로지른 투명한 장막을 찢지 않고 통과한다. NO는 작은 기체 분자로 세포막을 쉽게 지나며, 가까운 곳에서 빠르게 작용한 뒤 곧 사라진다. 국소 조절자 중 하나이자, 크기가 작아 막을 통과하는 대표 신호 분자다.","box":[870,755,450,310],"cards":["G0-107","G0-108","B0-35"]},{"sid":"s7","obj":"오른쪽 집 앞 울타리 — 소년이 종이비행기 하나는 이웃에게 날리고 · 또 하나는 창 앞에서 점선을 그리며 휘어 놀란 제 이마 곁으로 되돌아왔다 / 흰 가운의 사람이 흰 종이 쪽지를 흩뿌리자 장난감 병정 넷이 차례로 키가 커진다","fact":"국소 조절자 = 가까운 세포에 확산으로 닿는 신호분자 · 사이토카인은 면역 · 염증 · 림프구 증식","hook":"이웃에게 날린 종이비행기 = 주변분비 · 제 이마로 돌아온 종이비행기 = 자가분비 · 쪽지 받고 크는 장난감 병정 = 사이토카인","say":"오른쪽 집 앞 소년은 울타리 너머 이웃에게 종이비행기를 날린다. 바로 옆까지 전달되는 주변분비다. 또 다른 종이비행기는 창 앞에서 휘어 놀란 소년 자신의 이마 곁으로 돌아온다. 신호를 분비한 세포 자신에게 작용하는 자가분비다. 측분비는 성장인자처럼 이웃 표적세포에, 자가분비는 분비한 세포 자신이나 같은 종류의 세포에 작용한다. 가까운 곳에 작용하는 이 신호 분자들을 국소 조절자라 하며, 주로 확산으로 표적에 닿는다. 옆에서 흰 가운을 입은 사람이 흰 종이 쪽지를 흩뿌리자 장난감 병정들의 키가 차례로 커진다. 이 덱의 병정은 T 세포인 림프구, 종이는 사이토카인이다. 사이토카인은 면역 반응과 염증을 조절하고 림프구의 성장과 분화를 이끈다.","box":[[1500,360,280,160],[1070,505,320,240]],"cards":["G0-101","G0-102","G0-106","B0-198","B0-199"]},{"sid":"s8","obj":"요리사가 노란 기름병을 별 모양 틀에 짜 넣자 빛나는 노란 별이 날아가 이웃 아주머니의 손이 빨갛게 붓는다 · 기름병 뚜껑에 금색 자물쇠","fact":"프로스타글란딘 = 지방산에서 만드는 국소 조절자 · 아스피린 · 이부프로펜이 합성을 막는다","hook":"기름으로 찍은 별 = 프로스타글란딘 · 빨갛게 부은 손 = 염증 · 통증 · 금색 자물쇠 = 아스피린","say":"요리사가 노란 기름병의 기름을 별 모양 틀에 짜 넣고 있다. 기름으로 만든 별에서 프로(스타)글란딘을 떠올리자. 지방산인 아라키돈산에서 만들어진다. 빛나는 노란 별이 날아가자 이웃 아주머니의 손이 빨갛게 붓는다. 프로스타글란딘은 가까운 세포에 작용하는 국소 조절자이며 염증, 통증, 열에 관여한다. 기름병 뚜껑의 금색 자물쇠는 이 덱에서 약물이다. 아스피린과 이부프로펜이 프로스타글란딘 생성 경로를 막아 붓기와 통증을 줄인다는 연결이다.","box":[1395,520,320,265],"cards":["G0-103","G0-104","G0-105"]},{"sid":"s9","obj":"오른쪽 — 맨발로 길바닥의 단추를 밟은 사람이 다리를 홱 든다 · 단추에서 나온 줄이 높은 분홍 기둥을 타고 꼭대기 분홍 뇌까지 오른다 · 기둥 옆 작은 상자에서 나온 둘째 줄이 그의 무릎에 묶였다","fact":"반사 경로: 자극 → 수용기 → 감각신경 → 중추(뇌 · 척수) → 운동신경 → 반응기","hook":"밟은 단추 = 자극 · 수용기 · 기둥 타고 오르는 줄 = 감각신경 · 꼭대기 뇌 + 기둥 = 뇌 · 척수 · 무릎에 묶인 둘째 줄 = 운동신경 · 홱 드는 다리 = 반응기","say":"오른쪽의 사람이 맨발로 길바닥 단추를 밟는다. 밟는 일이 자극, 눌린 단추가 자극을 받는 수용기다. 단추의 줄이 높은 분홍 기둥으로 올라가는 경로는 감각신경이다. 기둥 꼭대기의 분홍 뇌와 아래 기둥은 각각 뇌와 척수로, 중추신경계를 이룬다. 기둥 옆 작은 상자에서 나온 둘째 줄은 무릎에 묶여 다리를 끌어올린다. 운동신경이 반응기인 다리에 명령을 전달하는 모습이다. 자극, 수용기, 감각신경, 중추, 운동신경, 반응기의 순서를 따라가자. 이것이 신경계의 기본 정보처리 경로다. 뇌와 척수 밖으로 뻗은 감각신경과 운동신경은 말초신경계이며, 신경계 전체는 뇌·척수·신경·감각기관으로 이루어진다.","box":[1750,175,298,550],"cards":["G0-112","G0-113","G0-114","G0-7"]},{"sid":"s10","obj":"길바닥의 똑같은 빨간 개미 둘이 오른쪽으로 간다 — 오른쪽 개미 꽁무니에서 나온 분홍 냄새 줄을 왼쪽 개미가 코끝으로 따라가고 · 왼쪽 개미 뒤로도 긴 분홍 줄이 남는다","fact":"페로몬 = 같은 종의 다른 개체 사이로 몸 밖에 내보내는 신호","hook":"같은 개미 둘 사이 분홍 냄새 줄 = 페로몬","say":"길바닥의 같은 모양 빨간 개미 둘은 오른쪽으로 향한다. 오른쪽 개미의 꽁무니에서 나온 분홍 냄새 줄을 왼쪽 개미가 더듬이를 세우고 코끝으로 따라간다. 왼쪽 개미 뒤에도 긴 분홍 줄이 남는다. 몸 밖으로 내보내 같은 종의 다른 개체에 전달하는 신호인 페로몬이다. 몸 안의 세포 사이가 아니라 개체와 개체 사이의 전달이라는 점이 나머지 다섯 경로와 다르다.","box":[[1470,790,250,65],[1715,730,320,125]],"cards":["Q0-3"]},{"sid":"s11","obj":"오른쪽 아래 작업대 — 간호사가 한 손에 쥔 긴 구슬 사슬이 물대야에 늘어져 떠 있고 · 다른 손엔 주사기를 치켜들었다 · 노란 기름 유리 단지 입구에 걸친 고리 넷 덩이(육각 셋 + 오각 하나)와 곁의 코르크 마개 · 뚜껑 터진 드럼통 입구에 걸린 꼬리 달린 작은 고리 하나","fact":"호르몬의 화학 부류 셋 — 폴리펩타이드 · 스테로이드 · 아민(+ 지방산 유래)","hook":"물에 뜬 구슬 사슬 = 폴리펩타이드(인슐린) · 기름 단지의 고리 넷 = 스테로이드(코르티솔) · 꼬리 달린 작은 고리 하나 = 아민(에피네프린 · 티록신)","say":"오른쪽 아래 작업대의 호르몬 세 종류를 비교해 보자. 첫째, 간호사가 든 긴 구슬 사슬은 물대야에 늘어져 떠 있다. 아미노산들이 이어진 수용성 폴리펩타이드다. 다른 손의 주사기는 폴리펩타이드 호르몬인 인슐린의 단서다. 둘째, 노란 기름 단지 입구에는 육각 고리 셋과 오각 고리 하나가 연결된 덩이가 걸쳐 있다. 콜레스테롤에서 만들어지고 지용성인 스테로이드다. 곁의 코르크 마개는 스테로이드 호르몬 코르티솔로 연결된다. 셋째, 뚜껑이 터진 드럼통 입구에 걸린 꼬리 달린 작은 고리 하나는 아미노산 하나에서 유래한 아민이다. 에피네프린과 티록신이 여기에 속한다. 폴리펩타이드와 대부분의 아민은 수용성이지만, 티록신은 예외적으로 지용성이다. 지방산에서 유래한 프로스타글란딘까지 포함하면 네 부류로 나눌 수 있다.","box":[1360,850,688,294],"cards":["G0-116","G0-185","G0-117","G0-118","G0-119","Q0-4","Q0-5"]}],"cq":{"G0-15":["동물에서 조절과 통합의 핵심 두 시스템은?","내분비계와 신경계"],"G0-99":["내분비계와 신경계의 공통점은?","둘 다 신호를 전달하고 신체 기능을 조절한다"],"G0-100":["내분비 신호전달의 대표 기능은?","항상성 유지"],"G0-47":["신경신호와 호르몬신호의 차이는?","신경신호는 빠르고 짧고 · 호르몬신호는 느리지만 오래간다"],"Q0-1":["세포간 신호 6종은?","내분비(혈액) · 주변분비(인접) · 자가분비(자기) · 시냅스(신경전달물질) · 신경내분비(신경호르몬) · 페로몬(개체 간)"],"S-SG-14":["신호전달 거리별 유형은?","직접접촉·측분비·시냅스·내분비 (+자가분비)"],"B0-197":["세포 신호전달의 거리별 유형은?","직접접촉 · 측분비(paracrine) · 시냅스 · 내분비(endocrine) · 자가분비"],"G0-115":["문제에서 '혈류로 퍼져 전신 작용'이 나오면 가장 먼저 떠올릴 신호 유형은?","내분비 신호"],"G0-156":["내분비샘과 외분비샘의 차이는?","내분비샘은 체액으로 직접 분비하고 · 외분비샘은 관이나 표면/체강으로 분비한다"],"B0-12":["외분비와 내분비의 차이는?","외분비는 신체 외부로 · 내분비는 혈액을 타고 신체 내부로 분비"],"G0-96":["호르몬이 모든 세포에 도달해도 모든 세포가 반응하지 않는 이유는?","특이적 수용체를 가진 표적세포만 반응하기 때문이다"],"G0-97":["표적세포(target cell)란?","특정 호르몬의 수용체를 가진 반응 세포"],"G0-98":["호르몬 특이적 수용체가 없는 세포는 어떤가?","해당 호르몬의 영향을 거의 받지 않는다"],"G0-109":["시냅스 신호란?","뉴런이 신경전달물질을 분비해 표적세포에 신호를 전달하는 방식"],"G0-44":["뉴런의 기본 구조 3가지는?","수상돌기 · 세포체 · 축삭"],"G0-45":["시냅스에서 신호 전달 방향은?","기본적으로 일방향"],"G0-46":["신경아교세포의 대표 기능 3가지는?","영양 공급 · 절연 · 뉴런 기능 보조"],"G0-48":["신경신호가 반드시 전기신호만은 아닌 이유는?","시냅스에서는 화학적 신호전달이 일어나기 때문이다"],"G0-110":["신경내분비 신호란?","신경세포가 혈류로 직접 신호분자를 분비하는 방식"],"G0-111":["ADH는 어떤 신호 방식의 대표 예인가?","신경내분비 신호"],"Q0-2":["신경내분비 신호(neuroendocrine)란?","뉴런이 신경호르몬(neurohormone)을 혈액으로 분비(예: ADH)"],"G0-107":["산화질소(NO)가 혈관에서 하는 대표 작용은?","평활근 이완에 의한 혈관 확장"],"G0-108":["NO가 기체 신호분자로 중요하다는 뜻은?","막을 쉽게 통과하며 국소적으로 빠르게 작용할 수 있다는 뜻"],"B0-35":["작아서 세포막을 통과할 수 있는 신호분자 예시는?","산화질소(NO)"],"G0-101":["국소 조절자(local regulator)란?","짧은 거리에서 작용하는 신호분자"],"G0-102":["국소 조절자는 보통 어떻게 표적세포에 도달하는가?","확산"],"G0-106":["사이토카인의 대표 기능은?","면역·염증반응 · 림프구 성장/분화 조절"],"B0-198":["측분비(paracrine) 신호전달이란?","분비세포가 인근 표적세포에 작용하는 국소 신호전달(예: 성장인자)"],"B0-199":["자가분비(autocrine) 신호전달이란?","분비한 세포 자신(또는 같은 종류 세포)에 작용하는 신호전달"],"G0-103":["프로스타글란딘은 어떤 범주의 신호분자인가?","국소 조절자"],"G0-104":["아스피린과 이부프로펜이 프로스타글란딘 작용을 줄이는 이유는?","프로스타글란딘 합성 경로를 억제하기 때문이다"],"G0-105":["프로스타글란딘은 어떤 분자에서 유래하는가?","지방산(아라키돈산 계열)"],"G0-112":["자극→수용기→감각신경→CNS→운동신경→반응기 순서는 무엇을 나타내는가?","신경계의 기본 정보 처리 경로"],"G0-113":["중추신경계(CNS)는 무엇으로 이루어지는가?","뇌와 척수"],"G0-114":["말초신경계(PNS)는 무엇을 포함하는가?","감각신경과 운동신경을 포함한 말초 신경들"],"G0-7":["신경계의 대표 구성은?","뇌, 척수, 신경, 감각기관"],"Q0-3":["페로몬(pheromone)이란?","같은 종의 다른 개체 사이로 방출되는 체외 신호"],"G0-116":["호르몬의 대표 화학적 종류 3가지는?","폴리펩타이드 · 스테로이드 · 아민"],"G0-185":["호르몬의 화학적 종류를 4가지로 보면?","펩티드 · 스테로이드 · 아민 · 지방산 유래(예: 프로스타글란딘)"],"G0-117":["인슐린은 어떤 종류의 호르몬인가?","폴리펩타이드 호르몬"],"G0-118":["코르티솔은 어떤 종류의 호르몬인가?","스테로이드 호르몬"],"G0-119":["에피네프린과 티록신은 어떤 종류의 호르몬인가?","아민 호르몬"],"Q0-4":["호르몬의 3가지 화학 부류는?","폴리펩티드 · 아민 · 스테로이드"],"Q0-5":["수용성 호르몬에 해당하는 부류는?","폴리펩티드 + 대부분 아민"]},"hubPanel":null};

if (L.home) $('home').href = L.home;  // 한 파일(standalone)은 저장소 밖에서 열리므로 배포 주소로
if (L.hub) $('hub').href = L.hub; else if (L.hubPanel) $('hub').href = '../sketchy.html#' + L.hubPanel;
const ov = $('ov'); ov.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
let tourEnded = false;
let mode = 'tour', i = -1, playing = false, voice = true, rate = 1.0, quizOrder = [], quizPos = 0, quizRevealed = false, shuffle = false, sess = null;
const stops = L.stops;
subShow();
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID
const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact), st.sid);
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate,
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
</html>
