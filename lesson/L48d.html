<script>
const L = {"id":"L48d","scene":"s48","part":"d","title":"긴 막사에서 골지 쟁반을 지나 세포 밖으로","sub":"조면·활면소포체 · 신호서열과 SRP · 접힘과 당화 · 시스·트랜스 골지 · M6P 분류와 KDEL 회수 · 세포외배출","img":"img/L48c.webp?v=03c7abc17061","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"줄무늬 천막에 이어진 막사, 층층이 쌓인 쟁반, 짐수레와 물가 울타리를 따라간다.","fact":"내막계에서 단백질·지질을 만들고 옮긴다 · 분비 경로는 조면소포체 → 골지 → 세포막","hook":"막사 → 골지 쟁반 → 물가로 가는 수레 → 밖으로 나온 짐","say":"내막계에는 핵막·소포체·골지체·리소좀·액포와 여러 소낭, 세포막이 속한다. 단백질의 합성과 수송, 지질의 대사와 이동, 해독을 맡는다. 이 장면에서는 핵공을 빠져나온 mRNA가 세포질 쪽에서 번역되기 시작한 뒤, 분비 단백질이 어떤 구획을 거쳐 밖에 나가는지 따라간다. 보라색은 리보솜, 종이는 mRNA, 색 구슬 사슬은 새 단백질이다.","cards":["A0-59","A0-60","A0-22"],"box":null,"ask":"분비될 단백질이 처음 들어가는 내강은 어디인가? 거기서 세포 밖에 나올 때까지 거치는 구획과 수송 방식을 순서대로 말해 보자."},{"sid":"s2","obj":"핵 천막의 두 겹 테두리와 이어진 긴 막사 천을 비교한다.","fact":"핵막은 이중막 · 소포체·골지체·리소좀·액포·세포막은 각각 단일막","hook":"핵엽미는 이중막 · 골소리액세는 단일막 · 보인중염은 막 없음","say":"막 수를 셀 때 각각의 인지질 이중층을 막 하나로 친다. 핵·엽록체·미토콘드리아는 이중막이다. 골지체·소포체·리소좀·액포·세포막은 각각 단일막이다. 보라 짝인 리보솜, 인, 중심체, 염색체는 막으로 싸인 구조가 아니다. 서로 이어져 있는 핵 외막과 소포체 막도 이 기준으로 구별할 수 있다.","cards":["A0-26","A0-27","A0-28","A0-31","A0-41"],"box":[[209,383,180,144],[643,410,139,76]],"ask":"핵막과 소포체 막은 연결되어 있는데 왜 핵은 이중막, 소포체는 단일막이라고 하는가? 리보솜은 막으로 싸이는가?"},{"sid":"s3","obj":"긴 천막 막사의 왼쪽 지붕과 오른쪽 지붕을 비교한다. 보라 짝이 앉은 곳과 매끈한 곳이 있다.","fact":"소포체는 막 주머니·관의 그물 · 조면에는 세포질 면에 리보솜이 붙고 활면에는 없다","hook":"보라 짝이 붙은 면은 조면, 매끈한 면은 활면 · 둘의 내강은 연결됨","say":"소포체의 막은 내부 공간인 내강을 세포질과 가른다. 조면·활면소포체의 내강은 이어져 있다. 밖의 세포질 면에 리보솜이 붙은 부분을 조면소포체, 붙지 않은 부분을 활면소포체라고 한다. 자유 리보솜은 세포질에서 일할 단백질을, 부착 리보솜은 분비 단백질과 내막계 단백질을 주로 만든다. 둘은 같은 종류로, 따로 정해진 것이 아니라 번역하는 단백질의 표적 신호에 따라 소포체에 결합했다 떨어졌다 한다.","src":["s14p01#0"],"cards":["A0-61","A0-63","A0-56","F0-136","F0-137","F0-138"],"box":[[809,301,260,105],[1155,338,201,175]],"ask":"조면과 활면은 무엇이 어디에 붙었는지로 구별하는가? 둘의 내강은 서로 연결되는가?"},{"sid":"s4","obj":"막사 오른쪽 방에서 노란 기름병, 해골 표시 통, 자갈이 쏟아지는 사물함을 찾는다.","fact":"활면소포체는 지질·스테로이드 합성, 탄수화물 대사, 해독, Ca²⁺ 저장에 관여","hook":"기름 → 지질 · 해골 병 → 해독 · 자갈함 → Ca²⁺ 저장, 근소포체에서 Ca²⁺ 방출 → 수축","say":"노란 기름은 지질 합성의 단서다. 스테로이드를 합성하는 생식샘과 부신피질의 세포에는 활면소포체가 발달한다. 해골 병은 간세포의 약물 해독을 떠올리게 한다. 근육세포에서 특수화한 활면소포체, 곧 근소포체는 칼슘을 저장했다가 수축 신호에 내보낸다. 간의 탄수화물 대사도 활면소포체의 기능에 포함된다.","cards":["A0-64","A0-65","A0-66"],"box":[[1122,554,254,250]],"ask":"기름·해골 병·자갈 사물함을 각각 어느 기능과 연결하는가? 근육에서 자갈이 나오면 무엇이 시작되는가?"},{"sid":"s5","obj":"보라 짝이 놓인 막사 아래의 구슬 사슬과 손질하는 작업장.","fact":"조면소포체에서는 분비·막 단백질 합성, 내강 쪽 당화, 새 막 단백질의 삽입이 일어난다","hook":"분비 단백질은 내강으로 · 막 단백질은 소수성 구간이 막에 삽입 · 소포체 막 성장","say":"조면소포체 표면의 리보솜이 분비 단백질을 만들면 새 사슬이 내강으로 들어간다. 막 단백질의 소수성 구간은 막에 삽입될 수 있다. 소포체에서 단백질에 당사슬을 붙이는 과정이 시작된다. 소포체 막은 새 막 단백질과 인지질을 보태며 자란다. 인지질은 주로 막의 세포질 쪽 효소들이 합성한다.","cards":["A0-67","A0-71"],"box":[[870,625,189,201]],"ask":"같은 조면소포체 리보솜에서 합성해도 분비 단백질과 막 단백질의 위치는 어떻게 달라질 수 있는가?"},{"sid":"s6","obj":"막사 지붕 바깥의 두루마리와 보라 짝, 바로 아래 막사 안에서 보이는 색 구슬 사슬.","fact":"SRP가 새 사슬의 소포체 신호서열을 인식 → 리보솜 도킹 → 폴리펩타이드가 막 통로 통과","hook":"종이와 보라 짝은 지붕 바깥 · 구슬 사슬은 막사 안으로 · 도킹을 안내하는 인자 = SRP","say":"대표적인 분비 단백질은 N말단의 소수성 신호서열, 곧 아미노산 스무 개쯤의 신호 펩타이드가 리보솜 밖으로 나오면 신호인식입자 SRP가 붙는다. SRP는 단백질과 RNA가 뭉친 복합체다. SRP가 리보솜을 소포체 막의 SRP 수용체로 데려가고, 리보솜이 트랜스로콘에 자리 잡아 번역이 계속된다. 번역이 끝난 뒤가 아니라 사슬을 만드는 도중에 막에 닿는 것이다. 새 폴리펩타이드가 통로를 지나 내강으로 들어간다. mRNA와 리보솜은 세포질 쪽에 머문다.","cards":["A0-206","A0-68","F0-139","F0-140","F0-141","F0-142","F0-143"],"box":[[862,377,166,209]],"ask":"핵공을 나오는 것 두 가지와 소포체 막 통로를 지나는 것을 구별해 보자. 새 사슬을 조면소포체로 안내하는 인자는 무엇을 알아보는가?"},{"sid":"s7","obj":"막사 안에서 구슬 사슬을 손질하는 손과 붉은 막대사탕, 돌아가는 수레에 찍힌 닻.","fact":"내강에서 접힘·N-당화 시작 · C말단 KDEL을 지닌 가용성 소포체 단백질은 골지에서 회수","hook":"사슬 손질 → 접힘 · 사탕 → 당화 · 닻 → KDEL · 되돌아오는 수레 → COPI","say":"내강에서 분비 단백질이 접히고 많은 단백질은 N-결합 당화를 받는다. 소기관 안으로 들어간 사슬이 겪는 대표 가공이 이 접힘, 폴딩이다. 이곳에 머물러야 하는 가용성 단백질 일부는 C말단에 KDEL 서열이 있다. 골지로 빠져나와도 KDEL 수용체가 이 신호를 읽어 COPI 소포를 통해 소포체로 돌려보낸다. 닻은 이 회수를 떠올리는 단서다.","cards":["A0-69","A0-207","F0-145"],"box":[[883,670,118,132],[1116,873,328,166]],"ask":"막사 안에서 사슬에 일어나는 두 과정은? C말단에 KDEL이 있는 가용성 단백질이 골지에 도착하면 어느 피복의 수송체가 어디로 되돌리는가?"},{"sid":"s8","obj":"막사에서 가장 가까운 골지 쟁반 곁의 상자 수레.","fact":"전이성 소포체에서 COPII 소포 출아 → 골지 시스면에서 받음 · 트랜스면에서 분류·발송","hook":"소포체 출발 → COPII → 시스면 도착 · 골지에서 소포체로 돌아갈 때는 COPI","say":"소포체 출구는 전이성 소포체다. 여기서 앞방향으로 나가는 COPII 운반 소포에 화물이 실려 골지 시스면 쪽으로 이동한다. 골지에서 소포체로 되돌아가는 회수에는 COPI가 관여한다. 시스면이 받는 면이고 반대쪽 트랜스 골지망은 목적지별로 화물을 내보낸다.","src":["s14p01#3","s14p01#1"],"box":[[1397,547,139,140]],"ask":"소포체 출구에서 나오는 앞방향 소포의 피복과 도착하는 골지 면은? 되돌리는 수레의 피복은?","cards":["A0-70","A0-74"]},{"sid":"s9","obj":"막사 오른쪽에 납작한 쟁반이 여러 층으로 쌓여 있다.","fact":"골지체는 납작한 막 주머니인 시스터나의 더미 · 단백질·지질의 가공, 저장, 분류와 발송","hook":"쟁반 한 장 → 시스터나 · 쟁반 더미 → 골지체","say":"쟁반 한 장은 납작한 막 주머니 하나, 곧 시스터나다. 여러 시스터나가 쌓여 골지체를 이룬다. 소포체에서 온 산물은 여기서 당사슬 변형 등 추가 가공을 거치고, 일부는 저장되며, 목적지에 따라 분류되어 발송된다.","cards":["A0-72","A0-73"],"box":[[1464,424,242,107]],"ask":"쟁반 한 장과 한 더미는 각각 무엇인가? 앞쪽에서 받은 단백질에 골지가 하는 일을 말해 보자."},{"sid":"s10","obj":"골지 쟁반 더미를 따라, 뒤이어 목적지가 다른 수레들로 시선을 옮긴다.","fact":"시스터나 성숙 모델에서는 화물을 담은 cis 시스터나가 medial·trans 성질을 차례로 얻는다","hook":"받는 쪽 → 성숙하는 쟁반 → 분류·발송하는 트랜스 골지망","say":"시스터나 성숙 모델에서는 화물을 담은 이른 시스터나가 점차 중간, 후기 시스터나의 성질을 얻는다. 골지 효소들은 거꾸로 수송되어 구획별 구성을 유지한다. 트랜스 골지망에서는 화물의 분류 신호를 읽어 목적지별 운반체로 보낸다. 리소좀 효소의 표지는 앞쪽 골지에서 만들기 시작한다.","cards":["A0-75","A0-76"],"box":[[1473,496,243,76],[1716,572,72,109]],"ask":"시스터나 성숙 모델에서 화물과 함께 성숙하는 것은 무엇인가? 트랜스 골지망은 화물의 표지를 읽어 무엇을 결정하는가?"},{"sid":"s11","obj":"쟁반의 막사 쪽에서 빨간 도장을 찍는 손과, 붉은 표가 붙은 짐을 삼각 격자 우리에 실은 수레.","fact":"초기 골지에서 M6P 표지 형성 시작 → 트랜스에서 수용체가 선별 → 엔도솜을 거쳐 리소좀","hook":"상자 위 붉은 표 → 만노스-6-인산 · 격자 수레 → 클라트린 운반체 · 회색 도착 칸 → 엔도솜","say":"가용성 리소좀 가수분해효소는 조면소포체에서 합성된다. 초기 골지에서는 인산전이효소가 이 효소의 당사슬에 있는 만노스의 표지 형성을 시작한다. 이후 덮개 당이 제거되어 만노스-6-인산(M6P)이 드러난다. 트랜스 골지망의 M6P 수용체가 표지된 효소를 골라 클라트린 운반체에 싣는다. 엔도솜에서 수용체와 분리된 효소가 리소좀에 전달된다. 봉입세포병에서는 이 표지 형성이 손상되어 여러 효소가 세포 밖으로 잘못 분비된다. 리소좀 막 단백질도 조면소포체에서 만들어져 골지를 거치며 별도 분류 신호를 사용한다.","src":["s14p01#2","s14p01#5"],"cards":["A0-77","A0-200","A0-81"],"box":[[1425,488,93,117],[1542,779,305,217],[1817,1011,141,80]],"ask":"가수분해효소의 M6P 표지를 만드는 일은 어느 쪽 골지에서 시작되는가? 어느 쪽에서 무엇이 읽으며, 엔도솜 다음 목적지는 어디인가?"},{"sid":"s12","obj":"물가 울타리의 열린 자리에서 작은 짐이 물 쪽으로 나온다.","fact":"세포외배출은 소낭막과 세포막의 융합 · 내강 화물이 세포 밖으로 방출되고 소낭막은 세포막에 합류","hook":"물가로 간 수레 → 분비 소낭 · 울타리 밖으로 나온 짐 → 세포외배출","say":"분비 소낭막이 세포막과 융합하면 소낭 안쪽 공간이 세포 밖으로 열린다. 가용성 화물은 밖으로 풀리고 소낭막은 세포막의 일부가 된다. 이자 베타세포의 인슐린 분비가 대표적이다. 재조합 대장균이 인슐린 원료 단백질을 만들 수 있어도 소포체·골지체를 거쳐 소낭으로 분비하는 이 경로는 없다.","cards":["A1-120","A1-122","A1-124"],"box":[[1888,560,156,197]],"ask":"인슐린 소낭이 세포막에 닿으면 어느 두 막이 하나가 되는가? 소낭 내강의 화물과 소낭막의 행선지를 각각 말해 보자."},{"sid":"s13","obj":"짐을 실은 수레에서 물가 울타리까지 분비 화물의 행선지를 되짚는다.","fact":"소낭을 쓰는 덩어리 수송 · 세포외배출은 밖으로, 세포내섭취는 세포막이 함입해 안으로","hook":"분비 경로는 조면소포체 → 운반 소포 → 시스 골지 → 트랜스 골지 → 분비 소낭 → 세포막 융합","say":"큰 단백질이나 다당류를 세포 밖으로 내보내는 경로는 소낭을 이용한 덩어리 수송이다. 반대로 세포막이 바깥 물질을 감싸 안쪽으로 소낭을 만들면 세포내섭취다. 분비 단백질의 길을 한 번에 잇자. 세포질에서 번역을 시작해 조면소포체 내강으로 들어가고, 운반 소포로 골지 시스면에 닿는다. 트랜스 골지망의 분비 경로로 나와 세포막에서 융합하면 세포 밖이다.","cards":["A1-118","A1-119","A1-123","A1-145"],"box":[[1769,617,127,121]],"ask":"분비 단백질이 조면소포체를 떠나 밖에 이르기까지 골지의 양쪽 면과 막 융합을 넣어 말해 보자. 세포내섭취라면 마지막 막의 움직임은 어떻게 다른가?"}],"relatedTour":{"id":"L48c","label":"같은 그림 · 핵공에서 번역까지"},"cq":{"A0-59":["내막계 구성 소기관 5가지?","핵막 · 소포체 · 골지체 · 리소좀 · 액포(+여러 소낭)"],"A0-60":["내막계 막의 기능 4가지?","단백질 합성 · 단백질 수송(막/소기관/세포 밖) · 지질 대사·이동 · 독소 해독"],"A0-22":["내막계(endomembrane system)의 역할 2가지?","단백질 이동 조절 · 세포 물질대사 기능 수행"],"A0-26":["골지체의 막 구조 분류?","단일막"],"A0-27":["단일막 소기관 예시 1개","골지체"],"A0-28":["소포체의 막 구조 분류?","단일막"],"A0-31":["세포막의 막 구조 분류?","단일막"],"A0-41":["막구조 암기: 단일막/이중막/무막 두문자?","단일막=골소리액세 · 이중막=핵엽미 · 무막=보인중염"],"A0-61":["소포체(ER)는 어떤 구조의 네트워크?","막성 주머니와 관의 광대한 네트워크(세포질과 ER 내강을 분리)"],"A0-63":["소포체 종류 2가지와 구분 기준?","활면소포체(smooth ER, 리보솜X) · 조면소포체(rough ER, 리보솜O)"],"A0-56":["리보솜 위치 2가지?","자유 리보솜(세포질) · 부착 리보솜(조면소포체·핵외막)"],"F0-136":["자유 리보솜이 주로 합성하는 단백질은?","세포질에서 기능하는 단백질"],"F0-137":["부착 리보솜이 주로 합성하는 단백질은?","분비 단백질과 내막계 단백질"],"F0-138":["자유 리보솜과 부착 리보솜은 고정된 별도 종류인가?","아니오, 필요에 따라 전환될 수 있다"],"A0-64":["활면소포체 기능 4가지(두문자)?","지질합성·탄수화물대사·칼슘이온저장·독성물질제거 (L카칼독)"],"A0-65":["활면소포체가 특히 발달한 기관/세포 2곳?","정소·난소·부신(스테로이드) · 간(해독)"],"A0-66":["근육세포에서 활면소포체의 역할?","Ca2+를 내강에 저장 → 자극 시 Ca2+ 방출해 근수축 촉진"],"A0-67":["조면소포체 기능 3가지(두문자)?","분비단백질/다른 단백질 합성 · 탄수화물 첨가 · 새로운 막 합성 (분당막)"],"A0-71":["소포체 막은 어떻게 성장하는가?","막단백질·인지질을 추가(막 내 효소가 세포질 전구체로부터 인지질 합성)"],"A0-206":["분비·막 단백질을 조면소포체로 유도하는 신호와 인식 인자는?","N말단 신호서열(signal sequence)을 SRP(신호인식입자)가 인식"],"A0-68":["조면소포체에서 분비 단백질이 들어가는 곳?","리보솜에서 나온 폴리펩타이드가 막 단백질 복합체 구멍 통해 ER 내강으로 들어감"],"F0-139":["폴리펩타이드를 조면소포체로 유도하는 약 20개 아미노산 서열은?","신호 펩타이드"],"F0-140":["신호 펩타이드는 주로 폴리펩타이드의 어디에 있는가?","N말단 근처"],"F0-141":["신호 펩타이드를 인식하는 단백질-RNA 복합체는?","SRP"],"F0-142":["SRP가 신호 펩타이드에 결합하면 어떤 일이 일어나는가?","리보솜을 소포체 막의 수용체로 데려간다"],"F0-143":["조면소포체로 가는 단백질은 번역이 끝나기 전과 후 중 언제 막에 도달하는가?","번역 도중"],"A0-69":["분비 단백질이 ER 내강에서 일어나는 과정 2가지?","접힘(folding) + (대부분) 당단백질화(탄수화물 공유결합)"],"A0-207":["단백질을 소포체에 머무르게 하는 C말단 잔류 신호서열은?","KDEL 서열"],"F0-145":["세포소기관 내부로 들어간 폴리펩타이드가 겪는 대표 가공은?","폴딩"],"A0-70":["전이성 소포체(transitional ER)에서 생성되는 소낭 이름?","수송소포(transitional vesicle)"],"A0-74":["골지체의 극성: 시스면/트랜스면 특징?","시스면: 소포체 쪽(받음) · 트랜스면: 소낭 출아(보냄)"],"A0-72":["골지체(Golgi apparatus)의 핵심 기능 4단어?","생산·저장·분류·수송(발송/접수 센터)"],"A0-73":["골지체의 구조적 단위(납작한 주머니) 이름?","시스터나(cisterna)들이 쌓인 구조"],"A0-75":["시스터나 성숙 모델(cisternal maturation model) 요지?","시스터나가 시스→트랜스로 이동하며 단백질을 운반·가공"],"A0-76":["골지체 트랜스골지망에서 단백질을 출고할 때 하는 일 두 가지는?","화물을 목적지별로 분류하고 운반 소낭에 포장한다. 리소좀 효소의 M6P 표지는 시스골지에서 형성이 시작되고, 트랜스골지망에서 수용체에 인식되어 엔도솜행 소낭으로 분류된다."],"A0-77":["리소좀(lysosome)의 정의?","가수분해효소가 들어있는 막성 소낭(소화성 소기관)"],"A0-200":["봉입세포병(I-cell disease)의 원인은?","만노스-6-인산(M6P) 표지 결함 → 효소가 리소좀으로 전달되지 못함"],"A0-81":["가수분해효소와 리소좀 막은 어디서 만들어지는가?","조면소포체에서 합성 → 골지체에서 가공"],"A1-120":["세포외배출작용(exocytosis)이란?","소낭이 세포막과 융합하여 물질을 밖으로 분비하는 과정"],"A1-122":["세포외배출작용의 핵심 단계는?","소낭과 원형질막의 융합"],"A1-124":["췌장 β세포는 인슐린을 어떤 방식으로 분비하며, 재조합 대장균의 인슐린 생산과 어떻게 다른가?","β세포는 인슐린이 든 분비 과립을 세포막과 융합시켜 세포외배출한다. 재조합 대장균에는 소포체·골지를 거치는 분비 과립이 없다. 대표적인 생산법에서는 균체 안에서 만든 인슐린 전구체를 회수해 가공·정제한다."],"A1-118":["덩어리 수송(bulk transport)이 필요한 이유는?","큰 분자는 확산이나 수송단백질로 막을 통과하기 어렵기 때문"],"A1-119":["덩어리 수송의 두 큰 종류는?","세포외배출작용(exocytosis) + 세포내섭취작용(endocytosis)"],"A1-123":["단백질과 다당류 같은 큰 분자는 보통 어떻게 이동하 const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID
const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact));
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
function speak(t) {
  t = ttsNorm(t);
  const my = ++speakSeq, at = i;
  const advance = (ms) => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, ms);
  if (!('speechSynthesis' in window)) { if (playing) advance(3500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = () => { if (started) advance(700); };
  u.onerror = () => { if (!started) advance(3000); };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started && my === speakSeq) { speechSynthesis.cancel(); advance(3000); } }, 2500);  // 목소리가 없으면 글만 3초
}
function go(k) {
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) setTimeout(() => { if (playing) next(); }, 3500);
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; speechSynthesis && speechSynthesis.cancel(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i + 1); else speechSynthesis && speechSynthesis.cancel(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) speechSynthesis && speechSynthesis.cancel(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
</script>
</body>
</html>
