<script>
const L = {"id":"L19g","scene":"s19","part":"g","title":"벌레의 작업대와 버클 띠 — Bcl-2와 예쁜꼬마선충","sub":"미토콘드리아 외막의 조절자 Bcl-2(Ced-9 상동체 · 버클) · Bax · Bak(상자 · 박) · 눌린 Ced-4와 닫힌 Ced-3 → 풀림 · 활성/비활성 조절 · 131번","img":"img/L19g.webp?v=c7c6a95ea1fe","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"같은 콩 모양 통 둘 — 왼쪽 성함 · 오른쪽 껍질 구멍 셋","fact":"Ced-9 / Bcl-2는 미토콘드리아 외막의 조절자 — 겉껍질이 뚫리느냐 마느냐","hook":"콩 모양 + 안쪽 주름 = 미토콘드리아 · 겉껍질 = 외막","say":"콩 모양 통 두 개를 비교해 보자. 왼쪽 통은 껍질이 온전해 붉은 알갱이가 안에 남아 있고, 오른쪽 통은 구멍 셋으로 알갱이가 쏟아진다. 콩 모양 통은 미토콘드리아다. 세드 구와 사람의 비씨엘 투는 미토콘드리아 외막에서 세포예정사를 조절한다. 안쪽 주름이 아니라 바깥 껍질이 뚫리는지에 집중하자.","box":[40,280,740,660],"src":["s19p02h#0"],"cards":["B0-169"]},{"sid":"s2","obj":"왼 통 허리를 바싹 조인 띠와 네모 버클","fact":"Bcl-2 집안(Ced-9의 상동체) — 조이면 새지 않는다(사멸 억제)","hook":"버클 = Bcl · 조임 = 안 샘","say":"왼쪽 통의 허리를 감싼 띠와 네모 버클이 바짝 조여져 있다. 통의 껍질도 조금 잘록해졌다. 버클이라는 소리에서 비씨엘을 떠올리자. 포유류의 미토콘드리아 아폽토시스를 조절하는 비씨엘 투 집안이다. 단단히 조여 새지 않게 한다는 모습에 기능도 연결된다.","box":[120,580,240,180],"src":["s19p02h#1"],"cards":["B0-170"]},{"sid":"s3","obj":"오른 통 곁의 뚜껑 연 네모 상자와 속 파낸 박","fact":"사멸 촉진 Bax · Bak — 이 둘이 있으면 외막이 뚫린다","hook":"박스 = Bax · 박 = Bak","say":"오른쪽 통 옆 바닥에는 뚜껑 열린 네모 상자와 속을 파낸 박 바가지가 있다. 박스는 백스, 박은 백의 이름 단서다. 둘은 비씨엘 투 집안에서 세포 사멸을 촉진하는 대표적인 단백질이다. 구멍 난 통 옆에만 있고 왼쪽에는 없다는 점을, 두 단백질이 구멍 형성에 관여한다는 의미로 연결하자.","box":[620,740,420,330],"src":["s19p02h#2"],"cards":["C1-117"]},{"sid":"s4","obj":"오른 통엔 띠가 없고 · 왼 통 곁엔 상자 · 박이 없다","fact":"한 집안(B로 시작 · 외막)이 조이는 편과 뚫는 편으로 갈린다 · 띠가 내인성 경로의 마개","hook":"같은 자리의 두 편","say":"오른쪽 통에는 띠와 버클이 없어 내용물이 새고, 왼쪽 통 옆에는 상자와 박이 없다. 같은 집안이지만 조이는 편과 뚫는 편이 나뉜다. 이름이 비로 시작하고 외막을 무대로 한다는 공통점 속에서 기능을 구별해야 한다. 조이는 항아폽토시스 쪽은 Bcl-2와 Bcl-xL, 뚫는 전아폽토시스 쪽은 Bax와 Bak이다. 이 띠는 내인성 경로를 막는 마개다. 외막이 뚫려 붉은 알갱이인 시토크롬 씨가 나오면 아폽토솜의 테가 만들어지고, 이어 캐스페이즈 구가 켜진다.","box":[[40,280,740,660],[620,740,420,330]],"src":["s19p02h#3","s19p02h#4"],"cards":["X-SG-23","S-SG-16","B0-219"]},{"sid":"s5","obj":"작업대 왼쪽 — 점 넷 판이 버클 띠에 눌려 납작 · 캐스터네츠 닫힘 · 점 셋 판 누움","fact":"아폽토시스 단백질은 평소 불활성 — 없는 게 아니라 눌려 있다","hook":"연장은 다 놓여 있다","say":"작업대 왼쪽의 점 넷 판은 버클 띠에 눌려 바닥에 붙어 있다. 옆의 캐스터네츠는 닫혀 있고 점 셋 판도 누워 있다. 아폽토시스에 관여하는 단백질 대부분은 평소 이런 불활성 상태다. 단백질 자체가 없는 것이 아니라, 연장은 준비되어 있지만 작동이 억제된 상태다.","box":[1000,460,480,260],"src":["s19p02i#0"],"cards":["B0-167"]},{"sid":"s6","obj":"작업대 오른쪽 — 띠가 풀려 버클이 끌러지고 점 넷 판이 일어섰다","fact":"사멸 신호 → Ced-9이 Ced-4를 더는 못 누른다(미는 게 아니라 풀리는 것)","hook":"버클 띠 = Ced-9 · 점 넷 = Ced-4","say":"작업대 오른쪽에서는 점 넷 판이 일어서고 띠가 풀려 늘어져 있으며 버클도 끌러져 있다. 버클 띠는 세드 구, 점 넷 판은 세드 사다. 예정사 신호를 받으면 세드 구가 세드 사를 더 이상 불활성 상태로 붙잡지 못한다. 누군가 밀어 켜는 것이 아니라 억제가 풀리는 모습이라는 점에서 검문소 장면과 연결된다.","box":[1500,300,300,500],"src":["s19p02i#1"],"cards":["B0-171"]},{"sid":"s7","obj":"일어선 판 곁 캐스터네츠가 활짝 · 점 셋 판이 곁에 놓임","fact":"Ced-4가 풀리면 Ced-3(캐스페이즈)이 켜진다 → 단백질 · 핵산 분해효소 활성화","hook":"벌어진 캐스터네츠 = 켜진 효소 · 점 셋 = Ced-3","say":"일어선 판 옆에서는 캐스터네츠가 활짝 벌어지고, 점 셋 판이 비스듬히 놓여 있다. 세드 구가 세드 사를 놓아주면 단백질과 핵산을 분해하는 효소가 활성화된다. 열린 캐스터네츠는 활성화를, 점 셋은 세드 삼을 나타낸다. 세드 삼이 바로 캐스페이즈다.","box":[1740,440,280,260],"src":["s19p02i#2"],"cards":["B0-172","B0-174"]},{"sid":"s8","obj":"작업대의 판은 점 넷과 점 셋뿐","fact":"선충 아폽토시스의 두 주요 유전자 ced-3 · ced-4 → 단백질 Ced-3 · Ced-4","hook":"점을 세면 셋과 넷","say":"작업대의 판은 점 넷과 점 셋, 두 종류이며 양쪽에 하나씩 있다. 예쁜꼬마선충의 아폽토시스에 중요한 두 유전자는 세드 삼과 세드 사다. 두 판은 바로 그 유전자들이 만드는 단백질을 나타낸다. 유전자와 단백질의 이름이 같으므로 표기할 때는 유전자를 소문자로, 단백질은 첫 글자를 대문자로 써서 구별한다.","box":[[1020,480,260,220],[1240,600,220,100],[1540,320,220,260],[1800,560,220,160]],"src":["s19p02i#3"],"cards":["B0-165","B0-166"]},{"sid":"s9","obj":"왼쪽과 오른쪽에 놓인 것이 똑같다 — 눌렸냐 일어섰냐","fact":"조절은 활성 · 비활성 수준 — 새로 만들어 오는 것이 없다","hook":"같은 물건의 두 상태","say":"양쪽 작업대에 있는 도구는 같다. 차이는 판이 눌려 있는지 서 있는지, 캐스터네츠가 닫혀 있는지 열려 있는지다. 선충의 아폽토시스 조절은 이미 존재하는 단백질의 활성과 비활성을 바꾸는 수준에서 일어난다. 이 장면에서는 단백질을 새로 가져오는 것이 아니라 준비된 단백질을 켜고 끈다.","box":[960,300,1080,480],"src":["s19p02i#4"],"cards":["B0-168","B0-196"]},{"sid":"s10","obj":"벽의 판 셋 — 점 하나 · 셋 · 하나","fact":"선충(자웅동체) 체세포 발생 중 아폽토시스는 늘 131개(정해져 있어 예정사)","hook":"하나 · 셋 · 하나 = 131","say":"벽에 떨어져 걸린 작은 판 세 개를 왼쪽부터 읽어 보자. 점 하나·셋·하나로, 백삼십일이다. 예쁜꼬마선충의 자웅동체가 정상적으로 발달하는 동안, 체세포 가운데 늘 백삼십일 개가 아폽토시스로 사라진다는 단서다. 정해진 수 $('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
</html>
