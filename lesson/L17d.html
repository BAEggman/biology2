const L = {"id":"L17d","scene":"s17","part":"d","title":"깊은 수갱의 U자 수로 — 헨레고리","sub":"하행지(AQP1) · 굽이 · 상행지(물 불투과 · 수동 → NKCC2 · 푸로세미드 · ROMK) · 바사 렉타 · Na⁺-K⁺ 펌프 · 역류증폭 vs 역류교환","img":"img/L17d.webp?v=b59d0319ea26","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"돌벽 수갱 속 U자 나무 수로 — 내려갔다 되올라와 꼭대기에서 꺾인다","fact":"헨레고리 — 근위 → 하행지 → 굽이 → 상행지 → 초기 원위 · 물빛 = 농도(굽이가 가장 짙다)","hook":"네모 수로 = 오줌길 · 가는 둥근 구리관 = 핏줄 · 수갱 깊이 = 수질 깊이","say":"돌벽 수갱 속에 네모난 나무 수로가 유 자로 걸려 있다. 네모 수로는 오줌길. 장터 모퉁이의 큰 구리관도 단면이 네모라 오줌길이었다. 관의 뜻은 재료가 아니라 단면이 정한다, 네모는 오줌길, 둥근 것은 핏줄. 근위세뇨관에서 이어져 깊이 내려갔다가, 되올라와 꼭대기에서 꺾이면 초기 원위세뇨관이다. 헨레고리. 내려가는 가지가 하행지, 올라가는 가지가 상행지다. 하행각, 상행각이라고도 부른다. 수갱의 깊이가 수질의 깊이이고, 물빛과 흰 결정이 농도다. 굽이가 가장 짙다.","box":null,"src":["s17u02#0"],"cards":[]},{"sid":"s2","obj":"내려가는 가지 벽의 맨 구멍들에서 물줄기만 · 곁에 가위표 친 V","fact":"하행지 — AQP1으로 물만 통과 · ADH와 무관","hook":"맨 구멍 = 아쿠아포린(물만) · V에 가위표 = 호르몬 무관","say":"내려가는 가지 벽에 꼭지 없는 맨 구멍이 촘촘하고 가는 물줄기만 쏟아진다. 하행지다. 아쿠아포린 원으로 물만 통과한다. 곁의 브이자 이음쇠에 널빤지 가위표가 쳐져 있다. 에이디에이치와 무관하다는 뜻. 호르몬이 여닫는 물길은 집합관의 아쿠아포린 투다.","box":[[320,340,580,670],[100,500,300,460]],"src":["s17u02#1"],"cards":["X-RN-12","H1-8#3","H1-169","H1-67","H1-70","X-RN-6"]},{"sid":"s3","obj":"바닥 굽이 — 물이 가장 짙고 결정이 빽빽","fact":"굽이에서 관 속 농도 최고(수질 가장 깊은 곳)","hook":"가장 깊은 곳이 가장 짙다","say":"바닥 굽이의 물이 가장 짙고 흰 결정이 가장 빽빽하다. 물만 빠져나왔으니 굽이에서 농도가 최고다. 수질 가장 깊은 곳.","box":[680,800,600,320],"src":["s17u02#2"],"cards":["H1-73","H1-77"]},{"sid":"s4","obj":"올라가는 가지 — 구멍 없이 역청 메운 벽 · 곁의 마른 소금 더미 · 올라갈수록 옅다","fact":"상행지는 물에 불투과 — 염만 내보낸다","hook":"역청 벽 = 물 못 나감 · 마른 소금 더미 = 염은 나간다","say":"올라가는 가지는 구멍이 하나도 없고 널빤지 이음매마다 새까만 역청을 메웠다. 물이 못 나간다. 대신 곁에 마른 소금 더미가 쌓였다. 상행지는 물에 불투과이고 염만 내보낸다. 그래서 올라갈수록 물이 옅어진다. 위쪽 굵은 상행지를 희석 분절이라 부른다.","box":[[1200,200,320,800],[1280,940,340,180]],"src":["s17u02#3"],"cards":["H1-99","H1-89","H1-88","H1-100","H1-81","X-RN-11","H1-98","H1-101","H1-116"]},{"sid":"s5","obj":"아래 가는 토막 — 벽 틈의 편 손바닥에서 결정이 저절로 흘러내린다","fact":"가는 상행지 — 농도차만으로 수동수송","hook":"맨손 = 수동(도구 없음)","say":"아래쪽 가는 토막은 벽 틈으로 편 손바닥 둘이 나와 있고, 흰 결정이 손바닥에서 저절로 흘러내린다. 기계가 없다. 가는 상행지는 에너지를 쓰지 않고 농도차만으로 염이 빠져나가는 수동수송이다.","box":[1120,600,400,240],"src":["s17u02#4"],"cards":["H1-82","S-RN-3","A1-59"]},{"sid":"s6","obj":"위 굵은 토막의 톱니 기계 — 소금 자루 하나 · 칼 하나 · 염소 둘","fact":"굵은 상행지 관강막 NKCC2 — Na⁺ 1 · K⁺ 1 · Cl⁻ 2 공동수송(2차 능동)","hook":"소금 = Na · 칼 = K · 염소 = Cl · 넷이 같이 실려야 돈다","say":"위쪽 굵은 토막에는 벽에 볼트로 박힌 톱니 기계가 관 속 결정을 빨아들여 활송로로 소금 자루 하나, 칼 하나, 염소 두 마리를 뱉는다. 소금은 나트륨, 칼은 칼륨, 염소는 염소 이온. 엔케이씨씨 투. 관 속 것을 들이니 자리는 관강막이다. 넷이 같이 실려야 움직이는 공동수송이고, 뒷문 펌프의 힘을 빌리는 이차 능동이다.","box":[1460,320,500,320],"src":["s17u02#5"],"cards":["H1-83","H1-102","X-RN-2","H1-105","S-RN-11","H1-84","H1-85","H1-168","X-RN-3"]},{"sid":"s7","obj":"기계 크랭크의 금색 자물쇠","fact":"푸로세미드(루프 이뇨제)가 NKCC2를 막는다","hook":"금색 자물쇠 = 약물(덱 전체 약속)","say":"그 기계의 크랭크에 큰 금색 자물쇠가 걸렸다. 금색은 약물. 루프 이뇨제 푸로세미드가 이 기계를 멈춘다. 염을 못 되찾으면 오줌에 남아 물을 끌고 나간다.","box":[1480,500,120,140],"src":["s17u02#6"],"cards":["X-RN-18","X-RN-19"]},{"sid":"s8","obj":"로마 투구 병사가 칼을 칼날부터 도로 밀어 넣는다","fact":"ROMK — K⁺를 관강으로 되돌려 NKCC2를 돌린다 · 관강 양전위 → Ca²⁺·Mg²⁺ 세포사이 재흡수","hook":"로마 투구 = ROM · 칼 = K","say":"기계 위 작은 투입구에 로마 투구를 쓴 병사가 칼을 칼날부터 도로 밀어 넣는다. 로마, 알오엠. 칼, 케이. 롬케이다. 나온 칼륨을 관 안으로 되돌려 보내야 기계가 계속 돈다. 이 되돌림이 관강을 양전위로 만들어 칼슘과 마그네슘이 세포 사이로 빠져나가 재흡수된다. 같은 병사가 집합관 주세포에도 선다. 둘 다 관강막이고 칼륨을 관 안으로 보내지만, 여기서는 되새는 것이고 거기서는 분비다.","box":[1200,20,360,360],"src":["s17u02#7"],"cards":["S-RN-4","X-RN-15","X-RN-4","H1-87","H1-94"]},{"sid":"s9","obj":"U 안쪽의 곧은 구리 왕복관 + 눈금 자","fact":"바사 렉타 — 역류교환으로 기울기를 유지만 한다(만드는 것은 헨레고리)","hook":"렉타 = 곧다 · 자는 재기만 한다","say":"유 자 안쪽에 이것만 자로 그은 듯 곧은 가는 구리관이 내려왔다가 머리핀처럼 되올라간다. 곁에 눈금 자. 둥근 관은 핏줄, 바사 렉타다. 렉타는 곧다. 내려갈 때 받고 올라갈 때 도로 놓는 역류교환으로 기울기를 씻어 내지 않고 지킨다. 세뇨관이 되찾은 물과 염은 이 핏줄이 실어 간다. 자는 재기만 하지 만들지 않는다.","box":[840,0,320,860],"src":["s17u02#8"],"cards":["H1-166","H1-167","X-RN-21"]},{"sid":"s10","obj":"뒷문 곁 동전 펌프가 소금 자루 셋을 문 너머로","fact":"기저외측 Na⁺-K⁺ 펌프(3Na⁺ 밖 · 2K⁺ 안 · ATP)가 구동력 · 뒷문 = 기저외측막","hook":"뒷문 = 기저외측막 · 동전 = ATP · 자루 셋 = 3 Na⁺","say":"뒷벽의 열린 뒷문 곁에 동전이 꽂힌 크랭크 펌프가 소금 자루 셋을 문 너머로 퍼낸다. 뒷문은 언제나 기저외측막, 혈액 쪽. 나트륨 칼륨 펌프가 에이티피로 나트륨 셋을 내보내고 칼륨 둘을 들인다. 세포 안 나트륨을 낮게 유지해야 앞쪽 기계가 돈다. 구동력.","box":[1520,600,528,544],"src":["s17u02#15"],"cards":["H1-117","X-RN-8"]},{"sid":"s11","obj":"수갱 전체 — 기울기를 만드는 기계와 지키는 구리관","fact":"역류증폭(헨레고리: 상행지 NaCl 재흡수가 수질 고삼투의 핵심) vs 역류교환(바사 렉타: 보존)","hook":"만드는 쪽과 지키는 쪽을 바꿔 쓰면 틀린다","say":"수갱 전체를 보라. 역청 벽의 기계가 염을 퍼내 수갱 벽을 짜게 만든다. 기계가 만드는 좌우 차이는 작다. 내려가는 물과 올라가는 물이 거꾸로 흘러 그 작은 차이가 깊이를 따라 쌓인다. 작은 수평 기울기를 길이 방향의 큰 기울기로 키우니 증폭이다. 역류증폭, 헨레고리. 증폭기는 굵은 상행지의 그 기계다. 조건은 둘이다. 올라가는 가지가 염을 퍼내고 내려가는 가지가 물을 내준다. 곧은 구리관은 그 기울기를 씻어 내지 않고 지킨다. 역류교환, 바사 렉타. 역류는 대향류라고도 한다. 만드는 쪽과 지키는 쪽을 바꿔 쓰면 틀린다.","box":null,"src":["s17u02#3","s17u02#8"],"cards":["H1-99","H1-89","H1-88","H1-100","H1-81","X-RN-11","H1-98","H1-101","H1-116","H1-166","H1-167","X-RN-21"]}],"cq":{"X-RN-12":["얇은 하행각은 NaCl에 잘 투과되는가?","아니다 — 물에는 매우 잘 투과되지만 NaCl에는 상대적으로 덜 투과된다"],"H1-8#3":["세뇨관에서 여과액이 흐르는 순서는?","헨레고리 하행지"],"H1-169":["역류증폭기의 핵심 조건 두 가지는?","상행각의 NaCl 재흡수와 하행각의 물 투과성"],"H1-67":["얇은 하행각(thin descending limb)의 가장 큰 특징은?","물에 매우 잘 투과되고 NaCl에는 상대적으로 덜 투과된다"],"H1-70":["얇은 하행각에 AQP1이 풍부하다는 사실의 의미는?","물이 쉽게 재흡수된다는 뜻"],"X-RN-6":["AQP1·AQP2·AQP3/AQP4는 각각 어디에 있는가?","AQP1 근위세뇨관·얇은 하행각 / AQP2 주세포 관강막(ADH가 증가) / AQP3·AQP4 기저외측막"],"H1-73":["헨레고리 하행각이 농축뇨 형성에 중요한 이유는?","물이 빠져나가 세뇨관액을 농축시키기 때문이다"],"H1-77":["하행각이 물에는 잘 투과되지만 NaCl에는 상대적으로 덜 투과된다는 점의 생리적 의미는?","물만 빠져나가 세뇨관액이 효과적으로 농축된다"],"H1-99":["상행각 전체의 공통된 중요한 특징은?","물 투과성이 낮다는 점"],"H1-89":["굵은 상행각에서 물이 거의 재흡수되지 않는 직접 이유는?","물 투과성이 매우 낮기 때문이다"],"H1-88":["굵은 상행각이 '희석 분절(diluting segment)'이라 불리는 이유는?","용질은 재흡수하지만 물은 따라가지 못해 세뇨관액이 묽어지기 때문이다"],"H1-100":["하행각과 상행각의 물질 이동 차이를 한 문장으로 쓰면?","하행각은 물 재흡수, 상행각은 주로 염 재흡수에 특화된다"],"H1-81":["얇은 하행각과 굵은 상행각의 가장 큰 대비점은?","하행각은 물이 잘 통과하고 · 굵은 상행각은 물이 거의 통과하지 않는다"],"X-RN-11":["굵은 상행각은 물에 투과성인가?","아니다 — 물 투과성이 매우 낮은 희석 분절 (← 얇은 하행각은 물에 매우 잘 투과)"],"H1-98":["굵은 상행각에서 염 재흡수는 되지만 물이 못 따라간다는 사실의 결과는?","관강액의 삼투농도 감소"],"H1-101":["헨레고리 상행각의 역할을 압축하면?","수질 삼투기울기 형성과 관강액 희석"],"H1-116":["굵은 상행각과 초기 원위세뇨관의 공통점은?","둘 다 염 재흡수에 비해 물 투과성이 낮아 관강액을 희석시킨다"],"H1-82":["얇은 상행각(thin ascending limb)의 핵심 특징은?","NaCl은 수동적으로 나가지만 물은 거의 통과하지 않는다"],"S-RN-3":["얇은 하행각과 얇은 상행각의 투과성 대비는?","하행: 물 O(AQP1)·NaCl X / 상행: NaCl O·물 X"],"A1-59":["수동 수송(passive transport)이란?","에너지 투입 없이 농도 기울기를 따라 일어나는 막 통과 이동"],"H1-83":["굵은 상행각(thick ascending limb, TAL)의 핵심 특징은?","Na+, K+, Cl-를 능동적으로 재흡수하지만 물은 거의 통과하지 않는다"],"H1-102":["Bartter syndrome이 NKCC2와 관련되는 이유는?","굵은 상행각의 염 재흡수 이상이기 때문이다"],"X-RN-2":["NKCC2가 작동하는 분절과 막은?","굵은 상행각의 관강막 (← 초기 원위세뇨관 관강막의 NCC와 혼동 주의)"],"H1-105":["얇은 상행각보다 굵은 상행각이 더 강력한 수질 기울기 형성에 기여하는 이유는?","능동적 NaCl 재흡수가 가능하기 때문이다"],"S-RN-11":["대향류 증폭계의 증폭기·교환기·필수 조건은?","증폭기 굵은 상행각·교환기 바사 렉타 / 상행 NaCl+하행 물"],"H1-84":["굵은 상행각 관강막의 대표 수송체는?","NKCC2"],"H1-85":["NKCC2의 의미는?","Na+-K+-2Cl- 공동수송체"],"H1-168":["헨레고리 굵은 상행각은 역류증폭기(countercurrent multiplier)라고 불리는 이유는?","작은 수평 기울기를 길이 방향 큰 수질 기울기로 증폭하기 때문"],"X-RN-3":["NCC가 있는 분절과 막은?","초기 원위세뇨관의 관강막 (← 굵은 상행각 NKCC2와 혼동 주의)"],"X-RN-18":["NKCC2를 표적으로 하는 이뇨제 계열과 대표 약물은?","loop diuretic / furosemide — 굵은 상행각 (← NCC 표적은 thiazide)"],"X-RN-19":["NCC를 표적으로 하는 이뇨제와 그 작용 부위는?","thiazide / 초기 원위세뇨관 (← 굵은 상행각에 작용하는 것은 loop diuretic)"],"S-RN-4":["굵은 상행각 관강막 수송체 2종과 각 역할은?","NKCC2(Na-K-2Cl 흡수)·ROMK(K+ 관강 되샘)"],"X-RN-15":["K+가 관강 쪽으로 되새는 분절과 그 이유는?","굵은 상행각 — NKCC2 작동에 필요한 K+ 순환 (← 주세포의 K+ 분비와 혼동 주의)"],"X-RN-4":["ROMK는 어느 분절들의 어느 막에 있고 K+를 어디로 보내는가?","굵은 상행각 관강막(K+ 되샘) + 주세포 관강막(K+ 분비) — 둘 다 K+를 관강으로"],"H1-87":["굵은 상행각에서 K+가 관강으로 되새는 이유는?","NKCC2 작동에 필요한 K+ 순환을 위해 ROMK 등을 통해 다시 관강으로 나가기 때문이다"],"H1-94":["굵은 상행각에서 양전하의 관강전위가 생기는 이유는?","K+가 일부 관강으로 되새기기 때문이다"],"H1-166":["바사 렉타(vasa recta)의 기능은?","수질 삼투기울기를 보존하면서 재흡수된 물과 용질을 운반하는 것"],"H1-167":["바사 렉타가 역류교환기(countercurrent exchanger)인 이유는?","내려갈 때와 올라갈 때 용질·물 교환으로 수질 기울기를 보존하기 때문"],"X-RN-21":["역류증폭기와 역류교환기는 각각 무엇인가?","증폭기 = 헨레고리 굵은 상행각 / 교환기 = 바사 렉타(U자형·느린 혈류)"],"H1-117":["초기 원위세뇨관에서 Na+ 재흡수의 기본 구동력은?","기저외측 Na+/K+-ATPase"],"X-RN-8":["Na+/K+-ATPase는 어느 막에 있는가?","기저외측막 — 근위세뇨관·굵은 상행각·초기 원위세뇨관·주세포에 공통 (관강막 아님)"]},"hubPanel":"s17u02"};

    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact));
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
function speak(t) {
  t = ttsNorm(t);
  const my = ++speakSeq, at = i;
  const advance = (ms) => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, ms);
  if (!('speechSynthesis' in window)) { if (playing) advance(3500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = () => { if (started) advance(700); };
  u.onerror = () => { if (!started) advance(3000); };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started && my === speakSeq) { speechSynthesis.cancel(); advance(3000); } }, 2500);  // 목소리가 없으면 글만 3초
}
function go(k) {
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) setTimeout(() => { if (playing) next(); }, 3500);
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; speechSynthesis && speechSynthesis.cancel(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i + 1); else speechSynthesis && speechSynthesis.cancel(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) speechSynthesis && speechSynthesis.cancel(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
</script>
