const L = {"id":"L31b","scene":"s31","part":"b","title":"레몬 탄산수 공장의 여덟 작업대 — 피루브산 산화 · 시트르산 회로","sub":"왼쪽 입고실의 3→2탄소 · 가위 노인의 허리띠 다섯(PDH 보조인자) · 윗줄 1→4 / 아랫줄 5→8 · 남색 알로 세는 탄소 수 · 흰 배기가스 · 둥근 파란 물통과 네모난 녹색 물통 · 금빛 칩","img":"img/L31b.webp?v=f24436ebc3a1","w":2304,"h":1296,"stops":[{"sid":"s1","obj":"왼쪽 붉은 커튼의 입고실과 두 층으로 이어진 레몬 병입 공장","fact":"피루브산 산화와 시트르산 회로는 주로 미토콘드리아 기질에서 일어난다","hook":"입구의 재료가 공장 안을 한 바퀴 돈다","say":"별관에서는 피루브산 산화가 일어나고, 이어 두 탄소짜리 아세틸기가 공장 안의 시트르산 회로에 들어간다. 두 과정은 주로 미토콘드리아 기질에서 진행된다. 피루브산은 붉은 커튼을 능동수송으로 통과해 들어온다. 피루브산 하나가 입고실과 회로를 모두 지나면 NADH 넷, FADH₂ 하나, ATP 하나, CO₂ 셋이 생성된다. 회로 효소 가운데 숙신산 탈수소효소만 내막에 박힌 채 기질 쪽을 향한다.","box":null,"src":["s31u01#14"],"ask":"입구와 본관은 각각 무엇이며, 두 반응의 주된 장소는 어디인가?","cards":["B1-6","B1-101","B1-69","B1-65","B1-85"]},{"sid":"s2","obj":"입고실 가위 뒤, 맞물린 톱니와 걸쇠가 달린 황동 출입구","fact":"피루브산 탈수소효소 복합체의 연결반응은 생리적으로 비가역이다","hook":"한 방향으로만 들어가는 입구 = 비가역 반응","say":"피루브산을 아세틸 CoA로 바꾸는 효소는 피루브산 탈수소효소 복합체다. 포유류에서 이 연결반응은 생리적으로 비가역적이다.","box":[275,444,157,212],"src":["s31u01#8"],"ask":"입구가 나타내는 반응의 효소와 방향성은?","cards":[]},{"sid":"s3","obj":"세 탄소 원료, 큰 가위와 위로 빠지는 한 덩이의 배기가스","fact":"피루브산(3C)에서 CO₂ 1분자 방출","hook":"입구에서 탄소 하나가 빠지면 세 탄소 중 둘이 남는다","say":"해당과정에서는 이산화탄소가 나오지 않는다. 피루브산 산화 단계에 들어와서야 피루브산의 카복실기 탄소 하나가 이산화탄소로 떨어져 나간다.","box":[[65,609,220,200],[343,143,100,73],[29,1151,155,67]],"src":["s31u01#9"],"ask":"입구의 원료는 몇 탄소이며, 여기서 처음 방출되는 분자는 무엇인가?","cards":["B1-71","B1-76"]},{"sid":"s19","obj":"입고실 가위 노인의 앞치마 위에 찬 가죽 허리띠 — 매달린 다섯: 짧은 파란 넥타이 · 빨간 립스틱 · 작은 파란 짐표 · 작은 초록 네모 통 · 작은 빈 파란 둥근 양동이(속이 어둡다) · 그림 왼쪽 끝 허리에 가죽 주머니 하나","fact":"PDH(다효소 복합체)의 보조인자 다섯 = TPP · 리포산 · CoA · FAD · NAD⁺","hook":"넥타이 = 티아민(TPP) · 립스틱 = 리포산 · 짐표 = CoA · 네모 통 = FAD · 둥근 양동이 = NAD⁺","say":"입고실에서 가위를 든 노인을 다시 보자. 앞치마 위 가죽 허리띠에 연장 다섯을 달았다. 노인과 뒤의 톱니 황동문을 함께 피루브산 탈수소효소 복합체, PDH로 연결한다. 효소 셋이 하나로 결합해 세 반응을 연속 수행하며 피루브산을 아세틸 CoA로 산화하는 다효소 복합체다. 필요한 보조인자 다섯은 허리띠의 연장이다. 짧은 파란 넥타이는 티아민인 비타민 B1에서 유래한 TPP로, L12d의 넥타이와 같다. 빨간 립스틱의 립은 리포산, 파란 짐표는 꾸러미에 다는 조효소 A이다. 초록 네모 통은 FAD, 비어 있는 파란 둥근 양동이는 NAD⁺이다. 왼쪽부터 넥타이·립스틱·짐표·네모 통·둥근 통의 순서로 짚어 보자.","box":[45,615,185,155],"cards":["B1-66","B1-67"]},{"sid":"s4","obj":"입고실을 나갈 작은 노란 꾸러미와 그 안에 남은 탄소 둘","fact":"남은 2탄소는 아세틸기를 이룬다","hook":"입구를 통과한 두 탄소 = 아세틸기","say":"탄소 셋인 피루브산에서 탄소 하나가 이산화탄소로 나가면, 남은 탄소 둘은 아세틸기를 이룬다. ‘두 탄소’라는 말은 이 아세틸기의 탄소 수를 가리킨다.","box":[[326,705,92,108],[234,1151,118,71]],"src":["s31u01#10"],"ask":"입구에서 탄소 하나를 뗀 뒤 남은 기의 이름과 탄소 수는?","cards":["B1-96"]},{"sid":"s5","obj":"노란 꾸러미에 매달린 큼직한 파란 짐표","fact":"아세틸기가 조효소 A에 결합해 아세틸 CoA가 된다","hook":"두 탄소에 운반체가 붙으면 회로로 들어갈 수 있다","say":"두 탄소의 아세틸기에 조효소 A가 붙으면 아세틸 CoA이다. 첫 작업대에서 아세틸기를 옥살로아세트산에 전달할 때 조효소 A는 떨어져 나온다.","box":[300,687,112,124],"src":["s31u01#11"],"ask":"별관에서 나온 2탄소 기에 붙은 운반체와 둘이 함께 이루는 분자는?","cards":["B1-64","B1-77","B1-73"]},{"sid":"s6","obj":"입고실 가위 아래에 놓인 물이 가득한 둥근 파란 금속 양동이","fact":"피루브산 1분자당 NADH 1분자 생성","hook":"입구에서 이미 채운 둥근 물통 한 개 = 연결반응 NADH 한 개","say":"피루브산 한 분자가 산화될 때 NAD⁺ 한 분자는 NADH로 바뀐다. 입고실의 NADH 하나는 회로 안에서 생성하는 셋과 구분해 세어야 한다. 포도당 하나에서는 피루브산 둘이 나오므로, 입고실의 생성물은 아세틸 CoA 둘, NADH 둘, CO₂ 둘이다.","box":[29,821,153,210],"src":["s31u01#12"],"ask":"별관에서 피루브산 한 분자당 어느 환원성 조효소가 몇 분자 생기는가?","cards":["B1-70","B1-75"]},{"sid":"s7","obj":"입고실 물통 옆, 바닥이 비치는 빈 황동 동전 접시","fact":"피루브산 산화에서 ATP가 직접 생기지 않는다","hook":"입구의 빈 자리 = 직접 얻는 ATP 0","say":"피루브산 산화에서 나오는 것은 아세틸 CoA, CO₂, NADH이다. 이 단계에서는 ATP를 직접 합성하지 않는다. 만들어진 NADH는 뒤의 전자전달계에 전자를 전달한다.","box":[200,911,218,134],"src":["s31u01#13"],"ask":"별관에서 ATP는 직접 몇 분자 합성되는가?","cards":["B1-72"]},{"sid":"s8","obj":"윗줄로 나아가 오른쪽 끝에서 내려오고, 아랫줄을 따라 출발점으로 돌아오는 길","fact":"시트르산 회로는 여덟 단계 뒤 4탄소 옥살로아세트산을 재생한다","hook":"레몬 = 시트르산, 마지막 산물이 첫 작업대로 돌아가는 길 = 회로","say":"윗줄은 왼쪽에서 오른쪽으로, 아랫줄은 오른쪽에서 왼쪽으로 따라가자. 아랫줄 마지막 작업대의 4탄소 옥살로아세트산은 왼편의 위쪽 화살표를 따라 첫 작업대로 돌아온다. 파란 짐표에서 이어지는 별도 입고관은 첫 작업대에 2탄소 아세틸기를 공급한다. 이 회로는 TCA 회로 또는 크렙스 회로라고도 한다. 포도당 하나에서 아세틸기 둘이 나오므로 두 바퀴를 돌며, 회로만 합산하면 NADH 여섯, FADH₂ 둘, ATP 둘, CO₂ 넷을 생성한다.","box":[[461,797,37,106],[897,609,65,53],[2249,870,47,92],[1342,1231,63,51]],"src":["s31u01#14"],"ask":"윗줄과 아랫줄을 따라간 뒤 처음으로 돌아가는 수용체의 이름과 탄소 수는?","cards":["B1-6","B1-101","B1-78","B1-95","B1-100","B1-86"]},{"sid":"s9","obj":"윗줄 맨 왼쪽, 곱슬머리 장인의 레몬 압착기와 남색 탄소알 여섯","fact":"① 옥살로아세트산(4C) + 아세틸기(2C) → 시트르산(6C)","hook":"남색 탄소알 하나 = 탄소 한 개. 짐표에서 온 두 알 + 아랫줄에서 돌아온 네 알 = 여섯 알","say":"첫 반응에서는 시트르산 합성효소가 아세틸 CoA의 아세틸기와 네 탄소 옥살로아세트산을 축합한다. 여섯 탄소의 시트르산이 만들어지고 CoA는 떨어진다.","box":[[498,147,396,359],[498,534,396,96],[500,424,230,122]],"src":["s31u01#15"],"ask":"첫 작업대에 들어오는 두 탄소 골격과 탄소 수, 생성물은?","cards":["B1-97","B1-102","B1-79","B1-73","B1-99","B1-96","B1-98"]},{"sid":"s14","src":[],"fact":"② 시트르산(6C) → 이소시트르산(6C) · 이성질화","hook":"같은 여섯 탄소의 재배열 = 이소시트르산","say":"아코니테이스는 물을 제거했다가 다시 붙여 수산기의 위치를 바꾼다. 이소시트르산이 되어도 탄소 수는 여섯으로 유지된다. 이 단계에서는 CO₂와 NADH가 생성되지 않는다.","ask":"둘째 작업대에서 어떤 이성질체가 생기며 탄소 수는 어떻게 변하는가?","cards":["B1-103"],"obj":"윗줄 두 번째, 한 레몬의 잎 위치를 바꾸는 장인과 탄소알 여섯","box":[[936,147,412,359],[936,534,412,96]]},{"sid":"s15","src":[],"fact":"③ 이소시트르산(6C) → α-케토글루타르산(5C) · NADH + CO₂","hook":"첫 굴뚝과 둥근 물통 = 첫 산화적 탈탄산","say":"이소시트르산 탈수소효소는 산화적 탈탄산을 촉매한다. 이산화탄소 하나가 빠져나가면서 탄소 수가 여섯에서 다섯으로 줄고, NAD⁺ 한 분자가 NADH로 환원된다.","ask":"셋째 작업의 기질과 생성물, 전후 탄소 수와 함께 나오는 두 분자는?","cards":["B1-104","B1-110"],"obj":"윗줄 세 번째, 붉은 조끼 장인의 손잡이 압착기와 탄소알 다섯","box":[[1419,147,394,359],[1419,534,394,96]]},{"sid":"s16","src":[],"fact":"④ α-케토글루타르산(5C) → 숙시닐 CoA(4C) · NADH + CO₂","hook":"둘째 굴뚝과 둥근 물통 = 두 번째 산화적 탈탄산","say":"α-케토글루타르산 탈수소효소 복합체는 두 번째 산화적 탈탄산을 촉매한다. CO₂ 하나와 NADH 하나가 생성되고 CoA가 결합한다. 이때 ‘네 탄소’는 CoA에 결합한 숙시닐기의 탄소 수다.","ask":"넷째 작업에서 다섯 탄소는 어떤 네 탄소 물질이 되며, 무엇이 생기는가?","cards":["B1-105","B1-111"],"obj":"윗줄 맨 오른쪽, 상자에 파란 짐표를 매다는 장인과 탄소알 넷","box":[[1880,147,381,359],[1880,534,381,96]]},{"sid":"s13","obj":"아랫줄 맨 오른쪽, 떼어 놓은 파란 짐표와 황동 압인기에서 나온 금빛 네모 칩 하나","fact":"⑤ 숙시닐 CoA(4C) → 숙신산(4C) · GTP 또는 ATP 1","hook":"금빛 네모 칩 한 닢 = 기질수준 인산화로 얻는 GTP 또는 ATP 한 분자","say":"숙시닐 CoA 합성효소는 네 탄소 숙신산과 유리 CoA를 만들면서 기질수준 인산화를 일으킨다. GDP를 사용하는 동종효소는 GTP 한 분자를, ADP를 사용하는 동종효소는 ATP 한 분자를 합성한다.","box":[[1880,713,381,359],[1880,1123,381,106]],"src":["s31u01#19"],"ask":"어떤 기질이 무엇으로 바뀌며 어떤 뉴클레오타이드를 직접 얻는가?","cards":["B1-88","B1-106","B1-193#3","B1-82","B1-84#3","B1-23"]},{"sid":"s12","obj":"아랫줄 오른쪽에서 두 번째, 주름진 벽에 볼트로 고정한 기계와 여기에 연결된 녹색 네모 물통","fact":"⑥ 숙신산(4C) → 푸마르산(4C) · 효소에 결합한 FAD가 환원","hook":"기계에 연결된 녹색 네모 물통 = 복합체 II에 결합한 FAD의 환원형 FADH₂","say":"숙신산 탈수소효소는 내막에 있는 전자전달계 복합체 II이기도 한다. 숙신산을 푸마르산으로 산화하는 동안 효소에 결합한 FAD가 잠시 FADH₂가 되고, 전자는 유비퀴논으로 전달된다. 이 전자쌍은 복합체 I을 건너뛰므로 산화적 인산화 수율은 통상 약 1.5 ATP이다. 기질 NADH의 약 2.5 ATP와 비교하자. 포도당 하나를 기준으로 FADH₂는 둘이다.","box":[[1419,713,394,359],[1419,1123,394,106]],"src":["s31u01#18"],"ask":"어느 두 물질 사이에서 FAD가 환원되는가? 효소의 위치와 NADH보다 ATP 수율이 낮은 이유는?","cards":["B1-81","B1-84#2","B1-91","B1-92","B1-107","B1-195"]},{"sid":"s17","src":[],"fact":"⑦ 푸마르산(4C) + 물 → 말산(4C) · 수화","hook":"첨가되는 물 한 방울 = 푸마르산 수화","say":"푸마레이스가 푸마르산의 이중결합에 물을 첨가하면 L-말산이 된다. 탄소 넷은 그대로 유지되고, CO₂와 NADH는 생성되지 않는다.","ask":"이 네 탄소 물질에 물을 더하면 무엇이 되는가?","cards":["B1-108","B1-112"],"obj":"아랫줄 오른쪽에서 세 번째, 물뿌리개에서 깔때기로 들어가는 물줄기와 탄소알 넷","box":[[936,713,412,359],[936,1123,412,106]]},{"sid":"s18","src":[],"fact":"⑧ 말산(4C) → 옥살로아세트산(4C) · NADH","hook":"CO₂ 없이 마지막 둥근 통이 찬다 = 말산 산화","say":"말산 탈수소효소가 말산을 산화하면서 회로의 세 번째 NADH를 만든다. 네 탄소 옥살로아세트산이 재생되어 다음 아세틸기를 받을 준비가 된다.","ask":"마지막 네 탄소 물질이 산화되면 어떤 수용체가 재생되고 무엇이 환원되는가?","cards":["B1-95","B1-99","B1-109","B1-113"],"obj":"아랫줄 맨 왼쪽, 노인의 레몬 롤러와 탄소알 넷, 마지막 둥근 물통","box":[[498,713,396,359],[498,1123,396,106]]},{"sid":"s10","obj":"윗줄 오른쪽 두 작업대에 한 덩이씩 뜬 배기가스","fact":"3·4단계에서 각각 CO₂ 1분자 방출 · 한 회전 합계 2분자","hook":"윗줄의 이웃한 두 작업대에서 한 탄소씩 빠져 6→5→4가 된다","say":"회로 안에서는 이소시트르산과 α-케토글루타르산의 산화 때 CO₂가 각각 나온다. 입구 연결반응에서 생성한 CO₂는 별도로 계산한다. 이 회로의 본질은 탄소에 산소를 붙여 CO₂로 내보내는 것이다. 포도당 분해가 CO₂까지 진행되는 곳이 입고실과 이 회로다. 포도당의 탄소 여섯은 결국 CO₂ 여섯으로 나가지만, 새로 들어온 아세틸기의 두 탄소가 첫 회전에서 나오는 CO₂의 탄소인 것은 아니다.","box":[[1478,94,114,69],[2023,77,116,75]],"src":["s31u01#16"],"ask":"한 회전에서 CO₂를 방출하는 두 반응과 각각의 전후 탄소 수는?","cards":["B1-83","B1-84#4","B1-94","B1-89","B1-20","B1-197","B1-201"]},{"sid":"s11","obj":"윗줄 오른쪽 두 작업대와 아랫줄 맨 왼쪽 작업대에 하나씩 놓인 둥근 파란 금속 양동이"," let speakSeq = 0;

function speak(t, sid) {

// Keep each stable SID so recap reuses the same reviewed recording as the tour.
