<script>
const L = {"id":"L53c","scene":"s53","part":"c","title":"바닷속 버터 부교 ③ 동전 펌프와 짝 손님 — 능동수송 · 막전위 · Na⁺-K⁺ 펌프 · 공동수송","sub":"L53a · L53b 와 같은 버터 띠(세포막) — 왼쪽 큰 놋쇠 펌프 기계: 동전을 넣으면 붉은 도장이 찍히고 유리 문짝이 돌아 흰 소금 자루 셋은 위로 · 칼 둘은 아래로(Na⁺-K⁺ 펌프 · 인산화 · 3 Na⁺ 밖 · 2 K⁺ 안) · 펌프에서 번쩍이는 붉은 전선이 닿은 큰 건전지(막전위 · 안쪽이 음 · 전기발생성 펌프) · ＋ 소금 자루는 안으로 · － 염소는 밖으로 / 오른쪽 회전문 넷: 소금 자루와 포도가 나란히(Na⁺-포도당 공동수송 · 경구수액 컵) · 레몬과 갈색 자루(H⁺-설탕 · 해바라기 = 식물) · 포도 혼자(단일수송) · 소금 자루와 자갈이 엇갈려(역수송 Na⁺/Ca²⁺) / 금색 자물쇠가 채워진 작은 펌프 → 쌓인 소금 자루 → 쌓인 자갈 → 나무집의 알통(우아바인 · 디곡신).","img":"img/L53c.webp?v=0c1889e99807","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"L53a · L53b 와 같은 긴 노란 버터 띠 — 왼쪽에 띠를 꿰뚫어 박힌 큰 놋쇠 펌프 기계 · 가운데 띠를 꿰뚫어 선 큰 건전지 · 오른쪽에 회전문을 품은 구슬 기둥 넷과 금색 자물쇠가 채워진 작은 펌프 (틀)","fact":"능동수송 = 에너지를 써서 농도 기울기를 거슬러 옮김 — 안팎 농도를 다르게 유지","hook":"놋쇠 펌프 기계 + 동전 = 능동수송 · 빽빽한 쪽으로 밀어 올림 = 기울기를 거슬러 · 위아래 물의 다른 손님 = 다른 농도 유지","say":"L53b 끝에 있던 놋쇠 펌프를 중심으로 보자. 띠 위의 밝은 물은 세포 밖, 아래 짙은 물은 세포 안이다. 앞의 손님들은 농도가 높은 곳에서 낮은 곳으로 스스로 이동했지만, 이 펌프는 반대로 움직인다. 흰 소금 자루를 이미 자루가 많은 위쪽으로, 칼을 이미 칼이 많은 아래쪽으로 옮긴다. 낮은 농도에서 높은 농도로 이동하려면 에너지가 필요하므로 ATP 동전을 사용한다. 이처럼 에너지를 써 농도 기울기를 거스르는 것이 능동수송이며, 세포 안팎의 농도를 다르게 유지할 수 있게 한다. 왼쪽 펌프에서 가운데 건전지, 오른쪽 짝 손님 문으로 따라가 보자.","cards":["A1-88","A1-89","A1-91"],"box":null},{"sid":"s2","obj":"펌프 왼쪽 위 물에 빽빽한 흰 소금 자루 무리 · 펌프 아래 물에 빽빽한 은빛 칼 무리 (위 물의 칼은 둘 · 아래 물의 자루는 셋뿐)","fact":"동물세포 안 = K⁺ 높고 Na⁺ 낮다 — 막이 Na⁺ 는 밖으로 · K⁺ 는 안으로","hook":"아래 물(안)에 빽빽한 칼 = K⁺ 높음 · 위 물(밖)에 빽빽한 흰 소금 자루 = Na⁺ 는 밖이 높음(안은 낮음)","say":"먼저 분포를 확인하자. 세포 밖인 위쪽에는 흰 소금 자루가 많고 칼은 둘뿐이다. 세포 안인 아래쪽에는 은빛 칼이 많고 자루는 셋뿐이다. L23a 긴 홀과 같이 소금 자루는 Na⁺, 칼은 K⁺이다. 동물세포 안은 세포외액보다 K⁺ 농도가 높고 Na⁺ 농도가 낮다. 그대로 두면 L53b의 틈과 문으로 새며 농도가 같아지려 하므로, 세포막은 계속 Na⁺를 밖으로, K⁺를 안으로 옮겨 기울기를 유지한다. 그 일을 하는 구조가 놋쇠 펌프다.","cards":["A1-92","A1-93"],"box":[[22,68,345,290],[330,785,400,340],[222,795,150,135],[418,185,112,172]]},{"sid":"s3","obj":"띠를 꿰뚫어 박힌 큰 놋쇠 펌프 기계 — 둥근 창 한가운데 세로로 선 유리 문짝(위아래 놋쇠 마구리 · 가운데 놋쇠 축) · 오른쪽 옆구리의 크랭크(ㄱ자로 꺾인 쇠막대 · 끝에 검은 손잡이) · 밑면 투입구로 ↑ 화살을 따라 오르는 금빛 동전 · 왼쪽 옆구리에 붉은 도장 자국을 찍은 나무 손잡이 도장","fact":"능동수송은 운반단백질이 한다 · 직접 에너지원 = ATP — 운반체를 인산화해 구조를 바꿈","hook":"문짝 도는 기계(뚫린 틈 ✕) = 운반단백질 · 동전 = ATP · 붉은 도장 = 인산기 전달(인산화) → 문짝이 돈다 = 구조 변화","say":"기계의 둥근 창 가운데에는 축에 연결된 유리 문짝이 있다. L53b의 회전문처럼 모양을 바꾸는 운반단백질이다. 능동수송 단백질은 단순히 뚫린 통로가 아니라 운반단백질이다. 통로는 길을 열어 줄 뿐 거슬러 밀지 못하므로, 손님을 붙잡고 구조를 바꿀 힘이 필요하다. 밑면 투입구로 들어가는 금빛 동전은 직접 에너지원인 ATP이다. 동전이 들어오면 왼쪽 옆에 붉은 도장이 찍히는데, 이 덱의 인산화 표지다. ATP가 인산기를 운반단백질에 전달하면 구조가 바뀌어 문이 회전한다. 인산화에 따른 구조 변화가 기울기를 거스르는 수송을 가능하게 한다.","cards":["A1-90","A1-151","A1-94","A1-95"],"box":[[80,296,600,492],[508,772,60,110]]},{"sid":"s4","obj":"펌프의 둥근 창 속 — 세로로 선 유리 문짝의 왼쪽 칸에 흰 소금 자루 셋과 ↑ 화살 · 오른쪽 칸에 날을 아래로 한 칼 둘과 ↓ 화살","fact":"Na⁺-K⁺ 펌프 = 1회에 Na⁺ 3개 밖으로 · K⁺ 2개 안으로 — ATP 를 직접 씀","hook":"왼쪽 칸 자루 셋 ↑ = Na⁺ 3 밖으로 · 오른쪽 칸 칼 둘 ↓ = K⁺ 2 안으로 · 밑의 동전 = ATP 직접","say":"창의 왼쪽 칸에는 흰 소금 자루 셋과 위쪽 화살표, 오른쪽 칸에는 칼 둘이 있고 칼날과 화살표 모두 아래쪽을 향한다. 한 번 작동할 때 Na⁺ 3개를 밖으로, K⁺ 2개를 안으로 옮기는 나트륨-칼륨 펌프다. 자루 셋은 나가고 칼 둘은 들어온다. ATP 동전이 이 기계의 투입구로 직접 들어간다는 점도 확인하자. 다른 펌프가 만든 기울기를 이용하는 오른쪽 짝 손님 문들과의 차이다.","cards":["A1-102","A1-103"],"box":[[204,408,328,322]]},{"sid":"s5","obj":"펌프 아래 물에서 기계 밑으로 다가온 흰 소금 자루 셋 → 왼쪽 옆구리의 도장과 붉은 도장 자국 → 창 왼쪽 칸에 실려 ↑ 오르는 자루 셋 → 기계 위 물의 흰 소금 자루 무리","fact":"① 세포질 Na⁺ 3 결합 → ② ATP 인산화 → ③ 모양 변화 · Na⁺ 친화성 ↓ → ④ 밖으로 방출","hook":"밑에서 타는 자루 셋 = 세포질 Na⁺ 3 결합 · 붉은 도장 = 인산화 · 문짝이 돎 = 모양 변화(Na⁺ 친화성 ↓) · 위로 나감 = 방출","say":"펌프의 앞 단계를 따라가 보자. 첫째, 아래 물인 세포질 쪽에서 흰 소금 자루 셋이 기계 밑으로 다가와 왼쪽 칸에 탄다. Na⁺ 3개가 펌프에 결합하는 모습이다. 둘째, ATP 동전이 들어오고 왼쪽 옆구리에 붉은 도장이 찍힌다. ATP에 의한 인산화가 단백질을 자극한다. 셋째, 문이 회전하며 펌프 형태가 바뀌고 Na⁺ 친화성이 낮아진다. 넷째, 자루 셋이 위쪽으로 나가 바깥의 자루 무리에 합류하듯 Na⁺가 세포 밖으로 방출된다. 결합하고, 인산화되고, 형태가 바뀌고, 밖으로 놓이는 순서다.","cards":["A1-104","A1-105","A1-106","A1-107"],"box":[[222,795,150,135],[80,448,112,122],[222,418,126,304],[22,68,345,290]]},{"sid":"s6","obj":"기계 위 물에서 다가오는 칼 둘 → 창 오른쪽 칸에 실려 ↓ 내려가는 칼 둘 → 오른쪽 아래 놋쇠 면의 붉은 자국(점선 테가 번졌다)과 기계 밑으로 떨어지는 같은 꼴의 붉은 조각 → 아래 물의 칼 무리","fact":"⑤ K⁺ 친화성 ↑ → K⁺ 2 결합 → ⑥ 인산기 탈리 → 원래 모양 → ⑦ K⁺ 를 세포 안에 방출","hook":"위에서 타는 칼 둘 = K⁺ 2 결합(친화성 ↑) · 떨어지는 붉은 도장 자국 = 인산기 탈리 · 문짝이 되돎 = 원래 모양 · 아래로 내림 = 세포 안","say":"이어지는 단계를 보자. 다섯째, Na⁺를 놓은 펌프는 K⁺에 대한 친화성이 높아져 기계 위 바깥 물에서 다가온 칼 둘을 오른쪽 칸에 태운다. 여섯째, 붉은 도장이 떨어진다. 오른쪽 아래 놋쇠 면의 번지고 들뜬 자국과 아래로 떨어지는 같은 모양의 붉은 조각 하나가 인산기 탈리다. 인산기가 떨어지면 문이 되돌아 원래 형태가 된다. 일곱째, 원래 형태는 K⁺ 친화성이 낮아 칼 둘을 아래쪽 세포 안에 방출한다. 그다음 다시 소금 자루 셋을 받을 차례이며, 한 주기에 ATP 동전 하나를 사용한다.","cards":["A1-108","A1-109","A1-110"],"box":[[418,185,112,172],[390,418,118,304],[522,684,150,170],[330,785,400,340]]},{"sid":"s7","obj":"펌프 기계의 오른쪽 위 모서리에서 건전지 꼭지로 이어진 붉은 전선 — 전선 위에 번쩍이는 노란 불꽃 둘","fact":"3 내보내고 2 들임 → 순 양전하를 밖으로 → 막전위에 기여 = 전기발생성 펌프","hook":"셋 나가고 둘 들어옴 = 한 바퀴마다 ＋ 하나가 밖으로 · 펌프 → 건전지의 번쩍이는 붉은 전선 = 전기발생성 펌프(전압을 만듦)","say":"펌프 오른쪽 위에서 나온 붉은 전선이 건전지 꼭지에 닿고, 노란 불꽃이 번쩍인다. 펌프가 건전지를 충전하는 모습이다. 양전하 셋을 내보내고 둘을 들이므로 한 주기마다 순양전하 하나가 밖으로 더 나간다. 이 전하 이동이 안팎의 전압 차이를 만드는 데 기여한다. 그래서 나트륨-칼륨 펌프는 막전위 유지에도 관여한다. 막을 사이에 두고 전압을 형성하는 수송 단백질을 전기발생성 펌프, electrogenic pump라고 하며, 동물세포의 대표가 Na⁺-K⁺ 펌프다.","cards":["A1-111","A1-112"],"box":[[586,158,180,168]]},{"sid":"s8","obj":"버터 띠를 꿰뚫어 세로로 선 큰 건전지 — 주황 윗부분(＋ 표)은 위 물에서 띠 윗자락까지 · 짙은 회색 몸통은 띠 속을 지나 아래 물까지 내려갔고 그 아래 끝에 흰 － 표","fact":"전압 = 반대 전하의 격리에 따른 전기적 위치에너지(전하당 · V) · 막전위 = 막을 가로지르는 전압","hook":"띠가 ＋ 와 － 를 갈라 놓음 = 반대 전하의 격리(전압) · 띠를 꿰뚫은 건전지 = 막전위 · 건전지 = 전하 띤 물질 이동의 에너지원","say":"버터 띠를 관통한 큰 건전지는 ＋ 극이 위, － 극이 아래다. 막이 반대 전하를 분리해 놓으면 서로 끌어당기는 힘이 저장된다. 기본서는 전압, voltage를 반대 전하의 분리에 따른 전기적 위치에너지라고 한다. 정확히는 전하 하나당의 위치에너지 차이이며, 단위는 볼트다. 이 전압이 막을 사이에 두고 생기면 막전위, membrane potential이다. 모든 세포막은 작은 건전지처럼 작용한다. 막전위는 이온처럼 전하가 있는 물질의 막 통과에 에너지원으로 쓰일 수 있다. 건전지에서 오른쪽 문으로 가는 파란 전선을 저장 에너지의 사용과 연결하자.","cards":["A1-96","A1-97","A1-100"],"box":[[698,232,106,518]]},{"sid":"s9","obj":"건전지의 흰 － 표가 찍힌 아래 끝이 아래 물에 잠겼다 · 건전지 오른쪽 위 물 — ＋ 표가 붙은 흰 소금 자루와 ↓ 화살 · 아래 물 — － 표가 붙은 흰 염소(뿔 · 턱수염)와 ↑ 화살","fact":"세포 안이 더 음전하(−50 ~ −200 mV) → 양이온은 안으로 · 음이온은 밖으로","hook":"아래 물(안)의 － 극 = 세포 안이 음 · ＋ 소금 자루 ↓ = 양이온은 안으로 · － 염소(Cl⁻) ↑ = 음이온은 밖으로","say":"건전지의 － 극은 세포 안인 아래쪽에 있다. 세포 내부가 바깥보다 음전하이고, 막전위는 보통 −50 mV에서 −200 mV이다. 음수 부호는 안쪽이 음임을 뜻한다. 이온은 농도 차이뿐 아니라 전기력도 받는다. 오른쪽 위의 ＋ 표시가 있는 소금 자루는 아래 화살표를 따라 음인 내부로 끌린다. 아래쪽의 － 표시가 있는 흰 염소는 위쪽 화살표를 따른다. 염소는 이 덱의 Cl⁻이며, 음이온은 음인 내부에서 밀려 바깥쪽으로 향한다. 막전위의 전기적 힘은 양이온을 안으로, 음이온을 밖으로 이끈다. 실제 이온 이동을 정하는 힘은 농도 기울기와 전기력을 합한 전기화학적 기울기다.","cards":["A1-98","A1-99","A1-101"],"box":[[702,652,98,96],[808,284,112,150],[804,712,124,184]]},{"sid":"s10","obj":"건전지에서 파란 전선이 닿은 첫 회전문 기둥 — 굴 속에 흰 소금 자루와 포도가 나란히 · 기운 유리 문짝의 같은 칸(오른쪽 아래)에도 둘이 함께 탔다 · 문 밑에 ↓ 화살 둘 · 문 위쪽 물에는 흰 소금 자루가 여럿 · 문 아래쪽 물에는 포도가 여럿(흰 소금 자루는 하나)","fact":"공동수송 = 한 물질의 기울기로 다른 물질의 수송을 결합 — 이온 기울기로 영양물질을 들임","hook":"함께 탄 소금 자루 + 포도 = 공동수송 · 자루는 내리막 · 포도는 그 힘에 끌려 오르막 · 파란 전선 = 저장된 에너지(막전위 · 이온 기울기)를 씀","say":"건전지에서 나온 파란 전선이 첫 회전문의 기둥에 닿는다. 이 문에는 동전 투입구가 없다. 대신 손님이 둘씩 탄다. 흰 소금 자루와 포도가 굴 속에 나란히, 문짝의 같은 칸에도 함께 있고 화살표 둘도 아래를 향한다. 위에는 소금 자루가 많고 아래에는 포도가 많으므로, 소금은 농도가 낮은 아래쪽으로 내려가고, 포도도 이미 포도가 많은 아래쪽으로 들어간다. 공간상으로는 같은 방향이지만, 포도에게는 농도 기울기를 거스르는 오르막이다. 내리막을 구르는 소금 자루가 포도를 끌고 들어가는 모습을 보자. 한 물질의 기울기를 이용해 다른 물질의 수송을 결합하는 공동수송, 동반수송이다. 생물은 이렇게 이온 기울기의 에너지로 영양분을 받아들인다. 소장의 아미노산과 작은 펩타이드도 이온 기울기를 이용하는 능동수송으로 들어온다. 이 기울기는 왼쪽 펌프가 ATP로 쌓아 건전지에 저장한 것이다. 막전위와 이온 기울기에 저장된 에너지를 다른 물질의 수송에 사용하는 과정이다.","cards":["A1-113","A1-114","A1-150","G1-122","G1-123"],"box":[[762,186,240,76],[982,440,106,268],[948,96,190,178],[954,716,164,230]]},{"sid":"s11","obj":"첫 회전문 위 — 빨간 빨대가 꽂힌 유리컵 속에 작은 흰 소금 자루와 포도 / 둘째 회전문 기둥 — 꼭대기에 해바라기 · 굴 속에 레몬과 갈색 자루가 나란히 · 문짝의 같은 칸에도 둘이 함께 · 위 물엔 레몬이 넷(갈색 자루는 하나) · 아래 물엔 갈색 자루가 넷(레몬은 하나)","fact":"동물 = Na⁺ 기울기로 포도당 수송(경구수액 = NaCl + 포도당) / 식물 = H⁺ 와 설탕 공동수송","hook":"소금 자루 + 포도 = Na⁺-포도당(동물) · 빨대 컵 = 경구수액 · 해바라기 문의 레몬 + 갈색 자루 = H⁺-설탕(식물)","say":"짝 손님 문 두 가지를 비교하자. 첫 문은 흰 소금 자루와 포도, 즉 Na⁺ 기울기로 포도당을 들이는 동물세포의 SGLT이다. L53b에서 손잡고 가던 둘과 같다. 문 위 빨간 빨대가 꽂힌 유리컵에도 작은 소금 자루와 포도가 함께 있다. 경구수액의 단서다. 설사 환자에게 NaCl과 포도당을 함께 주면 장에서 함께 흡수되고 물이 뒤따른다. 소장에는 물을 직접 퍼 나르는 펌프가 없고, 물은 이온이 만든 기울기를 따라 삼투로 이동한다. 둘째 문 꼭대기의 해바라기는 식물세포다. 손님인 신 레몬은 H⁺, 갈색 자루는 L22c 체관의 설탕이다. 식물은 H⁺ 펌프가 만든 기울기를 이용해 H⁺와 설탕을 공동수송한다.","cards":["A1-115","A1-116","A1-117","G1-124","G1-125"],"box":[[944,48,96,124],[982,440,106,268],[1148,70,180,640],[1164,776,150,184]]},{"sid":"s12","obj":"회전문 넷을 나란히 — 첫째 · 둘째는 손님 둘이 기운 문짝의 같은 칸에 함께 타고 ↓ 화살 둘 · 셋째는 포도 혼자 타고 ↓ 화살 하나 · 넷째는 세로로 선 문짝의 왼쪽 칸에 흰 소금 자루 · 오른쪽 칸에 회색 자갈이 따로 타고 ↓ ↑ 화살이 엇갈린다 (되짚기)","fact":"uniport = 한 물질 / symport = 둘이 같은 방향 / antiport = 둘이 반대 방향","hook":"혼자 ↓ = uniport · 함께 ↓↓ = symport(공수송) · 엇갈려 ↓↑ = antiport(역수송) · 소금 자루 ↓ 자갈 ↑ = Na⁺/Ca²⁺ 교환체","say":"회전문 넷에서 손님 수와 화살표를 비교해 보자. 셋째 문은 포도 혼자, 화살표 하나로 한 물질만 옮기는 단일수송, uniport이다. L53b의 GLUT 포도 회전문이 그 예다. 첫째와 둘째 문은 둘이 같은 칸에 타고 같은 방향으로 가는 공수송, symport이다. 넷째 문은 세로 문짝이 두 길을 나누어 왼쪽 흰 소금 자루는 아래로, 오른쪽 회색 자갈은 위로 이동한다. 반대 방향 수송인 역수송, antiport 또는 대향수송이다. 자갈은 Ca²⁺이므로 심근의 Na⁺/Ca²⁺ 교환체와 연결한다. Na⁺가 들어오는 힘으로 Ca²⁺를 내보낸다. 수정란의 pH를 높이는 Na⁺/H⁺ 교환체도 다른 예다. 혼자, 함께, 엇갈려라는 차이로 구분하자.","cards":["A1-158","A1-159"],"box":[[982,440,106,268],[1190,440,106,268],[1398,440,106,268],[1606,440,106,268]]},{"sid":"s13","obj":"맨 오른쪽 구슬 기둥의 작은 놋쇠 펌프 상자 — 크랭크에 금색 자물쇠 · 그 아래 물에 쌓인 흰 소금 자루 다섯 · 넷째 회전문 아래 물에 쌓인 회색 자갈 여섯 · 오른쪽 아래 나무집(노란 반달 문) 옆구리에서 솟은 알통 팔이 자갈을 움켜쥐었다","fact":"우아바인 · 디곡신 = 펌프 억제 → Na⁺ ↑ → Na⁺/Ca²⁺ 교환 ↓ → Ca²⁺ ↑ → 수축력 ↑","hook":"금색 자물쇠 = 약(우아바인 · 디곡신) · 쌓인 소금 자루 = 세포내 Na⁺ ↑ · 쌓인 자갈 = Ca²⁺ ↑ · 나무집의 알통 = 심근 수축력 ↑","say":"맨 오른쪽 기둥의 작은 놋쇠 펌프는 L53b 끝의 상자다. 크랭크에 걸린 금색 자물쇠는 L23a와 같은 약물 표지로, Na⁺/K⁺ 펌프를 억제하는 강심배당체 우아바인과 디곡신을 뜻한다. 펌프가 멈춰 Na⁺를 내보내지 못하면 자물쇠 밑의 아래 물, 즉 세포 안에 흰 소금 자루가 다섯 쌓인다. 억제가 지나치면 K⁺ 기울기와 막전위까지 무너진다. 안팎의 Na⁺ 농도 차이가 줄어들면 그 힘으로 자갈을 내보내던 넷째 문도 느려진다. 문 아래에 남은 자갈 여섯은 세포 내 Ca²⁺ 증가다. L46의 노란 반달 문이 있는 나무 심장 집 옆구리에서 나온 알통 팔이 자갈을 움켜쥔다. Ca²⁺ 증가로 심근 수축력이 커지는, 디곡신의 작용 경로를 나타낸다.","cards":["A1-154","A1-152","A1-153"],"box":[[1802,492,176,158],[1778,730,176,136],[1594,904,136,76],[1752,878,286,250]]}],"cq":{"A1-88":["능동 수송(active transport)이란?","에너지를 사용해 농도 기울기에 거슬러 용질을 이동시키는 수송"],"A1-89":["능동 수송에서 에너지가 필요한 이유는?","낮은 농도에서 높은 농도로 옮겨야 하기 때문"],"A1-91":["능동 수송은 세포에 어떤 이점을 주는가?","바깥과 다른 세포내 농도를 유지하게 해 준다"],"A1-92":["동물 세포질은 세포외액에 비해 K+와 Na+ 농도가 어떻게 다른가?","K+는 높고 Na+는 낮다"],"A1-93":["이온 기울기 유지를 위해 세포막이 const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID
const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact), st.sid);
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate, auto:playing && mode === 'tour',
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate, auto:true,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
</html>
