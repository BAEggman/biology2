<script>
const L = {"id":"L25b","scene":"s25","part":"b","title":"트립 가방 줄 — 기댄 문지기 · 판 위 여행 가방 · 접혀 찢긴 앞머리: trp 오페론","sub":"그림 타일 다섯 · 흰 앞머리(구조유전자 · 리더) · 가로등에 기댄 문지기(비활성 억제자 · 켜짐) · 판째 받은 여행 가방(트립 + 토판 = 보조억제자 · 억제성) · 가방 더미(최종산물 · 동화 경로) · 앞머리에서 말리고 이어짐(2-3 고리) · 흰 타일에서 멈춰 접혀 찢긴 종이(3-4 고리 · 약화)","img":"img/L25b.webp?v=fa4f4d6cdc82","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"인쇄 마당의 다른 구석 — 회색 인쇄 줄 셋이 뒤에서 앞으로 나란하다 · 줄마다 빨간 매트 → 나무 문턱 → 흰 앞머리 타일 → 그림 타일 다섯(별 · 달 · 구름 · 물고기 · 배) (틀)","fact":"trp 오페론 — 트립토판 합성 효소 유전자 다섯이 한 오페론 · 문턱 너머 리더","hook":"그림 타일 다섯 = trp 구조유전자 · 흰 타일 = 리더","say":"lac 인쇄 마당의 다른 구석을 보자. 회색 인쇄 줄 셋이 뒤에서 앞으로 나란히 놓였다. 각 줄에는 프로모터인 빨간 매트와 작동자인 나무 문턱이 있고, 그다음 흰 타일 하나와 그림 타일 다섯이 이어진다. 별, 달, 구름, 물고기, 배가 그려진 타일 다섯은 트립토판 합성 효소를 암호화하는 유전자 다섯이다. 해, 나무, 집 세 그림이 있던 lac과 구별하자. 구조유전자 앞의 흰 타일은 짧은 앞머리인 리더이며, 약화 조절이 일어나는 자리다.","box":null,"src":["s25p02#1"],"cards":["F1-10","F1-7","F1-148","F1-30","F1-4","F1-8","F1-11"]},{"sid":"s2","obj":"맨 뒤 줄 — 가방이 하나도 없다 · 주황 뾰족머리의 마른 문지기가 가로등에 기대 팔짱을 끼고 심심해한다 · 기계는 그림 타일을 다 지나 오른쪽 끝까지 가고 그림 찍힌 긴 종이띠가 늘어졌다","fact":"trp 억제자는 늘 만들어지지만 혼자서는 비활성 → 트립토판이 부족하면 켜짐","hook":"가로등에 기댄 문지기 = 비활성 억제자 · 긴 종이띠 = 켜짐","say":"맨 뒤 줄에는 여행 가방이 없다. 주황색 뾰족머리의 마른 문지기는 가로등에 기대 팔짱을 끼고 심심해할 뿐 문턱에 가지 않는다. 그 사이 인쇄 기계는 그림 타일을 모두 지나 오른쪽 끝까지 이동했고, 긴 종이띠에 그림들이 찍혔다. trp 억제자는 항상 만들어지지만 혼자서는 비활성이어서 작동자에 붙지 못한다. 억제자를 만드는 조절유전자는 문지기의 자리처럼 오페론 바깥에 따로 있으며, 자기 프로모터를 가진다. 트립토판이 부족할 때 trp 오페론이 켜지는 이유다.","box":[[70,40,190,380],[400,45,1180,330]],"src":["s25p02#0"],"cards":["F1-9","F1-34"]},{"sid":"s3","obj":"가운데 줄 — 같은 문지기가 스티커 붙은 여행 가방을 판째 무릎에 얹고 문턱 위에 앉아 막는다 · 기계는 매트에서 꼼짝 못 하고 종이띠도 없다","fact":"트립토판(보조억제자)이 붙어야 억제자가 활성 → 작동자에 붙어 전사를 막는다","hook":"여행(트립) 가방 + 판(토판) 받고 문턱에 앉음 = 보조억제자로 활성","say":"가운데 줄에서는 같은 문지기가 스티커 붙은 여행 가방을 판째 무릎에 얹고 문턱에 앉았다. 인쇄 기계는 매트에서 움직이지 못하고 종이띠도 나오지 않는다. 여행을 뜻하는 트립과 가방을 얹은 판을 이어 트립토판을 떠올리자. 트립토판이 억제자에 결합해야 억제자가 활성화되어 작동자에 붙고, 구조유전자의 전사를 직접 막는다. 억제자 혼자서는 막지 못하고 트립토판의 도움이 필요하므로 트립토판을 보조억제자라고 한다. 트립토판이 있으면 꺼지는 억제성 오페론이다.","box":[[930,345,235,335],[600,430,235,205]],"src":["s25p02#1"],"cards":["F1-10","F1-7","F1-148","F1-30","F1-4","F1-8","F1-11"]},{"sid":"s4","obj":"왼쪽, 가운데 줄과 맨 앞 줄 사이 — 판에 얹힌 여행 가방이 여러 단 쌓인 더미 · 맨 뒤 줄 곁엔 가방이 하나도 없다","fact":"최종산물 트립토판이 충분하면 그 합성 효소 생산을 멈춘다 · 동화 경로 조절","hook":"쌓인 가방 더미 = 트립토판 넉넉 → 그만 만든다","say":"왼쪽의 가운데 줄과 맨 앞 줄 사이에는 판에 올린 여행 가방이 여러 층으로 쌓였다. 트립토판이 충분하다는 뜻이다. 가방이 하나도 없던 맨 뒤 줄과 비교하자. trp 오페론의 유전자 다섯은 트립토판을 만드는 효소들을 암호화한다. 최종산물인 트립토판이 이미 충분하면 합성 효소를 더 만들 필요가 없으므로 오페론을 끈다. 최종산물이 자신을 만드는 경로를 억제하는 동화 경로 조절이다.","box":[[40,445,530,400]],"src":["s25p02#1"],"cards":["F1-10","F1-7","F1-148","F1-30","F1-4","F1-8","F1-11"]},{"sid":"s8","obj":"왼쪽 위 나무 아래 — 줄무늬 차양을 친 작은 가방 공방 · 다 만든 스티커 가방이 앞 판매대에 놓이자 회색 셔터가 쾅 하고(떨림선) 입구 위 절반까지 내려왔다 · 그 아래 틈으로 멈춘 톱니 기계와 스티커 없는 만들다 만 가방","fact":"세균의 효소 조절 둘 — 활성 조절(빠름 · 있는 효소를 곧장) vs 발현 조절(느림 · 에너지 절약)","hook":"공방의 톱니 기계 = 이미 만들어진 효소 · 판매대의 가방(트립토판)이 셔터를 반쯤 내림 = 최종산물이 효소 활성을 곧장 막음(【억제의 문법】 반쯤 내린 덧문 = 음성 되먹임) · 줄 위의 문지기 = 인쇄 자체를 끔(발현 조절)","say":"왼쪽 위 나무 아래에는 줄무늬 차양을 단 작은 가방 공방이 있다. 안의 톱니 기계가 가방을 만들다가, 완성된 스티커 가방 하나가 앞 판매대에 놓이자 회색 셔터가 입구 절반까지 내려왔다. 셔터 아래로 스티커도 붙이지 못한 가방과 멈춘 기계가 보인다. 이 기계는 이미 만들어진 효소다. 최종산물인 트립토판이 많아지면 효소의 활성을 곧바로 막는다. 반쯤 내린 덧문은 이 덱의 음성 되먹임 단서다. 이미 있는 효소를 빠르게 조절하는 효소 활성 조절이다. 반면 줄 위의 문지기가 인쇄 기계를 막는 것은 유전자 발현 조절이다. 새 효소를 만들지 않는 방식으로, 느리지만 에너지와 재료를 절약한다. 세균은 이 두 방식으로 효소를 조절한다.","box":[[255,60,225,215]],"cards":["F1-0","F1-42","F1-43"]},{"sid":"s5","obj":"맨 뒤 줄 종이띠의 맨 앞머리 — 문턱 바로 너머에서 종이가 링처럼 둥근 고리 하나로 한 바퀴 감겼다가(고리 속으로 회색 줄이 비친다) 그대로 길게 이어진다","fact":"약화 — 트립토판이 적으면 리더에 2-3 고리 → 종결자가 안 생겨 전사 계속","hook":"앞머리의 고리 하나 뒤로 이어짐 = 2-3 고리 · 계속","say":"맨 뒤 줄의 종이띠 앞머리를 보자. 문턱 바로 뒤에서 종이가 둥근 고리로 감겼지만, 끊기지 않고 길게 이어져 그림 다섯이 모두 찍혔다. 약화 조절의 한 경우다. 리더 mRNA에는 서로 짝지을 수 있는 구역 1, 2, 3, 4가 순서대로 있다. 트립토판이 부족하면 리보솜이 구역 1의 트립토판 코돈에서 멈춘다. 그동안 구역 2와 3이 짝지어 2-3 고리가 형성된다. 종결자가 생기지 않으므로 전사는 계속된다. 트립토판이 부족하면 오페론이 켜진다는 결론과 연결된다. 약화는 억제 조절과 별도로 작동하는 두 번째 조절이다.","box":[[585,205,140,110]],"src":["s25p02#2"],"cards":["F1-6","F1-176"]},{"sid":"s6","obj":"맨 앞 줄 — 기계가 문턱을 넘었지만 흰 앞머리 타일에서 멈췄다 · 그림 없는 짧은 흰 종이띠가 뒤쪽 끝에서 접혀 머리핀 고리를 짓고 들쭉날쭉 찢겼다(곁에 종이 부스러기) · 오른쪽 끝 풀밭에서 문지기가 판에 얹은 가방을 들고 문턱 쪽으로 걸어온다","fact":"트립토판이 많으면 리더에 3-4 고리(종결자) → 구조유전자 전에 전사 종결","hook":"흰 타일에서 멈춤 + 접혀 찢긴 짧은 종이 = 3-4 고리 · 종결","say":"맨 앞 줄의 기계는 문턱을 넘어섰지만 흰 리더 타일 위에서 멈췄다. 뒤의 그림 타일에는 닿지 못했다. 나온 종이는 그림 없는 짧은 흰 띠이며, 끝이 머리핀처럼 접혀 고리를 만들고 들쭉날쭉 찢어져 있다. 곁에는 종이 부스러기도 흩어졌다. 트립토판이 많으면 리더 뒤쪽에 3-4 고리가 생기며, 이것이 종결자로 작용한다. 그래서 구조유전자에 도달하기 전에 전사가 끝난다. 오른쪽 끝 풀밭에서는 문지기가 판 위의 가방을 들고 문턱으로 걸어온다. 트립토판이 많을 때 억제와 약화가 함께 오페론을 끈다는 연결이다.","box":[[550,715,545,290],[1630,590,290,500]],"src":["s25p02#3"],"cards":[]},{"sid":"s7","obj":"세 줄을 뒤에서 앞으로 (되짚기) — 기댄 문지기와 긴 종이띠 · 가방 받고 문턱에 앉은 문지기 · 앞머리에서 찢긴 짧은 종이","fact":"trp = 억제성 — 적으면 켜짐 · 많으면 억제(보조억제자) + 약화로 꺼짐","hook":"기댐 켜짐 · 가방 앉음 꺼짐 · 찢긴 앞머리 끝","say":"세 줄을 다시 비교해 보자. 맨 뒤 줄은 가방이 없어 문지기가 기대어 쉬고 종이띠가 길게 나오므로 켜진 상태다. 가운데 줄은 가방을 받은 문지기가 문턱을 막아 꺼진 상태다. 맨 앞 줄은 기계가 문턱을 지나도 앞머리에서 종이가 접혀 찢어지며 전사가 종결된다. trp는 최종산물인 트립토판이 충분하면 꺼지는 합성 경로의 억제성 오페론이다. 젖당이 있어야 켜지는 lac은 분해 경로의 유도성 오페론이다. 두 경우 모두 조절유전자가 만든 억제자가 작동자 부근에서 전사를 조절하는 음성 조절이라는 점은 같다. 차이는 억제자를 작동시키는 방식이다. trp에서는 최종산물이 보조억제자로 억제자를 켜고, lac에서는 기질에서 유래한 유도자가 억제자를 끈다.","box":[[70,40,1520,370],[600,345,565,335],[550,715,545,290]],"src":["s25p02#1","s25p02#2"],"cards":["F1-10","F1-7","F1-148","F1-30","F1-4","F1-8","F1-11","F1-6","F1-44","F1-151","F1-152"]}],"cq":{"F1-10":["trp 억제단백질은 트립토판이 있을 때 어떤 상태가 되는가?","활성화되어 작동자에 결합한다"],"F1-7":["trp 오페론이 꺼지는 조건은?","트립토판이 충분할 때"],"F1-148":["trp 오페론에서 억제자가 작동자에 붙으면 직접 막히는 것은?","구조유전자의 전사"],"F1-30":["trp 오페론을 한 문장으로 요약하면?","최종산물인 트립토판이 충분하면 꺼지는 억제성 오페론"],"F1-4":["억제성 오페론의 대표 예시는?","trp 오페론"],"F1-8":["트립토판은 trp 오페론에서 어떤 역할을 하는가?","보조억제자(corepressor)"],"F1-11":["trp 오페론이 동화 경로 조절의 예인 이유는?","최종산물인 트립토판이 충분하면 합성 효소 생산을 멈추기 때문"],"F1-9":["trp 억제단백질은 트립토판이 없을 때 어떤 상태인가?","비활성 상태"],"F1-34":["trp 오페론에서 조절유전자는 왜 별도 유전자라 하는가?","별도의 프로모터를 가지고 오페론과 떨어져 있기 때문"],"F1-0":["세균이 효소 생산량을 조절하는 두 방법은?","효소 활성 조절과 유전자 발현 조절"],"F1-42":["세균에서 효소 양 조절이 느리지만 에너지 절약에 유리한 방식은?","유전자 발현 조절"],"F1-43":["세균에서 이미 존재하는 효소를 즉시 조절하는 빠른 방식은?","효소 활성 조절"],"F1-6":["trp 오페론이 켜지는 조건은?","트립토판이 부족할 때"],"F1-176":["trp 오페론의 약화(attenuation)란?","억제와 별개의 2차 조절"],"F1-44":["trp와 lac 오페론을 비교할 때 핵심 대비는?","합성 경로 억제성 대 분해 경로 유도성"],"F1-151":["trp 오페론과 lac 오페론의 공통점 한 가지는?","둘 다 조절유전자 산물이 작동자 부근에서 전사를 조절한다"],"F1-152":["trp 오페론과 lac 오페론의 차이 한 가지는?","trp는 최종산물이 corepressor · lac은 기질 유도자가 repressor를 비활성화한다"]},"hubPanel":"s25p02"};

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';

$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
</html>
