<style>
  :root{--ink:#1b1b1f;--ink2:#4b4b55;--line:#e3e1da;--teal:#0f766e;--teal50:#ecfdf5;--gold:#b45309;--bg:#f7f5ef}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1100px;margin:0 auto;padding:12px 14px 40px}

  .titlebar{display:flex;align-items:center;gap:10px}.titlebar h1{flex:1;min-width:0}

  .cq{font-size:12.5px;color:var(--ink2);margin-top:8px;border-top:1px dashed #d8d5cc;padding-top:6px}.cq summary{cursor:pointer}.cq li{margin:3px 0}.cq .a{color:var(--ink);font-weight:600}

  .cap{margin-top:10px;min-height:76px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px}

  .cap .fact{font-size:14px;margin:2px 0}
  .cap .hook{font-size:13px;color:var(--gold);margin-top:4px}

  .hole{fill:#000}
  .cur{fill:none;stroke:#f59e0b;stroke-width:6;stroke-dasharray:14 8}
  .hot{fill:transparent;cursor:pointer}
  .hot:hover{fill:rgba(245,158,11,.18)}
  .judge{display:none;gap:6px;margin-top:8px}
  .judge button{font-size:12.5px}
  .bar.opt{margin-top:-4px}.bar.opt[hidden]{display:none}
  .nav{display:flex;gap:12px;font-size:12.5px;margin:2px 0 0}
  .nav a{color:var(--teal);text-decoration:none}
  .nav a:hover{text-decoration:underline}

<script>
/* lesson_store.js — 과 목록 · 과 화면이 함께 쓰는 저장 도우미(보기 화면 명세 §1.1).
   빌드(build_lesson.js)가 두 화면에 그대로 끼워 넣는다(__STORE__) — 열쇠 이름 · 꼴이 한 군데서만 정해진다.
   열쇠: lesson_stars {ID: 찍은 때(ms)} · lesson_prefs {onlyStar, autoNext, rep, scope} · lesson_ab_<ID> {a: sid, b: sid}
   읽기 · 쓰기는 모두 try/catch — 저장이 막힌 브라우저에서는 그 쪽을 떠날 때까지만 기억하고 오류를 내지 않는다.
   (lesson_<ID> · lesson_shuffle · lesson_srs_inbox · lesson_auto_start 는 여기서 건드리지 않는다) */
const LStore = (() => {
  const mem = {};
  const rd = (k, d) => {
    let ok = false;
    try { const v = localStorage.getItem(k); ok = true; if (v !== null && v !== undefined) { const o = JSON.parse(v); mem[k] = o; return o; } } catch (e) {}
    if (ok) { delete mem[k]; return d; }   // 저장소는 멀쩡한데 값이 없다 = 다른 탭에서 지웠다 — 메모리 값도 버린다
    return k in mem ? mem[k] : d;
  };
  const wr = (k, o) => { mem[k] = o; try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) {} };
  const del = k => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} };
  const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
  const REP = ['off', 'ab', 'one', 'list'];
  return {
    stars() { const s = rd('lesson_stars', {}); return isObj(s) ? s : {}; },
    isStar(id) { return id in LStore.stars(); },
    setStar(id, on) {
      const s = { ...LStore.stars() };
      if (on) s[id] = Date.now(); else delete s[id];
      if (Object.keys(s).length) wr('lesson_stars', s); else del('lesson_stars');
      return on;
    },
    prefs() {
      const p = rd('lesson_prefs', {}); const o = isObj(p) ? p : {};
      return { onlyStar: !!o.onlyStar, autoNext: !!o.autoNext, rep: REP.includes(o.rep) ? o.rep : 'off', scope: o.scope === 'star' ? 'star' : 'all' };
    },
    setPrefs(patch) { const p = { ...LStore.prefs(), ...patch }; wr('lesson_prefs', p); return p; },
    ab(id) { const v = rd('lesson_ab_' + id, null); return isObj(v) ? { a: typeof v.a === 'string' ? v.a : null, b: typeof v.b === 'string' ? v.b : null } : { a: null, b: null }; },
    setAb(id, v) { const k = 'lesson_ab_' + id; if (v && (v.a || v.b)) wr(k, { a: v.a || null, b: v.b || null }); else del(k); },
    REP,
  };
})();

const L = {"id":"L46c","scene":"s46","part":"c","title":"부엌 식탁의 가라앉힌 유리병과 붉은 원반 — 혈장 · 세포성 요소 · 적혈구","sub":"가라앉아 세 층으로 갈린 유리병(혈장 + 세포성 요소) · 절반 넘는 노란 층(혈장 55 %) · 선처럼 얇은 흰 띠(백혈구 · 혈소판) · 짙은 빨강 층(적혈구) · 노란 층에 녹은 흰 소금 · 분필(무기염류 · HCO₃⁻ 완충) · 노란 층에 뜬 넷(앨범 = 알부민 · Y자 집게 = 항체 · 기름방울 구명 튜브 = 아포지질단백질 · 털실 = 피브리노겐) · 구멍 없는 옴폭 원반 · 옆모습 아령(양면오목원반 · 산소 운반) · 내던진 돔 천막 · 콩 통(핵 · 미토콘드리아 없음) · 창밖의 해 + 당구 + 금화 둘(무산소 해당과정으로만 ATP) · 노란 층에 더 많이 뜬 어두운 연기 방울(CO₂ — 대부분 혈장에 · HCO₃⁻ 로 약 65 %)","img":"img/L46c.webp?v=eb02ecd6cbdd","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"부엌 식탁 위 키 큰 유리병 — 피가 가라앉아 칼로 자른 듯 반듯한 세 층(노랑 · 얇은 흰 띠 · 짙은 빨강) (틀)","fact":"피 = 혈장(액체 기질) + 세포성 요소 — 원심분리하면 층으로 갈린다","hook":"가라앉힌 유리병의 세 층 = 혈장 + 세포성 요소","say":"부엌 식탁의 키 큰 유리병에는 혈액이 들어 있다. 응고를 막은 뒤 원심분리해 가라앉히자 칼로 자른 듯 반듯하게 층이 나뉘었다. 맨 위에는 맑은 노란 층, 가운데에는 선처럼 아주 얇은 흰 띠, 아래에는 짙은 빨간 층이 생겼다. 혈액은 액체 성분인 혈장과, 그 안에 떠 있는 세포성 요소로 나뉜다. 노란 층은 혈장이고 흰 띠와 빨간 층은 세포성 요소다. 세포가 액체 기질에 흩어져 있으므로 혈액은 결합조직이다. 혈장은 물질을 운반하고 pH와 삼투 균형을 유지한다. 세포성 요소는 기체 운반, 방어, 응고를 담당한다.","box":[250,70,370,875],"src":["s46p04#0"],"cards":["H0-143","H0-142","H0-286","G0-35"]},{"sid":"s2","obj":"맨 위 맑은 노란 층 — 병 속 피의 절반이 넘는다","fact":"혈장 = 혈액의 액체성 기질 · 부피의 약 55 %(절반이 넘는다)","hook":"절반 넘는 노란 층 = 혈장 55 %","say":"맨 위의 맑은 노란 층이 가장 두껍고 병의 절반보다 조금 더 많다. 혈장은 혈액의 액체성 기질이며 전체 부피의 약 55 퍼센트다. 물에 단백질, 영양소, 노폐물이 녹아 있는 노란 국물처럼 생각해 보자.","box":[270,275,330,390],"src":["s46p04#1"],"cards":["H0-144","H0-146"]},{"sid":"s7","obj":"노란 층 한가운데 — 반짝이며 녹는 흰 소금 알갱이 · 떠 있는 흰 분필 토막 셋","fact":"혈장의 무기염류 — pH 완충 · 삼투압 유지 · 대표 완충제는 HCO₃⁻(분필)","hook":"녹은 흰 소금 = 무기염류 · 흰 분필 = HCO₃⁻ 완충","say":"노란 층 한가운데에는 흰 소금 알갱이가 반짝이며 녹아 있고 흰 분필 토막 셋이 떠 있다. 혈장에 녹은 무기염류와 이온을 나타낸다. 하는 일은 둘이다. pH 변화를 줄이는 완충과 삼투압을 맞추는 일이다. 이 덱의 흰 분필은 탄산수소이온인 HCO₃⁻이다. 산이 들어올 때 받아 주는 혈액의 대표적인 완충제다. 혈장의 이온 농도는 곧 조직액의 이온 조성이 되어 세포가 일하는 환경을 정한다. 노란 물인 혈장은 짐도 나른다. 영양소, 대사 노폐물, 호흡 기체, 호르몬이라는 네 종류의 짐을 온몸으로 운반한다.","box":[[395,360,110,130],[505,475,72,75]],"cards":["H0-147","H0-148","H0-153","H0-154"]},{"sid":"s8","obj":"노란 층에 뜬 넷 — 펼친 사진 앨범 · 하늘색 Y자 집게 · 주황 기름방울을 끼운 빨강 · 하양 구명 튜브 · 흰 털실 뭉치","fact":"혈장 단백질 넷 — 알부민 · 면역글로불린 · 아포지질단백질 · 피브리노겐","hook":"앨범 = 알부민 · Y자 집게 = 항체 · 구명 튜브 = 지질 운반 · 털실 = 피브리노겐","say":"노란 층에는 단백질을 나타내는 소품 넷이 있다. 펼친 사진 앨범은 알부민이다. 뒤뜰 꽃밭의 앨범처럼 물을 혈관 안에 붙잡아 삼투 균형을 유지하고 pH 완충도 돕는다. 하늘색 Y 자 집게는 면역글로불린인 항체로, 침입자를 잡아 방어한다. 주황 기름방울을 끼운 구명 튜브는 아포지질단백질이다. 물에 녹지 않는 지질을 감싸 운반하는 역할이다. 흰 털실 뭉치는 피브리노겐이며, 응고 계단에서 풀려 실 그물인 피브린으로 바뀌어 혈액을 굳힌다.","box":[[295,350,125,100],[470,345,105,105],[325,470,100,125],[445,520,90,100]],"cards":["H0-149","H0-150","H0-151","H0-152"]},{"sid":"s3","obj":"맨 아래 짙은 빨강 층 · 그 위 경계에 선처럼 얇은 흰 띠","fact":"붉은 층 = 적혈구 · 얇은 흰 띠 = 백혈구 · 혈소판 — 얇다 = 적혈구가 압도적","hook":"빨간 층 = 적혈구 · 얇은 흰 띠 = 백혈구 · 혈소판","say":"맨 아래 짙은 빨간 층은 적혈구다. 그 위 경계의 가느다란 흰 띠에는 백혈구와 혈소판이 모였다. 띠가 매우 얇다는 점은 적혈구가 압도적으로 많고 백혈구와 혈소판은 아주 적다는 단서다. 빨간 층과 흰 띠를 합친 세포성 요소는 혈액 부피의 약 45 퍼센트다. 위에서 아래로 혈장, 백혈구와 혈소판의 버피 코트, 적혈구 순서로 읽자.","box":[270,632,330,295],"src":["s46p04#2"],"cards":["H0-145","H0-277"]},{"sid":"s4","obj":"식탁의 붉은 원반들 — 양면이 옴폭하고 가운데가 얇아 옅은 분홍으로 비친다(구멍은 없다) · 모로 선 하나는 옆모습이 아령 · 표면마다 흰 방울이 매달렸다","fact":"적혈구 = 양면오목원반 — 표면적을 넓혀 기체 교환이 빠르다 · 일은 산소 운반","hook":"구멍 안 뚫린 도넛 · 옆모습 아령 = 양면오목원반","say":"식탁 위에 흩어진 붉은 원반들은 양면이 오목하고 가운데가 얇아서 옅은 분홍색으로 보인다. 구멍을 뚫다 만 도넛처럼 보이지만 구멍은 없다. 옆으로 선 원반은 양 끝이 두껍고 가운데가 잘록한 아령 모양이다. 적혈구의 양면오목원반형이다. 가운데를 오목하게 하여 표면적을 넓히므로 기체 교환이 빠르다. 원반마다 달린 흰 방울은 산소이며, 적혈구의 산소 운반 기능을 나타낸다.","box":[[665,700,540,265],[985,635,85,200]],"src":["s46p04#3"],"cards":["H0-155","H0-156","H0-157"]},{"sid":"s5","obj":"얼굴 달린 붉은 원반이 어깨 너머로 내던진 것들(점선 궤적 · 먼지) — 문 열린 작은 돔 천막(안에 보라 공) · 안쪽에 주름이 접힌 콩 모양 통 둘","fact":"포유류 적혈구엔 핵(헤모글로빈을 더 담으려) · 미토콘드리아(나르는 O₂ 를 안 쓰려)가 없다","hook":"내던진 천막 = 핵 없음 · 내던진 콩 통 = 미토콘드리아 없음","say":"오른쪽에서 얼굴과 팔다리가 달린 붉은 원반을 보자. 방금 어깨 너머로 던진 물건들의 궤적이 점선으로 남아 있다. 문이 열려 있고 안에 보라 공이 든 작은 돔 천막은 유사분열 헛간에서 보았던 핵이다. 안쪽에 주름이 있는 콩 모양 통 둘은 미토콘드리아다. 포유류 적혈구는 성숙하면서 핵을 내보내고 미토콘드리아도 없앤다. 핵을 없애 헤모글로빈을 더 많이 담고, 미토콘드리아를 없애 자신이 운반하는 산소를 소비하지 않는다는 연결이다.","box":[[1715,620,300,190],[1760,820,250,135]],"src":["s46p04#4"],"cards":["H0-158","H0-159","H0-160"]},{"sid":"s6","obj":"그 원반이 당구공을 쳐 금화 둘이 튄다 · 창밖에 해가 떴다 · 제 몸의 흰 방울엔 손대지 않는다","fact":"적혈구의 ATP 는 무산소 해당과정으로만 — 나르는 산소는 쓰지 않는다","hook":"창밖의 해 + 당구 = 해당 · 금화 = ATP","say":"핵 천막과 미토콘드리아 콩 통을 버린 원반이 큐로 당구공을 치고 있다. 공 옆에서 금화 둘이 튀고 창밖에는 해가 떴다. 해와 당구를 이어 해당과정을 떠올리자. 금화는 언제나 ATP이다. 미토콘드리아가 없는 적혈구는 무산소 해당과정으로만 ATP를 만든다. 몸에 산소 방울을 많이 달고 있어도 자기 에너지를 만드는 데 쓰지 않는다. 산소는 목적지로 운반하는 짐이다.","box":[[1235,740,130,185],[1400,573,280,350],[865,105,320,290]],"src":["s46p04#4"],"cards":["H0-158","H0-159","H0-160"]},{"sid":"s9","obj":"유리병 속 어두운 잿빛 연기 방울 — 맑은 노란 층에 더 많이 떠 있고 · 짙은 빨강 층에는 그보다 적다","fact":"혈액의 CO₂ — 대부분 혈장에 실려 간다(HCO₃⁻ 로 약 65 % · 그냥 녹아 약 7 %)","hook":"어두운 연기 방울 = CO₂ · 노란 층에 더 많음 = 혈장이 더 많이 나름","say":"유리병 안의 어두운 잿빛 연기는 이산화탄소다. 노란 혈장 층에 더 많이, 빨간 적혈구 층에는 더 적게 있다. 혈액이 운반하는 이산화탄소는 대부분 혈장에 실린다. 기본서 수치로 약 65 %는 흰 분필인 탄산수소이온 형태로 혈장에 녹고, 약 7 %는 그대로 녹아 이동한다. 나머지는 적혈구의 헤모글로빈에 결합한다. 운반 형태별로 정리하면 탄산수소이온 약 70 %(교재에 따라 65 ~ 70), 헤모글로빈 결합 약 23 %, 단순 용해 약 7 %이다.","box":[268,280,335,640],"src":[],"cards":["G0-182"]},{"sid":"s10","obj":"왼쪽 벽에 건 피 주머니 → 관 → 유리병 위쪽 옆벽을 뚫고 들어간 바늘 — 쏟아진 남의 붉은 원반들이 노란 층 위에서 하늘색 Y 집게에 엮여 한 덩어리로 엉겼다","fact":"응집 = 적혈구 항원(응집원) + 혈장 항체(응집소) · 수혈은 받는 쪽 항체 vs 주는 쪽 항원","hook":"남의 피를 꽂자 노란 층의 집게가 남의 원반을 서로 엮었다 = 응집","say":"왼쪽 벽의 혈액 주머니에서 나온 관과 바늘이 유리병 위쪽 옆벽을 뚫고, 다른 사람의 붉은 원반을 병 안에 쏟아 넣는다. 수혈이다. 들어온 원반의 가장자리마다 꽂힌 주황 막대사탕은 이 덱에서 당 사슬을 나타낸다. 원반 겉의 표지인 적혈구 항원, 응집원이다. 노란 층의 하늘색 Y 집게는 혈장 항체다. 집게의 한 팔이 한 원반의 사탕을, 다른 팔이 이웃 원반의 사탕을 붙잡아 원반들을 엮어 남의 원반이 한 덩어리로 엉긴다. 적혈구 항원인 응집원과 혈장 항체인 응집소가 만나 생기는 응집반응이다. 혈액형 검사에서는 이런 엉김을 본다. 수혈 적합성을 판단할 때는 받는 사람인 수여자의 혈장 항체가 주는 사람인 공여자의 적혈구 항원을 인식하는지 확인한다.","box":[[62,24,250,292],[268,165,340,190]],"cards":["IM-091","IM-090"]},{"sid":"s11","obj":"사탕 견주기 — 병 주인의 원반(식탁 넷 · 모로 선 아령 · 당구 치는 원반)엔 초록 알 하나짜리 막대사탕 · 병 위 덩어리와 바늘 밑의 남의 원반엔 주황 알 둘짜리 · 병 위 덩어리를 엮은 하늘색 Y 집게 다섯은 주황 사탕만 문다","fact":"ABO 혈장 항체 — A형 = 항B · B형 = 항A · AB형 = 없음 · O형 = 항A + 항B","hook":"제 원반에 없는 사탕을 무는 집게만 혈장에 산다","say":"원반에 꽂힌 사탕의 모양을 비교하자. 식탁의 원반 넷, 옆으로 선 아령 모양 원반, 당구 치는 원반에는 초록 알 하나의 사탕이 있다. 병 주인의 A 항원이므로 A 형 혈액이다. 주머니에서 온 원반과 병 위의 응집 덩어리, 바늘 아래 원반에는 주황 알 둘의 사탕이 있다. B 자의 두 볼록한 부분처럼 알 둘로 B 항원을 나타냈다. 노란 층에서 나온 Y 집게 다섯은 주황 사탕만 물고 초록 사탕은 건드리지 않는다. 혈장에는 자기 적혈구에 없는 항원에 대한 항체가 있기 때문이다. 자기 사탕을 무는 집게가 있으면 자신의 혈액이 응집하겠다. A 형의 혈장에는 항B, B 형에는 항A가 있다. AB 형은 두 항원이 모두 있어 해당 항체가 없고, O 형은 두 항원이 없어 항A와 항B를 모두 가진다.","box":[[268,165,340,190],[650,625,560,360],[1395,572,285,290]],"cards":["IM-089"]}],"cq":{"H0-143":["혈액의 두 큰 구성요소는?","혈장과 세포성 요소"],"H0-142":["혈액은 어떤 조직으로 분류되는가?","결합조직"],"H0-286":["혈장과 세포성 요소를 비교하면?","혈장은 운반·완충·삼투 · 세포성 요소는 기체운반·면역·응고 담당"],"G0-35":["혈액이 결합조직으로 분류되는 이유는?","세포와 액체성 기질(혈장)을 가진 조직이기 때문이다"],"H0-144":["혈액 부피 중 혈장이 차지하는 비율은?","약 55%"],"H0-146":["혈장(plasma)이란?","혈액의 액체성 기질"],"H0-147":["혈장 속 무기염류의 역할 두 가지는?","pH 완충과 삼투압 유지"],"H0-148":["탄산수소이온(HCO3-)의 중요한 기능은?","혈액 pH 완충"],"H0-153":["혈장으로 운반되는 것의 예 네 가지는?","영양소 · 대사노폐물 · 호흡기체 · 호르몬"],"H0-154":["혈장 이온 농도가 조직액에 중요한 이유는?","조직액의 이온 조성과 세포 기능에 직접 영향을 주기 때문"],"H0-149":["알부민의 기능 두 가지는?","삼투 균형 유지와 pH 완충"],"H0-150":["면역글로불린의 기능은?","항체로서 방어·면역"],"H0-151":["아포지질단백질의 기능은?","지질 운반"],"H0-152":["피브리노겐의 기능은?","혈액 응고에 참여"],"H0-145":["혈액 부피 중 세포성 요소가 차지하는 비율은?","약 45%"],"H0-277":["원심분리한 혈액의 세 층을 위에서부터 쓰면?","혈장(위) · 백혈구·혈소판(중간, buffy coat) · 적혈구(아래)"],"H0-155":["적혈구(erythrocyte)의 주된 기능은?","산소 운반"],"H0-156":["적혈구의 대표적인 모양은?","양면오목원반형"],"H0-157":["적혈구가 양면오목인 이유는?","표면적을 넓혀 기체교환을 빠르게 하기 위해"],"H0-158":["포유류 적혈구에 핵이 없는 이유는?","헤모글로빈을 더 많이 담기 위해"],"H0-159":["포유류 적혈구에 미토콘드리아가 없는 이유는?","운반하는 산소를 자체적으로 소비하지 않기 위해"],"H0-160":["적혈구가 ATP를 만드는 방식은?","무산소 해당과정"],"G0-182":["혈액의 CO₂가 혈장에 실려 가는 두 꼴과 각 비율은?(기본서 43장)","HCO₃⁻(탄산수소 이온)로 녹아 약 65% · 그대로 녹아 약 7%"],"IM-091":["응집반응(혈액형 검사)은 무엇 때문에 일어나나?","적혈구 항원(응집원) + 혈장 항체(응집소) 반응"],"IM-090":["수혈 응집 판단 기준은?","수여자 혈장 항체가 공여자 적혈구 항원을 공격하는가"],"IM-089":["ABO 혈액형별 혈장 항체는? (A/B/AB/O)","A=anti-B / B=anti-A / AB=없음 / O=anti-A와 anti-B"]},"hubPanel":"s46p04"};

    const hotspots = [];
    stops.forEach((stop, k) => {

  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(startAt()); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour'); repPaint();
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(startAt()); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
