<script>
const L = {"id":"L22e","scene":"s22","part":"e","title":"박람회장 정원의 그루터기와 화단 — 늙은 거목을 베어 낸 날: 식물의 몸 · 2차 생장 · 물 포텐셜 · 흙과 양분","sub":"누운 줄기 · 그루터기 · 새싹(뿌리 · 줄기 · 잎) · 잎 모자와 뿌리 다리 일꾼의 맞바꿈(서로 기댐) · 대나무 마디와 눈(마디 · 정단눈 · 곁눈) · 고리 김밥(표피 · 관다발 · 기본 · 속 · 피층) · 키 재기 막대와 줄자(1차 · 2차 생장) · 초록 고리 일꾼(안 = 청록 목재 · 밖 = 분홍 체관) · 테 세는 심판(봄재 · 여름재) · 외투 껍질(주피 · 수피) · 골무 뿌리(뿌리골무 · 세 영역 · 뿌리털) · 속에서 뚫고 나온 곁뿌리(내초 · 내피) · 판자 물통(Ψ) · 우는 딸기(뿌리압 · 일액) · 유리 너머 흙(양토 · 부식질 · 양이온 교환) · 유리병 화초와 병 아홉 · 여덟(필수 원소 17) · 바닥난 세 병(N · P · K) · 식객들과 파리지옥(반기생 · 전기생 · 식충 · 착생)","img":"img/L22e.webp?v=b8b0ffb76353","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"박람회장 정원 — 오늘 아침 베어 낸 거목의 큰 그루터기 · 왼쪽에 길게 누운 줄기 · 그루터기 발치에서 솟은 새싹(잎 · 줄기) · 오른쪽 유리 화단 너머 땅속의 뿌리 (틀)","fact":"식물의 3대 기관 = 뿌리 · 줄기 · 잎 · 줄기계 = 줄기 + 잎 / 뿌리계","hook":"땅 위 줄기와 잎 = 줄기계 · 땅 밑 = 뿌리계","say":"박람회장 정원의 늙은 거목을 베어 낸 날이다. 긴 줄기는 왼쪽에 쓰러져 있고 무대만 한 그루터기가 남았다. 발치에는 새싹이 돋고, 오른쪽 유리 화단 너머로 뿌리가 보인다. 식물의 세 기관은 뿌리, 줄기, 잎이다. 땅 위의 줄기와 잎을 줄기계, 땅 아래를 뿌리계라고 한다. 정원의 장면을 따라 식물의 몸과 생장, 물의 이동, 흙과 양분을 살펴보자.","cards":["O0-1"],"box":null},{"sid":"s2","obj":"유리 화단 왼쪽 끝 — 화단 위에서 커다란 잎 모자를 쓴 일꾼이 줄에 맨 입 묶은 갈색 설탕 자루를 내려 주고 · 몸이 뿌리로 된 사람이 받아 안는다 · 흙 속에선 다리가 뿌리인 꼬마가 물병 · 칼 · 자갈 한 알 · 빨간 머리 성냥이 든 바구니를 머리에 이고 올린다","fact":"잎 = 빛 · CO₂ / 뿌리 = 물 · 무기물 · 뿌리는 줄기계의 당에, 줄기계는 뿌리의 물에 의존","hook":"위는 설탕을 내리고 아래는 물을 올린다 = 서로 기댄다","say":"유리 화단의 왼쪽 끝에서 두 방향으로 물건을 주고받는다. 커다란 잎 모자를 쓴 일꾼이 햇빛과 공기 중 이산화탄소로 만든 설탕을 입을 묶은 갈색 자루에 담아 줄로 내리고, 몸이 뿌리인 사람이 받아 안는다. 흙 속에서는 다리가 뿌리인 꼬마가 물병과 칼·자갈·성냥이 든 바구니를 머리에 이고 올린다. 물과 무기물인 칼륨·칼슘·인이다. 잎은 빛과 이산화탄소를 얻고, 뿌리는 물과 무기물을 얻는다. 광합성을 하지 못하는 뿌리는 줄기계의 당에 의존하고, 줄기계는 뿌리가 흡수한 물과 무기물에 의존한다.","cards":["O0-2","O1-1"],"box":[[1310,400,270,475]]},{"sid":"s3","obj":"그루터기 발치에서 솟은 새싹 — 대나무처럼 마디 진 초록 줄기 · 마디마다 잎이 붙고 잎겨드랑이마다 반쯤 감긴 졸린 눈 하나 · 꼭대기 끝엔 크게 뜬 눈 하나","fact":"줄기 = 마디(잎 붙는 곳) · 마디사이 · 정단눈(끝) · 곁눈(잎겨드랑이)","hook":"눈 = 눈 · 꼭대기 큰 눈 = 정단눈 · 겨드랑이 졸린 눈 = 곁눈 · 대나무 마디 = 마디","say":"그루터기 발치의 새싹에는 대나무처럼 마디가 있다. 잎이 붙은 곳이 마디, 그 사이는 마디사이다. 식물의 눈을 실제 눈 모양으로 표현했다. 꼭대기의 크게 뜬 눈은 줄기 끝의 정단눈이다. 마디마다 잎과 줄기 사이 겨드랑이의 졸린 눈은 곁눈이다. 대개 정단눈이 자라는 동안은 곁눈이 잠들어 있다가, 꼭대기가 잘리면 깨어 곁가지가 된다.","cards":["O0-5"],"box":[[1030,520,150,400]]},{"sid":"s4","obj":"그루터기 앞 돗자리에서 가족이 써는 통나무만 한 김밥 — 썬 단면: 겉의 검은 김 · 하얀 밥 · 고리로 둘러 박힌 초록 오이(안쪽) · 분홍 햄(바깥쪽) 짝 · 고리 안 가운데도 밥","fact":"3대 조직계 = 표피(공변세포 · 뿌리털 · 모용) · 관다발(물관부 + 체관부) · 기본(속 · 피층)","hook":"김 = 표피 · 고리의 오이 · 햄 = 관다발 · 고리 안 밥 = 속 · 고리 밖 밥 = 피층","say":"그루터기 앞 돗자리에서 통나무만 한 김밥을 썬다. 어린 줄기의 횡단면을 나타낸다. 겉의 김은 표피조직계로, 공변세포·뿌리털·모용 같은 털이 여기에 속한다. 속재료는 가운데에 몰려 있지 않고 고리 모양으로 둘러 박혀 있다. 초록 오이와 분홍 햄이 쌍을 이루며 고리로 배열된 부분은 물관부와 체관부로 이루어진 관다발조직계다. 오이는 고리 안쪽, 햄은 바깥쪽이다. 나머지 밥은 기본조직계다. 관다발 고리 안의 가운데 밥은 속, 고리 밖 밥은 피층이다.","cards":["S-PL-9","O0-6","O0-9"],"box":[[740,870,360,250]]},{"sid":"s5","obj":"새싹 곁에 세운 키 재기 막대 · 그루터기 허리에 감은 노란 줄자","fact":"정단 = 1차 생장(길이 · 모든 식물) / 측생 = 2차 생장(굵기) = 관다발형성층 + 코르크형성층","hook":"끝에서 키 · 고리에서 굵기","say":"새싹 옆에는 키를 재는 막대가, 그루터기에는 둘레를 재는 줄자가 있다. 새싹은 위쪽 끝에서, 뿌리는 아래쪽 끝에서 길어진다. 끝의 정단분열조직이 길이를 늘리는 1차 생장은 모든 식물에서 일어난다. 반면 그루터기는 줄자가 두른 방향으로 굵어진다. 줄기 속을 고리처럼 두른 측생분열조직이 지름을 늘리는 2차 생장은 겉씨식물과 많은 쌍떡잎식물에서 일어난다. 두 측생분열조직은 단면의 초록 고리인 관다발형성층과, 껍질을 타는 주황 모자 일꾼들인 코르크형성층이다.","cards":["O0-18","O0-19"],"box":[[1030,470,240,450],[680,630,600,120]]},{"sid":"s6","obj":"그루터기 단면 가장자리 가까이 두른 초록 고리 — 고리 위에 선 초록 모자 꼬마 일꾼들 · 앞쪽 고리 안쪽(가운데 쪽)엔 청록 관 토막 · 고리 바깥쪽(껍질 쪽)엔 분홍 관 토막이 쌓였다","fact":"관다발형성층 → 안쪽 2차 물관부(목재) · 바깥쪽 2차 체관부 / 코르크형성층 → 주피","hook":"안으로 청록(물관 = 나무) · 밖으로 분홍(체관)","say":"나무를 베었는데도 그루터기 단면 가장자리의 초록 고리 위에서 초록 모자를 쓴 꼬마들이 일한다. 관다발형성층이다. 고리 안쪽, 중심을 향해서는 청록 관 토막이 쌓인다. 이것은 2차 물관부이며 목재를 이룬다. 고리 바깥쪽, 껍질을 향해서는 분홍 관 토막인 2차 체관부가 쌓인다. 안쪽은 물관, 바깥쪽은 체관이라는 방향을 분명히 구분하자. 껍질을 타고 일하는 주황 모자 일꾼인 코르크형성층은 주피를 만든다.","cards":["S-PL-11","O0-23","X-PL-22"],"box":[[680,320,620,245]]},{"sid":"s7","obj":"그루터기 단면의 테 — 연한 띠와 짙은 띠가 번갈아 둘렀다 · 무릎 꿇고 돋보기로 테를 세는 줄무늬 재킷의 심판","fact":"나이테 = 봄재(큰 세포 · 물 수송) + 여름재(두꺼운 벽 · 지지)","hook":"연한 봄 · 짙은 여름 = 한 해","say":"심판이 그루터기에 무릎을 꿇고 돋보기로 테를 센다. 연한 띠와 짙은 띠가 번갈아 보인다. 연한 띠는 봄에 자란 봄재로, 세포가 크고 벽이 얇아 색이 연하며 물을 많이 운반한다. 짙은 띠는 여름에 자란 여름재로, 세포가 작고 벽이 두꺼워 색이 짙으며 나무를 지지한다. 봄재와 여름재 한 쌍이 한 해의 나이테 하나다. 두 띠의 쌍을 세어 나무의 나이를 읽는다.","cards":["O0-26"],"box":[[690,200,610,370]]},{"sid":"s8","obj":"쓰러진 줄기 끝 — 벌목꾼이 껍질을 외투처럼 통째로 벗긴다 · 벗긴 껍질의 안감은 분홍, 겉은 거친 갈색 · 그 밑은 청록 나무 / 그루터기 옆구리 껍질을 타고 오르는 주황 모자 일꾼들이 갈색 코르크 조각을 밖으로 던진다","fact":"코르크형성층 → 코르크(표피 대체) · 그 산물과 함께 = 주피 / 수피 = 관다발형성층 바깥 전부","hook":"껍질은 초록 고리에서 벗겨진다 = 그 바깥이 다 수피","say":"쓰러진 줄기 끝에서 벌목꾼이 껍질을 외투처럼 벗긴다. 그루터기 옆구리의 껍질을 타고 오르는 주황 모자 일꾼들은 코르크형성층이다. 이들이 갈색 코르크 조각을 바깥으로 던진다. 줄기가 굵어져 표피가 찢어지면 코르크가 대신 표면을 덮는다. 코르크형성층과 그 산물을 합쳐 주피라고 한다. 벗겨진 껍질은 초록 고리인 관다발형성층 바깥에서 떨어져 나왔으며, 안감은 분홍 체관이고 겉은 갈색 코르크다. 관다발형성층 바깥의 2차 체관부와 주피 전체가 수피다. 남은 청록 부분은 목재다.","cards":["O0-24","O0-25"],"box":[[40,720,560,400],[655,545,210,145]]},{"sid":"s9","obj":"유리 화단 너머 딸기의 곧은 뿌리 — 끝에 은빛 골무를 썼다 · 골무 바로 위엔 둘로 갈라지는 작은 세포들 · 그 위엔 길게 늘어난 세포들 · 뿌리 윗부분엔 짧고 가는 흰 털이 솔처럼 사방으로 돋았다","fact":"뿌리골무(보호) · 분열대 → 신장대 → 성숙대 · 뿌리털 = 표피세포 돌출 → 흡수 면적 ↑","hook":"골무 = 뿌리골무 · 쪼개짐 → 늘어남 → 털","say":"유리 화단 너머 딸기 뿌리 끝은 은빛 골무를 쓰고 흙 속으로 들어간다. 뿌리골무가 끝의 분열조직을 보호하는 모습이다. 골무 바로 위에서 작은 세포들이 둘로 나뉘는 곳은 분열대다. 그 위에서 세포들이 길어져 뿌리 끝을 밀어 넣는 곳은 신장대이고, 더 위에서 각 기능을 갖추는 곳은 성숙대다. 끝에서부터 분열, 신장, 성숙의 순서다. 성숙대의 표피세포가 길게 돌출된 뿌리털은 흡수 면적을 크게 늘린다.","cards":["O0-20","O0-4"],"box":[[1610,595,200,225]]},{"sid":"s10","obj":"흙 오른쪽 아래 세로로 가른 굵은 뿌리 — 가운데 청록 · 분홍 관 다발 · 그 둘레의 검은 안감 · 속에서 돋은 갈색 곁뿌리가 바깥 벽을 금 가게 하며 뚫고 나온다","fact":"내초 = 곁뿌리를 만든다 / 내피 = 물을 골라 통과시킨다","hook":"곁뿌리는 겉이 아니라 속에서 뚫고 나온다","say":"세로로 갈라 놓은 굵은 뿌리의 가운데에는 청록·분홍 관다발이 있고, 그 둘레를 검은 안감이 감싼다. 고리 동네에서 틈마다 검은 가스 파이프를 끼웠던 내피다. 물과 무기물을 선택적으로 통과시키는 관문이다. 바로 안쪽의 얇은 층은 내초다. 곁뿌리는 표면에서 생기는 것이 아니라 내초에서 시작해 내피와 피층을 뚫고 나온다.","cards":["O0-22"],"box":[[1870,660,178,185]]},{"sid":"s11","obj":"분수대 — 맑은 물 연못에 선 판자 물통에 사과 · 포도 더미가 그득 · 분수의 파란 물방울 몇이 판자 물통 속으로 떨어지고 · 판자 벽은 바깥으로 불룩하게 부풀어 떨린다","fact":"물은 Ψ 높은 곳 → 낮은 곳(순수한 물 = 0) · Ψ = Ψs + Ψp · 용액의 Ψs 는 늘 음수","hook":"사과 · 포도(용질)가 물을 끈다 = Ψs 음 · 판자 벽이 되민다 = Ψp","say":"분수대의 맑은 연못에 놓인 판자 물통은 식물 세포다. 안의 사과와 포도는 녹아 있는 용질이고, 파란 물방울이 통으로 들어온다. 물은 물 포텐셜인 프사이가 높은 곳에서 낮은 곳으로 이동한다. 아무것도 녹지 않은 맑은 물의 값을 0으로 잡는다. 용질이 녹으면 자유롭게 움직이는 물이 줄어 프사이가 낮아지므로, 용질이 녹은 용액의 용질 포텐셜은 늘 음수이고 농도가 높을수록 더 음수가 된다. 물이 차면 판자 벽이 술통처럼 불룩해져 내부를 되민다. 이 힘은 압력 포텐셜이다. 물 포텐셜은 용질 포텐셜과 압력 포텐셜의 합, 프사이 S 더하기 프사이 P이다.","cards":["O1-6","O1-7","O1-8"],"box":[[1350,120,340,310]]},{"sid":"s12","obj":"화단 위의 딸기 — 잎마다 맑은 물방울이 맺혔다 · 그 아래 흙 속에서 꼬마가 두 손을 치켜들고 물을 밀어 올리며 진땀을 흘린다(곁에 위로 향한 파란 화살 둘)","fact":"뿌리압 = 약해(몇 m) 키 큰 식물엔 부족 · 지나치면 일액현상(잎 끝 물방울)","hook":"밑에서 미는 힘은 약하다 · 잎 끝 물방울 = 일액","say":"화단 위 딸기 잎에는 맑은 물방울이 맺혀 있고, 흙 속의 꼬마는 진땀을 흘리며 두 손으로 물을 위로 밀고 있다. 뿌리압이다. 밤에 뿌리가 무기 이온을 물관에 넣으면 물이 따라 들어와 물관의 물을 밀어 올린다. 증산이 적은 밤에 물이 많이 올라가면 잎 끝에서 물방울이 나오는 일액현상이 나타난다. 하지만 뿌리압은 약해 몇 미터 정도만 물을 올린다. 베어 낸 거목처럼 키 큰 나무의 물은 고리 동네의 밧줄처럼 위에서 당기는 응집-장력으로 올라간다.","cards":["O1-16"],"box":[[1600,380,448,160],[1830,575,135,140]]},{"sid":"s13","obj":"유리 너머 흙 — 위는 썩은 잎 조각이 섞인 검고 푸석한 흙 · 가운데는 갈색 흙 · 아래는 굵은 모래 · 자갈 층 · 가운데 흙에 박힌 납작한 회색 점토 조각들 위에 자갈 · 은빛 구슬이 붙었다 · 뿌리털이 맑은 물을 뿌리자 칼 하나가 뿌리털 쪽으로 날아가고 · 떨어져 나온 칼 몇 자루가 흙 속에 흩어졌다","fact":"양토(모래 · 미사 · 점토) · 부식질(물 · 양분 보유) · 양이온 교환(음전하 점토 ↔ H⁺)","hook":"고루 섞인 알갱이 = 양토 · 검고 푸석한 흙 = 부식질 · 칼 · 자갈 · 은구슬을 맑은 물이 떼어 냄","say":"유리 너머 흙의 아래에는 굵은 모래, 가운데 갈색 흙에는 고운 미사와 납작한 점토가 있다. 모래·미사·점토가 고르게 섞인 양토는 작물에 가장 좋은 흙이다. 맨 위의 검고 푸석한 흙에는 썩는 잎이 섞여 있다. 분해되는 유기물인 부식질은 물과 양분을 머금고 흙을 푸석하게 해 뿌리의 호흡을 돕는다. 점토 조각에 붙은 자갈과 은빛 구슬도 보자. 음전하를 띤 점토와 부식질은 칼·자갈·은빛 구슬로 나타낸 칼륨·칼슘·마그네슘 양이온을 붙잡아 빗물에 씻기지 않게 한다. 뿌리털이 맑은 물로 나타낸 수소 이온을 내보내면 수소 이온이 그 자리를 대신 차지한다. 떨어져 나온 칼 하나가 뿌리털 쪽으로 가듯, 풀려난 양이온은 뿌리에 흡수된다. 양이온 교환이다.","cards":["O2-1","O2-2","O2-3"],"box":[[1450,555,440,340]]},{"sid":"s14","obj":"맨 아래 오른쪽 초록 앞치마 정원 의사의 작업대 — 맑은 물에 뿌리를 담근 유리병 화초 셋(왼쪽 한 병만 시들었다) · 분수대 곁 선반의 큰 갈색 병 아홉(윗칸)과 작은 스포이트 병 여덟(아랫칸)","fact":"수경재배로 필수 원소 확인 · 필수 원소 17 = 다량 9 + 미량 8(주로 효소 보조인자)","hook":"한 병만 시듦 = 그 원소가 필수 · 큰 병 9 = 다량 · 작은 병 8 = 미량","say":"맨 아래 오른쪽의 초록 앞치마 정원 의사 앞에는 유리병 화초 셋이 있다. 흙 없이 맑은 물에 뿌리를 담근 수경재배다. 무기물 용액에서 원소를 하나씩 빼고 길렀을 때 식물이 시들면 필수 원소임을 알 수 있다. 여기서는 왼쪽 병의 식물만 시들었다. 이렇게 찾은 필수 원소는 열일곱이다. 분수대 옆 선반 위의 큰 병 아홉은 다량원소인 탄소·산소·수소·질소·인·황·칼륨·칼슘·마그네슘이다. 아래 작은 스포이트 병 여덟은 미량원소인 염소·철·망가니즈·붕소·아연·구리·니켈·몰리브데넘이다. 미량원소는 주로 효소의 보조인자로 소량 필요하다.","cards":["O2-4","O2-5","O2-6","O2-8"],"box":[[1180,860,450,284],[1680,180,368,175]]},{"sid":"s15","obj":"작업대 앞 끝에 넘어진 빈 병 셋 — 가장 큰 호박색 병 · 빨간 머리 성냥이 꽂힌 병 · 칼날이 꽂힌 병 · 곁의 화분은 아래 잎부터 누렇다","fact":"생장 · 수확량에 가장 크게 기여 = 질소 · 가장 흔한 결핍 = 질소 · 인 · 칼륨","hook":"가장 큰 호박색 병 = 질소 · 성냥 = 인 · 칼 = 칼륨 · 먼저 바닥난다","say":"작업대 앞 끝에 넘어져 있는 빈 병 셋을 보자. 가장 큰 호박색 병, 빨간 머리 성냥이 꽂힌 병, 칼날이 꽂힌 병이다. 호박색 물은 땅속 장면의 질산으로, 질소를 뜻한다. 질소는 단백질·핵산·엽록소의 재료여서 식물의 생장과 수확량에 가장 크게 기여한다. 성냥은 인, 칼은 칼륨이다. 토양에서 가장 흔히 부족한 세 원소가 질소·인·칼륨이다. 옆 화분은 아래 잎부터 누렇다. 질소가 부족하면 오래된 잎의 질소를 어린 잎으로 옮기기 때문이다.","cards":["O2-7","O2-11"],"box":[[1560,940,240,200]]},{"sid":"s16","obj":"쓰러진 거목 가지에 붙어 살던 식객들 — 흰 열매 달린 둥근 초록 잎 뭉치(겨우살이)는 태연하고 · 잎 없는 가는 주황 실 덩굴(새삼)은 가지에 감겨 축 늘어진 채 부스러기가 떨어진다 · 가지의 분홍 난초와 뾰족 잎 브로멜리아드는 빗물만 받는다 / 오른쪽 맨 아래 화분의 파리지옥이 파리를 노린다","fact":"겨우살이(반기생 · 광합성) · 새삼(전기생 · 엽록소 없음) · 식충(질소 보충) · 착생(기생 아님)","hook":"초록이면 버틴다 · 주황 실은 굶는다 · 빗물만 마시는 손님 · 파리 = 질소","say":"쓰러진 거목에 붙어 살던 식물들도 살펴보자. 흰 열매를 단 초록 잎 뭉치인 겨우살이는 태연하다. 숙주의 물관에서 물과 무기물을 얻으면서 자신의 잎으로 광합성도 하는 반기생이다. 잎 없는 주황 실 덩굴인 새삼은 가지에 감겨 축 늘어진 채 말라 부스러진다. 엽록소가 없어 모든 것을 숙주에 의존하는 전기생이다. 가지 위의 분홍 난초와 뾰족 잎 브로멜리아드는 빗물만 받는다. 다른 식물에 붙어 살지만 자원을 빼앗지 않는 착생식물이다. 오른쪽 맨 아래 화분의 파리지옥은 파리를 노린다. 광합성을 하면서도 질소가 부족한 산성 습지에서는 곤충으로 질소를 보충하는 식충식물이다.","cards":["O2-24","O2-25","O2-26"],"box":[[20,250,580,360],[1840,905,208,239]]}],"cq":{"O0-1":["식물의 3대 기관은?","뿌리, 줄기, 잎(줄기계=줄기+잎)"],"O0-2":["뿌리와 줄기계의 상호의존은?","뿌리는 광합성 못 해 줄기계의 당에 의존 · 줄기계는 뿌리의 물·무기물에 의존"],"O1-1":["식물의 자원 획득 부위는?","잎(빛·CO₂) · 뿌리(물·무기물)"],"O0-5":["줄기의 마디·마디사이·정단눈·곁눈은?","마디(잎 붙는 곳)·마디사이·정단눈(끝)·곁눈(잎겨드랑이)"],"S-PL-9":["3대 조직계와 각각의 대표 구성은?","표피=공변세포·뿌리털·모용 / 관속=물관부+체관부 / 기본=속·피층"],"O0-6":["식물의 3대 조직계는?","표피조직계(dermal) · 관속조직계(vascular) · 기본조직계(ground)"],"O0-9":["기본조직계의 위치(속·피층)는?","관속 안쪽=속(pith) · 바깥쪽=피층(cortex)"],"O0-18":["정단분열조직과 측생분열조직의 생장 차이는?","정단=1차생장(길이, 모든 식물) · 측생=2차생장(지름, 겉씨·많은 쌍자엽)"],"O0-19":["측생분열조직 2가지는?","관속형성층 + 코르크형성층"],"S-PL-11":["2차생장의 두 형성층과 각 산물은?","관속형성층→안:2차물관부(목재)·밖:2차체관부 / 코르크형성층→주피"],"O0-23":["관속형성층(vascular cambium)이 만드는 것은?","안쪽에 2차물관부(목재) · 바깥쪽에 2차체관부"],"X-PL-22":["관속형성층의 안쪽에 생기는 것은?","2차물관부(목재); 바깥쪽=2차체관부"],"O0-26":["나이테(growth ring)의 구성은?","봄나무(early wood, 큰 세포·물 수송)+여름나무(late wood, 두꺼운 벽·지지)"],"O0-24":["코르크형성층과 주피(periderm)는?","코르크형성층이 코르크 세포 생성해 표피 대체 · 코르크형성층+산물=주피"],"O0-25":["수피(bark)의 정의는?","관속형성층 바깥의 모든 조직(2차체관부+주피)"],"O0-20":["뿌리 끝의 뿌리골무와 세 영역 순서는?","뿌리골무(보호) · 분열대→신장대→성숙대"],"O0-4":["뿌리털(root hair)의 기능은?","표피세포가 길게 돌출해 흡수 면적 확대"],"O0-22":["내초(pericycle)와 내피(endodermis)의 기능은?","내초=측근 형성 · 내피=물 선택 통과"],"O1-6":["물의 이동 방향을 정하는 물 포텐셜(Ψ)의 규칙은?","물은 Ψ가 높은 곳에서 낮은 곳으로 이동(순수 물=0 MPa)"],"O1-7":["물 포텐셜의 식은?","Ψ = Ψs(용질 포텐셜) + Ψp(압력 포텐셜)"],"O1-8":["용질 포텐셜(Ψs)의 부호는?","용액에서는 항상 음수(순수한 물은 0; 용질이 자유 물을 줄임; 농도↑→더 음수)"],"O1-16":["뿌리압(root pressure)의 한계와 부작용은?","약해서(몇 m) 키 큰 식물엔 부족 · 과하면 일액현상(guttation, 잎 끝 물방울)"],"O2-1":["토양 조직(soil texture)에서 작물에 가장 좋은 것은?","양토(loam, 모래·미사·점토가 적절히 섞임)"],"O2-2":["부식질(humus)이란?","분해 중 유기물 · 물·양분 보유 · 토양을 푸석하게 함"],"O2-3":["양이온 교환(cation exchange)이란?","음전하 점토·부식질이 양이온(K⁺·Ca²⁺·Mg²⁺)을 붙잡아 씻겨가지 않게 함(뿌리가 H⁺ 내보내 떼어 흡수)"],"O2-4":["필수 원소(essential element)를 확인하는 방법은?","수경재배(hydroponic culture, 무기물 용액에서 재배)"],"O2-5":["필수 원소의 총 개수는?","17종(다량 9 + 미량 8)"],"O2-6":["다량영양소 9종은?","C·O·H·N·P·S·K·Ca·Mg"],"O2-8":["미량영양소 8종은?","Cl·Fe·Mn·B·Zn·Cu·Ni·Mo (주로 효소 보조인자)"],"O2-7":["생장·수확량에 가장 크게 기여하는 원소는?","질소(N)"],"O2-11":["가장 흔한 결핍 원소 3가지는?","질소·인·칼륨"],"O2-24":["기생식물의 예(반기생·전기생)는?","겨우살이(반기생, 광합성도) · 새삼(전기생, 엽록소 없음)"],"O2-25":["식충식물이 곤충을 잡는 이유는?","질소 등을 보충(광합성은 함); 질소 부족한 습지·산성 토양"],"O2-26":["착생식물(epiphyte)이란?","다른 식물 위에 붙어 살되 기생은 아님 · 공기·빗물에서 양분(난·브로멜리아드)"]},"hubPanel":null};

function speak(t, sid) {

// Keep each stable SID so recap reuses the same reviewed recording as the tour.
