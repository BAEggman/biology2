<title>박람회장 정원의 그루터기와 화단 — 늙은 거목을 베어 낸 날: 식물의 몸 · 2차 생장 · 물 포텐셜 · 흙과 양분</title>
<style>
  :root{--ink:#1b1b1f;--ink2:#4b4b55;--line:#e3e1da;--teal:#0f766e;--teal50:#ecfdf5;--gold:#b45309;--bg:#f7f5ef}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1100px;margin:0 auto;padding:12px 14px 40px}
  h1{font-size:18px;margin:6px 0 2px}
  .sub{font-size:12.5px;color:var(--ink2);margin:0 0 10px}
  .sub.hid{cursor:pointer;color:var(--ink3,#8a8a94);border:1px dashed #c9c6bd;border-radius:8px;padding:4px 8px;display:inline-block}
  .cq{font-size:12.5px;color:var(--ink2);margin-top:8px;border-top:1px dashed #d8d5cc;padding-top:6px}.cq summary{cursor:pointer}.cq li{margin:3px 0}.cq .a{color:var(--ink);font-weight:600}
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
  button{font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
  button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  button:disabled{opacity:.45;cursor:default}
  .stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .stage img{display:block;width:100%;height:auto}
  .stage svg{position:absolute;inset:0;width:100%;height:100%}
  .cap{margin-top:10px;min-height:76px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px}
  .cap .n{font-size:11.5px;color:var(--ink2)}
  .cap .obj{font-weight:700;font-size:15px;margin:2px 0}
  .cap .fact{font-size:14px;margin:2px 0}
  .cap .hook{font-size:13px;color:var(--gold);margin-top:4px}
  .cap.muted{color:var(--ink2);font-size:13px}
  .recap{margin-top:12px;display:none}
  .recap ol{padding-left:22px;margin:6px 0}
  .recap li{margin:4px 0;font-size:13.5px}
  .recap li b{color:var(--teal)}
  .score{font-size:13px;color:var(--ink2);margin-left:auto}
  .hint{font-size:12px;color:var(--ink2);margin-top:8px}
  .hole{fill:#000}
  .cur{fill:none;stroke:#f59e0b;stroke-width:6;stroke-dasharray:14 8}
  .hot{fill:transparent;cursor:pointer}
  .hot:hover{fill:rgba(245,158,11,.18)}
  .judge{display:none;gap:6px;margin-top:8px}
  .judge button{font-size:12.5px}
  .nav{display:flex;gap:12px;font-size:12.5px;margin:2px 0 0}
  .nav a{color:var(--teal);text-decoration:none}
  .nav a:hover{text-decoration:underline}
</style>

<script>
const L = {"id":"L22e","scene":"s22","part":"e","title":"박람회장 정원의 그루터기와 화단 — 늙은 거목을 베어 낸 날: 식물의 몸 · 2차 생장 · 물 포텐셜 · 흙과 양분","sub":"누운 줄기 · 그루터기 · 새싹(뿌리 · 줄기 · 잎) · 잎 모자와 뿌리 다리 일꾼의 맞바꿈(서로 기댐) · 대나무 마디와 눈(마디 · 정단눈 · 곁눈) · 고리 김밥(표피 · 관다발 · 기본 · 속 · 피층) · 키 재기 막대와 줄자(1차 · 2차 생장) · 초록 고리 일꾼(안 = 청록 목재 · 밖 = 분홍 체관) · 테 세는 심판(봄재 · 여름재) · 외투 껍질(주피 · 수피) · 골무 뿌리(뿌리골무 · 세 영역 · 뿌리털) · 속에서 뚫고 나온 곁뿌리(내초 · 내피) · 판자 물통(Ψ) · 우는 딸기(뿌리압 · 일액) · 유리 너머 흙(양토 · 부식질 · 양이온 교환) · 유리병 화초와 병 아홉 · 여덟(필수 원소 17) · 바닥난 세 병(N · P · K) · 식객들과 파리지옥(반기생 · 전기생 · 식충 · 착생)","img":"img/L22e.webp?v=b8b0ffb76353","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"박람회장 정원 — 오늘 아침 베어 낸 거목의 큰 그루터기 · 왼쪽에 길게 누운 줄기 · 그루터기 발치에서 솟은 새싹(잎 · 줄기) · 오른쪽 유리 화단 너머 땅속의 뿌리 (틀)","fact":"식물의 3대 기관 = 뿌리 · 줄기 · 잎 · 줄기계 = 줄기 + 잎 / 뿌리계","hook":"땅 위 줄기와 잎 = 줄기계 · 땅 밑 = 뿌리계","say":"박람회장 정원 한가운데 서 있던 늙은 거목을 오늘 아침 베어 냈다. 줄기는 왼쪽에 길게 누웠고, 그 자리엔 무대만 한 그루터기가 남았다. 그 발치에서 새싹이 솟았고, 오른쪽 유리 화단 너머로는 땅속 뿌리가 보인다. 식물의 몸은 세 기관, 뿌리와 줄기와 잎으로 되어 있다. 땅 위의 줄기와 잎을 묶어 줄기계, 땅 밑을 뿌리계라 한다. 오늘 이 정원에서 벌어지는 일로 식물의 몸과 자람, 물이 움직이는 규칙, 흙과 양분을 차례로 본다.","cards":["O0-1"],"box":null},{"sid":"s2","obj":"유리 화단 왼쪽 끝 — 화단 위에서 커다란 잎 모자를 쓴 일꾼이 줄에 맨 입 묶은 갈색 설탕 자루를 내려 주고 · 몸이 뿌리로 된 사람이 받아 안는다 · 흙 속에선 다리가 뿌리인 꼬마가 물병 · 칼 · 자갈 한 알 · 빨간 머리 성냥이 든 바구니를 머리에 이고 올린다","fact":"잎 = 빛 · CO₂ / 뿌리 = 물 · 무기물 · 뿌리는 줄기계의 당에, 줄기계는 뿌리의 물에 의존","hook":"위는 설탕을 내리고 아래는 물을 올린다 = 서로 기댄다","say":"유리 화단 왼쪽 끝에서 맞바꿈이 벌어진다. 화단 위에서 커다란 잎 모자를 쓴 일꾼이, 햇빛과 공기 속 이산화탄소로 만든 설탕을 입 묶은 갈색 자루에 담아 줄로 내려 준다. 몸이 뿌리로 된 사람이 그 자루를 받아 안는다. 흙 속에서는 다리가 뿌리인 꼬마가 물병과 칼, 자갈, 성냥이 든 바구니를 머리에 이고 올린다. 물과 칼륨, 칼슘, 인, 곧 무기물이다. 잎은 빛과 이산화탄소를, 뿌리는 물과 무기물을 얻는다. 뿌리는 광합성을 못 하니 줄기계가 만든 당에 기대고, 줄기계는 뿌리가 빨아올린 물과 무기물에 기댄다.","cards":["O0-2","O1-1"],"box":[[1310,400,270,475]]},{"sid":"s3","obj":"그루터기 발치에서 솟은 새싹 — 대나무처럼 마디 진 초록 줄기 · 마디마다 잎이 붙고 잎겨드랑이마다 반쯤 감긴 졸린 눈 하나 · 꼭대기 끝엔 크게 뜬 눈 하나","fact":"줄기 = 마디(잎 붙는 곳) · 마디사이 · 정단눈(끝) · 곁눈(잎겨드랑이)","hook":"눈 = 눈 · 꼭대기 큰 눈 = 정단눈 · 겨드랑이 졸린 눈 = 곁눈 · 대나무 마디 = 마디","say":"그루터기 발치에서 새싹이 솟았다. 줄기는 대나무처럼 마디가 졌다. 잎이 붙는 곳이 마디, 마디와 마디 사이가 마디사이다. 새싹의 눈은 정말 눈으로 그렸다. 꼭대기 끝에 크게 뜬 눈 하나가 정단눈, 줄기 끝에서 자라는 눈이다. 마디마다 잎과 줄기 사이의 겨드랑이에 졸린 눈이 하나씩 있다. 곁눈이다. 곁눈은 꼭대기 눈이 깨어 있는 동안은 대개 잠들어 있다가, 꼭대기가 잘리면 깨어나 곁가지가 된다.","cards":["O0-5"],"box":[[1030,520,150,400]]},{"sid":"s4","obj":"그루터기 앞 돗자리에서 가족이 써는 통나무만 한 김밥 — 썬 단면: 겉의 검은 김 · 하얀 밥 · 고리로 둘러 박힌 초록 오이(안쪽) · 분홍 햄(바깥쪽) 짝 · 고리 안 가운데도 밥","fact":"3대 조직계 = 표피(공변세포 · 뿌리털 · 모용) · 관다발(물관부 + 체관부) · 기본(속 · 피층)","hook":"김 = 표피 · 고리의 오이 · 햄 = 관다발 · 고리 안 밥 = 속 · 고리 밖 밥 = 피층","say":"그루터기 앞 돗자리에선 통나무만 한 김밥을 썬다. 어린 줄기를 가로로 자른 단면이 꼭 이렇다. 겉을 싼 김이 표피조직계, 공변세포와 뿌리털과 털 같은 모용이 다 여기 속한다. 속재료는 가운데 몰리지 않고 고리로 둘러 박혔다. 초록 오이와 분홍 햄이 짝을 이룬 이 고리가 관다발조직계, 물관부와 체관부다. 오이는 고리 안쪽, 햄은 바깥쪽. 나머지 밥이 기본조직계다. 고리 안 가운데 밥이 속, 고리 밖 밥이 피층이다.","cards":["S-PL-9","O0-6","O0-9"],"box":[[740,870,360,250]]},{"sid":"s5","obj":"새싹 곁에 세운 키 재기 막대 · 그루터기 허리에 감은 노란 줄자","fact":"정단 = 1차 생장(길이 · 모든 식물) / 측생 = 2차 생장(굵기) = 관다발형성층 + 코르크형성층","hook":"끝에서 키 · 고리에서 굵기","say":"새싹 곁에는 키 재기 막대가, 그루터기 허리에는 줄자가 감겼다. 새싹은 꼭대기 끝에서 위로, 뿌리는 아래 끝에서 밑으로 자란다. 끝에 있는 정단분열조직이 길이를 늘리는 1차 생장이고, 모든 식물이 한다. 그루터기는 줄자가 재듯 굵어진다. 줄기 속을 고리처럼 두른 측생분열조직이 지름을 늘리는 2차 생장이고, 겉씨식물과 많은 쌍떡잎식물이 한다. 측생분열조직은 둘, 단면에 보이는 초록 고리인 관다발형성층과, 그루터기 껍질을 타는 주황 모자 일꾼들인 코르크형성층이다.","cards":["O0-18","O0-19"],"box":[[1030,470,240,450],[680,630,600,120]]},{"sid":"s6","obj":"그루터기 단면 가장자리 가까이 두른 초록 고리 — 고리 위에 선 초록 모자 꼬마 일꾼들 · 앞쪽 고리 안쪽(가운데 쪽)엔 청록 관 토막 · 고리 바깥쪽(껍질 쪽)엔 분홍 관 토막이 쌓였다","fact":"관다발형성층 → 안쪽 2차 물관부(목재) · 바깥쪽 2차 체관부 / 코르크형성층 → 주피","hook":"안으로 청록(물관 = 나무) · 밖으로 분홍(체관)","say":"베었는데도 그루터기 단면 가장자리의 초록 고리 위에서는 초록 모자 꼬마 일꾼들이 일한다. 관다발형성층이다. 고리 안쪽, 가운데 쪽에는 청록 관 토막이 쌓인다. 청록 관은 물관, 이렇게 안쪽에 쌓인 2차 물관부가 바로 목재, 나무다. 고리 바깥쪽, 껍질 쪽에는 분홍 관 토막이 쌓인다. 분홍 관은 체관, 2차 체관부다. 안이 물관, 밖이 체관. 이 방향이 단골 함정이다. 껍질을 타는 주황 모자 일꾼들, 코르크형성층은 주피를 만든다.","cards":["S-PL-11","O0-23","X-PL-22"],"box":[[680,320,620,245]]},{"sid":"s7","obj":"그루터기 단면의 테 — 연한 띠와 짙은 띠가 번갈아 둘렀다 · 무릎 꿇고 돋보기로 테를 세는 줄무늬 재킷의 심판","fact":"나이테 = 봄재(큰 세포 · 물 수송) + 여름재(두꺼운 벽 · 지지)","hook":"연한 봄 · 짙은 여름 = 한 해","say":"심판이 그루터기에 무릎을 꿇고 돋보기로 테를 센다. 연한 띠와 짙은 띠가 번갈아 둘렀다. 연한 띠는 봄에 자란 봄재, 세포가 크고 벽이 얇아 빛깔이 연하고 물을 많이 나른다. 짙은 띠는 여름에 자란 여름재, 세포가 작고 벽이 두꺼워 빛깔이 짙고 나무를 받친다. 봄재와 여름재 한 쌍이 한 해, 나이테 하나다. 연한 띠와 짙은 띠 한 쌍을 세면 나무의 나이가 나온다.","cards":["O0-26"],"box":[[690,200,610,370]]},{"sid":"s8","obj":"쓰러진 줄기 끝 — 벌목꾼이 껍질을 외투처럼 통째로 벗긴다 · 벗긴 껍질의 안감은 분홍, 겉은 거친 갈색 · 그 밑은 청록 나무 / 그루터기 옆구리 껍질을 타고 오르는 주황 모자 일꾼들이 갈색 코르크 조각을 밖으로 던진다","fact":"코르크형성층 → 코르크(표피 대체) · 그 산물과 함께 = 주피 / 수피 = 관다발형성층 바깥 전부","hook":"껍질은 초록 고리에서 벗겨진다 = 그 바깥이 다 수피","say":"쓰러진 줄기 끝에서 벌목꾼이 껍질을 외투처럼 통째로 벗긴다. 그루터기 옆구리 껍질을 타고 오르는 주황 모자 일꾼들, 코르크형성층은 갈색 코르크 조각을 밖으로 던진다. 줄기가 굵어지면 표피가 찢어져 떨어지고, 이 코르크가 표피 대신 겉을 덮는다. 코르크형성층과 그것이 만든 것을 합쳐 주피라 한다. 벗긴 껍질은 초록 고리, 관다발형성층에서 쑥 떨어졌다. 안감은 분홍 체관, 겉은 갈색 코르크. 관다발형성층 바깥의 전부, 곧 2차 체관부와 주피를 합쳐 수피라 한다. 남은 청록이 목재다.","cards":["O0-24","O0-25"],"box":[[40,720,560,400],[655,545,210,145]]},{"sid":"s9","obj":"유리 화단 너머 딸기의 곧은 뿌리 — 끝에 은빛 골무를 썼다 · 골무 바로 위엔 둘로 갈라지는 작은 세포들 · 그 위엔 길게 늘어난 세포들 · 뿌리 윗부분엔 짧고 가는 흰 털이 솔처럼 사방으로 돋았다","fact":"뿌리골무(보호) · 분열대 → 신장대 → 성숙대 · 뿌리털 = 표피세포 돌출 → 흡수 면적 ↑","hook":"골무 = 뿌리골무 · 쪼개짐 → 늘어남 → 털","say":"유리 화단 너머 흙 속, 딸기의 곧은 뿌리 끝이 은빛 골무를 쓰고 파 내려간다. 이름도 뿌리골무, 흙을 뚫는 끝의 분열조직을 지킨다. 골무 바로 위에서는 작은 세포들이 둘로 갈라진다. 분열대다. 그 위의 세포들은 길게 늘어나 뿌리 끝을 흙 속으로 밀어 넣는다. 신장대다. 그 위에서 세포들은 제 몫으로 자리를 잡는다. 성숙대다. 끝에서부터 분열, 신장, 성숙. 성숙대의 표피세포는 가늘고 길게 튀어나와 뿌리털이 되어, 흡수 면적을 크게 넓힌다.","cards":["O0-20","O0-4"],"box":[[1610,595,200,225]]},{"sid":"s10","obj":"흙 오른쪽 아래 세로로 가른 굵은 뿌리 — 가운데 청록 · 분홍 관 다발 · 그 둘레의 검은 안감 · 속에서 돋은 갈색 곁뿌리가 바깥 벽을 금 가게 하며 뚫고 나온다","fact":"내초 = 곁뿌리를 만든다 / 내피 = 물을 골라 통과시킨다","hook":"곁뿌리는 겉이 아니라 속에서 뚫고 나온다","say":"굵은 뿌리 하나를 세로로 갈라 놓았다. 가운데 청록과 분홍 관 다발이 있고, 그 둘레를 검은 안감이 두른다. 고리 동네에서 틈마다 검은 가스 파이프를 끼운 그 고리, 내피다. 물과 무기물을 골라 통과시키는 관문이다. 그 바로 안쪽의 얇은 층이 내초다. 곁뿌리는 겉에서 돋지 않는다. 이 내초에서 돋아 내피와 피층을 뚫고 밖으로 나온다.","cards":["O0-22"],"box":[[1870,660,178,185]]},{"sid":"s11","obj":"분수대 — 맑은 물 연못에 선 판자 물통에 사과 · 포도 더미가 그득 · 분수의 파란 물방울 몇이 판자 물통 속으로 떨어지고 · 판자 벽은 바깥으로 불룩하게 부풀어 떨린다","fact":"물은 Ψ 높은 곳 → 낮은 곳(순수한 물 = 0) · Ψ = Ψs + Ψp · Ψs 는 늘 음수","hook":"사과 · 포도(용질)가 물을 끈다 = Ψs 음 · 판자 벽이 되민다 = Ψp","say":"분수대의 맑은 연못에 판자로 짠 물통 하나가 섰다. 식물 세포다. 안에는 사과와 포도가 그득하다. 녹아 있는 용질이다. 분수의 파란 물방울이 물통 속으로 떨어진다. 물은 물 포텐셜, 프사이가 높은 곳에서 낮은 곳으로 움직인다. 아무것도 녹지 않은 맑은 물을 0 으로 잡는다. 용질이 녹으면 자유롭게 움직이는 물이 줄어 프사이가 내려간다. 그래서 용질 포텐셜은 늘 음수이고, 짙을수록 더 음수다. 물이 차자 판자 벽이 술통처럼 불룩해져 안을 되민다. 이 미는 힘이 압력 포텐셜이다. 물 포텐셜은 둘의 합, 프사이 S 더하기 프사이 P 다.","cards":["O1-6","O1-7","O1-8"],"box":[[1350,120,340,310]]},{"sid":"s12","obj":"화단 위의 딸기 — 잎마다 맑은 물방울이 맺혔다 · 그 아래 흙 속에서 꼬마가 두 손을 치켜들고 물을 밀어 올리며 진땀을 흘린다(곁에 위로 향한 파란 화살 둘)","fact":"뿌리압 = 약해(몇 m) 키 큰 식물엔 부족 · 지나치면 일액현상(잎 끝 물방울)","hook":"밑에서 미는 힘은 약하다 · 잎 끝 물방울 = 일액","say":"화단 위 딸기는 잎마다 맑은 물방울을 맺었다. 그 아래 흙 속에서는 꼬마가 두 손으로 물을 밀어 올리며 진땀을 흘린다. 뿌리압이다. 밤에 뿌리가 무기 이온을 물관으로 들여보내면 물이 따라 들어와 물관 속 물을 밀어 올린다. 증산이 적은 밤에 너무 밀려 올라오면 잎 끝으로 물방울이 배어 나온다. 일액현상이다. 그러나 뿌리압은 약해서 물을 몇 미터밖에 못 올린다. 베어 낸 거목처럼 키 큰 나무의 물은 위에서 당기는 힘, 고리 동네의 밧줄인 응집-장력으로 오른다.","cards":["O1-16"],"box":[[1600,380,448,160],[1830,575,135,140]]},{"sid":"s13","obj":"유리 너머 흙 — 위는 썩은 잎 조각이 섞인 검고 푸석한 흙 · 가운데는 갈색 흙 · 아래는 굵은 모래 · 자갈 층 · 가운데 흙에 박힌 납작한 회색 점토 조각들 위에 자갈 · 은빛 구슬이 붙었다 · 뿌리털이 맑은 물을 뿌리자 칼 하나가 뿌리털 쪽으로 날아가고 · 떨어져 나온 칼 몇 자루가 흙 속에 흩어졌다","fact":"양토(모래 · 미사 · 점토) · 부식질(물 · 양분 보유) · 양이온 교환(음전하 점토 ↔ H⁺)","hook":"고루 섞인 알갱이 = 양토 · 검고 푸석한 흙 = 부식질 · 칼 · 자갈 · 은구슬을 맑은 물이 떼어 냄","say":"유리 너머 흙을 보자. 아래엔 굵은 모래, 가운데 갈색 흙엔 고운 미사와 납작한 점토 조각이 들었다. 모래, 미사, 점토가 고루 섞인 흙이 작물에 가장 좋은 양토다. 맨 위는 썩어 가는 잎이 섞인 검고 푸석한 흙이다. 분해되는 유기물, 부식질이다. 물과 양분을 머금고 흙을 푸석하게 해 뿌리가 숨 쉬게 한다. 납작한 점토 조각 위에 자갈과 은빛 구슬이 붙었다. 음전하를 띤 점토와 부식질이 칼, 자갈, 은빛 구슬, 곧 칼륨, 칼슘, 마그네슘 양이온을 붙들어 빗물에 씻겨 나가지 않게 한다. 뿌리털이 맑은 물, 수소 이온을 뿌리면 그 자리를 수소 이온이 차지하고, 칼 하나가 떨어져 나와 뿌리털로 날아가듯 양이온이 뿌리로 들어간다. 양이온 교환이다.","cards":["O2-1","O2-2","O2-3"],"box":[[1450,555,440,340]]},{"sid":"s14","obj":"맨 아래 오른쪽 초록 앞치마 정원 의사의 작업대 — 맑은 물에 뿌리를 담근 유리병 화초 셋(왼쪽 한 병만 시들었다) · 분수대 곁 선반의 큰 갈색 병 아홉(윗칸)과 작은 스포이트 병 여덟(아랫칸)","fact":"수경재배로 필수 원소 확인 · 필수 원소 17 = 다량 9 + 미량 8(주로 효소 보조인자)","hook":"한 병만 시듦 = 그 원소가 필수 · 큰 병 9 = 다량 · 작은 병 8 = 미량","say":"맨 아래 오른쪽, 초록 앞치마를 두른 정원 의사의 작업대에는 흙 없이 맑은 물에 뿌리를 담근 유리병 화초 셋이 섰다. 수경재배다. 무기물 용액에서 원소 하나씩을 빼고 길러, 시들면 그 원소가 필수다. 왼쪽 한 병만 시들었다. 이렇게 찾은 필수 원소는 열일곱. 분수대 곁 선반 윗칸의 큰 병 아홉이 다량원소, 탄소, 산소, 수소, 질소, 인, 황, 칼륨, 칼슘, 마그네슘. 아랫칸의 작은 스포이트 병 여덟이 미량원소, 염소, 철, 망가니즈, 붕소, 아연, 구리, 니켈, 몰리브데넘. 미량원소는 주로 효소의 보조인자로 조금만 필요하다.","cards":["O2-4","O2-5","O2-6","O2-8"],"box":[[1180,860,450,284],[1680,180,368,175]]},{"sid":"s15","obj":"작업대 앞 끝에 넘어진 빈 병 셋 — 가장 큰 호박색 병 · 빨간 머리 성냥이 꽂힌 병 · 칼날이 꽂힌 병 · 곁의 화분은 아래 잎부터 누렇다","fact":"생장 · 수확량에 가장 크게 기여 = 질소 · 가장 흔한 결핍 = 질소 · 인 · 칼륨","hook":"가장 큰 호박색 병 = 질소 · 성냥 = 인 · 칼 = 칼륨 · 먼저 바닥난다","say":"작업대 앞 끝에 빈 병 셋이 넘어졌다. 가장 큰 호박색 병, 빨간 머리 성냥이 꽂힌 병, 칼날이 꽂힌 병. 호박색 물은 땅속에서 본 질산, 곧 질소다. 질소는 단백질, 핵산, 엽록소의 재료라 식물의 생장과 수확량에 가장 크게 기여한다. 성냥은 인, 칼은 칼륨. 흙에서 가장 흔히 모자라는 원소가 이 셋, 질소, 인, 칼륨이다. 곁의 화분은 아래 잎부터 누렇다. 질소가 모자라면 식물은 늙은 잎의 질소를 빼 어린 잎으로 옮긴다.","cards":["O2-7","O2-11"],"box":[[1560,940,240,200]]},{"sid":"s16","obj":"쓰러진 거목 가지에 붙어 살던 식객들 — 흰 열매 달린 둥근 초록 잎 뭉치(겨우살이)는 태연하고 · 잎 없는 가는 주황 실 덩굴(새삼)은 가지에 감겨 축 늘어진 채 부스러기가 떨어진다 · 가지의 분홍 난초와 뾰족 잎 브로멜리아드는 빗물만 받는다 / 오른쪽 맨 아래 화분의 파리지옥이 파리를 노린다","fact":"겨우살이(반기생 · 광합성) · 새삼(전기생 · 엽록소 없음) · 식충(질소 보충) · 착생(기생 아님)","hook":"초록이면 버틴다 · 주황 실은 굶는다 · 빗물만 마시는 손님 · 파리 = 질소","say":"쓰러진 거목에 붙어 살던 식객들의 반응이 저마다다. 흰 열매가 달린 초록 잎 뭉치, 겨우살이는 태연하다. 숙주의 물관에서 물과 무기물을 빼 먹지만 제 잎으로 광합성도 하는 반기생이다. 잎 없는 주황 실 덩굴, 새삼은 가지에 감겨 축 늘어진 채 말라 부스러진다. 엽록소가 없어 모든 것을 숙주에 기대는 전기생이다. 가지에 앉은 분홍 난초와 뾰족 잎 브로멜리아드는 빗물만 받아 마신다. 다른 식물 위에 붙어 살 뿐 빼앗지 않는 착생식물이다. 오른쪽 맨 아래 화분의 파리지옥은 파리를 노린다. 광합성을 하면서도 질소가 모자란 산성 습지에서 곤충으로 질소를 보충하는 식충식물이다.","cards":["O2-24","O2-25","O2-26"],"box":[[20,250,580,360],[1840,905,208,239]]}],"cq":{"O0-1":["식물의 3대 기관은?","뿌리, 줄기, 잎(줄기계=줄기+잎)"],"O0-2":["뿌리와 줄기계의 상호의존은?","뿌리는 광합성 못 해 줄기계의 당에 의존 · 줄기계는 뿌리의 물·무기물에 의존"],"O1-1":["식물의 자원 획득 부위는?","잎(빛·CO₂) · 뿌리(물·무기물)"],"O0-5":["줄기의 마디·마디사이·정단눈·곁눈은?","마디(잎 붙는 곳)·마디사이·정단눈(끝)·곁눈(잎겨드랑이)"],"S-PL-9":["3대 조직계와 각각의 대표 구성은?","표피=공변세포·뿌리털·모용 / 관속=물관부+체관부 / 기본=속·피층"],"O0-6":["식물의 3대 조직계는?","표피조직계(dermal) · 관속조직계(vascular) · 기본조직계(ground)"],"O0-9":["기본조직계의 위치(속·피층)는?","관속 안쪽=속(pith) · 바깥쪽=피층(cortex)"],"O0-18":["정단분열조직과 측생분열조직의 생장 차이는?","정단=1차생장(길이, 모든 식물) · 측생=2차생장(지름, 겉씨·많은 쌍자엽)"],"O0-19":["측생분열조직 2가지는?","관속형성층 + 코르크형성층"],"S-PL-11":["2차생장의 두 형성층과 각 산물은?","관속형성층→안:2차물관부(목재)·밖:2차체관부 / 코르크형성층→주피"],"O0-23":["관속형성층(vascular cambium)이 만드는 것은?","안쪽에 2차물관부(목재) · 바깥쪽에 2차체관부"],"X-PL-22":["관속형성층의 안쪽에 생기는 것은?","2차물관부(목재); 바깥쪽=2차체관부"],"O0-26":["나이테(growth ring)의 구성은?","봄나무(early wood, 큰 세포·물 수송)+여름나무(late wood, 두꺼운 벽·지지)"],"O0-24":["코르크형성층과 주피(periderm)는?","코르크형성층이 코르크 세포 생성해 표피 대체 · 코르크형성층+산물=주피"],"O0-25":["수피(bark)의 정의는?","관속형성층 바깥의 모든 조직(2차체관부+주피)"],"O0-20":["뿌리 끝의 뿌리골무와 세 영역 순서는?","뿌리골무(보호) · 분열대→신장대→성숙대"],"O0-4":["뿌리털(root hair)의 기능은?","표피세포가 길게 돌출해 흡수 면적 확대"],"O0-22":["내초(pericycle)와 내피(endodermis)의 기능은?","내초=측근 형성 · 내피=물 선택 통과"],"O1-6":["물의 이동 방향을 정하는 물 포텐셜(Ψ)의 규칙은?","물은 Ψ가 높은 곳에서 낮은 곳으로 이동(순수 물=0 MPa)"],"O1-7":["물 포텐셜의 식은?","Ψ = Ψs(용질 포텐셜) + Ψp(압력 포텐셜)"],"O1-8":["용질 포텐셜(Ψs)의 부호는?","항상 음수(용질이 자유 물을 줄임; 농도↑→더 음수)"],"O1-16":["뿌리압(root pressure)의 한계와 부작용은?","약해서(몇 m) 키 큰 식물엔 부족 · 과하면 일액현상(guttation, 잎 끝 물방울)"],"O2-1":["토양 조직(soil texture)에서 작물에 가장 좋은 것은?","양토(loam, 모래·미사·점토가 적절히 섞임)"],"O2-2":["부식질(humus)이란?","분해 중 유기물 · 물·양분 보유 · 토양을 푸석하게 함"],"O2-3":["양이온 교환(cation exchange)이란?","음전하 점토·부식질이 양이온(K⁺·Ca²⁺·Mg²⁺)을 붙잡아 씻겨가지 않게 함(뿌리가 H⁺ 내보내 떼어 흡수)"],"O2-4":["필수 원소(essential element)를 확인하는 방법은?","수경재배(hydroponic culture, 무기물 용액에서 재배)"],"O2-5":["필수 원소의 총 개수는?","17종(다량 9 + 미량 8)"],"O2-6":["다량영양소 9종은?","C·O·H·N·P·S·K·Ca·Mg"],"O2-8":["미량영양소 8종은?","Cl·Fe·Mn·B·Zn·Cu·Ni·Mo (주로 효소 보조인자)"],"O2-7":["생장·수확량에 가장 크게 기여하는 원소는?","질소(N)"],"O2-11":["가장 흔한 결핍 원소 3가지는?","질소·인·칼륨"],"O2-24":["기생식물의 예(반기생·전기생)는?","겨우살이(반기생, 광합성도) · 새삼(전기생, 엽록소 없음)"],"O2-25":["식충식물이 곤충을 잡는 이유는?","질소 등을 보충(광합성은 함); 질소 부족한 습지·산성 토양"],"O2-26":["착생식물(epiphyte)이란?","다른 식물 위에 붙어 살되 기생은 아님 · 공기·빗물에서 양분(난·브로멜리아드)"]},"hubPanel":null};

const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact));
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
function speak(t) {
  t = ttsNorm(t);
  const my = ++speakSeq, at = i;
  const advance = (ms) => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, ms);
  if (!('speechSynthesis' in window)) { if (playing) advance(3500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = () => { if (started) advance(700); };
  u.onerror = () => { if (!started) advance(3000); };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started && my === speakSeq) { speechSynthesis.cancel(); advance(3000); } }, 2500);  // 목소리가 없으면 글만 3초
}
function go(k) {
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) setTimeout(() => { if (playing) next(); }, 3500);
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; speechSynthesis && speechSynthesis.cancel(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i + 1); else speechSynthesis && speechSynthesis.cancel(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) speechSynthesis && speechSynthesis.cancel(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
</script>
</body>
</html>
