<script>
/* lesson_store.js — 과 목록 · 과 화면이 함께 쓰는 저장 도우미(보기 화면 명세 §1.1).
   빌드(build_lesson.js)가 두 화면에 그대로 끼워 넣는다(__STORE__) — 열쇠 이름 · 꼴이 한 군데서만 정해진다.
   열쇠: lesson_stars {ID: 찍은 때(ms)} · lesson_prefs {onlyStar, autoNext, rep, scope} · lesson_ab_<ID> {a: sid, b: sid}
   읽기 · 쓰기는 모두 try/catch — 저장이 막힌 브라우저에서는 그 쪽을 떠날 때까지만 기억하고 오류를 내지 않는다.
   (lesson_<ID> · lesson_shuffle · lesson_srs_inbox · lesson_auto_start 는 여기서 건드리지 않는다) */
const LStore = (() => {
  const mem = {};
  const rd = (k, d) => {
    let ok = false;
    try { const v = localStorage.getItem(k); ok = true; if (v !== null && v !== undefined) { const o = JSON.parse(v); mem[k] = o; return o; } } catch (e) {}
    if (ok) { delete mem[k]; return d; }   // 저장소는 멀쩡한데 값이 없다 = 다른 탭에서 지웠다 — 메모리 값도 버린다
    return k in mem ? mem[k] : d;
  };
  const wr = (k, o) => { mem[k] = o; try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) {} };
  const del = k => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} };
  const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
  const REP = ['off', 'ab', 'one', 'list'];
  return {
    stars() { const s = rd('lesson_stars', {}); return isObj(s) ? s : {}; },
    isStar(id) { return id in LStore.stars(); },
    setStar(id, on) {
      const s = { ...LStore.stars() };
      if (on) s[id] = Date.now(); else delete s[id];
      if (Object.keys(s).length) wr('lesson_stars', s); else del('lesson_stars');
      return on;
    },
    prefs() {
      const p = rd('lesson_prefs', {}); const o = isObj(p) ? p : {};
      return { onlyStar: !!o.onlyStar, autoNext: !!o.autoNext, rep: REP.includes(o.rep) ? o.rep : 'off', scope: o.scope === 'star' ? 'star' : 'all' };
    },
    setPrefs(patch) { const p = { ...LStore.prefs(), ...patch }; wr('lesson_prefs', p); return p; },
    ab(id) { const v = rd('lesson_ab_' + id, null); return isObj(v) ? { a: typeof v.a === 'string' ? v.a : null, b: typeof v.b === 'string' ? v.b : null } : { a: null, b: null }; },
    setAb(id, v) { const k = 'lesson_ab_' + id; if (v && (v.a || v.b)) wr(k, { a: v.a || null, b: v.b || null }); else del(k); },
    REP,
  };
})();

const L = {"id":"L05a","scene":"s05","part":"a","title":"개울에서 언덕까지 다섯 집 — 갑각 벽의 곰팡이 마을: 균류 5문 · 균근 · 지의류 · 흡수영양 · 키틴","sub":"개울 속 병 집과 헤엄치는 꼬리 포자(병꼴균 · 편모) · 빵에서 뻗은 두 실이 만난 검은 공(접합균 · 접합포자낭) · 뿌리 속에서 갈라진 글러브 손가락(글로메로균 · AM) · 성냥개비 ↔ 떨어지는 포도(균근: 인 ↔ 당) · 묶은 자루 집(자낭균 · 자낭) · 바위 위 오두막 지붕의 초록 사람(지의류) · 물뿌리개 즙과 젖는 밑단(흡수영양) · 버섯 갓 아래 갈퀴 끝 포자(담자균 · 담자기) · 소나무 뿌리의 흰 털 소매(외생균근) · 갑각 벽 vs 울타리 밖 판자 오두막(키틴 · 난균)","img":"img/L05a.webp?v=2f85fbfb3613","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"개울에서 마른 언덕까지 낮은 울타리 안에 다섯 집이 한 줄로 섰다(울타리는 개울 속 병 집 앞까지 물에 박혀 이어진다) — 벽은 모두 가재 껍질 같은 주황 겹비늘 (틀)","fact":"균류의 주요 5문 — 병꼴균 · 접합균 · 글로메로균 · 자낭균 · 담자균","hook":"울타리 안 다섯 집 = 균류 5문","say":"개울가에서 마른 언덕으로 이어지는 마을을 보자. 낮은 나무 울타리 안에 집 다섯 채가 한 줄로 서 있다. 울타리는 개울 속 병 모양 집 앞까지 물에 기둥을 박고 이어져, 그 집도 마을 안에 포함한다. 모든 집의 벽은 가재 껍질처럼 주황색 겹비늘로 덮여 있다. 이 마을이 균류이고, 다섯 집은 균류의 주요 다섯 문이다. 개울 속 병꼴균부터 빵 위의 접합균, 글러브가 있는 글로메로균, 묶은 자루의 자낭균, 버섯 지붕의 담자균 순서로 보자. 왼쪽에서 오른쪽으로 갈수록 물에서 멀어진다.","box":null,"src":["s05p01#0"],"cards":["S-EV-5"]},{"sid":"s2","obj":"개울 한가운데 물속에 선 병 모양 집 · 열린 문에서 꼬리를 흔들며 헤엄쳐 나오는 포자 · 하늘의 포자 점은 마른 땅의 집들 위로만 떠 있다","fact":"병꼴균 — 균류 중 유일하게 편모(유영포자) · 물이 있어야 퍼진다","hook":"병 모양 집 = 병꼴균 · 꼬리 달린 포자 = 편모","say":"맨 왼쪽 개울 한가운데에는 병 모양 집이 있다. 병 모양을 병꼴균이라는 이름과 연결해 보자. 열린 문에서 꼬리를 흔드는 포자들이 헤엄쳐 나오고, 하나는 아직 문간에 걸쳐 있다. 균류 가운데 편모를 가진 것은 병꼴균뿐이다. 이 유영포자는 날지 않고 헤엄치므로 퍼지려면 물이 필요하다. 하늘의 포자 점이 마른 땅의 집 위에만 있고 물속 병 집 위에는 없는 이유다. 나머지 균류의 포자는 공기로 퍼진다.","box":[[30,120,500,600],[730,25,720,140]],"src":["s05p01#1","s05p01#5"],"cards":["M2-17","S-EV-7"]},{"sid":"s3","obj":"커다란 빵 덩이 위의 집 · 빵에서 뻗어 나온 곰팡이 실 두 가닥이 앞 풀밭에서 만나는 자리에 검고 오돌토돌한 공 하나 — 한 가닥 끝의 손이 그 공을 쥐었다","fact":"접합균 — 두 균사가 만나 붙은 자리에 저항성 접합포자낭 · 빵곰팡이","hook":"두 실이 만난 자리의 검은 오돌토돌 공 = 접합포자낭","say":"둘째 집은 거대한 빵 덩이 위에 있다. 빵에서 뻗어 나온 곰팡이 실 두 가닥이 앞쪽 풀밭에서 만나고, 만나는 자리에 검고 오돌토돌한 공 하나가 뭉쳐 있다. 한 가닥 끝의 손이 그 공을 꼭 쥐고 있다. 이 집은 접합균이며, 빵에 피는 검은빵곰팡이가 대표다. 두 균사가 붙는 자리에 생긴 검은 공은 접합포자낭이다. 두꺼운 껍질 덕분에 건조하거나 먹이가 부족해도 견디는 저항성 구조다.","box":[330,190,550,730],"src":["s05p01#2"],"cards":["M2-18#2","S-EV-6"]},{"sid":"s4","obj":"셋째 집 앞 거대한 가죽 글러브 — 길게 늘어난 손가락이 나무 밑 뿌리 덩이 속으로 파고든다 · 둥근 단면 창 안에서 손가락 끝마다 작은 나무처럼 갈라진다","fact":"글로메로균 — 수지상균근(AM): 균사가 뿌리 세포벽을 뚫고 갈라진다 · 식물 80 %","hook":"글러브 = 글로메로균 · 뿌리 속에서 나무처럼 갈라진 손가락 = 수지상체","say":"셋째 집 앞의 커다란 가죽 글러브를 보자. 글러브에서 글로메로균을 떠올린다. 길게 늘어난 손가락이 나무 밑 뿌리 덩이 속으로 들어간다. 뿌리 앞의 둥근 단면 창을 보면, 안으로 들어간 손가락 끝마다 작은 나무처럼 갈라져 있다. 균사가 뿌리 세포벽을 뚫고 들어가 가지를 치는 수지상체다. 그래서 수지상균근, AM 이라고 부른다. 육상 식물의 약 80 퍼센트가 이 균근을 맺는다. 겉에 얹힌 것이 아니라 안으로 들어간다는 점을 기억하자. 이 오래된 공생은 초기 육상 식물이 땅에 정착하는 데 도움을 주었다.","box":[840,430,400,530],"src":["s05p01#3"],"cards":["M2-19","S-EV-8","M2-7","M2-8","M2-8#1","O2-23","O2-23#1","M0-7"]},{"sid":"s5","obj":"글러브 엄지가 나무 밑동 쪽으로 내민 불 안 붙은 빨간 머리 성냥개비 · 나무 잎 아래에서 하나씩 떨어져 글러브 소매의 열린 구멍으로 들어가는 포도","fact":"균근 = 상리공생 — 균류는 무기물(인)을, 식물은 당을 준다","hook":"성냥개비 = 인 · 떨어지는 포도 = 당 — 맞바꿈","say":"글러브와 나무가 무엇을 주고받는지 보자. 글러브의 엄지는 불붙지 않은 빨간 머리 성냥개비를 나무 밑동 쪽으로 내민다. 성냥에 불을 붙이는 재료인 인을 연결한 단서다. 반대로 나무는 잎 아래로 포도를 떨어뜨리고, 포도는 글러브 소매의 열린 구멍으로 들어간다. 떨어져 구르는 포도는 이 덱에서 언제나 포도당, 즉 당이다. 균근은 균류와 식물 뿌리의 상리공생이다. 균류는 흙에서 얻은 물과 무기물, 특히 인을 식물에 주고, 식물은 광합성으로 만든 당을 균류에 준다.","box":[940,120,400,580],"src":["s05p01#3"],"cards":["M2-19","S-EV-8","M2-7","M2-8","M2-8#1","O2-23","O2-23#1","O2-22"]},{"sid":"s6","obj":"넷째 집 — 주둥이를 굵은 밧줄로 묶어 닫은 커다란 자루 모양 집(몸통은 겹비늘 · 묶인 주둥이만 천) · 둥근 창 안에 둥근 포자가 빽빽이 들었다","fact":"자낭균 — 자낭(주머니) 안에 자낭포자가 들어 있다","hook":"묶은 자루 집 · 창 안 포자 = 자낭 안의 자낭포자","say":"넷째 집은 커다란 자루 모양이다. 몸통은 다른 집처럼 겹비늘로 덮였지만, 맨 위 천 주둥이는 굵은 밧줄로 꽁꽁 묶어 닫았다. 둥근 창 안에는 둥근 포자가 빽빽하게 들어 있다. 자낭균이다. 자낭은 주머니라는 뜻이고, 자낭포자는 그 주머니 안에서 만들어진다. 포자가 안에 있다는 것을 먼저 기억하자. 곧 볼 담자균의 포자는 버섯 바깥에 매달린다. 한편 자낭균이 무성생식으로 퍼질 때 만드는 포자는 분생포자라고 따로 부른다.","box":[[1240,180,320,570]],"src":["s05p02#0"],"cards":["S-EV-5","M2-20","M2-20#1","X-EV-24","S-EV-6","M2-20#2"]},{"sid":"s7","obj":"자루 집 곁 회색 바위 위의 작은 겹비늘 오두막 · 지붕에 누워 햇볕을 쬐는 초록 피부 사람이 한 팔을 뻗어 지붕 뚜껑 구멍으로 포도를 떨군다","fact":"지의류 — 조류 · 남세균이 당(남세균은 질소도) · 균류(대개 자낭균)가 구조","hook":"오두막 = 균류(구조) · 지붕의 초록 사람 = 광합성 짝(당)","say":"자루 집 옆의 회색 바위에는 작은 겹비늘 오두막이 붙어 있다. 지붕에는 초록 피부의 사람이 햇볕을 쬐며 누워, 한 팔을 뻗어 지붕 뚜껑 구멍으로 포도를 하나씩 떨어뜨린다. 이것은 지의류다. 초록 사람은 광합성을 하는 녹조류나 남세균으로, 균류에 당을 공급한다. 남세균이라면 질소도 공급한다. 오두막인 균류는 전체 형태와 구조를 만들고 몸의 대부분을 차지한다. 지의류의 균류는 대개 자낭균이어서 오두막을 자루 집에 붙였다. 식물에 해를 끼치지 않고 잎 속에 사는 내생균도 대부분 자낭균이다. 지의류는 흙이 없는 맨 바위에서도 살며 바위를 부수고 흙을 만든다. 1차 천이의 개척자라는 점을 바위와 연결하자.","box":[1450,440,290,360],"src":["s05p02#1"],"cards":["S-EV-7","M2-24","S-EV-8","M2-25","M2-25#1","M2-25#2","M2-20#3","M2-26"]},{"sid":"s8","obj":"자루 집 아래 창에서 뻗은 겹비늘 팔이 물뿌리개로 호박빛 즙을 붓는다 → 낙엽이 가장자리부터 녹아 잎맥만 남고 웅덩이가 된다 → 웅덩이가 거꾸로 흘러 올라가 집 밑동에 줄지어 뚫린 검고 동그란 구멍 넷으로 빨려 들어간다","fact":"흡수영양 — 몸 밖으로 효소를 내보내 분해한 뒤 그 산물을 흡수한다","hook":"물뿌리개 즙 = 효소 · 녹는 낙엽 = 밖에서 분해 · 밑동 구멍으로 빨려 듦 = 흡수","say":"자루 집 아래 창에서 나온 겹비늘 팔이 물뿌리개로 호박빛 즙을 붓는다. 즙이 닿은 낙엽은 가장자리부터 녹아 잎맥만 남고 웅덩이가 된다. 녹아 나온 즙은 집 밑동에 줄지어 뚫린 검고 둥근 구멍들로 흡수된다. 균류의 흡수영양이다. 먼저 몸 밖으로 소화 효소를 내보내 먹이를 분해한 다음, 녹아 나온 작은 분자만 안으로 흡수한다. 흡수 방향은 언제나 밖에서 안이다. 무엇을 먹는지에 따라 죽은 유기물을 분해하는 분해자, 살아 있는 숙주에서 얻는 기생, 서로 주고받는 상리공생으로 나눈다. 셀룰로오스와 리그닌까지 분해하는 균류는 생태계의 핵심 분해자로, 탄소와 질소가 순환하도록 돕는다.","box":[[1220,565,300,375]],"src":["s05p02#3"],"cards":["M2-1","M2-2","M2-22"]},{"sid":"s9","obj":"다섯째 집 — 지붕이 흙빛 갈색 버섯 갓 하나(점 · 고리 없음) · 갓 아래 짧은 갈퀴마다 갈래 끝에 포자가 하나씩 밖으로 꽂혔다","fact":"담자균 — 담자기 끝에 담자포자가 밖으로 드러나 달린다 · 버섯","hook":"갓 아래 갈퀴 끝 포자 = 담자기 · 담자포자(밖)","say":"다섯째 집의 지붕은 커다란 갈색 버섯 갓이다. 점이나 고리가 없는 흙빛 갓 아래에 짧은 갈퀴들이 줄줄이 매달려 있고, 갈퀴의 갈래 끝마다 둥근 포자가 하나씩 붙어 있다. 담자균이다. 갈퀴는 담자기, 끝에 붙은 것은 담자포자다. 자낭포자는 주머니 안에 있었지만, 담자포자는 이렇게 바깥으로 드러나 있다. 우리가 먹는 버섯을 담자균과 연결해 기억하자.","box":[1570,110,440,320],"src":["s05p02#2"],"cards":["M2-21"]},{"sid":"s10","obj":"오른쪽 끝 소나무 — 드러난 뿌리마다 흰 털옷이 소매처럼 겉을 감쌌다(뿌리 끝만 갈색으로 삐죽) · 버섯 집 밑동에서 흰 털 실이 뻗어 와 이어진다 · 뿌리 세포 속으로는 들어가지 않는다","fact":"외생균근(ECM) — 자낭·담자균이 나무뿌리 겉과 세포 사이만 감싼다(세포 안 X)","hook":"뿌리 겉 흰 털 소매 = 외생균근","say":"맨 오른쪽 소나무의 드러난 뿌리를 보자. 흰 털옷이 소매처럼 뿌리 겉을 감싸고, 갈색 끝만 삐죽 나와 있다. 털옷은 버섯 집 밑동에서 뻗은 흰 실과 이어진다. 이 균사는 뿌리 겉을 감싸고 세포 사이로 들어갈 뿐, 세포 안으로는 들어가지 않는다. 외생균근, ECM 이다. 뿌리 속으로 파고든 글러브의 수지상균근과 비교하자. 외생균근을 이루는 균류는 자낭균과 담자균이고, 소나무 같은 나무와 공생한다. 버섯 집에서 실이 이어진 이유도 이것이다.","box":[1740,470,308,300],"src":["s05p01#3"],"cards":["M2-19","S-EV-8","M2-7","M2-8","M2-8#1","O2-23","O2-23#1"]},{"sid":"s11","obj":"울타리 밖 오른쪽 아래 구석의 판자벽 오두막 하나 · 울타리 안 다섯 집의 벽은 모두 가재 껍질 같은 주황 겹비늘","fact":"균류 세포벽 = 키틴(절지 외골격과 같은 재료) · 셀룰로오스 벽인 난균은 균류 아님","hook":"가재 껍질 겹비늘 = 키틴 · 판자벽 = 셀룰로오스(난균)","say":"마을 전체로 시선을 돌려 보자. 울타리 안 다섯 집의 주황색 겹비늘 벽은 가재 껍질을 닮았다. 절지 갑옷 가게의 껍질과 같은 키틴이다. 균류의 세포벽과 절지동물의 외골격은 같은 재료를 사용한다. 균류는 식물보다 동물에 더 가까우며, 깃편모충 및 동물과 함께 오피스토콘타로 묶인다. 울타리 밖 오른쪽 아래에는 판자벽 오두막이 있다. 나무 판자는 셀룰로오스이고, 이 오두막은 난균이다. 곰팡이처럼 보여도 세포벽이 셀룰로오스이며 균류가 아니므로 울타리 밖에 두었다. 세포벽 재료를 정리하면 식물은 셀룰로오스, 균류는 키틴, 세균은 펩티도글리칸이다. 고세균의 세포벽에는 펩티도글리칸이 없다.","box":[[1770,840,270,300],[500,190,290,300]],"src":["s05p01#4","s05p03#3","s05p03#4"],"cards":["M2-4","L0-3","L0-3#3","M2-16"]},{"sid":"s12","obj":"다섯 집의 표지 (되짚기) — 빵 앞 풀밭의 검은 공 · 묶은 자루 · 버섯 갓 아래 갈퀴 / 병 집의 꼬리 포자 · 뿌리로 파고든 글러브 · 지붕의 초록 사람","fact":"유성 구조: 접합포자낭 · 자낭 · 담자기 / 대표 특징: 편모포자 · AM · 지의류","hook":"검은 공 · 자루 · 갈퀴 / 꼬리 포자 · 글러브 · 초록 사람","say":"마지막으로 다섯 집의 표지를 두 묶음으로 되짚어 보자. 먼저 유성생식 구조다. 빵 앞 풀밭의 검은 공은 접합균의 접합포자낭, 묶은 자루는 자낭균의 자낭, 버섯 갓 아래 갈퀴는 담자균의 담자기다. 다음은 각 군의 대표 특징이다. 병꼴균의 꼬리 달린 편모포자, 글로메로균의 뿌리 속 수지상균근, 자낭균과 지붕의 초록 사람이 함께 이루는 지의류를 떠올리자. 이 여섯 표지로 다섯 문을 구분할 수 있다.","box":[[600,800,110,120],[1300,410,110,120],[1570,280,440,140],[180,430,220,240],[860,700,200,260],[1470,440,260,150]],"src":["s05p01#1","s05p02#1"],"cards":["M2-17","S-EV-7","M2-24","S-EV-8","M2-25","M2-25#1","M2-25#2","M2-20#3"]}],"cq":{"S-EV-5":["균류의 주요 5군(문)은?","병꼴균, 접합균, 글로메로균, 자낭균, 담자균"],"M2-17":["편모를 가진 균류는?","병꼴균(chytrid)"],"S-EV-7":["균류 군별 대표 특징(무성·생태) 격자는?","병꼴균=편모포자 / 글로메로균=AM균근 / 자낭균=지의류·내생균"],"M2-18#2":["접합균(Rhizopus)의 특징은?","저항성 접합포자낭(zygosporangium) 형성(빵곰팡이)"],"S-EV-6":["균류 3문의 유성 구조 격자는?","접합균=접합포자낭 / 자낭균=자낭 / 담자균=담자기"],"M2-19":["글로메로균(Glomeromycota)의 특징은?","수지상균근(AM)을 만들어 대부분 식물 뿌리와 공생"],"S-EV-8":["균류의 두 상리공생과 각 파트너의 몫은?","균근=뿌리(균:인↔식물:당) / 지의류=조류·남세균(균:구조)"],"M2-7":["균근(mycorrhizae)이란?","균류와 식물 뿌리의 상리공생(균류는 무기물[인], 식물은 당 제공)"],"M2-8":["수지상균근(AM)과 외생균근(ECM)의 차이는?","AM(글로메로균)=균사가 뿌리 세포벽 뚫고 수지상체 형성, 식물 80% · ECM(자낭·담자균)=뿌리 표면·세포 사이 감쌈(세포 내 침투 없음), 나무"],"M2-8#1":["수지상균근(AM)과 외생균근(ECM)의 차이는?","AM(글로메로균)=균사가 뿌리 세포벽 뚫고 수지상체 형성, 식물 80%"],"O2-23":["수지상균근(AM)과 외생균근(ECM)의 균류·분포는?","AM=글로메로균, 수지상체, 육상식물 80% · ECM=자낭·담자균, 나무"],"O2-23#1":["수지상균근(AM)과 외생균근(ECM)의 균류·분포 — 「AM」? (↔ ECM)","글로메로균, 수지상체, 육상식물 80%"],"M0-7":["균근(mycorrhizae)의 역할은?","균류와의 공생 · 균사가 무기물을 식물에 공급(초기 식물 육상 정착 도움)"],"O2-22":["균근(mycorrhizae)에서 균류와 식물의 교환은?","균류가 무기물(특히 인)·물 · 식물이 당"],"M2-20":["자낭균(Ascomycota)의 특징은?","자낭(ascus) 안에 자낭포자 · 무성포자=분생포자 · 대부분 지의류의 균류"],"M2-20#1":["자낭균(Ascomycota)의 특징은?","자낭(ascus) 안에 자낭포자"],"X-EV-24":["자낭포자를 만드는 문 vs 담자포자를 만드는 문은?","자낭균(자낭 안) / 담자균(담자기, 버섯 자실체)"],"M2-20#2":["자낭균(Ascomycota)의 특징은?","무성포자=분생포자"],"M2-24":["지의류(lichen)의 구성은?","광합성 미생물(녹조 또는 남세균) + 균류(주로 자낭균)의 공생체"],"M2-25":["지의류에서 각 파트너의 역할은?","균류=전체 형태·구조(질량 대부분) · 조류=탄소(당) · 남세균=질소도"],"M2-25#1":["지의류에서 각 파트너의 역할 — 「균류」? (↔ 조류)","전체 형태·구조(질량 대부분)"],"M2-25#2":["지의류에서 각 파트너의 역할 — 「조류」? (↔ 균류)","탄소(당), 남세균=질소도"],"M2-20#3":["자낭균(Ascomycota)의 특징은?","대부분 지의류의 균류"],"M2-26":["지의류의 생태적 역할은?","1차 천이의 개척자(맨 땅에서 토양 형성)"],"M2-1":["균류의 영양 방식은?","흡수영양(absorptive)"],"M2-2":["균류의 영양 방식 3분류는?","분해자(죽은 유기물) · 기생(살아있는 숙주, 일부 병원성) · 상리공생"],"M2-22":["균류의 생태적 핵심 역할은?","분해자(셀룰로오스·리그닌까지 분해, 탄소·질소 재순환)"],"M2-21":["담자균(Basidiomycota)의 특징은?","담자기(basidium)에 담자포자 · 2핵균사가 자실체(버섯) 형성"],"M2-4":["균류 세포벽의 성분은?","키틴(chitin)"],"L0-3":["세균·고세균·진핵의 세포벽 성분 차이는?","세균=펩티도글리칸 · 고세균=펩티도글리칸 없음(다당류·단백질) · 진핵(식물·균류)=셀룰로오스·키틴"],"L0-3#3":["세균·고세균·진핵의 세포벽 성분 차이는?","진핵(식물·균류)=셀룰로오스·키틴"],"M2-16":["균류가 식물보다 가까운 생물과 소속 그룹은?","동물; 둘 다 오피스토콘타(opisthokont)"]},"hubPanel":"s05p01"};

const ttsNorm = t => TTSNorm.ttsNorm(t, TTS_LEX, TTS_ORDER, L.id);
let speakSeq = 0;

function speak(t, sid) {
  const my = ++speakSeq, at = i;

function go(k) {

// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {

function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
