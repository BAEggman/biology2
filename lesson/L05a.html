<style>

<script>
const L = {"id":"L05a","scene":"s05","part":"a","title":"개울에서 언덕까지 다섯 집 — 갑각 벽의 곰팡이 마을: 균류 5문 · 균근 · 지의류 · 흡수영양 · 키틴","sub":"개울 속 병 집과 헤엄치는 꼬리 포자(병꼴균 · 편모) · 빵에서 뻗은 두 실이 만난 검은 공(접합균 · 접합포자낭) · 뿌리 속에서 갈라진 글러브 손가락(글로메로균 · AM) · 성냥개비 ↔ 떨어지는 포도(균근: 인 ↔ 당) · 묶은 자루 집(자낭균 · 자낭) · 바위 위 오두막 지붕의 초록 사람(지의류) · 물뿌리개 즙과 젖는 밑단(흡수영양) · 버섯 갓 아래 갈퀴 끝 포자(담자균 · 담자기) · 소나무 뿌리의 흰 털 소매(외생균근) · 갑각 벽 vs 울타리 밖 판자 오두막(키틴 · 난균)","img":"img/L05a.webp","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"개울에서 마른 언덕까지 낮은 울타리 안에 다섯 집이 한 줄로 섰다(울타리는 개울 속 병 집 앞까지 물에 박혀 이어진다) — 벽은 모두 가재 껍질 같은 주황 겹비늘 (틀)","fact":"균류의 주요 5문 — 병꼴균 · 접합균 · 글로메로균 · 자낭균 · 담자균","hook":"울타리 안 다섯 집 = 균류 5문","say":"개울가에서 마른 언덕까지, 낮은 나무 울타리 안에 집 다섯 채가 한 줄로 섰다. 울타리는 개울 속 병 집 앞까지 물에 기둥을 박고 이어져 그 집도 품는다. 벽은 모두 가재 껍질 같은 주황 겹비늘이다. 이 마을이 균류이고, 다섯 집이 균류의 주요 다섯 문이다. 왼쪽 개울 속부터 병꼴균, 빵 위의 접합균, 글러브의 글로메로균, 묶은 자루의 자낭균, 버섯 지붕의 담자균. 왼쪽에서 오른쪽으로 갈수록 물에서 멀어진다.","box":null,"src":["s05p01#0"],"cards":["S-EV-5"]},{"sid":"s2","obj":"개울 한가운데 물속에 선 병 모양 집 · 열린 문에서 꼬리를 흔들며 헤엄쳐 나오는 포자 · 하늘의 포자 점은 마른 땅의 집들 위로만 떠 있다","fact":"병꼴균 — 균류 중 유일하게 편모(유영포자) · 물이 있어야 퍼진다","hook":"병 모양 집 = 병꼴균 · 꼬리 달린 포자 = 편모","say":"맨 왼쪽, 개울 한가운데 물속에 병 모양 집이 섰다. 병 모양이니 병꼴균이다. 열린 문에서 꼬리를 흔드는 포자들이 헤엄쳐 나온다. 하나는 아직 문간에 걸쳐 있다. 균류 가운데 편모가 있는 것은 병꼴균뿐이다. 이 유영포자는 헤엄쳐 가지 날아가지 않으니 물이 있어야 퍼진다. 그래서 하늘을 보면 포자 점은 마른 땅의 집들 위로만 떠 있고, 물속 병 집 위에는 하나도 없다. 나머지 균류의 포자는 공기로 퍼진다.","box":[[30,120,500,600],[730,25,720,140]],"src":["s05p01#1","s05p01#5"],"cards":["M2-17","S-EV-7"]},{"sid":"s3","obj":"커다란 빵 덩이 위의 집 · 빵에서 뻗어 나온 곰팡이 실 두 가닥이 앞 풀밭에서 만나는 자리에 검고 오돌토돌한 공 하나 — 한 가닥 끝의 손이 그 공을 쥐었다","fact":"접합균 — 두 균사가 만나 붙은 자리에 저항성 접합포자낭 · 빵곰팡이","hook":"두 실이 만난 자리의 검은 오돌토돌 공 = 접합포자낭","say":"둘째 집은 거대한 빵 덩이 위에 올라앉았다. 빵에서 곰팡이 실 두 가닥이 뻗어 나와 앞쪽 풀밭에서 만난다. 두 가닥이 만나는 자리에 검고 오돌토돌한 공이 하나 뭉쳤고, 한 가닥 끝의 손이 그 공을 꼭 쥐었다. 접합균이다. 빵에 피는 검은빵곰팡이가 대표다. 두 균사가 만나 붙은 자리에 생긴 이 검은 공이 접합포자낭이다. 껍질이 두꺼워 마르고 굶어도 버티는 저항성 구조다.","box":[330,190,550,730],"src":["s05p01#2"],"cards":["M2-18#2","S-EV-6"]},{"sid":"s4","obj":"셋째 집 앞 거대한 가죽 글러브 — 길게 늘어난 손가락이 나무 밑 뿌리 덩이 속으로 파고든다 · 둥근 단면 창 안에서 손가락 끝마다 작은 나무처럼 갈라진다","fact":"글로메로균 — 수지상균근(AM): 균사가 뿌리 세포벽을 뚫고 갈라진다 · 식물 80 %","hook":"글러브 = 글로메로균 · 뿌리 속에서 나무처럼 갈라진 손가락 = 수지상체","say":"셋째 집 앞에는 거대한 가죽 글러브가 놓였다. 글러브, 글로메로균이다. 손가락이 길게 늘어나 나무 밑 뿌리 덩이 속으로 파고든다. 뿌리 덩이 앞의 둥근 단면 창을 들여다보자. 뿌리 안으로 들어간 손가락 끝마다 작은 나무처럼 가지를 친다. 균사가 뿌리 세포벽을 뚫고 들어가 나뭇가지 모양으로 갈라진 것, 수지상체다. 그래서 수지상균근, AM 이라 부른다. 육상 식물의 약 80 퍼센트가 이 균근을 맺는다. 겉에 얹힌 것이 아니라 속으로 파고들었다는 것이 핵심이다.","box":[840,430,400,530],"src":["s05p01#3"],"cards":["M2-19","S-EV-8","M2-7","M2-8","M2-8#1","O2-23","O2-23#1"]},{"sid":"s5","obj":"글러브 엄지가 나무 밑동 쪽으로 내민 불 안 붙은 빨간 머리 성냥개비 · 나무 잎 아래에서 하나씩 떨어져 글러브 소매의 열린 구멍으로 들어가는 포도","fact":"균근 = 상리공생 — 균류는 무기물(인)을, 식물은 당을 준다","hook":"성냥개비 = 인 · 떨어지는 포도 = 당 — 맞바꿈","say":"글러브와 나무는 서로 주고받는다. 글러브 엄지는 불 안 붙은 빨간 머리 성냥개비를 나무 밑동 쪽으로 내민다. 성냥에 불을 붙이는 재료가 인이다. 성냥, 인이다. 나무는 잎 아래에서 포도를 하나씩 떨어뜨리고, 포도는 글러브 소매의 열린 구멍으로 쏙쏙 들어간다. 떨어져 구르는 포도는 언제나 포도당, 당이다. 균근은 균류와 식물 뿌리의 상리공생이다. 균류는 흙에서 모은 무기물, 특히 인을 식물에 주고, 식물은 광합성으로 만든 당을 균류에 준다.","box":[940,120,400,580],"src":["s05p01#3"],"cards":["M2-19","S-EV-8","M2-7","M2-8","M2-8#1","O2-23","O2-23#1"]},{"sid":"s6","obj":"넷째 집 — 주둥이를 굵은 밧줄로 묶어 닫은 커다란 자루 모양 집(몸통은 겹비늘 · 묶인 주둥이만 천) · 둥근 창 안에 둥근 포자가 빽빽이 들었다","fact":"자낭균 — 자낭(주머니) 안에 자낭포자가 들어 있다","hook":"묶은 자루 집 · 창 안 포자 = 자낭 안의 자낭포자","say":"넷째 집은 커다란 자루 모양이다. 몸통은 다른 집과 같은 겹비늘이고, 맨 위 천 주둥이를 굵은 밧줄로 꽁꽁 묶어 닫았다. 둥근 창으로 들여다보면 둥근 포자가 안에 빽빽이 들었다. 자낭균이다. 자낭은 주머니라는 뜻이고, 자낭포자는 그 주머니 안에서 만들어져 안에 들어 있다. 안에 든 포자, 이것을 기억해 두자. 곧 볼 버섯의 포자는 밖에 매달린다. 자낭균이 무성생식으로 퍼질 때 내는 포자는 따로 분생포자라 부른다.","box":[[1240,180,320,570]],"src":["s05p02#0"],"cards":["S-EV-5","M2-20","M2-20#1","X-EV-24","S-EV-6","M2-20#2"]},{"sid":"s7","obj":"자루 집 곁 회색 바위 위의 작은 겹비늘 오두막 · 지붕에 누워 햇볕을 쬐는 초록 피부 사람이 한 팔을 뻗어 지붕 뚜껑 구멍으로 포도를 떨군다","fact":"지의류 — 조류 · 남세균이 당(남세균은 질소도) · 균류(대개 자낭균)가 구조","hook":"오두막 = 균류(구조) · 지붕의 초록 사람 = 광합성 짝(당)","say":"자루 집 곁, 회색 바위 위에 작은 겹비늘 오두막을 덧대 지었다. 지붕에는 초록 피부의 사람이 햇볕을 받으며 드러누웠다. 그는 한 팔을 뻗어 지붕 뚜껑 구멍으로 포도를 하나씩 떨어뜨린다. 지의류다. 초록 사람은 광합성을 하는 녹조류나 남세균으로, 당을 대 준다. 남세균이면 질소까지 대 준다. 오두막, 곧 균류는 집이다. 전체의 형태와 구조를 대고 덩치의 대부분을 차지한다. 그 균류는 대개 자낭균이라 이 오두막도 자루 집에 붙어 있다. 식물에 해를 끼치지 않고 잎 속에 들어가 사는 내생균도 대부분 자낭균이다.","box":[1450,440,290,360],"src":["s05p02#1"],"cards":["S-EV-7","M2-24","S-EV-8","M2-25","M2-25#1","M2-25#2","M2-20#3"]},{"sid":"s8","obj":"자루 집 아래 창에서 뻗은 겹비늘 팔이 물뿌리개로 호박빛 즙을 붓는다 → 낙엽이 가장자리부터 녹아 잎맥만 남고 웅덩이가 된다 → 웅덩이가 거꾸로 흘러 올라가 집 밑동에 줄지어 뚫린 검고 동그란 구멍 넷으로 빨려 들어간다","fact":"흡수영양 — 몸 밖으로 효소를 내보내 분해한 뒤 그 산물을 흡수한다","hook":"물뿌리개 즙 = 효소 · 녹는 낙엽 = 밖에서 분해 · 밑동 구멍으로 빨려 듦 = 흡수","say":"자루 집 아래 창에서 겹비늘 팔이 뻗어 나와 물뿌리개로 호박빛 즙을 붓는다. 즙을 맞은 낙엽이 가장자리부터 녹아 잎맥만 남고 웅덩이가 된다. 웅덩이는 거꾸로 흘러 올라가 자루 집 밑동에 줄지어 뚫린 검고 동그란 구멍들로 빨려 들어간다. 균류가 먹는 방식, 흡수영양이다. 먼저 몸 밖으로 소화 효소를 내보내 바깥에서 먹이를 분해하고, 녹아 나온 작은 분자만 몸 안으로 흡수한다. 방향은 언제나 밖에서 안이다.","box":[[1220,565,300,375]],"src":["s05p02#3"],"cards":["M2-1"]},{"sid":"s9","obj":"다섯째 집 — 지붕이 흙빛 갈색 버섯 갓 하나(점 · 고리 없음) · 갓 아래 짧은 갈퀴마다 갈래 끝에 포자가 하나씩 밖으로 꽂혔다","fact":"담자균 — 담자기 끝에 담자포자가 밖으로 드러나 달린다 · 버섯","hook":"갓 아래 갈퀴 끝 포자 = 담자기 · 담자포자(밖)","say":"다섯째 집은 지붕이 커다란 갈색 버섯 갓이다. 점도 고리도 없는 흙빛 갓이다. 갓 아래에 짧은 갈퀴가 줄줄이 매달렸고, 갈퀴의 갈래 끝마다 동그란 포자가 하나씩 꽂혀 있다. 담자균이다. 갈퀴가 담자기, 그 끝에 달린 것이 담자포자다. 자낭의 포자는 주머니 안에 들었지만, 담자포자는 이렇게 밖으로 드러나 달린다. 우리가 먹는 버섯이 담자균이다.","box":[1570,110,440,320],"src":["s05p02#2"],"cards":["M2-21"]},{"sid":"s10","obj":"오른쪽 끝 소나무 — 드러난 뿌리마다 흰 털옷이 소매처럼 겉을 감쌌다(뿌리 끝만 갈색으로 삐죽) · 버섯 집 밑동에서 흰 털 실이 뻗어 와 이어진다 · 뿌리 세포 속으로는 들어가지 않는다","fact":"외생균근(ECM) — 자낭·담자균이 나무뿌리 겉과 세포 사이만 감싼다(세포 안 X)","hook":"뿌리 겉 흰 털 소매 = 외생균근","say":"맨 오른쪽 소나무의 드러난 뿌리를 보자. 뿌리마다 흰 털옷이 소매처럼 겉을 감쌌고, 끝만 갈색으로 삐죽 나왔다. 그 털옷은 버섯 집 밑동에서 뻗어 온 흰 실과 이어진다. 그런데 뿌리 세포 속으로는 들어가지 않는다. 외생균근, ECM 이다. 뿌리 겉을 싸고 세포 사이로만 파고들 뿐 세포 안으로는 들어가지 않는다. 글러브가 속으로 파고든 것과 정반대다. 외생균근을 맺는 것은 자낭균과 담자균이고, 짝은 소나무 같은 나무다. 버섯 집에서 실이 뻗어 온 것도 그래서다.","box":[1740,470,308,300],"src":["s05p01#3"],"cards":["M2-19","S-EV-8","M2-7","M2-8","M2-8#1","O2-23","O2-23#1"]},{"sid":"s11","obj":"울타리 밖 오른쪽 아래 구석의 판자벽 오두막 하나 · 울타리 안 다섯 집의 벽은 모두 가재 껍질 같은 주황 겹비늘","fact":"균류 세포벽 = 키틴(절지 외골격과 같은 재료) · 셀룰로오스 벽인 난균은 균류 아님","hook":"가재 껍질 겹비늘 = 키틴 · 판자벽 = 셀룰로오스(난균)","say":"다시 마을 전체를 보자. 울타리 안 다섯 집의 벽은 하나같이 가재 껍질 같은 주황 겹비늘이다. 절지 갑옷 가게에서 본 그 껍질, 키틴이다. 균류의 세포벽은 키틴이고, 절지동물의 외골격과 재료가 같다. 그런데 울타리 밖 오른쪽 아래 구석에 판자벽 오두막이 하나 있다. 나무 판자, 셀룰로오스다. 난균이다. 곰팡이처럼 생겼어도 세포벽이 셀룰로오스라 균류가 아니어서 울타리 밖에 산다. 진핵생물의 세포벽은 식물이 셀룰로오스, 균류가 키틴이다. 세균의 세포벽은 펩티도글리칸이고, 고세균의 벽에는 펩티도글리칸이 없다.","box":[[1770,840,270,300],[500,190,290,300]],"src":["s05p01#4","s05p03#3","s05p03#4"],"cards":["M2-4","L0-3","L0-3#3"]},{"sid":"s12","obj":"다섯 집의 표지 (되짚기) — 빵 앞 풀밭의 검은 공 · 묶은 자루 · 버섯 갓 아래 갈퀴 / 병 집의 꼬리 포자 · 뿌리로 파고든 글러브 · 지붕의 초록 사람","fact":"유성 구조: 접합포자낭 · 자낭 · 담자기 / 대표 특징: 편모포자 · AM · 지의류","hook":"검은 공 · 자루 · 갈퀴 / 꼬리 포자 · 글러브 · 초록 사람","say":"마지막으로 다섯 집의 표지를 두 줄로 묶자. 첫 줄은 유성생식 구조다. 빵 앞 풀밭의 검은 공이 접합균의 접합포자낭, 묶은 자루가 자낭균의 자낭, 버섯 갓 아래 갈퀴가 담자균의 담자기. 둘째 줄은 군마다의 대표 특징이다. 병꼴균은 꼬리 달린 편모포자, 글로메로균은 뿌리 속으로 파고든 수지상균근, 자낭균은 지붕의 초록 사람과 함께 사는 지의류. 이 여섯 표지만 떠올리면 다섯 문이 갈린다.","box":[[600,800,110,120],[1300,410,110,120],[1570,280,440,140],[180,430,220,240],[860,700,200,260],[1470,440,260,150]],"src":["s05p01#1","s05p02#1"],"cards":["M2-17","S-EV-7","M2-24","S-EV-8","M2-25","M2-25#1","M2-25#2","M2-20#3"]}],"cq":{"S-EV-5":["균류의 주요 5군(문)은?","병꼴균, 접합균, 글로메로균, 자낭균, 담자균"],"M2-17":["편모를 가진 균류는?","병꼴균(chytrid)"],"S-EV-7":["균류 군별 대표 특징(무성·생태) 격자는?","병꼴균=편모포자 / 글로메로균=AM균근 / 자낭균=지의류·내생균"],"M2-18#2":["접합균(Rhizopus)의 특징은?","저항성 접합포자낭(zygosporangium) 형성(빵곰팡이)"],"S-EV-6":["균류 3문의 유성 구조 격자는?","접합균=접합포자낭 / 자낭균=자낭 / 담자균=담자기"],"M2-19":["글로메로균(Glomeromycota)의 특징은?","수지상균근(AM)을 만들어 대부분 식물 뿌리와 공생"],"S-EV-8":["균류의 두 상리공생과 각 파트너의 몫은?","균근=뿌리(균:인↔식물:당) / 지의류=조류·남세균(균:구조)"],"M2-7":["균근(mycorrhizae)이란?","균류와 식물 뿌리의 상리공생(균류는 무기물[인], 식물은 당 제공)"],"M2-8":["수지상균근(AM)과 외생균근(ECM)의 차이는?","AM(글로메로균)=균사가 뿌리 세포벽 뚫고 수지상체 형성, 식물 80% · ECM(자낭·담자균)=뿌리 표면·세포 사이 감쌈(세포 내 침투 없음), 나무"],"M2-8#1":["수지상균근(AM)과 외생균근(ECM)의 차이는?","AM(글로메로균)=균사가 뿌리 세포벽 뚫고 수지상체 형성, 식물 80%"],"O2-23":["수지상균근(AM)과 외생균근(ECM)의 균류·분포는?","AM=글로메로균, 수지상체, 육상식물 80% · ECM=자낭·담자균, 나무"],"O2-23#1":["수지상균근(AM)과 외생균근(ECM)의 균류·분포 — 「AM」? (↔ ECM)","글로메로균, 수지상체, 육상식물 80%"],"M2-20":["자낭균(Ascomycota)의 특징은?","자낭(ascus) 안에 자낭포자 · 무성포자=분생포자 · 대부분 지의류의 균류"],"M2-20#1":["자낭균(Ascomycota)의 특징은?","자낭(ascus) 안에 자낭포자"],"X-EV-24":["자낭포자를 만드는 문 vs 담자포자를 만드는 문은?","자낭균(자낭 안) / 담자균(담자기, 버섯 자실체)"],"M2-20#2":["자낭균(Ascomycota)의 특징은?","무성포자=분생포자"],"M2-24":["지의류(lichen)의 구성은?","광합성 미생물(녹조 또는 남세균) + 균류(주로 자낭균)의 공생체"],"M2-25":["지의류에서 각 파트너의 역할은?","균류=전체 형태·구조(질량 대부분) · 조류=탄소(당) · 남세균=질소도"],"M2-25#1":["지의류에서 각 파트너의 역할 — 「균류」? (↔ 조류)","전체 형태·구조(질량 대부분)"],"M2-25#2":["지의류에서 각 파트너의 역할 — 「조류」? (↔ 균류)","탄소(당), 남세균=질소도"],"M2-20#3":["자낭균(Ascomycota)의 특징은?","대부분 지의류의 균류"],"M2-1":["균류의 영양 방식은?","흡수영양(absorptive)"],"M2-21":["담자균(Basidiomycota)의 특징은?","담자기(basidium)에 담자포자 · 2핵균사가 자실체(버섯) 형성"],"M2-4":["균류 세포벽의 성분은?","키틴(chitin)"],"L0-3":["세균·고세균·진핵의 세포벽 성분 차이는?","세균=펩티도글리칸 · 고세균=펩티도글리칸 없음(다당류·단백질) · 진핵(식물·균류)=셀룰로오스·키틴"],"L0-3#3":["세균·고세균·진핵의 세포벽 성분 차이는?","진핵(식물·균류)=셀룰로오스·키틴"]},"hubPanel":"s05p01"};

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]

    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');

}

// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
function speak(t) {
  t = ttsNorm(t);
  const my = ++speakSeq, at = i;
  const advance = (ms) => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, ms);
  if (!('speechSynthesis' in window)) { if (playing) advance(3500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = () => { if (started) advance(700); };
  u.onerror = () => { if (!started) advance(3000); };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started && my === speakSeq) { speechSynthesis.cancel(); advance(3000); } }, 2500);  // 목소리가 없으면 글만 3초
}
function go(k) {
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) setTimeout(() => { if (playing) next(); }, 3500);
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; speechSynthesis && speechSynthesis.cancel(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i + 1); else speechSynthesis && speechSynthesis.cancel(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) speechSynthesis && speechSynthesis.cancel(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
</script>
