<script>
const L = {"id":"L10c","scene":"s10","part":"c","title":"조차장의 오타 열차 — 점 돌연변이 다섯 · 돌연변이원","sub":"나란한 선로 여섯: 맨 위 원본 열차 + 빨간 동그라미 하나씩인 오타 열차 다섯(침묵 · 과오 · 정지 · 삽입 · 결실) · 빨간 매직펜 교정원 · 파란 붓 칠장이(치환) · 어깨 으쓱하는 무언극 배우(침묵) · 검은 구슬 쥔 길쭉하게 휜 빨간 몸(겸상적혈구 = 과오) · 구슬 대신 나무판과 빈 지붕(정지) · 삽 일꾼과 창을 빼 가는 원숭이(삽입 · 결실 → 틀이동) · 가로누운 나무 사다리(DNA)의 자는 수리공 · 해의 그을음과 뼈 비치는 기계의 푸른 빛줄기(UV · X선) · 약병 기울이는 검은 게(발암물질) · 물총 겨눈 과학자와 둥근 배지 둘(에임스)","img":"img/L10c.webp?v=7f68a88e48be","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"조차장 — 나란한 선로 여섯에 창 셋 달린 객차의 열차가 한 줄씩 · 열차마다 위에 구슬 줄 · 맨 위 열차에는 빨간 동그라미가 없고 아래 다섯 열차에는 빨간 동그라미가 하나씩(넷은 창 하나를 둘렀고, 여섯째 열차의 것은 객차 사이 이음매에 세로로 길다) · 왼쪽 위에 사람 키만 한 빨간 매직펜을 세워 든 둥근 안경 · 초록 조끼의 곱슬머리 교정원 (틀)","fact":"점 돌연변이 = 염기쌍 하나 수준의 변화 · 다섯 가지 = 침묵 · 과오 · 정지 · 삽입 · 결실","hook":"빨간 펜 동그라미 = 오타 자리 · 동그라미 다섯 = 다섯 가지 · 맨 위 = 원본","say":"L10b에서 보았던 객차들이 조차장에 들어왔다. 객차 하나는 코돈, 창 셋은 염기 셋이며, 객차 위 구슬 줄은 그 열차가 만드는 아미노산 사슬이다. 나무판은 종결을 뜻한다. 선로 여섯 중 맨 위가 원본이고, 아래 다섯 열차에는 빨간 동그라미가 하나씩 있다. 왼쪽 교정원이 사람 키만 한 빨간 펜으로 오타를 표시한 것이다. 동그라미마다 창 하나, 즉 염기 하나만 바뀌었다. 염기쌍 하나 수준의 작은 변화를 통틀어 점 돌연변이라고 한다. 위에서부터 침묵·과오·정지·삽입·결실의 다섯 가지를 살펴보자.","cards":["F0-147","F0-165"],"box":[[254,404,776,696],[60,340,164,252]]},{"sid":"s2","obj":"위쪽 받침대 둘에 가로누운 긴 나무 사다리(칸이 초록 · 빨강으로 칠해졌고 한 칸만 보라) · 그 밑 왼쪽 받침대 다리에 기대 비스듬히 누워 눈 감고 입 벌려 자는 멜빵바지 수리공 · 곁에 닫힌 빨간 연장통과 바닥의 망치","fact":"DNA 손상이 수선되지 않은 채 다음 세대로 전해지면 돌연변이가 된다","hook":"자는 수리공 + 닫힌 연장통 = 수선 안 됨 · 나무 사다리 = DNA","say":"조차장 위 받침대에는 긴 나무 사다리가 가로놓여 있다. L38a에서 본 DNA 사다리다. 초록 칸은 A-T, 빨간 칸은 G-C이며, 아래 열차는 이 원본을 보고 만들어진다. 그런데 사다리에는 녹아 붙은 칸, 보라색으로 변한 칸, 부러진 끝이 있다. 수리공은 받침대에 기대어 자고, 연장통은 닫혀 있으며 망치도 바닥에 놓여 있다. L11c의 수리공들이 일을 하지 않은 모습이다. DNA 손상이 수선되지 않은 채 복제되어 다음 세대로 전해지면 돌연변이가 된다. 아래의 오타 열차가 그 결과다.","cards":["E1-87"],"box":[[330,132,1076,100],[540,216,276,190]]},{"sid":"s3","obj":"왼쪽 — 파란 페인트가 묻은 넓적한 붓을 든 멜빵바지 칠장이와 발치의 페인트 통 · 둘째 · 셋째 · 넷째 열차는 객차 수가 맨 위 열차와 같고(여섯 대), 동그라미 친 창이 셋 다 파랑이다","fact":"치환 = 염기 하나가 다른 염기로 바뀌는 돌연변이(길이는 그대로)","hook":"덧칠 = 치환 · 창의 수는 그대로, 빛깔 하나만","say":"왼쪽 칠장이는 파란 페인트가 묻은 붓을 들고 있다. 둘째·셋째·넷째 열차에서 동그라미로 표시한 창이 모두 파랑이다. 창 하나를 파랑으로 덧칠했지만 창의 수와 객차 여섯 대, 열차 길이는 그대로다. 염기 하나가 다른 염기로 바뀌는 치환 돌연변이다. 결과에 따라 사슬이 그대로인 침묵, 구슬 하나가 달라지는 과오, 사슬이 일찍 끊기는 정지로 구분한다. 다음 세 열차를 이 차이로 읽어 보자.","cards":["F0-148"],"box":[[22,586,210,222],[254,520,776,352]]},{"sid":"s4","obj":"둘째 열차 — 넷째 객차의 셋째 창에 빨간 동그라미(파랑 · 맨 위 열차의 같은 자리는 노랑) · 위의 구슬 줄은 맨 위 열차와 똑같다(금 · 주황 · 분홍 · 청록 · 보라 구슬과 끝의 작은 나무판) · 열차들 오른쪽(첫째 ~ 셋째 열차 높이)에 두 손바닥을 펴 어깨를 으쓱하는 줄무늬 옷의 무언극 배우","fact":"침묵 돌연변이 = 코돈은 바뀌어도 아미노산은 그대로 — 유전암호의 중복성 덕 · 해롭지 않다","hook":"말 없는 무언극 배우 = 침묵 · 창은 바뀌었는데 구슬은 그대로","say":"둘째 열차의 넷째 객차를 보자. 셋째 창은 노랑에서 파랑으로 바뀌었지만 구슬 줄은 원본과 같다. 해당 객차 위의 청록 구슬도 그대로이고, 오른쪽 무언극 배우는 말없이 어깨를 으쓱한다. 변화가 드러나지 않는 침묵 돌연변이다. 코돈은 달라져도 지정하는 아미노산은 같다. 여러 코돈이 같은 아미노산을 지정하는 유전암호의 중복성 때문이며, 특히 셋째 자리가 바뀌어도 같은 아미노산을 지정하는 경우가 많다. 따라서 침묵 돌연변이는 표현형에 미치는 영향이 거의 없으며, 돌연변이가 언제나 해로운 것은 아니다.","cards":["F0-149","F0-155","E1-88"],"box":[[254,520,776,128],[1050,376,208,284]]},{"sid":"s5","obj":"셋째 열차 — 둘째 객차의 가운데 창에 빨간 동그라미(파랑 · 맨 위 열차의 같은 자리는 초록) · 위의 구슬 줄에서 둘째 구슬만 검정(맨 위 열차는 주황)이고 나머지는 맨 위와 같다","fact":"과오 돌연변이 = 코돈이 다른 아미노산을 지정 — 영향은 바뀐 아미노산의 성질과 자리에 달림","hook":"구슬 하나만 딴 빛 = 과오(잘못 끼운 구슬)","say":"셋째 열차의 둘째 객차에서는 가운데 창이 초록에서 파랑으로 바뀌었다. 이번에는 둘째 구슬도 주황에서 검정으로 달라지고, 나머지 구슬은 그대로다. 코돈이 다른 아미노산을 지정하게 된 과오 돌연변이다. 영향은 바뀐 아미노산의 성질과 위치에 따라 달라진다. 성질이 비슷하거나 단백질에서 덜 중요한 자리라면 영향이 작지만, 성질이 크게 다르거나 중요한 자리라면 기능이 크게 손상된다.","cards":["F0-150","F0-156"],"box":[[254,632,776,128]]},{"sid":"s6","obj":"셋째 · 넷째 열차 오른쪽 — 바나나처럼 길쭉하게 휜 빨간 몸(찡그린 얼굴 · 가는 팔다리) · 한 손 끝에 검은 구슬 하나","fact":"겸상적혈구 빈혈증 = 과오 돌연변이의 예(글루탐산 → 발린)","hook":"길쭉하게 휜 빨간 몸 = 낫 모양 적혈구 · 손의 검은 구슬 = 잘못 끼운 그 구슬","say":"과오 열차 오른쪽에 얼굴이 있는 붉은 적혈구를 보자. L46c의 붉은 원반과 달리 바나나처럼 길쭉하게 휘어 얼굴을 찡그리고 있다. 낫 모양의 겸상적혈구다. 손에 든 검은 구슬은 과오 열차에서 달라진 구슬과 같다. 겸상적혈구 빈혈증은 과오 돌연변이의 대표 사례다. 헤모글로빈 유전자의 염기 하나가 바뀌어 여섯째 아미노산인 글루탐산이 발린으로 바뀐다. 구슬 하나의 변화가 적혈구 모양까지 바꾸는 것이다.","cards":["F0-158"],"box":[[1044,660,268,204]]},{"sid":"s7","obj":"넷째 열차 — 셋째 객차의 첫 창에 빨간 동그라미(파랑 · 맨 위 열차의 같은 자리는 노랑 — 이 객차의 창이 맨 끝 객차와 같은 파랑 · 초록 · 초록이 됐다) · 위의 구슬 줄은 금 · 주황 구슬 둘 다음에 작은 나무판에서 끝나고 그 뒤 객차 셋 위에는 아무것도 없다","fact":"정지 돌연변이 = 코돈이 종결 코돈으로 바뀜 → 번역이 일찍 끝나 짧고 대개 못 쓰는 단백질","hook":"가운데에 선 나무판 = 일찍 온 종결 · 뒤 지붕이 비었다 = 짧은 사슬","say":"넷째 열차의 셋째 객차에서는 첫 창이 노랑에서 파랑으로 바뀌었다. 창의 색이 파랑·초록·초록이 되어 맨 끝 객차와 같은 종결 코돈이 된다. 구슬 둘 다음에 벌써 나무판이 서 있고, 뒤쪽 객차 위는 비어 있다. 정지 돌연변이, 또는 넌센스 돌연변이다. 아미노산 코돈이 종결 코돈으로 바뀌어 번역이 일찍 끝나므로, 짧고 대개 기능하지 못하는 단백질이 만들어진다.","cards":["F0-151","F0-157"],"box":[[254,744,776,128]]},{"sid":"s8","obj":"왼쪽 아래 — 삽날에 노란 유리판 하나를 얹어 든 노란 멜빵바지 일꾼 · 그 옆 다섯째 열차는 둘째 객차의 첫 창(노랑)에 빨간 동그라미 / 빨간 유리판을 옆구리에 끼고 왼쪽으로(열차 반대쪽으로) 걸어 달아나는 갈색 원숭이 · 그 옆 여섯째 열차는 첫 객차와 둘째 객차 사이 이음매에 세로로 긴 빨간 동그라미","fact":"틀이동을 일으키는 두 유형 = 삽입(염기가 끼어듦) · 결실(염기가 빠짐)","hook":"삽으로 떠 넣은 창 = 삽입 · 원숭이가 빼 간 창 = 결실","say":"왼쪽 아래 두 장면은 창을 덧칠하는 대신 창의 수를 바꾼다. 일꾼이 삽으로 노란 창 하나를 떠서 다섯째 열차에 넣는다. 삽으로 넣는 모습에서 삽입을 떠올리자. 동그라미 속 노란 창이 추가된 염기다. 아래의 원숭이는 여섯째 열차에서 창 하나를 빼어 달아난다. 옆구리의 빨간 유리판이 그 창이고, 첫 객차와 둘째 객차 사이에는 빠진 자리를 표시한 동그라미만 남았다. 결실이다. 이렇게 염기 하나가 들어오거나 빠지는 변화는 다음에 볼 틀이동을 일으킨다.","cards":["F0-153"],"box":[[56,796,180,182],[254,856,290,128],[78,960,150,174],[254,968,290,128]]},{"sid":"s9","obj":"다섯째 · 여섯째 열차 — 동그라미 뒤 객차들은 창 빛깔 짝이 맨 위 열차의 같은 자리 객차와 다르고 · 구슬 줄은 첫 금 구슬 말고는 모두 맨 위 열차에 없는 빛깔(다섯째: 갈색 · 회색 · 흰색 · 남색 · 올리브 / 여섯째: 연두 · 검붉은색 · 고동색 · 진회색) · 두 열차 모두 나무판이 없다 · 다섯째 열차 끝에는 창 하나짜리 토막 객차, 여섯째 열차 끝에는 창 둘짜리 토막 객차","fact":"틀이동 돌연변이 = 삽입 · 결실로 읽기 틀이 밀려 그 뒤 모든 코돈이 달라진다","hook":"창이 한 칸씩 밀림 = 읽기 틀 이동 · 뒤 구슬이 모조리 딴 빛","say":"다섯째·여섯째 열차를 맨 위 원본과 비교해 보자. 창 셋을 묶어 객차를 만들기 때문에, 창 하나가 들어오거나 빠지면 뒤쪽 창들이 한 칸씩 밀려 묶인다. 동그라미 뒤의 모든 객차에서 색 조합이 달라지고, 첫 금빛 구슬을 제외한 구슬도 모두 다른 색이다. 끝의 나무판은 사라지고 창이 셋에 못 미치는 토막 객차가 남는다. 셋씩 읽는 읽기 틀이 밀린 틀이동 돌연변이다. 치환은 코돈 하나에 영향을 주지만 틀이동은 변이 지점 뒤의 모든 코돈 해석을 바꾸므로 특히 위험하다. 다만 삽입·결실되는 염기 수가 셋의 배수이면 읽기 틀은 유지된다.","cards":["F0-152","F0-154"],"box":[[254,856,776,240]]},{"sid":"s10","obj":"왼쪽 위 — 노란 해의 굵은 햇살이 사다리 왼쪽 끝에 닿고, 그 자리가 녹아 누렇게 처진 덩이가 됐으며(덩이 속에 연초록 칸이 비치고 바로 옆 칸도 초록) 검은 해 모양 그을음이 찍혔다 / 오른쪽 위 — 둥근 검은 화면에 흰 손뼈 둘이 비치는 바퀴 달린 회색 기계에서 옅은 푸른 빛줄기가 쐐기 꼴로 뻗어 사다리 오른쪽 끝을 비추고, 그 끝이 부러져 토막 났다","fact":"UV = 염기 결합 이상(이웃 염기가 붙는 이량체) · X선 = DNA 절단","hook":"해 그을음과 녹아 붙은 두 초록 칸 = UV · 이량체 / 뼈 비치는 기계의 푸른 빛 = X선 · 부러짐 = 절단","say":"사다리를 손상시킨 원인도 확인하자. 왼쪽 위 해의 굵은 햇살이 닿은 곳은 녹아 처져 한 덩어리가 되었고, 해 모양 그을음이 남았다. L11c에서 본 자외선의 단서다. 덩어리의 칸과 바로 옆 칸은 모두 초록으로, 이웃한 두 T를 뜻한다. 자외선은 이웃 염기를 서로 결합시켜 티민 이량체 같은 염기 결합 이상을 만든다. 오른쪽 위 회색 기계의 화면에는 손뼈가 보인다. X선 기계이며, 푸른 빛을 맞은 사다리 끝이 부러져 있다. X선은 DNA 가닥을 끊는다. 자외선은 주로 염기 결합 이상, X선은 주로 DNA 절단과 연결하자.","cards":["F0-163"],"box":[[8,0,490,256],[1346,50,504,296]]},{"sid":"s11","obj":"사다리 위에 올라선 작은 검은 게 — 집게로 갈색 약병을 기울여 보라 방울 셋을 떨군다 · 방울이 떨어지는 자리의 사다리 칸 하나만 보라","fact":"돌연변이원 = 돌연변이를 일으키는 물리 · 화학적 요인 · 그중 암을 일으키는 것이 발암물질","hook":"해 · 기계 · 약병 = 돌연변이원 셋 · 검은 게(암)가 든 약병 = 발암물질","say":"사다리 위의 작은 검은 게가 집게로 갈색 약병을 기울여 보라색 방울을 떨어뜨린다. 방울이 닿은 칸 하나가 보라색으로 변했다. 화학물질도 염기를 바꿀 수 있다는 뜻이다. 해, 뼈가 비치는 기계, 약병처럼 외부에서 돌연변이를 유발하는 물리적·화학적 요인을 돌연변이원이라고 한다. 약병을 든 검은 게는 이 덱에서 암을 나타낸다. 돌연변이원 가운데 암을 일으키는 것은 발암물질이다. 발암물질은 대부분 돌연변이원이며, 돌연변이원도 대부분 발암성을 보인다.","cards":["F0-159","F0-160"],"box":[[746,48,212,172]]},{"sid":"s12","obj":"오른쪽 아래 — 흰 가운의 대머리 과학자가 갈색 약병을 위에 얹은 파란 물총을 겨눠 가는 물줄기를 쏜다 · 나무 이젤에 과녁처럼 세운 둥근 판 둘: 물줄기를 맞는 쪽에는 흰 점이 빽빽하고 옆의 판에는 흰 점이 셋뿐","fact":"에임스 시험 = 화학물질의 돌연변이 유발성 검사 — 군락이 많을수록 유발성이 크다","hook":"겨누다(aim) = 에임스 · 약을 맞은 판에만 군락이 빽빽","say":"오른쪽 아래 흰 가운의 과학자가 물총을 겨누고 있다. 조준한다는 에임에서 에임스 시험을 떠올리자. 물총 위의 갈색 약병은 시험할 화학물질이고, 과녁은 이젤 위 둥근 배지 둘이다. 배지에는 히스티딘을 만들지 못하는 살모넬라균을 깔았다. 히스티딘이 없는 배지에서는 원래 자라지 못하지만, 돌연변이로 유전자 기능이 되돌아온 균은 자라서 흰 점인 군락을 만든다. 약을 맞은 배지에는 흰 점이 빽빽하고, 맞지 않은 배지에는 몇 개뿐이다. 군락이 많을수록 돌연변이 유발성이 크고 발암 가능성도 높다. 에임스 시험은 이처럼 화학물질의 돌연변이 유발성을 검사한다.","cards":["F0-161"],"box":[[1390,766,256,340],[1660,630,384,476]]}],"cq":{"F0-147":["한 염기쌍 수준의 작은 변화 전반을 통칭하는 말은?","점 돌연변이"],"F0-165":["개별 염기 수준 이상 5가지는?","침묵, 과오, 정지, 삽입, 결실"],"E1-87":["DNA 손상이 수선되지 않고 다음 세대로 전달되면?","돌연변이가 된다"],"F0-148":["염기 하나가 다른 종류로 바뀌는 돌연변이는?","치환 돌연변이"],"F0-149":["코돈 변화가 아미노산을 바꾸지 않는 돌연변이는?","침묵 돌연변이"],"F0-155":["침묵 돌연변이가 표현형에 보통 큰 영향이 없는 이유는?","유전암호의 중복성 때문"],"E1-88":["돌연변이의 결과는 항상 해로운가?","아니오"],"F0-150":["코돈 변화가 다른 아미노산을 만들게 하는 돌연변이는?","과오 돌연변이"],"F0-156":["과오 돌연변이의 영향이 경우에 따라 다른 이유는?","바뀐 아미노산의 성질과 위치가 단백질 기능에 미치는 영향이 다르기 때문"],"F0-158":["겸상적혈구 빈혈증은 어떤 돌연변이 예시인가?","과오 돌연변이"],"F0-151":["코돈 변화가 종결 코돈을 만들어 번역을 일찍 끝내는 돌연변이는?","정지 돌연변이"],"F0-157":["정지 돌연변이의 전형적 결과는?","짧고 대개 비기능적인 단백질 생성"],"F0-153":["틀이동 돌연변이를 일으키는 두 유형은?","삽입과 결실"],"F0-152":["염기가 삽입되거나 결실되어 읽기 틀이 바뀌는 돌연변이는?","틀이동 돌연변이"],"F0-154":["틀이동 돌연변이가 특히 위험한 이유는?","변이 지점 이후 모든 코돈 해석이 바뀔 수 있기 때문"],"F0-163":["X선과 UV의 차이를 한 문장으로 하면?","X선은 DNA 절단을, UV는 염기 결합 이상을 주로 일으킨다"],"F0-159":["돌연변이를 유발하는 외부 요인을 무엇이라 하는가?","돌연변이원 mutagen"],"F0-160":["돌연변이원 중 암을 일으키는 것을 무엇이라 하는가?","발암물질 carcinogen"],"F0-161":["화학물질의 돌연변이 유발성을 검사하는 실험은?","Ames test"]},"hubPanel":null};
const $ = id => document.getElementById(id);
$('title').textContent = L.title; document.title = L.title;
// 요약 줄(sub)에는 물건 = 답이 다 적혀 있다 — 복습 · 시험에서는 접어 두고, 누르면 편다(GPT 추가 감사 2026-11-11 §7)
let subOpen = false;
function subShow() { const hide = (mode === 'review' || mode === 'quiz') && !subOpen && !!L.sub; $('sub').textContent = hide ? '요약 줄은 접어 두었다(답이 적혀 있다) — 누르면 편다' : (L.sub || ''); $('sub').classList.toggle('hid', hide); }
$('sub').onclick = () => { if (mode === 'review' || mode === 'quiz') { subOpen = !subOpen; subShow(); } };
$('img').src = L.img; $('img').alt = L.title;
if (L.home) $('home').href = L.home;  // 한 파일(standalone)은 저장소 밖에서 열리므로 배포 주소로
if (L.hub) $('hub').href = L.hub; else if (L.hubPanel) $('hub').href = '../sketchy.html#' + L.hubPanel;
const ov = $('ov'); ov.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
let tourEnded = false;
let mode = 'tour', i = -1, playing = false, voice = true, rate = 1.0, quizOrder = [], quizPos = 0, quizRevealed = false, shuffle = false, sess = null;
const stops = L.stops;
subShow();
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID
const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}

  // 바뀐 읽기 뒤에 바로 붙은 조사를 받침에 맞춘다(「Ca²⁺가」 → 「칼슘 이온이」) — 띄어쓰기 · 문장부호 앞의 조사만
  const PAIR = { '가': ['이', '가'], '이': ['이', '가'], '를': ['을', '를'], '을': ['을', '를'], '는': ['은', '는'], '은': ['은', '는'], '와': ['과', '와'], '과': ['과', '와'] };

    t = t.replace(/L(\d{2})([a-z]?)(?![A-Za-z0-9])/g, (all, n, c) => {
      const id = 'L' + n + c; const title = order && order[id];
      return title ? `「${title}」 그림` : '다른 그림';
    });
    // ② 로마 숫자(문맥) — 볼티모어 군 · 부두 번호는 한자어 수, 나머지는 영어 수. 대 · 자 · 선 · 기가 붙으면 글자
    const baltimore = /^L01/.test(lesson || '');
    t = t.replace(/(?<![A-Za-z0-9])(VII|VI|IV|V|III|II|I)(b|x)?(?![A-Za-z0-9₀-₉])((?:으로|로|가|이|를|을|는|은|와|과)(?=[\s,.·)」'"!?:;]|$))?/g, (all0, r, suf, pp, off, str) => {

      if (/^\s?(대|자|선)/.test(after)) return all0;                       // I대 · V자 · Z선 → 글자(기본값)

    if (W[core] !== undefined) return 'lex';
    // 소문자 세 글자 이상이 든 조각은 사전이 잡아야 한다(나머지 조각은 글자 이름이어도 된다)
    return core.split('-').filter(Boolean).every(p => W[p] !== undefined || !/[a-z]{3,}/.test(p)) ? 'lex' : 'default';

const ttsNorm = t => TTSNorm.ttsNorm(t, TTS_LEX, TTS_ORDER, L.id);
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate, auto:playing && mode === 'tour',
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate, auto:true,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
