const L = {"id":"L36b","scene":"s36","part":"b","title":"한 바퀴 도는 마당 — 세대교번 · 배우자와 포자","sub":"되돌아오는 밧줄(세대교번) · 자루 한 개 n · 두 개 2n · 첫째 칸 도구 없이 둘로(체세포분열 → 배우자) · 둘째 칸 손 맞대고 자루 둘(수정) · 셋째 칸 깔때기 주둥이 넷(감수분열 → 포자) · 두꺼운 껍질(스포로폴레닌) · 넷째 칸 깨진 껍질 · 혼자 선 하나(포자는 혼자)","img":"img/L36b.webp?v=342c56e689de","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"돌담 아래 풀밭에 네 무리가 왼쪽에서 오른쪽으로 한 줄","fact":"도구가 있는 칸은 하나뿐 — 반으로 가르는 기계는 셋째 칸에만","hook":"네 칸 · 기계는 한 칸","say":"낮은 담장 앞에 네 무리가 왼쪽부터 한 줄로 서 있다. 분열 도구가 있는 곳은 한 칸뿐이다. 첫째 칸에서는 도구 없이 같은 것이 하나 더 생기고, 반으로 나누는 기계는 셋째 칸에만 있다. 식물의 배우자를 감수분열로 만든다는 설명이 왜 틀렸는지, 이 차이를 따라가며 확인해 보자.","box":null,"src":["s36p02#1"],"cards":[]},{"sid":"s2","obj":"머리 위의 밧줄 하나 — 넷째 무리 너머 오른쪽 끝에서 첫째 무리 쪽 왼쪽 끝으로 되돌아와 담장에 매였다","fact":"세대교번 — 다세포 배우체(n)와 다세포 포자체(2n)가 번갈아 · 차축조류엔 없는 식물의 파생형질","hook":"되돌아오는 밧줄 = 한 바퀴","say":"머리 위의 밧줄은 넷째 무리 너머 오른쪽 끝에서 왼쪽의 첫째 무리로 돌아와 담장에 매여 있다. 다세포 배우체와 다세포 포자체가 번갈아 나타나는 세대교번이다. 되돌아온 밧줄처럼 생활사가 한 바퀴 이어진다. 유성 생활사에서는 감수분열과 수정이 번갈아 일어나 세대가 바뀌어도 염색체 수를 일정하게 유지한다. 생활사 세 유형을 비교해 보자. 이 마당의 세대교번형은 다세포 포자체(2n)와 배우체(n)가 번갈아 나타나며 식물과 일부 조류가 해당한다. 캠핑장에서 본 대부분 균류의 반수체 우세형은 성체가 n이고 접합자만 2n이다. 생식 마을의 동물처럼 성체가 2n이고 배우자만 n인 경우는 2배체 우세형이다. 차축조류에는 이 세대교번이 없으므로 식물의 파생형질로 꼽는다.","box":[0,20,2048,560],"src":["s36p02#0"],"cards":["M0-11","M0-3#1","D0-172","D0-172#8","D0-36","D0-35","D0-171","D0-171#3"]},{"sid":"s3","obj":"자루가 한 개면 n · 두 개면 2n — 메든 들든 개수만 본다","fact":"좇을 것은 하나 — 자루가 둘에서 하나로 줄어드는 자리(감수분열)가 이 마당에 한 군데","hook":"자루 둘 → 하나 되는 자리를 찾아라","say":"자루 한 개는 엔, 두 개는 이 엔이다. 어깨에 메었는지 손에 들었는지보다 개수를 보자. 한 벌의 염색체 수가 엔이며, 한 벌을 가진 세포는 반수체, 두 벌을 가진 세포는 2배체다. 이 마당에서는 자루가 둘에서 하나로 줄어드는 지점을 찾아야 한다. 그곳이 감수분열이며, 한 바퀴 중 한 군데뿐이다.","box":[[70,580,190,250],[660,420,220,160],[1120,440,420,180]],"src":["s36p02#1"],"cards":["D0-20","D0-21","D0-22"]},{"sid":"s4","obj":"첫째 칸 — 자루 한 개짜리 한 사람이 똑같은 둘로 갈라지는 중(가운데 점선 · 몸 아직 붙음) · 둘 다 자루 한 개 · 도구가 하나도 없다","fact":"배우체(n)가 체세포분열로 배우자(난자 · 정자) — 이미 반수체라 가를 것이 없다","hook":"도구 없이 같은 것 하나 더 = 체세포분열","say":"첫째 칸에서는 자루 한 개를 가진 사람이 같은 모습의 둘로 갈라지고 있다. 가운데 점선이 있지만 몸은 아직 붙어 있고, 나뉜 양쪽 모두 자루가 한 개다. 도구도 없다. 배우체가 체세포분열, 즉 유사분열로 난자와 정자인 배우자를 만드는 모습이다. 배우자라고도 하는 생식세포는 유전자를 한 세대에서 다음 세대로 전달하는 운반체다. 형질이 대를 이어 전달되는 것이 유전이다. 배우체는 이미 반수체라 염색체 수를 반으로 줄일 필요가 없다. 그래서 식물의 배우자가 감수분열로 만들어진다고 하면 틀리다. 동물은 달라서 감수분열로 배우자를 직접 만든다.","box":[60,560,440,520],"src":["s36p02#2"],"cards":["M0-8","M0-10#1","M0-11#1","M0-11#2","D0-172#5","D0-139","D0-173#2","D0-121","D0-6","D0-0"]},{"sid":"s5","obj":"둘째 칸 — 두 사람이 마주 서서 손을 맞대고 · 그 위에 자루 둘을 함께 받쳐 들었다","fact":"수정 — n + n = 접합자 2n · 손 맞댐은 씨앗 공방에서 정자와 난세포가 만나던 그 손","hook":"손 맞대고 자루 둘 = 수정","say":"둘째 칸에서는 두 사람이 마주 보고 손을 맞댄 채 자루 둘을 함께 받친다. 수정이다. 엔과 엔이 합쳐져 이 엔인 접합자가 된다. 두 생식세포의 수정은 반수체 두 벌을 합쳐 2배체를 회복한다. 염색체가 다시 쌍을 이루면서 유전자도 다시 조합된다. 사람 체세포의 염색체 46개가 두 벌인 것도 어머니와 아버지에게서 각각 한 벌씩 받았기 때문이다. 맞댄 손은 씨앗 공방의 화분관 길에서 정자와 난세포가 만나던 손과 같은 상징이다.","box":[560,400,480,660],"src":["s36p02#3"],"cards":["M0-11#3","M0-11#4","D0-172#6","D0-172#7","D0-29","D0-30","D0-28","D0-170","D0-19","E0-3"]},{"sid":"s6","obj":"셋째 칸 — 자루 두 개를 멘 큰 사람이 깔때기로 들어가고 · 아래 주둥이 넷에서 자루 한 개짜리가 하나씩 나온다","fact":"포자체(2n)가 감수분열로 포자(n) — 2n 하나 → n 넷 · 이 마당에서 반이 되는 유일한 자리","hook":"깔때기 · 주둥이 넷 = 감수분열","say":"셋째 칸에서는 자루 두 개를 멘 큰 사람이 깔때기로 들어가고, 아래 주둥이 넷에서 자루 한 개짜리가 하나씩 나온다. 큰 사람은 둘째 칸의 접합자가 체세포분열로 자란 포자체다. 체세포분열, 즉 유사분열은 엔 상태에서도 이 엔 상태에서도 일어난다. 포자체는 감수분열로 포자를 만든다. 이 엔 하나에서 엔 넷이 나오는 이곳이 염색체 수를 반으로 줄이는 유일한 지점이다.","box":[[1080,280,560,650]],"src":["s36p02#4"],"cards":["M0-9","M0-10#2","M0-11#5","M0-11#6","S-PL-7","D0-172#1","D0-172#2","D0-172#3"]},{"sid":"s7","obj":"주둥이에서 나온 넷은 거북 등딱지 같은 두꺼운 껍질을 쓰고 있다","fact":"스포로폴레닌 벽 — 포자를 건조에서 보호 · 「포자낭의 벽 있는 포자」가 4대 파생형질의 하나","hook":"두꺼운 껍질 = 마른 공기를 견디는 벽","say":"네 주둥이에서 나온 인물들은 거북 등딱지 같은 두꺼운 껍질을 쓰고 있다. 스포로폴레닌 벽이다. 차축조류에서는 노출된 접합자를 감싸고, 식물에서는 포자 벽을 이루어 건조를 막는다. 그래서 포자가 마른 공기 중에 퍼져도 살아남을 수 있다. 포자낭에서 만들어지는 벽 있는 포자는 식물의 네 가지 파생형질 가운데 하나다.","box":[[1030,865,610,215]],"src":["s36p02#5"],"cards":["M0-2","M0-3#3"]},{"sid":"s8","obj":"넷째 칸 — 두꺼운 껍질이 깨져 바닥에 뒹굴고 · 거기서 나온 자루 한 개짜리가 혼자 일어섰다(아직 작다)","fact":"포자는 융합 없이 혼자 체세포분열해 새 배우체가 된다 — 짝이 필요 없다","hook":"깨진 껍질 · 혼자 선 하나 = 포자는 혼자 간다","say":"넷째 칸에서는 두꺼운 껍질이 깨져 바닥에 놓였고, 자루 한 개짜리 작은 사람이 그 안에서 나와 혼자 일어선다. 이 사람이 자라 첫째 칸의 배우체가 된다. 포자는 다른 세포와 융합하지 않고 혼자 체세포분열하여 새 배우체로 자란다. 셋째 칸에서 넷이 나왔는데 여기에는 하나만 서 있는 것도 짝 없이 자랄 수 있다는 뜻이다.","box":[[1575,780,465,300]],"src":["s36p02#6"],"cards":["M0-11#7","D0-172#4"]},{"sid":"s9","obj":"둘째 칸은 손을 맞대야 다음이 되었는데 · 넷째 칸은 아무 손도 잡지 않고 다음이 된다","fact":"배우자는 짝을 만나야 · 포자는 혼자 — 배우자 = 체세포분열 / 포자 = 감수분열을 바꾼 선지가 최다 오답","hook":"손 잡느냐 혼자냐","say":"둘째 칸에서는 손을 맞대야 다음 단계로 갔지만, 넷째 칸에서는 아무와도 손잡지 않고 다음 단계로 간다. 배우자는 짝과 만나야 하고 포자는 혼자 자란다는 차이다. 식물에서 배우자는 체세포분열로, 포자는 감수분열로 만들어진다. 이 단원에서 오답이 가장 많이 나오는 것은 두 과정을 바꾸어 놓은 선지이므로 주의하자.","box":[[560,400,480,660],[1575,780,465,300]],"src":["s36p02#7"],"cards":["M0-10"]}],"cq":{"M0-11":["세대교번 5단계는?","배우체→배우자(체세포분열)→수정→접합자(2n)→포자체→포자(감수분열)→배우체"],"M0-3#1":["식물의 4대 파생형질은?","세대교번"],"D0-172":["식물의 세대교번(alternation of generations) 흐름은?","포자체(2n) → 감수분열 → 포자(n) → (발생) 배우체(n) → 배우자(n) → 수정 → 접합자(2n) → 포자체(2n)"],"D0-172#8":["식물의 세대교번(alternation of generations) 흐름은?","포자체(2n)"],"D0-36":["성생활 주기에서 핵심적으로 교대하는 두 과정은?","감수분열과 수정"],"D0-35":["감수분열과 수정이 교대로 일어나는 의미는?","염색체 수를 세대 사이에 일정하게 유지한다"],"D0-171":["유성생식 생활사의 3가지 유형은?","2배체 우세형(동물): 성체 2n, 배우자만 반수체(감수분열로 직접 형성) · 반수체 우세형(대부분 균류·일부 원생생물·조류): 성체 n, 접합자만 2n이며 곧바로 감수분열 · 세대교번형(식물·일부 조류): 2n 포자체와 n 배우체가 교대"],"D0-171#3":["유성생식 생활사의 3가지 유형은?","세대교번형(식물·일부 조류): 2n 포자체와 n 배우체가 교대"],"D0-20":["한 벌의 염색체 수를 기호로 나타내면?","n"],"D0-21":["염색체 두 벌을 가진 세포를 무엇이라 하는가?","2배체 세포(diploid cell)"],"D0-22":["염색체 한 벌만 가진 세포를 무엇이라 하는가?","반수체 세포(haploid cell)"],"M0-8":["배우체(gametophyte)의 배수성과 만드는 것은?","n(반수체) · 체세포분열로 배우자(난자·정자)를 만듦"],"M0-10#1":["배우자와 포자의 형성 방식 차이 — 「배우자」? (↔ 포자)","체세포분열(이미 반수체 배우체에서)"],"M0-11#1":["세대교번 5단계는?","배우체"],"M0-11#2":["세대교번 5단계는?","배우자(체세포분열)"],"D0-172#5":["식물의 세대교번(alternation of generations) 흐름은?","배우자(n)"],"D0-139":["배우체 식물에서 유사분열이 하는 역할은?","생식세포 생산"],"D0-173#2":["동물과 식물에서 '배우자'를 만드는 분열 방식의 차이 — 「식물」? (↔ 동물)","반수체 배우체가 체세포분열(유사분열)로 배우자를 생성"],"D0-121":["유사분열은 2배체와 반수체 세포 모두에서 일어나는가 const ttsNorm = t => TTSNorm.ttsNorm(t, TTS_LEX, TTS_ORDER, L.id);
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate, auto:playing && mode === 'tour',
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate, auto:true,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }

    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }

function quizAsk() {

  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];

function judge(ok) {
  if (!quizRevealed || !sess) return;

  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);

}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;

  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));

$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };

const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
