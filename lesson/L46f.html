<script>
const L = {"id":"L46f","scene":"s46","part":"f","title":"지붕 위 유리 돔 풍선 다락 — 기도 · 폐포 · 숨쉬기 · 분압 · 호흡 조절","sub":"심장 집 지붕의 유리 돔(폐) · 얼굴 굴뚝 → 목 → 고리 관 → 갈래 → 잔가지 → 분홍 풍선 송이(기도 · 폐포) · 풍선마다 감긴 붉은 · 푸른 실관(모세혈관 · 얇은 막) · 나가는 붉은 호스의 흰 방울 / 들어오는 푸른 호스의 어두운 방울(O₂ · CO₂ · 동맥혈 · 정맥혈) · 비누 분무기와 쭈그러든 풍선의 아기(서팩턴트 · 미숙아) · 고무막을 끌어내리는 일꾼 + 낮은 바늘 + 왼쪽 종 모형(흡기 · 음압) · 고무막이 솟은 오른쪽 종 모형(날숨) · 나무 갈비 테 · 목에 힘줄이 선 달리는 사람(호흡근 · 보조근) · 종이봉투 한 숨 / 짜도 남는 노인의 풍선(1회 호흡량 · 잔기량) · 선반의 병 셋(들숨 · 폐포 · 날숨 분압) · 연기를 물에 뿜는 돌 망루 + 붉어진 시험지(연수 · CO₂ → H⁺) · 연기 뿜는 달리는 사람 + 풀무(대사 ↑ → 호흡 ↑) · 눈 덮인 갈림길 위 작은 망루의 빈 병과 호루라기(말초 화학수용기 · 심한 저산소)","img":"img/L46f.webp?v=45581c2014f6","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"심장 집 지붕 위의 큰 유리 돔 다락 — 꼭대기 얼굴 굴뚝으로 숨을 들이고 · 돔 오른쪽 벽에 환풍기 · 돔 아래 집 안에서 붉은 호스와 푸른 호스가 U 자로 이어진다 (틀)","fact":"폐는 기체교환 · 피를 돌리는 것은 심장 / 환기 = 공기 드나듦 · 기체교환 = 확산","hook":"지붕의 유리 돔 = 폐 · 아래 집 = 심장 · 환풍기 = 환기 · 풍선 속 = 기체교환","say":"심장 집 지붕 위의 폐 풍선 다락이 큰 유리 돔으로 펼쳐져 있다. 꼭대기의 얼굴 굴뚝은 숨을 들이쉬고, 돔 아래 집 안에서는 붉은 호스와 푸른 호스가 U자로 연결된다. 폐는 기체교환만 맡고, 혈액을 순환시키는 곳은 아래 심장이다. 돔 오른쪽의 환풍기를 보자. 공기를 들이마시고 내보내는 것은 환기다. 풍선 안에서 공기와 혈액이 기체를 주고받는 것은 기체교환으로, 폐포와 혈액 또는 조직과 혈액 사이의 확산이다. 두 용어를 구분하자.","box":null,"cards":["H0-213","H0-289"]},{"sid":"s2","obj":"돔 꼭대기의 얼굴 굴뚝 — 흰 화살을 따라 흰 방울이 벌린 입으로 들어가고 · 목에서 나온 고리 진 회색 관이 돔 안으로 내려가 두 갈래 → 잔가지로 갈라지고 · 잔가지 끝마다 분홍 풍선 송이","fact":"비강 · 구강 → 인두 → 후두 → 기관 → 기관지 → 세기관지 → 폐포(교환 단위)","hook":"얼굴 = 코 · 입 · 목 = 인두 · 후두 · 고리 관 = 기관 · 두 갈래 = 기관지 · 잔가지 = 세기관지 · 풍선 = 폐포","say":"돔 꼭대기의 큰 얼굴 굴뚝이 입을 벌리자 흰 화살표를 따라 흰 방울이 들어간다. 공기의 경로를 차례로 짚자. 코와 입의 비강·구강을 지나 목의 인두·후두로 간다. 목에서 이어지는 회색 관의 연속된 고리는 연골 고리로 지지된 기관이다. 돔 안에서 두 갈래로 나뉘면 기관지, 더 작은 가지로 나뉘면 세기관지다. 끝마다 달린 분홍 풍선 송이는 폐포로, 사람을 비롯한 포유류의 폐에서 기체를 교환하는 단위다.","box":[[895,40,290,290],[960,300,140,200]],"cards":["H0-209","H0-204","H0-210"]},{"sid":"s3","obj":"돔 안을 빽빽이 채운 작은 분홍 풍선 송이들 — 송이마다 가는 붉은 실관과 푸른 실관이 그물처럼 감쌌다","fact":"폐포 = 엄청난 표면적 · 모세혈관이 감싼다 · 아주 얇은 막을 사이에 두고 교환","hook":"작은 풍선 무수히 = 넓은 표면 · 감긴 실관 = 모세혈관 · 풍선 막 한 겹 = 얇은 막","say":"돔 안에는 작은 분홍 풍선 송이가 가득하다. 큰 풍선 하나보다 작은 풍선 수억 개의 표면을 펼치는 편이 훨씬 넓다. 폐포의 큰 표면적을 나타낸다. 송이마다 그물처럼 감싼 가는 붉은 실관과 푸른 실관은 모세혈관이다. 풍선의 얇은 고무막 한 겹과 실관의 얇은 벽 한 겹을 사이에 두고 공기와 혈액이 기체를 주고받는다.","box":[[735,465,525,295]],"cards":["H0-205","H0-206","H0-216"]},{"sid":"s4","obj":"집 안에서 U 자로 이어진 호스 — 돔에서 내려오는 붉은 쪽엔 흰 방울이 가득 · 바닥을 돌아 돔으로 올라가는 푸른 쪽엔 흰 방울 둘과 어두운 방울 여럿","fact":"O₂ 폐포 → 혈액 · CO₂ 혈액 → 폐포 · 동맥혈 104 / 40 · 정맥혈 40 / 45","hook":"흰 방울 가득한 붉은 호스 = 동맥혈 · 흰 방울 적고 어두운 방울 낀 푸른 호스 = 정맥혈","say":"집 안에서 하나로 이어진 U자 호스를 따라가 보자. 돔에서 내려오는 붉은 쪽에는 산소인 흰 방울이 가득하다. 폐포 공기의 산소가 혈액으로 들어온 결과다. 바닥을 돌아 돔으로 올라가는 푸른 쪽에는 흰 방울이 둘뿐이고 어두운 방울이 많다. 이산화탄소인 어두운 방울은 혈액에서 폐포 공기로 이동해 내쉬어진다. 수치도 연결하자. 폐에서 나온 동맥혈은 폐포 공기처럼 산소 분압 104, 이산화탄소 분압 40수은주밀리미터다. 몸을 돌아온 정맥혈은 산소 40, 이산화탄소 45이다.","box":[[825,830,95,280],[1245,820,80,250]],"cards":["H0-211","H0-212","H0-241","H0-243"]},{"sid":"s5","obj":"청소부가 비누 분무기를 뿌린 분홍 풍선 송이는 동그랗게 부풀었다 · 곁 요람의 갓난아기 이불 위엔 바람 빠져 쭈글쭈글한 풍선 셋 · 요람 곁에 빈 비누병이 쓰러져 있다","fact":"서팩턴트 = 폐포 표면장력 ↓ → 허탈 방지 · 미숙아는 부족 → 폐포가 안 펴져 호흡곤란","hook":"비누(계면활성제) = 서팩턴트 · 빈 비누병 + 바람 빠진 풍선 = 미숙아 호흡곤란","say":"돔 오른쪽 아래의 청소부가 비누 분무기를 분홍 풍선 송이에 뿌린다. 비누는 계면활성제인 서팩턴트다. 젖은 풍선이 물의 표면장력으로 안쪽으로 오그라들어 달라붙으려는 것을 막듯, 서팩턴트는 폐포의 표면장력을 낮춰 허탈을 방지한다. 비누를 뿌린 송이가 둥글게 펴져 있는 이유다. 옆 요람의 갓난아기 이불에는 바람 빠진 풍선 셋이 축 늘어져 있고, 요람 곁에는 빈 비누병이 쓰러져 있다. 미숙아는 서팩턴트가 부족해 폐포가 잘 펴지지 않으므로 호흡곤란이 생긴다.","box":[[1440,760,300,340]],"cards":["H0-214","H0-215"]},{"sid":"s6","obj":"돔 바닥의 붉은 고무막을 집 안의 일꾼이 두 손으로 끌어내린다 · 돔 안 압력계 바늘은 왼쪽 초록 · 왼쪽 탁자의 종 모형 하나 — 왼쪽 끝에서 뻗은 손이 고무막을 당기자 풍선 둘이 크게 부풀고 흰 화살 셋이 위에서 들어온다","fact":"음압 호흡 — 흡기: 횡격막 수축 ↓ · 늑간근 수축 · 흉강 부피 ↑ · 폐내압 < 대기압","hook":"고무막을 끌어내림 = 횡격막 수축 · 낮은 바늘 = 음압 · 커진 부피로 공기가 빨려 듦","say":"돔 바닥의 붉은 고무막을 집 안의 일꾼이 두 손으로 끌어내린다. 들숨 때 횡격막이 수축해 내려가는 모습이다. 늑간근도 수축해 갈비뼈를 들어 올리므로 흉강 부피가 커진다. 돔의 압력계 바늘이 왼쪽의 낮은 초록 구간을 가리키듯, 폐내 압력이 대기압보다 낮아진다. 공기는 낮은 압력 쪽으로 들어온다. 공기를 밀어 넣기보다 끌어들이는 포유류의 음압 호흡이다. 왼쪽 탁자의 종 모형에서도 손이 고무막을 당기자 풍선이 부풀고 흰 화살표가 안으로 향한다.","box":[[935,820,175,250],[1150,725,100,95],[70,325,165,360]],"cards":["H0-217","H0-218","H0-219","H0-220","H0-221"]},{"sid":"s7","obj":"왼쪽 탁자의 다른 종 모형 — 고무막이 위로 불룩 솟았고 · 안의 풍선은 작게 오그라들었고 · 흰 화살 둘이 위로 빠져나간다","fact":"날숨: 횡격막 이완 → 위로 · 흉강 부피 ↓ · 폐내압 > 대기압 → 공기가 나간다","hook":"위로 솟은 고무막 = 이완한 횡격막 · 작아진 풍선 · 나가는 화살 = 날숨","say":"왼쪽 탁자의 다른 종 모형에서는 손을 놓자 고무막이 위로 둥글게 올라간다. 날숨에서 횡격막이 이완되는 모습이다. 흉강 부피가 감소하고 안의 풍선도 작아지면 폐내 압력이 대기압보다 높아져 공기가 밖으로 밀려난다. 위로 빠져나가는 흰 화살표 둘을 보자. 편안한 날숨은 근육을 이완하는 것만으로 일어난다.","box":[[240,325,160,250]],"cards":["H0-222","H0-223","H0-224"]},{"sid":"s8","obj":"돔을 두른 나무 갈비 테와 고무막을 당기는 일꾼 · 오른쪽 아래 — 입을 쩍 벌리고 헐떡이며 달리는 사람의 목에 힘줄이 줄줄이 섰다","fact":"안정 시 환기 = 횡격막 + 늑간근 · 격한 운동 때 목 · 가슴의 보조 호흡근이 돕는다","hook":"일꾼 + 갈비 테 = 늘 쓰는 두 근육 · 줄줄이 선 목 힘줄 = 보조 호흡근","say":"평소 호흡의 두 근육은 고무막을 당기는 일꾼인 횡격막과, 돔의 나무 갈비 테 사이에 있는 늑간근이다. 오른쪽 아래에서 입을 벌리고 헐떡이며 달리는 사람의 목에는 힘줄이 도드라진다. 격한 운동에서는 목과 가슴의 보조 호흡근도 함께 작용해 갈비를 더 들어 올린다.","box":[[935,820,175,250],[1795,750,185,305]],"cards":["H0-225","H0-226"]},{"sid":"s9","obj":"왼쪽 아래 — 차분한 사람이 종이봉투에 숨을 한 번 내쉰다 · 곁의 지팡이 노인이 분홍 풍선을 끌어안고 온 힘으로 짜는데 풍선이 여전히 빵빵하다","fact":"1회 호흡량 = 평상시 한 번 드나드는 양 · 잔기량 = 최대로 내쉬어도 남는 양 · 나이 들면 ↑","hook":"봉투에 한 숨 = 1회 호흡량 · 짜도 남는 풍선 = 잔기량 · 노인 = 나이 들수록 ↑","say":"왼쪽 아래의 차분한 사람이 종이봉투에 한 번 숨을 내쉰다. 평상시 한 번의 호흡으로 드나드는 공기량인 1회 호흡량이다. 옆의 지팡이를 짚은 노인은 분홍 풍선을 온 힘으로 짜지만, 풍선은 여전히 부풀어 있다. 최대한 내쉰 뒤에도 폐에 남는 잔기량이다. 날숨이 끝나도 폐는 완전히 비지 않고 항상 공기가 일부 남는다. 노인으로 표현한 이유는 나이가 들수록 폐 탄력이 줄어 잔기량이 증가하기 때문이다.","box":[[140,740,450,360]],"cards":["H0-227","H0-228","H0-229","H0-230"]},{"sid":"s10","obj":"선반의 유리병 셋 — 첫 병은 흰 방울로 꽉 찼고 · 가운데 병은 흰 방울이 줄고 어두운 방울 둘 · 끝 병은 그 사이(흰 방울 열둘 · 어두운 방울 하나)","fact":"들숨 PO₂ 160 / PCO₂ 0.3 · 폐포 104 / 40 · 날숨은 둘 사이(남은 공기와 섞임)","hook":"흰 방울 = O₂ · 어두운 방울 = CO₂ · 병 셋 = 들숨 · 폐포 · 날숨","say":"선반의 유리병 셋에서 흰 방울은 산소, 어두운 방울은 이산화탄소다. 첫 병은 흰 방울로 가득하다. 들이마신 공기로, 산소 분압은 약 160, 이산화탄소는 0.3수은주밀리미터로 거의 없다. 가운데 병은 흰 방울이 줄고 어두운 방울이 생긴 폐포 공기다. 산소 104, 이산화탄소 40이다. 마지막 병의 조성은 둘의 중간이다. 내쉰 공기는 폐포 공기와 기도에 남아 있던 들숨 공기가 섞여 나오기 때문이다.","box":[[415,335,320,170]],"cards":["H0-239","H0-240","H0-244"]},{"sid":"s11","obj":"오른쪽의 높은 돌 망루 — 발치의 가스통이 호스로 연기를 웅덩이 물에 뿜고 · 발치의 경비가 그 물에 담근 긴 시험지가 붉게 물들었다","fact":"호흡 중추 = 연수 — CO₂ 로 생긴 H⁺ ↑ · pH ↓ 감지 · 평소 주 자극은 고CO₂(저산소 아님)","hook":"연기 + 물(수) = 연수 · 붉어진 시험지 = H⁺ · pH ↓","say":"오른쪽의 높은 돌 망루는 호흡조절중추인 연수다. 발치의 가스통이 호스로 웅덩이에 연기를 내보낸다. 연기와 물, 연수라는 이름 연결이다. 경비가 물에 담근 긴 시험지가 붉게 변했다. 이산화탄소가 물에 녹으면 수소 이온이 생겨 산성으로 기울기 때문이다. 연수는 이산화탄소 증가에 따른 수소 이온 증가와 pH 감소를 감지한다. 따라서 평소 호흡을 조절하는 주된 자극은 산소 부족보다 이산화탄소 증가와 낮은 pH이다.","box":[[1505,280,225,400],[1465,520,340,230]],"cards":["H0-231","H0-232","H0-235"]},{"sid":"s12","obj":"망루 앞을 달리는 사람이 입과 머리 뒤로 검은 연기를 내뿜고 · 망루 꼭대기 경비가 풀무를 두 손으로 세게 빨리 밀었다 당긴다","fact":"대사 ↑ → CO₂ ↑ · pH ↓ → 호흡 깊이 · 속도 ↑ · 활동 조직 PO₂ ↓ PCO₂ ↑","hook":"뿜는 검은 연기 = 활동 근육의 CO₂ · 세게 빨리 움직이는 풀무 = 깊고 빠른 호흡","say":"망루 앞을 달리는 사람은 입과 머리 뒤로 검은 연기를 내뿜는다. 운동으로 대사가 증가하면 근육이 이산화탄소를 많이 만든다. 활동 조직은 산소 분압이 낮고 이산화탄소 분압은 높다. 근육 쪽 혈액의 이산화탄소가 늘고 pH가 떨어진다. 망루 꼭대기 경비가 풀무를 두 손으로 더 빠르고 세게 밀었다 당긴다. 이산화탄소 증가가 호흡의 깊이와 속도를 늘리는 모습이다. 이산화탄소를 더 내보내 낮아진 pH를 회복하려는 반응이다.","box":[[1345,370,160,190],[1540,125,165,155]],"cards":["H0-233","H0-234","H0-238","H0-242"]},{"sid":"s13","obj":"먼 눈 덮인 산비탈의 작은 나무 망루 — 아래로 산길이 둘로 갈린다 · 경비가 흰 알갱이가 바닥난 유리병을 손에 들고 흔들며 호루라기를 분다","fact":"대동맥 · 목동맥의 화학수용기가 매우 낮은 O₂ 를 감지 → 심한 저산소에서 호흡이 빨라진다","hook":"갈림길 = 대동맥 · 목동맥 · 눈 덮인 고산 = 산소 부족 · 바닥난 병을 흔들며 호루라기","say":"멀리 눈 덮인 산비탈의 작은 나무 망루 아래로 산길이 둘로 갈라진다. 대동맥과 목동맥의 갈림길에 있는 화학수용기를 나타낸다. 경비는 흰 알갱이가 바닥난 유리병을 손에 들고 흔들며 호루라기를 분다. 이 작은 망루는 산소가 매우 낮아질 때 특히 반응한다는 단서다. 고산지대처럼 산소가 크게 부족하면 대동맥과 목동맥의 화학수용기가 이를 감지해 호흡을 빠르게 한다.","box":[[1815,305,175,225],[1880,480,168,190]],"cards":["H0-236","H0-237"]}],"cq":{"H0-213":["폐는 기체교환만 담당하고 순환은 누가 돕는가?","심장"],"H0-289":["환기와 기체교환의 차이는?","환기는 공기를 들이마시고 내쉬는 것 · 기체교환은 폐포와 혈액 또는 조직과 혈액 사이의 확산"],"H0-209":["호흡기 구조를 공기 흐름 순서로 쓰면?","비강/구강 → 인두 → 후두 → 기관 → 기관지 → 세기관지 → 폐포"],"H0-204":["포유류 폐의 기체교환 단위는?","폐포(조류는 폐포 대신 공기 모세관)"],"H0-210":["세기관지의 말단에 있는 기체교환 구조는?","폐포"],"H0-205":["폐포의 장점은?","엄청난 표면적 제공"],"H0-206":["폐포를 둘러싸는 혈관은?","모세혈관"],"H0-216":["폐포와 모세혈관의 관계를 한 문장으로 쓰면?","아주 얇은 막을 사이에 두고 기체를 교환한다"],"H0-211":["폐포에서 산소는 어느 쪽으로 이동하는가?","폐포 공기 → 혈액"],"H0-212":["폐포에서 이산화탄소는 어느 쪽으로 이동하는가?","혈액 → 폐포 공기"],"H0-241":["산소화된 동맥혈의 대표적 분압은?","PO2 약 104 mmHg · PCO2 약 40 mmHg"],"H0-243":["정맥혈의 대표적 분압은?","PO2 약 40 mmHg · PCO2 약 45 mmHg"],"H0-214":["서팩턴트(surfactant)의 역할은?","폐포 표면장력을 낮춰 허탈을 막는다"],"H0-215":["미숙아에게 서팩턴트 부족이 위험한 이유는?","폐포가 잘 펴지지 않아 호흡곤란이 생길 수 있기 때문"],"H0-217":["포유류의 숨쉬기 방식은?","음압 호흡"],"H0-218":["흡기(inhalation) 때 횡격막은 어떻게 되는가?","수축하여 아래로 내려간다"],"H0-219":["흡기 때 늑간근은 어떻게 되는가?","수축한다"],"H0-220":["흡기 때 흉강 부피는?","증가한다"],"H0-221":["흡기 때 폐내 압력은 외부 대기압에 비해 어떻게 되는가?","낮아진다"],"H0-222":["날숨(exhalation) 때 횡격막은 어떻게 되는가?","이완하여 위로 올라간다"],"H0-223":["날숨 때 흉강 부피는?","감소한다"],"H0-224":["날숨 때 폐내 압력은 외부 대기압에 비해 어떻게 되는가?","높아진다"],"H0-225":["안정 시 환기를 위해 주로 필요한 근육은?","횡격막과 늑간근"],"H0-226":["격한 운동 시 호흡을 돕는 추가 근육은?","목과 가슴의 보조 호흡근"],"H0-227":["1회 호흡량(tidal volume)이란?","평상시 한 번 숨쉴 때 드나드는 공기량"],"H0-228":["잔기량(residual volume)이란?","최대로 날숨한 뒤에도 폐에 남는 공기량"],"H0-229":["나이가 들수록 증가하기 쉬운 폐 용적은?","잔기량"],"H0-230":["인간의 폐에 항상 일부 공기가 남아 있는 이유를 한 문장으로 쓰면?","날숨이 완전히 끝나지 않아 폐가 완전히 비워지지 않기 때문"],"H0-239":["들이마신 공기의 대표적 분압은?","PO2 약 160 mmHg · PCO2 약 0.3 mmHg"],"H0-240":["폐포 공기의 대표적 분압은?","PO2 약 104 mmHg · PCO2 약 40 mmHg"],"H0-244":["날숨 공기의 분압이 들숨과 폐포 공기의 중간쯤 되는 이유는?","폐포 잔류 공기와 섞이기 때문"],"H0-231":["호흡조절중추는 주로 어디에 있는가?","연수"],"H0-232":["연수의 호흡조절중추가 주로 감지하는 것은?","CO2 증가에 따른 H+ 증가와 pH 감소"],"H0-235":["평상시 호흡조절의 주된 자극은 저산소증인가 고이산화탄소증인가?","고이산화탄소증/낮은 pH"],"H0-233":["대사활동 증가 시 혈액 CO2는 어떻게 되는가?","증가한다(근육에서 나오는 정맥혈 — 적당한 운동에선 호흡이 함께 늘어 동맥혈 CO2 는 거의 유지)"],"H0-234":["CO2 증가가 호흡에 미치는 효과는?","호흡 깊이와 속도를 증가시킨다"],"H0-238":["혈액의 pH가 떨어질 때 호흡이 증가하는 이유는?","CO2를 더 배출해 pH를 회복하려 하기 때문"],"H0-242":["조직액/활동 조직의 대표적 분압 경향은?","PO2 낮고 PCO2 높다"],"H0-236":["고산지대처럼 산소가 매우 낮을 때 이를 감지하는 곳은?","대동맥과 목동맥의 화학수용기"],"H0-237":["저산소증이 심할 때 호흡은 어떻게 변하는가?","빨라진다"]},"hubPanel":null};

//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}

    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');

    stops.forEach((stop, k) => {

      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);

const ttsNorm = t => TTSNorm.ttsNorm(t, TTS_LEX, TTS_ORDER, L.id);
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate, auto:playing && mode === 'tour',
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }

}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);

      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }

function setMode(m) {

  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));

function cqHTML(st) {

function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.

function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;

function judge(ok) {

function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }

$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
