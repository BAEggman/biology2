<script>
const L = {"id":"L15a","scene":"s15","part":"a","title":"같은 극장의 두 때 — 불 꺼진 밤 · 해 든 낮: 간상세포 광전환","sub":"회색 고리 통(cGMP) · 회색 고리로 묶어 연 문 + 소금 사태(암전류 · 탈분극) · 접착제 짜는 지휘자(글루탐산) · 자리에 붙은 북극곰(쌍극세포 억제) · 햇살 받는 접시 + 로프 도르래(로돕신) · 트램펄린 지게꾼(트랜스듀신) · 고리 자르는 가위(PDE) · 빈 통 · 닫힌 문(과분극) · 내린 팔 · 매듭 흔드는 북극곰 → 검은 전선(신경절 → 시신경 → 뇌)","img":"img/L15a.webp?v=2651d72e3402","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"틀선으로 나눈 같은 극장 두 칸 — 왼 칸은 달 없는 밤, 오른 칸은 해가 든 낮 · 지붕 접시 안테나 · 벽 선반 유리 통 · 로비 문 · 무대의 지휘자 · 객석의 북극곰 · 바닥의 매듭 전선이 두 칸 같은 자리에 (틀)","fact":"극장 = 간상세포(객석의 곰 · 매듭은 다음 세포) · 어둠과 빛에서 상태가 정반대","hook":"같은 극장의 두 때 = 어둠 · 빛","say":"간상세포를 나타낸 망막의 극장이다. 나뉜 두 칸은 서로 다른 극장이 아니라 같은 극장의 밤과 낮이다. 왼쪽은 달도 없는 밤, 오른쪽은 햇빛이 드는 낮이다. 지붕의 접시 안테나, 벽 선반의 유리 통, 로비 문, 무대 지휘자, 객석 북극곰, 바닥의 매듭 전선이 같은 자리에 있다. 안테나부터 지휘자까지는 간상세포이고, 북극곰과 매듭은 신호를 받는 다음 세포들이다. 두 칸의 차이를 빛이 만든 변화로 읽어 보자. 이 극장은 어둠 속에서 오히려 더 바쁘게 움직인다.","box":null,"src":["s15p01#0"],"cards":["T0-400","T0-401","T0-409","T0-410"]},{"sid":"s2","obj":"왼 칸 — 로비 문이 활짝 열렸고, 밖의 입 벌린 소금 자루와 소금 더미에서 흰 소금이 문간으로 사태처럼 쏟아져 든다","fact":"어둠: Na⁺ 통로가 열려 Na⁺ 가 계속 들어온다 = 암전류 · 탈분극","hook":"열린 문 + 소금 사태 = Na⁺ 유입 · 어둠 속의 흐름 = 암전류","say":"왼쪽 밤 칸부터 보자. 로비 문이 활짝 열려 있고, 밖의 열린 소금 자루에서 흰 소금이 쏟아져 들어온다. 흰 소금은 이 덱에서 언제나 Na⁺이다. 어둠에서는 간상세포의 Na⁺ 통로가 열려 Na⁺가 계속 유입된다. 어둠 속에 흐르는 이 전류를 암전류라고 하며, 간상세포는 탈분극 상태를 유지한다. 오른쪽 빛 칸에서는 반대로 과분극한다는 점을 비교할 준비를 해 두자.","box":[[10,680,400,450]],"src":["s15p01#0"],"cards":["T0-400","T0-401","T0-409","T0-410"]},{"sid":"s3","obj":"왼 칸 벽 선반의 유리 통 — 굵은 회색 고리가 위쪽 검은 선 바로 밑까지 가득","fact":"어둠: cGMP 농도가 높다","hook":"회색 고리 = cGMP (금 고리 cAMP 의 짝) · 통의 높이 = 농도","say":"선반 위 유리 통에는 굵은 회색 고리가 위쪽 검은 선 바로 아래까지 가득하다. 2차 캠프의 금화를 구부린 금 고리는 cAMP였다. 여기서는 GTP를 나타내는 회색 네모 칩을 구부려 cGMP 고리로 표현했다. 통에 찬 높이는 농도다. 어둠에서 간상세포의 cGMP 농도가 높다는 뜻이다.","box":[[130,405,255,225]],"src":["s15p01#1"],"cards":["T0-402"]},{"sid":"s4","obj":"큰 회색 고리 하나가 열린 문의 놋쇠 손잡이를 꿰어 오른쪽 벽의 검은 쇠갈고리에 걸렸다 — 이 고리가 문을 활짝 열린 채 붙들어 맨다","fact":"cGMP 가 Na⁺ 통로에 직접 붙어 열어 둔다(세포내 리간드) · 없으면 닫힌다","hook":"문을 묶은 회색 고리 = cGMP 가 통로를 직접 연다","say":"큰 회색 고리가 문의 놋쇠 손잡이를 꿰고 벽의 쇠갈고리에 걸려 있다. 고리가 문을 활짝 열린 상태로 붙잡는다. cGMP가 Na⁺ 통로에 직접 결합해 열어 두는 모습이다. 세포 안에서 결합하는 세포내 리간드다. 고리가 있으면 문이 열리고, 사라지면 닫힌다. 어둠에서의 순서를 이어 보자. cGMP 농도가 높고, 통로가 열리며, Na⁺가 들어와 탈분극한다. 그다음에는 무대 지휘자의 행동으로 연결된다.","box":[[345,770,115,135]],"src":["s15p01#2"],"cards":["T0-403","T0-404","T0-408"]},{"sid":"s5","obj":"왼 칸 무대 — 연미복 지휘자가 커다란 흰 접착제 병을 꽉 쥐어짜, 굵은 접착제 줄기를 객석의 북극곰에게 쉬지 않고 쏜다","fact":"어둠: 광수용기는 글루탐산을 쉬지 않고(더 많이) 분비한다","hook":"접착제(글루) = 글루탐산 · 쉬지 않고 짠다 = 계속 분비","say":"무대의 연미복 지휘자가 큰 흰 접착제 병을 짜서 굵은 접착제 줄기를 객석으로 계속 쏜다. 접착제를 뜻하는 글루에서 글루탐산을 떠올리자. 광수용기의 신경전달물질은 글루탐산이다. 어둠에서 탈분극한 광수용기는 이를 계속 분비한다. 따라서 신경전달물질을 더 많이 내보내는 쪽은 밝을 때가 아니라 어두울 때다.","box":[[465,560,495,310]],"src":["s15p01#3"],"cards":["T0-405","T0-406","T0-411","T0-412"]},{"sid":"s6","obj":"객석의 북극곰 — 접착제 범벅으로 빨간 의자에 붙어 버둥거리지만 일어나지 못한다 · 곁의 매듭 전선은 바닥에 늘어진 채 조용하다","fact":"글루탐산은 쌍극세포를 억제(거꾸로 탈분극하는 종류도 있다) — 어둠에도 「억제 신호」를 계속 보내는 중","hook":"자리에 붙은 북극곰 = 억제된 쌍극세포 (bi-polar = polar bear · 쌍극 = 북극)","say":"접착제를 뒤집어쓴 객석의 북극곰을 보자. polar bear의 polar를 bipolar, 즉 쌍극세포와 연결한다. 우리말로도 북극과 쌍극의 극을 연결할 수 있다. 곰은 빨간 의자에 붙어서 버둥거리지만 일어나지 못한다. 이 그림의 쌍극세포는 글루탐산에 의해 억제되는 종류다. 모든 쌍극세포가 같지는 않으며, 글루탐산에 오히려 탈분극하는 종류도 있다. 어둠의 광수용기는 신호를 보내지 않는 것이 아니라 억제 신호를 계속 보내는 중이다. 곁의 매듭 전선도 바닥에 늘어진 채 조용하다.","box":[[450,715,280,350],[560,925,450,205]],"src":["s15p01#4"],"cards":["T0-407","T0-414"]},{"sid":"s7","obj":"오른 칸 — 해에서 내리꽂힌 햇살이 지붕의 접시 안테나에 닿고, 안테나에 맨 가는 로프가 도르래를 돌아 팽팽히 당겨진다","fact":"빛 → 로돕신(간상세포의 광색소 · GPCR) 활성 — 리간드는 빛","hook":"로프의 로 + 도르래의 도 = 로돕신 · 빛 받는 접시 = 수용체","say":"오른쪽 낮 칸으로 이동하자. 햇살이 지붕의 접시 안테나에 닿자, 안테나의 가는 로프가 도르래를 돌아 팽팽해진다. 로프의 로와 도르래의 도를 이어 로돕신을 떠올린다. 로돕신은 간상세포의 광색소이며 G단백질 연결 수용체, GPCR이다. 빛을 리간드로 받는다는 비유이지만, 정확한 작동은 내부의 레티날이 빛을 받아 시스형에서 트랜스형으로 바뀌며 로돕신이 활성화되는 것이다. 수용체 전화 교환국에서 등불 손님이 서 있던 뱀 창구도 이 수용체를 나타냈다.","box":[[1030,0,860,290]],"src":["s15p02#0"],"cards":["X-SG-18","B0-221","B0-221#1","B0-221#2","T0-419","T0-431","T0-415","T0-416"]},{"sid":"s8","obj":"오른 칸 선반의 트램펄린 — 지붕 구멍으로 내려온 로프 끝이 트램펄린 테에 매듭으로 묶였고, 나무 지게를 진 지게꾼이 짙은 회색 네모 칩을 공중에 뒤집으며 높이 튀어 오른다","fact":"트랜스듀신(Gt) 활성 — Gs 는 아데닐산 고리화효소, Gt 는 PDE 를 켠다","hook":"트램펄린(trans- 건너 튕김) + 지게꾼(G) = 트랜스듀신 · 칩 뒤집기 = GTP","say":"로프가 지붕 구멍을 지나 선반의 트램펄린 테에 연결된다. 로프가 당겨지자 나무 지게를 진 지게꾼이 짙은 회색 네모 칩을 공중에서 뒤집으며 높이 튀어 오른다. 지게꾼은 G단백질이고, 칩 뒤집기는 GDP를 내놓고 GTP로 교환하는 과정이다. 건너편으로 튕겨 전달하는 트램펄린은 트랜스듀신이다. 같은 GPCR 경로라도 Gs는 아데닐산 고리화효소를 활성화해 cAMP를 늘리고, 트랜스듀신 Gt는 PDE를 활성화한다. 에피네프린은 고리화효소를 통해 cAMP를 늘리지만, 로돕신은 PDE를 통해 cGMP를 줄이는 것으로 구분하자.","box":[[1470,250,290,370]],"src":["s15p02#1"],"cards":["S-SG-10","B0-221#3","S-SG-9"]},{"sid":"s9","obj":"문 곁 초록 작업복 일꾼이 큰 가위로 문을 묶던 회색 고리를 싹둑 잘랐다 — 손에도 바닥에도 잘린 회색 토막","fact":"PDE 가 cGMP 를 분해한다 — 만드는 게 아니라 부순다(아데닐산 고리화효소는 안 낀다)","hook":"고리를 자르는 가위 = PDE · 잘린 토막 = 분해된 cGMP","say":"문 옆의 초록 작업복 인부가 큰 가위로 문을 묶던 회색 고리를 자른다. 손과 바닥에 잘린 토막이 흩어져 있다. 2차 캠프에서 금 고리를 자르던 가위와 같은 PDE이다. 트랜스듀신이 활성화한 PDE가 cGMP를 분해한다. 빛을 받은 뒤에는 고리를 만드는 것이 아니라 부순다는 점을 보자. 따라서 이 경로에는 금화 압착기인 아데닐산 고리화효소가 들어가지 않는다. 여기서 2차 전달자는 cGMP 하나이고 변화 방향은 감소다.","box":[[1270,710,200,350]],"src":["s15p02#2"],"cards":["B0-221#4","X-SG-1","T0-417","X-SG-2"]},{"sid":"s10","obj":"오른 칸 벽 선반의 유리 통 — 회색 고리 몇 개만 바닥에 깔렸고, 위쪽 검은 선은 저 위에 그대로","fact":"cGMP 급감 · 2차 전달자 다섯 = cAMP · cGMP · Ca²⁺ · IP₃ · DAG","hook":"검은 선 아래로 뚝 = 빠지는 중 · 회색 고리 = 다섯 2차 전달자 중 하나","say":"선반의 유리 통을 비교해 보자. 밤에는 검은 선 아래까지 가득했던 회색 고리가, 낮에는 바닥에 몇 개만 남았다. 처음부터 적었던 것이 아니라 빛을 받아 농도가 급감한 것이다. cGMP도 2차 전달자다. 대표 다섯 가지인 cAMP, cGMP, 칼슘 이온, IP₃, DAG를 함께 정리하자. 2차 캠프에 없었던 회색 고리가 시각 경로의 cGMP이다.","box":[[1150,400,260,200]],"src":["s15p02#3"],"cards":["G0-184","B0-96","B0-221#5","B0-96#2"]},{"sid":"s11","obj":"오른 칸 로비 문이 닫혔다 — 소금은 문밖의 자루와 더미에 그대로 있고 안쪽 바닥은 깨끗하다","fact":"cGMP↓ → Na⁺ 통로 닫힘 → Na⁺ 유입이 끊긴다 → 과분극","hook":"닫힌 문 · 밖에 남은 소금 = 통로 닫힘 · 과분극","say":"회색 고리가 잘리자 로비 문이 닫혔다. 소금은 밖의 자루와 더미에 남아 있고, 안쪽 바닥은 깨끗하다. cGMP가 감소하면 Na⁺ 통로가 닫혀 Na⁺가 더 들어오지 못한다. 그 결과 빛을 받은 광수용기는 과분극한다. 빛 신호라고 해서 탈분극하는 것이 아니다. 빛 → 로돕신 → 트랜스듀신 → PDE → cGMP 감소 → 통로 닫힘 → 과분극의 순서로 장면을 이어 보자.","box":[[1035,680,290,450]],"src":["s15p02#4"],"cards":["B0-221#6","B0-221#7","X-SG-3"]},{"sid":"s12","obj":"오른 칸 무대 — 지휘자가 두 팔을 내렸고, 바닥으로 기운 접착제 병 끝엔 방울 하나뿐","fact":"빛: 글루탐산 분비가 줄어든다 — 억제가 풀리는 것이 곧 신호","hook":"내린 팔 · 방울 하나 = 글루탐산 감소","say":"무대의 지휘자가 두 팔을 내렸다. 아래로 기울어진 접착제 병 끝에는 방울 하나만 맺혀 있다. 과분극한 광수용기에서 글루탐산 분비가 줄어드는 모습이다. 더는 곰을 붙잡아 둘 접착제가 오지 않아 억제가 풀리고, 그것이 빛 신호로 전달된다. 어둠에서 전달물질을 더 많이 방출한다는 말과 빛이 글루탐산 방출을 억제한다는 말은 같은 사실을 서로 다른 쪽에서 설명한 것이다.","box":[[1850,555,190,305]],"src":["s15p02#5"],"cards":["T0-413"]},{"sid":"s13","obj":"북극곰이 자리를 박차고 일어나 전선의 큰 매듭을 두 손으로 높이 들고 흔든다 · 빈 좌석 등받이엔 끊어진 접착제 가닥 몇 올 · 전선이 출렁이며 무대 밑 작은 문으로 빠져나가고 문틈엔 바깥 햇빛","fact":"광수용기 → 쌍극세포 → 신경절세포(축삭 = 시신경) → 뇌 · 신경절세포는 광수용기가 아니다","hook":"북극곰(쌍극) → 큰 매듭(신경절 · 節) → 검은 전선(축삭 · 시신경) → 문밖(뇌)","say":"억제에서 풀린 북극곰이 자리에서 일어났는다. 빈 좌석 등받이에는 끊어진 접착제 가닥 몇 올만 남았다. 쌍극세포인 북극곰이 전선의 큰 매듭을 두 손으로 높이 들어 흔든다. 매듭은 신경절의 단서로, 절은 마디나 매듭이고 그리스말 ganglion도 매듭을 뜻한다. 매듭에서 나온 검은 전선은 출렁이며 무대 아래 작은 문을 지나 밖으로 나간다. 이 덱의 검은 전선은 축삭이며, 신경절세포의 축삭이 모여 시신경을 이루고 뇌로 향한다. 광수용기 → 쌍극세포 → 신경절세포 → 뇌의 전달 순서를 연결하자. 망막의 신호를 마지막으로 받아 뇌로 내보내는 세포는 신경절세포다. 빛을 받는 장치는 지붕 안테나인 로돕신뿐이고, 매듭과 전선은 전달 경로다. 신경절세포를 광수용기와 혼동하지 말자.","box":[[1480,700,560,440]],"src":["s15p02#6"],"cards":["T0-420","T0-421","T0-422"]},{"sid":"s14","obj":"두 칸 견주기 (되짚기) — 밤: 고리로 묶여 열린 문 · 소금 사태 · 가득 찬 통 · 짜는 접착제 · 붙은 북극곰 / 낮: 햇살 받는 안테나 · 튀는 지게꾼 · 가위 · 빈 통 · 닫힌 문 · 내린 팔 · 매듭 흔드는 북극곰","fact":"어둠 = cGMP↑ · 열림 · 탈분극 · 글루탐산↑ / 빛 = cGMP↓ · 닫힘 · 과분극 · 글루탐산↓","hook":"밤에 바쁘고 낮에 쉰다","say":"밤과 낮의 장면을 한 번 더 비교하자. 밤에는 회색 고리가 가득하고, 고리가 문을 열어 둔다. 소금이 들어와 탈분극하면 지휘자는 접착제를 계속 짜고, 곰은 의자에 붙어 있다. 낮에는 햇빛이 안테나에 닿고 지게꾼이 트램펄린에서 튄다. 가위가 고리를 자르면 통이 비고 문이 닫혀 과분극한다. 지휘자가 팔을 내리자 풀려난 곰이 매듭을 흔든다. 어둠에서는 cGMP가 높고 통로가 열리며 탈분극하고 글루탐산 분비가 많다. 빛에서는 이 변화들이 모두 반대다.","box":[[100,400,910,740],[1140,400,900,740]],"src":["s15p01#0","s15p02#4"],"cards":["T0-400","T0-401","T0-409","T0-410","B0-221#6","B0-221#7","X-SG-3"]}],"cq":{"T0-400":["어두울 때(빛이 없을 때) 간상세포의 막전위 상태는?","탈분극 — Na⁺ 채널이 열려 있다"],"T0-401":["어두울 때 간상세포로 Na⁺이 계속 흘러드는 이 전류의 이름은?","암전류(dark current)"],"T0-409":["빛을 받으면 광수용기는 탈분극하는가, 과분극하는가?","과분극한다"],"T0-410":["어둠과 빛에서 간상세포의 상태를 각각 쓰면?","어둠 — cGMP↑ · Na⁺ 채널 열림 · 탈분극 · 글루탐산 계속 분비 · 빛 — cGMP↓ · 채널 닫힘 · 과분극 · 글루탐산 분비 감소"],"T0-402":["어둠에서 간상세포의 cGMP 농도는 높은가, 낮은가?","높다"],"T0-403":["어둠에서 간상세포의 Na⁺ 채널을 열어 두는 물질은?","cGMP (채널에 직접 붙어 여는 세포내 리간드)"],"T0-404":["간상세포의 Na⁺ 채널은 cGMP가 있을 때 열리는가, 없을 때 열리는가?","있을 때 열린다 — cGMP가 사라지면 닫힌다"],"T0-408":["어둠에서 암전류가 도는 순서를 쓰면?","cGMP 농도가 높다 · Na⁺ 채널이 열린다 · Na⁺ 유입 → 탈분극 · 글루탐산(억제성)을 계속 분비"],"T0-405":["어둠에서 광수용기가 쉬지 않고 분비하고 있는 것은?","신경전달물질 글루탐산"],"T0-406":["광수용기가 내보내는 글루탐산은 다음 세포(쌍극세포)를 흥분시키는가, 억제하는가?","억제한다"],"T0-411":["빛을 받으면 광수용기의 글루탐산 방출은 어떻게 되는가?","억제된다(줄어든다)"],"T0-412":["「광수용기는 어둠에서 더 많은 신경전달물질을 방출한다」는 옳은가?","옳다"],"T0-407":["어두울 때 광수용기는 아무 신호도 보내지 않는 상태인가?","아니다 — 계속 억제 신호를 보내는 중이다"],"T0-414":["빛이 왔을 때 신호가 비로소 뒤로 전달되는 원리는?","억제가 풀려서 — 억제성 전달물질 분비가 줄어드는 것이 곧 신호다"],"X-SG-18":["cGMP를 낮춰 Na⁺ 통로를 닫는 경로의 수용체와 리간드는?","로돕신(GPCR), 리간드=빛 → Gt → PDE → cGMP↓"],"B0-221":["로돕신을 통한 빛 신호 전환(광전환) 경로는?","빛 → 로돕신(GPCR) 활성 → 트랜스듀신(Gt) 활성 → PDE 활성 → cGMP↓ → 양이온(Na⁺) 통로 닫힘 → 과분극"],"B0-221#1":["로돕신을 통한 빛 신호 전환(광전환) 경로는?","빛"],"B0-221#2":["로돕신을 통한 빛 신호 전환(광전환) 경로는?","로돕신(GPCR) 활성"],"T0-419":["암전류가 빛에 꺼지는 순서를 쓰면?","로돕신(광색소) 활성 · 트랜스듀신(Gt) 활성 · PDE 활성 · cGMP 분해 → 농도 급감 · Na⁺ 채널 닫힘 → 과분극"],"T0-431":["간상세포가 가진 광색소는?","로돕신"],"T0-415":["빛을 흡수하면 레티날의 모양은 어떻게 바뀌는가?","11-시스형 → 트랜스형(펴진다)"],"T0-416":["로돕신 안에서 실제로 빛을 흡수하는 부분은?","11-시스 레티날"],"S-SG-10":["같은 GPCR인데 cAMP↑와 cGMP↓로 갈리는 이유(한 축)는?","G단백질이 켜는 효소가 다름: Gs→고리화효소 / Gt→PDE"],"B0-221#3":["로돕신을 통한 빛 신호 전환(광전환) 경로는?","트랜스듀신(Gt) 활성"],"S-SG-9":["경로 골격 대조 — 에피네프린 vs 로돕신의 2차 전령 방향은?","에피네프린=cAMP↑(고리화효소 켬) / 로돕신=cGMP↓(PDE 켬)"],"B0-221#4":["로돕신을 통한 빛 신호 전환(광전환) 경로는?","PDE 활성"],"X-SG-1":["트랜스듀신(Gt)이 활성화하는 효소는?","PDE (← Gs는 아데닐산 고리화효소를 켠다, 혼동 주의)"],"T0-417":["간상체의 광전환에 아데닐 시클라제가 낄 수 없는 이유는?","이 경로의 2차 전달자는 cGMP뿐이고, 방향도 만들기가 아니라 부수기이기 때문"],"X-SG-2":["PDE가 분해·감소시키는 2차 전령은?","cAMP(→AMP), 로돕신 경로에서는 cGMP↓"],"G0-184":["2차 전달자(second messenger)의 대표 예는?","cAMP · cGMP · Ca²⁺ · DAG · IP₃ 등"],"B0-96":["대표적인 2차 신호전달자 5가지는?","cAMP · cGMP · const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID
const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact), st.sid);
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate,
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
</html>
