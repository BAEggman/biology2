<script>
const L = {"id":"L08a","scene":"s08","part":"a","title":"근육 헬스장 ① 세 구역 — 골격근 · 심장근 · 평활근과 Ca²⁺ 를 푸는 세 길","sub":"머리 셋 달린 줄무늬 거인(골격근 · 다핵 · 가로무늬 · 수의) · 펌프로 부푸는 위팔(비대) · D자 손잡이 → 쇠막대를 문 사자 하나(DHP–RyR1 직결) · 잠긴 외부 밸브(골격근 단일 수축은 외부 칼슘 유입 없이 가능) · 푸른 세포외 수로 → D자 통로 → 사자 걸쇠의 방아쇠 자갈 → 저장고의 자갈 소나기(CICR · RyR2) · 고원 선에 튕긴 번개(긴 불응기 · 강축 없음) · 잠든 채 손을 이어 달리는 줄무늬 셋(심장근 · 불수의 · 개재판) · 빈 트로피 받침과 민 옷(평활근 · 트로포닌 없음 · 가로무늬 없음) · 뜬 노인의 자갈 넷 쟁반(칼모듈린) · 빨간 민 도장에 눈뜨는 패드 머리(MLCK · 경사슬 인산화) · 저 혼자 꿈틀대는 창자 관과 방광 풍선(불수의 · 소화관 · 방광) · 노 젓는 사람의 회색 고리가 부풀린 빨간 관(NO → cGMP → 이완 · 운동 때 재분배)","img":"img/L08a.webp?v=9d6977594d83","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"헬스장 한 곳 — 왼쪽 근력 구역 · 가운데 러닝 구역 · 오른쪽 트레이너 구역 · 위 선반엔 금 트로피 둘과 빈 받침 하나 · 바닥 곳곳의 잿빛 자갈 (틀)","fact":"골격근은 DHP–RyR1 기계적 결합 · 심근은 CICR · 평활근은 Ca²⁺–칼모듈린","hook":"근력 = 골격근 · 러닝 = 심장근 · 트레이너 = 평활근 · 자갈 = Ca²⁺","say":"헬스장에 들어섰다. 왼쪽은 근력 구역, 가운데는 러닝 구역, 오른쪽은 트레이너 구역이다. 근력 구역이 골격근, 러닝 구역이 심장근, 트레이너 구역이 평활근이다. 바닥 곳곳의 잿빛 자갈은 이 덱에서 늘 칼슘 이온이다. 세 근육 모두 칼슘이 풀려야 수축하는데, 구역마다 칼슘을 푸는 길이 다르다. 골격근은 손잡이가 창고 문을 곧바로 열고, 심장근은 밖에서 들어온 칼슘이 창고를 열고, 평활근은 트로포닌 없이 칼모듈린이 미오신 쪽을 켠다.","src":["s08u01#0"],"cards":["G0-183"],"box":null},{"sid":"s2","obj":"세 머리 거인이 가로 줄무늬 민소매를 입고 왼손으로 청록 상자의 손잡이를 당긴다.","fact":"골격근 = 가로무늬근 · 수의근 · 여러 세포가 융합한 다핵 세포 · 근절이 줄무늬와 수축 단위","hook":"머리 셋 한 몸 = 융합 · 다핵 · 가로 줄무늬 = 가로무늬(근절) · 제 손으로 당김 = 수의","say":"왼쪽 근력 구역에 머리 셋 달린 거인이 섰다. 세 사람이 한 몸으로 붙었다. 골격근 세포는 발생할 때 여러 세포가 융합해 만들어져, 핵이 여럿인 다핵 세포다. 머리 셋이 그 핵이다. 민소매에는 굵은 가로 줄무늬. 골격근은 가로무늬근이다. 줄무늬는 근절이 줄지어 되풀이되어 생기고, 근절이 수축의 단위다. 거인은 제 손으로 손잡이를 쥐고 당긴다. 마음먹은 대로 움직이는 수의근이다. 다핵, 수의, 근절이 함께 나오면 골격근이다. 근육계를 이루는 대표도 골격근이다.","cards":["G0-36","G0-37","G0-38","G0-50","G0-10"],"box":[55,255,400,420]},{"sid":"s3","obj":"왼쪽 아래 — 꼬마가 자전거 펌프를 눌러 · 회색 호스로 거인의 굵은 위팔에 바람을 넣는다","fact":"어른 근육이 자라는 길 — 세포 수가 늘기보다 있던 세포가 굵어진다(비대)","hook":"펌프로 부풀리는 위팔 = 비대(세포 수가 아니라 크기)","say":"왼쪽 아래에서 꼬마가 자전거 펌프를 누른다. 회색 호스가 거인의 굵은 위팔에 꽂혀 바람을 넣는다. 새 팔이 돋아나는 것이 아니라 있던 팔이 부푼다. 어른이 된 뒤 근육이 커지는 길이 이렇다. 근세포의 수가 늘기보다, 이미 있는 세포가 굵어지는 비대가 중심이다.","cards":["G0-39"],"box":[30,560,170,460]},{"sid":"s4","obj":"거인의 손잡이에 연결된 금빛 반원 고리. 왼쪽은 곧은 등, 오른쪽은 휘어진 D자다. 청록 상자에서 뻗은 쇠막대를 사자 한 마리가 물고 있다.","fact":"골격근 탈분극 → T세관 CaV1.1(DHP) 형태 변화 → 직결된 근소포체 RyR1 개방","hook":"곧은 등과 휘어진 배가 있는 금속 손잡이 = DHP · 사자 한 마리 = RyR1 · 쇠막대 = 물리적 연결","say":"거인이 당기는 손잡이의 금빛 고리를 보자. 곧은 왼쪽 등과 휘어진 오른쪽 배가 DHP의 D 모양이다. T세관막의 CaV1.1은 전압 변화를 감지한다. 청록 상자에서 뻗은 쇠막대를 사자 한 마리가 물었다. 이는 CaV1.1의 형태 변화가 근소포체 막의 RyR1에 기계적으로 전달된다는 단서다. RyR1이 열리고 저장된 칼슘이 세포질로 나온다.","src":["s08u01#1","s08u01#4"],"drop":["G0-183"],"box":[[360,610,180,160],[554,345,233,540]],"ask":"곧은 등과 둥근 배가 있는 손잡이의 이름은? 골격근에서 사자 한 마리의 문은 어떤 연결로 열리는가?","cards":["G0-183#1"]},{"sid":"s5","obj":"사물함 곁 천장에서 내려온 관 — 유리관에 바깥 자갈이 꽉 찼는데 빨간 밸브 바퀴 위에서 멈췄고 · 아래 열린 끝은 텅 비었다","fact":"성숙 골격근의 단일 수축은 세포외 Ca²⁺ 유입 없이도 가능 · 주된 공급원은 근소포체","hook":"잠긴 바깥 밸브와 여전히 자갈을 내보내는 사물함 = 골격근 단일 수축의 주된 Ca²⁺ 공급원은 근소포체","say":"왼쪽 천장 유리관에서 바깥 자갈이 잠긴 빨간 밸브 위에 멈췄다. 그래도 옆 사물함에서 자갈이 나온다. 성숙 골격근의 단일 수축은 CaV1.1에 세포외 칼슘이 흘러들어오지 않아도 일어날 수 있다. 수축을 유발하는 칼슘의 주된 공급원은 근소포체다. 장시간 반복 수축이나 칼슘 항상성에서는 세포외 칼슘의 역할도 있다.","src":["s08u01#2"],"box":[770,175,90,340],"ask":"잠긴 외부 밸브 옆에서도 사물함이 열리는 이유는? 성숙 골격근 단일 수축의 주된 Ca²⁺ 공급원을 말해 보자.","cards":[]},{"sid":"s6","obj":"열린 푸른 수로의 잿빛 자갈이 금빛 D자 손잡이가 달린 투명 상자 안으로 들어온다. 옆 출구 너머의 놋쇠 지렛대 접시에 자갈 한 알이 얹혔다. 그 뒤 사자 두 마리의 열린 입에서 자갈이 한꺼번에 쏟아진다.","fact":"심근 탈분극 → CaV1.2로 외부 Ca²⁺ 유입 → 근소포체 RyR2 개방 → 더 큰 Ca²⁺ 방출","hook":"밖과 이어진 푸른 수로 = T세관 내강 · D자 손잡이의 투명 통로 = CaV1.2 · 지렛대 접시의 자갈 한 알 = 유입된 Ca²⁺가 RyR2를 엶 · 사자 둘의 자갈 소나기 = 근소포체의 큰 Ca²⁺ 방출","say":"사자 둘이 있는 심근 구역에서 잿빛 자갈의 출발점을 두 곳으로 나누어 보자. 첫째, 푸른 물길은 세포 밖과 이어진 T세관 내강이다. 탈분극으로 L형 칼슘 통로 CaV1.2(DHP)가 열리면 소량의 외부 Ca²⁺가 들어온다. 투명 상자 안에서 굽어 옆으로 열린 통로와, 출구가 끝난 뒤의 작은 틈을 따라가자. 둘째, 그 건너편 놋쇠 지렛대의 둥근 접시 위에 자갈 한 알이 있다. 이는 유입된 칼슘이 근소포체 막 RyR2의 세포질 쪽에 결합해 채널을 여는 단서다. 사자 둘의 입에서 쏟아지는 훨씬 많은 자갈은 근소포체에 저장돼 있던 Ca²⁺다. 이것이 세포질로 방출되어 수축을 유도한다. 먼저 유입된 소량의 Ca²⁺가 더 큰 Ca²⁺ 방출을 유도하는 과정을 CICR이라고 한다.","src":["s08u01#5","s08u01#6"],"drop":["G0-183"],"box":[[851,369,59,203],[764,551,152,198],[904,524,104,153],[946,367,207,340]],"ask":"먼저 들어온 자갈과 뒤에 쏟아진 자갈은 각각 어디서 출발해 어떤 통로를 지나 어디에 도착하는가? 두 통로 사이에서 RyR2를 여는 것은 무엇인가?","cards":["G0-183#2"]},{"sid":"s7","obj":"러닝머신 곁 모니터 — 솟았다가 길고 평평하게 이어지다 떨어지는 초록 선 · 평평한 등에 큰 노란 번개가 부딪혀 꺾이고 노란 화살로 튕겨 오른다","fact":"심근 활동전위의 고원기 — 불응기가 수축만큼 길어 강축이 없다","hook":"길고 평평한 선 = 고원기 · 튕겨 나간 번개 = 긴 불응기 · 강축 없음","say":"러닝머신 곁 모니터에 초록 선 하나가 솟았다가 길고 평평하게 이어지다 떨어진다. 심근 활동전위의 고원기다. 들어온 칼슘이 막전위를 한동안 붙든다. 큰 노란 번개가 그 평평한 등에 부딪혀 꺾이고, 노란 화살로 튕겨 나간다. 평평한 동안은 다음 자극이 들어오지 못한다. 불응기가 수축 시간만큼 길어 자극이 겹치지 않으니, 심장근에는 강축이 없다.","src":["s08u01#7"],"box":[1195,330,255,310],"cards":[]},{"sid":"s8","obj":"러닝머신 — 가로 줄무늬 셔츠 셋이 수면 모자를 쓰고 눈 감은 채 나란히 달린다 · 맞잡은 손마다 투명한 관이 손을 잇고 작은 구슬이 오간다","fact":"심장근 = 줄무늬 + 불수의 · 개재판으로 이어져 신호가 건너가 한꺼번에 수축(평활근엔 없음)","hook":"줄무늬 셔츠 = 가로무늬 · 잠든 채 달림 = 불수의 · 손을 잇는 관 = 개재판(간극연접)","say":"러닝머신에서 셋이 나란히 달린다. 셔츠는 가로 줄무늬, 심장근도 가로무늬근이다. 그런데 셋 다 수면 모자를 쓰고 눈을 감았다. 잠든 채 달린다. 뜻과 상관없이 뛰는 불수의근이다. 줄무늬가 있는데 불수의라면 심장근이다. 셋은 손을 맞잡았고, 맞잡은 손마다 투명한 관이 손을 이어 작은 구슬이 오간다. 심근세포를 잇는 개재판, 그 속의 간극연접이다. 신호가 옆 세포로 바로 건너가, 셋이 발을 맞추듯 한꺼번에 규칙적으로 수축한다. 개재판은 심장근에만 있고 평활근에는 없다.","cards":["G0-42","G0-43","G0-49","G0-51","T0-606"],"box":[915,640,540,380]},{"sid":"s9","obj":"오른쪽 트레이너 구역 — 선반 위 트로피 받침 셋 중 이 구역 위만 비었다 · 이 구역 사람들은 모두 줄무늬 없는 민 옷","fact":"평활근 — 트로포닌이 없다(미오신 쪽을 조절) · 필라멘트가 근절로 정렬되지 않아 가로무늬가 없다","hook":"빈 트로피 받침 = 트로포닌 없음 · 민 옷 = 가로무늬 없음","say":"오른쪽 트레이너 구역 위 선반을 보자. 왼쪽 두 구역 위에는 금 트로피가 섰는데, 이 구역 위만 받침이 비었다. 트로피가 트로포닌이다. 평활근의 가는 필라멘트에는 트로포닌이 없다. 그래서 골격근과 심장근은 액틴 쪽을 조절하지만, 평활근은 미오신 쪽을 조절한다. 이 구역 사람들은 모두 줄무늬 없는 민 옷이다. 평활근은 필라멘트가 근절로 정렬되지 않아 가로무늬가 없다.","src":["s08u01#8"],"cards":["T0-600","T0-601","T0-607"],"box":[1555,95,135,85]},{"sid":"s10","obj":"눈 감고 평온하게 공중에 뜬 늙은 트레이너 — 옴폭한 자리 넷에 자갈이 하나씩 박힌 납작한 쟁반을 받쳐 들었고 · 그 곁의 조수가 트레이너에게 손을 뻗는다","fact":"평활근 — Ca²⁺ 넷이 칼모듈린에 붙고 · Ca²⁺-칼모듈린이 MLCK 를 켠다","hook":"평온한(calm) 노인의 모듈 쟁반 = 칼모듈린 · 자갈 넷 = Ca²⁺ 4개 · 조수 = MLCK","say":"늙은 트레이너가 눈을 감고 평온하게 공중에 떴다. 평온, 캄. 그가 받쳐 든 납작한 쟁반이 모듈 쟁반, 칼모듈린이다. 쟁반의 옴폭한 자리 넷에 자갈이 하나씩 박혔다. 칼모듈린은 칼슘 이온 네 개를 붙잡아야 모양이 바뀌어 표적을 잡는다. 그 곁의 조수가 트레이너에게 손을 뻗는다. 칼슘-칼모듈린이 조수, 곧 미오신 경사슬 인산화효소 MLCK 에 붙어 그것을 켠다. 칼슘이 붙어 일하는 표적이 칼모듈린이고, 칼모듈린이 CaM 인산화효소를 켜는 길이 이것이다.","src":["s08u01#9"],"drop":["G0-183"],"box":[1470,280,330,250],"cards":["T0-602","T0-603","S-SG-6","B0-209","G0-183#3","B0-222","X-SG-9"]},{"sid":"s11","obj":"조수가 운동 기구 꼭대기의 둥근 빨간 패드 머리에 빨간 민 도장을 꾹 누르자 · 패드의 얼굴이 눈을 번쩍 뜨고 입을 벌린다","fact":"MLCK 가 미오신 경사슬을 인산화 → 미오신이 켜져 수축 · Ca²⁺ → 칼모듈린 → MLCK → 인산화","hook":"빨간 민 도장 = 인산화 · 패드 머리 = 미오신 머리 · 눈을 뜸 = 켜짐","say":"조수가 운동 기구 꼭대기의 둥근 빨간 패드 머리에 빨간 민 도장을 꾹 누른다. 빨간 민 도장은 이 덱에서 인산화다. 패드 머리가 미오신 머리. 도장이 찍히자 패드의 얼굴이 눈을 번쩍 뜨고 입을 벌린다. MLCK 가 미오신 경사슬에 인산기를 붙이면 미오신이 켜져 수축이 일어난다. 칼슘, 칼모듈린, MLCK, 미오신 경사슬 인산화. 평활근 수축은 이 차례다.","src":["s08u01#10"],"box":[1455,430,215,420],"cards":["T0-604","T0-605"]},{"sid":"s12","obj":"오른쪽 벽 — 창자처럼 꼬인 분홍 관과 방광 같은 분홍 풍선이 · 아무도 만지지 않는데 저 혼자 꿈틀대며 조인다","fact":"평활근 = 불수의 · 소화관 · 방광 · 동맥 벽에 있다 · 위장 운동과 혈관 수축","hook":"저 혼자 꿈틀대는 창자 관 · 방광 풍선 = 불수의 평활근","say":"오른쪽 벽에 창자처럼 꼬인 분홍 관과 방광 같은 분홍 풍선이 걸렸다. 아무도 만지지 않는데 저 혼자 꿈틀대며 조인다. 평활근이다. 소화관, 방광, 동맥의 벽에 있고, 뜻대로 움직일 수 없는 불수의근이다. 위와 장을 꿈틀꿈틀 움직이고, 혈관을 조여 굵기를 바꾼다.","cards":["G0-40","G0-41"],"box":[1850,195,190,460]},{"sid":"s13","obj":"오른쪽 아래 — 노 젓기 기구에서 노 젓는 사람 · 기구 앞 바닥에 굵은 회색 고리가 흩어졌고 · 빨간 관 위 고리 자리에서 관이 풀려 불룩 부풀고 · 빨간 관은 왼쪽 거인의 발치까지 이어진다","fact":"NO → 구아닐릴 고리화효소 → cGMP → 혈관 평활근 이완 · 운동 때 골격근으로 혈류 재분배","hook":"노 젓는 사람 = NO · 회색 고리 = cGMP · 부푼 빨간 관 = 혈관 확장 · 거인 발치로 = 재분배","say":"오른쪽 아래에서 한 사람이 노 젓기 기구로 노를 젓는다. 노 젓는 사람은 이 덱에서 NO, 산화질소다. 기구 앞 바닥에 굵은 회색 고리가 흩어졌다. 회색 고리는 cGMP. NO 는 세포 안에서 구아닐릴 고리화효소를 켜 cGMP 를 만든다. 빨간 관 위의 고리 자리에서 관이 풀려 불룩 부푼다. cGMP 가 혈관 평활근을 이완시켜 혈관이 넓어진다. 수축이 아니라 이완이다. 빨간 관은 왼쪽 거인의 발치까지 이어진다. 운동할 때 세동맥 평활근이 풀려 골격근으로 피가 더 간다.","cards":["T0-608","T0-609","T0-610"],"box":[[1600,700,440,330],[1440,990,600,130],[235,915,140,110]]}],"cq":{"G0-183":["골격근·심장근·평활근의 칼슘 수축 기전 차이는?","골격근=DHP수용체-RyR1 물리적 연결 · 심장근=Ca²⁺ 유입→RyR2(CICR) · 평활근=트로포닌 없이 칼모듈린-MLCK 경로"],"G0-36":["골격근의 별칭 두 가지는?","가로무늬근 · 수의근"],"G0-37":["골격근 세포가 다핵성인 이유는?","발생 과정에서 여러 세포가 융합해     for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact));
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
function speak(t) {
  t = ttsNorm(t);
  const my = ++speakSeq, at = i;
  const advance = (ms) => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, ms);
  if (!('speechSynthesis' in window)) { if (playing) advance(3500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = () => { if (started) advance(700); };
  u.onerror = () => { if (!started) advance(3000); };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started && my === speakSeq) { speechSynthesis.cancel(); advance(3000); } }, 2500);  // 목소리가 없으면 글만 3초
}
function go(k) {
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) setTimeout(() => { if (playing) next(); }, 3500);
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; speechSynthesis && speechSynthesis.cancel(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i + 1); else speechSynthesis && speechSynthesis.cancel(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) speechSynthesis && speechSynthesis.cancel(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
</script>
