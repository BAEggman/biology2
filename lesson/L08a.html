<script>
/* lesson_store.js — 과 목록 · 과 화면이 함께 쓰는 저장 도우미(보기 화면 명세 §1.1).
   빌드(build_lesson.js)가 두 화면에 그대로 끼워 넣는다(__STORE__) — 열쇠 이름 · 꼴이 한 군데서만 정해진다.
   열쇠: lesson_stars {ID: 찍은 때(ms)} · lesson_prefs {onlyStar, autoNext, rep, scope} · lesson_ab_<ID> {a: sid, b: sid}
   읽기 · 쓰기는 모두 try/catch — 저장이 막힌 브라우저에서는 그 쪽을 떠날 때까지만 기억하고 오류를 내지 않는다.
   (lesson_<ID> · lesson_shuffle · lesson_srs_inbox · lesson_auto_start 는 여기서 건드리지 않는다) */
const LStore = (() => {
  const mem = {};
  const rd = (k, d) => {
    let ok = false;
    try { const v = localStorage.getItem(k); ok = true; if (v !== null && v !== undefined) { const o = JSON.parse(v); mem[k] = o; return o; } } catch (e) {}
    if (ok) { delete mem[k]; return d; }   // 저장소는 멀쩡한데 값이 없다 = 다른 탭에서 지웠다 — 메모리 값도 버린다
    return k in mem ? mem[k] : d;
  };
  const wr = (k, o) => { mem[k] = o; try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) {} };
  const del = k => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} };
  const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
  const REP = ['off', 'ab', 'one', 'list'];
  return {
    stars() { const s = rd('lesson_stars', {}); return isObj(s) ? s : {}; },
    isStar(id) { return id in LStore.stars(); },
    setStar(id, on) {
      const s = { ...LStore.stars() };
      if (on) s[id] = Date.now(); else delete s[id];
      if (Object.keys(s).length) wr('lesson_stars', s); else del('lesson_stars');
      return on;
    },
    prefs() {
      const p = rd('lesson_prefs', {}); const o = isObj(p) ? p : {};
      return { onlyStar: !!o.onlyStar, autoNext: !!o.autoNext, rep: REP.includes(o.rep) ? o.rep : 'off', scope: o.scope === 'star' ? 'star' : 'all' };
    },
    setPrefs(patch) { const p = { ...LStore.prefs(), ...patch }; wr('lesson_prefs', p); return p; },
    ab(id) { const v = rd('lesson_ab_' + id, null); return isObj(v) ? { a: typeof v.a === 'string' ? v.a : null, b: typeof v.b === 'string' ? v.b : null } : { a: null, b: null }; },
    setAb(id, v) { const k = 'lesson_ab_' + id; if (v && (v.a || v.b)) wr(k, { a: v.a || null, b: v.b || null }); else del(k); },
    REP,
  };
})();

const L = {"id":"L08a","scene":"s08","part":"a","title":"근육 헬스장 ① 세 구역 — 골격근 · 심장근 · 평활근과 Ca²⁺ 를 푸는 세 길","sub":"머리 셋 달린 줄무늬 거인(골격근 · 다핵 · 가로무늬 · 수의) · 펌프로 부푸는 위팔(비대) · D자 손잡이 → 쇠막대를 문 사자 하나(DHP–RyR1 직결) · 잠긴 외부 밸브(골격근 단일 수축은 외부 칼슘 유입 없이 가능) · 푸른 세포외 수로 → D자 통로 → 사자 걸쇠의 방아쇠 자갈 → 저장고의 자갈 소나기(CICR · RyR2) · 고원 선에 튕긴 번개(긴 불응기 · 강축 없음) · 잠든 채 손을 이어 달리는 줄무늬 셋(심장근 · 불수의 · 개재판) · 빈 트로피 받침과 민 옷(평활근 · 트로포닌 없음 · 가로무늬 없음) · 뜬 노인의 자갈 넷 쟁반(칼모듈린) · 빨간 민 도장에 눈뜨는 패드 머리(MLCK · 경사슬 인산화) · 저 혼자 꿈틀대는 창자 관과 방광 풍선(불수의 · 소화관 · 방광) · 노 젓는 사람의 회색 고리가 부풀린 빨간 관(NO → cGMP → 이완 · 운동 때 재분배)","img":"img/L08a.webp?v=9d6977594d83","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"헬스장 한 곳 — 왼쪽 근력 구역 · 가운데 러닝 구역 · 오른쪽 트레이너 구역 · 위 선반엔 금 트로피 둘과 빈 받침 하나 · 바닥 곳곳의 잿빛 자갈 (틀)","fact":"골격근은 DHP–RyR1 기계적 결합 · 심근은 CICR · 평활근은 Ca²⁺–칼모듈린","hook":"근력 = 골격근 · 러닝 = 심장근 · 트레이너 = 평활근 · 자갈 = Ca²⁺","say":"헬스장 안을 세 구역으로 나누어 보자. 왼쪽 근력 구역은 골격근, 가운데 러닝 구역은 심장근, 오른쪽 트레이너 구역은 평활근이다. 바닥 곳곳의 잿빛 자갈은 이 덱에서 칼슘 이온을 뜻한다. 세 근육 모두 칼슘이 풀려야 수축하지만, 칼슘을 푸는 방법은 다르다. 골격근에서는 손잡이가 창고 문을 직접 열고, 심장근에서는 밖에서 들어온 칼슘이 창고를 연다. 평활근에서는 트로포닌 없이 칼모듈린이 미오신 쪽을 켠다.","src":["s08u01#0"],"cards":["G0-183"],"box":null},{"sid":"s2","obj":"세 머리 거인이 가로 줄무늬 민소매를 입고 왼손으로 청록 상자의 손잡이를 당긴다.","fact":"골격근 = 가로무늬근 · 수의근 · 여러 세포가 융합한 다핵 세포 · 근절이 줄무늬와 수축 단위","hook":"머리 셋 한 몸 = 융합 · 다핵 · 가로 줄무늬 = 가로무늬(근절) · 제 손으로 당김 = 수의","say":"왼쪽 근력 구역의 거인은 세 사람이 한 몸으로 붙은 듯 머리가 셋이다. 골격근 세포는 발생 과정에서 여러 세포가 융합해 만들어지므로 핵이 여러 개인 다핵 세포다. 머리 셋이 그 핵을 나타낸다. 민소매의 굵은 가로 줄무늬도 보자. 골격근은 가로무늬근이며, 이 무늬는 수축 단위인 근절이 반복되어 생긴다. 거인이 자기 손으로 손잡이를 잡아당기는 모습은 의지대로 움직이는 수의근이라는 뜻이다. 다핵·수의·근절을 함께 떠올리면 골격근이다. 근육계를 이루는 대표적인 근육도 골격근이다.","cards":["G0-36","G0-37","G0-38","G0-50","G0-10"],"box":[55,255,400,420]},{"sid":"s3","obj":"왼쪽 아래 — 꼬마가 자전거 펌프를 눌러 · 회색 호스로 거인의 굵은 위팔에 바람을 넣는다","fact":"어른 근육이 자라는 길 — 세포 수가 늘기보다 있던 세포가 굵어진다(비대)","hook":"펌프로 부풀리는 위팔 = 비대(세포 수가 아니라 크기)","say":"왼쪽 아래의 꼬마가 자전거 펌프를 누른다. 거인의 굵은 위팔에 꽂힌 회색 호스를 통해 바람이 들어간다. 새 팔이 생기는 대신 원래 있던 팔이 부푼다. 성인이 된 뒤 근육이 커질 때도 근세포 수의 증가보다는 기존 세포가 굵어지는 비대가 중심이다.","cards":["G0-39"],"box":[30,560,170,460]},{"sid":"s4","obj":"거인의 손잡이에 연결된 금빛 반원 고리. 왼쪽은 곧은 등, 오른쪽은 휘어진 D자다. 청록 상자에서 뻗은 쇠막대를 사자 한 마리가 물고 있다.","fact":"골격근 탈분극 → T세관 CaV1.1(DHP) 형태 변화 → 직결된 근소포체 RyR1 개방","hook":"곧은 등과 휘어진 배가 있는 금속 손잡이 = DHP · 사자 한 마리 = RyR1 · 쇠막대 = 물리적 연결","say":"거인이 당기는 손잡이의 금빛 고리를 보자. 곧은 왼쪽 등과 휜 오른쪽 배가 DHP의 D 모양이다. T세관막의 CaV1.1이 전압 변화를 감지하는 단서다. 청록 상자에서 나온 쇠막대를 사자 한 마리가 물고 있다. CaV1.1의 형태 변화가 근소포체 막의 RyR1에 기계적으로 전달되는 관계다. RyR1이 열리면 저장된 칼슘이 세포질로 방출된다.","src":["s08u01#1","s08u01#4"],"drop":["G0-183"],"ask":"곧은 등과 둥근 배가 있는 손잡이의 이름은? 골격근에서 사자 한 마리의 문은 어떤 연결로 열리는가?","box":[[360,610,180,160],[554,345,233,540]],"cards":["G0-183#1"]},{"sid":"s5","obj":"사물함 곁 천장에서 내려온 관 — 유리관에 바깥 자갈이 꽉 찼는데 빨간 밸브 바퀴 위에서 멈췄고 · 아래 열린 끝은 텅 비었다","fact":"성숙 골격근의 단일 수축은 세포외 Ca²⁺ 유입 없이도 가능 · 주된 공급원은 근소포체","hook":"잠긴 바깥 밸브와 여전히 자갈을 내보내는 사물함 = 골격근 단일 수축의 주된 Ca²⁺ 공급원은 근소포체","say":"왼쪽 천장 유리관에서 내려오던 바깥 자갈은 잠긴 빨간 밸브에 막혀 있다. 그런데도 옆 사물함에서는 자갈이 나온다. 성숙 골격근의 단일 수축은 CaV1.1을 통한 세포외 칼슘 유입 없이도 일어날 수 있다. 수축을 일으키는 칼슘은 주로 근소포체에서 공급된다. 다만 장시간 반복되는 수축이나 칼슘 항상성에는 세포외 칼슘도 역할을 한다.","src":["s08u01#2"],"ask":"잠긴 외부 밸브 옆에서도 사물함이 열리는 이유는? 성숙 골격근 단일 수축의 주된 Ca²⁺ 공급원을 말해 보자.","box":[770,175,90,340],"cards":[]},{"sid":"s6","obj":"열린 푸른 수로의 잿빛 자갈이 금빛 D자 손잡이가 달린 투명 상자 안으로 들어온다. 옆 출구 너머의 놋쇠 지렛대 접시에 자갈 한 알이 얹혔다. 그 뒤 사자 두 마리의 열린 입에서 자갈이 한꺼번에 쏟아진다.","fact":"심근 탈분극 → CaV1.2로 외부 Ca²⁺ 유입 → 근소포체 RyR2 개방 → 더 큰 Ca²⁺ 방출","hook":"밖과 이어진 푸른 수로 = T세관 내강 · D자 손잡이의 투명 통로 = CaV1.2 · 지렛대 접시의 자갈 조금 = 유입된 Ca²⁺가 RyR2를 엶 · 사자 둘의 자갈 소나기 = 근소포체의 큰 Ca²⁺ 방출","say":"사자 둘이 있는 심근 구역에서는 자갈이 어디서 오는지 두 곳으로 나누어 보자. 첫째, 푸른 물길은 세포 밖과 연결된 T세관 내강이다. 탈분극으로 L형 칼슘 통로 CaV1.2(DHP)가 열리면 소량의 외부 Ca²⁺가 들어온다. 투명 상자 안에서 굽어 옆으로 열린 통로를 따라, 출구 뒤의 작은 틈까지 눈을 옮기자. 둘째, 그 건너편 놋쇠 지렛대의 둥근 접시에는 자갈이 조금 놓여 있다. 유입된 칼슘이 근소포체 막 RyR2의 세포질 쪽에 결합해 채널을 여는 단서다. 사자 둘의 입에서 쏟아지는 훨씬 많은 자갈은 근소포체에 저장된 Ca²⁺이다. 이 칼슘이 세포질로 방출되면서 수축을 유도한다. 먼저 들어온 소량의 Ca²⁺가 더 큰 Ca²⁺ 방출을 일으키는 과정이 CICR이다.","src":["s08u01#5","s08u01#6"],"drop":["G0-183"],"ask":"먼저 들어온 자갈과 뒤에 쏟아진 자갈은 각각 어디서 출발해 어떤 통로를 지나 어디에 도착하는가? 두 통로 사이에서 RyR2를 여는 것은 무엇인가?","box":[[851,369,59,203],[764,551,152,198],[904,524,104,153],[946,367,207,340]],"cards":["G0-183#2"]},{"sid":"s7","obj":"러닝머신 곁 모니터 — 솟았다가 길고 평평하게 이어지다 떨어지는 초록 선 · 평평한 등에 큰 노란 번개가 부딪혀 꺾이고 노란 화살로 튕겨 오른다","fact":"심근 활동전위의 고원기 — 불응기가 수축만큼 길어 강축이 없다","hook":"길고 평평한 선 = 고원기 · 튕겨 나간 번개 = 긴 불응기 · 강축 없음","say":"러닝머신 옆 모니터의 초록 선은 솟아오른 뒤 길고 평평하게 이어지다가 떨어진다. 심근 활동전위의 고원기다. 유입된 칼슘이 막전위를 한동안 유지한다. 큰 노란 번개가 평평한 부분에 부딪혀 꺾이고 노란 화살로 튕겨 나가는 모습도 보자. 그동안 다음 자극이 들어오지 못한다는 뜻이다. 불응기가 수축 시간만큼 길어서 자극이 겹치지 않으므로 심장근에는 강축이 없다.","src":["s08u01#7"],"box":[1195,330,255,310],"cards":[]},{"sid":"s8","obj":"러닝머신 — 가로 줄무늬 셔츠 셋이 수면 모자를 쓰고 눈 감은 채 나란히 달린다 · 맞잡은 손마다 투명한 관이 손을 잇고 작은 구슬이 오간다","fact":"심장근 = 줄무늬 + 불수의 · 개재판으로 이어져 신호가 건너가 한꺼번에 수축(평활근엔 없음)","hook":"줄무늬 셔츠 = 가로무늬 · 잠든 채 달림 = 불수의 · 손을 잇는 관 = 개재판(간극연접)","say":"러닝머신에서 나란히 달리는 세 사람의 셔츠에도 가로 줄무늬가 있다. 심장근 역시 가로무늬근이다. 하지만 모두 수면 모자를 쓰고 눈을 감은 채 달린다. 의지와 관계없이 움직이는 불수의근이라는 뜻이다. 가로무늬가 있으면서 불수의근이면 심장근을 떠올리자. 맞잡은 손마다 투명한 관이 이어져 작은 구슬이 오간다. 심근세포를 연결하는 개재판과 그 안의 간극연접이다. 신호가 이웃 세포로 직접 전달되므로 발을 맞추듯 함께 규칙적으로 수축한다. 개재판은 심장근에만 있으며 평활근에는 없다.","cards":["G0-42","G0-43","G0-49","G0-51","T0-606"],"box":[915,640,540,380]},{"sid":"s9","obj":"오른쪽 트레이너 구역 — 선반 위 트로피 받침 셋 중 이 구역 위만 비었다 · 이 구역 사람들은 모두 줄무늬 없는 민 옷","fact":"평활근 — 트로포닌이 없다(미오신 쪽을 조절) · 필라멘트가 근절로 정렬되지 않아 가로무늬가 없다","hook":"빈 트로피 받침 = 트로포닌 없음 · 민 옷 = 가로무늬 없음","say":"오른쪽 트레이너 구역 위의 선반을 보자. 왼쪽 두 구역에는 금 트로피가 있지만 이곳에는 빈 받침만 있다. 트로피는 트로포닌이다. 평활근의 가는 필라멘트에는 트로포닌이 없다. 그래서 골격근과 심장근은 액틴 쪽을 조절하는 반면, 평활근은 미오신 쪽을 조절한다. 이 구역 사람들이 모두 입은 민무늬 옷도 연결하자. 평활근은 필라멘트가 근절로 정렬되지 않아 가로무늬가 없다.","src":["s08u01#8"],"cards":["T0-600","T0-601","T0-607"],"box":[1555,95,135,85]},{"sid":"s10","obj":"눈 감고 평온하게 공중에 뜬 늙은 트레이너 — 옴폭한 자리 넷에 자갈이 하나씩 박힌 납작한 쟁반을 받쳐 들었고 · 그 곁의 조수가 트레이너에게 손을 뻗는다","fact":"평활근 — Ca²⁺ 넷이 칼모듈린에 붙고 · Ca²⁺-칼모듈린이 MLCK 를 켠다","hook":"평온한(calm) 노인의 모듈 쟁반 = 칼모듈린 · 자갈 넷 = Ca²⁺ 4개 · 조수 = MLCK","say":"늙은 트레이너는 눈을 감고 평온하게 공중에 떠 있다. 평온함의 캄과 손에 받친 납작한 모듈 쟁반을 연결해 칼모듈린을 떠올리자. 쟁반의 오목한 자리 넷에는 자갈이 하나씩 박혀 있다. 칼모듈린은 칼슘 이온 네 개를 붙잡아야 모양이 바뀌어 표적을 잡는다. 옆에서 조수가 트레이너에게 손을 뻗는다. 칼슘-칼모듈린이 미오신 경사슬 인산화효소 MLCK에 결합해 활성화하는 모습이다. 칼슘이 결합해 작용하는 표적은 칼모듈린이고, 칼모듈린이 CaM 인산화효소를 켜는 길이 여기에 표현되어 있다.","src":["s08u01#9"],"drop":["G0-183"],"box":[1470,280,330,250],"cards":["T0-602","T0-603","S-SG-6","B0-209","G0-183#3","B0-222","X-SG-9"]},{"sid":"s11","obj":"조수가 운동 기구 꼭대기의 둥근 빨간 패드 머리에 빨간 민 도장을 꾹 누르자 · 패드의 얼굴이 눈을 번쩍 뜨고 입을 벌린다","fact":"MLCK 가 미오신 경사슬을 인산화 → 미오신이 켜져 수축 · Ca²⁺ → 칼모듈린 → MLCK → 인산화","hook":"빨간 민 도장 = 인산화 · 패드 머리 = 미오신 머리 · 눈을 뜸 = 켜짐","say":"조수가 운동 기구 꼭대기의 둥근 빨간 패드 머리에 빨간 민 도장을 꾹 누른다. 이 덱에서 빨간 민 도장은 인산화, 패드 머리는 미오신 머리다. 도장이 찍히자 패드의 얼굴이 눈을 번쩍 뜨고 입을 벌린다. MLCK가 미오신 경사슬에 인산기를 붙이면 미오신이 활성화되어 수축한다. 평활근 수축의 순서를 칼슘 → 칼모듈린 → MLCK → 미오신 경사슬 인산화로 연결하자.","src":["s08u01#10"],"box":[1455,430,215,420],"cards":["T0-604","T0-605"]},{"sid":"s12","obj":"오른쪽 벽 — 창자처럼 꼬인 분홍 관과 방광 같은 분홍 풍선이 · 아무도 만지지 않는데 저 혼자 꿈틀대며 조인다","fact":"평활근 = 불수의 · 소화관 · 방광 · 동맥 벽에 있다 · 위장 운동과 혈관 수축","hook":"저 혼자 꿈틀대는 창자 관 · 방광 풍선 = 불수의 평활근","say":"오른쪽 벽의 창자처럼 꼬인 분홍 관과 방광 모양의 분홍 풍선을 보자. 아무도 만지지 않는데 저절로 꿈틀거리며 조다. 소화관·방광·동맥의 벽에 있는 평활근이다. 의지대로 움직일 수 없는 불수의근으로, 위와 장을 움직이고 혈관을 조여 굵기를 바꾼다.","cards":["G0-40","G0-41"],"box":[1850,195,190,460]},{"sid":"s13","obj":"오른쪽 아래 — 노 젓기 기구에서 노 젓는 사람 · 기구 앞 바닥에 굵은 회색 고리가 흩어졌고 · 빨간 관 위 고리 자리에서 관이 풀려 불룩 부풀고 · 빨간 관은 왼쪽 거인의 발치까지 이어진다","fact":"NO → 구아닐릴 고리화효소 → cGMP → 혈관 평활근 이완 · 운동 때 골격근으로 혈류 재분배","hook":"노 젓는 사람 = NO · 회색 고리 = cGMP · 부푼 빨간 관 = 혈관 확장 · 거인 발치로 = 재분배","say":"오른쪽 아래에서 노 젓기 기구로 노를 젓는 사람을 보자. 이 덱에서 노 젓는 사람은 NO, 산화질소다. 기구 앞 바닥에 흩어진 굵은 회색 고리는 cGMP이다. NO는 세포 안의 구아닐릴 고리화효소를 활성화해 cGMP를 만든다. 빨간 관 위의 고리가 놓인 자리에서 관이 풀려 부풀어 있다. cGMP가 혈관 평활근을 이완시켜 혈관을 넓힌다는 뜻이다. 수축과 구별하자. NO는 NOS가 아르기닌에서 만든다. 구아닐산 고리화효소 → cGMP → 동맥벽 근육 이완의 경로는 비아그라가 이용하는 경로이기도 하다. 여기서 이완과 연결할 2차 전령은 cAMP가 아니라 cGMP이다. 빨간 관이 왼쪽 거인의 발치까지 이어지는 것도 보자. 운동 중에는 세동맥 평활근이 이완되어 골격근으로 가는 혈류가 늘어난다.","cards":["T0-608","T0-609","T0-610","B0-111","B0-112","B0-210","X-SG-19","X-SG-20"],"box":[[1600,700,440,330],[1440,990,600,130],[235,915,140,110]]}],"cq":{"G0-183":["골격근·심장근·평활근의 칼슘 수축 기전 차이는?","골격근=DHP수용체-RyR1 물리적 연결 · 심장근=Ca²⁺ 유입→RyR2(CICR) · 평활근=트로포닌 없이 칼모듈린-MLCK 경로"],"G0-36":["골격근의 별칭 두 가지는?","가로무늬근 · 수의근"],"G0-37":["골격근 세포가 다핵성인 이유는?","발생 과정에서 여러 세포가 융합해 형성되기 때문이다"],"G0-38":["근절(sarcomere)이 중요한 이유는?","골격근의 줄무늬와 수축 단위의 기초이기 때문이다"],"G0-50":["문제에서 '다핵성, 수의적, 근절'이 같이 나오면 어떤 근육인가?","골격근"],"G0-10":["근육계의 대표 구성은?","골격근"],"G0-39":["성체에서 근육 발달의 기본 방식은?","세포 수 증가보다 기존 세포 비대가 중심이다"],"G0-183#1":["골격근·심장근·평활근의 칼슘 수축 기전 차이 — 「골격근」? (↔ 심장근 vs 평활근)","DHP수용체-RyR1 물리적 연결"],"G0-183#2":["골격근·심장근·평활근의 칼슘 수축 기전 차이 — 「심장근」? (↔ 골격근 vs 평활근)","Ca²⁺ 유입→RyR2(CICR)"],"G0-42":["심장근의 특징 두 가지는?","줄무늬가 있고 불수의적이다"],"G0-43":["심장근의 개재판(intercalated disc)이 중요한 이유는?","세포 간 신호 전달로 규칙적인 수축을 가능하게 하기 때문이다"],"G0-49":["문제에서 '줄무늬는 있지만 불수의적'이면 어떤 근육인가?","심장근"],"G0-51":["문제에서 '개재판'이 나오면 어떤 조직을 떠올려야 하는가?","심장근"],"T0-606":["개재판(윤반, intercalated disc)을 가진 근육은?","심근 (평활근에는 없다)"],"T0-600":["평활근의 가는 필라멘트에 없는 조절단백질은?","트로포닌 (액틴·트로포미오신은 있다)"],"T0-601":["골격근·심장근과 평활근은 각각 어느 필라멘트 쪽을 조절하는가?","골격근·심장근=액틴(가는 필라멘트) / 평활근=미오신(굵은 필라멘트)"],"T0-607":["평활근에 가로무늬가 없는 이유는?","필라멘트가 근절로 정렬되지 않기 때문"],"T0-602":["평활근에서 칼슘이 트로포닌 대신 결합하는 단백질은?","칼모듈린"],"T0-603":["평활근에서 칼슘-칼모듈린이 켜는 효소는?","MLCK (미오신 경사슬 인산화효소)"],"S-SG-6":["2차 전령별 표적(cAMP / DAG / IP₃ / Ca²⁺)은?","PKA / PKC / ER Ca²⁺ 방출 / 칼모듈린·CaM 인산화효소"],"B0-209":["칼모듈린(calmodulin)이란?","Ca²⁺과 결합해 표적 효소(예: CaM 인산화효소)를 활성화하는 Ca²⁺ 수용 단백질"],"G0-183#3":["골격근·심장근·평활근의 칼슘 수축 기전 차이 — 「평활근」? (↔ 골격근 vs 심장근)","트로포닌 없이 칼모듈린-MLCK 경로"],"B0-222":["칼모듈린(calmodulin) 한 분자가 결합하는 Ca²⁺ 수는?","4개"],"X-SG-9":["Ca²⁺과 결합해 CaM 인산화효소를 켜는 단백질과 결합 Ca²⁺ 수는?","칼모듈린, Ca²⁺ 4개"],"T0-604":["평활근에서 MLCK가 인산기를 찍는 자리는?","미오신 경사슬"],"T0-605":["평활근 수축 경로를 칼슘부터 순서대로 쓰면?","Ca²⁺ · 칼모듈린 · MLCK · 미오신 경사슬 인산화"],"G0-40":["평활근의 특징은?","불수의적이며 소화관·방광·동맥 벽 등에 존재한다"],"G0-41":["평활근의 대표 기능은?","위장운동과 혈관 수축"],"T0-608":["NO는 혈관 평활근을 수축시키는가, 이완시키는가?","이완 — 혈관이 넓어져 혈류가 는다"],"T0-609":["NO가 세포 안에서 활성화하는 효소는?","구아닐릴 고리화효소(guanylyl cyclase) → cGMP"],"T0-610":["운동할 때 골격근으로 혈류가 늘도록 혈액을 재분배하는 것은?","세동맥 평활근의 이완(혈관 확장)"],"B0-111":["비아그라 관련 문맥에서 산화질소(NO)가 유도하는 것은?","cGMP 생성"],"B0-112":["cGMP가 2차 전달자로 작용하는 결과는?","동맥벽 근육 이완"],"B0-210":["NO(산화질소)의 합성과 작용 기전은?","아르기닌에서 NOS로 합성 → 구아닐산고리화효소 활성화 → cGMP↑ → 혈관 평활근 이완"],"X-SG-19":["동맥벽·혈관 평활근을 이완시키는 2차 전령은?","cGMP (NO 경로) (← cAMP와 혼동 주의)"],"X-SG-20":["NO는 무엇으로부터 어떤 효소로 합성되고, 무엇을 켜는가?","아르기닌에서 NOS로 합성 → 구아닐산 고리화효소 → cGMP↑"]},"hubPanel":"s08u01"};

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}

$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
</html>
