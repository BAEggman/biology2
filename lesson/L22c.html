const L = {"id":"L22c","scene":"s22","part":"c","title":"자루를 실으면 물이 따라 든다 — 체관 압류설","sub":"큰 잎 아래 자루 밀어 넣기(공급원 · 능동 적재) · 쇠살문으로 빨려 드는 도랑물(Ψs ↓ · 삼투) · 빵빵한 항아리 끝(양압) · 옆구리로 꺼내기(하역) · 가는 끝(압력 ↓) · 부푼 쪽 → 가는 쪽(압류설) · 받는 통 넷(뿌리 · 열매 · 덩이줄기 · 어린 잎) · 같은 모양 큰 잎 · 작은 잎(역할 이름)","img":"img/L22c.webp?v=e9b24dbfd3b9","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"풀밭을 가로지르는 분홍 관 하나 — 왼쪽 끝은 항아리처럼 부풀었고 오른쪽 끝은 가늘다 · 입을 묶은 갈색 자루들이 물에 떠 왼쪽에서 오른쪽으로","fact":"체관 수송 = 압류설 — 당을 싣는 곳(공급원)에서 내리는 곳(수용부)으로 압력차로 흐른다","hook":"부푼 쪽에서 가는 쪽으로","say":"풀밭에 길게 누운 분홍색 관은 체관이다. 앞면을 잘라 속이 보이고, 물에 뜬 자루들이 왼쪽에서 오른쪽으로 밀려간다. 왼쪽 끝은 항아리처럼 부풀어 있지만 오른쪽 끝은 가늘게 보인다. 체관 수송의 압류설을 나타낸다. 당을 싣는 공급원에서 당을 내리는 수용부로, 압력차를 따라 흐르는 것이다.","box":null,"src":["s22p02b#5"],"cards":["O1-25#5","O1-23","O1-25"]},{"sid":"s2","obj":"왼쪽 — 다 자란 큰 잎이 떠 있는 쪽에서 인부 둘이 자루를 관 입구로 힘껏 밀어 넣는다","fact":"공급원은 다 자란 잎 · 당을 능동수송으로 체관에 싣는다(능동 적재 — 대표)","hook":"힘껏 밀어 넣는다 = 능동 적재","say":"왼쪽에서 다 자란 큰 잎이 떠 있는 쪽을 보자. 인부 둘이 자루를 관 입구에 힘껏 밀어 넣는다. 공급원인 성숙한 잎은 자신에게 필요한 양보다 많은 당을 만들어 내보내는 쪽이다. 입을 묶은 갈색 자루는 당이고, 밀어 넣는 힘은 능동수송이다. 입이 열려 흰 소금이 보이는 나트륨 자루와 구별하자. 이 그림은 당을 힘들여 싣는 능동 적재다. 인부들의 힘주는 동작과 연결하자. 다만 일부 식물은 원형질연락사로 당을 농도 차에 따라 싣는 수동 적재를 하기도 한다.","box":[[300,40,620,260],[40,580,360,360]],"src":["s22p02b#0"],"cards":["O1-24#1","O1-25#1"]},{"sid":"s3","obj":"자루로 꽉 찬 항아리 밑 쇠살문으로 물이 빨려 든다 — 물 화살표는 모두 관 쪽","fact":"당이 실리면 체관 용질 퍼텐셜 ↓ → 물이 삼투로 들어온다(당은 물을 부르는 미끼)","hook":"입 묶은 당 자루가 물을 부른다","say":"자루가 가득한 항아리 밑 쇠살문으로 물이 빨려 들어간다. 물 화살표가 모두 관 안쪽을 향한다. 당이 실려 농도가 높아지면 용질 퍼텐셜이 낮아지고, 물이 삼투로 들어온다. 자루가 직접 물을 밀어내는 것이 아니라 물을 불러들이는 미끼 역할이라는 점을 기억하자.","box":[[480,760,260,160],[0,820,420,320]],"src":["s22p02b#1"],"cards":["O1-25#2","O1-25#3"]},{"sid":"s4","obj":"왼쪽 끝이 항아리처럼 빵빵하게 부풀어 자루와 물로 꽉 찼다","fact":"들어찬 물이 압력을 올린다 — 체관은 양압(물관의 음압과 반대) · Ψp 는 양 · 음 모두 가능","hook":"빵빵한 항아리 = 양압","say":"왼쪽 끝이 자루와 물로 차서 항아리처럼 빵빵해졌다. 들어온 물이 압력을 올리므로 체관은 양압이다. 위에서 당기는 물관의 음압과 반대다. 압력 퍼텐셜은 양수가 될 수도, 음수가 될 수도 있다. 살아 있는 세포의 팽압은 양의 압력, 죽은 물관의 장력은 음의 압력과 연결하자.","box":[260,380,560,480],"src":["s22p02b#2"],"cards":["O1-25#4","O1-9"]},{"sid":"s5","obj":"오른쪽 — 관 옆구리의 작은 창에서 자루가 빠져나와 쏟아지고 · 인부가 꺼낸 자루를 받아 든다","fact":"수용부에서 당을 내린다(하역) — 내려 쓰거나 쌓아 둔다","hook":"옆구리로 꺼내 비운다 = 하역","say":"오른쪽 관 옆구리의 작은 창에서 자루가 빠져나와 쏟아진다. 인부가 그 자루를 받아 든다. 당을 내리는 하역 과정이다. 수용부는 전달받은 당을 사용하거나 저장한다.","box":[[1240,560,500,280],[1580,560,240,280]],"src":["s22p02b#3"],"cards":["O1-25#6"]},{"sid":"s6","obj":"오른쪽 관은 부풀지 않고 끝까지 가늘다 — 같은 굵기로 가다 둥글게 막혔다","fact":"하역하면 물도 따라 빠져 압력이 내려간다(하역이 압력을 올린다 = 오답)","hook":"가는 끝 = 낮은 압력","say":"오른쪽 관은 왼쪽처럼 부풀지 않고 가늘게 이어져, 끝이 둥글게 막혀 있다. 자루를 내리는 곳은 관 끝이 아니라 옆구리다. 당을 내리면 물도 빠져나가 압력이 낮아진다. 하역이 압력을 높인다는 설명과 혼동하지 말자.","box":[1200,500,800,200],"src":["s22p02b#4"],"cards":["O1-25#7"]},{"sid":"s7","obj":"관 속 자루들이 부푼 왼쪽에서 가는 오른쪽으로 밀려간다 — 굵기 차이가 곧 압력차","fact":"압류설 — 적재 → Ψs ↓ → 물 유입 → 압력 ↑ → 압력차로 흐름 → 하역 → 압력 ↓","hook":"한 바퀴: 싣고 · 부르고 · 붓고 · 흐르고 · 내린다","say":"관 안의 자루는 부푼 왼쪽에서 가는 오른쪽으로 이동한다. 이 그림에서는 관의 굵기 차이를 압력차의 단서로 사용한다. 압류설의 순서를 이어 보자. 당을 싣고, 용질 퍼텐셜이 낮아지며, 물이 들어와 압력이 올라간다. 그러면 압력차를 따라 흐르고, 수용부에서 당을 내리면 압력이 낮아진다.","box":[600,520,700,180],"src":["s22p02b#5"],"cards":["O1-25#5","O1-23","O1-25"]},{"sid":"s8","obj":"오른쪽 아래 받는 통 넷 — 굵은 뿌리 다발 · 붉은 열매 · 울퉁불퉁한 덩이줄기 · 아주 작은 새싹들","fact":"수용부 = 뿌리 · 열매 · 어린 잎 · 덩이줄기(당을 쓰거나 저장하는 쪽)","hook":"받는 통 넷","say":"오른쪽 아래에서 자루가 쏟아지는 받는 통 네 개를 보자. 굵은 뿌리 다발, 붉은 열매, 울퉁불퉁한 덩이줄기, 작은 새싹이다. 수용부는 당을 소비하거나 저장하는 뿌리, 열매, 덩이줄기, 어린 잎이다. 세 가지만 외우다가 어린 잎을 빠뜨리지 않도록 새싹까지 함께 짚어 보자.","box":[1060,800,960,280],"src":["s22p02b#6"],"cards":["O1-24#2"]},{"sid":"s9","obj":"왼쪽 위 큰 잎과 오른쪽 위 작은 잎 — 크기만 다르고 모양은 똑같다","fact":"같은 잎도 다 자라면 주고 어리면 받는다 — 공급원 · 수용부는 역할 이름","hook":"같은 잎 · 다른 역할","say":"왼쪽 위 큰 잎과 오른쪽 위 작은 잎은 크기만 다르고 모양은 같다. 같은 잎이라도 성숙한 잎은 당을 보내고, 어린 잎은 당을 받는다. 공급원과 수용부는 고정된 장소의 이름이 아니라 그때의 역할을 나타낸다. 봄에 싹을 틔우는 덩이줄기처럼, 상황에 따라 역할이 바뀔 수도 있다.","box":[[300,40,620,260],[1400,160,280,160]],"src":["s22p02b#7"],"cards":["O1-24"]}],"cq":{"O1-25#5":["압류설의 흐름 원리는?","압력차 따라 수용부로 흐름"],"O1-23":["체관 수송의 기작은?","압류설(pressure-flow hypothesis)"],"O1-25":["압류설의 흐름 원리는?","공급원에서 당 적재(능동수송)→체관 Ψs↓→물 유입→압력↑→압력차 따라 수용부로 흐름→당 하역→압력↓"],"O1-24#1":["공급원(source)과 수용부(sink)의 예 — 「공급원」? (↔ 수용부)","성숙한 잎(당 생산)"],"O1-25#1":["압류설의 흐름 원리는?","공급원에서 당 적재(능동수송)"],"O1-25#2":["압류설의 흐름 원리는?","체관 Ψs↓"],"O1-25#3":["압류설의 흐름 원리는?","물 유입"],"O1-25#4":["압류설의 흐름 원리는?","압력↑"],"O1-9":["압력 포텐셜(Ψp)의 부호 범위는?","양수·음수 모두 가능 · 살아있는 세포=팽압 양압 · 죽은 물관=음압 장력"],"O1-25#6":["압류설의 흐름 원리는?","당 하역"],"O1-25#7":["압류설의 흐름 원리는?","압력↓"],"O1-24#2":["공급원(source)과 수용부(sink)의 예 — 「수용부」? (↔ 공급원)","뿌리·열매·어린 잎·덩이줄기(당 소비·저장)"],"O1-24":["공급원(source)과 수용부(sink)의 예는?","공급원=성숙한 잎(당 생산) · 수용부=뿌리·열매·어린 잎·덩이줄기(당 소비·저장)"]},"hubPanel":"s22p02b"};

const ttsNorm = t => TTSNorm.ttsNorm(t, TTS_LEX, TTS_ORDER, L.id);
let speakSeq = 0;

function speak(t, sid) {
  const my = ++speakSeq, at = i;

function go(k) {

// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {

  function read(k) {

function setMode(m) {

function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }

function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
