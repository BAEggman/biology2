<script>
const L = {"id":"L35c","scene":"s35","part":"c","title":"와인 테라스의 사흘째 — 둑으로 갈린 두 연못과 엉망이 된 합동 혼례: 종분화","sub":"흙둑 · 가위표 박힌 수문(흐름이 끊김 → 이소적) · 손주를 업은 중매쟁이(생물학적 종 개념) · 상 앞의 화석 · 제 몸을 찢는 불가사리 · 얼룩 새끼 오리(한계 · 형태 · 계통 · 생태종) · 상 왼쪽 다섯(사과파리 · 스컹크 · 부비새 · 달팽이 · 성게 = 접합 전) · 상 오른쪽 셋(도롱뇽 · 노새 · 벼 = 접합 후) · 오른 연못의 빨강 · 파랑 물고기(동소적 · 성선택) · 자루 넷 · 두 빛깔 넷 · 셋 · 여섯(배수성) · 둑 끝 물목의 세 갈래(잡종 지대) · 거미줄 치타의 계단과 거북의 비탈(단속평형 · 점진)","img":"img/L35c.webp?v=9268f55caece","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"와인 통이 놓인 테라스 — 연못 한가운데로 흙둑이 수평선 쪽까지 뻗어 연못이 둘로 갈렸다(왼쪽은 검은 구슬 · 오른쪽은 흰 구슬) · 둑 앞 데크의 혼례상과 둘레의 엉망이 된 짝들 (틀)","fact":"종분화 = 한 종이 둘 이상의 종으로 갈라지는 과정 · 미시진화와 거시진화를 잇는 개념적 다리","hook":"연못 하나가 둘로 = 종 하나가 둘로 · 구슬 비율(미시) → 새 종(거시)","say":"와인 테라스의 사흘째다. 연못 한가운데 흙둑이 수평선까지 길게 이어져 물을 둘로 갈랐다. 왼쪽에는 검은 구슬, 오른쪽에는 흰 구슬이 가득하다. 한 종이 둘 이상의 종으로 나뉘는 종분화다. 그제와 어제 살펴본 구슬 비율의 변화는 미시진화이고, 새 종이 생겨 더 큰 무리로 갈라져 온 긴 역사는 거시진화다. 종분화는 이 둘을 잇는 개념적 다리다. 오늘은 둑 앞 데크에서 중매쟁이 할머니가 두 연못의 짝들을 불러 합동 혼례를 열었지만, 짝마다 서로 다른 문제가 생긴다.","cards":["K0-1"],"box":null},{"sid":"s2","obj":"혼례상 뒤의 중매쟁이 할머니(한복 · 오늘은 눈가리개가 없다) — 이마를 짚고 진땀을 흘린다 · 등에 붉은 꽃무늬 포대기로 업은 손주가 손을 흔든다","fact":"생물학적 종 개념(마이어) = 자연에서 교배해 생존 · 번식 가능한 자손을 낳는 집단 · 기준은 생식적 격리","hook":"업힌 손주 = 자식이 또 자식을 낳는다 = 번식 가능한 자손 · 생김새가 아니라 손주","say":"혼례상 뒤의 할머니는 첫날과 달리 눈가리개를 벗고, 붉은 꽃무늬 포대기로 손주를 업었다. 할머니가 따지는 것은 손주를 볼 수 있는지다. 자연에서 둘이 교배해 살아남는 자손을 낳고, 그 자손도 다시 번식할 수 있어야 한다. 마이어의 생물학적 종 개념이다. 자연적으로 서로 교배해 생존력과 생식력이 있는 자손을 낳는 집단을 한 종으로 본다. 생김새가 아니라 생식적 격리, 즉 서로 교배해 자손을 남길 수 있는지가 기준이다. 오늘의 짝들이 어느 단계에서 막히는지 살펴보면 종을 나누는 장벽을 알 수 있다.","cards":["K0-2"],"box":[[945,375,250,300]]},{"sid":"s3","obj":"상 앞에 줄 선 골칫거리 셋 — 노란 줄자가 감긴 물고기 뼈 화석 돌판 · 가운데부터 제 몸을 찢어 둘로 갈라지는 주황 불가사리와 그 곁에 줄지어 선 작은 불가사리들 · 물풀을 문 검은 오리와 물고기를 문 흰 오리 사이의 얼룩 새끼","fact":"종 개념의 한계: 화석 · 무성생식 · 형태가 달라도 유전자 흐름(그롤라곰) / 형태종 · 생태종 · 계통종","hook":"짝지어 볼 수 없는 화석 · 혼자 갈라지는 불가사리 · 생김새가 다른데 새끼를 낳은 오리 / 줄자 = 형태 · 먹이 = 지위 · 갈라진 가지 = 계통","say":"혼례상 앞에 할머니가 판정하기 어려운 손님 셋이 줄 서 있다. 물고기 뼈가 박힌 돌판은 화석이다. 실제로 교배시킬 수 없어 생식적 격리를 확인할 수 없다. 혼자 몸을 찢어 둘이 되는 주황 불가사리는 무성생식 생물이다. 애초에 짝짓기를 기준으로 삼을 수 없다. 검은 오리와 흰 오리 사이의 얼룩 새끼는 다른 종으로 구분해 온 생물 사이에도 유전자가 오갈 수 있음을 보여 준다. 북극곰과 회색곰의 잡종인 그롤라곰이 예다. 그래서 다른 종 개념도 필요하다. 화석에 감긴 줄자는 형태와 구조로 나누는 형태종, 물풀을 먹는 오리와 물고기를 먹는 오리는 생태적 지위로 나누는 생태종이다. 불가사리가 거듭 갈라져 작은 무리를 이루는 모습은 공통 조상에서 갈라진 가장 작은 무리를 기준으로 하는 계통종이다.","cards":["K0-4","K0-5"],"box":[[750,700,440,240],[835,935,355,195]]},{"sid":"s4","obj":"가운데의 붉은 혼례상 — 할머니가 상 위에서 붉은 실패를 쥐었다: 상 왼쪽으로 뻗은 실 둘은 끊어졌고, 오른쪽으로 뻗은 실은 주황 도롱뇽의 앞발을 감고 두 도롱뇽 사이에서 매듭지어졌다 · 상 왼쪽에는 만나지도 맞지도 못한 짝 다섯(파리 · 스컹크 · 부비새 · 달팽이 · 성게), 상 오른쪽에는 새끼는 났는데 탈이 난 셋(도롱뇽 · 노새 · 벼)","fact":"생식 장벽 8 = 접합 전 5(수정 자체를 막음) + 접합 후 3(잡종 접합자가 생긴 뒤 작용)","hook":"끊어진 붉은 실 = 맺어지지도 못함(접합 전) · 묶인 실 = 맺어졌는데 새끼가 탈(접합 후)","say":"할머니가 혼례상에서 든 붉은 실패를 보자. 왼쪽으로 뻗은 실 둘은 끊어져 있고, 오른쪽 실은 도롱뇽 둘을 매듭으로 잇는다. 상을 경계로 수정 전과 후가 나뉜다. 왼쪽 다섯 쌍은 수정 자체가 이루어지지 않는 접합 전 장벽이다. 사과파리의 서식지 격리, 스컹크의 시간 격리, 푸른발부비새의 행동 격리, 달팽이의 기계적 격리, 성게의 배우자 격리다. 오른쪽 세 장면은 수정으로 잡종 접합자가 생긴 뒤 문제가 되는 접합 후 장벽이다. 잡종이 건강하고 번식 가능한 성체가 되는 것을 막는다. 수정 전 다섯, 수정 후 셋으로 모두 여덟 장벽을 살펴보자.","cards":["S-EV-9","K0-6","K0-13","K0-7","S-EV-10"],"box":[[880,560,340,245],[1180,620,220,130]]},{"sid":"s5","obj":"왼쪽 끝 화분 두 그루 — 사과나무의 사과를 끌어안은 파리와 산사나무의 검붉은 열매송이를 끌어안은 파리(둘 다 날개에 짙은 줄무늬 · 뾰로통한 얼굴)가 제 열매만 붙들었다","fact":"서식지 격리 — 사는 곳이 달라 만나지 않는다(라골레티스 사과파리: 산사나무 vs 사과)","hook":"제 나무만 끌어안음 = 만날 일이 없다 · 사과파리 = 사과","say":"맨 왼쪽의 화분 두 그루, 사과나무와 가시 돋은 산사나무를 보자. 사과에는 날개에 검은 띠가 있는 파리, 산사나무의 작은 붉은 열매에는 똑같이 생긴 파리가 매달려 뾰로통한 표정으로 자기 열매만 끌어안고 있다. 사과파리인 라골레티스는 자란 나무의 열매에서 짝짓기하고 산란한다. 그래서 같은 정원에 살아도 사과 쪽과 산사나무 쪽 파리가 만나지 않는다. 서식지가 달라 교배 기회가 생기지 않는 서식지 격리로, 첫 번째 접합 전 장벽이다.","cards":["K0-8"],"box":[[0,15,550,440]]},{"sid":"s6","obj":"가운데가 갈린 벤치 — 왼쪽 반은 뒤 화분 나무에서 매미가 울어 대는 한여름(아지랑이) · 밀짚모자를 쓴 스컹크가 땀을 흘리고, 오른쪽 반은 눈에 덮여 고드름이 달렸고 다른 스컹크가 웅크려 덜덜 떤다","fact":"시간 격리 — 번식 시기가 다르다(점박이스컹크: 늦여름 vs 늦겨울 교미)","hook":"한 벤치 두 계절 = 만나는 때가 다르다","say":"가운데서 나뉜 벤치를 보자. 왼쪽 반 뒤의 나무에서는 매미가 울고 아지랑이가 피어오르며, 밀짚모자를 쓴 스컹크가 땀을 흘린다. 오른쪽은 눈과 고드름이 있는 겨울이고 다른 스컹크가 웅크려 떨고 있다. 같은 벤치라도 두 스컹크가 앉는 계절이 다르다. 서쪽 점박이스컹크는 늦여름, 동쪽 점박이스컹크는 늦겨울에 짝짓기한다. 서식지가 겹쳐도 번식 시기가 달라 만나지 못하는 시간 격리다.","cards":["K0-9"],"box":[[100,590,590,525]]},{"sid":"s7","obj":"데크 위의 푸른발부비새 수컷 — 날개를 활짝 펴고 새파란 발을 들썩이며 부리를 하늘로 쳐들고 춤을 추는데, 곁의 빨간 발 암컷은 고개를 돌려 하품한다","fact":"행동 격리 — 짝을 알아보는 구애 행동이 종마다 다르다(푸른발부비새의 구애 춤)","hook":"파란 발 춤이 빨간 발에겐 안 통한다","say":"푸른발부비새 수컷이 데크에서 날개를 펴고 푸른 발을 들썩이며 부리를 하늘로 든다. 하지만 옆의 빨간 발 암컷은 다른 종이라 고개를 돌리고 하품한다. 푸른발부비새는 자기 종 특유의 구애 춤을 마쳐야 짝짓기한다. 종마다 몸짓·노래·냄새 등의 구애 신호가 달라 상대를 짝으로 인식하지 못하는 것이 행동 격리다.","cards":["K0-10"],"box":[[655,480,300,225]]},{"sid":"s8","obj":"와인 통 뚜껑 위의 달팽이 둘 — 몸을 맞대 보지만 맞지 않아, 둘 다 진땀을 흘리며 더듬이를 비튼다","fact":"기계적 격리 — 생식 기관의 모양 · 구조가 맞지 않는다(달팽이 껍질 나선 방향)","hook":"나선이 반대 = 몸이 안 맞는다","say":"와인 통 뚜껑 위의 달팽이 둘은 몸을 맞대려다 찡그리고 땀을 흘린다. 껍데기의 나선 방향이 서로 반대인 두 종이다. 나선이 다르면 생식기의 위치도 맞지 않아 짝짓기를 끝낼 수 없다. 교배를 시도하더라도 몸의 형태나 구조가 맞지 않아 막히는 기계적 격리다.","cards":["K0-11"],"box":[[500,610,185,120]]},{"sid":"s9","obj":"데크 앞 얕은 물의 성게 둘 — 두 성게 사이 위에 둥근 주황 알 여섯이 떠 있고, 둘레를 맴도는 흰 정자들이 알에 부딪혀 굵은 곡선을 그리며 튕겨 나간다(알 속에 든 정자는 없다)","fact":"배우자 격리 — 정자 · 난자가 만나도 수정 못 함(성게: 난자 · 정자 표면 단백질 결합 실패)","hook":"알에 부딪혀 튕겨 나감 = 표면이 안 맞는다","say":"데크 앞 얕은 물의 성게 둘을 보자. 붉은 성게가 내놓은 주황 알에 보라 성게의 흰 정자들이 몰려오지만, 부딪힌 뒤 튕겨 나간다. 성게는 바닷물에 알과 정자를 방출해 체외수정한다. 그러나 종이 다르면 정자와 난자 표면의 단백질이 결합하지 못해, 서로 만나도 수정되지 않는다. 마지막 접합 전 장벽인 배우자 격리다. 여기까지의 다섯 장벽은 모두 수정 자체를 막는다는 공통점이 있다.","cards":["K0-12"],"box":[[325,465,300,150]]},{"sid":"s10","obj":"상 오른쪽 — 할머니의 붉은 실로 이어진 주황 도롱뇽(앞발에 실이 감김)과 노란 점박이 검은 도롱뇽이 눈물을 글썽이며 내려다보는 깨진 알껍데기 속의 새끼(앞은 옅은 주황 · 꼬리 쪽은 검은 점박이로 두 무늬가 섞임 · 창백하게 늘어짐 · 이마에 물수건)","fact":"접합 후 3 = 잡종 생존력 저하 · 잡종 불임 · 잡종 붕괴 / 생존력 저하 = 잡종이 못 자라거나 허약","hook":"비실비실 늘어진 반반 무늬 새끼 = 생존력 저하","say":"상 오른쪽에서는 이미 수정이 이루어졌다. 주황 도롱뇽과 노란 점박이 검은 도롱뇽이 할머니의 붉은 실로 매듭지어져, 눈물을 글썽이며 깨진 알껍데기 속 새끼를 내려다본다. 앞은 주황, 꼬리는 검은 점박이인 잡종 새끼가 창백하게 누워 이마에 물수건을 얹었다. 엔사티나 도롱뇽의 잡종은 대부분 발생을 마치지 못하거나 자라도 허약하다. 부모 두 종의 유전자가 함께 제대로 작용하지 못해 발생과 생존에 문제가 생기는 잡종 생존력 저하다. 접합 후 장벽은 이 생존력 저하, 불임, 붕괴의 세 가지다.","cards":["K0-14"],"box":[[1215,615,305,150]]},{"sid":"s11","obj":"오른쪽 물가 길 — 몸 · 갈기 · 꼬리는 말을, 긴 귀는 당나귀를 닮은 튼튼한 갈색 노새 · 그 앞의 덮개를 젖힌 유모차는 텅 빈 채 거미줄만 쳐졌다 · 곁에서 흰 말 엄마와 잿빛 당나귀 아빠가 지켜본다","fact":"잡종 불임 — 노새(말 × 당나귀)는 튼튼하나 새끼를 못 낳는다(접합 후 · 접합 전 아님)","hook":"튼튼한데 빈 유모차 = 불임 · 거미줄 = 오래 비었다","say":"오른쪽 물가 길에는 말의 몸·갈기·꼬리와 당나귀의 긴 귀를 가진 갈색 노새가 있다. 앞의 유모차 덮개를 젖혀 보면 안은 비어 있고 거미줄만 쳐졌다. 옆의 흰 말 엄마와 잿빛 당나귀 아빠를 보자. 노새는 말과 당나귀의 잡종으로 튼튼하게 자라 일도 하지만 새끼를 낳지 못한다. 부모의 염색체 수와 구조가 달라 감수분열 때 짝이 맞지 않는 잡종 불임이다. 교배와 수정은 이미 이루어져 노새가 태어났으므로, 이것은 접합 전이 아닌 접합 후 장벽이다.","cards":["K0-15"],"box":[[1505,400,543,380]]},{"sid":"s12","obj":"맨 오른쪽 논 — 키 크고 금빛 이삭이 묵직한 첫 대 벼 한 포기 · 그 둘레의 다음 대 벼들은 작달막하고 이삭이 작거나, 앞줄은 누렇게 시들어 쓰러졌다","fact":"잡종 붕괴 — F₁ 은 정상이나 F₂ 이후가 약하거나 불임(재배 벼의 열성 대립유전자 누적)","hook":"자식은 멀쩡 · 손주가 쓰러짐 = 붕괴","say":"맨 오른쪽 논의 큰 벼와 주변의 작은 벼를 비교하자. 두 품종 사이의 첫 대 잡종은 키가 크고 이삭도 무겁지만, 다음 대는 작거나 이삭이 빈약하고 앞줄처럼 누렇게 쓰러지기도 한다. 첫 대는 건강하고 번식도 가능하지만 둘째 대부터 약해지거나 불임이 되는 잡종 붕괴다. 갈라져 온 두 벼 품종에 서로 다른 열성 돌연변이 대립유전자가 쌓였고, 다음 세대에 이것들이 한 몸에 많이 모이면 작고 불임인 벼가 된다. 할머니가 바랐던 손주 세대에서 문제가 생긴 셈이다.","cards":["K0-16"],"box":[[1770,50,278,260]]},{"sid":"s13","obj":"연못을 가른 흙둑 — 둑 가운데 나무 수문에 널빤지 두 장이 가위표로 박혀 꽉 막혔다 · 둑 왼쪽 연못은 검은 구슬, 오른쪽은 흰 구슬투성이","fact":"유전자 흐름이 유전자 풀을 묶음 · 끊기면 종분화 시작 / 이소적 = 지리적 격리 · 장벽은 부산물","hook":"둑 + 가위표 친 수문 = 흐름이 끊겼다 = 갈라지기 시작","say":"연못을 가르는 둑 가운데의 나무 수문은 널빤지 두 장이 가위표로 박혀 막혀 있다. 유전자 흐름이 끊긴 모습이다. 유전자 흐름은 한 종의 유전자 풀을 연결하며, 줄거나 끊기면 종분화가 시작된다. 산맥·강·바다 같은 지리적 장벽으로 집단이 나뉜 뒤 새 종이 생기는 것이 이소적 종분화다. 둑 양쪽에서 자연선택·유전적 부동·성선택이 따로 작용해 왼쪽은 검은 구슬, 오른쪽은 흰 구슬로 가득해졌다. 생식 장벽은 목표를 갖고 만들어진 것이 아니라 각 집단이 따로 변화한 결과로 생긴 부산물이다. 혼례에서 문제가 생긴 짝들이 그 결과를 보여 준다.","cards":["K0-3","K0-17"],"box":[[1090,200,330,330]]},{"sid":"s14","obj":"오른쪽 연못 — 둑도 칸막이도 없는 한 물에서 빨간 물고기는 빨간 짝과, 파란 물고기는 파란 짝과만 입을 맞춘다 · 빨간 물고기의 꼬리에 맞은 파란 물고기가 눈이 핑핑 돌며 튕겨 나간다","fact":"동소적 = 같은 지역에서 생식적 격리(드묾) · 배수성 · 성선택(시클리드) · 서식지 · 자원 분화","hook":"칸막이 없는 한 물에서 제 빛깔끼리만 = 동소적","say":"오른쪽 연못에는 칸막이가 없지만 빨간 물고기는 빨간 짝, 파란 물고기는 파란 짝과만 입을 맞춘다. 다가온 파란 물고기는 빨간 물고기의 꼬리에 튕겨 나간다. 빅토리아호 시클리드에서 암컷이 수컷의 색을 고르는 성선택만으로 한 호수 안의 종이 갈라진 모습이다. 같은 지역에서 일부가 생식적으로 격리되는 것이 동소적 종분화이며, 이소적 종분화보다 드물다. 경로는 이 물고기의 성선택, 오른쪽 하객의 배수성, 왼쪽 두 나무의 파리처럼 서식지와 자원이 나뉘는 경우다. 이소적은 지리적 장벽이 먼저 생기고, 동소적은 같은 장소에서 배수체화·생태적 지위의 분화·짝 선택의 변화로 갈라진다.","cards":["K0-18","K0-20","S-EV-11","K0-19"],"box":[[1440,320,390,160]]},{"sid":"s15","obj":"오른쪽 데크의 자루 하객 — 똑같은 베이지 자루 넷을 멘 아빠 / 베이지 자루 둘과 초록 자루 둘을 멘 노란 꽃 꽂은 젊은이","fact":"배수성 = 세트 통째 늘어남(↔ 이수성) · 동질 = 한 종 · 이질 = 두 종 → 한 세대 만에도 격리","hook":"같은 빛깔 넷 = 동질 · 두 빛깔 둘씩 = 이질","say":"오른쪽 데크로 오는 하객들의 자루를 보자. 자루 하나는 염색체 한 세트이며 둘이면 2n이다. 자루 전체, 즉 세트 전체가 늘면 배수성이고, 개별 염색체 한두 개가 많거나 적으면 이수성이다. 아빠의 베이지 자루 넷은 한 종 안에서 감수분열이나 체세포분열의 이상으로 세트가 배가된 동질배수체다. 옆 젊은이의 베이지 둘과 초록 둘은 서로 다른 두 종의 세트가 합쳐진 이질배수체다. 쇠채아재비 무리인 트라고포곤이 예다. 세트가 합쳐져 어느 부모 종과도 염색체 수가 달라지면 어느 쪽과 교배해도 정상 자손을 만들지 못한다. 그래서 새 배수체가 스스로 정상적으로 번식해 자리 잡으면, 한 세대 만에도 생식적으로 격리된 새 종이 될 수 있다.","cards":["S-EV-12","K0-22","K0-23","X-EV-26","K0-25"],"box":[[1180,740,170,375],[1515,740,195,375]]},{"sid":"s16","obj":"자루 넷 아빠와 자루 둘(머리 양옆) 엄마 사이의 아이 — 자루 셋(둘은 끈으로 묶였고 하나는 홀로 달랑) · 씨가 하나도 없는 수박을 들고 운다 / 오른쪽 끝 농부 — 밀 이삭이 삐죽한 자루 여섯(베이지 · 초록 · 금빛 둘씩) · 앞 수레에 이삭이 늘어진 귀리 다발 · 목화 · 감자 · 끈으로 묶은 큰 담뱃잎 다발(푸른 잎과 말린 금빛 잎)","fact":"3n = 짝이 안 맞아 불임(씨 없는 수박) · 배수체 작물: 밀(6n) · 귀리 · 목화 · 감자 · 담배","hook":"자루 셋 = 하나가 짝이 없다 = 씨 없는 수박 · 밀 = 자루 여섯","say":"자루 넷인 아빠와 둘인 엄마 사이의 아이는 자루 셋을 메고 있다. 둘은 끈으로 짝지었지만 하나는 혼자 남는다. 아이는 씨가 하나도 없는 수박을 들고 울고 있다. 이 모습을 연결하자. 감수분열에서는 상동염색체가 둘씩 짝을 이뤄야 하는데, 세트 수가 홀수이면 짝이 맞지 않아 균형 잡힌 배우자를 만들지 못한다. 그래서 3배체는 불임이다. 씨 없는 수박은 이렇게 만든 3배체다. 동질배수체인 아빠가 원래 부모 종과 생식적으로 나뉘는 이유도 여기에 있다. 맨 오른쪽 농부는 밀 이삭이 든 자루 여섯을 멨다. 베이지·초록·금빛이 둘씩이므로, 세 종의 세트가 둘씩 모인 6배체인 밀이다. 앞 수레의 귀리·목화·감자·담뱃잎도 모두 배수체 작물이다.","cards":["K0-24","K0-26"],"box":[[1295,860,150,260],[1700,700,348,444]]},{"sid":"s17","obj":"둑 먼 끝 물목 — 왼쪽은 천 모자 쓴 일꾼 둘이 돌을 쌓아 둑 끝을 높이고 발치에 얼룩 새끼가 늘어졌다 · 가운데는 둑 끝이 허물어진 한 물에서 검은 오리와 흰 오리가 섞여 헤엄치고 · 오른쪽은 물속 돌담 사이 틈으로 얼룩 새끼 셋이 줄지어 지나간다","fact":"잡종 지대 → 강화 · 융합 · 안정 / 강화 = 잡종 적응도 낮음 → 접합 전 장벽 강해짐","hook":"돌을 쌓아 높임 = 강화 · 허물어져 하나로 = 융합 · 틈으로 줄곧 지나감 = 안정","say":"둑이 끝나는 먼 물목에서는 두 연못이 만나 검은 오리와 흰 오리가 얼룩 새끼를 낳는다. 생식 장벽이 불완전한 두 종이 교배하는 잡종 지대다. 이후의 결과는 세 갈래다. 왼쪽에서는 발치에 비실비실 늘어진 얼룩 새끼를 보고 일꾼 둘이 돌을 쌓아 둑 끝을 더 높인다. 잡종 적응도가 낮아 접합 전 장벽이 강해지고 두 종은 더 갈라지는 강화다. 가운데는 둑이 허물어져 두 물과 오리들이 섞인다. 장벽이 약해져 두 종이 하나가 되는 융합이다. 오른쪽은 물속 돌담의 틈으로 얼룩 새끼들이 계속 지나간다. 잡종이 지속적으로 만들어지며 잡종 지대가 유지되는 안정이다.","cards":["K0-27","K0-28","K0-29","X-EV-27"],"box":[[1195,100,475,145]]},{"sid":"s18","obj":"왼쪽 먼 언덕 — 긴 층계참 사이로 갑자기 높은 단이 솟는 거인의 돌계단에서 거미줄과 먼지를 뒤집어쓴 치타가 높은 단에 앞발을 걸치며 뛰어오르고, 곁의 매끈한 모래 비탈길에서는 거북이 쉬지 않고 오른다","fact":"단속평형설(굴드 · 엘드리지) = 긴 정체 + 종분화 때 짧은 급변 ↔ 계통점진설 = 일정 · 점진적","hook":"오래 자다 한 번에 껑충 = 단속평형 · 쉬지 않고 조금씩 = 계통점진","say":"왼쪽 먼 언덕에는 계단길과 완만한 모래 비탈길이 있다. 계단은 긴 평평한 층계참 뒤에 높은 단이 나타난다. 거미줄과 먼지를 뒤집어쓴 치타가 오래 잠들었다 깨어 그 단을 뛰어오른다. 반면 거북은 비탈을 쉬지 않고 조금씩 오른다. 거북은 종이 오랜 시간에 걸쳐 일정하게, 점진적으로 변한다는 계통점진설이다. 치타는 굴드와 엘드리지의 단속평형설로, 긴 형태적 정체기 사이에 종분화와 함께 짧은 기간의 큰 변화가 나타난다고 본다. 화석에서 종이 갑자기 나타난 뒤 오래 비슷한 모습을 유지하는 양상을 설명한다. 혼례에 늦은 두 동물의 걸음으로 변화 속도를 구별하자.","cards":["K0-30","J0-44"],"box":[[300,0,690,245]]}],"cq":{"K0-1":["종분화(speciation)의 정의와 개념적 위치는?","한 종이 둘 이상으로 갈라지는 과정 · 미시진화와 거시진화를 잇는 개념적 다리"],"K0-2":["생물학적 종 개념(마이어)의 정의는?","자연에서 교배해 생존·번식 가능한 자손을 낳는 집단 · 기준은 형태가 아니라 생식적 격리"],"K0-4":["생물학적 종 개념의 3한계는?","① 화석은 생식 격리 평가 불가 · ② 무성생식 생물에 적용 불가 · ③ 형태 달라도 유전자 흐름 있는 쌍(그롤라곰)"],"K0-5":["형태종·생태종·계통종의 구분 기준은?","형태종=몸 형태·구조 · 생태종=생태적 지위(niche) · 계통종=공통 조상에서 갈라진 최소 계통 단위"],"S-EV-9":["생식적 격리 8장벽을 '수정 전/후' 축으로?","전(수정 차단)=서식지·시간·행동·기계·배우자 / 후=생존력·불임·붕괴"],"K0-6":["접합전 장벽(prezygotic barrier)이 막는 것은?","수정 자체"],"K0-13":["접합후 장벽(postzygotic barrier)이 작용하는 시점은?","잡종 접합자가 생긴 뒤"],"K0-7":["접합전 장벽 5종은?","서식지·시간·행동·기계적·배우자 격리"],"S-EV-10":["접합전 5장벽의 대표 예 격자는?","서식지=사과파리, 시간=스컹크, 행동=부비새, 기계=달팽이, 배우자=성게"],"K0-8":["서식지 격리의 예는?","Rhagoletis 파리(산사나무 vs 사과)"],"K0-9":["시간 격리의 예는?","점박이스컹크(늦여름 vs 늦겨울 교미)"],"K0-10":["행동 격리의 예는?","푸른발부비새의 구애 춤"],"K0-11":["기계적 격리의 예는?","달팽이 껍질 나선 방향"],"K0-12":["배우자 격리의 예는?","성게(난자·정자 표면 단백질 결합 실패)"],"K0-14":["접합후 장벽 3종은?","잡종 생존력 저하 · 잡종 불임 · 잡종 붕괴"],"K0-15":["노새(말×당나귀)는 어떤 장벽인가?","접합후(잡종 불임)"],"K0-16":["잡종 붕괴(hybrid breakdown)란?","F₁은 정상이나 F₂ 이후가 약하거나 불임(재배 벼의 열성 대립유전자 누적)"],"K0-3":["유전자 흐름과 종분화의 관계는?","유전자 흐름이 한 종의 유전자 풀을 결속; 흐름이 줄거나 끊기면 종분화 시작"],"K0-17":["이소적 종분화(allopatric speciation)란?","지리적 격리(산맥·강·바다) 상태에서 새 종이 생김 · 선택·부동·성선택으로 생식 장벽이 부산물로 생김"],"K0-18":["동소적 종분화(sympatric speciation)란?","같은 지역에서 일부가 생식적으로 격리되며 생김(이소적보다 드묾)"],"K0-20":["동소적 종분화의 3경로는?","배수성 · 성선택(빅토리아호 시클리드) · 서식지·자원 분화(Rhagoletis 사과파리)"],"S-EV-11":["종분화 지도 — 지리 축과 동소적 3경로는?","이소적=지리 장벽 / 동소적=같은 지역(배수성·성선택·자원 분화)"],"K0-19":["이소적 vs 동소적의 핵심 차이는?","이소적=지리적 장벽으로 분리 후 분화 · 동소적=같은 지역에서 배수체화·지위 분화·교배 선호 변화"],"S-EV-12":["배수체 용어 지도(2축)는?","배수성=세트 전체↑(↔이수성 1~2개) / 동질=한 종, 이질=두 종"],"K0-22":["동질배수체(autopolyploid)란?","같은 종 안에서 세트가 늘어난 것(감수·체세포분열 오류로 배가)"],"K0-23":["이질배수체(allopolyploid)란?","서로 다른 두 종의 잡종에서 양쪽 세트가 합쳐진 것(Tragopogon)"],"X-EV-26":["두 종의 잡종에서 양쪽 세트가 합쳐진 배수체는?","이질배수체 (← 동질배수체는 한 종 안에서 배가)"],"K0-25":["이질배수체화가 한 세대 만에 종분화를 일으키는 이유는?","세트가 합쳐지는 순간 원래 종과 염색체 수가 달라져 교배해도 정상 자손이 안 나오므로 즉시 생식적 격리(새 배수체가 스스로 정상 번식해 자리 잡을 때)"],"K0-24":["홀수배수체(3n)가 불임이 되는 이유는?","감수분열에서 상동염색체가 둘씩 짝지어야 하는데 세트가 홀수라 짝이 안 맞아 균형 배우자를 못 만듦(씨 없는 수박)"],"K0-26":["배수체 대표 작물은?","밀(6배체) · 귀리 · 목화 · 감자 · 담배"],"K0-27":["잡종 지대(hybrid zone)란?","생식 장벽이 불완전한 두 종이 만나 교배해 혼합 자손을 내는 지역"],"K0-28":["잡종 지대의 시간적 변화 3가지는?","강화(reinforcement) · 융합(fusion) · 안정(stability)"],"K0-29":["강화(reinforcement)란?","잡종 적응도가 낮으면 접합전 장벽이 더 강해져 두 종이 더 분리됨"],"X-EV-27":["잡종 적응도가 낮아 접합전 장벽이 더 강해지는 변화는?","강화(reinforcement) (← 융합·안정과 구별)"],"K0-30":["종분화 속도에 대한 단속평형설(굴드·엘드리지)이란?","종은 오랜 형태적 정체기 후 종분화 시점에 짧은 기간 급변 · 화석의 갑작스러운 출현·정체 패턴 설명(계통점진설과 대비)"],"J0-44":["계통점진설과 단속평형설의 차이는?","계통점진설=변화가 오랜 시간 일정·점진적 · 단속평형설='긴 정체 + 짧은 급변' 패턴"]},"hubPanel":null};

const ttsNorm = t => TTSNorm.ttsNorm(t, TTS_LEX, TTS_ORDER, L.id);
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);

    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }

function go(k) {
  stopSpeech();

function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }

function recap() {

  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';

// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;

    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);

      onend:() => setTimeout(() => read(k + 1), 700),

      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }

function setMode(m) {

function cqHTML(st) {

function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.

function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
