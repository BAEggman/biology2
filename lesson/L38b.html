<script>
const L = {"id":"L38b","scene":"s38","part":"b","title":"두 실험대의 실험실 — 샤가프 · 프랭클린 · 메셀슨-스탈","sub":"수평 저울 둘(샤가프 A = T · G = C) + 샤프펜슬 · 초록 하나 / 빨강 둘(A+T ≠ G+C) · 연의 실이 닿은 검은 X 사진(프랭클린) · 작업대 위엔 둘뿐(근거 둘) · 시험관 넷 + 메모지 세는 손(메셀슨-스탈 · 띠 높이 = 밀도) · 엎어진 시험관 둘(보존적 · 분산적 기각) · 검정 + 하양 사다리 토막(반보존적)","img":"img/L38b.webp?v=31970cba6045","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"나무 실험실 — 왼쪽엔 저울 둘과 검은 사진이 놓인 긴 작업대, 오른쪽엔 시험관 넷이 꽂힌 선반 (틀)","fact":"왼쪽 = 이중나선 모델의 근거 · 오른쪽 = 반보존적 복제의 증거","hook":"두 실험대 = DNA 를 밝힌 두 갈래 실험","say":"DNA의 구조와 복제 방식을 밝힌 실험실이다. 왼쪽 긴 작업대의 저울 둘과 검은 사진은 왓슨과 크릭이 이중나선 모델을 세운 근거다. 오른쪽 선반의 시험관 넷은 DNA가 반보존적으로 복제됨을 보여 준 실험이다.","box":null,"src":["s38p03#5","s38p02#0"],"cards":["E1-25","E1-39"]},{"sid":"s2","obj":"작업대의 놋쇠 저울 둘 — 둘 다 저울대가 완전히 수평 · 왼쪽 저울 위 벽에 은빛 샤프펜슬이 못에 걸렸다","fact":"샤가프 법칙 — 한 이중가닥 DNA 에서 A = T · G = C (종마다 조성은 다르다)","hook":"샤프펜슬 = 샤가프 · 수평 저울 = 같은 양","say":"놋쇠 저울 둘의 저울대는 모두 수평이다. 왼쪽 저울 위 벽의 못에 걸린 은빛 샤프펜슬에서 샤가프라는 이름을 떠올리자. 샤가프 법칙에 따르면 어느 생물의 이중가닥 DNA에서든 아데닌과 티민의 양이 같고, 구아닌과 시토신의 양도 같다. 사다리 공방에서 각 염기의 짝이 정해져 있었기 때문이다. 반면 짝지은 가닥이 없는 단일가닥 DNA에서는 이 양들이 같지 않아도 된다.","box":[[20,405,1085,330],[290,60,80,320]],"src":["s38p03#0"],"cards":["E1-24"]},{"sid":"s3","obj":"왼쪽 저울 — 두 접시에 납작한 초록 조각이 하나씩","fact":"초록 = A-T 쌍 → 이 저울이 수평 = A = T","hook":"초록 조각 = A-T (사다리 공방의 초록 칸) · 한 접시 A · 다른 접시 T","say":"왼쪽 저울의 양 접시에는 납작한 초록 조각이 하나씩 있다. 사다리 공방에서 갈고리 둘로 이어진 초록 칸은 아데닌-티민 쌍이었다. 한 접시는 아데닌, 다른 접시는 티민의 몫이다. 이 저울이 수평이라는 것은 A와 T의 양이 같다는 뜻이다.","box":[[20,420,390,310]],"src":["s38p03#1"],"cards":[]},{"sid":"s4","obj":"오른쪽 저울 — 두 접시에 작은 빨간 정육면체 조각이 둘씩 나란히 놓였다","fact":"빨강 = G-C 쌍 → 이 저울이 수평 = G = C","hook":"빨간 조각 = G-C (사다리 공방의 빨간 칸) · 한 접시 G · 다른 접시 C","say":"오른쪽 저울에는 양 접시에 작은 빨간 정육면체 조각이 둘씩 나란히 놓여 있다. 당구장의 큰 붉은 포도당 블록과는 다른 소품이다. 사다리의 빨간 칸은 갈고리 셋으로 이어진 구아닌-시토신 쌍이었다. 한 접시는 구아닌, 다른 접시는 시토신의 몫이다. 수평 저울로 G와 C의 양이 같음을 읽자.","box":[[690,405,415,330]],"src":["s38p03#2"],"cards":[]},{"sid":"s5","obj":"두 저울에 놓인 개수가 서로 다르다 — 왼쪽은 접시마다 하나, 오른쪽은 접시마다 둘","fact":"A+T 와 G+C 의 비는 종마다 다르다 · 예: C 40% → G 40% · A+T 20% → T 10%","hook":"저울끼리는 개수가 달라도 된다","say":"이제 저울 두 개를 서로 비교하자. 왼쪽은 접시마다 조각 하나, 오른쪽은 둘이므로 양이 다르다. A와 T가 같고 G와 C가 같더라도, A+T와 G+C까지 같을 필요는 없고 그 비율은 종마다 다르다. A=T라는 사실로 A+T=G+C까지 결론 내리는 것은 이 단원에서 가장 자주 나오는 함정이다. 직접 계산해 보자. C가 40퍼센트인 경우 G도 40퍼센트다. 남은 20퍼센트를 A와 T가 반씩 차지하므로 T는 10퍼센트다.","box":[[20,405,1085,330]],"src":["s38p03#3"],"cards":["E1-31","E1-32"]},{"sid":"s6","obj":"두 저울 사이 작업대에 세운 검은 사진 한 장 — 흐릿한 흰 X 무늬 · 위 벽의 꼬리 달린 연에서 실이 내려와 사진에 닿는다","fact":"로절린드 프랭클린의 X선 회절 사진 — X 무늬가 나선 구조를 가리켰다","hook":"연 = 프랭클린 · 검은 사진의 X = 나선","say":"두 저울 사이에 세워진 검은 사진에는 흐릿한 흰 X 무늬가 있다. 위 벽의 꼬리 달린 연에서 실이 내려와 사진에 닿는다. 연을 날린 프랭클린이라는 연상으로 로절린드 프랭클린의 X선 회절 사진을 연결한다. X자 무늬는 나선 구조의 단서였으며, 지름과 한 바퀴 길이도 읽어 낼 수 있었다.","box":[[440,505,190,225],[545,30,210,460]],"src":["s38p03#4"],"cards":[]},{"sid":"s7","obj":"작업대 위에 놓인 것은 저울 둘과 검은 사진뿐이다 — 연과 샤프펜슬은 벽에 걸렸다","fact":"왓슨 · 크릭 이중나선 모델의 근거 = 프랭클린의 X선 사진 + 샤가프 법칙","hook":"작업대 위엔 둘뿐 = 근거 두 가지","say":"작업대에는 저울 둘과 검은 사진만 있고, 이름 단서인 연과 샤프펜슬은 벽에 걸려 있다. 왓슨과 크릭이 이중나선 모델의 근거로 사용한 두 가지를 짚어 보자. 프랭클린의 X선 회절 사진과 샤가프 법칙이다.","box":[[10,420,1100,320]],"src":["s38p03#5"],"cards":["E1-25"]},{"sid":"s8","obj":"오른쪽 나무 선반에 시험관 넷 — 오른쪽으로 갈수록 세대가 는다 · 아래 바닥에서 손 하나가 메모지 뭉치를 한 장씩 넘기며 센다","fact":"메셀슨-스탈 — ¹⁵N(무거움) → ¹⁴N(가벼움) 배양 · 원심분리 · 띠 높이 = 밀도","hook":"메모지를 세는 손 = 메·셀·손 · 검정 = 무거움 · 하양 = 가벼움 · 낮을수록 무겁다","say":"오른쪽 선반의 시험관 넷은 오른쪽으로 갈수록 세대가 늘어난다. 바닥의 손은 메모지를 한 장씩 넘기며 센다. 메모지, 세는, 손을 이어 메셀슨을 떠올리자. 메셀슨-스탈 실험은 무거운 질소 15N으로 키운 세균을 가벼운 질소 14N으로 옮긴 뒤, DNA를 원심분리한 실험이다. 띠의 높이는 밀도를 나타내며 무거울수록 아래에 놓인다. 검정은 무거움, 하양은 가벼움, 반검반흰은 중간이다.","box":[[1150,140,820,580],[540,920,580,224]],"src":["s38p02#0"],"cards":["E1-39"]},{"sid":"s9","obj":"첫째 시험관 — 맨 아래에 검은 띠 하나","fact":"¹⁵N 으로만 키운 출발점 — 두 가닥 모두 무거워 가장 아래","hook":"맨 아래 검정 = 두 가닥 다 무거움","say":"첫째 시험관에는 맨 아래 검은 띠 하나만 있다. 무거운 질소에서만 키운 출발점이다. DNA 두 가닥이 모두 무거우므로 가장 아래에 놓인다.","box":[[1250,140,120,480]],"src":["s38p02#1"],"cards":[]},{"sid":"s10","obj":"둘째 시험관 — 가운데에 띠 하나, 왼쪽 반은 검정 · 오른쪽 반은 하양","fact":"¹⁴N 으로 옮겨 1회 복제 → 모두 중간 밀도 띠 하나","hook":"반검반흰 한 띠 = 중간","say":"둘째 시험관은 가벼운 질소로 옮겨 한 번 복제한 뒤다. 가운데 띠 하나의 왼쪽은 검정, 오른쪽은 하양이다. 모든 DNA가 중간 밀도의 띠 하나로 모였다.","box":[[1415,140,120,480]],"src":["s38p02#2"],"cards":["E1-40"]},{"sid":"s11","obj":"선반 앞 바닥에 넘어진 왼쪽 시험관 — 둥근 닫힌 끝 쪽에 검은 띠, 열린 입구 쪽에 흰 띠, 그 사이는 비었다","fact":"보존적 모델이면 1세대에 무거운 띠 · 가벼운 띠가 따로 → 실제는 중간 하나 → 기각","hook":"엎어진 시험관 = 죽은 모델 · 검정과 하양이 따로 = 보존적","say":"선반 앞 바닥에 쓰러진 시험관 둘 중 왼쪽을 보자. 둥글게 닫힌 끝에는 검은 띠, 열린 입구 쪽에는 흰 띠가 있고 중간은 비었다. 보존적 복제 모델이 예측한 1세대다. 부모의 두 가닥이 그대로 함께 남는다면 첫 세대부터 무거운 띠와 가벼운 띠가 따로 나와야 한다. 하지만 실제 결과인 선반의 둘째 시험관에는 중간 띠 하나만 있다. 따라서 1세대 결과가 보존적 모델을 배제한다.","box":[[1150,700,390,190]],"src":["s38p02#3"],"cards":["E1-37","E1-43"]},{"sid":"s12","obj":"셋째 시험관 — 띠가 둘: 가운데 반검반흰 띠와 위쪽 흰 띠","fact":"2회 복제 → 중간 1/2 · 가벼움 1/2 — 가벼운 띠가 따로 생겼다","hook":"위쪽에 흰 띠가 새로 = 가벼운 DNA 등장","say":"셋째 시험관은 두 번 복제한 뒤다. 가운데의 반검반흰 띠와 위쪽 흰 띠, 두 띠가 있다. 중간 밀도와 가벼운 DNA가 각각 절반이다. 가벼운 띠가 별도로 나타났다는 점이 중요하다.","box":[[1580,140,125,480]],"src":["s38p02#4"],"cards":["E1-41"]},{"sid":"s13","obj":"바닥에 넘어진 오른쪽 시험관 — 가운데에 회색 띠 하나뿐","fact":"분산적 모델이면 중간 띠 하나가 점점 가벼워질 뿐 갈라지지 않는다 → 2세대가 기각","hook":"엎어진 시험관의 한 띠 = 분산적","say":"바닥에 쓰러진 오른쪽 시험관에는 가운데 회색 띠 하나만 있다. 분산적 복제 모델의 예측이다. 오래된 가닥과 새 가닥이 조각조각 섞인다면, 세대가 지나도 띠 하나가 점점 가벼워질 뿐 둘로 분리되지 않는다. 그런데 실제 결과인 선반의 셋째 시험관에는 가벼운 띠가 따로 나타났다. 2세대 결과가 분산적 모델을 배제한다.","box":[[1595,690,400,170]],"src":["s38p02#5"],"cards":["E1-38"]},{"sid":"s14","obj":"넷째 시험관 — 셋째와 같은 두 자리인데, 위쪽 흰 띠가 눈에 띄게 두꺼워졌다","fact":"3회 → 중간 1/4 · 가벼움 3/4 — 중간은 옛 가닥 둘이라 늘 2개, 가벼운 것만 는다","hook":"같은 자리 · 흰 띠만 두꺼워짐","say":"넷째 시험관은 세 번 복제한 뒤다. 띠의 위치는 셋째 시험관과 같지만 위쪽 흰 띠가 훨씬 두껍다. 중간 밀도가 4분의 1, 가벼운 DNA가 4분의 3이다. 옛 가닥을 하나씩 가진 중간 밀도 DNA는 두 분자로 수가 그대로이고, 가벼운 DNA만 늘어난다. n세대 뒤 전체 2의 n제곱 분자 가운데 중간 밀도는 늘 2개라는 규칙이다.","box":[[1745,140,125,480]],"src":["s38p02#6"],"cards":["E1-42"]},{"sid":"s15","obj":"바닥에 놓인 짧은 사다리 토막 — 한쪽 기둥은 검정, 다른 쪽 기둥은 하양","fact":"반보존적 복제 — 딸 DNA = 옛 가닥 하나 + 새 가닥 하나 · 새 가닥은 주형에 상보적","hook":"검은 기둥(옛) 하나가 그대로 넘어왔다 = 반만 보존","say":"바닥의 짧은 사다리 토막은 한쪽 기둥이 검정, 다른 쪽은 하양이다. 딸 DNA가 옛 가닥 하나와 새 가닥 하나를 갖는 반보존적 복제다. 두 가닥의 절반인 한 가닥이 부모에게서 그대로 전해진다. 새 가닥은 옛 가닥을 주형으로 상보적 염기쌍을 이루며 만들어진다. 이것이 복제의 기본 원리다.","box":[[1400,825,625,260]],"src":["s38p02#7","s38p02#8"],"cards":["E1-35","E1-36","E1-34"]}],"cq":{"E1-25":["왓슨과 크릭이 이중나선 모델의 근거로 삼은 두 가지는?","프랭클린의 X선 회절 사진과 Chargaff 법칙"],"E1-39":["반보존적 복제를 입증한 실험과 동위원소는?","메셀슨-스탈 실험 · 무거운 질소(15N)·가벼운 질소(14N)"],"E1-24":["Chargaff 법칙의 핵심은?","한 DNA 안에서 A=T, G=C (종마다 염기 조성은 다를 수 있다)"],"E1-31":["어떤 DNA에서 C가 40%이면 T는?","10% (C=G=40%, A+T=20%, A=T=10%)"],"E1-32":["(G+C)/(A+T)=1.8, 총 168염기일 때 A의 수는?","30개 (A+T=60 → A=T=30)"],"E1-40":["15N 세포를 14N으로 옮겨 1회 복제하면 밴드는?","모두 중간 밀도 밴드"],"E1-37":["보존적(conservative) 복제 모델이란?","부모 DNA 두 가닥이 그대로 함께 남는 모델"],"E1-43":["메셀슨-스탈에서 보존적 모델이 부정되는 근거는?","1회 복제 후 무거운/가벼운 밴드가 따로 나와야 하는데 실제로는 중간 밴드만 나옴"],"E1-41":["14N에서 2회 복제 후 DNA 비율은?","hybrid 1/2 · 가벼움(14N) 1/2"],"E1-38":["분산적(dispersive) 복제 모델이란?","기존 가닥과 새 가닥 조각이 섞이는 모델"],"E1-42":["14N에서 3세대 배양 후 DNA 분포는?","hybrid 1/4 · 가벼움 3/4"],"E1-35":["반보존적 복제(semiconservative)란?","각 딸 DNA가 기존 가닥 하나와 새 가닥 하나를 가지는 복제"],"E1-36":["'반보존적'의 의미는?","딸 DNA의 절반(한 가닥)이 부모에게서 보존된다는 뜻"],"E1-34":["DNA 복제의 기본 원리는?","주형가닥에 대한 상보적 염기쌍 형성"]},"hubPanel":"s38p03"};

$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
</html>
