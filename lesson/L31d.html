<script>
const L = {"id":"L31d","scene":"s31","part":"d","title":"두 층 당구장의 열 일꾼 — 해당과정 열 걸음","sub":"위층은 왼쪽부터 투자기, 아래층은 오른쪽부터 회수기다. 모자의 육각 너트와 열쇠 · 포도 상자 속 사과 그림 · 완두콩 모자와 포크 열쇠 · 알을 쪼개는 레이스 재단사 · 티피 속 아이. 아래층에서는 벌어진 데님 후드 · 열쇠 돼지 · 무를 든 돼지 · 수건을 짜는 물놀이 아이 · 루비 피리를 부는 파라오가 이어진다.","img":"img/L31d.webp?v=e1c47f23490c","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"두 층 당구장 — 위층 발코니의 초록 당구대 · 오른쪽 계단 · 아래층 파란 당구대 · 아래층 왼쪽 끝의 주름 붉은 커튼 문","fact":"해당과정 10반응 = 투자기 1~5(위층) + 회수기 6~10(아래층) · 회수기는 두 번씩","hook":"위층 1~5는 투자기, 아래층 6~10은 회수기. G3P가 두 개여서 아래층의 각 반응이 포도당 하나당 두 번씩 일어난다.","say":"해 뜨는 당구장에 층이 둘이다. 위층 발코니의 초록 당구대에서 다섯 일꾼이 왼쪽에서 오른쪽으로 일하고, 오른쪽 계단을 내려와 아래층 파란 당구대에서 다섯 일꾼이 오른쪽에서 왼쪽으로 일한다. 해당과정의 열 반응이다. 해당은 당을 푼다는 뜻. 위층 다섯이 에너지 투자기, 아래층 다섯이 회수기. 포도당 하나가 3탄소 둘로 갈라진 뒤라 회수기 반응은 모두 두 번씩 일어난다. 이 그림의 약속은 앞 과 그대로다. 정육면체 블록은 6탄소, 각뿔은 3탄소, 붉은 도장은 인산, 동전은 에이티피, 열쇠는 키나아제.","src":[],"cards":["B1-33","B1-60","B1-28"]},{"sid":"s2","obj":"첫 문지기의 모자 정면에는 가운데가 뚫린 은색 육각 너트가 있다. 한 손에는 긴 황금 열쇠, 다른 손에는 포도 블록에 닿은 붉은 도장, 앞에는 금화 한 닢이 있다.","fact":"1 헥소키나아제 — 포도당 → 포도당 6-인산 · ATP 하나를 쓴다","hook":"육각형(hex)과 열쇠(key) → 헥소키나아제. 포도 블록이 ATP의 인산을 하나 받아 포도당 6-인산이 된다.","say":"육각 너트는 영어로 헥스 너트, 열쇠는 키. 헥스와 키를 잇는다. 헥소키나아제가 ATP의 인산을 포도당의 6번 탄소에 붙인다. 이 첫 반응에 ATP 하나가 든다. 인산화된 포도당은 포도당 수송체를 통해 빠져나갈 수 없다.","box":[[193,62,335,395]],"src":[],"cards":["B1-41","B1-40"],"ask":"위층 문지기가 처음 받는 기질과 효소 이름은? 어떤 분자의 인산을 받아 무슨 물질이 되는가?"},{"sid":"s3","obj":"베레모를 쓴 화가가 사과 그림 액자를 양손으로 잡고 있다. 앞에는 날개가 열린 이삿짐 상자가 있고 상자 앞면에는 포도송이가 붙어 있다.","fact":"2 포도당인산 이성질화효소 — 포도당 6-인산 → 과당 6-인산 · 모양만 바꾼다","hook":"포도(P) · 그림(G) · 이사(I) → PGI. 포도 상자와 사과 그림은 포도당 6-인산과 과당 6-인산을 짝짓는다.","say":"포도 상자에 그림을 이사한다. 포도, 그림, 이사의 첫소리로 PGI, 포도당인산 이성질화효소를 부른다. 포도당 6-인산은 원자 배열을 바꾸어 과당 6-인산이 된다. 두 분자 모두 탄소 여섯 개이고 6번에 인산 하나가 붙어 있다. 이 단계에는 ATP가 들지 않는다.","box":[[535,61,346,398]],"src":[],"cards":["B1-42"],"ask":"베레모 화가 앞에서 어떤 기질이 무엇으로 바뀌는가? 인산 수와 ATP 소비는 어떻게 되는가?"},{"sid":"s4","obj":"완두콩 꼬투리를 모자처럼 쓴 과일 주인이 포크 끝을 과일 블록에 댄다. 포크 손잡이는 열쇠이고 양쪽에는 가득 찬 금화 주머니와 빈 주머니가 있다.","fact":"3 PFK-1 · F6P → F1,6BP · ATP 1 소비 · ATP 과다 억제, AMP 활성","hook":"완두콩(pea), 포크(fork), 열쇠(key) → P·F·K. ATP를 하나 더 쓰고 과당 1,6-이인산을 만든다.","say":"피, 포크, 키. 완두콩과 포크와 열쇠의 첫소리가 과당인산화효소 피에프케이 원을 부른다. 과당 6-인산의 1번 탄소에 ATP의 인산을 더해 과당 1,6-이인산을 만든다. ATP 한 분자가 반응에 쓰이지만 ATP가 풍부할 때에는 조절 부위에 작용해 이 효소를 억제한다. AMP와 ADP는 활성화하고 시트르산은 억제한다.","box":[[815,49,463,401]],"src":[],"cards":["B1-43","B1-44","B1-46","B1-40","B1-45"],"ask":"이 자리의 기질·효소·생성물은? 금화 하나를 쓰는 반응이 금화가 넘치는 환경에서는 어떻게 조절되는가?"},{"sid":"s5","obj":"하얀 레이스를 입은 재단사가 도끼를 들었다. 깨진 알껍데기 사이에 붉은 각뿔과 파란 각뿔의 뾰족한 면이 나란히 보인다.","fact":"4 알도레이스 — 과당 1,6-이인산 → G3P 하나 + DHAP 하나(서로 다른 3탄당)","hook":"알 + 도끼 + 레이스 → 알도레이스. 서로 다른 두 3탄당으로 쪼갠다.","say":"알을 도끼로 쪼개는 레이스 재단사. 알, 도, 레이스를 이으면 알도레이스다. 6탄소인 과당 1,6-이인산을 3탄소 G3P와 3탄소 DHAP로 쪼갠다. 두 조각은 서로 다른 물질이고 각각 인산 하나를 가진다.","box":[[1236,57,300,385]],"src":[],"cards":["B1-47","B1-48"],"ask":"알을 도끼로 쪼개는 레이스 재단사는 어느 효소인가? 쪼개기 직전의 6탄당과 직후의 서로 다른 두 3탄당을 말해 보자."},{"sid":"s6","obj":"오른쪽 끝 줄무늬 티피 천막의 입구로 아이가 고개를 내민다. 거울 앞 각뿔은 밑이 파랗고 꼭대기가 붉다. 아이 바로 옆에는 전체가 붉은 각뿔이 있다.","fact":"5 3탄당인산 이성질화효소 — DHAP → G3P · 이제 G3P 둘","hook":"티피 속 아이 → 티피아이(TPI), 3탄당인산 이성질화효소. 파란 DHAP가 붉은 G3P로 바뀐다.","say":"티피라는 원뿔 천막과 아이를 이어 티피아이, 트라이오스 인산 이성질화효소를 부른다. 알도레이스가 만든 두 분자 가운데 DHAP를 G3P로 바꾼다. 먼저 생겨 있던 G3P까지 합치면 G3P 두 개가 계단을 내려간다. 여기까지 ATP 두 개를 썼다.","box":[[1519,31,529,434],[1910,438,138,331]],"src":[],"cards":["B1-49"],"ask":"티피 속 아이로 떠올릴 효소의 약자와 이름은? 4단계에서 나온 두 분자 중 어느 것이 이성질화되며 포도당 하나당 몇 개의 G3P가 회수기로 들어가는가?"},{"sid":"s7","obj":"계단 아래 데님 후드 아이의 지퍼가 V자로 벌어져 있다. 아이가 노란 번개를 들고, 파란 당구대에는 붉은 도장이 달린 각뿔 둘과 낱개 도장 하나가 있다. 발밑에 금속 양동이 둘이 놓였다.","fact":"6 G3P 탈수소효소 — G3P + 무기인산 → 1,3-BPG · NAD⁺ → NADH","hook":"벌어진 지퍼의 틈(gap)과 데님 후드(denim hoodie)로 GAPDH를 부른다. 낱개 도장은 무기인산, 번개는 전자 전달, 양동이 둘은 포도당당 NADH 둘이다.","say":"큰 틈은 갭, 데님 후드의 첫 글자는 디에이치. 글리세르알데하이드 3-인산 탈수소효소, GAPDH다. G3P가 산화되며 무기인산이 1번 탄소에 붙어 1,3-BPG가 만들어진다. 이때 NAD⁺가 환원되어 NADH가 된다. 포도당 하나당 이 반응은 두 번 일어나고 ATP는 쓰지 않는다.","box":[[1517,623,315,335],[1480,1010,330,134]],"src":[],"cards":["B1-50","B1-51","B1-37"],"ask":"아래층 첫 효소·기질·생성물은? 들어가는 인산은 어디서 오며, 어떤 전자 운반체가 어떻게 바뀌는가?"},{"sid":"s8","obj":"오른쪽 분홍 돼지는 금색 열쇠를 쥐고 각뿔의 붉은 도장에 앞발을 댔다. 바로 앞에는 붉은 점이 붙은 금화가 두 닢 있다.","fact":"7 인산글리세르산 인산화효소 — 1,3-BPG → 3-PG · ATP 생성(기질수준 인산화)","hook":"돼지(pig)와 열쇠(key) → PGK. 1,3-BPG의 1번 인산을 ADP에 넘겨 ATP를 만든다.","say":"피그와 키, 피지케이. 인산글리세르산 인산화효소는 1,3-BPG의 1번 인산을 ADP로 직접 옮긴다. ATP가 생기고 3번 인산만 남은 3-PG가 된다. 포도당 하나당 두 번 일어나서 ATP 두 개를 얻는다.","box":[[1240,653,289,321]],"src":[],"cards":["B1-52","B1-53","B1-54"],"ask":"열쇠를 단 돼지의 효소 이름과 생성물은? 어느 기질이 인산을 내놓고 어느 분자가 받는가?"},{"sid":"s9","obj":"왼쪽 분홍 돼지는 초록 잎이 달린 흰 무로 같은 각뿔의 옆면을 가리킨다. 무 끝에 붉은 도장이 있다.","fact":"8 인산글리세르산 자리옮김효소 — 3-PG → 2-PG · 인산의 자리만 옮긴다","hook":"돼지(pig)와 무(mutase) → PGM. 3-PG의 인산 자리가 같은 분자 안에서 3번에서 2번으로 바뀐다.","say":"돼지는 앞자리와 같은 인산글리세르산, 무는 뮤테이스를 부른다. 이 돼지의 효소는 인산글리세르산 자리옮김효소, 피지엠이다. 3-PG에서 2-PG로 넘어간다. ATP를 소비하거나 만들지 않는다.","box":[[918,654,281,320]],"src":[],"cards":["B1-55"],"ask":"이 돼지의 효소 이름은? 같은 분자 안에서 인산이 어디서 어디로 이동하며 ATP가 생기는가?"},{"sid":"s10","obj":"그 왼쪽 — 튜브를 낀 수영복 아이가 붉은 각뿔을 젖은 수건처럼 꼬아 비틀어 짠다(꼬인 붉은 천 꼴) · 물방울이 떨어져 바닥에 웅덩이","fact":"9 에놀레이스 — 2-PG → PEP + H₂O(물을 빼 고에너지 인산 공여체로)","hook":"짜낸 물 → 탈수 · 인산이 남은 팽팽한 기질 → PEP","say":"그 왼쪽, 튜브를 낀 수영복 아이. 물놀이, 놀이의 놀, 에놀레이스. 각뿔을 젖은 수건처럼 비틀어 짜자 물방울이 뚝뚝 떨어져 바닥에 웅덩이가 진다. 이 바닥 웅덩이가 진짜 물이다. 앞에서 본 양동이 두 개는 엔에이디에이치 두 분자의 표식이었다. 물이 빠지고 비틀려 팽팽해진 각뿔이 포스포에놀피루브산, 피이피. 인산을 내주고 싶어 안달이 난 고에너지 상태다.","box":[[640,660,260,430]],"src":[],"cards":["B1-56"],"ask":"물놀이 일꾼의 기질·효소·산물은? 무엇이 빠져나오고 다음 일꾼에게 넘어가는 인산 공여체는 무엇인가?"},{"sid":"s11","obj":"맨 왼쪽 파라오는 가로로 긴 피리를 입에 대고 있다. 피리 끝에는 커다란 붉은 루비가 달렸고 다른 손에는 황금 열쇠가 있다. 바로 앞에 붉은 각뿔 둘과 금화 둘이 있다.","fact":"10 피루브산 인산화효소 — PEP → 피루브산 · ATP 생성(기질수준 인산화)","hook":"피리와 루비 → 피루브산. 열쇠 → 키나아제. PEP의 인산을 ADP에 넘겨 ATP를 만든다.","say":"피리의 피, 루비의 루비를 붙여 피루브산을 떠올리고, 열쇠를 더해 피루브산 인산화효소를 부른다. PEP가 ADP에 인산을 넘겨 피루브산과 ATP가 생긴다. 포도당 하나당 피루브산 둘과 ATP 둘이다. 앞의 열쇠 돼지와 함께 기질수준 인산화로 ATP를 얻는 두 자리다. 왼쪽 붉은 커튼은 미토콘드리아 입구다.","box":[[269,586,346,384]],"src":[],"cards":["B1-57","B1-58","B1-59"],"ask":"마지막 일꾼의 기질·효소·산물은? 어떤 분자에 인산을 넘기며 앞에서 같은 방식으로 ATP를 만든 자리는 어디인가?"},{"sid":"s12","obj":"위층 문지기와 과일 주인이 쓴 ATP를 한 개씩 센다. 아래층 돼지와 파라오 앞의 금화는 각각 둘. 양동이 둘, 짜낸 물, 마지막 각뿔 둘도 짚는다.","fact":"포도당 1 → 피루브산 2 · ATP 4 − 2 = 순 2 · NADH 2 · H₂O 2 · CO₂ 0","hook":"쓴 금화 둘 · 번 금화 넷 · 양동이 둘 · 연기 없음","say":"다시 세어 보자. 위층 문지기와 과일 주인이 각각 ATP 하나를 쓴다. 과일 주인의 주머니 속 동전은 속도 조절의 단서라 여기에 더하지 않는다. 아래층에서는 열쇠를 든 돼지 앞 둘과 루비 피리를 부는 파라오 앞 둘, ATP 넷이 생긴다. 넷에서 둘을 빼면 순 이익 에이티피 둘. 엔에이디에이치 양동이 둘, 피루브산 각뿔 둘, 짜낸 물 둘. 이산화탄소는 하나도 안 나온다, 연기가 없다. 물질 이름은 이렇게 외운다. 포, 육, 과, 일육, 지쓰리피와 디에이치에이피, 디만 지로, 일삼, 삼, 이, 펩, 피. 포도당, 포도당 6-인산, 과당 6-인산, 과당 1,6-이인산, 갈라져 둘, 그리고 1,3-비피지, 3-피지, 2-피지, 피이피, 피루브산.","box":[[195,70,335,370],[799,65,475,382],[1260,660,260,360],[300,600,340,420],[1480,1010,330,134],[640,980,260,110]],"src":[],"cards":["B1-36","B1-38","B1-61","B1-34","B1-35","B1-39"],"ask":"포도당 하나당 ATP·NADH·피루브산·물의 순생성 수는? ATP를 쓰는 단계와 만드는 단계도 차례로 짚어 보자."}],"cq":{"B1-33":["해당과정은 어떤 두 시기로 나뉘는가?","에너지 투자기와 에너지 회수기"],"B1-60":["해당과정에서 한 포도당이 두 G3P를 거치므로 회수기 반응은 몇 번씩 일어나는가?","각각 2번씩"],"B1-28":["해당과정(glycolysis)의 뜻은?","당을 분해한다는 뜻"],"B1-41":["포도당을 포도당 6-인산으로 만드는 효소는?","헥소키나아제(hexokinase)"],"B1-40":["해당과정에서 ATP가 투입되는 두 단계는?","포도당→포도당 6-인산 · 과당 6-인산→과당 1,6-이인산"],"B1-42":["포도당인산이성질화효소(isomerase)가 하는 일은?","포도당 유도체를 과당 유도체로 바꾼다"],"B1-43":["과당 6-인산에 ATP를 더 써서 인산기를 붙이는 효소는?","PFK(인산과당인산화효소)"],"B1-44":["해당과정에서 가장 중요한 조절 효소로 자주 묻는 것은?","PFK"],"B1-46":["PFK가 작용하는 기질과 생성물은?","과당 6-인산 → 과당 1,6-이인산"],"B1-45":["PFK의 다른자리입체성(allosteric) 조절은?","ATP·시트르산이 붙으면 억제 · AMP·ADP가 붙으면 활성"],"B1-47":["알도레이스가 하는 일은?","과당 1,6-이인산을 두 개의 3탄당으로 쪼갠다"],"B1-48":["알도레이스 반응으로 생기는 두 3탄당은?","G3P와 DHAP"],"B1-49":["DHAP는 결국 무엇으로 전환되어 이후 과정을 계속하는가?","G3P"],"B1-50":["에너지 회수기에서 NADH가 생성되는 단계는?","G3P → 1,3-BPG"],"B1-51":["G3P를 1,3-BPG로 산화하며 NADH를 만드는 효소는?","3탄당인산 탈수소효소(G3P 탈수소효소)"],"B1-37":["해당과정에서 생성되는 NADH는?","2개"],"B1-52":["해당과정의 기질수준 인산화 단계 2개는?","1,3-BPG→3PG · PEP→피루브산"],"B1-53":["1,3-BPG에서 ATP가 생성되는 다음 산물은?","3-PG"],"B1-54":["1,3-BPG에서 ATP를 만드는(기질수준 인산화) 효소는?","인산글리세르산 인산화효소(phosphoglycerate kinase)"],"B1-55":["3-PG를 2-PG로 바꾸는(인산기 위치 이동) 효소는?","자리옮김효소(인산글리세르산 자리옮김효소, mutase)"],"B1-56":["2-PG에서 물을 빼 PEP(고에너지 이중결합)를 만드는 효소는?","에놀레이스(enolase)"],"B1-57":["PEP에서 ATP가 생성되며 만들어지는 최종 산물은?","피루브산"],"B1-58":["PEP에서 ATP를 만들며 피루브산을 생성하는 효소는?","피루브산 인산화효소(pyruvate kinase)"],"B1-59":["해당과정에서 직접 ATP를 만드는 단계 수는?","2단계"],"B1-36":["해당과정의 순 ATP 수지는?","2개"],"B1-38":["해당과정에서 생성되는 CO2는?","0개"],"B1-61":["해당과정을 포도당 1분자 기준으로 요약하면?","피루브산 2개 · ATP 순 2개 · NADH 2개"],"B1-34":["해당과정의 에너지 투자기에서 소비되는 ATP는?","2개"],"B1-35":["해당과정의 에너지 회수기에서 생성되는 ATP는?","4개"],"B1-39":["강의 노트에서 해당과정의 총 에너지 생성률로 같이 적은 것은?","ATP 2개와 NADH 2개"]},"hubPanel":null};

// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact));
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
function speak(t) {
  t = ttsNorm(t);
  const my = ++speakSeq, at = i;
  const advance = (ms) => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, ms);
  if (!('speechSynthesis' in window)) { if (playing) advance(3500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = () => { if (started) advance(700); };
  u.onerror = () => { if (!started) advance(3000); };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started && my === speakSeq) { speechSynthesis.cancel(); advance(3000); } }, 2500);  // 목소리가 없으면 글만 3초
}
function go(k) {
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) setTimeout(() => { if (playing) next(); }, 3500);
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; speechSynthesis && speechSynthesis.cancel(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i + 1); else speechSynthesis && speechSynthesis.cancel(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) speechSynthesis && speechSynthesis.cancel(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
</script>
</body>
</html>
