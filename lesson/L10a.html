<script>
/* lesson_store.js — 과 목록 · 과 화면이 함께 쓰는 저장 도우미(보기 화면 명세 §1.1).
   빌드(build_lesson.js)가 두 화면에 그대로 끼워 넣는다(__STORE__) — 열쇠 이름 · 꼴이 한 군데서만 정해진다.
   열쇠: lesson_stars {ID: 찍은 때(ms)} · lesson_prefs {onlyStar, autoNext, rep, scope} · lesson_ab_<ID> {a: sid, b: sid}
   읽기 · 쓰기는 모두 try/catch — 저장이 막힌 브라우저에서는 그 쪽을 떠날 때까지만 기억하고 오류를 내지 않는다.
   (lesson_<ID> · lesson_shuffle · lesson_srs_inbox · lesson_auto_start 는 여기서 건드리지 않는다) */
const LStore = (() => {
  const mem = {};
  const rd = (k, d) => {
    let ok = false;
    try { const v = localStorage.getItem(k); ok = true; if (v !== null && v !== undefined) { const o = JSON.parse(v); mem[k] = o; return o; } } catch (e) {}
    if (ok) { delete mem[k]; return d; }   // 저장소는 멀쩡한데 값이 없다 = 다른 탭에서 지웠다 — 메모리 값도 버린다
    return k in mem ? mem[k] : d;
  };
  const wr = (k, o) => { mem[k] = o; try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) {} };
  const del = k => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} };
  const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
  const REP = ['off', 'ab', 'one', 'list'];
  return {
    stars() { const s = rd('lesson_stars', {}); return isObj(s) ? s : {}; },
    isStar(id) { return id in LStore.stars(); },
    setStar(id, on) {
      const s = { ...LStore.stars() };
      if (on) s[id] = Date.now(); else delete s[id];
      if (Object.keys(s).length) wr('lesson_stars', s); else del('lesson_stars');
      return on;
    },
    prefs() {
      const p = rd('lesson_prefs', {}); const o = isObj(p) ? p : {};
      return { onlyStar: !!o.onlyStar, autoNext: !!o.autoNext, rep: REP.includes(o.rep) ? o.rep : 'off', scope: o.scope === 'star' ? 'star' : 'all' };
    },
    setPrefs(patch) { const p = { ...LStore.prefs(), ...patch }; wr('lesson_prefs', p); return p; },
    ab(id) { const v = rd('lesson_ab_' + id, null); return isObj(v) ? { a: typeof v.a === 'string' ? v.a : null, b: typeof v.b === 'string' ? v.b : null } : { a: null, b: null }; },
    setAb(id, v) { const k = 'lesson_ab_' + id; if (v && (v.a || v.b)) wr(k, { a: v.a || null, b: v.b || null }); else del(k); },
    REP,
  };
})();

const L = {"id":"L10a","scene":"s10","part":"a","title":"한 레일 위 보라 정거장 셋 — 리보솜 세 자리와 번역 세 걸음","sub":"겨자색 중산모(5′) 레일(mRNA · 5′→3′) · 큰 돔 + 작은 상자(소단위체 · 70S/80S) · 위에서 뚝 P(개시) · 점선 끝 코사크(스캐닝 · 코작) · 바닥 레일 토막의 빛나는 판(샤인-달가노 · fMet 포크) · 들고 들어옴 A · 자판기 + 쪼개진 동전(합성효소 · ATP→AMP) · 고무 이빨 열쇠(요동 · 이노신) · 사슬이 구슬에게(P→A) · 천장 집게(rRNA 리보자임) · 빈손 E · 나무판(방출 인자) · 금 간 네모 칩(GTP 1 · 2 · 2)","img":"img/L10a.webp?v=1cf86e7c1f16","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"긴 겹줄 레일 — 왼쪽 끝에 겨자색 중산모 · 그 위에 똑같은 보라 정거장 셋이 왼쪽에서 오른쪽으로","fact":"리보솜은 mRNA를 5′→3′로 읽는다(A자리 쪽이 3′)","hook":"모자(5′)에서 오른쪽으로","say":"화면을 가로지르는 긴 겹줄 레일을 보자. 레일은 mRNA이며, 왼쪽 끝의 겨자색 중산모는 5′ 캡이다. 레일 위에 줄지어 놓인 똑같은 보라 정거장 셋은 모자 반대쪽인 오른쪽으로 이동한다. 리보솜이 mRNA를 5′에서 3′로 읽는 방향이다. 레일은 코돈을 순서대로 제시하는 주형이다. 왼쪽 정거장은 번역을 막 시작했고, 가운데는 진행 중이며, 오른쪽은 마무리 단계다. 오른쪽으로 갈수록 구슬 사슬이 길어지는 이유다.","box":null,"src":["s10p01#0"],"cards":["F0-121","F0-86"]},{"sid":"s2","obj":"정거장마다 위의 보라 돔이 아래의 작은 상자보다 훨씬 크다 — 작은 상자가 레일을 문다","fact":"큰 · 작은 소단위체 — 원핵 70S(50S+30S) · 진핵 80S(60S+40S)","hook":"큰 돔 + 작은 상자 · S는 안 더한다","say":"각 정거장의 위쪽 보라 돔과 아래 작은 상자를 비교해 보자. 큰 돔은 큰 소단위체, 레일을 무는 작은 상자는 작은 소단위체다. 원핵에서는 오십 S와 삼십 S가 모여 칠십 S, 진핵에서는 육십 S와 사십 S가 모여 팔십 S가 된다. S 값은 단순히 더하지 않는다. 정거장은 rRNA와 단백질로 이루어지며, rRNA는 세균 리보솜에 세 가닥, 진핵 리보솜에 네 가닥 있다. mRNA에 결합하는 쪽은 레일을 무는 작은 소단위체다. 진핵세포의 번역도 이렇게 세포질의 리보솜에서 진행된다. 테트라사이클린·스트렙토마이신은 주로 칠십 S를 막아 세균 리보솜을 멈추고 우리 세포질 리보솜은 거의 건드리지 않는 선택적 독성을 보인다. 이 장면은 야영장 풀밭의 보라 짝을 크게 확대한 모습이다.","box":[[770,170,620,620],[890,780,260,220]],"src":["s10p01#1"],"cards":["A0-57#1","F0-17","F0-88","F0-90","F0-111","F0-89"]},{"sid":"s3","obj":"왼쪽 정거장 — 가운데 좌석에 위에서 곧장 떨어져 앉는 사람(구슬 하나) · 오른쪽 좌석은 비었다 · 정거장 앞 바닥에 금 간 짙은 회색 네모 칩 하나","fact":"개시 tRNA는 P자리에 곧장 앉는다(A를 건너뛴다)","hook":"위에서 가운데로 뚝","say":"왼쪽 정거장에서는 한 사람이 위에서 바로 떨어져 가운데 좌석에 앉는다. 손에 든 구슬은 하나뿐이고, 오른쪽 좌석은 비어 있다. 개시 tRNA는 A자리를 거치지 않고 곧바로 P자리에 결합한다. 개시 코돈은 AUG, 구슬은 메티오닌이다. 정거장 앞 바닥의 금 간 짙은 회색 네모 칩도 보자. 이 덱에서 네모 칩은 GTP이고, 금이 간 모습은 사용했다는 뜻이다. 개시 복합체가 완성될 때 GTP 하나를 사용한다.","box":[[290,60,190,580],[460,490,150,230],[350,1015,62,62]],"src":["s10p01c#0"],"cards":["F0-120","F0-22","F0-119"]},{"sid":"s13","obj":"왼쪽 정거장 — 겨자색 중산모에서 레일 위를 따라 정거장의 아래 상자(레일을 문 기단)까지 이어진 점선 화살 · 그 기단 바로 오른쪽 레일 위에서 팔짱 끼고 쭈그려 한 다리를 기단 쪽으로 찬 코사크 춤꾼(넓적한 털모자 · 탄띠 단 긴 남색 웃옷 · 붉은 허리띠)","fact":"진핵 개시 — 작은 소단위체가 5′ 캡에 붙어 AUG 까지 훑음(스캐닝) · 코작 서열에서 멈춤 · Met","hook":"모자에서 시작한 점선 = 캡에 붙은 뒤 훑어 옴(스캐닝) · 코사크 = 코작(Kozak) 서열 — 상자가 멈추는 자리 · 거기 떨어져 앉은 사람의 구슬 = Met","say":"왼쪽 정거장의 시작 위치를 확인해 보자. 겨자색 중산모에서 출발한 점선 화살표가 레일 위를 따라 정거장 아래의 작은 상자, 즉 레일을 문 기단까지 이어진다. 이 상자는 작은 소단위체다. 진핵에서는 작은 소단위체가 먼저 5′ 캡에 붙은 뒤, mRNA를 훑으며 개시 AUG를 찾는다. 이를 스캐닝이라고 한다. 상자 바로 앞 레일 위에는 넓적한 털모자와 탄띠를 두른 긴 웃옷을 입은 코사크 춤꾼이 있다. 팔짱을 끼고 쪼그려 앉아 한 다리를 상자 쪽으로 차고 있다. 코사크에서 코작 서열을 떠올리자. 작은 소단위체는 아무 AUG에서나 멈추는 것이 아니라 주변이 최적 서열인 AUG를 알아본다. 코작 서열은 리보솜이 바로 붙는 자리가 아니라 스캐닝 중 인식하는 문맥이다. 그곳에 내려앉은 사람이 든 구슬은 진핵의 개시 아미노산인 메티오닌이다.","box":[[18,835,250,110],[486,768,140,150]],"cards":["F0-117","F0-176","F0-118#2"]},{"sid":"s14","obj":"레일 아래 바닥 — 모자 없는 짧은 두 줄 레일 토막 · 그 위의 빛살 뻗는 금빛 둥근 판에 작은 보라 상자가 위에서 곧장 떨어져 앉았다(점선 없음) · 상자 위 구슬에 붙어 솟은 작은 포크","fact":"원핵 개시 — 작은 소단위체가 샤인-달가노 서열에 곧장 결합(훑지 않음) · 개시 아미노산 fMet","hook":"모자 없는 레일 = 캡 없는 세균 mRNA · 빛나는 판 = 샤인(shine)-달가노 · 곧장 떨어져 앉음 = 스캐닝 없음 · 포크(포르밀) + 구슬(메티오닌) = fMet","say":"레일 아래 바닥에는 모자가 없는 짧은 레일 토막이 있다. 세균의 mRNA이다. 그 위의 빛살이 뻗는 금빛 둥근 판에 작은 보라 상자가 바로 내려앉아 있다. 점선이 없는 점을 보자. ‘빛난다’는 샤인에서 샤인-달가노 서열을 연결한다. 원핵의 작은 소단위체는 스캐닝하지 않고 이 서열에 직접 결합해 바로 옆 AUG에서 번역을 시작한다. 상자 위의 구슬에는 작은 포크가 붙어 있다. 포크는 포르밀, 구슬은 메티오닌이므로 세균의 개시 아미노산인 포르밀메티오닌, fMet이다. 진핵은 캡에서 스캐닝하고 Met으로, 원핵은 샤인-달가노에 직접 결합하고 fMet으로 시작한다.","box":[[620,962,292,140]],"cards":["F0-118","F0-118#1"]},{"sid":"s4","obj":"가운데 정거장 오른쪽 좌석 — 막 들어와 앉은 사람(다리가 아직 오른쪽 밖으로) · 손에 금빛 구슬 하나","fact":"A자리 — 아미노아실 tRNA가 들어온다 · 아미노산을 나르는 것은 tRNA","hook":"오른쪽 = 들고 들어온다","say":"가운데 정거장의 오른쪽 좌석을 보자. 막 들어온 사람의 다리가 아직 오른쪽 밖에 걸쳐 있고, 손에는 금빛 구슬 하나가 있다. 사람은 tRNA, 구슬은 아미노산이다. 아미노산을 리보솜으로 운반하는 tRNA가 새로 들어오는 자리가 A자리다.","box":[[1080,430,310,370]],"src":["s10p01#2"],"cards":["F0-108","F0-87"]},{"sid":"s5","obj":"가운데 정거장 오른쪽 옆 자판기 — 동전을 넣으면 창 안의 금빛 구슬이 받친 손으로 내려온다 · 바닥에 쪼개진 동전 반쪽 둘","fact":"아미노아실-tRNA 합성효소가 ATP로 아미노산을 tRNA에 싣는다(ATP→AMP+PPi · PPi→2Pi)","hook":"구슬 자판기 = 합성효소 · 쪼개진 동전 둘","say":"정거장 오른쪽 자판기에 다음 사람이 동전을 넣고 아래 칸에 손을 받치고 있다. 창 안의 금빛 구슬이 화살표를 따라 손으로 내려오며, 바닥에는 쪼개진 동전 반쪽 둘이 있다. 자판기는 아미노아실 tRNA 합성효소, 동전은 ATP이다. 이 효소는 ATP를 사용해 알맞은 아미노산을 tRNA에 붙인다. ATP는 AMP와 피로인산으로 분해되고, 피로인산은 곧 무기 인산 둘로 나뉜다. 고에너지 결합 둘에 해당하는 에너지를 쓰므로 동전 반쪽도 둘이다. 구슬을 받은 사람은 충전된 tRNA이다. 자판기는 아미노산마다 하나씩, 스무 가지쯤 있다고 연결하자.","box":[[1290,690,240,370],[1270,1000,150,70]],"src":["s10p01#3"],"cards":["F0-100","F0-102","F0-177#2","F0-98","F0-99","F0-177","F0-101"]},{"sid":"s6","obj":"오른쪽 좌석 아래 · 레일을 문 작은 상자 옆 열쇠구멍으로 가는 세 이빨 열쇠 — 끝 이빨 하나만 빨간 고무라 흔들린다","fact":"요동 — 코돈 셋째 자리 결합이 느슨해 tRNA 하나가 코돈 여럿을 읽는다(이노신→U·C·A)","hook":"고무 이빨 하나 = 요동","say":"오른쪽 좌석 바로 아래, 레일을 무는 작은 상자 옆의 열쇠구멍에 이빨 셋인 열쇠가 들어간다. 열쇠는 tRNA의 안티코돈, 구멍은 mRNA의 코돈이다. 이빨 둘은 단단하지만 끝의 하나만 빨간 고무여서 흔들린다. 요동, 동요 또는 워블의 단서다. 코돈 셋째 자리와 안티코돈 첫째 자리의 결합이 유연해 tRNA 하나가 여러 코돈을 읽을 수 있다. 안티코돈 첫 자리가 이노신이면 U·C·A와, U이면 코돈 셋째 자리의 A·G와 짝을 이룬다. 따라서 아미노산 코돈은 61개지만 tRNA 종류는 그보다 적다. 한 아미노산을 여러 코돈이 지정하는 것은 유전암호의 중복성이고, 그 코돈들을 tRNA 하나가 읽게 하는 것은 요동이다.","box":[1090,800,200,110],"src":["s10p01#6"],"cards":["F0-103","F0-104","F0-105","F0-107","F0-91","F0-24","F0-106"]},{"sid":"s7","obj":"가운데 좌석 — 쥐고 있던 구슬 사슬을 오른쪽 사람의 금빛 구슬에 넘겨 잇는 사람(흰 화살표가 오른쪽으로) · 다른 손은 비었다","fact":"P자리 — 사슬은 P의 tRNA에서 A의 tRNA로 옮겨 간다","hook":"사슬이 구슬에게로","say":"가운데 좌석의 사람이 들고 있던 구슬 사슬을 오른쪽 사람의 금빛 구슬에 넘겨 연결한다. 흰 화살표도 오른쪽을 가리키며, 넘겨준 사람의 다른 손은 비어 있다. 자라는 사슬을 단 tRNA가 P자리에 있다. 새 구슬이 사슬 쪽으로 오는 것이 아니라, 사슬이 새 구슬 쪽으로 넘어간다. 방향은 P에서 A이다. 따라서 사슬은 새 구슬이 붙는 C 말단 쪽으로 자란다. 처음 붙은 구슬은 N 말단이며, 정거장 밖으로 먼저 나오는 쪽도 N 말단이다.","box":[930,410,260,380],"src":["s10p01#4","s10p01c#1"],"cards":["F0-109","F0-124","F0-122","F0-123","F0-132"]},{"sid":"s8","obj":"잇는 자리를 돔 천장에서 내려온 보라 집게가 집는다 · 사슬을 넘기는 사람에게는 동전이 없다","fact":"펩타이드 결합은 큰 소단위체 rRNA(리보자임)가 잇는다 · ATP·GTP 따로 안 씀","hook":"정거장 천장의 집게 = rRNA","say":"사슬과 새 구슬이 만나는 지점을 보자. 돔 천장에서 내려온 보라 집게가 둘을 연결한다. 사람이 아니라 정거장 자체가 연결하는 모습이다. 펩타이드 결합을 촉매하는 것은 큰 소단위체의 rRNA이며, 리보자임인 펩티딜 전이효소다. 사슬을 넘기는 사람에게 동전이 없는 이유도 확인하자. 이 결합 단계에서 ATP나 GTP를 별도로 소비하는 것이 아니라, 앞서 자판기에서 사용한 에너지를 이용한다.","box":[[1010,230,160,380]],"src":["s10p01#3"],"cards":["F0-100","F0-102","F0-177#2","F0-98","F0-99","F0-177","F0-112","F0-113"]},{"sid":"s9","obj":"가운데 정거장 왼쪽 좌석 — 빈손으로 왼쪽으로 걸어 나가는 사람","fact":"E자리 — 아미노산을 넘긴 tRNA가 나간다","hook":"왼쪽 = 빈손으로 나간다","say":"가운데 정거장의 왼쪽 좌석에서는 한 사람이 빈 두 손을 펼치고 왼쪽으로 나간다. 아미노산을 넘겨준 tRNA의 출구인 E자리다. 정거장이 레일에서 코돈 하나만큼 이동하면, 오른쪽에서 사슬을 받은 사람은 가운데 자리로 옮겨 앉고 사슬을 넘겨준 사람은 왼쪽 자리로 밀려난다. 이 자리옮김을 전위, translocation 또는 전좌라고 한다.","box":[[725,420,235,420]],"src":["s10p01#5"],"cards":["F0-110","F0-125"]},{"sid":"s10","obj":"오른쪽 정거장 — 오른쪽 좌석에 사람 대신 나무판이 섰다 · 가운데 사람 손에서 긴 사슬이 풀려 정거장 바닥 틈으로 흘러내린다 · 정거장 앞 바닥에 금 간 네모 칩 둘","fact":"종결 — 종결 코돈에 tRNA 대신 방출 인자가 앉아 사슬을 놓는다","hook":"사람 아닌 판 = 방출 인자","say":"오른쪽 정거장의 오른쪽 좌석에는 사람 대신 나무판이 서 있다. 구슬을 가져오지 않으므로 사슬을 더 이을 수 없다. 가운데 사람의 손에서 긴 구슬 사슬이 풀려 정거장 바닥 밖으로 내려온다. 종결 코돈에는 tRNA 대신 방출 인자가 결합하고 폴리펩타이드 사슬이 방출된다. 방출 인자가 사슬 끝에 물 한 분자를 붙여 tRNA와의 연결을 끊는 가수분해다. 앞 바닥의 금 간 네모 칩 둘은 일을 마친 정거장이 돔과 상자로 분리될 때 세균에서 쓰는 GTP 둘을 나타낸다.","box":[[1800,450,120,200],[1620,410,200,540],[1680,1018,105,62]],"src":["s10p01c#2"],"cards":["F0-128","F0-129","F0-130","F0-131"]},{"sid":"s11","obj":"세 정거장의 오른쪽 좌석만 나란히 — 빔 → 구슬 든 사람 → 나무판","fact":"세 걸음은 A자리에서 갈린다 — 개시는 건너뛰고 · 신장은 받고 · 종결은 판이 온다","hook":"바뀌는 건 오른쪽 좌석뿐","say":"세 정거장의 오른쪽 좌석만 차례로 보자. 왼쪽은 비어 있고, 가운데에는 구슬을 든 사람이, 오른쪽에는 나무판이 있다. 가운데 좌석은 계속 사람이 차지한다. 번역의 세 단계를 구별하는 단서는 A자리다. 개시 때는 A자리를 건너뛰고, 신장 때는 새 tRNA가 들어오며, 종결 때는 tRNA가 아닌 방출 인자가 들어온다.","box":[[460,490,150,230],[1080,430,310,370],[1800,450,120,200]],"src":["s10p01c#3"],"cards":["F0-114"]},{"sid":"s12","obj":"가운데 정거장을 오른쪽 좌석부터 — 구슬 들고 들어와 앉은 노란 옷 → 가운데 좌석에서 사슬을 넘겨 이음 → 왼쪽 좌석에서 빈손으로 걸어 나가는 하늘색 옷 · 정거장 앞 바닥에 금 간 네모 칩 둘","fact":"A(들어옴) → P(펩타이드 보유) → E(나감)","hook":"이름 말고 하는 일로","say":"가운데 정거장을 오른쪽부터 다시 따라가 보자. 구슬을 들고 들어온 뒤 사슬을 넘겨 연결하고, 빈손으로 나간다. A는 들어오는 자리, P는 펩타이드를 보유하는 자리, E는 나가는 자리다. 신장의 각 단계에는 신장 인자라는 단백질들이 도움을 준다. 자리 이름을 사람의 행동과 함께 기억하자. 정거장 앞 바닥의 금 간 네모 칩 둘은 신장 한 걸음에 쓰는 GTP 둘이다. 새 tRNA가 코돈을 인식해 들어올 때 하나, 자리옮김에 하나를 사용한다. 번역의 직접 에너지원은 이처럼 주로 GTP이다.","box":[[725,170,665,620],[970,1018,110,62]],"src":["s10p01#7"],"cards":["F0-172","F0-127","F0-126","F0-115"]}],"cq":{"F0-121":["리보솜은 mRNA를 어떤 방향으로 읽는가?","5' → 3'"],"F0-86":["번역에서 mRNA의 역할은?","코돈 정보를 제공하는 주형"],"A0-57#1":["진핵/원핵 리보솜 크기와 소단위체 — 「진핵 80S」? (↔ 원핵 70S)","60S+40S"],"F0-17":["진핵세포에서 번역은 어디서 일어나는가?","세포질의 리보솜"],"F0-88":["리보솜의 주요 구성 성분 두 가지는?","rRNA와 단백질"],"F0-90":["리보솜의 rRNA 분자 수는 세균과 진핵에서 각각 몇 개인가?","세균 3개 · 진핵 4개"],"F0-111":["리보솜의 작은 소단위체는 주로 무엇과 결합하는가?","mRNA"],"F0-89":["테트라사이클린·스트렙토마이신이 억제하는 것은?","세균 70S 리보솜을 주로 불활성화(진핵 세포질 80S 에는 거의 영향 없음 · 미토콘드리아 리보솜에는 영향 줄 수 있음) — 선택적 독성"],"F0-120":["개시 tRNA가 처음 자리잡는 리보솜 자리는?","P 자리"],"F0-22":["AUG가 지정하는 아미노산은?","메티오닌"],"F0-119":["번역 개시복합체 완성에 필요한 에너지는?","GTP 1분자"],"F0-117":["작은 소단위체가 AUG를 찾는 과정을 무엇이라 하는가?","스캐닝"],"F0-176":["진핵 번역 개시에서 스캐닝하는 소단위체가 인식하는 개시 AUG 주변 최적 서열은?","코작(Kozak) 서열"],"F0-118#2":["원핵과 진핵의 번역 개시 방식 차이 — 「진핵」? (↔ 원핵)","5'캡 결합 후 스캐닝·Met"],"F0-118":["원핵과 진핵의 번역 개시 방식 차이는?","원핵=작은 소단위가 mRNA 특정 서열(샤인-달가노)에 직접 결합·개시 아미노산 fMet · 진핵=5'캡 결합 후 스캐닝·Met"],"F0-118#1":["원핵과 진핵의 번역 개시 방식 차이 — 「원핵」? (↔ 진핵)","작은 소단위가 mRNA 특정 서열(샤인-달가노)에 직접 결합·개시 아미노산 fMet"],"F0-108":["리보솜의 A 자리는?","새로운 아미노아실 tRNA가 들어오는 자리"],"F0-87":["번역에서 아미노산을 리보솜으로 운반하는 RNA는?","tRNA"],"F0-100":["아미노산이 붙은 tRNA를 무엇이라 하는가?","충전된 tRNA"],"F0-102":["아미노산과 tRNA가 결합할 때 ATP는 최종적으로 어떻게 되는가?","AMP와 두 개의 무기인산으로 전환된다"],"F0-177#2":["펩타이드 결합을 실제로 촉매하는 성분과 에너지 소모 여부는?","ATP/GTP 같은 별도 에너지 소모는 없다(에너지는 이미 아미노아실-tRNA 결합에 저장)"],"F0-98":["특정 아미노산을 해당 tRNA에 붙이는 효소는?","아미노아실 tRNA 합성효소"],"F0-99":["아미노아실 tRNA 합성효소가 사용하는 에너지원은?","ATP"],"F0-177":["펩타이드 결합을 실제로 촉매하는 성분과 에너지 소모 여부는?","큰 소단위체의 rRNA(리보자임=펩티딜 전이효소)가 촉매하며, ATP/GTP 같은 별도 에너지 소모는 없다(에너지는 이미 아미노아실-tRNA 결합에 저장)"],"F0-101":["아미노아실 tRNA 합성효소의 종류 수는 대략 몇 개인가?","20개"],"F0-103":["동요 wobble 이란?","코돈 3번째 염기와 안티코돈 1번째(5′) 염기 사이의 결합이 느슨한 현상"],"F0-104":["동요가 중요한 이유는?","하나의 tRNA가 여러 코돈을 인식할 수 있 function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]

if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour'); repPaint();
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(startAt()); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
</html>
