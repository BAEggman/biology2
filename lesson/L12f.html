<script>
const L = {"id":"L12f","scene":"s12","part":"f","title":"돌 머리의 입과 운하 들머리 — 소화의 길 · 소화 호르몬 · 배고픔과 배부름","sub":"빵이 가는 한 줄 길: 큰 돌 머리의 입(돌 이빨 · 레이스 앞치마 일꾼의 가위 · 입천장 주둥이의 침) → 목 방(인두) → 노란 미끄럼 관(식도) → L12a 의 큰 강철 통(위) → 쇠살문(유문) → L12b 의 돌 운하(십이지장). 길목마다 선 초병이 제 발밑에 음식이 왔을 때만 붉은 물길(피)에 흰 봉투(호르몬)를 띄운다 — 통 위의 방독면 병사(가스트린) · 운하 둑의 「쉿」 요원(세크레틴 → 섬 뜬 연못이 흰 분필을) · 감시 카메라(CCK → 주전자 인부와 초록 주머니) · 쇠살문에 줄을 건 지프(GIP). 통 위의 으르렁 도깨비(그렐린) · Y 쌍둥이(PYY) · 랩 싸는 기름 공 사람(렙틴) · 섬의 주사기 든 사람(인슐린)의 봉투는 붉은 관을 타고 돌 머리 꼭대기 관제탑(포만중추)에 모여 입 앞의 차단기(식욕)를 올리고 내린다.","img":"img/L12f.webp?v=5ea65bc1ea39","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"빵이 가는 한 줄 길 — 왼쪽 큰 돌 머리의 벌린 입 → 머리 뒤쪽의 목 방 → 노란 미끄럼 관 → 가운데 큰 강철 통 → 통 오른쪽 아래의 쇠살문 → 오른쪽 끝까지 뻗은 돌 운하 (틀)","fact":"입 → 인두 → 식도 → 위 → 소장 … 항문 · 섭취 → 소화 → 흡수 → 배설","hook":"돌 머리의 입 = 입 · 목 방 = 인두 · 노란 미끄럼 관 = 식도 · 강철 통 = 위 · 돌 운하 = 소장 · 벽돌 곳간 = 간 · 섬 뜬 연못 = 이자","say":"빵 한 덩이가 이동하는 길을 왼쪽에서 오른쪽으로 따라가 보자. 돌 머리의 벌린 입은 입, 머리 뒤쪽 목 방은 인두, 노란 미끄럼 관은 식도다. 이어지는 큰 강철 통은 L12a에서 본 위이고, 쇠살문 너머의 돌 운하는 L12b에서 본 소장이다. 운하는 그림 오른쪽 밖으로 이어지며 끝에는 항문이 있다. 길 위쪽의 붉은 벽돌 곳간은 간, 섬이 떠 있는 연못은 이자다. 입, 인두, 식도, 위, 소장, 간, 이자, 항문이 이 장면에 나타난 포유동물 소화계의 주요 기관이다. 음식 처리는 네 단계로 기억하자. 입으로 들이는 섭취, 부수고 자르는 소화, 운하 벽으로 받아들이는 흡수, 남은 것을 내보내는 배설이다. 각 구간의 역할도 다르다. 구강에서는 기계적 소화가 시작되고, 위는 저장과 단백질 소화를 맡으며, 소장에서는 대부분의 화학적 소화와 흡수가 일어난다.","cards":["G0-0","G1-1","G1-204"],"box":null},{"sid":"s2","obj":"길에 딸린 샘 넷 — 돌 머리 입천장의 쇠 주둥이 셋 · 운하 위쪽, 우물처럼 높은 둥근 돌 수반의 섬 뜬 연못(홈통 둘이 운하로 내려온다) · 붉은 벽돌 곳간 · 곳간에서 나온 초록 관에 매달린 초록 주머니","fact":"소화계 = 소화관 + 부속샘 넷(침샘 · 췌장 · 간 · 담낭)","hook":"음식이 지나는 한 줄 길 = 소화관 · 입천장 주둥이 = 침샘 · 섬 뜬 연못 = 췌장(이자) · 붉은 벽돌 곳간 = 간 · 초록 주머니 = 담낭","say":"음식이 직접 지나가는 한 줄 길이 소화관이고, 길 바깥에서 관을 통해 소화액을 부어 주는 쪽이 부속샘이다. 포유류 소화계는 소화관과 부속샘으로 이루어진다. 이 그림에서는 부속샘을 네 군데로 짚어 본다. 첫째, 돌 머리 입천장의 쇠 주둥이 셋은 입 안에 침을 떨어뜨리는 침샘이다. 둘째, 둥근 돌 수반의 섬 뜬 연못은 췌장, 즉 이자다. 홈통 둘로 운하에 액체를 붓고, 가운데 작은 섬은 L49a에서 본 이자섬이다. 셋째, 붉은 벽돌 곳간은 L12b에서 본 간이다. 초록 관으로 초록 즙인 담즙을 내보낸다. 넷째, 그 관에 매달린 초록 주머니는 담낭이다. 간이 만든 담즙을 모았다가 짜낸다. 침샘, 췌장, 간, 담낭에는 음식이 직접 지나가지 않고, 각각 관으로 소화관에 연결된다.","cards":["G1-5","G1-6"],"box":[[408,544,150,34],[1104,122,352,384],[1452,88,258,416],[1556,628,112,196]]},{"sid":"s3","obj":"돌 머리의 입 안 — 위아래 흰 돌 이빨 사이, 입 앞쪽에 큰 빵 덩이가 걸쳤고 부스러기가 튄다 · 혀 위에 선 일꾼(밀 이삭을 수놓은 흰 레이스 앞치마)이 가위로 흰 실에 꿴 보랏빛 포도알 줄(동글동글한 보라 알 넷)을 끊는다 · 가윗날 사이 실 위에 파란 물방울 하나 · 혀 위에는 두 알씩 끊긴 토막 둘","fact":"기계적 소화 = 부숴서 표면적 ↑ · 화학적 소화 = 효소 가수분해 — 입에서는 아밀레이스","hook":"돌 이빨 = 기계적 소화 · 가위 = 효소가 결합을 끊음 · 물방울 = 물로 끊는 가수분해 · 밀 이삭 + 레이스 = (아)밀레이스 · 실에 꿴 포도 줄 = 녹말","say":"입 안에서는 두 가지 소화가 함께 시작된다. 먼저 돌 이빨을 보자. 큰 빵을 물어 부스러기로 만든다. 음식을 잘게 부수어 표면적을 늘리는 기계적 소화다. 다음으로 혀 위의 일꾼은 가위로 포도 줄을 자른다. 큰 분자를 흡수 가능한 작은 분자로 가수분해하는 화학적 소화다. 가윗날 사이의 끊어지는 자리에 물방울이 떨어져 있다. 소화효소가 물을 써서 결합을 끊는 효소 가수분해를 나타낸다. 일꾼의 레이스 앞치마에는 밀 이삭이 수놓여 있다. 밀과 레이스를 이어 아밀레이스를 떠올리자. 곧은 실에 꿴 포도 줄은 녹말이며, 포도 한 알은 포도당이다. 잘린 토막이 포도 두 알씩인 것은 엿당을 나타낸다. 구강에서 시작되는 대표적인 화학적 소화는 아밀레이스에 의한 탄수화물 소화다.","cards":["G1-2","G1-3","G1-4","G1-76"],"box":[[170,540,422,214]]},{"sid":"s4","obj":"입천장의 쇠 주둥이 셋 밑 — 파란 물방울 셋 · 흰 네모 알갱이 셋(소금) · 금이 가고 작은 조각이 튀는 초록 알약 꼴 세균(눈이 ×) · 분홍 막대사탕 / 머리 뒤쪽의 목 방 — 코끝으로 들어 윗턱 위 콧길을 따라 온 흰 바람과 입에서 온 둥근 빵 덩이가 한 방에 있고 · 방 아래로는 마디마디 고리 진 회색 관(끝이 말린 흰 바람 가닥이 그리로 든다) · 옆으로는 노란 미끄럼 관","fact":"침 = 물 · 염 · 점액성 당단백질 · 세포 · 라이소자임 / 인두 = 음식과 공기가 함께 지남","hook":"물방울 = 물 · 흰 소금 = 염 · 막대사탕 = 당단백질 · 금 간 초록 세균 = 라이소자임 · 바람과 빵이 만나는 목 방 = 인두 · 고리 진 관 = 기관 · 미끄럼 관 = 식도","say":"침샘인 주둥이 셋에서 무엇이 떨어지는지 보자. 파란 방울은 물이며, 침은 대부분 물이다. 흰 알갱이는 소금, 즉 염이다. 분홍 막대사탕은 당 사슬이 붙은 단백질인 점액성 당단백질로, 음식을 미끄럽게 감싼다. 초록 세균의 껍질이 갈라져 부서지는 모습은 세균 세포벽을 허무는 라이소자임을 뜻한다. 여기에 입 안에서 떨어져 나온 세포까지 더하면, 침의 주요 성분은 물, 염, 점액성 당단백질, 세포, 라이소자임이다. 이제 머리 뒤쪽의 목 방을 보자. 콧구멍에서 들어온 흰 바람과 입에서 넘어온 빵이 같은 방을 지난다. 음식과 공기가 함께 지나는 부위인 인두다. 여기서 길이 갈려 바람은 아래의 고리 있는 회색 관인 기관, L46f 쪽으로 가고, 빵은 옆의 노란 미끄럼 관인 식도로 간다.","cards":["G1-74","G1-73"],"box":[[372,544,132,118],[588,456,186,300],[586,722,56,170]]},{"sid":"s5","obj":"큰 강철 통 — 통 속의 큰 반죽 덩이에 밀려 통의 오른쪽 벽이 밖으로 불룩 휘었다(벽 밖에 떨림 줄) · 통 가장자리 오른쪽에서 철모와 방독면을 쓴 병사가 흰 봉투를 붉은 물길 쪽으로 내민다 · 통 안벽의 벽돌 인부는 질그릇 항아리를 기울여 맑은 물줄기를 붓고 · 기둥 인부가 든 초록 병 위로 베이지 거품이 뭉게뭉게 솟았다 · 가장자리에 선 불붙은 성냥 위에 위 화살 · 누운 주황 막대(배턴) 위에 아래 화살","fact":"위벽이 늘어나면 G세포의 가스트린 → 위액 ↑ · ECL 히스타민(산 ↑) · D 소마토스타틴(산 ↓)","hook":"방독면 = 가스 → 가스트린 · 불룩한 통 벽 = 위벽이 늘어남 · 붓는 두 인부 = 위액 · 불붙은 성냥 = 히스타민(↑) · 놓인 배턴 = 소마토스타틴(↓)","say":"빵이 미끄럼 관을 지나 위에 해당하는 통으로 들어간다. 큰 반죽 덩이 때문에 통의 오른쪽 벽이 불룩해졌다. 위벽이 늘어나면 가스트린이 분비된다. 통 가장자리의 방독면 병사를 보자. 방독면의 가스에서 가스트린을 떠올리면 된다. 병사는 호르몬을 나타내는 흰 봉투를 혈액인 붉은 물길에 띄운다. 봉투가 피를 돌아 통의 두 인부에게 도착하면, 벽세포인 벽돌 인부는 흙 항아리의 염산을 더 붓고, 주세포인 기둥 인부는 초록 병의 펩시노겐을 더 붓는다. 가스트린의 핵심 작용은 위액 생성 촉진이다. 병사는 위샘의 G세포이며, 곁의 인부들도 위샘 세포다. 불붙은 성냥은 ECL세포의 히스타민을 나타낸다. 위 화살처럼 벽세포를 자극해 위산 분비를 촉진한다. 누운 배턴은 L49a의 풀밭에서 보았던 D세포의 소마토스타틴이다. 아래 화살처럼 위산 분비를 억제한다.","cards":["G1-163","G1-164","G1-215"],"box":[[718,476,388,532],[882,316,228,186]]},{"sid":"s6","obj":"쇠살문 바로 뒤 운하의 초록 물 · 그 둑에 선 검은 정장 · 검은 선글라스의 대머리 요원이 손가락을 입술에 대고(쉿) 다른 손에 흰 봉투를 들었다 · 요원 머리 위쪽으로 흐르는 붉은 물길과 그 너머 둥근 돌 수반의 섬 뜬 연못","fact":"산성 유미즙이 십이지장에 들면 S세포가 세크레틴 분비 → 표적 = 췌장","hook":"초록 물 = 산성 유미즙(낮은 pH) · 「쉿」 비밀 요원 = 시크릿 → 세크레틴 · Secret 의 S = S세포 · 봉투가 가는 섬 뜬 연못 = 췌장","say":"유문인 쇠살문을 지나 위의 내용물이 십이지장인 운하로 넘어온다. 문 바로 뒤의 초록 물은 위에서 온 산성 유미즙이며, L12b의 초록 산과 같은 단서다. 유미즙은 위액과 음식이 섞여 걸쭉해진 혼합물이다. 둑의 인물을 보자. 검은 정장과 선글라스를 착용하고 손가락을 입술에 대며 「쉿」이라고 한다. 비밀을 뜻하는 secret에서 세크레틴을 떠올리자. 이 요원은 십이지장의 S세포다. 발밑 물의 낮은 pH를 감지하고 흰 봉투를 붉은 물길에 띄운다. 산성 유미즙이 십이지장에 들어오면 분비되는 대표 호르몬이 세크레틴이다. 봉투의 목적지는 요원 머리 위, 붉은 물길 너머에 있는 돌 수반의 섬이 떠 있는 연못, 즉 췌장이다. 산이 너무 강하면 소장 효소가 작용하기 어렵다. 세크레틴은 위에서 온 산성 유미즙을 중화해 효소가 일할 환경을 만든다. 무엇으로 중화하는지는 다음 정거장에서 확인하자.","cards":["G1-96","G0-187","G1-97","G1-171","G1-78"],"box":[[1098,618,214,396],[1104,122,352,384]]},{"sid":"s7","obj":"섬 뜬 연못에서 운하로 내려온 왼쪽 회색 홈통 — 흰 분필 토막들이 줄지어 미끄러져 내려와 초록 물에 떨어진다 · 분필이 떨어진 자리 오른쪽부터 초록이 걷히고 물이 맑은 하늘빛이다","fact":"세크레틴 → 췌장이 중탄산염(HCO₃⁻) 분비 → 산성 유미즙 중화 · 완충","hook":"흰 분필 토막 = HCO₃⁻(중탄산염 = 염기) · 연못의 홈통 = 췌장이 분비 · 초록이 걷혀 맑아진 물 = 중화 · 완충","say":"요원의 봉투를 받은 췌장 연못을 보자. 왼쪽 홈통으로 흰 분필 토막들이 미끄러져 내려온다. 이 덱에서 흰 분필은 HCO₃⁻, 중탄산염이다. 분필을 염기의 단서로 기억하자. 세크레틴의 핵심 작용은 췌장의 중탄산염 분비를 촉진하는 것이다. 분필이 초록 물에 떨어진 자리의 오른쪽부터 초록빛이 사라지고 맑은 하늘빛으로 바뀐다. 중탄산염이 산성 유미즙을 중화하고 소장 소화에 필요한 완충 환경을 만드는 모습이다. 순서를 연결해 보자. 초록 산이 들어오면 「쉿」 요원인 세크레틴이 봉투를 띄우고, 췌장 연못이 흰 분필인 HCO₃⁻을 쏟아 위산을 중화한다.","cards":["G1-98","G1-167","G1-99","G0-188"],"box":[[1188,322,68,566],[1192,858,356,154]]},{"sid":"s8","obj":"운하 물 맨 윗면에 뜬 노란 기름 웅덩이 · 그것을 내려다보는 기둥 위 감시 카메라(붉은 불 · 웅덩이까지 퍼지는 옅은 빛 · 카메라 왼쪽 위에 뜬 흰 봉투) · 돌 수반 가장자리의 빨간 멜빵바지 인부가 긴 주둥이 주전자를 기울여 오른쪽 홈통으로 베이지 물줄기를 붓는다 · 벽돌 곳간에서 내려온 초록 관의 초록 주머니가 갈색 가죽 띠에 잘록 졸려 초록 방울을 웅덩이에 떨군다","fact":"유미즙(특히 지방)이 십이지장에 들면 CCK → 췌장 소화효소 · 담즙 분비 ↑","hook":"CCTV 카메라 = 씨씨 → CCK · 노란 기름 웅덩이 = 지방 · 드립 주전자 인부 = 췌장 소화효소 · 졸린 초록 주머니 = 담낭이 담즙을 짜냄","say":"운하를 조금 더 따라가면 노란 기름 웅덩이가 물 위에 떠 있다. 지방이다. 기둥 위 감시 카메라가 붉은 불을 켜고 웅덩이를 비춘다. CCTV의 씨씨에서 CCK, 콜레시스토키닌을 떠올리자. 유미즙이 십이지장에 들어오면 앞서 본 세크레틴과 CCK가 분비되며, 특히 지방이 많을 때 CCK가 많이 분비된다. 카메라 곁의 흰 봉투는 붉은 물길을 따라 두 곳으로 간다. 하나는 췌장 연못이다. 빨간 멜빵 인부가 L12a에서 트립신을 나타냈던 드립 주전자를 기울여 오른쪽 홈통으로 붓는다. 췌장 소화효소 분비 촉진이다. 다른 하나는 담낭인 초록 주머니다. 띠가 주머니를 조여 담즙인 초록 방울을 기름 웅덩이에 짜낸다. 담즙 분비 촉진이다. 이 두 작용을 CCK에 연결하자.","cards":["G1-165","G1-170","G1-166"],"box":[[1438,592,274,344],[1342,178,118,706]]},{"sid":"s9","obj":"쇠살문의 고리 둘(요원 발치의 작은 둥근 고리 · 문 가운데의 큰 고리)에 묶인 갈색 줄 셋 — 작은 고리에 따로 매듭지은 두 줄은 요원의 몸통(두 번 감아 옆구리에 매듭)과 감시 카메라 기둥(두 번 감아 매듭)으로 · 큰 고리의 한 줄은 운하 아래 흙바닥에 선 국방색 지프의 꽁무니로 이어졌다 / 운하 바닥 밑을 따라 지그재그로 깔린 검은 전선과 마디마다의 검은 상자","fact":"엔테로가스트론(세크레틴 · CCK · GIP) = 위 활동 억제 / 장신경계 = 분비 · 연동 조절","hook":"줄로 쇠살문을 당김 = 위를 늦춤(줄 · 고삐 = 억제) · 요원 = 세크레틴 · 카메라 = CCK · 지프 = 지아이피 → GIP · 검은 전선 그물 = 장신경계","say":"유문인 쇠살문의 고리에는 줄 세 개가 걸려 있다. 줄 끝은 요원의 허리, 카메라 기둥, 앞쪽의 국방색 지프로 이어진다. 지프에서 지아이피, GIP인 위 억제 펩타이드를 떠올리자. 셋이 함께 문을 당겨 위의 활동을 늦춘다. 이 덱에서 당기는 줄은 L49a의 고삐처럼 억제를 뜻한다. 위 활동을 억제하는 십이지장 호르몬 CCK, 세크레틴, GIP를 묶어 엔테로가스트론이라고 한다. 특히 유미즙에 지방이 많으면 위의 연동운동을 억제한다. 지방을 소화할 수 있도록 소장에 더 오래 머물게 하는 조절이다. 운하 바닥 아래의 지그재그 검은 전선도 보자. 호르몬과 함께 일하는 신경, 소화관 벽의 장신경계다. 장신경계는 소화액 분비와 연동운동을 조절한다.","cards":["G1-217","G1-168","G1-162"],"box":[[1058,762,424,374],[1108,1008,938,44]]},{"sid":"s10","obj":"돌 머리 꼭대기의 유리 관제탑 — 헤드셋을 쓴 관제사 곁에 흰 봉투 둘 · 오른쪽 끝에서 올라와 그림 맨 위를 따라 관제탑으로 드는 붉은 관(흰 꺾쇠가 위로 · 왼쪽으로) · 관제탑 밑에서 나와 얼굴 앞으로 내려온 검은 전선(중간에 노란 불꽃 별 하나)이 닿은 빨강 하양 줄무늬 차단기(비스듬히 올라갔고 팔 끝 위에 두 머리 굽은 화살) · 차단기 곁에서 기다리는 빵 수레 / 연못의 섬 위에서 주사기를 높이 든 흰 가운의 대머리","fact":"포만중추 = 소화계 신호를 통합해 식욕 조절 · 식욕 억제 셋 = 인슐린 · PYY · 렙틴","hook":"머리 꼭대기 관제탑 = 뇌의 포만중추 · 모이는 봉투 = 소화계 신호의 통합 · 차단기 = 식욕(올리면 먹고 내리면 그만) · 검은 전선 = 신경","say":"그림 맨 위로 시선을 옮겨 보자. 붉은 물길이 오른쪽 끝에서 관이 되어 올라간 뒤, 맨 위를 따라 돌 머리 꼭대기의 관제탑으로 들어간다. 흰 꺾쇠도 관제탑을 가리킨다. 관제탑은 L07e에서 보았던 뇌, 시상하부의 포만중추다. 위의 통, 운하, 기름 공 사람, 섬에서 보낸 봉투가 여기 모인다. 포만중추는 소화계의 신호를 통합해 식욕을 조절한다. 탑에서 입 앞 차단기로 내려가는 검은 전선은 신경이고, 노란 불꽃은 신호다. 식욕을 나타내는 차단기가 올라가면 빵 수레가 입으로 들어가고, 내려가면 멈춘다. 차단기를 내리라는 봉투는 세 곳에서 온다. 섬의 주사기 든 사람은 인슐린, 운하 둑의 Y 쌍둥이는 PYY, 랩을 씌우는 기름 공 사람은 렙틴이다. 셋 모두 식욕을 억제한다. 반대로 올리라는 봉투는 통 위의 도깨비가 보낸다.","cards":["G1-194","G1-201"],"box":[[268,18,276,200],[0,498,152,358],[520,16,1528,46],[2004,16,44,536],[1226,120,102,176]]},{"sid":"s11","obj":"큰 강철 통의 가장자리 왼쪽 — 뿔 하나 · 뾰족 귀의 작은 초록 도깨비가 이를 드러내고 으르렁대며 한 손에 빈 흰 그릇을, 다른 손에 숟가락을 치켜들었다 · 바로 곁 가는 붉은 관의 끝 상자에 흰 봉투가 꽂혔고 · 그 관은 위로(흰 꺾쇠) 맨 위의 붉은 관에 이어진다","fact":"그렐린 = 위에서 분비 · 식사 전 ↑ → 허기 · 식욕 증가(식욕 자극 호르몬)","hook":"으르렁 도깨비 = 그르렁 → 그렐린 · 통 위 = 위에서 분비 · 빈 그릇 = 식사 전 · 차단기를 올리는 봉투 = 식욕 ↑","say":"위에 해당하는 통의 왼쪽 가장자리를 보자. 작은 초록 도깨비가 빈 그릇을 숟가락으로 두드리며 으르렁댄다. 그르렁이라는 소리에서 그렐린을 떠올리자. 통 위에 서 있으므로 분비 장소는 위이고, 그릇이 비어 있으므로 식사 전이다. 그렐린은 식사 전에 증가해 먹이를 기대하고 섭취하도록 유도한다. 도깨비 곁 붉은 관 끝의 흰 봉투는 가는 관을 타고 올라가, 맨 위의 붉은 관을 따라 관제탑에 도착한다. 그러면 차단기가 올라간다. 그렐린은 허기를 느끼게 하고 식욕을 증가시키는 대표 호르몬이다. 나머지 세 호르몬은 반대로 차단기를 내린다.","cards":["G1-195","G1-203","G1-196","G1-202"],"box":[[738,16,150,478]]},{"sid":"s12","obj":"운하 둑 오른쪽 — 똑같이 생긴 쌍둥이 둘(삐죽 갈색 머리 · 노란 티셔츠 · 파란 반바지)이 저마다 두 팔을 위로 벌린 만세 자세(안쪽 손은 서로 맞닿았다)라 몸이 Y 자가 되었고 웃는다 · 머리 위로 흰 봉투 하나가 붉은 물길 쪽에 떠 있다","fact":"PYY = 소장에서 분비 → 식욕 억제","hook":"Y 자 쌍둥이 둘 = Y Y → PYY · 운하 둑 = 소장에서 분비 · 두 팔 번쩍 = 그만(식욕 억제)","say":"소장 운하 둑의 오른쪽에는 쌍둥이가 서 있다. 두 사람 모두 팔을 위로 벌려 몸이 Y 자다. Y가 둘이므로 PYY, 펩타이드 YY를 떠올리자. 운하 둑이라는 위치는 PYY의 분비 장소가 소장임을 나타낸다. 음식이 여기까지 왔으니 충분히 먹었다는 신호를 보내는 장면이다. 쌍둥이는 두 팔을 들고 「그만」을 외치며 흰 봉투를 붉은 물길에 띄운다. 봉투가 관제탑에 도착하면 차단기가 내려간다. PYY는 식욕을 억제한다. 그렐린 도깨비는 위에서 식사 전에 신호를 보내고, PYY 쌍둥이는 소장에서 식사 뒤에 신호를 보낸다. 위치와 시점, 작용을 서로 대비해 기억하자.","cards":["G1-197","G1-198"],"box":[[1688,538,304,328]]},{"sid":"s13","obj":"붉은 물길 너머 오른쪽 — 노란 공 여럿으로 된 웃는 사람이 작은 나무 탁자의 음식 접시 위로 두루마리에서 투명한 랩을 당겨 덮는다 · 허리께에 흰 봉투 한 장 · 발밑 붉은 물길 아래로도 봉투 하나","fact":"렙틴 = 지방조직에서 분비 → 장기적 식욕 억제 · 체지방량 조절(그렐린과 반대)","hook":"랩을 씌움 = 랩 → 렙틴 · 노란 기름 공 사람 = 지방조직 · 접시를 덮어 둠 = 오래 식욕 억제 · 도깨비(배고픔) ↔ 기름 공 사람(포만)","say":"물길 건너의 노란 공 사람을 보자. 온몸을 이룬 노란 공은 기름방울이므로 지방조직을 나타낸다. 이 사람이 음식 접시에 투명한 랩을 씌우고 있다. 랩에서 렙틴을 떠올리자. 렙틴은 지방조직에서 분비된다. 접시를 랩으로 덮는 동작은 한동안 먹지 않겠다는 뜻이다. 렙틴은 장기적으로 식욕을 억제하고 체지방량을 조절한다. 몸에 기름 공이 많을수록 랩을 더 당기는 모습과 연결하자. 저장 지방이 많으면 렙틴이 늘어 덜 먹게 되고, 지방이 줄면 렙틴도 줄어 더 먹게 된다. 봉투가 붉은 물길을 타고 관제탑으로 가면 차단기가 내려간다. 그렐린은 배고픔을 늘리고 렙틴은 포만감을 늘린다는 차이를 함께 떠올리자.","cards":["G1-199","G1-200","G1-211"],"box":[[1768,252,244,334]]},{"sid":"s14","obj":"되짚기 — 봉투를 띄우는 초병 셋의 자리: 통 가장자리의 방독면 병사 / 운하 둑의 「쉿」 요원과 감시 카메라 · 두 홈통 가운데 요원 쪽(왼쪽)에는 흰 분필, 오른쪽에는 주전자 인부의 베이지 물줄기 · 카메라 곁에는 띠에 졸린 초록 주머니","fact":"가스트린 = 위 / CCK · 세크레틴 = 십이지장 · 세크레틴 = 중탄산염 / CCK = 효소 · 담즙","hook":"제 발밑에 음식이 온 초병이 봉투를 띄움 = 단계적 활성 · 통 = 방독면(가스트린) · 운하 = 요원(세크레틴 → 분필) · 카메라(CCK → 주전자 · 초록 주머니)","say":"길을 되짚으며 세 초병의 위치를 비교해 보자. 가스트린인 방독면 병사는 위의 통 위에 있으므로 위를 중심으로 조절한다. 세크레틴인 「쉿」 요원과 CCK인 감시 카메라는 운하 둑에 있으므로 십이지장을 중심으로 조절한다. 운하의 두 초병도 역할은 다르다. 요원 쪽 홈통의 흰 분필은 세크레틴에 의한 중탄산염 분비이고, 카메라 쪽의 주전자 인부와 초록 주머니는 CCK에 의한 소화효소와 담즙 분비다. 이 그림에서 셋은 모두 자기 발밑에 음식이 도착하면 봉투를 띄운다. 음식 도착이 대표 자극이고, 가스트린은 음식을 보거나 떠올릴 때 미주신경을 거쳐서도 나온다. 빵이 통을 불룩하게 하면 병사가, 초록 산이 문을 넘어오면 요원이, 기름이 뜨면 카메라가 움직인다. 음식이 도달한 위치에 맞춰 필요한 소화액을 분비하려고 소화가 단계적으로 활성화되는 것이다.","cards":["G1-169","G1-208","G1-161"],"box":[[962,342,150,164],[1098,618,104,244],[1438,592,118,264]]}],"cq":{"G0-0":["포유동물의 소화계 주요 기관은?","입, 인두, 식도, 위, 소장, 간, 이자, 항문"],"G1-1":["음식 처리 과정 4단계는?","섭취, 소화, 흡수, 배설"],"G1-204":["구강, 위, 소장의 소화 역할을 순서대로 비교하면?","구강은 기계적 소화 시작 · 위는 저장·단백질 소화 · 소장은 대부분의 화학적 소화·흡수"],"G1-5":["포유류 소화계는 크게 무엇으로 구성되는가?","소화관과 부속샘"],"G1-6":["포유류 소화계 부속샘 4가지는 const ov = $('ov'); ov.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
let tourEnded = false;
let mode = 'tour', i = -1, playing = false, voice = true, rate = 1.0, quizOrder = [], quizPos = 0, quizRevealed = false, shuffle = false, sess = null;
const stops = L.stops;
subShow();
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID
const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact), st.sid);
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate,
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
</html>
