<script>
const L = {"id":"L53b","scene":"s53","part":"b","title":"바닷속 버터 부교 ② 저절로 드는 문 — 선택적 투과 · 확산 · 삼투 · 통로와 운반체","sub":"L53a 와 같은 버터 띠(세포막) — 왼쪽 맨 틈: 빽빽한 데서 드문 데로 지나는 흰 방울 · 어두운 방울(확산) · 버터에 녹는 기름방울과 고리 넷 봉인 봉투(비극성 · 스테로이드 호르몬 = 단순확산) · 땀 흘리는 물방울 · 튕기는 포도 · 물방울이 끌어안은 소금 자루(물은 느림 · 극성 · 수화껍질 이온) · 판자 벽과 해바라기(삼투 · 팽압) / 잠든 징수원과 빈 동전함(에너지 없음) / 오른쪽 구슬 기둥: 늘 열린 틈과 회전문(통로 · 운반체 · 특이성) · 포도 줄(포화) · 문짝 하나 · 날개 다섯 회전문(GLUT1 · GLUT5) · 번개 문과 열쇠 문(개폐성 이온통로) · 동전 크랭크 펌프(능동수송과 견주기).","img":"img/L53b.webp?v=ea4cb68b5679","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"L53a 와 같은 긴 노란 버터 띠 — 왼쪽은 부표 사람들의 맨 다리 사이 틈 · 오른쪽은 구슬 기둥의 문들 · 위 물에는 흰 방울 · 포도 · 흰 소금 자루가, 아래 물에는 어두운 방울 · 은빛 칼이 빽빽하다 (틀)","fact":"선택적 투과성 = 일부만 통과 — 영양물질 유입 · 노폐물 배출 · 이온 농도 조절","hook":"띠 = 세포막 · 지나는 것과 튕기는 것 = 선택적 투과 · 위아래 물의 다른 손님 = 농도를 따로 지킴 · 기둥의 문 = 수송 단백질","say":"L53a에서 보았던 버터 띠다. 위쪽 밝은 물은 세포 밖, 아래쪽 짙은 물은 세포 안이다. 이번에는 누가 띠를 건너는지 보자. 어떤 물질은 지나지만 다른 물질은 튕겨 나오는 성질이 선택적 투과성이다. 세포는 포도로 나타낸 영양물질을 받아들이고 어두운 방울인 노폐물을 내보내야 하므로 막을 통한 교환이 필요하다. 위쪽에는 흰 소금 자루(Na⁺), 아래쪽에는 은빛 칼(K⁺)이 빽빽하다. 세포가 막 양쪽의 무기 이온 농도를 다르게 유지해 내부 전하와 생리 기능을 지킨다는 모습이다. 소수성인 버터 속은 수용성 물질과 이온을 잘 통과시키지 않으므로, 오른쪽 구슬 기둥인 수송 단백질이 필요하다. 왼쪽의 맨 틈부터 오른쪽 문까지 따라가 보자.","cards":["A1-40","A1-41","A1-42","A1-149"],"box":null},{"sid":"s2","obj":"왼쪽 끝 — 위 물에 빽빽한 흰 방울 무리 · 띠 속 다리 사이를 내려가는 흰 방울 둘(곁에 ↓ 화살) · 아래 물엔 둘뿐 / 바로 곁은 거꾸로 — 아래 물에 빽빽한 어두운 방울 · 띠 속을 오르는 둘(곁에 ↑ 화살) · 위 물엔 둘뿐","fact":"확산 = 용질이 농도 기울기를 따라 퍼짐 · 수동수송의 대표 둘 = 확산 + 삼투","hook":"빽빽한 쪽 → 드문 쪽 = 농도 기울기를 따라 · 흰 방울(O₂)은 안으로 · 어두운 방울(CO₂)은 밖으로 = 저마다 제 기울기","say":"왼쪽 끝의 위쪽 물에는 흰 방울(O₂)이 빽빽하지만 아래에는 둘뿐이다. 방울 둘이 다리 사이로 내려가고, 밀어 주는 사람은 없다. 용질 입자가 농도 기울기를 따라 많은 곳에서 적은 곳으로 저절로 퍼지는 확산이다. 바로 옆의 어두운 방울(CO₂)은 아래에 많고 위에는 둘뿐이며, 띠 사이의 두 방울은 위로 올라간다. 같은 틈을 통해 산소는 안으로, 이산화탄소는 밖으로 이동한다. 각 물질이 자신의 농도 기울기를 따르기 때문이다. 에너지 없이 기울기를 따라 막을 건너는 수동수송의 대표는 이 확산과, 뒤에서 판자 벽 아래에서 볼 삼투다.","cards":["A1-60","A1-61"],"box":[[8,70,162,910],[148,150,130,870]]},{"sid":"s3","obj":"띠 윗면에서 아랫면 너머까지 길게 늘어져 흘러내리는 노란 기름방울 · 그 곁 띠 속에 비스듬히 기운 채 지나는 흰 봉투 — 큼직한 금빛 봉인에 고리 넷(육각 셋 + 오각 하나)이 새겨졌다","fact":"비극성 소수성 분자(탄화수소 · CO₂ · O₂)는 이중층에 녹아 통과 · 스테로이드 호르몬 = 단순확산","hook":"버터에 녹는 기름방울 = 비극성(소수성 속에 용해) · 고리 넷 봉인 봉투 = 스테로이드 호르몬 · 기둥 없이 = 단순확산","say":"노란 기름방울이 버터 윗면에 닿자 녹아 길게 늘어나며 아래로 흘러나온다. 기름이 기름에 녹듯, 비극성 소수성 분자는 지질 이중층의 소수성 내부에 녹아 막단백질 없이 쉽게 통과한다. 탄화수소와 앞서 본 흰 방울 O₂, 어두운 방울 CO₂가 그 예다. 옆에서는 흰 봉투도 비스듬히 기울어 띠를 지난다. 봉투는 호르몬이고, 금빛 봉인의 육각 셋·오각 하나로 된 고리 넷은 지용성 스테로이드 호르몬의 표지다. L53a의 우편함 기둥인 막 수용체를 거치지 않고 버터를 통과하는 단순확산이다.","cards":["A1-43","A1-44","A1-45","A1-46"],"box":[[240,425,80,372],[290,470,194,188]]},{"sid":"s4","obj":"띠 속 다리 사이에서 얼굴을 찡그리고 땀을 뻘뻘 흘리는 파란 물방울 · 띠 윗면에 부딪혀 튕겨 오르는 포도 · 파란 물방울들이 빙 둘러 끌어안아 뚱뚱한 공이 된 흰 소금 자루(띠 위에 걸터앉았을 뿐 틈에 못 든다)","fact":"물은 느리게 통과 · 극성 친수성 분자는 소수성 중심부를 못 지남 · 이온은 전하 + 수화껍질","hook":"땀 흘리며 낀 물방울 = 물은 느림 · 튕기는 포도 = 극성 친수성 · 물방울이 끌어안은 소금 자루 = 수화껍질로 커진 이온","say":"통과하기 어려운 손님도 보자. 파란 물방울 하나가 다리 사이에 끼어 땀을 뻘뻘 흘린다. 물은 작지만 극성이 있어 비극성 분자만큼 빠르게 지나지 못하고 느리게 통과한다. 위의 포도, 포도당은 버터 표면에 부딪혀 튕긴다. 극성 친수성 분자는 인지질 이중층의 소수성 중심부를 통과하기 어렵다. 가장 난처한 손님인 흰 소금 자루(Na⁺)는 파란 물방울들이 둘러싸 안아 뚱뚱한 공이 되었다. 수화껍질이다. 이온은 전하 자체가 통과를 어렵게 하는 데다, 달라붙은 물 분자로 실제 크기까지 커져 막을 통과하기가 특히 어렵다. 소금 자루는 띠 위에 걸터앉았을 뿐 틈 안에도 들어가지 못한다.","cards":["A1-48","A1-49","A1-50"],"box":[[585,478,150,145],[385,282,200,108],[566,278,152,165]]},{"sid":"s5","obj":"부표 머리 둘을 납작 누른 나무 판자 벽 · 그 위에 꼿꼿이 선 해바라기 · 판자 아래 띠 속을 ↓ 화살을 따라 내려가는 파란 물방울들 · 아래 물에 떼로 내려온 물방울들 · 그 밑의 사과 · 포도 더미","fact":"삼투 = 선택적 투과막을 통한 물의 확산 · 팽압 = 식물세포의 지나친 팽창을 막고 지지","hook":"사과 · 포도(당) 더미로 몰려드는 물방울 = 삼투(용질 많은 쪽으로) · 나무 판자 벽 = 세포벽 · 납작 눌린 머리 = 팽압 · 꼿꼿한 해바라기 = 지지","say":"아래 물에는 사과와 포도가 쌓여 있다. 과당과 포도당인 당 분자는 띠를 건너지 못하지만, 파란 물방울들은 화살표를 따라 띠를 지나 아래의 더미로 떼 지어 모여든다. 선택적 투과막을 통한 물의 확산인 삼투다. 물은 용질이 적고 물이 많은 쪽에서 용질이 많은 쪽으로 이동한다. 물이 들어오면 내부가 부풀지만, 이 부분은 띠 바로 바깥에 나무 판자 벽이 덧대어져 있다. 이 덱에서 나무 판자를 가진 세포는 식물세포이고, 판자는 세포벽이다. 부푼 띠가 벽을 밀고 벽이 되밀어 부표 머리 둘이 납작해진 모습은 팽압이다. 지나친 팽창을 막고 식물을 지지하므로 판자 위 해바라기가 꼿꼿이 서 있다.","cards":["A1-62","A1-84"],"box":[[714,60,192,386],[690,446,250,580]]},{"sid":"s6","obj":"첫 구슬 기둥 꼭대기에 걸터앉아 눈을 감고 코 방울을 부는 제복 징수원 · 곁에 뚜껑이 열려 아래로 늘어진 놋쇠 동전함(동전이 한 닢도 없다) — 징수원이 앉은 틈 기둥(구슬 줄 둘)을 경계로 그림의 왼쪽 구간은 구슬 기둥이 없는 맨 틈 · 오른쪽 구간은 구슬 기둥의 문들","fact":"단순확산 · 촉진확산 = 둘 다 에너지 없이 기울기 따라 / 촉진확산만 수송단백질 필요","hook":"잠든 징수원 · 빈 동전함 = 에너지(동전 = ATP)를 안 받음 · 화면 왼쪽 맨 틈 = 단순확산 · 화면 오른쪽 기둥 문 = 촉진확산","say":"맨 틈에서 구슬 기둥으로 넘어가는 경계를 보자. 첫 기둥 위의 통행료 징수원은 코로 방울을 불며 잠들었고, 놋쇠 동전함은 뚜껑이 아래로 열려 있지만 동전 한 닢 없이 비어 있다. 동전은 ATP이므로 여기서는 에너지를 지불하지 않는다. 징수원 왼쪽의 기둥 없는 틈은 단순확산, 오른쪽 기둥의 문은 촉진확산이다. 둘 다 에너지를 쓰지 않고 농도 기울기에 따라 많은 곳에서 적은 곳으로 이동하는 수동수송이다. 차이는 수송단백질의 필요 여부다. 촉진확산은 막단백질의 도움을 받지만 단순확산에는 필요하지 않다. 문을 통과한다고 ATP를 쓰는 것은 아니다.","cards":["A1-64","A1-65","A1-66","A1-67"],"box":[[948,165,160,188]]},{"sid":"s7","obj":"나란히 선 두 기둥 — 위에서 아래까지 좁은 틈이 뚫린 기둥(은빛 칼이 지난다) · 둥근 회전문을 품은 기둥(포도가 탔다) · 회전문 기둥 꼭대기의 붉은 원반이 사과를 오른쪽으로 밀어낸다","fact":"친수성 물질은 수송 단백질로 통과 — 통로단백질 + 운반단백질 · 높은 특이성","hook":"뚫린 틈 기둥 = 통로단백질 · 회전문 기둥 = 운반단백질 · 사과를 밀어내는 붉은 원반 = 높은 특이성(제 손님만)","say":"버터에서 튕겨 나왔던 손님들은 구슬 기둥 벽 안쪽의 길로 이동한다. 지질 이중층인 버터에 닿지 않으므로 친수성 분자도 수송 단백질을 통해 건널 수 있다. 수송 단백질은 크게 두 종류다. 위아래로 좁은 틈이 난 것은 통로단백질이고, 둥근 회전문이 있는 것은 운반단백질이다. 문마다 받아들이는 손님도 정해져 있다. 틈에는 칼(K⁺)만, 회전문에는 포도(포도당)만 들어간다. 회전문 위에 앉은 붉은 원반인 적혈구가 사과를 팔로 밀어낸다. 적혈구의 포도당 운반체는 포도당의 구조 이성질체인 과당조차 받아들이지 않는다는 단서다. 수송 단백질은 대체로 특이성이 높다.","cards":["A1-51","A1-52","A1-58"],"box":[[910,292,100,600],[1088,292,208,650],[1196,196,150,100]]},{"sid":"s8","obj":"틈 기둥 — 은빛 칼들이 날을 위로 하고 한 줄로 틈을 따라 올라온다(꼭대기 밖으로 빠져나온 칼 하나) / 회전문 — 양옆 놋쇠 굽은 벽 두 짝 사이(위아래가 트였다)에서 도는 유리 문짝 · 문짝에 탄 포도 한 알 · 굽은 화살이 도는 방향을 가리킨다 · 먼저 지난 포도가 아래 굴에 하나 · 굴 밖 아래 물에 하나","fact":"통로단백질 = 친수성 통로 제공 / 운반단백질 = 결합하면 모양이 바뀌어 옮김","hook":"늘 뚫린 틈 = 친수성 통로(줄지어 흐름) · 손님을 태우고 도는 회전문 = 결합 → 모양 변화 → 반대편에 내려놓음","say":"틈 기둥과 회전문의 작동을 비교하자. 통로단백질은 막을 가로지르는 친수성 통로를 제공한다. 칼들이 날을 위로 향한 채 줄지어 지나는 모습은 L23a 벽 밑의 늘 열린 K⁺ 누출 통로와 연결된다. 회전문은 놋쇠로 된 굽은 벽 둘 사이에서 유리 문짝이 돌아간다. 문짝이 항상 가로막고 있어 위아래가 한꺼번에 열리지 않는다. 포도 한 알이 붙으면 문이 회전하고 반대편에 내려놓는다. 운반단백질에 물질이 결합하면 형태가 바뀌어 물질을 옮기는 과정이다. 통로는 구멍을 제공하고, 운반체는 붙잡은 뒤 모양을 바꾼다.","cards":["A1-53","A1-54","A1-143"],"box":[[916,180,76,710],[1110,490,160,160],[1160,690,62,250]]},{"sid":"s9","obj":"포도 회전문 위 물에 길게 굽어 늘어선 포도 줄 — 기둥 꼭대기의 붉은 원반(가운데가 옅은 분홍 · 웃는 얼굴) 곁까지 이어졌다 · 회전문 안에는 한 알뿐","fact":"촉진확산 대상 = 수용성 극성 물질 · 이온 / 운반체 수 한정 → 최대속도(포화) · 단순확산은 직선","hook":"회전문 앞의 긴 줄 = 포화(최대 속도) · 줄 선 포도 · 틈의 칼 = 극성 물질과 이온 · 맨 틈의 흰 방울 = 몰린 만큼(직선)","say":"촉진확산으로 건너는 손님은 누구일까? 회전문 앞 포도와 틈을 지나는 칼, 즉 수용성 극성 물질과 이온이다. 회전문 위에는 포도들이 길게 굽은 줄로 늘어서 있지만 문 안에는 한 번에 한 알만 들어간다. 줄이 길어져도 운반체 수가 한정되어 더 빨리 옮길 수 없다. 따라서 촉진확산의 속도에는 천장 같은 한계, 즉 최대속도가 있어 포화된다. 왼쪽 끝의 흰 방울은 맨 틈으로 단순확산하므로 줄을 설 필요가 없다. 농도차가 커지는 만큼 속도도 직선적으로 증가한다는 차이다.","cards":["A1-68","A1-69"],"box":[[996,58,218,262]]},{"sid":"s10","obj":"포도 회전문 — 곧은 유리 문짝이 한 장 · 꼭대기에 붉은 원반 / 그 오른쪽 사과 회전문 — 별 꼴 유리 날개 다섯 · 사과가 탔다(위에는 기다리는 사과 · 아래 굴에는 먼저 지난 사과 하나) / 두 회전문 사이 위 물 — 손을 맞잡고 나란히 선 포도와 흰 소금 자루(둘 다 얼굴 · 팔다리)","fact":"GLUT(촉진확산 운반체) — 적혈구 GLUT1 · 과당 GLUT5 / 소장 포도당은 SGLT","hook":"붉은 원반의 문짝 하나 = 적혈구 GLUT1 · 날개 다섯 사과 문 = 과당 GLUT5 · 소금 자루와 손잡은 포도 = SGLT(Na⁺ 공수송)","say":"포도 회전문은 GLUT, 글루코스 트랜스포터다. 포도당을 촉진확산으로 옮기는 운반단백질 계열이다. 위에 붉은 적혈구 원반이 앉고 곧은 유리 문짝이 한 장인 회전문은 적혈구 막의 GLUT1이다. 적혈구의 포도당은 이 문을 통해 촉진확산한다. 오른쪽의 별 모양 날개 다섯 회전문에는 사과인 과당이 탔다. 소장에서 과당을 촉진확산시키는 GLUT5이다. 소장의 포도당은 다른 길로 들어간다. 두 회전문 사이 위쪽에서 포도와 흰 소금 자루가 손을 맞잡는다. Na⁺와 함께 이동하는 SGLT를 통한 2차 능동수송이다. 짝 손님의 문은 다음 그림 L53c에서 이어진다.","cards":["A1-70","A1-161","A1-162","G1-120","G1-121"],"box":[[1110,490,160,160],[1196,204,86,90],[1360,490,160,160],[1284,78,174,108]]},{"sid":"s11","obj":"오른쪽의 틈 기둥 둘 — 꼭대기마다 쇠살 문이 달렸다(둘 다 열려 섰다) · 하나는 노란 번개를 맞았고 · 하나는 쇠살에 꽂힌 큰 놋쇠 열쇠를 주먹이 쥐고 있다","fact":"이온통로 = 이온을 통과시키는 통로단백질 · 개폐성 통로 = 자극(여기서는 전기 · 화학)에 여닫힘","hook":"틈 기둥 = 이온통로 · 쇠살 문 = 개폐(게이트) · 번개 = 전기적 자극 · 열쇠 = 화학적 자극","say":"틈 기둥으로 이동하는 칼과 소금은 이온이고, 이들을 통과시키는 통로단백질이 이온통로다. 앞의 틈은 늘 열려 있었지만 오른쪽 두 기둥 위에는 쇠살 문이 있다. 자극에 따라 열리고 닫히는 개폐성 통로(gated channel)이다. 여기서 비교할 자극은 두 가지다. 왼쪽 문은 노란 번개를 맞아 열리는 전기적 자극이다. 오른쪽 문은 큰 놋쇠 열쇠가 꽂혀 있고 주먹이 그 열쇠를 쥔 화학적 자극이다. 번개 아니면 열쇠라는 두 단서를 구분하자.","cards":["A1-71","A1-72","A1-73"],"box":[[1560,62,106,240],[1806,210,128,92]]},{"sid":"s12","obj":"번개 맞은 문 — 열린 꼭대기로 은빛 칼 둘이 솟아 나온다(아래 물에는 칼이 여럿 모였다) / 열쇠 꽂힌 문 — 기울어진 흰 소금 자루의 소금이 틈으로 쏟아져 내려 아래 물에 흰 알갱이로 흩어진다","fact":"전기 자극 개폐 = 신경세포의 K⁺ 통로 / 화학 자극 개폐 = 수송 물질 아닌 다른 물질이 결합","hook":"번개 문으로 솟는 칼 = 전압 개폐 K⁺ 통로(신경세포) · 열쇠 = 수송 물질(소금)이 아닌 다른 물질이 붙어 엶","say":"번개를 맞은 문에서는 은빛 칼(K⁺)이 위로 나온다. 세포 안인 아래쪽에 많던 칼이 문이 열리자 기울기를 따라 밖으로 이동한다. 전기적 자극에 반응하는 관문 통로의 예인 신경세포의 전압의존성 K⁺ 통로이며, L23a의 칼 아치와 연결된다. 열쇠가 꽂힌 문으로는 흰 소금(Na⁺)이 쏟아져 들어온다. 문을 연 것은 통과하는 소금이 아니라 열쇠다. 수송되는 물질과 다른 물질이 결합해 여닫는 화학적 자극의 관문 통로로, L23b에서 아세틸콜린이 연 창살문과 같다. 두 문 모두 열린 뒤에는 손님이 기울기를 따라 많은 곳에서 적은 곳으로 저절로 이동한다.","cards":["A1-74","A1-75"],"box":[[1626,128,66,172],[1572,740,140,280],[1712,150,104,150],[1740,868,110,128]]},{"sid":"s13","obj":"맨 오른쪽 구슬 기둥의 놋쇠 펌프 상자(크랭크) — 금빛 동전 하나는 상자 밑 투입구에 반쯤 들어갔고 하나는 아래 물에서 ↑ 화살을 따라 올라오는 중 · 기둥 꼭대기에서 흰 소금 줄기가 위로 솟는다 · 위 물에는 흰 소금 자루가 여섯 · 아래 물에는 하나 — 왼쪽 맨 틈 · 가운데 기둥 문들과 견줌 (되짚기)","fact":"에너지 = 능동만 ATP · 단백질 = 단순만 불필요 · 방향 = 촉진 순행 / 능동 역행","hook":"맨 틈 = 기둥 ✕ 동전 ✕ · 기둥 문 = 기둥 ○ 동전 ✕ · 동전 펌프 = 기둥 ○ 동전 ○ + 빽빽한 쪽으로 거슬러","say":"맨 오른쪽 기둥은 크랭크가 달린 놋쇠 펌프다. 아래에서 금빛 동전을 넣자 흰 소금이 위로 뿜어진다. 위에는 소금 자루가 이미 여섯, 아래에는 하나뿐인데도 농도 기울기를 거슬러 옮긴다. 이 동전 크랭크 펌프는 다음 그림의 주인공인 Na⁺-K⁺ 펌프이며, 능동수송을 나타낸다. 이제 왼쪽부터 에너지, 단백질, 방향을 비교하자. 단순확산의 맨 틈과 촉진확산의 기둥 문은 동전 없이 작동하고, 능동수송 펌프만 ATP를 쓴다. 맨 틈에는 단백질 기둥이 필요 없지만 문과 펌프에는 필요하다. 문은 많은 곳에서 적은 곳으로 기울기를 따라 순행하고, 펌프는 기울기를 거슬러 역행한다.","cards":["A1-140","A1-141","A1-142"],"box":[[1896,488,140,296],[1846,60,196,256],[1950,860,64,70]]}],"cq":{"A1-40":["막의 선택적 투과성(selective permeability)이란?","일부 물질은 통과시키고 다른 물질은 막는 성질"],"A1-41":["세포가 물질 교환을 해야 하는 이유 2가지는?","영양물질 유입 + 노폐물 배출"],"A1-42":["세포가 무기 이온 농도를 막을 가로질러 조절하는 이유는?","세포내 전하와 생리 기능을 유지하기 위해"],"A1-149":["세포막에서 '선택적 투과성'과 '수송 단백질'의 관계는?","막은 친수성/이온성 물질을 잘 통과시키지 않으므로 수송 단백질이 필요하다."],"A1-60":["수동 수송의 대표 2가지는?","확산 + 삼투"],"A1-61":["확산(diffusion)이란?","용질 입자가 농도 기울기를 따라 퍼지는 현상"],"A1-43":["지질 이중층을 쉽게 통과하는 분자는?","비극성 소수성 분자"],"A1-44":["지질 이중층을 쉽게 통과하는 비극성 분자 예시는?","탄화수소 · CO2 · O2"],"A1-45":["비극성 분자가 막 단백질 없이도 통과 가능한 이유는?","지질 이중층의 소수성 내부에 용해될 수 있기 때문"],"A1-46":["지용성(스테로이드) 호르몬이 세포막을 통과하는 방식은?","단순확산"],"A1-48":["물은 비극성 분자만큼 빠르게 통과하는가?","아니오"],"A1-49":["극성 친수성 분자가 막을 잘 통과하지 못하는 이유는?","인지질 이중층의 소수성 중심부를 지나기 어렵기 때문"],"A1-50":["이온이 막을 특히 통과하기 어려운 이유는?","전하 자체와 수화껍질 때문에 효과적인 크기가 커지기 때문"],"A1-62":["삼투(osmosis)란?","선택적 투과막을 통한 물의 확산"],"A1-84":["팽압이 식물에 주는 효과는?","세포가 더 이상 지나치게 팽창하지 않게 하고 지지력을 준다"],"A1-64":["단순확산과 촉진확산의 공통점은?","둘 다 에너지 없이 농도 기울기를 따라 일어나는 수동 수송"],"A1-65":["단순확산과 촉진확산의 차이는?","촉진확산은 수송단백질이 필요하지만 단순확산은 필요 없다"],"A1-66":["촉진 확산(facilitated diffusion)이란?","막 단백질 도움을 받는 수동 수송"],"A1-67":["촉진 확산은 에너지를 쓰는가?","아니오"],"A1-51":["친수성 분자가 지질 이중층 접촉을 피하며 통과하는 방법은?","수송 단백질 이용"],"A1-52":["수송 단백질의 두 큰 종류는?","통로단백질(channel protein) + 운반단백질(carrier protein)"],"A1-58":["수송 단백질은 대체로 어떤 성질을 가지는가?","높은 특이성"],"A1-53":["통로단백질(channel protein)이란?","막을 가로지르는 친수성 통로를 제공하는 단백질"],"A1-54":["운반단백질(carrier protein)이란?","통과 물질이 결합하면 모양이 바뀌어 물질을 이동시키는 단백질"],"A1-143":["통로단백질 vs 운반단백질의 차이는?","통로는 친수성 구멍 제공 · 운반체는 결합 후 모양 변화"],"A1-68":["촉진 확산의 대표 운반 대상은?","수용성 극성 물질과 이온"],"A1-69":["촉진확산과 단순확산의 속도 특성 차이는?","촉진확산은 운반체 수가 한정돼 최대속도(포화)가 있음 · 단순확산은 농도차에 비례해 직선 증가"],"A1-70":["포도당이 적혈구 막을 통과하는 방식과 운반체는?","촉진확산 · GLUT 운반단백질"],"A1-161":["포도당·과당을 촉진확산으로 옮기는 수송체 계열과 과당 담당은?","GLUT 계열(예: 적혈구 GLUT1) · 과당은 GLUT5"],"A1-162":["소장에서 포도당과 과당의 흡수 방식 차이는?","포도당=SGLT로 Na⁺ 공수송(2차 능동) · 과당=GLUT5 촉진확산"],"G1-120":["과당은 소장에서 주로 어떤 방식으로 흡수되는가?","촉진확산"],"G1-121":["포도당은 소장에서 주로 어떤 방식으로 흡수되는가?","능동수송"],"A1-71":["이온통로(ion channel)란?","이온을 통과시키는 통로 단백질"],"A1-72":["개폐성 통로(gated channel)란?","자극에 따라 열리거나 닫히는 통로"],"A1-73":["개폐성 통로를 여닫는 자극 2가지는?","전기적 자극 + 화학적 자극(기계적 자극으로 열리는 통로도 있다)"],"A1-74":["전기적 자극에 반응하는 관문 통로의 예로 노트에 언급된 것은?","신경세포에서 칼륨 관련 통로"],"A1-75":["화학적 자극에 반응하는 관문 통로란?","수송 물질이 아닌 다른 물질이 결합해 열리고 닫히는 통로"],"A1-140":["단순확산 vs 촉진확산 vs 능동수송을 에너지 사용 기준으로 비교하면?","단순/촉진확산은 무에너지 · 능동수송은 ATP 필요"],"A1-141":["단순확산 vs 촉진확산 vs 능동수송을 단백질 필요 여부 기준으로 비교하면?","단순확산은 불필요, 촉진확산·능동수송은 필요"],"A1-142":["촉진확산 vs 능동수송을 기울기 방향 기준으로 비교하면?","촉진확산은 기울기 순행 · 능동수송은 기울기 역행"]},"hubPanel":null};
