<script>
const L = {"id":"L46h","scene":"s46","part":"h","title":"심장 집 동네 — 이웃 동물 집들 · 엄마 배 속 집 · 급수탑","sub":"앞벽을 뜯은 이웃 집들(왼쪽 방 회청 · 오른쪽 방 진홍) · 단칸 오두막 vs 높은 아파트 + 지하 펌프 관(확산 · 순환계가 필요한 까닭) · 물고기 집 위아래 두 방 + 관 한 가닥(1심방 1심실 · 단일순환) · 아가미 빗의 물 → / 피 ← (역류교환 · 젖고 얇고 넓은 호흡 표면) · 개구리 집 세 방 · 아래 큰 방에서 섞임 + 풍선 + 젖은 피부 · 흙 속 지렁이(폐피순환 · 피부호흡) · 도마뱀 집 반쯤 가린 벽(불완전 2심실) · 새와 개의 집 네 방 · 통벽(완전 분리 · 이중순환) · 구리 냄비 달팽이 · 거미의 파란 피 / 무쇠 팬의 붉은 피(헤모시아닌 구리 · 헤모글로빈 철) · 분홍 천막 속 아기 집의 둥근 구멍 · 회청 → 진홍 아치 다리관 · 탯줄이 그냥 지나는 벽돌집(난원공 · 동맥관 · 정맥관) → 태어난 집의 덧댄 둥근 판 · 지붕의 밧줄(흔적) · 급수탑의 가는 관 한 잔 / 두 배 굵은 관 쟁반 가득(푸아죄유 · 반지름⁴)","img":"img/L46h.webp?v=78b23fca0aab","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"심장 집 동네의 거리 — 이웃 집마다 앞벽을 뜯어 방이 보인다 · 왼쪽 방엔 회청 물 · 오른쪽 방엔 진홍 물 · 지붕마다 집주인 동물 (틀)","fact":"이중순환 = 양서류 · 파충류 · 조류 · 포유류(어류만 단일순환)","hook":"앞벽 뜯은 집 = 심장 · 방 수 = 심방 · 심실 · 지붕의 동물 = 누구의 심장","say":"심장 집 동네로 나왔다. 이웃 집들도 앞벽을 열어 방 안이 보이고, 우리 심장 집처럼 왼쪽에는 회청 물, 오른쪽에는 진홍 물이 있다. 지붕에는 집주인인 물고기, 개구리, 도마뱀, 새와 개가 앉아 있다. 집마다 방의 수와 벽 구조가 다르다. 척추동물 심장의 진화를 이 차이로 읽어 보자. 물고기만 단일순환이며, 양서류인 개구리부터 파충류·조류·포유류까지는 모두 이중순환이다.","box":null,"cards":["H0-23"]},{"sid":"s2","obj":"왼쪽 끝 단칸 오두막 — 창으로 들어온 흰 방울이 방 안에 고루 퍼졌다 · 곁의 높은 아파트 — 바깥에서 스며든 흰 방울은 모자라 사람들이 숨이 막혀 헐떡인다 · 지하 펌프에서 오른쪽 줄로 붉은 관이 올라가 그 방들은 흰 방울로 가득하다","fact":"확산 = 열운동으로 농도차를 따라 퍼짐 · 몸이 크면 확산만으론 멀어 순환계가 필요","hook":"단칸 오두막은 퍼지기만 해도 됨 · 큰 아파트는 펌프 관이 있어야 = 순환계","say":"왼쪽 끝 단칸 오두막에는 창으로 들어온 흰 방울이 방 전체에 퍼졌다. 분자가 열운동으로 농도가 높은 곳에서 낮은 곳으로 퍼지는 확산이다. 작은 집은 확산만으로 충분하지만, 옆의 높은 아파트에서는 바깥에서 스며든 흰 방울만으로는 모자라 주민들이 숨이 차 헐떡인다. 교환 표면에서 안쪽 세포까지의 거리가 멀면 단순확산은 너무 느리다. 지하 펌프의 붉은 관이 올라가 닿은 오른쪽 방들은 흰 방울로 가득해졌다. 다세포 동물에게 순환계가 필요한 이유다.","box":[[30,480,200,220],[245,55,290,640]],"cards":["H0-0","H0-1"]},{"sid":"s3","obj":"물고기 집 — 위에 작은 방 하나(바닥에 얕게 회청 물) · 아래 큰 방 하나(회청 물 가득) · 진홍 물은 없다 · 집에서 나간 관 한 가닥이 위의 아가미 빗으로","fact":"어류 = 1심방 1심실 · 단일순환(한 바퀴에 심장을 한 번 지난다)","hook":"방 둘 = 1심방 1심실 · 관 한 가닥 = 단일순환","say":"물고기 집에는 위의 작은 방 하나와 아래의 큰 방 하나만 있다. 1심방 1심실이다. 두 방의 물이 모두 회청색이고 진홍색이 없는 것은, 심장이 몸을 돌아온 혈액을 받아 아가미로 보내기 때문이다. 집을 나온 관 한 가닥이 위쪽 아가미 빗을 지나 곧장 몸으로 갔다가 집에 돌아온다. 한 바퀴 동안 심장을 한 번 지나는 단일순환이며 어류가 대표적이다.","box":[[570,300,270,400]],"cards":["H0-16","H0-22"]},{"sid":"s4","obj":"물고기 집 위의 커다란 붉은 아가미 빗 — 아주 얇은 젖은 잎이 수없이 달렸다 · 파란 화살(물)은 왼쪽에서 오른쪽으로 · 붉은 화살(피)은 오른쪽에서 왼쪽으로","fact":"역류교환 — 피가 물과 반대로 흘러 물의 PO₂ 가 늘 더 높다 · 호흡 표면은 젖고 얇고 넓게","hook":"엇갈린 두 화살 = 역류교환 · 수없이 많은 얇은 젖은 잎 = 넓고 얇고 젖은 호흡 표면","say":"물고기 집 위의 큰 붉은 아가미 빗을 보자. 파란 화살의 물은 왼쪽에서 오른쪽으로, 붉은 화살의 혈액은 오른쪽에서 왼쪽으로 흐른다. 역류교환이다. 두 흐름이 반대이므로 아가미 전체에서 물의 산소 분압이 혈액보다 높게 유지되어 끝까지 산소를 얻는다. 빗의 얇고 젖은 잎들이 많다는 것도 보자. 호흡 표면은 얇고 넓으며 늘 젖어 있어야 한다. 기체가 물에 녹아야 막을 쉽게 통과하기 때문이다.","box":[[540,60,470,320]],"cards":["H0-292","H0-201","H0-202"]},{"sid":"s5","obj":"젖은 초록 개구리의 집 — 위에 작은 방 둘(회청 · 진홍) · 아래 큰 방 하나에서 회청과 진홍이 섞인다 · 지붕 곁 분홍 풍선 · 집 앞 흙 속에 젖은 지렁이","fact":"양서류 = 2심방 1심실 · 폐와 피부로 가는 폐피순환고리 · 피부호흡(양서류 일부 · 지렁이)","hook":"위 둘 아래 하나 = 2심방 1심실 · 풍선 + 젖은 피부 = 폐피순환 · 지렁이 = 피부호흡","say":"젖은 초록 개구리 집은 위에 회청 방과 진홍 방이 하나씩 있지만 아래 큰 방은 하나여서 물이 섞인다. 2심방 1심실이다. 지붕 옆 분홍 풍선인 폐로 향하는 고리는 개구리의 젖은 피부에도 이어진다. 폐와 피부로 가는 폐피순환이며, 개구리가 피부로도 호흡한다는 뜻이다. 집 앞 흙 속의 젖은 지렁이도 함께 보자. 지렁이와 일부 양서류가 피부호흡의 대표다.","box":[[880,290,300,490]],"cards":["H0-17","H0-26","H0-203"]},{"sid":"s6","obj":"도마뱀의 집 — 위에 작은 방 둘 · 아래층을 가르는 벽이 반쯤만 올라와 그 위로 회청과 진홍이 넘쳐 보랏빛으로 섞인다","fact":"파충류(악어 빼고) = 2심방 불완전 2심실 — 심실 사이 벽이 덜 막혔다","hook":"반쯤 올라온 벽 = 불완전 2심실","say":"도마뱀 집은 위에 두 방이 있고 아래도 두 공간으로 나뉘지만, 가운데 벽이 절반 높이다. 회청 물과 진홍 물이 벽을 넘어 보랏빛으로 섞인다. 악어를 뺀 파충류의 일반적인 심장인 2심방 불완전 2심실이다. 심실 사이 벽이 완전하지 않아 일부 혼합이 남는다. 개구리의 단일 심실보다 분리가 진행되었지만 다음 집의 완전한 벽과는 다르다.","box":[[1195,320,300,410]],"cards":["H0-18"]},{"sid":"s7","obj":"새와 개가 함께 앉은 집 — 방 넷 · 지붕부터 바닥까지 통벽 · 회청과 진홍이 섞이지 않는다 · 관이 지붕 풍선 고리와 뜰 고리로 두 번 집을 지난다","fact":"조류 · 포유류 = 심방 · 심실 완전 분리 · 이중순환(한 바퀴에 심장 두 번) vs 어류 한 번","hook":"새 + 개 = 조류 · 포유류 · 통벽 = 완전 분리 · 두 고리 = 이중순환","say":"새와 개가 함께 앉은 집은 방 넷을 지붕부터 바닥까지 이어진 벽이 나눈다. 회청 물과 진홍 물이 섞이지 않는다. 심방과 심실이 가장 완전히 나뉜 조류와 포유류이며, 사람의 심장도 같다. 관 하나는 지붕 풍선인 폐를, 다른 관은 뜰인 몸을 돌고 온다. 한 바퀴에 심장을 두 번 지나는 이중순환이다. 물고기의 한 번과 비교하자.","box":[[1505,290,320,430]],"cards":["H0-21","H0-24","H0-282"]},{"sid":"s8","obj":"왼쪽 아래 — 등에 반짝이는 구리 냄비를 진 달팽이와 거미가 파란 피를 뚝뚝 흘린다 · 곁의 사람은 검은 무쇠 프라이팬을 들고 손끝에 붉은 피 한 방울","fact":"호흡색소 = 기체와 결합해 운반을 돕는 단백질 · 헤모시아닌(구리 · 절지 · 연체) vs 헤모글로빈(철)","hook":"구리 냄비 + 파란 피 = 헤모시아닌 · 달팽이 = 연체 · 거미 = 절지 · 무쇠 팬 + 붉은 피 = 헤모글로빈","say":"왼쪽 아래 달팽이는 반짝이는 구리 냄비를 등에 지고 파란 피를 흘린다. 옆 거미도 파란 피다. 기체와 결합해 운반을 돕는 단백질을 호흡색소라고 한다. 달팽이와 거미의 헤모시아닌은 중심 금속이 구리여서 산소와 결합하면 파란색이다. 절지동물과 많은 연체동물이 사용한다. 옆 사람은 검은 무쇠 프라이팬을 들고 손끝에는 붉은 피 한 방울이 맺혀 있다. 우리의 헤모글로빈에는 철이 있다. 구리는 파랑, 철은 빨강으로 연결하자.","box":[[20,890,470,250],[450,760,330,384]],"cards":["H0-245","H0-246","H0-247","H0-290"]},{"sid":"s9","obj":"분홍 천막(엄마 배) 속 아기 집 — 위층 두 방 사이 벽의 둥근 구멍으로 왼쪽 방의 회청 물이 오른쪽 방으로 쏟아진다 · 태어난 아기 집의 둥근 창은 둥근 판으로 덧대 막혔다","fact":"태아의 세 우회로(난원공 · 동맥관 · 정맥관) · 난원공 = 좌우 심방 사이 → 출생 후 난원와","hook":"위층 두 방 사이 둥근 구멍 = 난원공 · 덧대 막은 둥근 판 = 난원와","say":"엄마 배를 나타내는 분홍 천막 안에 아기의 작은 심장 집이 있다. 태아에게만 있다가 출생 후 닫히는 세 우회로를 찾아보자. 첫째는 위층 두 방 사이 벽의 둥근 구멍이다. 그림 왼쪽 방의 회청 물이 오른쪽으로 직접 흐르는 난원공으로, 두 심방을 연결해 아직 호흡하지 않는 폐를 우회한다. 옆의 출생 후 아기 집에서는 둥근 판이 구멍을 막았다. 난원공이 닫힌 흔적은 움푹한 난원와로 남는다.","box":[[1205,850,230,110],[1640,880,80,75]],"cards":["H2-1","H2-2"]},{"sid":"s10","obj":"아기 집 지붕 위 아치 다리관 — 왼쪽 회청에서 솟아 오른쪽 진홍으로 내려앉아 곁의 바람 빠진 풍선을 건너뛴다 · 태어난 아기가 첫 울음을 터뜨리자 그 집 지붕 풍선은 빵빵하고 아치는 마른 밧줄이 됐다","fact":"동맥관 = 폐동맥 ↔ 대동맥 → 출생 후 동맥관인대 · 닫는 자극 = 동맥혈 PO₂ ↑ · PGE₂ ↓","hook":"아치 다리관 = 동맥관 · 바람 빠진 풍선 = 안 쓰는 폐 · 첫 울음 + 빵빵한 풍선 = 산소 ↑ · 마른 밧줄 = 인대","say":"둘째는 아기 집 지붕의 아치 다리관이다. 왼쪽 회청 쪽에서 올라와 오른쪽 진홍 쪽으로 내려가며, 바람 빠진 풍선을 우회한다. 폐동맥과 대동맥을 잇는 동맥관이다. 태아의 쭈그러진 폐 대신 혈액이 이 관을 통해 몸으로 간다. 아기가 첫 울음을 터뜨리면 지붕 풍선이 부푼다. 호흡으로 동맥혈 산소 분압이 오르고 프로스타글란딘 E₂가 감소하면 동맥관이 닫힌다. 지붕에 남은 마른 밧줄이 동맥관인대다.","box":[[1225,790,200,215],[1735,755,100,165]],"cards":["H2-3","H2-5"]},{"sid":"s11","obj":"왼쪽에서 들어온 분홍 꼰 탯줄이 작은 붉은 벽돌집 앞을 그냥 지나 천막 속 아기 집 벽으로 곧장 들어간다 · 천막에서 태어난 아기 집까지는 밧줄 한 가닥","fact":"정맥관 = 제대정맥 → 하대정맥, 간을 우회 → 출생 후 정맥관인대 · 흔적 셋: 와 · 인대 · 인대","hook":"벽돌집(간)을 그냥 지나는 탯줄 = 정맥관 · 밧줄 = 인대","say":"셋째는 왼쪽에서 들어온 분홍 꼰 탯줄이 작은 붉은 벽돌집 앞을 그대로 지나쳐 곧바로 아기 집 벽으로 들어가는 길이다. 붉은 벽돌집은 간이다. 탯줄로 온 태아의 피가 간을 우회해 하대정맥으로 향하는 정맥관을 나타낸다. 출생 후 닫히면 천막과 아기 집 사이 밧줄처럼 정맥관인대가 남는다. 난원공은 난원와, 동맥관은 동맥관인대, 정맥관은 정맥관인대로 연결하자.","box":[[895,935,335,130],[1530,900,100,115]],"cards":["H2-4","H2-6"]},{"sid":"s12","obj":"오른쪽 끝 급수탑 — 가는 관은 졸졸 흘려 잔 하나를 채우고 · 두 배 굵은 관은 콸콸 쏟아 쟁반의 잔을 한꺼번에 가득 채운다","fact":"푸아죄유 — 저항은 반지름의 4제곱에 반비례 · 반지름 2배 → 저항 1/16 · 유량 16배","hook":"두 배 굵은 관 = 반지름 2배 · 쟁반 가득 = 2⁴ = 16배","say":"오른쪽 끝 급수탑의 가는 관은 잔 하나를 천천히 채운다. 옆의 두 배 굵은 관은 쟁반 위 잔들을 한꺼번에 채운다. 양이 두 배보다 훨씬 늘어나는 단서다. 푸아죄유 법칙에서 층류의 저항은 관 반지름의 4제곱에 반비례한다. 반지름이 2배가 되면 저항은 원래 값을 2의 4제곱으로 나눈 값, 즉 16분의 1로 줄고, 같은 압력에서 유량은 16배가 된다. 세동맥 굵기의 작은 변화가 혈류에 큰 영향을 주는 이유다.","box":[[1815,250,233,510]],"cards":["H2-7","H2-8","H2-9"]}],"cq":{"H0-23":["이중순환을 하는 대표 척추동물은?","양서류 · 파충류 · 조류 · 포유류"],"H0-0":["확산(diffusion)이란?","분자들이 열운동에 의해 농도차를 따라 이동하는 현상"],"H0-1":["다세포 동물에서 순환계가 필요한 이유는?","교환표면과 각 세포 사이 거리가 멀어 단순확산만으로는 물질 이동이 비효율적이기 때문"],"H0-16":["어류의 심장 구조는?","1심방 1심실"],"H0-22":["단일순환을 하는 대표 척추동물은?","어류"],"H0-292":["물고기 아가미의 역류교환(countercurrent exchange)이란?","아가미 모세혈관의 혈액이 물 흐름과 반대 방향으로 흘러, 아가미 전 길이에서 물의 산소분압이 항상 혈액보다 높게 유지 → 산소 추출 효율을 극대화"],"H0-201":["호흡 표면이 항상 습해야 하는 이유는?","기체가 물에 녹아야 막을 통과하기 쉽기 때문"],"H0-202":["효율적인 호흡 표면의 조건 두 가지는?","얇음과 넓은 면적"],"H0-17":["양서류의 심장 구조는?","2심방 1심실"],"H0-26":["양서류의 폐 쪽 순환 고리 이름은?","폐피순환고리"],"H0-203":["피부호흡을 하는 대표 동물은?","지렁이와 일부 양서류"],"H0-18":["파충류의 일반적 심장 구조는?","2심방 불완전 2심실(악어는 예외 — 심실 완전 분리)"],"H0-21":["심방과 심실이 가장 완전히 분리된 척추동물 두 무리는?","조류와 포유류"],"H0-24":["이중순환(double circulation)이란?","혈액이 한 바퀴 도는 동안 심장을 두 번 지나는 순환"],"H0-282":["단일순환과 이중순환을 비교하면?","단일순환은 한 바퀴에 심장을 한 번 · 이중순환은 두 번 지난다"],"H0-245":["호흡색소(respiratory pigment)란?","기체와 결합해 운반을 돕는 단백질"],"H0-246":["헤모시아닌의 금속 이온은?","구리"],"H0-247":["헤모시아닌이 주로 발견되는 동물군은?","절지동물과 많은 연체동물"],"H0-290":["헤모시아닌과 헤모글로빈을 비교하면?","헤모시아닌은 구리 기반 · 헤모글로빈은 철 기반"],"H2-1":["태아에게만 있다가 출생 후 닫히는 세 우회로는?","난원공 · 동맥관 · 정맥관"],"H2-2":["난원공(foramen ovale)은 어디와 어디를 잇고 출생 후 무엇으로 남는가?","좌우 심방 사이를 잇고, 출생 후 난원와(fossa ovalis)로 남는다"],"H2-3":["동맥관(ductus arteriosus)은 어디와 어디를 잇고 출생 후 무엇으로 남는가?","폐동맥과 대동맥을 잇고, 출생 후 동맥관인대로 남는다"],"H2-5":["동맥관의 폐쇄를 유도하는 것은?","동맥혈 산소분압 상승(1차 자극)과 프로스타글란딘(PGE₂) 감소"],"H2-4":["정맥관(ductus venosus)은 무엇을 우회하고 출생 후 무엇으로 남는가?","제대정맥과 하대정맥을 이어 간을 우회하고, 출생 후 정맥관인대로 남는다"],"H2-6":["세 태아 우회로가 남기는 흔적을 각각 쓰면?","난원공→난원와 / 동맥관→동맥관인대 / 정맥관→정맥관인대"],"H2-7":["푸아죄유 법칙(Poiseuille) — 혈류 저항은 무엇에 반비례하는가?","혈관 반지름의 4제곱 (층류 조건)"],"H2-8":["혈관 반지름이 2배가 되면 혈류 저항은 몇 배가 되는가?","1/16배"],"H2-9":["혈관 반지름이 2배가 되면 혈류량(유량)은 몇 배가 되는가?","16배"]},"hubPanel":null};

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);

$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
</body>
</html>
