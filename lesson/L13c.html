<script>
/* lesson_store.js — 과 목록 · 과 화면이 함께 쓰는 저장 도우미(보기 화면 명세 §1.1).
   빌드(build_lesson.js)가 두 화면에 그대로 끼워 넣는다(__STORE__) — 열쇠 이름 · 꼴이 한 군데서만 정해진다.
   열쇠: lesson_stars {ID: 찍은 때(ms)} · lesson_prefs {onlyStar, autoNext, rep, scope} · lesson_ab_<ID> {a: sid, b: sid}
   읽기 · 쓰기는 모두 try/catch — 저장이 막힌 브라우저에서는 그 쪽을 떠날 때까지만 기억하고 오류를 내지 않는다.
   (lesson_<ID> · lesson_shuffle · lesson_srs_inbox · lesson_auto_start 는 여기서 건드리지 않는다) */
const LStore = (() => {
  const mem = {};
  const rd = (k, d) => {
    let ok = false;
    try { const v = localStorage.getItem(k); ok = true; if (v !== null && v !== undefined) { const o = JSON.parse(v); mem[k] = o; return o; } } catch (e) {}
    if (ok) { delete mem[k]; return d; }   // 저장소는 멀쩡한데 값이 없다 = 다른 탭에서 지웠다 — 메모리 값도 버린다
    return k in mem ? mem[k] : d;
  };
  const wr = (k, o) => { mem[k] = o; try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) {} };
  const del = k => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} };
  const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
  const REP = ['off', 'ab', 'one', 'list'];
  return {
    stars() { const s = rd('lesson_stars', {}); return isObj(s) ? s : {}; },
    isStar(id) { return id in LStore.stars(); },
    setStar(id, on) {
      const s = { ...LStore.stars() };
      if (on) s[id] = Date.now(); else delete s[id];
      if (Object.keys(s).length) wr('lesson_stars', s); else del('lesson_stars');
      return on;
    },
    prefs() {
      const p = rd('lesson_prefs', {}); const o = isObj(p) ? p : {};
      return { onlyStar: !!o.onlyStar, autoNext: !!o.autoNext, rep: REP.includes(o.rep) ? o.rep : 'off', scope: o.scope === 'star' ? 'star' : 'all' };
    },
    setPrefs(patch) { const p = { ...LStore.prefs(), ...patch }; wr('lesson_prefs', p); return p; },
    ab(id) { const v = rd('lesson_ab_' + id, null); return isObj(v) ? { a: typeof v.a === 'string' ? v.a : null, b: typeof v.b === 'string' ? v.b : null } : { a: null, b: null }; },
    setAb(id, v) { const k = 'lesson_ab_' + id; if (v && (v.a || v.b)) wr(k, { a: v.a || null, b: v.b || null }); else del(k); },
    REP,
  };
})();

const L = {"id":"L13c","scene":"s13","part":"c","title":"성문 신분증 검사 — MHC I · II · CD8 · CD4 · TCR · 수지상세포 · 도움 T · NK","sub":"포위된 성(L13a · L13b)의 둥근 탑 문 앞 소동 — 모두가 단 붉은 리본 배지(MHC I) · 셔츠 속에 보라 망토를 숨긴 주민의 쟁반(보라 구슬)을 가리키며 고함치는 두 줄 단추 병정과 혀를 내미는 세균 · 두 쪽 판을 들고 뛰어오는 나뭇가지 팔 전령 · 흰 덩이 · 벌 · 상자 위에서 판을 짚고 흰 쪽지를 뿌리는 한 줄 단추 대장 · 술통 곁 부서진 병정과 보라 망토 · 등불 아래 다리를 한 줄로 건너는 병정과 작은 깃발 · 성벽 위 궁수의 화살과 배지를 뜯긴 여자","img":"img/L13c.webp?v=390f180dd3c0","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"소동 속의 모두가 가슴에 단 붉은 리본 배지 — 판을 든 셋 · 상자 위 대장 · 다리 위 병정 둘 · 고함치는 병정과 땀 흘리는 주민 · 성벽 위 궁수 · 술통 곁에 쓰러지고 조는 병정들과 벌 · 성벽 틈의 파리채 경비까지(배지 없는 것은 세균 · 보라 망토와 탑 아래 여자뿐)","fact":"MHC I 은 거의 모든 유핵세포의 표면에 있다 — 「자기」의 표지","hook":"붉은 리본 배지 = MHC I(누구나 하나씩 — I) · L13a 의 「자기」 배지가 그대로","say":"L13a와 L13b의 성이 포위되어 안쪽 둥근 탑 문 앞이 소란스럽다. 등장인물들의 가슴에 달린 붉은 리본 배지를 찾아보자. 판을 들고 뛰는 셋, 상자 위 대장, 다리 위 병정, 땀 흘리는 주민, 성벽 위 궁수, 술통 옆에 쓰러진 병정까지 모두 달고 있다. 배지는 MHC I, 1형 주조직적합복합체다. 거의 모든 유핵세포가 표면에 달고 있는 자기 표지로, 이 몸의 세포임을 나타낸다. 배지가 없는 것은 침입한 세균과 보라 망토, 그리고 탑 아래 오른쪽 여자 한 명이다. 그 여자는 마지막에 확인하자.","cards":["IM-054"],"box":[[1015,375,160,300],[1880,60,150,200],[1450,690,240,450]]},{"sid":"s2","obj":"오른쪽 아래, 진땀을 흘리며 은 쟁반을 내민 주민 — 셔츠 깃 밖으로 작은 보라 망토의 두 눈이 빼꼼 · 쟁반 위엔 보라 구슬 다섯 알의 짧은 사슬","fact":"MHC I 은 세포 안에서 만든 단백질 조각(펩타이드)을 얹어 보인다 — 내부 항원","hook":"쟁반 = MHC I 이 내미는 자리 · 셔츠 속 망토 = 세포 안의 바이러스 · 보라 구슬 = 그 바이러스 단백질의 조각 · 구슬 사슬 = 펩타이드(지질이 아니다)","say":"오른쪽 아래 주민은 진땀을 흘리고, 셔츠 깃 밖으로 작은 보라 망토의 두 눈이 빼꼼 보인다. 바이러스가 세포 안에 숨어 있는 모습이다. 주민이 내민 은 쟁반에는 망토와 같은 보라색의 짧은 구슬 사슬이 놓였다. 바이러스가 세포 안에서 만든 단백질을 자른 펩타이드다. MHC I은 세포 내부에서 만들어진 항원의 조각을 표면에 제시한다. 바이러스가 숨어도 그 조각은 쟁반에 나오는 셈이다. 이 덱의 구슬 사슬은 아미노산 사슬이므로, MHC에 실리는 것은 지질이 아니라 펩타이드다.","cards":["IM-060","IM-054"],"box":[[1680,750,300,390]]},{"sid":"s3","obj":"그 쟁반의 보라 구슬을 손가락으로 가리키며 고함치는 병정 — 조끼 단추가 넷씩 두 줄","fact":"MHC I 은 CD8 세포독성 T 세포에게 보인다 — CD8 × MHC I = 8","hook":"단추 넷씩 두 줄(8) = CD8 · 쟁반 하나(I) — 8 × 1 = 8","say":"보라 구슬을 가리키며 외치는 병정의 조끼에는 단추 넷씩이 두 줄, 모두 여덟 개다. CD8 세포독성 T 세포를 나타낸다. 쟁반을 보는 병정은 언제나 두 줄 단추 병정이다. 단추 여덟과 쟁반 하나, 8 곱하기 1은 8로 연결하자. 첩자로 찾아낸 감염 세포를 처리하는 과정은 다음 그림에서 본다. MHC I은 거의 모든 유핵세포에서 내부 항원 조각을 제시하고, CD8 세포독성 T 세포가 이를 인식한다.","src":["s13p03#2"],"drop":["IM-054"],"box":[[1450,690,240,450]],"cards":["IM-S2","I0-57","IM-056","IM-058"]},{"sid":"s4","obj":"고함치는 두 줄 단추 병정 바로 곁에서 혀를 쏙 내밀고 두 팔을 흔들며 펄쩍 뛰는 초록 세균 — 병정은 쳐다보지도 않고 쟁반만 본다","fact":"T 세포는 항원을 그대로는 못 알아본다 — MHC 에 얹힌 조각만 TCR 로 인식","hook":"펄쩍 뛰는 통째 세균 = 날 항원 · 쟁반 · 판의 조각만 보는 병정 = T 세포 수용체(TCR)","say":"병정 옆의 초록 세균이 혀를 쏙 내밀고 두 팔을 흔들며 펄쩍 뛴다. 여기 있다며 약을 올려도 병정은 쳐다보지 않는다. 쟁반 위의 조각만 보고 있다. T 세포는 항원을 그대로 인식하지 못하고, MHC에 제시된 조각을 자기 수용체 TCR로 인식한다. 상자 위 대장도 판만 보는 이유가 같다. 가공되지 않은 항원을 직접 붙잡는 것은 B 세포의 역할이다.","cards":["IM-029"],"box":[[1318,850,170,195]]},{"sid":"s5","obj":"왼쪽에서 판을 들고 뛰어오는 셋 — 나뭇가지 팔의 흰 옷 전령 · 흰 덩이 · 태엽 벌. 판은 저마다 경첩으로 이은 두 쪽 나무 판(주민은 판 없이 쟁반뿐)","fact":"MHC II 는 전문 항원제시세포에만 — 대식세포 · 수지상세포 · B 세포","hook":"두 쪽 판(II) = MHC II · 흰 덩이 = 대식세포 · 나뭇가지 팔 = 수지상세포 · 벌 = B 세포","say":"왼쪽에서 판을 들고 달려오는 셋을 보자. 판은 두 쪽이 경첩으로 연결되어 MHC II를 뜻한다. 이 판을 든 것은 흰 덩이 대식세포, 나뭇가지 팔의 흰 옷 전령 수지상세포, 태엽 벌 B 세포다. 판을 든 것은 이 셋뿐이며, 이들이 전문 항원제시세포다. 오른쪽의 일반 주민은 판 없이 쟁반만 들고 있다. 보통 세포는 MHC I만 가진다는 대비다.","cards":["IM-061"],"box":[[440,440,570,390]]},{"sid":"s6","obj":"판의 칸마다 초록 구슬 짧은 사슬 · 흰 덩이 배의 유리창 속에 뜬 초록 세균 조각들(삼켜서 부순 것)","fact":"MHC II 는 밖에서 삼킨 것을 잘라 만든 조각을 얹는다 — 외부 항원","hook":"초록 구슬 = 삼킨 세균의 조각 · 배 창 속 부서진 세균 = 삼켜서 안에서 자름","say":"두 쪽 판의 각 칸에는 초록 구슬 사슬이 붙어 있다. 세균과 같은 색이다. 흰 덩이의 배 유리창에는 삼킨 세균 조각들이 떠 있다. 밖에서 섭취한 항원을 안에서 분해한 것이다. MHC II는 이렇게 외부에서 섭취한 항원의 조각을 제시한다. 쟁반의 보라는 내부에서 만든 항원, 판의 초록은 외부에서 삼킨 항원으로 구분하자.","cards":["IM-055"],"box":[[460,455,550,230],[660,690,105,95]]},{"sid":"s7","obj":"가운데 나무 상자 위에 올라선 대장 병정 — 벌이 들어 올린 판에 손바닥을 철썩 대며 외친다 · 조끼 단추가 한 줄에 넷","fact":"MHC II 는 CD4 도움 T 세포에게 보인다 — CD4 × MHC II = 8","hook":"단추 한 줄 넷 = CD4 · 판 두 쪽(II) — 4 × 2 = 8","say":"가운데 나무 상자 위의 대장 병정이 벌의 판에 손바닥을 철썩 대고 외친다. 판을 읽는 모습이다. 조끼 단추는 한 줄에 넷이므로 CD4 도움 T 세포다. 두 쪽 판을 보는 쪽은 언제나 한 줄 단추 병정이다. 단추 넷과 판 두 쪽, 4 곱하기 2는 8로 기억하자. MHC I은 유핵세포·내부 항원·CD8, MHC II는 전문 항원제시세포·외부 항원·CD4와 연결된다.","src":["s13p03#3"],"drop":["IM-055","IM-061"],"box":[[1000,375,175,415]],"cards":["IM-057","IM-059","IM-075"]},{"sid":"s8","obj":"맨 앞에서 달려오는 나뭇가지 팔 전령 — 한쪽 팔이 뒤로 길게 뻗어 성벽 틈(파리채 경비가 세균과 싸우는 곳) 쪽에서 초록 부스러기를 집었고, 다른 손엔 두 쪽 판","fact":"수지상세포 — 선천 면역과 적응 면역을 잇는 항원제시세포","hook":"나뭇가지(수지상) 팔 = 수지상세포 · 틈의 싸움(선천)에서 집어 와 대장 병정(적응)에게 = 잇는 다리","say":"판을 든 셋의 맨 앞 전령은 팔이 나뭇가지처럼 갈라져 있다. 수지상이라는 이름 그대로 수지상세포다. 한쪽 팔이 뒤로 길게 뻗어 성벽 틈에서 파리채 경비가 세균과 싸우는 곳에 닿아 있다. 선천 면역의 현장에서 항원 조각을 집어 판에 얹고, 적응 면역의 대장 병정에게 달려오는 모습이다. 수지상세포는 조직에서 항원을 포획해 림프절의 T 세포에 제시한다. 선천 면역과 적응 면역을 잇는 다리 역할이다.","cards":["IM-026"],"box":[[220,360,420,400]]},{"sid":"s9","obj":"대장 병정의 머리 위로 폭죽처럼 흩날리는 흰 쪽지 — 한 갈래는 벌의 판을 돌아 벌에게, 한 갈래는 다리 위를 넘어 쟁반을 가리키는 두 줄 단추 병정에게","fact":"도움 T 세포는 사이토카인(IL-2 등)을 내어 B 세포와 세포독성 T 를 활성화","hook":"흰 쪽지 = 사이토카인(L16d 와 같은 쪽지) · 벌 = B 세포 · 두 줄 단추 = 세포독성 T","say":"대장의 머리 위로 폭죽처럼 흩날리는 흰 쪽지는 인터루킨 2 같은 사이토카인이다. 두 갈래로 날아가는 방향을 따라가자. 하나는 판을 돌아 벌에게 가서 B 세포가 항체를 만들 준비를 하게 한다. 다른 하나는 다리 위를 넘어 오른쪽 두 줄 단추 병정에게 가서 세포독성 T 세포를 돕는다. 도움 T 세포는 직접 싸우지 않고 두 세포를 활성화하는 도움 역할을 한다.","cards":["IM-068"],"box":[[690,300,640,420],[1190,330,480,520]]},{"sid":"s10","obj":"왼쪽 아래 술통 곁 — 가슴에 금이 가고 소매가 찢겨 팔이 부러진 채 쓰러진 한 줄 단추 병정(× 눈 · 털모자가 굴러감) · 그 뒤에서 이죽거리며 병정의 머리를 움켜쥔 보라 망토 · 곁에 곯아떨어진 벌과 두 줄 단추 병정","fact":"도움 T 세포가 줄면(HIV) 체액성 · 세포성 면역이 모두 약해진다","hook":"부서진 한 줄 단추 병정 = 무너진 CD4(L01d 와 같은 꼴) · 보라 망토 = HIV · 조는 벌 = 체액성 · 조는 두 줄 단추 = 세포성","say":"왼쪽 아래 술통 곁에는 한 줄 단추 병정이 가슴이 갈라지고 팔이 부러진 채 쓰러져 있다. 뒤의 보라 망토가 이죽거리며 병정의 머리를 움켜쥔 모습은 HIV가 도움 T 세포를 파괴한 상황이다. 신호 쪽지를 보낼 대장이 없어지자 벌과 두 줄 단추 병정도 잠들었다. 벌은 항체를 통한 체액성 면역, 두 줄 단추 병정은 세포성 면역이다. 도움 T 세포가 감소하면 둘 다 약해져, 에이즈에서 다양한 감염이 생기는 이유가 된다.","cards":["IM-069"],"box":[[0,700,820,444]]},{"sid":"s11","obj":"탑 문 위 등불 빛 아래, 다리를 한 줄로 건너 나오는 병정 둘 — 앞 병정의 한 줄 단추 곁에 꽂힌 작은 황토빛 깃발이 반짝 · 뒤의 두 줄 단추 병정엔 깃발 없음","fact":"유세포분석 — anti-CD4 항체로 도움 T 를 표지(CD3 = 모든 T · CD8 = 세포독성)","hook":"한 줄로 지나기 + 등불 = 유세포분석 · 깃발 = 항체 · 한 줄 단추 = CD4 → anti-CD4","say":"탑 문을 나온 병정들이 다리를 한 줄로 건너며 문 위 등불의 빛을 하나씩 받는다. 세포를 한 줄로 흘려 빛을 비춰 세는 유세포분석이다. 앞 병정의 한 줄 단추 옆에는 작은 황토색 깃발이 꽂혀 반짝인다. 깃발은 항체이며, 단추 넷인 CD4에 붙는 anti-CD4이다. 이 깃발이 빛나는 병정이 도움 T 세포다. 뒤의 두 줄 단추 병정은 anti-CD4 깃발이 없고, CD8 항체로 찾는다. T 세포 전체를 확인할 때는 CD3를 이용한다.","cards":["IM-076"],"box":[[1300,440,300,320]]},{"sid":"s12","obj":"탑 옆 성벽 위에서 몸을 숙인 흰 옷 궁수(가슴에 배지)가 아래로 화살을 쏜다 — 겨눈 것은 탑 아래 청록 원피스 여자 · 여자의 가슴엔 점선 동그라미로 배지 자리만 남았고, 곁에서 보라 소매의 손이 뜯어 낸 붉은 배지를 쥐고 있다","fact":"NK 세포는 MHC I 이 없는 세포를 죽인다 — missing-self(제 표지 없음)","hook":"흰 옷 궁수 = NK(L13a) · 배지가 사라진 가슴 = MHC I 을 감춘 세포 · 배지를 뜯어 간 보라 손 = 바이러스가 MHC I 을 감춤","say":"오른쪽 위, 탑 옆 성벽의 흰 옷 궁수가 몸을 숙여 아래로 화살을 쏜다. 겨누는 대상은 세균이 아니라 성 안의 여자다. 여자의 가슴에는 배지가 있던 둥근 자국만 있고, 옆의 보라 소매 손이 떼어 낸 배지를 쥐고 있다. 바이러스가 세포독성 T 세포를 피하려 MHC I을 숨긴 상황이다. 자연살해세포 NK는 이런 MHC I이 없는 세포를 죽인다. 자기 표지의 소실, missing-self를 나타낸다. 궁수 자신에게 배지가 있는 것도 보자. NK도 유핵세포이므로 MHC I을 갖는다.","src":["s13p03#4"],"box":[[1820,40,228,250],[1860,480,188,300]],"cards":[]}],"cq":{"IM-054":["MHC I은 어디에 발현되고 어떤 항원을 제시하나?","거의 모든 유핵세포 / 세포 내부 항원"],"IM-060":["MHC는 무엇과 결합해 제시하나? (지질? 펩티드?)","펩티드(단백질 조각) — 지질단백질 아님"],"IM-S2":["MHC I/II — 발현세포·항원출처·짝 T세포를 통합하면?","MHC I=유핵세포·내부항원·CD8 세포독성 / MHC II=APC·외부항원·CD4 도움"],"I0-57":["CD4↔MHC, CD8↔MHC 연결 암기는?","CD4×MHC II · CD8×MHC I (곱이 8)"],"IM-056":["MHC I과 짝지어지는 T세포는?","CD8+ 세포독성 T세포"],"IM-058":["세포독성 T세포가 인식하는 MHC는? (I? II?)","MHC I"],"IM-029":["T세포는 항원을 어떻게 인식하나?","MHC에 제시된 항원 조각을 TCR로 인식(직접 인식 못 함)"],"IM-061":["전문 항원제시세포(professional APC) 3가지는?","대식세포 · 수지상세포 · B세포"],"IM-055":["MHC II는 어디에 발현되고 어떤 항원을 제시하나?","항원제시세포(수지상·대식·B) / 외부에서 섭취한 항원"],"IM-057":["MHC II와 짝지어지는 T세포는?","CD4+ 도움(조력) T세포"],"IM-059":["도움 T세포가 인식하는 MHC는? (I? II?)","MHC II"],"IM-075":["CD4는 어떤 세포이고 어떤 MHC와 결합하나?","도움(조력) T세포 / MHC class II"],"IM-026":["선천 면역과 적응 면역을 연결하는 항원제시세포는?","수지상세포(dendritic cell)"],"IM-068":["도움 T세포는 무엇을 분비해 면역을 조율하나?","사이토카인(IL-2 등) → B세포·세포독성 T세포 활성화"],"IM-069":["도움 T세포가 감소하면 어떻게 되나?","체액성·세포성 면역 모두 약화"],"IM-076":["유세포분석에서 도움 T세포를 표지하는 항체는?","anti-CD4 (CD3=전체 T세포, CD8=세포독성)"]},"hubPanel":"s13p03"};

const ttsNorm = t => TTSNorm.ttsNorm(t, TTS_LEX, TTS_ORDER, L.id);
let speakSeq = 0;

function speak(t, sid) {
  const my = ++speakSeq, at = i;

function go(k) {

// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {

function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
