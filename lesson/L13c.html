<script>
const L = {"id":"L13c","scene":"s13","part":"c","title":"성문 신분증 검사 — MHC I · II · CD8 · CD4 · TCR · 수지상세포 · 도움 T · NK","sub":"포위된 성(L13a · L13b)의 둥근 탑 문 앞 소동 — 모두가 단 붉은 리본 배지(MHC I) · 셔츠 속에 보라 망토를 숨긴 주민의 쟁반(보라 구슬)을 가리키며 고함치는 두 줄 단추 병정과 혀를 내미는 세균 · 두 쪽 판을 들고 뛰어오는 나뭇가지 팔 전령 · 흰 덩이 · 벌 · 상자 위에서 판을 짚고 흰 쪽지를 뿌리는 한 줄 단추 대장 · 술통 곁 부서진 병정과 보라 망토 · 등불 아래 다리를 한 줄로 건너는 병정과 작은 깃발 · 성벽 위 궁수의 화살과 배지를 뜯긴 여자","img":"img/L13c.webp?v=390f180dd3c0","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"소동 속의 모두가 가슴에 단 붉은 리본 배지 — 판을 든 셋 · 상자 위 대장 · 다리 위 병정 둘 · 고함치는 병정과 땀 흘리는 주민 · 성벽 위 궁수 · 술통 곁에 쓰러지고 조는 병정들과 벌 · 성벽 틈의 파리채 경비까지(배지 없는 것은 세균 · 보라 망토와 탑 아래 여자뿐)","fact":"MHC I 은 거의 모든 유핵세포의 표면에 있다 — 「자기」의 표지","hook":"붉은 리본 배지 = MHC I(누구나 하나씩 — I) · L13a 의 「자기」 배지가 그대로","say":"L13a 와 L13b 의 그 성이 포위됐다. 안쪽 둥근 탑 문 앞이 난리다. 그런데 둘러보면 이 소동 속의 모두가 가슴에 붉은 리본 배지를 달았다. 판을 들고 뛰는 셋도, 상자 위 대장도, 다리 위 병정도, 땀 흘리는 주민도, 성벽 위 궁수도, 술통 곁에 쓰러진 병정까지. 이 배지가 MHC I, 1형 주조직적합복합체다. 핵이 있는 세포라면 거의 모두 겉에 단다. 「나는 이 몸의 세포다」라는 자기 표지다. 배지가 없는 것은 쳐들어온 세균과 보라 망토, 그리고 탑 아래 오른쪽 여자 하나뿐이다. 그 여자는 마지막에 본다.","cards":["IM-054"],"box":[[1015,375,160,300],[1880,60,150,200],[1450,690,240,450]]},{"sid":"s2","obj":"오른쪽 아래, 진땀을 흘리며 은 쟁반을 내민 주민 — 셔츠 깃 밖으로 작은 보라 망토의 두 눈이 빼꼼 · 쟁반 위엔 보라 구슬 다섯 알의 짧은 사슬","fact":"MHC I 은 세포 안에서 만든 단백질 조각(펩타이드)을 얹어 보인다 — 내부 항원","hook":"쟁반 = MHC I 이 내미는 자리 · 셔츠 속 망토 = 세포 안의 바이러스 · 보라 구슬 = 그 바이러스 단백질의 조각 · 구슬 사슬 = 펩타이드(지질이 아니다)","say":"오른쪽 아래, 주민 하나가 진땀을 흘린다. 셔츠 깃 밖으로 작은 보라 망토의 두 눈이 빼꼼 보인다. 바이러스가 이 사람 속, 세포 안에 숨어 산다. 그가 내민 은 쟁반 위에 보라 구슬 짧은 사슬. 망토와 같은 보라다. 바이러스가 세포 안에서 만든 단백질을 잘게 끊은 조각, 펩타이드다. MHC I 은 이렇게 세포 안에서 만든 것의 조각, 내부 항원을 겉에 얹어 내민다. 숨어도 그 조각이 쟁반에 실려 나온다. 덱에서 구슬 사슬은 아미노산 사슬이다. MHC 가 얹는 것은 지질이 아니라 이런 펩타이드다.","cards":["IM-060","IM-054"],"box":[[1680,750,300,390]]},{"sid":"s3","obj":"그 쟁반의 보라 구슬을 손가락으로 가리키며 고함치는 병정 — 조끼 단추가 넷씩 두 줄","fact":"MHC I 은 CD8 세포독성 T 세포에게 보인다 — CD8 × MHC I = 8","hook":"단추 넷씩 두 줄(8) = CD8 · 쟁반 하나(I) — 8 × 1 = 8","say":"그 쟁반의 보라 구슬을 가리키며 고함치는 병정이 있다. 조끼 단추가 넷씩 두 줄, 여덟이다. CD8, 세포독성 T 세포. 쟁반을 보는 것은 언제나 이 두 줄 단추 병정이다. 외우는 법은 곱하기 8. 단추 여덟에 쟁반 하나, 8 곱하기 1 은 8. 이 병정이 찾아낸 첩자 세포를 어떻게 처리하는지는 다음 장에서 본다. 정리하면, MHC I 은 거의 모든 유핵세포에, 안에서 만든 조각을 얹어, CD8 세포독성 T 에게 보인다.","src":["s13p03#2"],"drop":["IM-054"],"box":[[1450,690,240,450]],"cards":["IM-S2","I0-57","IM-056","IM-058"]},{"sid":"s4","obj":"고함치는 두 줄 단추 병정 바로 곁에서 혀를 쏙 내밀고 두 팔을 흔들며 펄쩍 뛰는 초록 세균 — 병정은 쳐다보지도 않고 쟁반만 본다","fact":"T 세포는 항원을 그대로는 못 알아본다 — MHC 에 얹힌 조각만 TCR 로 인식","hook":"펄쩍 뛰는 통째 세균 = 날 항원 · 쟁반 · 판의 조각만 보는 병정 = T 세포 수용체(TCR)","say":"그 병정 곁에서 초록 세균이 혀를 쏙 내밀고 두 팔을 흔들며 펄쩍 뛴다. 나 여기 있다고 약을 올린다. 그런데 병정은 쳐다보지도 않는다. 쟁반의 조각만 본다. T 세포는 항원을 그대로는 알아보지 못한다. MHC 위에 얹힌 조각만, 제 수용체인 TCR 로 알아본다. 상자 위 대장도 마찬가지로 판만 본다. 날것 그대로의 항원을 바로 붙잡는 것은 B 세포 쪽의 일이다.","cards":["IM-029"],"box":[[1318,850,170,195]]},{"sid":"s5","obj":"왼쪽에서 판을 들고 뛰어오는 셋 — 나뭇가지 팔의 흰 옷 전령 · 흰 덩이 · 태엽 벌. 판은 저마다 경첩으로 이은 두 쪽 나무 판(주민은 판 없이 쟁반뿐)","fact":"MHC II 는 전문 항원제시세포에만 — 대식세포 · 수지상세포 · B 세포","hook":"두 쪽 판(II) = MHC II · 흰 덩이 = 대식세포 · 나뭇가지 팔 = 수지상세포 · 벌 = B 세포","say":"왼쪽에서 셋이 판을 들고 뛰어온다. 판은 두 쪽이 경첩으로 이어졌다. 두 쪽, MHC II 다. 이 판을 드는 것은 셋뿐이다. 흰 덩이, 대식세포. 나뭇가지 팔의 흰 옷 전령, 수지상세포. 태엽 벌, B 세포. 이 셋이 전문 항원제시세포다. 오른쪽의 주민은 판이 없고 쟁반뿐이다. 보통 세포는 MHC I 만 단다.","cards":["IM-061"],"box":[[440,440,570,390]]},{"sid":"s6","obj":"판의 칸마다 초록 구슬 짧은 사슬 · 흰 덩이 배의 유리창 속에 뜬 초록 세균 조각들(삼켜서 부순 것)","fact":"MHC II 는 밖에서 삼킨 것을 잘라 만든 조각을 얹는다 — 외부 항원","hook":"초록 구슬 = 삼킨 세균의 조각 · 배 창 속 부서진 세균 = 삼켜서 안에서 자름","say":"판의 칸마다 초록 구슬 사슬이 붙었다. 초록은 세균의 빛. 흰 덩이 배의 유리창을 들여다보면 삼킨 세균이 조각조각 부서져 떠 있다. 밖에서 삼켜 안에서 잘라 만든 조각이다. MHC II 는 이렇게 외부에서 섭취한 항원의 조각을 얹는다. 쟁반의 보라는 안에서 만든 것, 판의 초록은 밖에서 삼킨 것. 이 빛깔로 둘을 가른다.","cards":["IM-055"],"box":[[460,455,550,230],[660,690,105,95]]},{"sid":"s7","obj":"가운데 나무 상자 위에 올라선 대장 병정 — 벌이 들어 올린 판에 손바닥을 철썩 대며 외친다 · 조끼 단추가 한 줄에 넷","fact":"MHC II 는 CD4 도움 T 세포에게 보인다 — CD4 × MHC II = 8","hook":"단추 한 줄 넷 = CD4 · 판 두 쪽(II) — 4 × 2 = 8","say":"가운데 나무 상자 위에 대장 병정이 올라섰다. 벌이 들어 올린 판에 손바닥을 철썩 대며 외친다. 판을 읽었다는 뜻이다. 조끼 단추가 한 줄에 넷. CD4, 도움 T 세포. 판을 보는 것은 언제나 한 줄 단추 병정이다. 여기도 곱하기 8. 단추 넷에 판 두 쪽, 4 곱하기 2 는 8. 정리하면 MHC I 은 유핵세포 · 내부 항원 · CD8, MHC II 는 전문 항원제시세포 · 외부 항원 · CD4.","src":["s13p03#3"],"drop":["IM-055","IM-061"],"box":[[1000,375,175,415]],"cards":["IM-057","IM-059","IM-075"]},{"sid":"s8","obj":"맨 앞에서 달려오는 나뭇가지 팔 전령 — 한쪽 팔이 뒤로 길게 뻗어 성벽 틈(파리채 경비가 세균과 싸우는 곳) 쪽에서 초록 부스러기를 집었고, 다른 손엔 두 쪽 판","fact":"수지상세포 — 선천 면역과 적응 면역을 잇는 항원제시세포","hook":"나뭇가지(수지상) 팔 = 수지상세포 · 틈의 싸움(선천)에서 집어 와 대장 병정(적응)에게 = 잇는 다리","say":"판을 든 셋 가운데 맨 앞의 전령을 보자. 팔이 나뭇가지처럼 갈라졌다. 나뭇가지 모양, 수지상이라 수지상세포다. 한쪽 팔은 뒤로 길게 뻗어 성벽 틈 쪽에 닿았다. 거기선 파리채 경비가 세균과 싸운다, 선천 면역의 싸움터. 거기서 세균 부스러기를 집어 들고, 판에 얹어 대장 병정에게 달려온다. 병정은 적응 면역이다. 수지상세포는 조직에서 항원을 잡아 림프절의 T 세포에게 가져가 보인다. 선천과 적응을 잇는 다리다.","cards":["IM-026"],"box":[[220,360,420,400]]},{"sid":"s9","obj":"대장 병정의 머리 위로 폭죽처럼 흩날리는 흰 쪽지 — 한 갈래는 벌의 판을 돌아 벌에게, 한 갈래는 다리 위를 넘어 쟁반을 가리키는 두 줄 단추 병정에게","fact":"도움 T 세포는 사이토카인(IL-2 등)을 내어 B 세포와 세포독성 T 를 활성화","hook":"흰 쪽지 = 사이토카인(L16d 와 같은 쪽지) · 벌 = B 세포 · 두 줄 단추 = 세포독성 T","say":"대장 병정의 머리 위로 흰 쪽지가 폭죽처럼 흩날린다. 이 흰 쪽지가 사이토카인이다. 인터루킨 2 같은 신호 물질. 쪽지는 두 갈래로 날아간다. 한 갈래는 판을 돌아 벌에게, B 세포가 깨어나 항체를 만들 채비를 한다. 다른 갈래는 다리 위를 넘어 오른쪽 두 줄 단추 병정에게, 세포독성 T 가 힘을 얻는다. 도움 T 는 직접 싸우지 않고 둘을 깨운다. 그래서 도움이다.","cards":["IM-068"],"box":[[690,300,640,420],[1190,330,480,520]]},{"sid":"s10","obj":"왼쪽 아래 술통 곁 — 가슴에 금이 가고 소매가 찢겨 팔이 부러진 채 쓰러진 한 줄 단추 병정(× 눈 · 털모자가 굴러감) · 그 뒤에서 이죽거리며 병정의 머리를 움켜쥔 보라 망토 · 곁에 곯아떨어진 벌과 두 줄 단추 병정","fact":"도움 T 세포가 줄면(HIV) 체액성 · 세포성 면역이 모두 약해진다","hook":"부서진 한 줄 단추 병정 = 무너진 CD4(L01d 와 같은 꼴) · 보라 망토 = HIV · 조는 벌 = 체액성 · 조는 두 줄 단추 = 세포성","say":"왼쪽 아래 술통 곁에선 다른 일이 벌어졌다. 한 줄 단추 병정이 가슴에 금이 가고 팔이 부러진 채 쓰러졌다. 그 뒤에서 보라 망토가 이죽거리며 병정의 머리를 움켜쥐었다. HIV 가 도움 T 세포를 무너뜨렸다. 쪽지를 뿌릴 대장이 없으니, 곁의 벌도 두 줄 단추 병정도 곯아떨어졌다. 벌은 항체의 체액성 면역, 두 줄 단추는 세포성 면역. 도움 T 가 줄면 둘 다 약해진다. 에이즈에서 온갖 감염이 오는 까닭이다.","cards":["IM-069"],"box":[[0,700,820,444]]},{"sid":"s11","obj":"탑 문 위 등불 빛 아래, 다리를 한 줄로 건너 나오는 병정 둘 — 앞 병정의 한 줄 단추 곁에 꽂힌 작은 황토빛 깃발이 반짝 · 뒤의 두 줄 단추 병정엔 깃발 없음","fact":"유세포분석 — anti-CD4 항체로 도움 T 를 표지(CD3 = 모든 T · CD8 = 세포독성)","hook":"한 줄로 지나기 + 등불 = 유세포분석 · 깃발 = 항체 · 한 줄 단추 = CD4 → anti-CD4","say":"탑 문에서 병정들이 다리를 건너 한 줄로 걸어 나온다. 문 위 등불이 하나씩 비춘다. 세포를 한 줄로 흘려 빛을 비춰 세는 기계, 유세포분석이다. 앞 병정의 한 줄 단추 곁에 작은 황토빛 깃발이 꽂혀 반짝인다. 깃발은 항체다. 단추 한 줄 넷, CD4 에 붙는 항체, anti-CD4. 이 깃발이 빛나는 병정이 도움 T 세포다. 뒤의 두 줄 단추 병정엔 깃발이 없다. 그 병정은 CD8 항체로 찾는다. T 세포를 모두 잡을 땐 CD3.","cards":["IM-076"],"box":[[1300,440,300,320]]},{"sid":"s12","obj":"탑 옆 성벽 위에서 몸을 숙인 흰 옷 궁수(가슴에 배지)가 아래로 화살을 쏜다 — 겨눈 것은 탑 아래 청록 원피스 여자 · 여자의 가슴엔 점선 동그라미로 배지 자리만 남았고, 곁에서 보라 소매의 손이 뜯어 낸 붉은 배지를 쥐고 있다","fact":"NK 세포는 MHC I 이 없는 세포를 죽인다 — missing-self(제 표지 없음)","hook":"흰 옷 궁수 = NK(L13a) · 배지가 사라진 가슴 = MHC I 을 감춘 세포 · 배지를 뜯어 간 보라 손 = 바이러스가 MHC I 을 감춤","say":"오른쪽 위, 탑 옆 성벽 위의 흰 옷 궁수가 몸을 숙여 아래로 화살을 쏜다. 겨눈 것은 세균이 아니라 성 안의 여자다. 여자의 가슴엔 배지가 있던 자리만 동그랗게 남았다. 곁에서 보라 소매의 손이 뜯어 낸 배지를 쥐고 있다. 바이러스는 세포독성 T 의 눈을 피하려고 MHC I 을 감춘다. 그런데 자연살해세포, NK 는 바로 MHC I 이 없는 세포를 죽인다. 제 표지가 사라진 것, missing-self. 궁수 자신은 배지를 달았다. NK 도 유핵세포라 MHC I 이 있다.","src":["s13p03#4"],"box":[[1820,40,228,250],[1860,480,188,300]],"cards":[]}],"cq":{"IM-054":["MHC I은 어디에 발현되고 어떤 항원을 제시하나?","거의 모든 유핵세포 / 세포 내부 항원"],"IM-060":["MHC는 무엇과 결합해 제시하나? (지질? 펩티드?)","펩티드(단백질 조각) — 지질단백질 아님"],"IM-S2":["MHC I/II — 발현세포·항원출처·짝 T세포를 통합하면?","MHC I=유핵세포·내부항원·CD8 세포독성 / MHC II=APC·외부항원·CD4 도움"],"I0-57":["CD4↔MHC, CD8↔MHC 연결 암기는?","CD4×MHC II · CD8×MHC I (곱이 8)"],"IM-056":["MHC I과 짝지어지는 T세포는?","CD8+ 세포독성 T세포"],"IM-058":["세포독성 T세포가 인식하는 MHC는? (I? II?)","MHC I"],"IM-029":["T세포는 항원을 어떻게 인식하나?","MHC에 제시된 항원 조각을 TCR로 인식(직접 인식 못 함)"],"IM-061":["전문 항원제시세포(professional APC) 3가지는?","대식세포 · 수지상세포 · B세포"],"IM-055":["MHC II는 어디에 발현되고 어떤 항원을 제시하나?","항원제시세포(수지상·대식·B) / 외부에서 섭취한 항원"],"IM-057":["MHC II와 짝지어지는 T세포는?","CD4+ 도움(조력) T세포"],"IM-059":["도움 T세포가 인식하는 MHC는? (I? II?)","MHC II"],"IM-075":["CD4는 어떤 세포이고 어떤 MHC와 결합하나?","도움(조력) T세포 / MHC class II"],"IM-026":["선천 면역과 적응 면역을 연결하는 항원제시세포는?","수지상세포(dendritic cell)"],"IM-068":["도움 T세포는 무엇을 분비해 면역을 조율하나?","사이토카인(IL-2 등) → B세포·세포독성 T세포 활성화"],"IM-069":["도움 T세포가 감소하면 어떻게 되나?","체액성·세포성 면역 모두 약화"],"IM-076":["유세포분석에서 도움 T세포를 표지하는 항체는?","anti-CD4 (CD3=전체 T세포, CD8=세포독성)" const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}
function capHTML(st, k) {
  const nc = (st.cards || []).length;
  return `<div class="n">${k + 1} / ${stops.length}${nc ? ` · 기출 ${nc}` : ''}</div><div class="obj">${st.obj}</div><div class="fact">${st.fact}</div>${st.hook ? `<div class="hook">고리 — ${st.hook}</div>` : ''}`;
}
function showCap(k, judge) {
  const st = stops[k]; $('cap').className = 'cap'; $('cap').innerHTML = capHTML(st, k);
  if (voice) speak(st.say || (st.obj + '. ' + st.fact));
  $('judge').style.display = judge && mode === 'quiz' ? 'flex' : 'none';
}
// 낭독용 치환 — 화면 글은 그대로 두고, 읽을 때만 첨자 · 그리스 글자 · 기호를 말로 바꾼다
const TTS = [[/Na⁺/g, '나트륨 이온'], [/K⁺/g, '칼륨 이온'], [/Ca²⁺/g, '칼슘 이온'], [/Mg²⁺/g, '마그네슘 이온'], [/H⁺/g, '수소 이온'], [/Cl⁻/g, '염소 이온'],
  [/HCO₃⁻/g, '중탄산 이온'], [/NH₄⁺/g, '암모늄 이온'], [/NADP⁺/g, '엔에이디피 플러스'], [/NAD⁺/g, '엔에이디 플러스'], [/FADH₂/g, '에프에이디에이치 투'],
  [/CO₂/g, '이산화탄소'], [/H₂O/g, '물'], [/O₂/g, '산소'], [/5′/g, '오 프라임'], [/3′/g, '삼 프라임'], [/2′/g, '이 프라임'], [/′/g, ' 프라임'],
  [/α/g, '알파'], [/β/g, '베타'], [/γ/g, '감마'], [/δ/g, '델타'], [/ε/g, '엡실론'], [/₁/g, '1'], [/₂/g, '2'], [/₃/g, '3'], [/₄/g, '4'], [/⁺/g, ' 플러스'], [/⁻/g, ' 마이너스'], [/²/g, '2'],
  [/→/g, ', '], [/≈/g, '약 '], [/↑/g, ' 증가'], [/↓/g, ' 감소']];
const ttsNorm = t => TTS.reduce((x, [a, b]) => x.replace(a, b), String(t));
let speakSeq = 0;
function speak(t) {
  t = ttsNorm(t);
  const my = ++speakSeq, at = i;
  const advance = (ms) => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, ms);
  if (!('speechSynthesis' in window)) { if (playing) advance(3500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onend = () => { if (started) advance(700); };
  u.onerror = () => { if (!started) advance(3000); };
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started && my === speakSeq) { speechSynthesis.cancel(); advance(3000); } }, 2500);  // 목소리가 없으면 글만 3초
}
function go(k) {
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) setTimeout(() => { if (playing) next(); }, 3500);
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speak('되짚기. ' + stops.map(st => st.say || (st.obj + '. ' + st.fact)).join(' '));
}
function setMode(m) {
  mode = m; playing = false; speechSynthesis && speechSynthesis.cancel(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }
    quizPos = 0; sess = { id: Date.now(), t0: Date.now(), n: quizOrder.length, ok: 0, done: 0, ans: {} };  // 시험 한 번 = 세션 하나
    quizAsk();
  } else sess = null;
  showScore();
}
function quizAsk() {
  quizRevealed = false; draw();
  const st = stops[quizOrder[quizPos]];
  $('cap').className = 'cap'; $('cap').innerHTML = `<div class="n">${quizPos + 1} / ${quizOrder.length}</div><div class="obj">${st.ask ? st.ask : '이 물건은 무엇을 나르나?'}</div><div class="fact muted">이름만이 아니라 화면 한 줄을 다 떠올린 뒤 「답 보기」 — 하나라도 막히면 틀림</div>`;
  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i + 1); else speechSynthesis && speechSynthesis.cancel(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) speechSynthesis && speechSynthesis.cancel(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
</script>
