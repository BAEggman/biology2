<script>
/* lesson_store.js — 과 목록 · 과 화면이 함께 쓰는 저장 도우미(보기 화면 명세 §1.1).
   빌드(build_lesson.js)가 두 화면에 그대로 끼워 넣는다(__STORE__) — 열쇠 이름 · 꼴이 한 군데서만 정해진다.
   열쇠: lesson_stars {ID: 찍은 때(ms)} · lesson_prefs {onlyStar, autoNext, rep, scope} · lesson_ab_<ID> {a: sid, b: sid}
   읽기 · 쓰기는 모두 try/catch — 저장이 막힌 브라우저에서는 그 쪽을 떠날 때까지만 기억하고 오류를 내지 않는다.
   (lesson_<ID> · lesson_shuffle · lesson_srs_inbox · lesson_auto_start 는 여기서 건드리지 않는다) */
const LStore = (() => {
  const mem = {};
  const rd = (k, d) => {
    let ok = false;
    try { const v = localStorage.getItem(k); ok = true; if (v !== null && v !== undefined) { const o = JSON.parse(v); mem[k] = o; return o; } } catch (e) {}
    if (ok) { delete mem[k]; return d; }   // 저장소는 멀쩡한데 값이 없다 = 다른 탭에서 지웠다 — 메모리 값도 버린다
    return k in mem ? mem[k] : d;
  };
  const wr = (k, o) => { mem[k] = o; try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) {} };
  const del = k => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} };
  const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
  const REP = ['off', 'ab', 'one', 'list'];
  return {
    stars() { const s = rd('lesson_stars', {}); return isObj(s) ? s : {}; },
    isStar(id) { return id in LStore.stars(); },
    setStar(id, on) {
      const s = { ...LStore.stars() };
      if (on) s[id] = Date.now(); else delete s[id];
      if (Object.keys(s).length) wr('lesson_stars', s); else del('lesson_stars');
      return on;
    },
    prefs() {
      const p = rd('lesson_prefs', {}); const o = isObj(p) ? p : {};
      return { onlyStar: !!o.onlyStar, autoNext: !!o.autoNext, rep: REP.includes(o.rep) ? o.rep : 'off', scope: o.scope === 'star' ? 'star' : 'all' };
    },
    setPrefs(patch) { const p = { ...LStore.prefs(), ...patch }; wr('lesson_prefs', p); return p; },
    ab(id) { const v = rd('lesson_ab_' + id, null); return isObj(v) ? { a: typeof v.a === 'string' ? v.a : null, b: typeof v.b === 'string' ? v.b : null } : { a: null, b: null }; },
    setAb(id, v) { const k = 'lesson_ab_' + id; if (v && (v.a || v.b)) wr(k, { a: v.a || null, b: v.b || null }); else del(k); },
    REP,
  };
})();

const L = {"id":"L11a","scene":"s11","part":"a","title":"지퍼 공사장의 분기점 — DNA 복제 분기점과 개시 순서","sub":"닫힌 지퍼(어버이) · 에이스 + 분필 동그라미(DnaA · 복제기점) · 빗자루 낀 지퍼 끄는 사람(헬리케이스 DnaB) · 쐐기 든 둘(SSB) · 스패너(자이레이스) · 지팡이 요리사의 쇠못(프라이메이스 DnaG · RNA 프라이머) · 못 → 뾰족(5′→3′) · 도르래 줄(클램프) · 긴 판자 하나(선도) · 짧은 판자 여럿(지연 · 오카자키) · 용접(라이게이스) · 오른쪽부터 선 차례","img":"img/L11a.webp?v=5266d1edeb0b","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"공사장 — 오른쪽에서 들어오는 닫힌 지퍼 · 가운데 분기점 · 왼쪽으로 갈라진 위 · 아래 띠","fact":"DNA 복제 분기점 — 지퍼가 열리며 두 띠 위에 판자가 깔린다","hook":"지퍼 = 이중나선 · 판자 = 새 가닥","say":"디엔에이 복제 공사장이다. 오른쪽에서 들어온 닫힌 지퍼가 가운데 분기점에서 위아래 띠로 갈라져 왼쪽으로 이어진다. 열린 띠 위에는 인부들이 판자를 깐다. 지퍼는 어버이 이중나선, 판자는 새로 합성하는 가닥이다. 디엔에이 복제는 형질이 다음 세대로 이어지는 바탕이다. 바이러스 항구에서는 디엔에이를 금빛 꼰 밧줄로 그렸지만, 이 공사장에서는 지퍼로 나타냈다. 오른쪽부터 서 있는 사람들의 작업 순서를 따라가 보자.","box":null,"src":["s11p01#0"],"cards":["D0-5"]},{"sid":"s2","obj":"오른쪽에서 들어오는 닫힌 지퍼 — 이빨이 서로 맞물려 있다 · 열린 띠에는 이빨이 한 줄만","fact":"아직 안 풀린 어버이 이중나선 · 풀린 띠는 이빨이 한 줄","hook":"맞물린 이빨 = 안 풀림","say":"오른쪽의 닫힌 지퍼는 이빨이 서로 맞물려 있다. 아직 풀리지 않은 어버이 이중나선이다. 반면 열린 두 띠는 이빨이 서로 맞물리지 않고 안쪽 가장자리에 한 줄씩만 남아 있다. 가닥이 분리되었다는 표시다.","box":[[1200,450,848,240],[40,400,540,80]],"src":["s11p01#0"],"cards":[]},{"sid":"s3","obj":"맨 오른쪽 — 닫힌 지퍼에 흰 분필로 동그라미를 그리는 사람 · 길게 뻗은 다른 팔에 높이 든 에이스 카드 · 동그라미 안쪽만 이빨이 크고 성기다","fact":"DnaA — 복제기점 인식(개시 첫째) · AT 많은 자리(수소결합 둘)부터 벌어진다","hook":"높이 든 에이스 = A · 성긴 이빨 = AT 자리","say":"맨 오른쪽에서 닫힌 지퍼 위에 흰 분필 동그라미를 그리는 사람을 보자. 다른 팔을 길게 뻗어 에이스 카드를 하늘 높이 들고 있다. 에이스의 에이에서 디엔에이 에이를 연결한다. 대장균 복제 개시의 첫 단계로, 복제기점을 인식해 열기 시작할 자리를 표시한다. 그림에는 표시하는 모습까지만 있지만, 실제로는 그 자리에 결합해 첫 틈도 조금 벌린다. 길게 풀어 나가는 일은 다음 사람이 맡는다. 동그라미 안의 크고 듬성듬성한 이빨은 에이티가 풍부한 구간이다. 수소결합이 둘이라 상대적으로 약해 이곳부터 열린다. 가장 오른쪽이 가장 먼저라는 설명은 사람들의 작업 순서를 뜻한다. 실제 지퍼는 기점에서 처음 열리고, 분기점은 양쪽으로 멀어져 간다.","box":[1680,80,368,960],"src":["s11p01#1","s11p01b#1"],"cards":["E1-119#1","E1-119"]},{"sid":"s4","obj":"분기점의 지퍼 손잡이를 쥐고 오른쪽으로 끄는 주황 옷 사람 · 비스듬히 낀 큰 빗자루","fact":"헬리케이스 = DnaB(개시 둘째) — 수소결합을 풀어 벌린다 · 그가 가는 쪽이 분기점 방향","hook":"빗자루 = 비 = B · 끄는 쪽 = 분기점이 나아가는 쪽","say":"주황 옷의 사람은 갈라지는 꼭짓점의 지퍼 손잡이를 잡고, 아직 닫힌 오른쪽으로 끌어간다. 수소결합을 풀어 두 가닥을 벌리는 헬리케이스다. 비스듬히 낀 큰 빗자루의 비에서 대장균의 디엔에이 비를 떠올리자. 개시 순서의 둘째다. 이 사람이 가는 방향이 복제 분기점의 진행 방향이다. 이후 나오는 같은 방향과 반대 방향도 모두 이 사람을 기준으로 읽는다.","box":[1040,560,360,440],"src":["s11p01#2","s11p01b#2"],"cards":["E1-67","E1-50","E1-119#2","E1-66"]},{"sid":"s5","obj":"벌어진 틈의 나무 메 든 두 사람 — 긴 쐐기 하나를 같이 들고 박는다","fact":"SSB(개시 셋째) — 갈라진 가닥이 다시 붙지 않게 붙잡는다 · 둘 = SS · 쐐기 = B","hook":"둘이 하나의 쐐기 = SSB","say":"벌어진 틈에서는 나무 메를 든 두 사람이 긴 쐐기를 함께 박아 틈을 유지한다. 에스에스비가 분리된 가닥이 다시 붙지 않도록 잡는 모습이다. 사람 둘은 두 단일가닥, 쐐기로 붙드는 행동은 비와 연결한다. 지퍼가 먼저 열려야 붙잡을 자리가 생기므로 개시 순서의 셋째다. 이 둘의 도구는 나무 메이고, 뒤에서 볼 쇠망치는 중합효소의 표시라는 점도 구분하자.","box":[[540,455,435,350]],"src":["s11p01#3","s11p01b#3"],"cards":["E1-68","E1-119#3"]},{"sid":"s6","obj":"손잡이 바로 오른쪽, 아직 닫힌 지퍼 — 밧줄처럼 꼬여 뭉친 자리에 물린 큰 스패너","fact":"자이레이스(토포아이소머레이스) — 분기점 앞쪽의 뒤틀림을 푼다","hook":"앞쪽의 꼬임을 스패너로","say":"지퍼 손잡이 바로 오른쪽을 보자. 아직 닫힌 지퍼가 밧줄처럼 꼬여 있고, 한 사람이 큰 스패너를 대고 있다. 자이레이스, 토포아이소머레이스다. 분기점 앞쪽, 즉 손잡이가 향하는 쪽에서 꼬임을 푼다는 위치가 중요하다. 지퍼를 열 때 앞부분에 뒤틀림이 생기기 때문에 이 효소가 필요하다.","box":[1280,260,380,780],"src":["s11p01#4"],"cards":["E1-69"]},{"sid":"s7","obj":"두 갈래 사이 — 프라이팬에서 벌겋게 달군 쇠못을 꺼내 주는 요리사 · 지팡이를 짚었다","fact":"프라이메이스 = DnaG(개시 마지막) — RNA 프라이머(쇠못 · 나무 아님)로 시작점","hook":"프라이팬 = 프라이메이스 · 지팡이 = 지 = G · 쇠못 = RNA","say":"두 갈래 사이의 요리사는 프라이팬에서 붉게 달군 쇠못을 꺼내 준다. 프라이팬에서 프라이메이스를 떠올리자. 쇠못인 아르엔에이 프라이머를 놓아 합성의 시작점을 만든다. 나무가 아니라 쇠라는 점은 디엔에이가 아닌 아르엔에이임을 나타내며, 나중에 제거해야 하는 이유이기도 하다. 항구에서 종이 리본으로 나타낸 아르엔에이를 여기서는 쇠로 표현한다. 요리사가 짚은 지팡이의 지는 대장균의 디엔에이 지다. 개시 순서의 마지막이다.","box":[280,480,320,340],"src":["s11p01#5","s11p01b#4"],"cards":["E1-70","E1-55","E1-56","E1-57","E1-119#4"]},{"sid":"s8","obj":"모든 판자 — 못 박힌 뭉툭한 끝에서 시작해 뾰족한 끝으로 자란다","fact":"합성은 예외 없이 5′→3′(주형은 3′→5′로 읽힌다) — 이미 있는 것의 3′ 말단에만 붙인다","hook":"못 끝에서 뾰족 끝으로 = 5′→3′","say":"위의 긴 판자와 아래의 짧은 판자는 모두 못이 박힌 뭉툭한 끝에서 뾰족한 끝으로 자란다. 합성 방향은 언제나 오 프라임에서 삼 프라임이다. 두 가닥은 반대 방향이므로 주형은 삼 프라임에서 오 프라임 방향으로 읽는다. 중합효소는 이미 있는 가닥의 삼 프라임 말단에만 연결할 수 있어, 시작점인 못이 없으면 합성을 시작하지 못한다. 지연사슬에서 반대 방향으로 합성한다는 설명은 틀리다.","box":[[40,225,1035,145],[40,820,740,320]],"src":["s11p01#6"],"cards":["E1-54","E1-45","E1-76"]},{"sid":"s9","obj":"위 띠 왼쪽 — 띠를 두 바퀴 감아 고리를 이룬 줄이 갈고리에 걸렸다 · 위에는 도르래","fact":"활주 클램프 — 중합효소를 주형에 붙잡아 두는 고리형 단백질 · 진행성","hook":"띠를 감은 고리 + 도르래 = 붙잡되 미끄러진다","say":"위 띠 왼쪽에는 줄이 띠를 두 바퀴 감아 고리를 이루고 갈고리에 걸려 있다. 위의 도르래를 따라 줄은 미끄러질 수 있다. 활주 클램프의 단서다. 중합효소를 주형에 붙잡아 한 번 결합한 뒤 길게 합성하도록 하는 성질이 진행성이다. 띠를 감싼 고리는 고리형 단백질, 도르래는 붙잡은 채 미끄러질 수 있다는 특징과 연결하자.","box":[220,30,860,570],"src":["s11p01#7"],"cards":["E1-118"]},{"sid":"s10","obj":"위 띠 — 위에서 드리운 갈고리에 두 줄로 매달려 띠 위에 눕는 긴 판자 한 장(못 하나 · 뾰족한 끝이 분기점에 닿음)","fact":"선도가닥 — 프라이머 하나로 분기점과 같은 방향으로 끝까지 연속 합성","hook":"긴 판자 한 장 = 선도","say":"위 띠에는 위에서 내려온 갈고리에 두 줄로 매달린 긴 판자 한 장이 있다. 못은 하나이고 뾰족한 끝은 분기점에 닿는다. 선도가닥이다. 프라이머 하나에서 시작해 분기점과 같은 방향으로 끝까지 연속 합성한다. 중간 산물이 하나의 긴 새 가닥이라는 점을 판자 한 장과 연결하자.","box":[[40,225,1035,145],[470,0,120,250]],"src":["s11p01#8"],"cards":["E1-58","E1-60#1","E1-64#1","E1-65#1","E1-64","E1-65"]},{"sid":"s11","obj":"아래 띠 — 짧은 판자 여럿이 틈을 두고 한 줄로 걸렸다 · 못은 분기점 쪽 끝 · 뾰족한 끝은 모두 분기점 반대쪽 아래로","fact":"지연가닥 — 불연속 합성 · 늦을 뿐 거꾸로가 아니다 · 토막 = 오카자키 절편","hook":"짧은 판자 여럿 = 지연 · 오카자키","say":"아래 띠에는 틈을 두고 짧은 판자들이 걸려 있다. 각 판자의 못은 분기점 쪽에 있고, 뾰족한 끝은 분기점 반대쪽 아래를 향한다. 지연가닥이다. ‘지연’은 늦게 만든다는 뜻이지 거꾸로 합성한다는 뜻이 아니다. 분기점이 열린 뒤 프라이머를 새로 놓아야 하므로 늦지만, 각 판자는 여전히 못에서 뾰족한 끝으로 자란다. 이 짧은 토막이 오카자키 절편이며, 토막별로 만드는 방식이 불연속 합성이다.","box":[40,820,740,320],"src":["s11p01#9"],"cards":["E1-59","E1-60#2","E1-61","E1-62","E1-64#2","E1-65#2","E1-60","C1-87"]},{"sid":"s12","obj":"아래 띠 맨 오른쪽 판자 가장자리에 튀는 용접 불꽃 · 용접공의 다른 손엔 뚜껑 젖힌 라이터","fact":"라이게이스 — 닉(한 가닥의 인산다이에스터 결합만 끊긴 자리)을 봉합","hook":"라이터 = 라이게이스 · 틈을 용접","say":"아래 띠 맨 오른쪽 판자 가장자리에서 용접 불꽃이 튄다. 용접공은 다른 손에 뚜껑을 연 라이터를 들고 있다. 라이터를 라이게이스와 연결하자. 조각 사이에 남은 닉을 봉합해 하나의 가닥으로 만든다. 닉은 염기쌍에는 이상이 없지만 한 가닥의 인산다이에스터 결합이 끊어진 자리다. 조각을 이어 붙이는 효소를 묻는다면 언제나 디엔에이 라이게이스를 떠올리면 된다.","box":[660,760,340,384],"src":["s11p01#10"],"cards":["E1-74","E1-75","E1-63#3","C1-88"]},{"sid":"s13","obj":"오른쪽부터 선 차례 — 에이스 → 빗자루 → 쐐기 든 둘 → 지팡이","fact":"개시 순서 DnaA → DnaB → SSB → DnaG · 셋은 Dna + 한 글자 · SSB만 둘","hook":"오른쪽부터 A · B · 둘 · G","say":"작업자들을 오른쪽부터 다시 짚어 보자. 에이스, 빗자루, 쐐기를 든 둘, 지팡이의 순서이며 스패너를 든 사람은 이 이름 순서에 포함되지 않는다. 디엔에이 에이, 디엔에이 비, 에스에스비, 디엔에이 지다. 셋은 앞의 디엔에이가 같고 뒤의 한 글자만 다르므로 소품도 그 한 글자를 연결한다. 가운데 에스에스비만 이름이 달라 두 사람이 함께 서 있다. 먼저 자리를 인식하고, 가닥을 열고, 열린 가닥을 붙잡은 뒤 프라이머를 놓는다. 이름만 나열하기보다 일이 이루어지는 순서로 기억하자.","box":[[1680,80,368,960],[1040,560,360,440],[540,455,435,350],[280,480,320,340]],"src":["s11p01b#0","s11p01b#5","s11p01b#6"],"cards":["E1-119"]}],"cq":{"D0-5":["유전형질 전달의 기초가 되는 과정은?","DNA 복제"],"E1-119#1":["대장균 DNA 복제의 개시 순서는?","DnaA(AT 풍부한 복제기점 인식)"],"E1-119":["대장균 DNA 복제의 개시 순서는?","DnaA(AT 풍부한 복제기점 인식) → DnaB(헬리케이스, 이중나선 풀기) → SSB → DnaG(프라이메이스, RNA 프라이머 합성) · 복제기점이 AT-rich인 이유는 A-T가 수소결합 2개라 풀기 쉽기 때문"],"E1-67":["헬리케이스(helicase)의 기능은?","부모 DNA 이중나선을 푼다"],"E1-50":["복제가 진행되는 Y자 모양 부위는?","복제분기점(replication fork)"],"E1-119#2":["대장균 DNA 복제의 개시 순서는?","DnaB(헬리케이스, 이중나선 풀기)"],"E1-66":["복제분기점 효소 7종을 쓰면?","헬리케이스·SSB·토포아이소머레이스·프리메이스·DNA pol III·DNA pol I·ligase"],"E1-68":["단일가닥 결합 단백질(SSB)의 기능은?","분리된 가닥이 다시 붙지 않게 안정화한다"],"E1-119#3":["대장균 DNA 복제의 개시 순서는?","SSB"],"E1-69":["토포아이소머레이스의 기능은?","복제분기점 앞쪽의 비틀림 장력을 완화한다"],"E1-70":["프리메이스(primase)의 기능은?","RNA 프라이머를 합성한다"],"E1-55":["새 DNA 가닥 합성에 필요한 프라이머는? (DNA 주의)","RNA 프라이머"],"E1-56":["DNA 중합효소가 새 가닥을 스스로 시작 못 하는 한계를 보완하는 것은?","RNA 프라이머(프리메이스가 합성)"],"E1-57":["RNA 프라이머가 필요한 과정은 복제·전사 중 어느 쪽인가?","DNA 복제"],"E1-119#4":["대장균 DNA 복제의 개시 순서는?","DnaG(프라이메이스, RNA 프라이머 합성)"],"E1-54":["DNA 중합효소는 기존 가닥의 어느 말단에만 붙이는가?","3' 말단 (합성은 항상 5'→3')"],"E1-45":["새 가닥이 5'→3'로 합성되므로 주형가닥은 어느 방향으로 읽히는가?","3'→5'"],"E1-76":["방향성 문제를 푸는 핵심 규칙은?","DNA 중합효소는 3' 말단에만 붙인다(새 가닥 5'→3')"],"E1-118":["활주 클램프(sliding clamp)의 기능은?","DNA 중합효소를 주형 가닥에 붙잡아 두어 복제 진행성(processivity)을 높이는 고리형 단백질"],"E1-58":["선도가닥(leading)의 합성 방식은?","복제분기점 진행 방향으로 연속 합성"],"E1-60#1":["선도/지연가닥의 합성 방향이 분기점 기준 어떻게 다른가 — 「선도」? (↔ 지연)","분기점과 같은 방향"],"E1-64#1":["선도가닥과 지연가닥의 프라이머 수 차이 — 「선도」? (↔ 지연)","보통 1개"],"E1-65#1":["선도가닥과 지연가닥의 중간 산물 차이 — 「선도」? (↔ 지연)","하나의 긴 새 가닥"],"E1-64":["선도가닥과 지연가닥의 프라이머 수 차이는?","선도=보통 1개 · 지연=절편마다 여러 개"],"E1-65":["선도가닥과 지연가닥의 중간 산물 차이는?","선도=하나의 긴 새 가닥 · 지연=오카자키 절편"],"E1-59":["지연가닥(lagging)의 합성 방식은?","분기점에서 멀어지는 방향으로 불연속 합성"],"E1-60#2":["선도/지연가닥의 합성 방향이 분기점 기준 어떻게 다른가 — 「지연」? (↔ 선도)","반대 방향(절편별)"],"E1-61":["지연가닥이 '지연'이라 불리는 이유는?","분기점이 열린 뒤에야 절편을 끊어 합성하므로 늦게 진행되기 때문"],"E1-62":["지연가닥에서 만들어지는 짧은 DNA 조각은?","오카자키 절편(Okazaki fragment)"],"E1-64#2":["선도가닥과 지연가닥의 프라이머 수 차이 — 「지연」? (↔ 선도)","절편마다 여러 개"],"E1-65#2":["선도가닥과 지연가닥의 중간 산물 차이 — 「지연」? (↔ 선도)","오카자키 절편"],"E1-60":["선도/지연가닥의 합성 방향이 분기점 기준 어떻게 다른가?","선도=분기점과 같은 방향 · 지연=반대 방향(절편별)"],"C1-87":["DNA 복제 시 지연가닥에서 만들어지는 짧은 조각은?","오카자키 절편"],"E1-74":["DNA 연결효소(ligase)의 기능은?","오카자키 절편 사이 당-인산 골격(nick)을 연결한다"],"E1-75":["수선·오카자키 절편 연결에서 nick에 작용하는 효소는?","DNA 연결효소(ligase)"],"E1-63#3":["오카자키 절편이 하나의 가닥이 되는 마무리 과정은?","ligase 연결"],"C1-88":["오카자키 절편들을 연결해주는 효소는?","DNA 리게이스"]},"hubPanel":"s11p01"};

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? (recapAt >= 0 ? recapAt : i) : (quizOrder[quizPos] ?? -1);
    s += `<defs><mask id="m"><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="#fff"/>`;
    for (let k = 0; k <= upto; k++) if (stops[k].box) s += rect(stops[k].box, 'hole');
    if (mode === 'quiz' && cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'hole');
    s += `</mask></defs><rect x="0" y="0" width="${L.w}" height="${L.h}" fill="rgba(20,20,30,.62)" mask="url(#m)"/>`;
    if (cur >= 0 && stops[cur].box) s += rect(stops[cur].box, 'cur');
    if (mode === 'tour' && (i < 0 || !stops[i].box)) s = '';  // 시작 전 · 틀(상자 없는 정거장): 그림 전체
  } else if (mode === 'review') {
    // 겹친 곳을 누르면 작은 단서를 고른다. 넓이가 같으면 먼저 소개한 정거장이 위에 온다.
    const hotspots = [];
    stops.forEach((stop, k) => {
      if (!stop.box) return;
      const boxes = Array.isArray(stop.box[0]) ? stop.box : [stop.box];
      for (const box of boxes) hotspots.push({ box, k, area: box[2] * box[3] });
    });
    hotspots.sort((a, b) => b.area - a.area || b.k - a.k);
    for (const { box, k } of hotspots) s += rect(box, 'hot', ` data-k="${k}"`);
  }
  ov.innerHTML = s;
  ov.querySelectorAll('.hot').forEach(r => r.onclick = () => showCap(+r.dataset.k, true));
  $('step').textContent = mode === 'tour' ? (i < 0 ? `0 / ${stops.length}` : `${i + 1} / ${stops.length}`) + repTail() : mode === 'quiz' ? `${quizPos + 1} / ${quizOrder.length}` : '';
}

  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });
    localStorage.setItem(key, JSON.stringify(box.slice(-400)));
  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  save(); showScore(); quizNext();
}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));
  if (seen) parts.push(`정거장별 최근 ${ok} / ${n}`);
  $('score').textContent = parts.join(' · ');
}
$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(startAt()); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };
$('jOk').onclick = () => judge(true); $('jNo').onclick = () => judge(false); $('jShow').onclick = quizReveal;
const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour'); repPaint();
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(startAt()); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
</script>
