<script>
const L = {"id":"L43g","scene":"s43","part":"g","title":"담장 밖 두루마리 마당의 문어 소동 — 조절 다섯 층 · UTR · mRNA 분해와 수명 · 번역 개시 억제 · 번역 후 조절 · ncRNA · miRNA · 완전 / 불완전 일치 · siRNA · RNAi · 전사 후 조절","sub":"L43f 의 담 구멍으로 나온 두루마리를 담 밖 풀밭에서 읽는데 마당이 아수라장이다 · 망토 침입자가 묶은 두 겹 두루마리를 깍둑썰기 기계에 먹이고, 쏟아진 짧은 종이 토막을 흰 껍데기 문어들이 쥐고 두루마리를 덮친다 · 판다는 두루마리 머리에 털썩 앉고, 은빛 좀벌레는 꼬리부터 좀먹는다 · 끝에선 구슬 사슬의 고리를 잘라 빛나게 하고, 입술 자국 공은 분쇄 통으로","img":"img/L43g.webp?v=00ffcb651399","w":2048,"h":1144,"stops":[{"sid":"s1","obj":"담 구멍 너머 안쪽(짚끈 뭉치 · 인쇄 기계 · 종이를 손질하는 작업대) → 담 구멍에서 막 걸어 나와 두루마리를 안고 가는 일꾼 → 담 밖 풀밭(두루마리를 읽는 일꾼 곁에 길게 늘어진 구슬 사슬 → 오른쪽에서 가위로 사슬 고리 자르기 · 분쇄 통)","fact":"진핵 발현 조절 다섯 층: 염색질 → 전사 → RNA 가공 → 번역 → 단백질 가공 · 분해","hook":"짚끈 뭉치 = 염색질(L37b) · 인쇄 기계 = 전사 · 손질 작업대 = RNA 가공(L43b) · 담 밖 읽기 = 번역 · 가위로 고리 자르기 · 분쇄 통 = 단백질 가공 · 분해 — 구멍 안에서 밖으로 차례대로","say":"L43f의 담 구멍을 나온 두루마리들이 바깥 풀밭에서 읽히는 마당이다. 담 안에는 짚끈 뭉치·인쇄 기계·종이를 손질하는 작업대가 있고, 바깥에서는 종이를 읽어 구슬을 꿰고 있다. 오른쪽에서는 완성된 사슬의 고리를 가위로 자르거나 분쇄 통에 넣는다. 진핵세포의 유전자 발현은 이 경로의 어느 단계에서나 조절된다. 순서대로 L37b의 짚끈 뭉치는 염색질 구조, 인쇄 기계는 전사, L43b의 작업대는 RNA 가공, 구슬 꿰기는 번역, 가위와 분쇄 통은 단백질 가공·분해다. 조절의 다섯 층 중 이번 그림은 담 밖, 즉 전사 후의 과정에 집중한다.","cards":["F1-93"],"box":[[150,20,460,560]]},{"sid":"s2","obj":"맨 왼쪽 일꾼의 두루마리 — 손에 든 앞머리의 네모 없는 흰 여백 → 빛깔 네모 줄 → 풀밭 위로 길게 늘어진 꼬리 쪽 흰 여백","fact":"UTR(비번역부위) — 번역 개시 · mRNA 안정성 조절 · 3′ UTR 이 세포질 수명 좌우","hook":"네모 없는 흰 여백 = 번역되지 않는 부위(UTR) · 머리 여백 = 5′ UTR · 꼬리 여백 = 3′ UTR · 꼬리 여백의 길이가 얼마나 오래 버틸지를 정함","say":"맨 왼쪽 일꾼의 두루마리를 보자. 손에 든 앞머리와 풀밭에 늘어진 꼬리에는 색깔 네모가 없는 흰 여백이 있다. 읽혀도 아미노산 구슬로 번역되지 않는 비번역부위 UTR이다. 앞쪽은 5′ UTR, 뒤쪽은 3′ UTR이다. 여백은 남는 종이가 아니라 조절 자리다. UTR에 조절 단백질이나 작은 RNA가 붙어 번역 개시를 막거나 mRNA의 수명을 바꿀 수 있다. 특히 세포질에서의 mRNA 수명에는 3′ UTR이 중요하다. 이 두루마리의 유난히 긴 꼬리 여백과 연결하자.","cards":["F1-83","F1-86"],"box":[[140,790,580,330]]},{"sid":"s3","obj":"은빛 좀벌레 떼 — 맨 왼쪽 두루마리는 긴 꼬리 여백 끝만 갉혀 네모가 다 성하고 일꾼 무릎엔 긴 구슬 사슬 / 우는 일꾼의 두루마리는 꼬리가 네모 칸까지 갉아 먹혀 손에 짧은 구슬 사슬","fact":"mRNA 분해가 단백질 합성량을 조절 · 수명이 짧아지면 단백질 양이 줄어든다","hook":"좀벌레가 꼬리부터 좀먹음 = mRNA 분해 · 여백이 길어 오래 버틴 종이 = 긴 수명 → 긴 사슬(단백질 많음) · 네모까지 먹힌 종이 = 짧은 수명 → 짧은 사슬","say":"은빛 좀벌레들이 두루마리를 꼬리부터 갉는다. 세포질의 mRNA도 영원히 남아 있지 않고 분해된다. 왼쪽 두루마리는 꼬리 여백이 길어 벌레가 아직 끝부분에 있고, 색깔 네모는 온전하다. 그 일꾼의 무릎에는 긴 구슬 사슬이 쌓였다. 반면 옆의 우는 일꾼은 네모 칸까지 먹힌 두루마리와 짧은 사슬만 들고 있다. mRNA가 오래 유지되면 반복해서 번역해 많은 단백질을 만들고, 수명이 짧으면 생산량이 줄어든다. mRNA 분해가 단백질 합성량을 조절하는 중요한 방법인 이유다.","cards":["F1-87","F1-165"],"box":[[280,540,200,260],[30,700,690,420]]},{"sid":"s4","obj":"두루마리 한쪽 끝, 빛깔 네모가 시작되기 전의 흰 여백(머리 쪽)에 털썩 앉아 팔짱 끼고 대나무를 문 커다란 판다 · 네모가 찍힌 쪽을 두 손으로 잡아당기며 이를 악문 일꾼 · 곁에 손대지 않은 구슬 바구니","fact":"번역 조절은 주로 개시 단계 · UTR 결합 단백질이 리보솜 결합 방해 · 가장 이른 단계라 효율적","hook":"네모 앞 흰 여백(머리)에 앉은 판다 = 5′ UTR 에 붙은 조절 단백질 · 시작을 못 하는 일꾼 = 리보솜이 못 앉음(개시 억제) · 그대로인 구슬 바구니 = 처음부터 막아 재료를 아낌","say":"다른 두루마리의 앞쪽 흰 여백에는 큰 판다가 팔짱을 끼고 대나무를 씹으며 앉아 있다. 일꾼이 네모 칸 쪽을 당겨도 움직이지 않고 구슬 바구니도 그대로다. 읽기 시작을 막는 번역 개시 억제다. 번역 조절은 주로 이 단계에서 일어난다. UTR의 조절 단백질이 리보솜의 mRNA 결합을 막아, 합성 초기에 재료와 에너지의 낭비를 줄인다. 전사를 마쳤어도 단백질이 만들어지지 않을 수 있는 단계로, L43b의 RNA 가공과 이 번역 개시를 함께 기억하자.","cards":["F1-84","F1-85","F1-164","F1-95"],"box":[[500,560,480,400]]},{"sid":"s5","obj":"오른쪽 — 구슬 사슬에서 작은 구슬 고리 하나를 큰 가위로 잘라 내자(잘린 고리가 떨어짐) 반짝 빛나며 공중에 둥실 떠오른 나머지 사슬 / 입술 자국 찍힌 구슬 공을 통 분쇄기 깔때기에 넣는 일꾼 · 통에서 쏟아지는 낱 구슬","fact":"번역 후 조절 — 펩타이드를 잘라 내 활성화(프로인슐린 · 펩시노겐) · 단백질 분해","hook":"고리를 잘라 내야 빛나며 떠오름 = 일부 펩타이드를 제거해야 활성(프로인슐린 → 인슐린 · 펩시노겐 → 펩신) · 입술 자국 공 → 분쇄 통 = 유비퀴틴 → 프로테아좀 분해(L48e)","say":"오른쪽에서는 한 일꾼이 완성된 구슬 사슬의 작은 구슬 고리 하나를 큰 가위로 자르자 나머지가 빛나며 떠오른다. 번역 이후에도 가공에 의해 활성이 조절된다는 뜻이다. 프로인슐린은 가운데 펩타이드를 잘라야 인슐린이 되고, 펩시노겐도 일부가 잘려야 펩신이 된다. 옆에서는 입술 자국이 있는 구슬 공을 통 분쇄기에 넣자 통 끝으로 낱 구슬이 쏟아진다. L48e의 유비퀴틴과 프로테아좀이다. 입술 자국은 분해 대상 단백질에 붙이는 유비퀴틴 표지이고, 프로테아좀인 분쇄기는 그 표지가 달린 단백질만 분해한다. 이미 만든 단백질의 양과 수명을 빠르게 바꾸는 조절이다.","cards":["F1-88","F1-89","F1-90","F1-91","F1-166"],"box":[[1540,380,508,340],[1640,620,408,460]]},{"sid":"s6","obj":"오른쪽 뒤 담 밑 — 뚜껑 열린 쓰레기통 속을 뒤지다 쓸 만한 종이 쪽지들을 꺼내 들고 반가워하는 일꾼","fact":"ncRNA — 번역 안 돼도 기능 · 비번역 영역이 조절 ncRNA 를 만들어 junk DNA 개념 수정","hook":"쓰레기통 = 쓸모없다던 junk DNA · 거기서 나온 쓸 만한 종이 쪽지 = 단백질로 번역되지 않고도 일하는 RNA(ncRNA) · 반가운 얼굴 = 매우 중요할 수 있다","say":"오른쪽 뒤 담 아래에서는 일꾼이 열린 쓰레기통에서 쓸 만한 종이 쪽지를 꺼내 반가워한다. 단백질로 번역되지 않아도 기능을 하는 RNA가 비번역 RNA, ncRNA이다. 과거에는 단백질을 지정하지 않는 DNA를 쓸모없는 junk DNA로 보았다. 그러나 그 영역의 상당 부분이 조절에 필요한 ncRNA를 만든다는 사실이 밝혀져 생각이 달라졌다. 번역되지 않는다고 기능이 없는 것은 아니다. 마당의 짧은 종이 조각인 miRNA와 siRNA가 대표적인 예다.","cards":["F1-100","F1-101","F1-114"],"box":[[1720,60,320,410]]},{"sid":"s7","obj":"가운데 탁자의 깍둑썰기 기계 — 오른쪽 공장 일꾼이 반으로 접은 긴 흰 종이(제 것 · 접힌 U 자 고리가 손 아래로 늘어짐)를 윗구멍에 먹이고 · 앞으로 쏟아지는 짧은 종이 토막 · 토막을 하나씩 치켜든 흰 껍데기 주황 문어 셋(기계 뒤 · 아래 가운데 · 아래 오른쪽)","fact":"miRNA — 약 22 nt · 긴 RNA 전구체를 효소가 가공 · 단백질과 복합체를 이뤄 작용","hook":"반으로 접은 긴 종이 = 제 세포가 만든 접힌 전구체 · 깍둑썰기 기계 = 다이서(L13b) · 짧은 토막 = 약 22 뉴클레오타이드 · 토막을 쥔 문어 = miRNA-단백질 복합체(아르고너트 · L13b)","say":"가운데 탁자의 깍둑썰기 기계는 L13b에서 본 다이서다. 오른쪽 공장 일꾼이 반으로 접은 긴 흰 종이를 기계의 윗구멍에 넣고 있으며, 손 아래로 U 자 고리가 늘어진다. 세포가 만든 RNA 전구체가 스스로 접혀 두 겹을 이룬 모습이다. 다이서는 이를 약 22개 뉴클레오타이드 길이의 miRNA로 자른다. 짧은 조각만으로는 작용하지 못한다. 흰 소용돌이 껍데기를 진 주황 문어, 아르고너트 단백질이 조각을 쥐어야 한다. miRNA는 단백질과 miRNA-단백질 복합체를 이루어 작용하며, 조각의 색깔 네모가 길잡이가 되어 표적 두루마리를 찾는다.","cards":["F1-103","F1-104","F1-105","F1-109"],"box":[[980,420,520,440],[1110,220,300,270],[980,770,330,350],[1300,800,300,344]]},{"sid":"s8","obj":"아래 가운데 — 짧은 토막을 치켜든 문어가 다른 다리들로 빛깔 네모가 줄지은 종이를 둘로 찢는다(찢긴 왼쪽 조각의 네모가 치켜든 토막과 같은 차례로 칸칸이 맞음)","fact":"miRNA 는 씨앗 자리 상보로 결합(기본서 7 염기 이상) · 완전 일치 → 표적 mRNA 분해","hook":"칸칸이 꼭 맞는 네모 = 완전한 상보 결합(기본서 7 염기 이상) · 둘로 찢긴 두루마리 = mRNA 분해","say":"아래 가운데의 문어는 짧은 조각을 치켜들고 다른 다리들로 색깔 네모 종이를 둘로 찢는다. 표적의 네모가 길잡이 조각과 칸마다 맞는 모습이다. miRNA가 표적 mRNA에 결합하려면 대개 7개 염기가 상보적으로 짝지어야 한다. 표적과 완전히, 또는 매우 높은 정도로 일치하면 복합체가 그 mRNA를 절단해 분해한다.","cards":["F1-106","F1-107","F1-155"],"box":[[980,770,330,350]]},{"sid":"s9","obj":"아래 오른쪽 — 다른 문어가 토막을 치켜든 채 일꾼이 든 두루마리를 다리로 휘감아 덮었다(찢지 않음) · 치켜든 토막과 두루마리 위 네모 줄은 앞 두 칸만 같은 빛깔 · 읽지 못해 얼굴을 찌푸린 일꾼","fact":"miRNA 가 표적과 불완전하게 일치하면 → 번역 억제(완전 일치가 아니어도 작동)","hook":"앞 두 칸만 맞는 토막 = 불완전 상보 · 찢지 않고 휘감아 덮음 = 자르지 않고 번역 억제 · 찌푸린 일꾼 = 리보솜이 못 읽음","say":"아래 오른쪽 문어는 일꾼이 든 두루마리를 다리로 휘감아 덮지만 찢지는 않는다. 들어 올린 조각과 두루마리의 네모가 앞 두 칸에서만 맞다. miRNA와 표적이 불완전하게 일치하면 mRNA를 바로 자르지 못하고 결합한 상태에서 번역을 억제한다는 장면이다. 일꾼도 가려진 종이를 읽지 못해 얼굴을 찌푸린다. 완전히 일치해야만 miRNA가 작동하는 것은 아니라는 점을 기억하자. 불완전한 일치로 번역을 막을 수 있어 miRNA 하나가 여러 mRNA를 조절할 수 있다.","cards":["F1-108","F1-117","F1-154"],"box":[[1290,790,330,354]]},{"sid":"s10","obj":"망토 두른 침입자가 끈으로 묶은 두루마리 두 개(두 겹)를 깍둑썰기 기계 윗구멍에 밀어 넣으며 눈이 휘둥그레 · 기계 바로 뒤에서 토막을 치켜든 문어가 다른 다리로 토막과 같은 빛깔 네모가 찍힌 흰 종이를 찢어 종잇조각이 흩날린다","fact":"siRNA — 긴 이중가닥 RNA 유래 · RNAi(표적 분해) · 바이러스 방어 · 제 유전자도 억제","hook":"망토 = 바이러스(L13a) · 끈으로 묶은 두 두루마리 = 바깥에서 온 긴 이중가닥 RNA(한 장을 접은 일꾼 종이와 달리 두 가닥) · 같은 기계에서 나온 토막 = siRNA · 토막을 쥐고 종이를 찢는 문어 = RNA 간섭(RNAi) · 바이러스 방어","say":"망토를 쓴 침입자가 끈으로 묶인 두루마리 두 개를 다이서에 넣는다. L13a의 망토는 바이러스다. 일꾼의 접힌 종이와 달리 별개의 두 가닥을 묶은 긴 이중가닥 RNA이다. 다이서가 이것을 잘라 만드는 짧은 조각이 siRNA이다. miRNA는 주로 세포 자체의 접힌 전구체, siRNA는 이런 긴 이중가닥 RNA에서 유래한다. 기계 바로 뒤의 문어가 조각을 치켜들고 다른 다리로 표적 종이를 찢자 침입자의 눈이 휘둥그레진다. siRNA가 표적 RNA를 분해하거나 억제하는 현상이 RNA 간섭(RNAi)이다. 외부 RNA를 없애므로 바이러스 방어로 진화했을 것으로 본다. 같은 경로를 이용해 세포 자신의 유전자 발현을 억제하기도 한다.","cards":["F1-110","F1-111","F1-116","F1-112"],"box":[[850,290,300,400],[1110,210,400,290]]},{"sid":"s11","obj":"문어들은 모두 담 밖에서 종이(두루마리)만 덮친다 — 담 구멍 너머 안쪽의 짚끈 뭉치와 인쇄 기계엔 아무도 손대지 않는다","fact":"miRNA · siRNA 의 공통점 = mRNA 발현 억제 · 전사 후 단계의 조절","hook":"담 밖의 종이만 덮침 = 이미 전사된 mRNA 에만 작용(전사 후 조절) · 찢거나 덮거나 = 분해 또는 번역 억제","say":"찢는 문어와 덮는 문어의 공통점을 보자. 모두 담 밖에서 종이에 작용하며, 담 안의 짚끈이나 인쇄 기계에는 손대지 않는다. miRNA와 siRNA는 이미 전사된 mRNA에 결합해 발현을 억제한다는 뜻이다. 분해하든 번역을 막든 이 그림에서 다루는 것은 전사 조절이 아니라 전사 후 조절이다. mRNA의 수명과 번역을 바꾸므로 유전자 발현을 조절하는 중요한 수단이다.","cards":["F1-102","F1-113","F1-115"],"box":[[150,20,460,420],[960,230,600,914]]}],"cq":{"F1-93":["진핵 유전자 발현 조절 단계를 큰 순서로 쓰면?","염색질 구조 · 전사 · RNA 가공 · 번역 · 단백질 가공·분해"],"F1-83":["비번역부위 UTR의 역할 한 가지는?","번역 개시나 mRNA 안정성 조절"],"F1-86":["mRNA의 세포질 내 수명을 좌우하는 데 중요한 부위는?","3' UTR"],"F1-87":["mRNA 분해가 중요한 이유는?","단백질 합성량을 조절하기 때문"],"F1-165":["mRNA 수명이 짧아지면 단백질 양은 일반적으로 어떻게 되는가?","감소한다"],"F1-84":["번역 조절은 주로 어느 단계에서 일어나는가?","번역 개시 단계"],"F1-85":["mRNA 번역 개시를 막을 수 있는 대표 방법은?","UTR에 결합하는 조절 단백질이 리보솜 결합을 방해하는 것"],"F1-164":["번역 개시 조절이 효율적인 이유는?","단백질 합성의 가장 초기에 자원 낭비를 막을 수 있기 때문"],"F1-95":["진핵생물에서 전사가 일어나도 단백질이 안 만들어질 수 있는 단계 두 곳은?","RNA 가공 단계와 번역 개시 단계"],"F1-88":["번역 후 조절의 예 두 가지는?","특정 펩타이드 제거에 의한 활성화와 단백질 분해"],"F1-89":["프로인슐린과 펩시노겐이 보여주는 것은?","번역 후 가공이 단백질 활성에 중요하다는 점"],"F1-90":["유비퀴틴의 역할은?","분해할 단백질에 표지를 붙인다"],"F1-91":["프로테아좀의 역할은?","유비퀴틴 표지된 단백질을 분해한다"],"F1-166":["유비퀴틴-프로테아좀 경로가 중요한 이유는?","이미 합성된 단백질의 양과 수명을 신속히 조절할 수 있기 때문"],"F1-100":["비번역 RNA(ncRNA)란?","단백질로 번역되지 않으면서 기능을 하는 RNA"],"F1-101":["예전의 junk DNA 개념이 수정된 이유는?","일부 비번역 영역이 조절성 ncRNA를 만든다는 사실이 밝혀졌기 때문"],"F1-114":["ncRNA가 중요한 생물학적 메시지는?","단백질로 번역되지 않아도 기능적으로 매우 중요할 수 있다는 것"],"F1-103":["miRNA의 길이는 대략 얼마인가?","약 22개 뉴클레오타이드"],"F1-104":["miRNA는 어떻게 만들어지는가?","긴 RNA 전구체가 효소에 의해 가공되어 형성된다"],"F1-105":["miRNA는 단독으로 작용하는가?","아니오, 단백질과 복합체를 이룬다"],"F1-109":["miRNA가 단백질과 이루는 복합체를 일반적으로 무엇이라 부르는가?","miRNA-단백질 복합체"],"F1-106":["miRNA가 표적 mRNA에 결합하려면 최소 몇 개의 상보적 염기쌍이 필요한가?","최소 7개(기본서) — 보통 씨앗 자리(2~8번째 염기)의 상보성이 중요 · 덜 맞아도 붙는 예외 있음"],"F1-107":["miRNA와 표적 mRNA가 완전히 일치하면 어떤 일이 일어나는가?","mRNA 분해"],"F1-155":["miRNA가 mRNA 분해를 일으키는 상황은?","표적 mRNA와 완전 또는 매우 높은 상보 결합할 때"],"F1-108":["miRNA와 표적 mRNA가 불완전히 일치하면 어떤 일이 일어나는가?","번역 억제(바로 자르지는 않지만 결국 분해되기도 한다)"],"F1-117":["miRNA는 표적 mRNA에 완전 일치해야만 작동하는가?","아니오, 불완전 일치로도 번역 억제가 가능하다"],"F1-154":["miRNA가 번역 억제를 일으키는 상황은?","표적 mRNA와 불완전 상보 결합할 때"],"F1-110":["siRNA의 작용이 특히 RNAi라 불리는 이유는?","표적 RNA를 직접 분해하거나 억제하는 간섭 현상과 연결되기 때문"],"F1-111":["siRNA가 진화적으로 바이러스 방어와 관련 있다고 보는 이유는?","외래 RNA를 분해하는 기작으로 작동할 수 있기 때문"],"F1-116":["siRNA가 자가세포 유전자 발현도 억제할 수 있다는 말의 의미는?","바이러스 방어 외에도 정상 유전자 조절에 관여할 수 있다는 뜻"],"F1-112":["miRNA와 siRNA의 차이 한 가지는?","miRNA는 주로 세포 자체 전구체에서 · siRNA는 긴 이중가닥 RNA 등에서 유래한다"],"F1-102":["miRNA와 siRNA의 공통점은?","mRNA 발현을 억제한다"],"F1-113":["miRNA가 유전자 발현 조절에서 중요한 이유는?","전사 후 단계에서 mRNA의 수명과 번역을 조절하기 때문"],"F1-115":["miRNA는 전사 단계를 조절하는 RNA인가, 전사 후 단계를 조절하는 RNA인가?","주로 전사 후 조절 RNA — mRNA에 붙어 분해하거나 번역을 억제"]},"hubPanel":null};
const $ = id => document.getElementById(id);
$('title').textContent = L.title; document.title = L.title;
// 요약 줄(sub)에는 물건 = 답이 다 적혀 있다 — 복습 · 시험에서는 접어 두고, 누르면 편다(GPT 추가 감사 2026-11-11 §7)
let subOpen = false;
function subShow() { const hide = (mode === 'review' || mode === 'quiz') && !subOpen && !!L.sub; $('sub').textContent = hide ? '요약 줄은 접어 두었다(답이 적혀 있다) — 누르면 편다' : (L.sub || ''); $('sub').classList.toggle('hid', hide); }
$('sub').onclick = () => { if (mode === 'review' || mode === 'quiz') { subOpen = !subOpen; subShow(); } };
$('img').src = L.img; $('img').alt = L.title;
if (L.home) $('home').href = L.home;  // 한 파일(standalone)은 저장소 밖에서 열리므로 배포 주소로
if (L.hub) $('hub').href = L.hub; else if (L.hubPanel) $('hub').href = '../sketchy.html#' + L.hubPanel;
const ov = $('ov'); ov.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
let tourEnded = false;
let mode = 'tour', i = -1, playing = false, voice = true, rate = 1.0, quizOrder = [], quizPos = 0, quizRevealed = false, shuffle = false, sess = null;
const stops = L.stops;
subShow();
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sidOf = k => stops[k].sid || ('s' + (k + 1));             // 정거장의 바뀌지 않는 ID
const quizItems = () => stops.map((_, k) => k).filter(k => stops[k].box);  // 시험 문항 = 상자가 있는 정거장
// 기록 v2 — 정거장 번호가 아니라 정거장 ID(sid)에 붙는다(정거장을 넣고 빼도 기록이 다른 사실로 옮겨 가지 않는다).
//   {v:2, items:{sid:[{t,ok,s}]}, sessions:[{id,t0,t1,n,ok,done}]}
//   옛 기록({번호:[{t,ok}]})은 처음 한 번 번호 k → 's'+(k+1) 로 옮기고, 원본은 lesson_<ID>__v1 에 그대로 남긴다.
const scoreKey = 'lesson_' + L.id;
let store = { v: 2, items: {}, sessions: [] };
try {
  const raw = JSON.parse(localStorage.getItem(scoreKey) || 'null');
  if (raw && raw.v === 2) store = raw;
  else if (raw && typeof raw === 'object') {
    localStorage.setItem(scoreKey + '__v1', JSON.stringify(raw));
    for (const k of Object.keys(raw)) { if (!/^\d+$/.test(k) || !Array.isArray(raw[k])) continue; store.items['s' + (+k + 1)] = raw[k].map(r => ({ t: r.t, ok: !!r.ok, s: 0 })); }
    localStorage.setItem(scoreKey, JSON.stringify(store));
  }
} catch (e) {}
store.items = store.items || {}; store.sessions = store.sessions || [];
const save = () => { try { localStorage.setItem(scoreKey, JSON.stringify(store)); } catch (e) {} };
try { shuffle = localStorage.getItem('lesson_shuffle') === '1'; } catch (e) {}

function rect(b, cls, extra) { const bs = Array.isArray(b[0]) ? b : [b]; return bs.map(([x, y, w, h]) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"${extra || ''}/>`).join(''); }  // 상자 하나 [x,y,w,h] 또는 여럿 [[…],[…]]
function draw() {
  let s = '';
  if (mode === 'tour' || mode === 'quiz') {
    const upto = mode === 'tour' ? i : -1;
    const cur = mode === 'tour' ? i : (quizOrder[quizPos] ?? -1);

const ttsNorm = t => TTSNorm.ttsNorm(t, TTS_LEX, TTS_ORDER, L.id);
let speakSeq = 0;
const narration = new LessonNarration(L.id);
function stopSpeech() { speakSeq++; narration.stop(); }
function speak(t, sid) {
  const my = ++speakSeq, at = i;
  const advance = () => setTimeout(() => { if (my === speakSeq && playing && mode === 'tour' && i === at) next(); }, 700);
  narration.play({sid, text:t, spokenText:ttsNorm(t), rate, auto:playing && mode === 'tour',
    onend:advance,
    onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label; },
    onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
  });
}
function go(k) {
  stopSpeech();
  tourEnded = k >= stops.length;
  if (k < 0) { i = -1; draw(); $('cap').className = 'cap muted'; $('cap').textContent = '▶ 시작을 누르면 물건을 하나씩 밝히며 말해 준다.'; return; }
  if (k >= stops.length) { i = stops.length - 1; playing = false; $('bPlay').textContent = '▶ 다시'; recap(); return; }
  i = k; draw(); showCap(i, false);
  if (!voice && playing) { const seq = speakSeq; setTimeout(() => { if (playing && seq === speakSeq && mode === 'tour' && i === k) next(); }, 3500); }
}
function next() { if (mode !== 'tour') return quizNext(); go(i + 1); }
function prev() { if (mode !== 'tour') return quizPrev(); go(Math.max(-1, i - 1)); }
function recap() {
  stopSpeech();
  $('recap').style.display = 'block';
  $('recap').innerHTML = `<b>되짚기 — ${L.title}</b><ol>` + stops.map(st => `<li><b>${st.obj}</b> — ${st.fact}</li>`).join('') + '</ol>';
  $('recap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (voice) speakRecap();
}
// Keep each stable SID so recap reuses the same reviewed recording as the tour.
function speakRecap() {
  const my = ++speakSeq;
  tourEnded = true; playing = true; $('bPlay').textContent = '❚❚ 멈춤';
  function read(k) {
    if (my !== speakSeq || !voice || mode !== 'tour') return;
    if (k >= stops.length) { playing = false; $('bPlay').textContent = '▶ 다시'; return; }
    const st = stops[k], text = st.say || (st.obj + '. ' + st.fact);
    narration.play({sid:st.sid, text, spokenText:ttsNorm(text), rate, auto:true,
      onend:() => setTimeout(() => read(k + 1), 700),
      onstatus:label => { if (my === speakSeq) $('audioStatus').textContent = label + ' · 되짚기 ' + (k + 1) + '/' + stops.length; },
      onblocked:() => { if (my !== speakSeq) return; playing = false; $('bPlay').textContent = '▶ 시작'; $('audioStatus').textContent = '시작을 눌러 음성을 재생한다'; }
    });
  }
  read(0);
}
function setMode(m) {
  mode = m; playing = false; stopSpeech(); $('bPlay').textContent = '▶ 시작'; subOpen = false; subShow();
  ['bTour', 'bRecap', 'bReview', 'bQuiz'].forEach(id => $(id).classList.remove('on'));
  $('recap').style.display = 'none'; $('judge').style.display = 'none';
  if (m === 'tour') { $('bTour').classList.add('on'); go(-1); }
  if (m === 'review') { $('bReview').classList.add('on'); draw(); $('cap').className = 'cap muted'; $('cap').textContent = '그림만 보고 떠올린 뒤, 물건을 눌러 답을 확인한다.'; }
  if (m === 'quiz') {
    $('bQuiz').classList.add('on'); quizOrder = quizItems();
    if (shuffle) for (let a = quizOrder.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [quizOrder[a], quizOrder[b]] = [quizOrder[b], quizOrder[a]]; }

}
function quizAsk() {
  stopSpeech();
  quizRevealed = false; draw();

  $('judge').style.display = 'flex'; $('jOk').style.display = $('jNo').style.display = 'none'; $('jShow').style.display = '';  // 답을 보기 전에는 채점 단추가 없다
}
function cqHTML(st) {
  const ids = (st.cards || []).filter(c => L.cq && L.cq[c]); if (!ids.length) return '';
  return `<details class="cq"${ids.length <= 3 ? ' open' : ''}><summary>딸린 기출 ${ids.length}장 — 이것까지 답할 수 있어야 맞음</summary><ul>` + ids.map(c => `<li>${esc(L.cq[c][0])} → <span class="a">${esc(L.cq[c][1])}</span></li>`).join('') + '</ul></details>';
}
function quizReveal() { quizRevealed = true; showCap(quizOrder[quizPos], true); $('cap').insertAdjacentHTML('beforeend', cqHTML(stops[quizOrder[quizPos]])); $('jOk').style.display = $('jNo').style.display = ''; $('jShow').style.display = 'none'; }
// 틀린 정거장의 카드를 SRS 「오답 편지함」에 적는다. SRS 기록(bio_srs_v1)은 SRS 만 고친다 — 여기서 직접 쓰면 열린 SRS 탭이 덮어쓴다.
// SRS 는 열릴 때 편지함을 읽어, 이미 배운 카드만 벌점 없이 복습일을 오늘로 당긴다. 같은 시험에서 맞음으로 고치면 편지를 거둔다.
function srsInbox(k, ok) {
  const cards = [...new Set(stops[k].cards || [])]; if (!cards.length) return;
  try {
    const key = 'lesson_srs_inbox', id = sess.id + ':' + sidOf(k);
    let box = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(box)) box = [];
    box = box.filter(m => m && m.id !== id);
    if (!ok) box.push({ id, t: Date.now(), lesson: L.id, sid: sidOf(k), cards });

  } catch (e) {}
}
function judge(ok) {
  if (!quizRevealed || !sess) return;
  const k = quizOrder[quizPos], sid = sidOf(k);
  srsInbox(k, ok);
  (store.items[sid] = store.items[sid] || []).push({ t: Date.now(), ok, s: sess.id });
  if (!(sid in sess.ans)) sess.done++; else if (sess.ans[sid]) sess.ok--;   // 되돌아가 다시 채점하면 그 문항만 바뀐다
  sess.ans[sid] = ok; if (ok) sess.ok++;
  const rec = { id: sess.id, t0: sess.t0, t1: Date.now(), n: sess.n, ok: sess.ok, done: sess.done };
  const at = store.sessions.findIndex(x => x.id === sess.id); if (at >= 0) store.sessions[at] = rec; else store.sessions.push(rec);
  if (store.sessions.length > 30) store.sessions = store.sessions.slice(-30);

}
function quizNext() { if (quizPos + 1 >= quizOrder.length) { $('cap').className = 'cap muted'; $('cap').textContent = '끝. 점수는 위에.'; $('judge').style.display = 'none'; ov.innerHTML = ''; return; } quizPos++; quizAsk(); }
function quizPrev() { if (quizPos > 0) { quizPos--; quizAsk(); } }
function showScore() {
  // 분모는 실제 문항 수(상자 있는 정거장). 「이번 시험」(세션 하나)과 「정거장별 최근」(여러 날에 걸친 가장 최근 답)을 따로 보인다.
  const items = quizItems(), n = items.length;
  const last = items.map(k => { const a = store.items[sidOf(k)]; return a && a.length ? a[a.length - 1].ok : null; });
  const seen = last.filter(x => x !== null).length, ok = last.filter(x => x === true).length;
  const prevS = store.sessions.length ? store.sessions[store.sessions.length - 1] : null;
  const one = (lab, x) => `${lab} ${x.ok} / ${x.n}` + (x.done < x.n ? ` (푼 것 ${x.done})` : '');
  const parts = [];
  if (mode === 'quiz' && sess) parts.push(one('이번 시험', sess)); else if (prevS) parts.push(one('지난 시험', prevS));

$('bTour').onclick = () => setMode('tour'); $('bReview').onclick = () => setMode('review'); $('bQuiz').onclick = () => setMode('quiz');
$('bRecap').onclick = () => { setMode('tour'); i = stops.length - 1; draw(); recap(); };
$('bPlay').onclick = () => { if (mode !== 'tour') setMode('tour'); playing = !playing; $('bPlay').textContent = playing ? '❚❚ 멈춤' : '▶ 계속'; if (playing) go(i < 0 || tourEnded ? 0 : i); else stopSpeech(); };
$('bNext').onclick = next; $('bPrev').onclick = prev;
$('bVoice').onclick = () => { voice = !voice; $('bVoice').classList.toggle('on', voice); if (!voice) stopSpeech(); };
$('bRate').onclick = () => { rate = rate >= 1.5 ? 0.8 : +(rate + 0.2).toFixed(1); $('bRate').textContent = '속도 ' + rate.toFixed(1); narration.setRate(rate); };

const shufLabel = () => { $('bShuf').textContent = shuffle ? '섞어서' : '순서대로'; $('bShuf').classList.toggle('on', shuffle); };
$('bShuf').onclick = () => { shuffle = !shuffle; try { localStorage.setItem('lesson_shuffle', shuffle ? '1' : '0'); } catch (e) {} shufLabel(); if (mode === 'quiz') setMode('quiz'); };
shufLabel();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
setMode('tour');
let autoStart = true;
try { autoStart = localStorage.getItem('lesson_auto_start') !== '0'; } catch (_) {}
function autoLabel() { $('bAuto').textContent = '자동 시작 ' + (autoStart ? '켜짐' : '꺼짐'); $('bAuto').classList.toggle('on', autoStart); $('bAuto').setAttribute('aria-pressed', String(autoStart)); }
$('bAuto').onclick = () => { autoStart = !autoStart; try { localStorage.setItem('lesson_auto_start', autoStart ? '1' : '0'); } catch (_) {} autoLabel(); };
autoLabel();
function beginAutomatically() { if (!autoStart || mode !== 'tour' || i !== -1) return; playing = true; $('bPlay').textContent = '❚❚ 멈춤'; go(0); }
if ($('img').complete && $('img').naturalWidth) beginAutomatically();
else $('img').addEventListener('load', beginAutomatically, {once:true});
window.addEventListener('pagehide', stopSpeech);
